* { box-sizing: border-box; }

<script id="data" type="application/json">{"topics":[{"file":"tema-1-olympic-games.md","title":"The Olympic Games","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu.","s":1,"v":null,"vocab":[{"head":"\u003cstrong>host city\u003c/strong>","gloss":"hostitelské město","example":"Paris was selected as the host city for the 2024 Summer Olympics."},{"head":"\u003cstrong>compete in / for\u003c/strong> (compete /kəmˈpiːt/) (verb)","gloss":"soutěžit v / o","example":"Athletes from across the globe compete in various track and field disciplines for gold medals."},{"head":"\u003cstrong>qualify for\u003c/strong> (qualify /ˈkwɒlɪfaɪ/ AmE /ˈkwɑːlɪfaɪ/) (verb)","gloss":"kvalifikovat se na","example":"She trained twice a day to qualify for the Olympic rowing final."},{"head":"\u003cstrong>opening ceremony\u003c/strong> (opening /ˈəʊpənɪŋ/)","gloss":"zahajovací ceremoniál","example":"Millions of viewers watched the spectacular opening ceremony on television."},{"head":"\u003cstrong>torch relay\u003c/strong> (torch /tɔːtʃ/ AmE /tɔːrtʃ/)","gloss":"štafeta s olympijskou pochodní","example":"The torch relay travelled through dozens of towns before reaching the main stadium."},{"head":"\u003cstrong>motto\u003c/strong> /ˈmɒtəʊ/ AmE /ˈmɑːtoʊ/","gloss":"heslo, motto","example":"The official Olympic motto is \"Citius, Altius, Fortius – Communiter\", which translates from Latin as \"Faster, Higher, Stronger – Together\"."},{"head":"\u003cstrong>fair play\u003c/strong> /ˌfeə ˈpleɪ/ AmE /ˌfer ˈpleɪ/ [U]","gloss":"čestná hra, sportovní chování","example":"Even in tense moments, competitors should maintain the spirit of fair play."},{"head":"\u003cstrong>performance-enhancing drugs\u003c/strong> [plural]","gloss":"zakázané látky zvyšující výkonnost, dopingové látky","example":"Anti-doping agencies regularly test athletes for performance-enhancing drugs."},{"head":"\u003cstrong>podium\u003c/strong> /ˈpəʊdiəm/ AmE /ˈpoʊdiəm/","gloss":"stupně vítězů","example":"Standing on the podium with an Olympic medal around your neck is a dream for many."},{"head":"\u003cstrong>world record\u003c/strong>","gloss":"světový rekord","example":"The swimmer managed to break the world record in the hundred-metre butterfly."},{"head":"\u003cstrong>spectator\u003c/strong> /spekˈteɪtə/ AmE /ˈspekteɪtər/","gloss":"divák (přítomný na sportovišti)","example":"Thousands of excited spectators filled the arena to cheer for the home team."},{"head":"\u003cstrong>venue\u003c/strong> /ˈvenjuː/","gloss":"dějiště, místo konání","example":"The modern aquatic centre served as the primary venue for all swimming events."},{"head":"\u003cstrong>medal count\u003c/strong> (medal /ˈmedl/)","gloss":"celkový počet medailí, medailová bilance","example":"Sports journalists closely follow the overall medal count of each country throughout the games."},{"head":"\u003cstrong>Paralympic Games\u003c/strong> [plural]","gloss":"paralympijské hry","example":"The Paralympic Games take place shortly after the Olympic Games in the same facilities."},{"head":"\u003cstrong>sportsmanship\u003c/strong> /ˈspɔːtsmənʃɪp/ AmE /ˈspɔːrtsmənʃɪp/ [U]","gloss":"sportovní duch, smysl pro čestný boj","example":"Helping an injured rival cross the finish line demonstrated outstanding sportsmanship."},{"head":"\u003cstrong>underdog\u003c/strong> /ˈʌndədɒɡ/ AmE /ˈʌndərdɔːɡ/","gloss":"outsider, méně favorizovaný účastník","example":"Czech fans always love to cheer for an underdog who surprises the favourites."},{"head":"\u003cstrong>take place\u003c/strong> (verb)","gloss":"konat se","example":"The Winter Olympics take place every four years in mountainous regions."},{"head":"\u003cstrong>represent\u003c/strong> /ˌreprɪˈzent/ (verb)","gloss":"reprezentovat","example":"It is an immense honour for athletes to represent the Czech Republic at the Olympic Games."},{"head":"\u003cstrong>commercialisation\u003c/strong> [U]","gloss":"komercializace","example":"Some critics point out that excessive commercialisation distracts from athletic achievements."},{"head":"\u003cstrong>revive\u003c/strong> /rɪˈvaɪv/ (verb)","gloss":"oživit, obnovit","example":"Pierre de Coubertin helped revive the ancient Olympic tradition, leading to the first modern Games in Athens in 1896."},{"head":"\u003cstrong>athlete\u003c/strong> /ˈæθliːt/","gloss":"sportovec, atlet","example":"Every Olympic athlete must follow strict training and nutritional plans."},{"head":"\u003cstrong>disqualify sb from\u003c/strong> (disqualify /dɪsˈkwɒlɪfaɪ/ AmE /dɪsˈkwɑːlɪfaɪ/) (verb)","gloss":"diskvalifikovat někoho z","example":"Referees decided to disqualify the sprinter from the final because of a false start."},{"head":"\u003cstrong>achievement\u003c/strong> /əˈtʃiːvmənt/","gloss":"úspěch, mimořádný počin","example":"Winning an Olympic medal is widely regarded as the pinnacle of sporting achievement."},{"head":"\u003cstrong>anthem\u003c/strong> /ˈænθəm/","gloss":"hymna","example":"Hearing the national anthem played in the arena brought tears to the champion's eyes."}],"answer":["When we think about global sports, nothing matches the scale of the Olympic Games. Every four years, the world stops to watch top athletes \u003cstrong>compete in\u003c/strong> dozens of sports and push the boundaries of human endurance. As a secondary school student here in the Czech Republic, I have grown up hearing inspiring stories about our Olympic legends, from Emil Zátopek's historic triple gold in Helsinki, including his legendary marathon victory, to modern champions like Lukáš Krpálek and Ester Ledecká.","For me, the most fascinating aspect is how the games unite nations. The \u003cstrong>opening ceremony\u003c/strong> always reminds us of international cooperation, and the \u003cstrong>torch relay\u003c/strong> carries the Olympic flame lit in ancient Olympia as a symbol of peace. When an \u003cstrong>athlete\u003c/strong> steps onto the \u003cstrong>podium\u003c/strong> and the national \u003cstrong>anthem\u003c/strong> plays, it makes our small country feel proud on the international stage. Czechs especially love backing the \u003cstrong>underdog\u003c/strong>, which makes the Olympic Games such an emotional experience in living rooms and public squares.","However, the modern games also face serious challenges. Many critics discuss the rising costs for each \u003cstrong>host city\u003c/strong>, as well as the heavy \u003cstrong>commercialisation\u003c/strong> that sometimes overshadows genuine \u003cstrong>sportsmanship\u003c/strong>. Furthermore, the temptation to use \u003cstrong>performance-enhancing drugs\u003c/strong> remains a persistent problem that anti-doping agencies must constantly fight.","In my view, despite these commercial pressures, the fundamental ideal that helped \u003cstrong>revive\u003c/strong> the Olympic Games still matters. It shows young people like my classmates that dedicated training, discipline, and \u003cstrong>fair play\u003c/strong> can lead to remarkable \u003cstrong>achievement\u003c/strong>. The Olympics celebrate perseverance, human spirit, and mutual respect among different cultures."],"answer_info":"B2, ~245 slov","questions":[{"cat":"Srovnání","text":"What are the main differences between the ancient Olympic Games in Greece and the modern Olympic Games today?"},{"cat":"Zkušenost","text":"Which Olympic moment or Czech athlete's victory made the greatest impression on you when you watched it, and why?"},{"cat":"Názor","text":"Why do you think so many cities are now reluctant to host the Olympic Games?"},{"cat":"Srovnání","text":"How do the Winter Olympic Games compare with the Summer Olympic Games in terms of popularity and public interest in the Czech Republic?"},{"cat":"Popis","text":"What role does the Paralympic movement play alongside the Olympic Games in promoting inclusivity in sports?"},{"cat":"Hypotéza","text":"If a host city chose to eliminate all commercial sponsors from the games, what would be the most significant consequences for the event and the competitors?"},{"cat":"Názor / etika","text":"How should international sports organisations address the issue of athletes who fail doping tests, and to what extent do you consider lifetime bans justified?"}],"phrases":[{"head":"\u003cstrong>From my perspective,...\u003c/strong>","gloss":"Z mého pohledu...","note":"uvedení vlastního názoru"},{"head":"\u003cstrong>One of the most striking differences is...\u003c/strong>","gloss":"Jeden z nejvýraznějších rozdílů je...","note":"srovnání"},{"head":"\u003cstrong>A prime example of this is...\u003c/strong>","gloss":"Typickým / ukázkovým příkladem je...","note":"uvedení příkladu"},{"head":"\u003cstrong>When you take into account...\u003c/strong>","gloss":"Když vezmeme v úvahu...","note":"zvážení okolností / argument"},{"head":"\u003cstrong>On the one hand..., on the other hand...\u003c/strong>","gloss":"Na jedné straně..., na druhé straně...","note":"kontrast dvou pohledů"},{"head":"\u003cstrong>To put it in a nutshell,...\u003c/strong>","gloss":"Abych to shrnul v kostce,...","note":"závěr / shrnutí"},{"head":"\u003cstrong>All things considered, I firmly believe that...\u003c/strong>","gloss":"Když vše uvážím, pevně věřím, že...","note":"závěrečné vyhodnocení"}],"unverified":0},{"file":"tema-2-my-sport.md","title":"My sport","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu. Jazykové opravy: Claude, 25. 11. 2026 (#1158), čekají na kontrolu a schválení učitelem. Věcné opravy: Claude, 26. 11. 2026 (#1173), čekají na kontrolu a schválení učitelem.","s":2,"v":null,"vocab":[{"head":"\u003cstrong>equipment\u003c/strong> /ɪˈkwɪpmənt/ [U]","gloss":"vybavení, výstroj","example":"High-quality safety equipment is essential for preventing severe injuries."},{"head":"\u003cstrong>work out\u003c/strong> /ˌwɜːk ˈaʊt/ AmE /ˌwɜːrk ˈaʊt/ (verb)","gloss":"cvičit, posilovat","example":"I try to work out at least three times a week to stay in shape."},{"head":"\u003cstrong>stamina\u003c/strong> /ˈstæmɪnə/ [U]","gloss":"fyzická výdrž, kondice","example":"Long-distance running helps build both mental and physical stamina."},{"head":"\u003cstrong>warm up\u003c/strong> /ˌwɔːm ˈʌp/ AmE /ˌwɔːrm ˈʌp/ (verb)","gloss":"rozcvičit se, rozehřát se","example":"It is crucial to warm up thoroughly before any demanding exercise."},{"head":"\u003cstrong>injury\u003c/strong> /ˈɪndʒəri/","gloss":"zranění","example":"A sudden muscle injury forced him to take a two-month break from competition."},{"head":"\u003cstrong>coach\u003c/strong> /kəʊtʃ/ AmE /koʊtʃ/","gloss":"trenér","example":"Our basketball coach always motivates us when we are losing a match."},{"head":"\u003cstrong>referee\u003c/strong> /ˌrefəˈriː/","gloss":"rozhodčí (ve fotbale, basketbalu apod.)","example":"The referee made an unpopular decision and awarded a penalty kick."},{"head":"\u003cstrong>tournament\u003c/strong> /ˈtʊənəmənt/ AmE /ˈtʊrnəmənt/","gloss":"turnaj","example":"Our school volleyball team took part in a regional tournament last weekend."},{"head":"\u003cstrong>opponent\u003c/strong> /əˈpəʊnənt/ AmE /əˈpoʊnənt/","gloss":"soupeř, protivník","example":"You must respect your opponent, even if you are confident of victory."},{"head":"\u003cstrong>teammate\u003c/strong> /ˈtiːmmeɪt/","gloss":"spoluhráč","example":"Good communication among teammates is one of the keys to winning team matches."},{"head":"\u003cstrong>pitch\u003c/strong> /pɪtʃ/","gloss":"hřiště (fotbalové, ragbyové)","example":"Heavy rain turned the grass pitch into a muddy swamp."},{"head":"\u003cstrong>court\u003c/strong> /kɔːt/ AmE /kɔːrt/","gloss":"kurt, hřiště (tenisové, basketbalové, florbalové)","example":"The players spent two hours practising their serves on the clay court."},{"head":"\u003cstrong>push oneself to the limit\u003c/strong> (phrase)","gloss":"sáhnout si na dno, jít na doraz","example":"In the final metres of a race, runners have to push themselves to the limit."},{"head":"\u003cstrong>discipline\u003c/strong> /ˈdɪsəplɪn/ [U]","gloss":"sebekázeň, disciplína","example":"Balancing regular training sessions with schoolwork requires great discipline."},{"head":"\u003cstrong>draw\u003c/strong> /drɔː/","gloss":"remíza","example":"Neither team managed to score in the second half, so the match ended in a draw."},{"head":"\u003cstrong>defeat\u003c/strong> /dɪˈfiːt/ (noun / verb: defeat sb)","gloss":"porážka / porazit někoho","example":"Our local team suffered an unexpected defeat last weekend."},{"head":"\u003cstrong>give up\u003c/strong> (verb)","gloss":"vzdát se","example":"Even when falling behind by ten points, we refused to give up."},{"head":"\u003cstrong>recover from\u003c/strong> (recover /rɪˈkʌvə/ AmE /rɪˈkʌvər/) (verb)","gloss":"zotavit se z","example":"It took her several weeks to recover from a twisted ankle."},{"head":"\u003cstrong>keep fit\u003c/strong> /ˌkiːp ˈfɪt/ (phrase)","gloss":"udržovat se v kondici","example":"Cycling to school every morning is a great way to keep fit."},{"head":"\u003cstrong>protective gear\u003c/strong> (protective /prəˈtektɪv/; gear /ɡɪə(r)/ AmE /ɡɪr/) [U]","gloss":"ochranná výstroj / pomůcky","example":"Ice hockey players should never step onto the ice without full protective gear."},{"head":"\u003cstrong>coordination\u003c/strong> /kəʊˌɔːdɪˈneɪʃn/ AmE /kəʊˌɔːrdɪˈneɪʃn/ [U]","gloss":"koordinace","example":"Table tennis demands rapid reflexes and precise hand-eye coordination."},{"head":"\u003cstrong>participate in\u003c/strong> (participate /pɑːˈtɪsɪpeɪt/ AmE /pɑːrˈtɪsɪpeɪt/) (verb)","gloss":"účastnit se čeho","example":"Over fifty secondary school students decided to participate in the local triathlon."},{"head":"\u003cstrong>cheer sb on\u003c/strong> (cheer /tʃɪə(r)/ AmE /tʃɪr/) (verb)","gloss":"povzbuzovat / fandit někomu","example":"Parents and classmates gathered along the track to cheer the runners on."},{"head":"\u003cstrong>setback\u003c/strong> /ˈsetbæk/","gloss":"překážka, nepříjemná komplikace, dílčí nezdar","example":"He viewed the temporary injury not as a disaster, but as a setback to learn from."}],"answer":["Sport plays a central role in my everyday life. While I enjoy various outdoor activities, my true passion is floorball. I train three times a week with our local youth team and regularly \u003cstrong>participate in\u003c/strong> weekend matches.","For me, playing floorball is the best way to \u003cstrong>keep fit\u003c/strong> and relieve stress after demanding days of study at secondary school. When I arrive at the sports hall, put on my shoes and start to \u003cstrong>warm up\u003c/strong>, all worries about tests and grades simply disappear. The game requires rapid reflexes, good hand-eye \u003cstrong>coordination\u003c/strong>, and solid \u003cstrong>stamina\u003c/strong>, especially during fast counter-attacks. Because it is a dynamic indoor game, you also need reliable \u003cstrong>equipment\u003c/strong>, such as a lightweight stick and comfortable shoes that provide grip on the indoor \u003cstrong>court\u003c/strong>.","Beyond physical health, sport has taught me vital life lessons. Being part of a team means you cannot think only about yourself; you have to trust each \u003cstrong>teammate\u003c/strong> and listen closely to your \u003cstrong>coach\u003c/strong>. We celebrate exciting victories together, but we also learn how to handle a bitter \u003cstrong>defeat\u003c/strong> or a frustrating \u003cstrong>draw\u003c/strong>. A few months ago, I suffered a minor ankle \u003cstrong>injury\u003c/strong>, and having to patiently \u003cstrong>recover from\u003c/strong> it tested my patience and determination. It showed me that training involves unexpected \u003cstrong>setbacks\u003c/strong>, but you must never \u003cstrong>give up\u003c/strong>.","In conclusion, my sport provides me with more than just physical exercise. It teaches personal \u003cstrong>discipline\u003c/strong>, builds lasting friendships, and motivates me to \u003cstrong>work out\u003c/strong> and challenge my limits every single week."],"answer_info":"B2, ~264 slov","questions":[{"cat":"Popis","text":"What specific equipment and facilities are necessary to practise your favourite sport safely and effectively?"},{"cat":"Zkušenost","text":"What was the most memorable match or training session in your sporting life, and what important lesson did it teach you?"},{"cat":"Názor","text":"How difficult is it for Czech secondary school students to balance competitive sports training with academic responsibilities?"},{"cat":"Srovnání","text":"What are the main psychological differences between competing in an individual sport and playing in a team sport?"},{"cat":"Srovnání","text":"How has your attitude towards physical fitness and exercise changed since you entered secondary school?"},{"cat":"Hypotéza","text":"If a serious injury prevented you from playing sports for an entire year, what alternative activities would you pursue to maintain your well-being?"},{"cat":"Názor","text":"In what ways can parents and coaches best help young athletes cope constructively with defeat?"}],"phrases":[{"head":"\u003cstrong>As far as my own experience is concerned,...\u003c/strong>","gloss":"Co se týče mých vlastních zkušeností,...","note":"osobní zkušenost"},{"head":"\u003cstrong>What I find most rewarding about it is...\u003c/strong>","gloss":"Co na tom považuji za nejpřínosnější / nejvíce naplňující, je...","note":"vyjádření hodnoty / pocitu"},{"head":"\u003cstrong>In contrast to individual sports, team sports...\u003c/strong>","gloss":"Na rozdíl od individuálních sportů týmové sporty...","note":"srovnání"},{"head":"\u003cstrong>For instance, whenever we face...\u003c/strong>","gloss":"Například kdykoliv čelíme...","note":"uvedení konkrétního příkladu"},{"head":"\u003cstrong>On top of that,...\u003c/strong>","gloss":"Kromě toho... / Navíc...","note":"přidání dalšího argumentu"},{"head":"\u003cstrong>Looking back on that situation, I...\u003c/strong>","gloss":"Když se na tu situaci podívám zpětně, ...","note":"reflexe minulosti"},{"head":"\u003cstrong>To sum up my thoughts,...\u003c/strong>","gloss":"Abych to shrnul / shrnula,...","note":"závěr"}],"unverified":0},{"file":"tema-3-sports-and-games.md","title":"Sports and games","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu.","s":3,"v":null,"vocab":[{"head":"\u003cstrong>athletics\u003c/strong> /æθˈletɪks/ [U]","gloss":"lehká atletika","example":"Athletics includes running, jumping, and throwing disciplines."},{"head":"\u003cstrong>extreme sports\u003c/strong> [plural]","gloss":"extrémní sporty","example":"Rock climbing and white-water kayaking are thrilling forms of extreme sports."},{"head":"\u003cstrong>indoor sports\u003c/strong> [plural]","gloss":"halové / vnitřní sporty","example":"Gymnastics and table tennis are popular indoor sports during winter months."},{"head":"\u003cstrong>spectator sport\u003c/strong> /spekˈteɪtə spɔːt/ AmE /spekˈteɪtər spɔːrt/","gloss":"divácký sport","example":"Ice hockey is widely considered one of the most popular spectator sports in the Czech Republic."},{"head":"\u003cstrong>board games\u003c/strong> [plural]","gloss":"deskové hry","example":"On cold winter evenings, our family often plays strategic board games together."},{"head":"\u003cstrong>rules\u003c/strong> /ruːlz/ [plural]","gloss":"pravidla (hry, sportu)","example":"Before starting a new match, every player must understand the basic rules of the game."},{"head":"\u003cstrong>foul\u003c/strong> /faʊl/","gloss":"faul, nedovolený zákrok","example":"The defender committed an intentional foul to stop the opponent's counter-attack."},{"head":"\u003cstrong>leisure activity\u003c/strong>","gloss":"volnočasová aktivita","example":"Walking the dog or riding a bicycle through the park is an enjoyable leisure activity."},{"head":"\u003cstrong>sedentary lifestyle\u003c/strong> (sedentary /ˈsedntri/ AmE /ˈsednteri/)","gloss":"sedavý způsob života","example":"A sedentary lifestyle increases the risk of back pain and poor physical fitness."},{"head":"\u003cstrong>rivalry\u003c/strong> /ˈraɪvlri/","gloss":"rivalita, soupeření","example":"The traditional rivalry between local football clubs attracts passionate crowds."},{"head":"\u003cstrong>champion\u003c/strong> /ˈtʃæmpiən/","gloss":"šampion, mistr","example":"The Czech tennis player was crowned Wimbledon champion after an intense final."},{"head":"\u003cstrong>take up a sport\u003c/strong> (phrase)","gloss":"začít se věnovat sportu","example":"Doctors often advise teenagers to take up a sport to combat stress."},{"head":"\u003cstrong>competitive\u003c/strong> /kəmˈpetətɪv/","gloss":"soutěživý, soutěžní","example":"School football matches can become very competitive when neighbouring towns play each other."},{"head":"\u003cstrong>amateur\u003c/strong> /ˈæmətə/ AmE /ˈæmətʃər/","gloss":"amatérský / amatér","example":"Unlike professionals, an amateur athlete competes mainly for the love of the game and personal enjoyment."},{"head":"\u003cstrong>fitness tracker\u003c/strong> /ˈfɪtnəs trækə(r)/ AmE /ˈfɪtnəs trækər/","gloss":"chytrý náramek / fitness náramek","example":"Many young people use a fitness tracker to monitor their daily step count and heart rate."},{"head":"\u003cstrong>cheating\u003c/strong> /ˈtʃiːtɪŋ/ [U]","gloss":"podvádění","example":"Any form of cheating ruins the integrity of sport and destroys trust."},{"head":"\u003cstrong>boost\u003c/strong> /buːst/ (verb)","gloss":"posílit, povzbudit","example":"Regular physical exercise helps boost both your immune system and your mood."},{"head":"\u003cstrong>outdoor pursuits\u003c/strong> [plural]","gloss":"venkovní aktivity / koníčky v přírodě","example":"Hiking and cross-country skiing are wonderful outdoor pursuits in the Šumava mountains."},{"head":"\u003cstrong>fan base\u003c/strong> /ˈfæn beɪs/","gloss":"fanouškovská základna","example":"The national hockey team has a remarkably devoted fan base across the country."},{"head":"\u003cstrong>handicap\u003c/strong> /ˈhændikæp/","gloss":"hendikep (vyrovnávací bodové zvýhodnění ve sportu, např. v golfu)","example":"In golf, a player's handicap allows golfers of different ability levels to compete fairly against one another."},{"head":"\u003cstrong>cooperation\u003c/strong> /kəʊˌɒpəˈreɪʃn/ AmE /koʊˌɑːpəˈreɪʃn/ [U]","gloss":"spolupráce","example":"Success in team games relies heavily on mutual communication and cooperation."},{"head":"\u003cstrong>esports\u003c/strong> [plural or U]","gloss":"elektronické sporty, esport","example":"Debates continue over whether competitive video gaming, known as esports, should be classified as real sport."},{"head":"\u003cstrong>physical education (PE)\u003c/strong> (physical education /ˌfɪzɪkl edʒuˈkeɪʃn/) [U]","gloss":"tělesná výchova","example":"At our school, physical education classes take place twice a week."},{"head":"\u003cstrong>adrenaline rush\u003c/strong> (adrenaline /əˈdrenəlɪn/; rush /rʌʃ/)","gloss":"nával adrenalinu","example":"Activities like bungee jumping give participants a powerful adrenaline rush."}],"answer":["Sports and games have played an important role in human society for centuries. From ancient competitions to modern stadium matches, they provide entertainment, keep us healthy, and bring people together. In the Czech Republic, sports culture is exceptionally strong; almost every weekend, thousands of families either head out into nature or gather around television screens to support their favourite teams.","When examining this broad topic, we can distinguish between several categories. First, there are active physical disciplines, ranging from traditional track-and-field \u003cstrong>athletics\u003c/strong> and team sports like football or ice hockey to thrilling \u003cstrong>extreme sports\u003c/strong> that deliver a strong \u003cstrong>adrenaline rush\u003c/strong>. For those who prefer calmer recreation, \u003cstrong>outdoor pursuits\u003c/strong> such as hiking or cross-country skiing in the Šumava mountains offer a wonderful break from daily routine. In school, \u003cstrong>physical education (PE)\u003c/strong> helps us combat the \u003cstrong>sedentary lifestyle\u003c/strong> that so many teenagers struggle with today. Sitting in classrooms all day can drain our energy, whereas running or playing volleyball helps \u003cstrong>boost\u003c/strong> our mood and concentration.","At the same time, the idea of what counts as a sport is constantly changing. In recent years, \u003cstrong>esports\u003c/strong> has grown into a huge global phenomenon with a passionate \u003cstrong>fan base\u003c/strong>, sparking lively discussions about whether gaming belongs alongside traditional physical activities. Meanwhile, classic intellectual games like chess test deep tactical patience, while modern \u003cstrong>board games\u003c/strong> often encourage strategic thinking and social \u003cstrong>cooperation\u003c/strong> without physical strain.","Ultimately, whether you are an ambitious \u003cstrong>amateur\u003c/strong> striving to win, or someone who simply enjoys a relaxing \u003cstrong>leisure activity\u003c/strong> with friends, games and sports teach us essential values. They remind us that following the \u003cstrong>rules\u003c/strong> and avoiding any form of \u003cstrong>cheating\u003c/strong> are necessary principles not only in sport, but in everyday life as well."],"answer_info":"B2, ~285 slov","questions":[{"cat":"Popis","text":"What are the most characteristic differences between physical sports and mental or tabletop games?"},{"cat":"Zkušenost","text":"How has school physical education influenced your personal relationship with sports and regular exercise?"},{"cat":"Názor","text":"Why do you think extreme sports have become increasingly popular among young adults despite the high risk of injury?"},{"cat":"Srovnání","text":"How do sports fans in the Czech Republic differ when supporting ice hockey compared to football?"},{"cat":"Srovnání","text":"In what ways does exercising outdoors in nature benefit human well-being compared to working out in an indoor gym?"},{"cat":"Hypotéza","text":"If competitive esports were officially introduced into the Olympic Games programme, how would the public and traditional sports federations react?"},{"cat":"Názor / návrh","text":"What measures should schools implement to motivate teenagers who tend to avoid physical activity?"}],"phrases":[{"head":"\u003cstrong>Broadly speaking, we can classify...\u003c/strong>","gloss":"Obecně řečeno můžeme klasifikovat...","note":"kategorizace / úvod"},{"head":"\u003cstrong>In contrast to..., which focus on...\u003c/strong>","gloss":"Na rozdíl od..., které se soustředí na...","note":"srovnání"},{"head":"\u003cstrong>A clear illustration of this phenomenon is...\u003c/strong>","gloss":"Jasnou ilustrací tohoto jevu je...","note":"příklad"},{"head":"\u003cstrong>It is often believed that..., but the reality is...\u003c/strong>","gloss":"Často se věří, že..., ale realita je taková, že...","note":"vyvrácení mýtu / kontrast"},{"head":"\u003cstrong>From a psychological standpoint,...\u003c/strong>","gloss":"Z psychologického hlediska...","note":"úhel pohledu"},{"head":"\u003cstrong>This brings me to the point that...\u003c/strong>","gloss":"To mě přivádí k myšlence, že...","note":"přechod mezi myšlenkami"},{"head":"\u003cstrong>To draw a general conclusion,...\u003c/strong>","gloss":"Kdybych měl / měla vyvodit obecný závěr,...","note":"závěr"}],"unverified":0},{"file":"tema-s10-arts-and-entertainment.md","title":"Arts and entertainment, likes and hobbies","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu. Jazykové opravy: Claude, 25. 11. 2026 (#1158), čekají na kontrolu a schválení učitelem. Věcné opravy: Claude, 26. 11. 2026 (#1173), čekají na kontrolu a schválení učitelem.","s":10,"v":10,"vocab":[{"head":"\u003cstrong>exhibition\u003c/strong> /ˌeksɪˈbɪʃn/ [C]","gloss":"výstava","example":"The Aleš South Bohemian Gallery regularly hosts inspiring exhibitions of visual art."},{"head":"\u003cstrong>live performance\u003c/strong> [C]","gloss":"živé vystoupení","example":"For me, nothing compares to the raw energy of watching a rock band give a live performance on stage."},{"head":"\u003cstrong>audience\u003c/strong> /ˈɔːdiəns/ [C, collective]","gloss":"publikum, diváci","example":"The enthusiastic audience gave the actors a standing ovation at the end of the musical."},{"head":"\u003cstrong>creative outlet\u003c/strong> (outlet /ˈaʊtlet/) [C]","gloss":"tvůrčí ventil, způsob kreativního vyjádření","example":"Painting watercolours in the evening provides a wonderful creative outlet after a stressful day."},{"head":"\u003cstrong>catchy tune\u003c/strong> (catchy /ˈkætʃi/; tune /tjuːn/ AmE /tuːn/) [C]","gloss":"chytlavá melodie","example":"The pop song has such a catchy tune that I cannot stop humming it."},{"head":"\u003cstrong>streaming service\u003c/strong> /ˈstriːmɪŋ sɜːvɪs/ AmE /ˈstriːmɪŋ sɜːrvɪs/ [C]","gloss":"streamovací služba","example":"Subscribing to a digital streaming service gives subscribers instant access to thousands of movies and songs."},{"head":"\u003cstrong>stage\u003c/strong> /steɪdʒ/ [C]","gloss":"jeviště, scéna, koncertní pódium","example":"When the lead guitarist stepped onto the stage, the crowd erupted in cheers."},{"head":"\u003cstrong>visual arts\u003c/strong> (visual /ˈvɪʒuəl/) [plural / the visual arts]","gloss":"výtvarné umění","example":"Students interested in the visual arts often visit historic galleries and sculptors' studios."},{"head":"\u003cstrong>passion for\u003c/strong> (passion /ˈpæʃn/) [C/U]","gloss":"vášeň pro, nadšení pro","example":"Ever since childhood, he has had a deep passion for playing the acoustic guitar."},{"head":"\u003cstrong>take up a hobby\u003c/strong> (phrase)","gloss":"začít se věnovat koníčku","example":"During the autumn term, I decided to take up a new hobby and registered for photography classes."},{"head":"\u003cstrong>unwind\u003c/strong> /ˌʌnˈwaɪnd/ (verb)","gloss":"odreagovat se, uvolnit se","example":"Listening to quiet acoustic music is a good way to unwind after you finish your homework."},{"head":"\u003cstrong>gig\u003c/strong> /ɡɪɡ/ [C, informal]","gloss":"koncert, živé hudební vystoupení","example":"Local bands often play small gigs in pub cellars on Friday nights."},{"head":"\u003cstrong>leisure time\u003c/strong> [U]","gloss":"volný čas","example":"Between demanding classes and exam preparation, finding quality leisure time is a genuine challenge."},{"head":"\u003cstrong>binge-watch\u003c/strong> (binge /bɪndʒ/) (verb)","gloss":"zhlédnout více dílů na jeden zátah","example":"It is tempting to binge-watch an entire season of a drama series over a single weekend."},{"head":"\u003cstrong>performer\u003c/strong> /pəˈfɔːmə/ AmE /pərˈfɔːrmər/ [C]","gloss":"účinkující, interpret, umělec","example":"A talented street performer gathered a fascinated circle of onlookers in the square."},{"head":"\u003cstrong>applause\u003c/strong> /əˈplɔːz/ [U]","gloss":"potlesk","example":"The pianist bowed deeply as thunderous applause echoed across the concert hall."},{"head":"\u003cstrong>stand-up comedy\u003c/strong> [U]","gloss":"stand-up komedie","example":"Going to a stand-up comedy club is a great way to enjoy sharp humour with friends."},{"head":"\u003cstrong>recreation\u003c/strong> /ˌrekriˈeɪʃn/ [U]","gloss":"odpočinková činnost, volnočasové aktivity (POZOR: neznamená rekreační pobyt!)","example":"Outdoor recreation, such as hill walking or canoeing, can refresh both body and mind."},{"head":"\u003cstrong>enthusiast\u003c/strong> /ɪnˈθjuːziæst/ AmE /ɪnˈθuːziæst/ [C]","gloss":"nadšenec","example":"As a dedicated cinema enthusiast, she rarely misses an independent film screening."},{"head":"\u003cstrong>lyrics\u003c/strong> /ˈlɪrɪks/ [plural]","gloss":"text písně (v angličtině množné číslo: \u003cem>the lyrics are\u003c/em>)","example":"I pay close attention to song lyrics because thoughtful poetry makes music far more meaningful."},{"head":"\u003cstrong>art gallery\u003c/strong> /ˈɑːt ɡæləri/ AmE /ˈɑːrt ɡæləri/ [C]","gloss":"umělecká galerie","example":"Admission to the national art gallery is often discounted for secondary students."},{"head":"\u003cstrong>soundtrack\u003c/strong> /ˈsaʊndtræk/ [C]","gloss":"filmový soundtrack, hudební doprovod","example":"The dramatic orchestral soundtrack elevated the emotional impact of the movie."}],"answer":["Outside of school and daily homework, the arts and hobbies are vital because they allow us to \u003cstrong>unwind\u003c/strong> and recharge our mental energy. For me, creative activities are not just a pleasant distraction: because I have a real \u003cstrong>passion for\u003c/strong> them, they serve as a healthy \u003cstrong>creative outlet\u003c/strong>. Whether through music, visual arts, or sports, our personal hobbies can show who we are outside the classroom.","Music plays the biggest role in my daily routine. Like many teenagers, I use a digital \u003cstrong>streaming service\u003c/strong> to listen to playlists while studying or travelling on the bus. However, for me, recorded tracks cannot match the excitement of a \u003cstrong>live performance\u003c/strong>. Attending a local \u003cstrong>gig\u003c/strong> or a summer music festival is an unforgettable experience: you see the musicians step onto the \u003cstrong>stage\u003c/strong> and share the vibrant atmosphere with an energetic \u003cstrong>audience\u003c/strong>. I also appreciate good \u003cstrong>lyrics\u003c/strong> and melodies that stay in your head for days.","Beyond music, cinema and digital entertainment take up a lot of our \u003cstrong>leisure time\u003c/strong>. While it is very easy to \u003cstrong>binge-watch\u003c/strong> an entire series on a Friday night, I still love visiting the cinema for the big-screen experience and immersive \u003cstrong>soundtrack\u003c/strong>. On weekends, I try to balance screen time with active pursuits. Recently, I decided to \u003cstrong>take up a hobby\u003c/strong>: analogue photography. Taking my camera on trips around South Bohemia encourages me to slow down, look at details, and visit the occasional photography \u003cstrong>exhibition\u003c/strong> in an \u003cstrong>art gallery\u003c/strong>. Ultimately, engaging with the arts and having fun with meaningful hobbies can help us maintain a balanced lifestyle."],"answer_info":"B2, ~250 slov","questions":[{"cat":"Popis","text":"How do you typically like to spend your free time when you want to relax after a challenging school week?"},{"cat":"Srovnání","text":"In what ways does experiencing a live theatrical or musical performance differ from watching a stream at home?"},{"cat":"Zkušenost","text":"What was the most memorable cultural event, concert, or exhibition you have ever attended?"},{"cat":"Názor","text":"Why do some critics argue that binge-watching TV shows is replacing more active or creative hobbies among teenagers?"},{"cat":"Hypotéza","text":"If you had unlimited resources and free time for one year, what brand-new skill or art form would you pursue?"},{"cat":"Srovnání","text":"How do traditional forms of entertainment, like going to the theatre or art galleries, compete with digital gaming and social media for young audiences?"},{"cat":"Názor","text":"Why do you think governments should or should not support classical arts and museums with public funds?"}],"phrases":[{"head":"\u003cstrong>Whenever I feel the need to switch off,...\u003c/strong>","gloss":"Kdykoli cítím potřebu vypnout,...","note":"uvolnění a relaxace"},{"head":"\u003cstrong>Music is an integral part of my daily life because...\u003c/strong>","gloss":"Hudba je nedílnou součástí mého života, protože...","note":"vyjádření významu"},{"head":"\u003cstrong>There is an undeniable magic about...\u003c/strong>","gloss":"Nepopiratelné kouzlo má...","note":"vyzdvižení atmosféry"},{"head":"\u003cstrong>From my personal standpoint,...\u003c/strong>","gloss":"Z mého osobního hlediska...","note":"vyjádření postoje"},{"head":"\u003cstrong>It allows me to broaden my horizons by...\u003c/strong>","gloss":"Umožňuje mi to rozšířit si obzory tím, že...","note":"rozvoj osobnosti"},{"head":"\u003cstrong>On the other side of the coin,...\u003c/strong>","gloss":"Na druhé straně mince,...","note":"uvedení opačného aspektu"},{"head":"\u003cstrong>To sum up my thoughts, hobbies are essential because...\u003c/strong>","gloss":"Abych shrnul své myšlenky, koníčky jsou nezbytné, protože...","note":"závěr"}],"unverified":0},{"file":"tema-s11-future-career-and-jobs.md","title":"Future career and jobs","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu. Jazykové opravy: Claude, 25. 11. 2026 (#1158), čekají na kontrolu a schválení učitelem. Věcné opravy: Claude, 26. 11. 2026 (#1173), čekají na kontrolu a schválení učitelem.","s":11,"v":11,"vocab":[{"head":"\u003cstrong>job interview\u003c/strong> [C]","gloss":"pracovní pohovor","example":"Dressing appropriately and arriving on time create a positive first impression at a job interview."},{"head":"\u003cstrong>curriculum vitae (CV)\u003c/strong> (curriculum vitae /kəˌrɪkjələm ˈviːtaɪ/) [C]","gloss":"životopis","example":"A well-structured CV should clearly list your education, practical experience, and language skills."},{"head":"\u003cstrong>internship\u003c/strong> /ˈɪntɜːnʃɪp/ AmE /ˈɪntɜːrnʃɪp/ [C]","gloss":"pracovní stáž, studentská praxe","example":"Completing a summer internship at an IT firm gave her valuable hands-on experience."},{"head":"\u003cstrong>career prospects\u003c/strong> [plural]","gloss":"profesní / kariérní vyhlídky","example":"Studying medicine or software engineering usually offers excellent career prospects."},{"head":"\u003cstrong>work-life balance\u003c/strong> /ˌwɜːk laɪf ˈbæləns/ AmE /ˌwɜːrk laɪf ˈbæləns/ [U]","gloss":"rovnováha mezi pracovním a osobním životem","example":"Many young professionals today prioritize a healthy work-life balance over working fifty hours a week."},{"head":"\u003cstrong>remote work\u003c/strong> [U]","gloss":"práce na dálku, práce z domova","example":"The rise of remote work enables employees to work for international companies without moving abroad."},{"head":"\u003cstrong>job security\u003c/strong> /ˈdʒɒb sɪkjʊərəti/ AmE /ˈdʒɑːb sɪkjʊrəti/ [U]","gloss":"jistota zaměstnání","example":"Public sector positions often offer greater job security than jobs in volatile private startups."},{"head":"\u003cstrong>salary\u003c/strong> /ˈsæləri/ [C/U]","gloss":"stálý plat (obvykle měsíční nebo roční)","example":"He was offered a competitive starting salary with regular annual performance reviews."},{"head":"\u003cstrong>wage\u003c/strong> /weɪdʒ/ [C]","gloss":"mzda (obvykle hodinová nebo týdenní, např. u manuální práce či brigád)","example":"Students working part-time in supermarkets usually earn an hourly wage."},{"head":"\u003cstrong>promotion\u003c/strong> /prəˈməʊʃn/ AmE /prəˈmoʊʃn/ [C/U]","gloss":"povýšení v zaměstnání","example":"After successfully leading the regional marketing campaign, she earned a well-deserved promotion."},{"head":"\u003cstrong>qualifications\u003c/strong> /ˌkwɒlɪfɪˈkeɪʃnz/ AmE /ˌkwɑːlɪfɪˈkeɪʃnz/ [plural]","gloss":"kvalifikace, odborné předpoklady","example":"Employers assess whether applicants hold the necessary academic and technical qualifications."},{"head":"\u003cstrong>labour market\u003c/strong> /ˈleɪbə mɑːkɪt/ AmE /ˈleɪbər mɑːrkɪt/ [singular, usually the labour market]","gloss":"trh práce","example":"Due to automation and artificial intelligence, the modern labour market demands continuous retraining."},{"head":"\u003cstrong>apply for a job\u003c/strong> (verb phrase)","gloss":"ucházet se o práci, podat žádost o místo","example":"After passing my school leaving examinations, I intend to apply for a job in customer support."},{"head":"\u003cstrong>colleague\u003c/strong> /ˈkɒliːɡ/ AmE /ˈkɑːliːɡ/ [C]","gloss":"kolega, spolupracovník","example":"Working alongside supportive and experienced colleagues makes difficult projects much easier."},{"head":"\u003cstrong>deadline\u003c/strong> /ˈdedlaɪn/ [C]","gloss":"termín dokončení, uzávěrka","example":"Managing your time efficiently is crucial if you want to meet every project deadline."},{"head":"\u003cstrong>freelancer\u003c/strong> /ˈfriːlɑːnsə/ AmE /ˈfriːlænsər/ [C]","gloss":"nezávislý profesionál, člověk na volné noze","example":"Working as a freelancer allows you to choose your own clients and working hours."},{"head":"\u003cstrong>vocational training\u003c/strong> (vocational /vəʊˈkeɪʃənl/) [U]","gloss":"odborné / učňovské vzdělávání","example":"While university suits students who want an academic career, vocational training prepares technicians and electricians for immediate work."},{"head":"\u003cstrong>overtime\u003c/strong> /ˈəʊvətaɪm/ AmE /ˈoʊvərtaɪm/ [U]","gloss":"práce přesčas","example":"Employees who frequently work overtime risk suffering from chronic fatigue and burnout."},{"head":"\u003cstrong>perk\u003c/strong> /pɜːk/ AmE /pɜːrk/ [C]","gloss":"zaměstnanecký benefit (např. flexibilní doba, stravenky)","example":"Flexible working hours and gym memberships are attractive perks offered by many modern employers."},{"head":"\u003cstrong>soft skills\u003c/strong> /ˈsɒft skɪlz/ AmE /ˈsɔːft skɪlz/ [plural]","gloss":"měkké dovednosti (komunikace, týmovost, řešení konfliktů)","example":"Technical know-how can get you an interview, but strong soft skills help you thrive in a team."},{"head":"\u003cstrong>university degree\u003c/strong> [C]","gloss":"vysokoškolský titul, diplom","example":"Obtaining a university degree opens doors to specialised careers in law, medicine, and research."},{"head":"\u003cstrong>be made redundant\u003c/strong> (redundant /rɪˈdʌndənt/) (passive verb phrase)","gloss":"být propuštěn pro nadbytečnost","example":"When the factory automated its production lines, dozens of assembly workers were made redundant."}],"answer":["As secondary school students approaching our final exams, we find thinking about our future careers both exciting and slightly daunting. The modern \u003cstrong>labour market\u003c/strong> is changing at a rapid pace, driven by technology and globalization. While previous generations often stayed with a single employer for many years, today we must be adaptable, open to lifelong learning, and equipped with versatile \u003cstrong>soft skills\u003c/strong> like teamwork and problem-solving.","My own career aspirations involve pursuing a \u003cstrong>university degree\u003c/strong> in management or languages. Earning a respected higher education qualification provides solid theoretical knowledge, but I also know that academic theory is not enough on its own. I think gaining practical experience through a summer \u003cstrong>internship\u003c/strong> or student exchange is essential if you want to build an impressive CV. When the time comes to \u003cstrong>apply for a job\u003c/strong> and attend a formal \u003cstrong>job interview\u003c/strong>, real-world project experience often sets candidates apart.","Of course, financial reward is an important factor. Most people hope for a fair \u003cstrong>salary\u003c/strong>, opportunities for \u003cstrong>promotion\u003c/strong>, and reasonable \u003cstrong>job security\u003c/strong>. However, what matters to me even more is finding work that feels genuinely fulfilling. I want to collaborate with inspiring \u003cstrong>colleagues\u003c/strong> in an environment that respects personal time. The recent growth of \u003cstrong>remote work\u003c/strong> and flexible schedules highlights how much employees value having a healthy \u003cstrong>work-life balance\u003c/strong>. Ultimately, a rewarding job should challenge you intellectually without causing constant exhaustion."],"answer_info":"B2, ~250 slov","questions":[{"cat":"Popis","text":"What factors are most influential when young people choose their future profession or field of study?"},{"cat":"Srovnání","text":"In what ways does obtaining a university degree compare with completing practical vocational training in terms of job opportunities?"},{"cat":"Příprava","text":"How should a young applicant prepare for their very first job interview to make a positive impression?"},{"cat":"Názor","text":"Why is maintaining a sensible work-life balance becoming such a high priority for the younger generation?"},{"cat":"Hypotéza","text":"If artificial intelligence and automation replace many traditional office jobs in the next decade, what types of careers will remain safe?"},{"cat":"Srovnání","text":"What are the main benefits and drawbacks of working remotely from home compared to working in a traditional office?"},{"cat":"Názor","text":"How important are interpersonal soft skills compared to technical qualifications when building a successful career?"}],"phrases":[{"head":"\u003cstrong>When I consider my future prospects, I...\u003c/strong>","gloss":"Když uvažuji o svých budoucích vyhlídkách, ...","note":"zaměření na budoucnost"},{"head":"\u003cstrong>It is extremely important to...\u003c/strong>","gloss":"Je nesmírně důležité...","note":"zdůraznění priority"},{"head":"\u003cstrong>First and foremost, we should realize that...\u003c/strong>","gloss":"Především bychom si měli uvědomit, že...","note":"hlavní myšlenka"},{"head":"\u003cstrong>Striking a balance between work and leisure...\u003c/strong>","gloss":"Nalezení rovnováhy mezi prací a volnem...","note":"téma rovnováhy"},{"head":"\u003cstrong>From where I stand,...\u003c/strong>","gloss":"Podle mého názoru / z mé pozice...","note":"vyjádření postoje"},{"head":"\u003cstrong>In contrast to traditional career paths, modern ones...\u003c/strong>","gloss":"Na rozdíl od tradičních kariérních cest ty dnešní...","note":"srovnání s minulostí"},{"head":"\u003cstrong>To put it in a nutshell, my ideal career would be...\u003c/strong>","gloss":"V kostce řečeno, má ideální kariéra by byla...","note":"závěrečné shrnutí"}],"unverified":0},{"file":"tema-s12-family-friends-relationships.md","title":"Family, friends, relationships","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu. Jazykové opravy: Claude, 25. 11. 2026 (#1158), čekají na kontrolu a schválení učitelem. Věcné opravy: Claude, 26. 11. 2026 (#1173), čekají na kontrolu a schválení učitelem.","s":12,"v":12,"vocab":[{"head":"\u003cstrong>nuclear family\u003c/strong> /ˌnjuːkliə ˈfæməli/ AmE /ˌnuːkliər ˈfæməli/ [C]","gloss":"základní rodina (pouze rodiče a děti)","example":"Many households are structured as a traditional nuclear family consisting of parents and their children."},{"head":"\u003cstrong>extended family\u003c/strong> /ɪkˌstendɪd ˈfæməli/ [C]","gloss":"širší rodina (zahrnující prarodiče, strýce, tety a bratrance)","example":"We gather our entire extended family together twice a year for Christmas and summer barbecues."},{"head":"\u003cstrong>generation gap\u003c/strong> [C]","gloss":"generační propast, rozdíl v názorech mezi generacemi","example":"Different views on technology and lifestyle often highlight the generation gap between teenagers and grandparents."},{"head":"\u003cstrong>upbringing\u003c/strong> /ˈʌpbrɪŋɪŋ/ [U]","gloss":"výchova (dítěte rodiči v rodině)","example":"A loving and supportive upbringing can give young people emotional resilience for adult life."},{"head":"\u003cstrong>rely on\u003c/strong> (rely /rɪˈlaɪ/) (phrasal verb)","gloss":"spoléhat se na","example":"True friends are those rare individuals whom you can rely on no matter what troubles you face."},{"head":"\u003cstrong>get on well with sb\u003c/strong> (phrasal verb)","gloss":"dobře vycházet s někým","example":"I am fortunate to get on well with my younger sister, even though we occasionally squabble over clothes."},{"head":"\u003cstrong>fall out with sb\u003c/strong> (phrasal verb)","gloss":"pohádat se / rozkmotřit se s někým","example":"It is painful when close friends fall out with each other over silly misunderstandings."},{"head":"\u003cstrong>make up (with sb)\u003c/strong> (make up /ˌmeɪk ˈʌp/) (phrasal verb)","gloss":"usmířit se (s někým)","example":"After discussing their hurt feelings openly, the two friends managed to make up with each other."},{"head":"\u003cstrong>confide in sb\u003c/strong> (confide /kənˈfaɪd/) (verb)","gloss":"svěřit se někomu (s důvěrnou věcí)","example":"Whenever I feel anxious about my school performance, I confide in my mother."},{"head":"\u003cstrong>peer pressure\u003c/strong> /ˈpɪə preʃə(r)/ AmE /ˈpɪr preʃər/ [U]","gloss":"tlak vrstevníků","example":"Adolescents sometimes try smoking or drinking alcohol under intense peer pressure."},{"head":"\u003cstrong>acquaintance\u003c/strong> /əˈkweɪntəns/ [C]","gloss":"známý (člověk, kterého známe, ale není blízkým přítelem)","example":"Social media makes it easy to have hundreds of acquaintances, but genuine friends are often few in number."},{"head":"\u003cstrong>look up to sb\u003c/strong> (phrasal verb)","gloss":"vzhlížet k někomu, chovat k někomu úctu","example":"Many students look up to their older siblings or sports coaches as inspiring role models."},{"head":"\u003cstrong>take after sb\u003c/strong> (phrasal verb)","gloss":"podobat se někomu (povahou nebo vzhledem v rodině)","example":"In terms of patience and calmness, I definitely take after my father."},{"head":"\u003cstrong>household chores\u003c/strong> (household /ˈhaʊshəʊld/) [plural]","gloss":"domácí práce","example":"Sharing household chores, like vacuuming and washing dishes, can teach teenagers responsibility."},{"head":"\u003cstrong>supportive\u003c/strong> /səˈpɔːtɪv/ AmE /səˈpɔːrtɪv/ (adjective)","gloss":"podporující, chápající","example":"Having a supportive family can make dealing with exam anxiety far easier."},{"head":"\u003cstrong>mutual trust\u003c/strong> (mutual /ˈmjuːtʃuəl/; trust /trʌst/) [U]","gloss":"vzájemná důvěra","example":"Any long-lasting romantic relationship or deep friendship is rooted in mutual trust."},{"head":"\u003cstrong>sibling rivalry\u003c/strong> (sibling /ˈsɪblɪŋ/; rivalry /ˈraɪvlri/) [U]","gloss":"sourozenecká rivalita","example":"A certain amount of sibling rivalry is natural when brothers compete for parental attention."},{"head":"\u003cstrong>reach a compromise\u003c/strong> (compromise /ˈkɒmprəmaɪz/ AmE /ˈkɑːmprəmaɪz/) (phrase)","gloss":"dosáhnout kompromisu","example":"When conflicts arise at home, parents and teenagers should sit down and reach a compromise."},{"head":"\u003cstrong>drift apart\u003c/strong> (drift /drɪft/) (phrasal verb)","gloss":"odcizit se, vzájemně se vzdálit","example":"After finishing school and moving to different cities, former classmates frequently drift apart."},{"head":"\u003cstrong>adolescence\u003c/strong> /ˌædəˈlesns/ [U]","gloss":"dospívání (vývojové období mezi dětstvím a dospělostí; tělesná puberta je \u003cem>puberty\u003c/em>)","example":"During adolescence, young people search for their own identity and desire greater independence."},{"head":"\u003cstrong>sympathetic\u003c/strong> /ˌsɪmpəˈθetɪk/ (adjective)","gloss":"soucitný, chápavý (POZOR: neznamená „sympatický“, ale „projevující soucit“)","example":"When my dog died, my teacher was remarkably sympathetic and gave me extra time."},{"head":"\u003cstrong>empathy\u003c/strong> /ˈempəθi/ [U]","gloss":"vcítění, empatie","example":"Being a good listener requires genuine empathy and patience."}],"answer":["For me, relationships with family and friends are the most important part of everyday life. Now that I am a teenager going through \u003cstrong>adolescence\u003c/strong>, my family and my friends play different but equally vital roles in my daily life. At home, I live in a traditional \u003cstrong>nuclear family\u003c/strong> with my parents and my brother. Naturally, occasional tensions arise, for example over \u003cstrong>household chores\u003c/strong> or bedtime rules, and the typical \u003cstrong>generation gap\u003c/strong> often magnifies them. However, whenever serious disagreements occur, we sit down to talk and \u003cstrong>reach a compromise\u003c/strong>. Knowing that I have a \u003cstrong>supportive\u003c/strong> background where parents show \u003cstrong>empathy\u003c/strong> and where I can always \u003cstrong>confide in\u003c/strong> them gives me immense security.","At the same time, friendships often become increasingly significant during secondary school years. There is a huge distinction between having dozens of online \u003cstrong>acquaintances\u003c/strong> and having true companions. True friendship is built on \u003cstrong>mutual trust\u003c/strong>, shared humour, and honest communication. While you might sometimes \u003cstrong>fall out with\u003c/strong> a close friend over trivial disagreements, genuine friends usually swallow their pride and \u003cstrong>make up\u003c/strong> afterwards.","Another challenge many young people face is \u003cstrong>peer pressure\u003c/strong>. In secondary school environments, the desire to fit into a particular social group can push teenagers into doing things that conflict with their personal values. In my opinion, the healthiest friendships are those where people respect your individuality instead of pressuring you to change. As we mature and prepare for adulthood, we often \u003cstrong>drift apart\u003c/strong> from some childhood friends, but the loyal friends whom you can truly \u003cstrong>rely on\u003c/strong> can stay with you for a lifetime."],"answer_info":"B2, ~250 slov","questions":[{"cat":"Popis","text":"What qualities do you value most in a close friend?"},{"cat":"Srovnání","text":"In what ways do the roles of parents and friends differ when a teenager is experiencing personal problems?"},{"cat":"Zkušenost","text":"How do members of your family usually handle disagreements or conflicts of opinion?"},{"cat":"Názor","text":"Why do you think some childhood friends stay close into adulthood while others gradually drift apart?"},{"cat":"Popis","text":"What are the most common causes of misunderstandings between teenagers and their grandparents?"},{"cat":"Hypotéza","text":"If a friend asked you to cover for them while they were doing something dishonest, how would you respond to balance honesty and loyalty?"},{"cat":"Názor","text":"How has communicating through digital messages and social networks altered the depth of personal relationships among young people?"}],"phrases":[{"head":"\u003cstrong>Family comes first because...\u003c/strong>","gloss":"Rodina je na prvním místě, protože...","note":"vyjádření hodnoty"},{"head":"\u003cstrong>When there is a clash of personalities,...\u003c/strong>","gloss":"Když dojde ke střetu osobností,...","note":"popis konfliktu"},{"head":"\u003cstrong>I firmly believe that open communication is key to...\u003c/strong>","gloss":"Pevně věřím, že otevřená komunikace je klíčem k...","note":"doporučení"},{"head":"\u003cstrong>On the whole, my friends and I...\u003c/strong>","gloss":"Celkově vzato, moji přátelé a já...","note":"obecný pohled"},{"head":"\u003cstrong>A common source of tension between generations is...\u003c/strong>","gloss":"Běžným zdrojem napětí mezi generacemi je...","note":"pojmenování příčiny"},{"head":"\u003cstrong>From my personal perspective, true loyalty means...\u003c/strong>","gloss":"Z mého osobního pohledu skutečná věrnost znamená...","note":"definice"},{"head":"\u003cstrong>All in all, healthy relationships require...\u003c/strong>","gloss":"Celkově vzato, zdravé vztahy vyžadují...","note":"závěr"}],"unverified":0},{"file":"tema-s13-living-and-housing.md","title":"Living and housing","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu. Jazykové opravy: Claude, 25. 11. 2026 (#1158), čekají na kontrolu a schválení učitelem. Věcné opravy: Claude, 26. 11. 2026 (#1173), čekají na kontrolu a schválení učitelem.","s":13,"v":13,"vocab":[{"head":"\u003cstrong>detached house\u003c/strong> (detached /dɪˈtætʃt/) [C]","gloss":"samostatně stojící rodinný dům","example":"Living in a detached house with a private garden offers great privacy and freedom."},{"head":"\u003cstrong>semi-detached house\u003c/strong> (semi /ˈsemi/; detached /dɪˈtætʃt/) [C]","gloss":"dvojdomek (dva domy spojené jednou společnou zdí)","example":"Semi-detached houses are common across Britain."},{"head":"\u003cstrong>terraced house\u003c/strong> /ˌterəst ˈhaʊs/ [C]","gloss":"řadový dům","example":"Long rows of brick terraced houses are typical of northern English industrial towns."},{"head":"\u003cstrong>block of flats\u003c/strong> [C]","gloss":"bytový dům, činžovní dům (zahrnuje i panelové domy)","example":"Our family lives on the third floor of a newly renovated block of flats."},{"head":"\u003cstrong>mortgage\u003c/strong> /ˈmɔːɡɪdʒ/ AmE /ˈmɔːrɡɪdʒ/ [C]","gloss":"hypotéka","example":"They took out a thirty-year mortgage to buy their first home."},{"head":"\u003cstrong>landlord / landlady\u003c/strong> (landlord /ˈlændlɔːd/ AmE /ˈlændlɔːrd/) [C]","gloss":"pronajímatel / pronajímatelka (majitel bytu či domu)","example":"Our landlord is reasonable and always fixes plumbing problems without delay."},{"head":"\u003cstrong>tenant\u003c/strong> /ˈtenənt/ [C]","gloss":"nájemník","example":"The contract clearly states what rights and responsibilities each tenant has."},{"head":"\u003cstrong>rent\u003c/strong> /rent/ [U]","gloss":"nájemné","example":"Paying monthly rent in a capital city consumes a substantial part of an entry-level salary."},{"head":"\u003cstrong>spacious\u003c/strong> /ˈspeɪʃəs/ (adjective)","gloss":"prostorný","example":"The open-plan living room feels remarkably bright and spacious."},{"head":"\u003cstrong>cramped\u003c/strong> /kræmpt/ (adjective)","gloss":"stísněný","example":"The small room I shared with two roommates felt cramped and uncomfortable."},{"head":"\u003cstrong>cosy\u003c/strong> /ˈkəʊzi/ AmE /ˈkoʊzi/ (adjective)","gloss":"útulný","example":"With wooden floors and a fire burning in the fireplace, the attic bedroom feels very cosy."},{"head":"\u003cstrong>fully furnished\u003c/strong> (fully /ˈfʊli/; furnished /ˈfɜːnɪʃt/ AmE /ˈfɜːrnɪʃt/) (phrase)","gloss":"plně zařízený (nábytkem)","example":"Many students prefer renting fully furnished flats so they do not have to purchase wardrobes and beds."},{"head":"\u003cstrong>utilities\u003c/strong> [plural]","gloss":"poplatky za energie a služby (elektřina, plyn, voda, topení)","example":"When calculating living expenses, do not forget to add monthly utilities to the base rent."},{"head":"\u003cstrong>household appliances\u003c/strong> (household /ˈhaʊshəʊld/) [plural]","gloss":"domácí spotřebiče","example":"Modern energy-efficient household appliances, like dishwashers and washing machines, can save both time and money."},{"head":"\u003cstrong>maintenance\u003c/strong> /ˈmeɪntənəns/ [U]","gloss":"údržba (domu, nemovitosti, zahrady)","example":"Owning an older house requires continuous maintenance, from repairing roof tiles to painting fences."},{"head":"\u003cstrong>renovate\u003c/strong> /ˈrenəveɪt/ (verb)","gloss":"rekonstruovat, zmodernizovat","example":"They bought a traditional stone cottage and decided to renovate it step by step."},{"head":"\u003cstrong>cottage\u003c/strong> /ˈkɒtɪdʒ/ AmE /ˈkɑːtɪdʒ/ [C]","gloss":"venkovský domek, chalupa (pro víkendové pobyty též \u003cem>holiday cottage\u003c/em>)","example":"Many Czech families spend their summer weekends relaxing at a countryside cottage."},{"head":"\u003cstrong>suburb\u003c/strong> /ˈsʌbɜːb/ AmE /ˈsʌbɜːrb/ [C]","gloss":"předměstí, okrajová čtvrť","example":"Families with small children often move to quiet suburbs outside large cities."},{"head":"\u003cstrong>countryside\u003c/strong> /ˈkʌntrisaɪd/ [U]","gloss":"venkov, venkovská příroda","example":"Living in the peaceful countryside offers fresh air, though residents often have to commute to town by car."},{"head":"\u003cstrong>neighbourhood\u003c/strong> /ˈneɪbəhʊd/ AmE /ˈneɪbərhʊd/ [C]","gloss":"sousedství, okolí bydliště","example":"Our neighbourhood is safe and friendly, with plenty of playgrounds and leafy trees."},{"head":"\u003cstrong>housing market\u003c/strong> (housing /ˈhaʊzɪŋ/) [C]","gloss":"trh s bydlením","example":"Rapidly rising property prices make it very challenging to enter the housing market."},{"head":"\u003cstrong>amenities\u003c/strong> [plural]","gloss":"občanská vybavenost (služby v okolí bydliště)","example":"Proximity to essential amenities like shops, medical clinics, and tram stops makes city life practical."}],"answer":["Having a comfortable place to live is essential for our daily well-being and sense of security. People's living arrangements vary widely depending on their personal preferences, financial means, and stage of life. In the Czech Republic, many city residents live in a \u003cstrong>block of flats\u003c/strong>, while families in smaller towns and villages often own a \u003cstrong>detached house\u003c/strong> surrounded by a private garden.","Currently, I live with my parents in a \u003cstrong>spacious\u003c/strong> three-room flat in a quiet \u003cstrong>neighbourhood\u003c/strong> of České Budějovice. What I appreciate most about our home is how \u003cstrong>cosy\u003c/strong> and convenient it is. We do not have to worry about demanding exterior \u003cstrong>maintenance\u003c/strong> or mowing lawns, and all basic \u003cstrong>amenities\u003c/strong> are just a short walk away. On the other hand, many Czechs, including my relatives, love spending weekends at a countryside \u003cstrong>cottage\u003c/strong>, which offers a peaceful escape from urban traffic and concrete buildings.","When I look ahead to the future, I see that finding suitable accommodation is a major concern for my generation. In the current \u003cstrong>housing market\u003c/strong>, property prices are extremely high. Many young graduates start out as tenants in a shared or \u003cstrong>fully furnished\u003c/strong> apartment, paying monthly \u003cstrong>rent\u003c/strong> and \u003cstrong>utilities\u003c/strong>. Over time, buying a home of their own often means securing a long-term bank \u003cstrong>mortgage\u003c/strong>. When I imagine my dream house, I would love a comfortable house in a green \u003cstrong>suburb\u003c/strong>, combining peace and quiet with easy access to city life."],"answer_info":"B2, ~250 slov","questions":[{"cat":"Popis","text":"Which room in your home is your personal favourite, and how is it furnished?"},{"cat":"Srovnání","text":"What are the main advantages and drawbacks of living in a flat in a block of flats compared to living in a detached family house?"},{"cat":"Názor","text":"Why is it increasingly difficult for young people to buy their own property today?"},{"cat":"Srovnání","text":"In what ways does life in the countryside differ from life in a busy urban centre?"},{"cat":"Popis","text":"What factors should a student consider before signing a rental agreement for a student flat?"},{"cat":"Hypotéza","text":"If you had unlimited funds to design and build your dream home, what unique features would you include?"},{"cat":"Názor","text":"How do household responsibilities and chores contribute to preparing teenagers for independent adult life?"}],"phrases":[{"head":"\u003cstrong>There is no place like home, because...\u003c/strong>","gloss":"Není nad domov, protože...","note":"vyjádření vztahu k domovu"},{"head":"\u003cstrong>When I decide between city and countryside living, I...\u003c/strong>","gloss":"Když se rozhoduji mezi životem ve městě a na venkově, ...","note":"uvedení dilematu"},{"head":"\u003cstrong>The main downside of owning a house is...\u003c/strong>","gloss":"Hlavní nevýhodou vlastnictví domu je...","note":"uvedení záporu"},{"head":"\u003cstrong>In terms of everyday convenience,...\u003c/strong>","gloss":"Co se týče každodenního pohodlí,...","note":"aspekt praktičnosti"},{"head":"\u003cstrong>From a financial point of view,...\u003c/strong>","gloss":"Z finančního hlediska...","note":"ekonomický argument"},{"head":"\u003cstrong>If I had to make a choice,...\u003c/strong>","gloss":"Kdybych si musel vybrat,...","note":"vyjádření preference"},{"head":"\u003cstrong>To sum up, the most important thing about housing is...\u003c/strong>","gloss":"Abych to shrnul, nejdůležitější věcí na bydlení je...","note":"závěrečné shrnutí"}],"unverified":0},{"file":"tema-s14-food-and-drink.md","title":"Food and drink","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu. Jazykové opravy: Claude, 25. 11. 2026 (#1158), čekají na kontrolu a schválení učitelem. Věcné opravy: Claude, 26. 11. 2026 (#1173), čekají na kontrolu a schválení učitelem.","s":14,"v":14,"vocab":[{"head":"\u003cstrong>cuisine\u003c/strong> /kwɪˈziːn/ [U/C]","gloss":"kuchyně, gastronomie (národní kulinářský styl)","example":"Italian cuisine is celebrated globally for its fresh herbs, olive oil, and simple pasta dishes."},{"head":"\u003cstrong>recipe\u003c/strong> /ˈresəpi/ [C]","gloss":"kuchařský recept (POZOR: recept od lékaře je \u003cem>prescription\u003c/em>)","example":"My grandmother shared her secret family recipe for homemade apple strudel."},{"head":"\u003cstrong>ingredient\u003c/strong> /ɪnˈɡriːdiənt/ [C]","gloss":"surovina, ingredience, přísada","example":"Using fresh seasonal ingredients makes a massive difference to the final flavour of the soup."},{"head":"\u003cstrong>dine out\u003c/strong> (dine /daɪn/) (phrasal verb) / \u003cstrong>dining out\u003c/strong> (dining /ˈdaɪnɪŋ/) [noun phrase]","gloss":"jíst v restauraci, stravování mimo domov","example":"Because cooking takes time, many young professionals prefer dining out on weekday evenings."},{"head":"\u003cstrong>side dish\u003c/strong> /ˈsaɪd dɪʃ/ [C]","gloss":"příloha (k hlavnímu jídlu)","example":"In Czech cooking, potatoes and dumplings are among the most common side dishes served with meat."},{"head":"\u003cstrong>balanced diet\u003c/strong> (balanced /ˈbælənst/) [C/U]","gloss":"vyvážená strava, vyvážený jídelníček","example":"Many athletes pay close attention to a balanced diet with adequate proteins, healthy fats, and vitamins."},{"head":"\u003cstrong>dumpling\u003c/strong> /ˈdʌmplɪŋ/ [C]","gloss":"knedlík, plněná taštička (obvykle v plurálu: \u003cem>dumplings\u003c/em>)","example":"Traditional bread dumplings and roast pork with sauerkraut form one of the Czech national dishes."},{"head":"\u003cstrong>cutlery\u003c/strong> /ˈkʌtləri/ [U]","gloss":"příbory (nože, vidličky, lžíce)","example":"Before guests sit down at the dinner table, the waiter arranges polished cutlery neatly."},{"head":"\u003cstrong>tap water\u003c/strong> /ˈtæp wɔːtə(r)/ AmE /ˈtæp wɔːtər/ [U]","gloss":"voda z kohoutku","example":"Drinking fresh tap water rather than sugary sodas is better for your health and saves money."},{"head":"\u003cstrong>snack\u003c/strong> /snæk/ [C]","gloss":"svačina, malé občerstvení","example":"Carrying a piece of fruit or a handful of nuts provides a healthy snack during long school breaks."},{"head":"\u003cstrong>fast food\u003c/strong> /ˌfɑːst ˈfuːd/ AmE /ˌfæst ˈfuːd/ [U]","gloss":"rychlé občerstvení","example":"Fast food is convenient, but eating it frequently can contribute to obesity and fatigue."},{"head":"\u003cstrong>starter\u003c/strong> /ˈstɑːtə/ AmE /ˈstɑːrtər/ [C]","gloss":"předkrm (v americké angličtině častěji \u003cem>appetizer\u003c/em>)","example":"We ordered a light garlic soup as a warm starter before the heavy main course."},{"head":"\u003cstrong>main course\u003c/strong> /ˌmeɪn ˈkɔːs/ AmE /ˌmeɪn ˈkɔːrs/ [C]","gloss":"hlavní chod","example":"For my main course, I chose grilled salmon accompanied by steamed seasonal vegetables."},{"head":"\u003cstrong>dessert\u003c/strong> /dɪˈzɜːt/ AmE /dɪˈzɜːrt/ [C/U]","gloss":"dezert, moučník","example":"Finishing dinner with a rich chocolate dessert is always a delightful treat."},{"head":"\u003cstrong>greasy\u003c/strong> /ˈɡriːsi/ (adjective)","gloss":"mastný, přemaštěný","example":"Traditional fried food can be overly greasy and hard on your digestive system."},{"head":"\u003cstrong>vegetarian\u003c/strong> /ˌvedʒəˈteəriən/ AmE /ˌvedʒəˈteriən/ (noun/adjective)","gloss":"vegetarián [C]; vegetariánský","example":"Many restaurants now offer imaginative vegetarian options alongside meat dishes."},{"head":"\u003cstrong>ready meal\u003c/strong> /ˈredi miːl/ [C]","gloss":"hotové balené jídlo (k rychlému ohřátí)","example":"Relying on a processed ready meal every evening often involves consuming high levels of salt and saturated fat."},{"head":"\u003cstrong>culinary\u003c/strong> /ˈkʌlɪnəri/ AmE /ˈkjuːlɪneri/ (adjective)","gloss":"kulinářský, kuchařský","example":"Travelling abroad gives you a chance to discover authentic culinary traditions."},{"head":"\u003cstrong>eat in moderation\u003c/strong> (moderation /ˌmɒdəˈreɪʃn/ AmE /ˌmɑːdəˈreɪʃn/) (phrase)","gloss":"jíst s mírou, nepřehánět to s jídlem","example":"Many nutritionists advise that you can enjoy sweets as long as you eat them in moderation."},{"head":"\u003cstrong>overeat\u003c/strong> /ˌəʊvərˈiːt/ AmE /ˌoʊvərˈiːt/ (verb)","gloss":"přejídat se","example":"It is easy to overeat during holiday feasts when delicious treats are constantly on offer."},{"head":"\u003cstrong>skip breakfast\u003c/strong> (skip /skɪp/) (phrase)","gloss":"vynechávat snídani","example":"Students who regularly skip breakfast tend to lose concentration during morning lessons."},{"head":"\u003cstrong>flavour\u003c/strong> /ˈfleɪvə(r)/ AmE /ˈfleɪvər/ [C/U]","gloss":"příchuť, celková chuť a vůně pokrmu (na rozdíl od \u003cem>taste\u003c/em> jako základního smyslového vjemu na jazyku)","example":"Adding a pinch of fresh rosemary enhances the earthy flavour of the roast meat."}],"answer":["Food is a big part of our culture, family life, and everyday well-being. How people eat in the Czech Republic combines old habits with newer modern trends. Traditional Czech \u003cstrong>cuisine\u003c/strong> is famous for being hearty and comforting. Dishes like roast pork with bread \u003cstrong>dumplings\u003c/strong> and braised sauerkraut or rich goulash are delicious, especially in cold winter months, but they can also be quite heavy and \u003cstrong>greasy\u003c/strong>.","In recent years, however, the eating habits of some young Czechs have shifted towards a healthier, more \u003cstrong>balanced diet\u003c/strong>. While our grandparents often cooked from scratch, today's busy schedules mean many students fall into the trap of grabbing unhealthy \u003cstrong>fast food\u003c/strong> or an ultra-processed \u003cstrong>ready meal\u003c/strong>. Personally, I try to avoid these habits. I make a point never to \u003cstrong>skip breakfast\u003c/strong>, as porridge or eggs give me steady energy for morning classes, and I always pack a piece of fruit or some nuts as a morning \u003cstrong>snack\u003c/strong>.","When celebrating family birthdays, we often enjoy \u003cstrong>dining out\u003c/strong> together in local pubs or cosy bistros. A special family meal usually starts with a warm \u003cstrong>starter\u003c/strong>, such as garlic soup, followed by a hearty \u003cstrong>main course\u003c/strong>, and perhaps a light fruit \u003cstrong>dessert\u003c/strong>. Cooking at home is also something I genuinely enjoy. I find it relaxing to try out a new \u003cstrong>recipe\u003c/strong> with fresh \u003cstrong>ingredients\u003c/strong> and to experiment with herbs. In my view, the secret to staying fit is simple: you do not need extreme diets, as long as you eat fresh food and \u003cstrong>eat in moderation\u003c/strong>."],"answer_info":"B2, ~245 slov","questions":[{"cat":"Popis","text":"What does a typical daily diet of a Czech secondary school student look like?"},{"cat":"Srovnání","text":"In what ways does traditional Czech cuisine differ from lighter Mediterranean food?"},{"cat":"Zkušenost","text":"How do you prepare your favourite home-cooked meal?"},{"cat":"Názor","text":"Why do some young people choose vegetarian and plant-based diets?"},{"cat":"Kritika","text":"What are the most significant health risks associated with relying on fast food and energy drinks?"},{"cat":"Hypotéza","text":"If school canteens banned all sweet snacks and fried dishes, how would students react?"},{"cat":"Srovnání","text":"How do dining habits in English-speaking countries, like Sunday roast in the UK or barbecues in the USA, compare with Czech eating traditions?"}],"phrases":[{"head":"\u003cstrong>When it comes to my daily food choices,...\u003c/strong>","gloss":"Pokud jde o mé každodenní stravování,...","note":"uvedení tématu"},{"head":"\u003cstrong>There is nothing quite like a home-cooked meal because...\u003c/strong>","gloss":"Není nad doma uvařené jídlo, protože...","note":"vyjádření chuti/pocitu"},{"head":"\u003cstrong>On the one hand..., on the other hand...\u003c/strong>","gloss":"Na jedné straně..., na druhé straně...","note":"kontrast zdravého a nezdravého"},{"head":"\u003cstrong>A major dietary problem facing our generation is...\u003c/strong>","gloss":"Velkým stravovacím problémem naší generace je...","note":"pojmenování problému"},{"head":"\u003cstrong>From my own perspective,...\u003c/strong>","gloss":"Z mého vlastního pohledu...","note":"osobní postoj"},{"head":"\u003cstrong>It goes without saying that...\u003c/strong>","gloss":"Rozumí se samo sebou, že...","note":"přirozený fakt"},{"head":"\u003cstrong>To wrap up, healthy eating is all about...\u003c/strong>","gloss":"Abych to uzavřel, zdravé stravování spočívá především v...","note":"závěrečné shrnutí"}],"unverified":0},{"file":"tema-s15-traditions-holidays-festivals.md","title":"Traditions, holidays, festivals","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu. Jazykové opravy: Claude, 25. 11. 2026 (#1158), čekají na kontrolu a schválení učitelem. Věcné opravy: Claude, 26. 11. 2026 (#1173), čekají na kontrolu a schválení učitelem.","s":15,"v":15,"vocab":[{"head":"\u003cstrong>tradition\u003c/strong> /trəˈdɪʃn/ [C/U]","gloss":"tradice","example":"Celebrating Christmas with immediate family is a cherished tradition in Central Europe."},{"head":"\u003cstrong>custom\u003c/strong> /ˈkʌstəm/ [C]","gloss":"zvyk, obyčej","example":"Pouring lead and floating walnut shells are old Czech Christmas customs for predicting the future."},{"head":"\u003cstrong>Christmas Eve\u003c/strong> /ˌkrɪsməs ˈiːv/ [proper noun]","gloss":"Štědrý den (24. prosince)","example":"In the Czech Republic, families sit down for their festive dinner and unwrap presents on Christmas Eve."},{"head":"\u003cstrong>public holiday\u003c/strong> /ˌpʌblɪk ˈhɒlədeɪ/ AmE /ˌpʌblɪk ˈhɑːlədeɪ/ [C]","gloss":"státní svátek","example":"Most schools and banks typically remain closed on an official public holiday."},{"head":"\u003cstrong>commemorate\u003c/strong> /kəˈmeməreɪt/ (verb)","gloss":"připomínat si (historickou událost nebo osobnost)","example":"On November 17th, Czechs commemorate the struggle for freedom and democracy."},{"head":"\u003cstrong>gathering\u003c/strong> /ˈɡæðərɪŋ/ [C]","gloss":"setkání, shromáždění","example":"Thanksgiving is an occasion for enormous family gatherings across the United States."},{"head":"\u003cstrong>unwrap presents\u003c/strong> (unwrap /ʌnˈræp/) (phrase)","gloss":"rozbalovat dárky","example":"Children can hardly contain their excitement before they unwrap presents beneath the Christmas tree."},{"head":"\u003cstrong>carol\u003c/strong> /ˈkærəl/ [C]","gloss":"vánoční koleda","example":"Singing traditional carols around the lit tree creates a warm and peaceful mood."},{"head":"\u003cstrong>festive atmosphere\u003c/strong> (festive /ˈfestɪv/) [C, usually singular]","gloss":"sváteční atmosféra","example":"The smell of cinnamon and gingerbread filling the house contributes to a wonderful festive atmosphere."},{"head":"\u003cstrong>feast\u003c/strong> /fiːst/ [C]","gloss":"hostina, slavnostní hodování","example":"A lavish feast with roasted poultry and seasonal pastries is typical of winter celebrations."},{"head":"\u003cstrong>Thanksgiving\u003c/strong> /ˌθæŋksˈɡɪvɪŋ/ [proper noun]","gloss":"Den díkůvzdání (čtvrtý čtvrtek v listopadu v USA)","example":"Families across America travel long distances to share roast turkey on Thanksgiving."},{"head":"\u003cstrong>Independence Day\u003c/strong> /ˌɪndɪˈpendəns deɪ/ [proper noun]","gloss":"Den nezávislosti (4. července v USA)","example":"Americans celebrate Independence Day with outdoor barbecues, picnics, and parades."},{"head":"\u003cstrong>fireworks display\u003c/strong> (display /dɪˈspleɪ/) [C]","gloss":"ohňostroj","example":"Crowds gathered along the riverbank to admire the spectacular fireworks display at midnight."},{"head":"\u003cstrong>bonfire\u003c/strong> /ˈbɒnfaɪə/ AmE /ˈbɑːnfaɪər/ [C]","gloss":"vatra, velký oheň","example":"On the fifth of November, many British people light bonfires and burn effigies to mark Guy Fawkes Night."},{"head":"\u003cstrong>hand down from generation to generation\u003c/strong> (phrase)","gloss":"předávat z generace na generaci","example":"Folk songs, embroidery techniques, and holiday recipes are handed down from generation to generation."},{"head":"\u003cstrong>Easter egg\u003c/strong> /ˈiːstər eɡ/ [C]","gloss":"velikonoční vajíčko, kraslice (v anglosaském světě často čokoládové či barvené vařené vajíčko určené ke hledání – \u003cem>egg hunt\u003c/em>)","example":"Decorating boiled Easter eggs with melted wax is a delicate and time-consuming art."},{"head":"\u003cstrong>braided willow rod\u003c/strong> (willow /ˈwɪləʊ/; rod /rɒd/ A
