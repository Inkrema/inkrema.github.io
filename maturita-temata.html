mE /rɑːd/) [C] (Czech: \u003cem>pomlázka\u003c/em>)","gloss":"pomlázka (spletená z vrbového proutí)","example":"On Easter Monday morning, boys carry a traditional braided willow rod when they visit girls."},{"head":"\u003cstrong>costume\u003c/strong> /ˈkɒstjuːm/ AmE /ˈkɑːstuːm/ [C]","gloss":"kostým, maškarní převlek (POZOR na falešného přítele: dámský společenský/pracovní kostým je \u003cem>suit\u003c/em> nebo \u003cem>trouser suit\u003c/em>)","example":"Children love dressing up in spooky costumes for Halloween trick-or-treating."},{"head":"\u003cstrong>parade\u003c/strong> /pəˈreɪd/ [C]","gloss":"slavnostní průvod","example":"St Patrick's Day in Dublin is celebrated with a vibrant street parade and green clothing."},{"head":"\u003cstrong>commercialized\u003c/strong> (adjective)","gloss":"zkomercializovaný","example":"Many people regret that holidays have become overly commercialized by retailers eager to maximize profits."},{"head":"\u003cstrong>fried carp\u003c/strong> (fried /fraɪd/; carp /kɑːp/ AmE /kɑːrp/) [U]","gloss":"smažený kapr (POZOR: \u003cem>roast\u003c/em> znamená pečený v troubě, \u003cem>fried\u003c/em> je smažený na pánvi)","example":"Fried carp served with homemade potato salad is the quintessential Czech Christmas Eve meal."},{"head":"\u003cstrong>Boxing Day\u003c/strong> /ˈbɒksɪŋ deɪ/ AmE /ˈbɑːksɪŋ deɪ/ [proper noun]","gloss":"26. prosinec (ve Velké Británii a Commonwealthu)","example":"In Great Britain, December 26th is celebrated as Boxing Day, a day often associated with sales and sport."}],"answer":["Holidays and family traditions play an important role in most societies. They give us a welcome break from school or work, and bring families together throughout the year. In the Czech Republic, Christmas is one of the most beloved holidays. Unlike many families in English-speaking countries, where Santa brings gifts on Christmas Day morning, Czech families gather on \u003cstrong>Christmas Eve\u003c/strong>. We prepare a festive dinner of \u003cstrong>fried carp\u003c/strong> and homemade potato salad, listen to traditional \u003cstrong>carols\u003c/strong>, and eagerly \u003cstrong>unwrap presents\u003c/strong> under the tree. The warm and peaceful \u003cstrong>festive atmosphere\u003c/strong> at home is what makes this holiday so special for me.","English-speaking countries, in contrast, have different customs. In the United States, \u003cstrong>Thanksgiving\u003c/strong> in late November is, like Christmas, one of the most culturally significant holidays. It centres on a big family \u003cstrong>gathering\u003c/strong> and a hearty \u003cstrong>feast\u003c/strong> featuring roast turkey, pumpkin pie, and cranberry sauce to express gratitude. Another major American celebration is \u003cstrong>Independence Day\u003c/strong> on July 4th, famous for backyard barbecues, community \u003cstrong>parades\u003c/strong>, and colourful \u003cstrong>fireworks displays\u003c/strong>. In Britain, autumn brings Guy Fawkes Night on November 5th, when people gather around a large \u003cstrong>bonfire\u003c/strong> to commemorate the failure of the Gunpowder Plot in 1605.","Springtime traditions are also deeply rooted. In the Czech Republic, Easter involves unique folklore, such as boys carrying \u003cstrong>braided willow rods\u003c/strong> and girls painting colourful \u003cstrong>Easter eggs\u003c/strong>. While some people say holidays are now too \u003cstrong>commercialized\u003c/strong>, I believe the simple joy of sharing a good meal and keeping customs \u003cstrong>handed down from generation to generation\u003c/strong> remains strong."],"answer_info":"B2, ~245 slov","questions":[{"cat":"Popis","text":"How do Czech families typically spend Christmas Eve from morning until evening?"},{"cat":"Srovnání","text":"In what ways do British Christmas customs differ from Czech Christmas customs?"},{"cat":"Zkušenost","text":"Which holiday or cultural festival do you look forward to the most every year?"},{"cat":"Názor","text":"Why do some people feel that modern holidays have lost their original spiritual meaning and become too commercialized?"},{"cat":"Popis","text":"What is the historical origin and significance of Thanksgiving in the United States?"},{"cat":"Hypotéza","text":"If you had to explain the Czech Easter tradition of the braided willow rod to an international visitor, how would you describe its meaning and symbolism?"},{"cat":"Srovnání","text":"How does Halloween in the USA compare with All Souls' Day (Dušičky) in the Czech Republic?"}],"phrases":[{"head":"\u003cstrong>Traditions hold a special place in our culture because...\u003c/strong>","gloss":"Tradice mají v naší kultuře zvláštní místo, protože...","note":"vyjádření významu"},{"head":"\u003cstrong>The most distinctive aspect of this celebration is...\u003c/strong>","gloss":"Nejcharakterističtějším aspektem této oslavy je...","note":"vyzdvižení zvláštnosti"},{"head":"\u003cstrong>Compared with Czech customs, British ones...\u003c/strong>","gloss":"Ve srovnání s českými zvyky ty britské...","note":"srovnání kultur"},{"head":"\u003cstrong>It is an occasion for families to...\u003c/strong>","gloss":"Je to příležitost pro rodiny, aby...","note":"funkce svátku"},{"head":"\u003cstrong>Historically speaking, this event dates back to...\u003c/strong>","gloss":"Z historického hlediska tato událost sahá až do...","note":"historický původ"},{"head":"\u003cstrong>What strikes me most about this holiday is...\u003c/strong>","gloss":"Co mě na tomto svátku nejvíce zaujme, je...","note":"osobní postřeh"},{"head":"\u003cstrong>To sum up, while traditions evolve over time, they still...\u003c/strong>","gloss":"Abych to shrnul, ačkoliv se tradice v čase vyvíjejí, stále...","note":"závěr"}],"unverified":0},{"file":"tema-s16-travelling-and-transport.md","title":"Travelling and transport","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu. Jazykové opravy: Claude, 25. 11. 2026 (#1158), čekají na kontrolu a schválení učitelem. Věcné opravy: Claude, 26. 11. 2026 (#1173), čekají na kontrolu a schválení učitelem.","s":16,"v":16,"vocab":[{"head":"\u003cstrong>means of transport\u003c/strong> (means /miːnz/) [C, plural unchanged: means]","gloss":"dopravní prostředek","example":"Trains and bicycles are among the most eco-friendly means of transport available."},{"head":"\u003cstrong>public transport\u003c/strong> /ˌpʌblɪk ˈtrænspɔːt/ AmE /ˌpʌblɪk ˈtrænspɔːrt/ [U]","gloss":"hromadná / veřejná doprava","example":"Using public transport in large cities can save money and help avoid parking problems."},{"head":"\u003cstrong>traffic congestion\u003c/strong> (congestion /kənˈdʒestʃən/) [U]","gloss":"dopravní zácpa, přetížení dopravy","example":"Heavy traffic congestion on highways causes frustrating delays for drivers."},{"head":"\u003cstrong>delay\u003c/strong> /dɪˈleɪ/ [C/U]","gloss":"zpoždění (počitatelné např. \u003cem>a ten-minute delay\u003c/em>, nepočitatelné např. \u003cem>without delay\u003c/em>)","example":"Due to severe winter weather, our morning train suffered a thirty-minute delay."},{"head":"\u003cstrong>boarding pass\u003c/strong> (boarding /ˈbɔːdɪŋ/ AmE /ˈbɔːrdɪŋ/) [C]","gloss":"palubní vstupenka","example":"Passengers must scan their electronic boarding pass before walking through the airport departure gate."},{"head":"\u003cstrong>luggage / baggage\u003c/strong> (luggage /ˈlʌɡɪdʒ/) [U]","gloss":"zavazadlo, zavazadla","example":"Many airlines charge high extra fees if your cabin luggage exceeds the permitted weight limit."},{"head":"\u003cstrong>flight attendant\u003c/strong> /ˈflaɪt ətendənt/ [C]","gloss":"stevard, letuška","example":"The flight attendant demonstrated emergency safety procedures before the plane took off."},{"head":"\u003cstrong>carbon footprint\u003c/strong> /ˌkɑːbən ˈfʊtprɪnt/ AmE /ˌkɑːrbən ˈfʊtprɪnt/ [C]","gloss":"uhlíková stopa","example":"Flying frequently generates massive emissions that rapidly increase your personal carbon footprint."},{"head":"\u003cstrong>destination\u003c/strong> /ˌdestɪˈneɪʃn/ [C]","gloss":"cíl cesty (destinace)","example":"The Mediterranean coastline remains a popular summer holiday destination for Czech families."},{"head":"\u003cstrong>accommodation\u003c/strong> /əˌkɒməˈdeɪʃn/ AmE /əˌkɑːməˈdeɪʃn/ [U]","gloss":"ubytování","example":"Booking youth hostel accommodation in advance is wise during the peak tourist season."},{"head":"\u003cstrong>backpacking\u003c/strong> [U]","gloss":"cestování s batohem na vlastní pěst","example":"After high school graduation, many young Europeans go backpacking across Scandinavia or Southeast Asia."},{"head":"\u003cstrong>package holiday\u003c/strong> /ˈpækɪdʒ hɒlədeɪ/ AmE /ˈpækɪdʒ hɑːlədeɪ/ [C]","gloss":"zájezd s cestovní kanceláří (organizovaný zájezd s kombinací služeb v ceně)","example":"Families with small children often opt for a convenient package holiday at a seaside resort."},{"head":"\u003cstrong>fare\u003c/strong> /feə(r)/ AmE /fer/ [C]","gloss":"jízdné (cena jízdenky na vlak, autobus či taxi)","example":"Students and seniors are entitled to a substantial discount on standard train fares."},{"head":"\u003cstrong>timetable\u003c/strong> /ˈtaɪmteɪbl/ [C]","gloss":"jízdní řád","example":"You should check the online timetable carefully to avoid missing the last bus connection."},{"head":"\u003cstrong>security check\u003c/strong> [C]","gloss":"bezpečnostní kontrola (na letišti)","example":"At many airport security checks, travellers still have to remove liquids and laptops from their hand luggage."},{"head":"\u003cstrong>seat belt\u003c/strong> /ˈsiːt belt/ [C]","gloss":"bezpečnostní pás","example":"Fastening your seat belt is mandatory both in cars and during aircraft takeoff and landing."},{"head":"\u003cstrong>eco-friendly\u003c/strong> /ˌiːkəʊ ˈfrendli/ (adjective)","gloss":"šetrný k životnímu prostředí, ekologický","example":"Electric trains and cycling paths offer clean, eco-friendly alternatives to diesel vehicles."},{"head":"\u003cstrong>jet lag\u003c/strong> /ˈdʒet læɡ/ [U]","gloss":"pásmová nemoc (únava způsobená rychlým přeletem časových pásem)","example":"Crossing six time zones on a flight to New York leaves many travellers dealing with jet lag."},{"head":"\u003cstrong>journey\u003c/strong> /ˈdʒɜːni/ AmE /ˈdʒɜːrni/ [C]","gloss":"cesta (z jednoho místa na druhé)","example":"The five-hour train journey through the Alps offered breathtaking mountain views."},{"head":"\u003cstrong>commute\u003c/strong> /kəˈmjuːt/ (verb / [C])","gloss":"dojíždět; pravidelné dojíždění do školy či práce (\u003cem>a daily commute\u003c/em>)","example":"She commutes into Prague every day by suburban train."},{"head":"\u003cstrong>guesthouse\u003c/strong> /ˈɡesthaʊs/ [C]","gloss":"penzion (POZOR: slovo \u003cem>pension\u003c/em> znamená v běžné angličtině starobní důchod, ačkoli v evropském kontextu se užívá i pro ubytování)","example":"We spent a quiet weekend staying in a family-run guesthouse in the heart of Šumava."},{"head":"\u003cstrong>sightseeing tour\u003c/strong> (sightseeing /ˈsaɪtsiːɪŋ/) [C]","gloss":"poznávací okruh / zájezd","example":"Taking an open-top bus for a sightseeing tour is a great introduction to London landmarks."}],"answer":["Travelling is one of my favourite ways to spend school holidays and explore new places. Depending on our budget, time, and personal interests, how we travel can vary tremendously. Some people prefer the complete relaxation of an organized \u003cstrong>package holiday\u003c/strong> arranged by a travel agency, where flights and hotels are taken care of. In contrast, adventurous students often choose independent \u003cstrong>backpacking\u003c/strong>, staying in affordable youth hostels and meeting fellow travellers from around the world.","Choosing the right \u003cstrong>means of transport\u003c/strong> involves balancing speed, cost, and environmental responsibility. Flying is undeniably the fastest way to reach a distant overseas \u003cstrong>destination\u003c/strong>, but going through a crowded airport—from queuing at the \u003cstrong>security check\u003c/strong> to boarding—can be stressful. On top of that, long flights across several time zones often cause exhausting \u003cstrong>jet lag\u003c/strong>, and flying has a significant \u003cstrong>carbon footprint\u003c/strong>.","For everyday trips within Europe and our own country, I think the railway system is an outstanding alternative. Travelling by train allows you to read, listen to music, or simply admire the landscape while avoiding stressful \u003cstrong>traffic congestion\u003c/strong> on motorways. In towns and cities, using reliable \u003cstrong>public transport\u003c/strong> or cycling is usually more \u003cstrong>eco-friendly\u003c/strong> than driving a private car, and it can be cheaper once you count fuel and parking. In short, whether it is a daily school \u003cstrong>commute\u003c/strong> or a longer summer \u003cstrong>journey\u003c/strong>, travelling can teach us to be independent, adaptable, and open to the world around us."],"answer_info":"B2, ~245 slov","questions":[{"cat":"Popis","text":"What are the most common procedures a traveller must go through at an international airport before departure?"},{"cat":"Srovnání","text":"In what ways do independent backpacking trips compare to all-inclusive package holidays organized by travel agencies?"},{"cat":"Zkušenost","text":"What made your most memorable journey so special?"},{"cat":"Názor","text":"Why should governments invest heavily in modernising public transport systems rather than building wider motorways?"},{"cat":"Kritika","text":"How does mass tourism negatively impact popular destinations, such as historical cities or fragile natural parks?"},{"cat":"Hypotéza","text":"If commercial electric passenger planes become standard in the next twenty years, how will that change international travel?"},{"cat":"Srovnání","text":"What are the advantages and drawbacks of travelling alone compared to travelling with a group of close friends?"}],"phrases":[{"head":"\u003cstrong>Generally speaking, travelling opens your eyes because...\u003c/strong>","gloss":"Obecně řečeno, cestování člověku otevírá oči, protože...","note":"úvodní myšlenka"},{"head":"\u003cstrong>When I weigh up the pros and cons of flying and travelling by train, I...\u003c/strong>","gloss":"Když zvažuji klady a zápory létání a cestování vlakem, ...","note":"srovnání"},{"head":"\u003cstrong>The main benefit of this mode of travel is...\u003c/strong>","gloss":"Hlavní výhodou tohoto způsobu cestování je...","note":"uvedení kladu"},{"head":"\u003cstrong>One cannot ignore the environmental aspect, namely...\u003c/strong>","gloss":"Nelze ignorovat environmentální aspekt, konkrétně...","note":"ekologický pohled"},{"head":"\u003cstrong>In terms of affordability and freedom,...\u003c/strong>","gloss":"Co se týče cenové dostupnosti a svobody,...","note":"aspekt"},{"head":"\u003cstrong>From my personal perspective,...\u003c/strong>","gloss":"Z mého osobního pohledu...","note":"vyjádření názoru"},{"head":"\u003cstrong>To wrap up, what I love most about travelling is...\u003c/strong>","gloss":"Abych to shrnul, co na cestování miluji nejvíce, je...","note":"závěrečné shrnutí"}],"unverified":0},{"file":"tema-s17-uk-on-the-map.md","title":"The UK – on the map","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu. Jazykové opravy: Claude, 25. 11. 2026 (#1158), čekají na kontrolu a schválení učitelem. Věcné opravy: Claude, 26. 11. 2026 (#1173), čekají na kontrolu a schválení učitelem.","s":17,"v":17,"vocab":[{"head":"\u003cstrong>constituent country\u003c/strong> (constituent /kənˈstɪtʃuənt/) [C]","gloss":"země tvořící Spojené království, jeho dílčí země (Anglie, Skotsko, Wales a Severní Irsko; \u003cem>constituent\u003c/em> zde znamená „tvořící součást celku“)","example":"The United Kingdom is composed of four constituent countries, each with distinct cultural traditions."},{"head":"\u003cstrong>island nation\u003c/strong> [C]","gloss":"ostrovní stát","example":"As an island nation, Britain has historically maintained powerful naval forces and maritime trade."},{"head":"\u003cstrong>mountain range\u003c/strong> [C]","gloss":"pohoří, horské pásmo (horský hřeben je \u003cem>mountain ridge\u003c/em>)","example":"The Pennines are a rugged mountain range often referred to as the backbone of England."},{"head":"\u003cstrong>highest peak\u003c/strong> (peak /piːk/) [C]","gloss":"nejvyšší vrchol","example":"Ben Nevis in the Scottish Highlands is the highest peak in the British Isles, standing at 1,345 metres."},{"head":"\u003cstrong>strait / channel\u003c/strong> (strait /streɪt/) [C]","gloss":"průliv","example":"The English Channel separates the southern coast of England from northern France."},{"head":"\u003cstrong>temperate maritime climate\u003c/strong> (temperate /ˈtempərət/; maritime /ˈmærɪtaɪm/) [C/U]","gloss":"mírné přímořské podnebí","example":"Britain enjoys a temperate maritime climate with mild winters and cool summers."},{"head":"\u003cstrong>coastline\u003c/strong> /ˈkəʊstlaɪn/ [C/U]","gloss":"pobřeží, pobřežní linie","example":"The dramatic, rocky coastline of Cornwall attracts many hikers."},{"head":"\u003cstrong>loch\u003c/strong> /lɒk/ AmE /lɑːk/ [C]","gloss":"skotské jezero (sladkovodní i mořský záliv)","example":"Loch Ness is internationally famous for both its deep waters and the mythical monster legend."},{"head":"\u003cstrong>highlands\u003c/strong> [plural]","gloss":"vysočina, hornatina","example":"The dramatic glens and bare peaks of the Scottish Highlands offer breathtaking natural scenery."},{"head":"\u003cstrong>lowlands\u003c/strong> [plural]","gloss":"nížiny (pomnožné: \u003cem>the lowlands are...\u003c/em>)","example":"The fertile lowlands of central and southern England are dominated by agriculture and rolling hills."},{"head":"\u003cstrong>peninsula\u003c/strong> /pəˈnɪnsjələ/ AmE /pəˈnɪnsələ/ [C]","gloss":"poloostrov","example":"Wales is a mountainous peninsula jutting out into the Irish Sea."},{"head":"\u003cstrong>fertile\u003c/strong> /ˈfɜːtaɪl/ AmE /ˈfɜːrtl/ (adjective)","gloss":"úrodný","example":"A large share of England's wheat and barley is grown in the fertile soil of eastern England."},{"head":"\u003cstrong>surrounding seas\u003c/strong> (surrounding /səˈraʊndɪŋ/) [plural]","gloss":"okolní moře","example":"The UK's surrounding seas include the North Sea and the Irish Sea."},{"head":"\u003cstrong>scenery\u003c/strong> /ˈsiːnəri/ [U]","gloss":"krajina, přírodní scenérie","example":"The Lake District in north-west England is celebrated for its romantic mountain scenery and lakes."},{"head":"\u003cstrong>drizzle\u003c/strong> /ˈdrɪzl/ [U]","gloss":"mrholení, drobný déšť","example":"Grey skies and persistent light drizzle are common weather features in autumn."},{"head":"\u003cstrong>cliff\u003c/strong> /klɪf/ [C]","gloss":"útes, skalní sráz","example":"The iconic White Cliffs of Dover provide a striking white landmark for ships crossing the Channel."},{"head":"\u003cstrong>moorland\u003c/strong> /ˈmɔːlənd/ AmE /ˈmʊrlənd/ [U]","gloss":"vřesoviště (otevřená neobdělávaná krajina porostlá vřesem a trávou; rašeliniště je \u003cem>peat bog / peatland\u003c/em>)","example":"The wild, windswept moorland of Yorkshire served as the atmospheric setting for the Victorian novel Wuthering Heights."},{"head":"\u003cstrong>estuary\u003c/strong> /ˈestʃuəri/ AmE /ˈestʃueri/ [C]","gloss":"nálevkovité ústí řeky (do moře)","example":"London grew as a major international port along the tidal estuary of the River Thames."},{"head":"\u003cstrong>archipelago\u003c/strong> /ˌɑːkɪˈpeləɡəʊ/ AmE /ˌɑːrkɪˈpeləɡəʊ/ [C]","gloss":"souostroví","example":"The British Isles form a large archipelago comprising Great Britain, Ireland, and thousands of smaller islands."},{"head":"\u003cstrong>natural boundary\u003c/strong> (boundary /ˈbaʊndri/) [C]","gloss":"přirozená hranice","example":"Rivers and mountain ridges frequently serve as natural boundaries between historical counties."},{"head":"\u003cstrong>Gulf Stream\u003c/strong> (gulf /ɡʌlf/; stream /striːm/) [proper noun]","gloss":"Golfský proud (spolu se Severoatlantským proudem – \u003cem>North Atlantic Drift\u003c/em>)","example":"The warm waters of the Gulf Stream help to keep British winters significantly milder than those in Canadian cities at the same latitude."},{"head":"\u003cstrong>longest river\u003c/strong> [C]","gloss":"nejdelší řeka","example":"While the Thames is very well known, the River Severn is the longest river in the United Kingdom, measuring about 354 kilometres."}],"answer":["When you look at the map of Europe, you can see that the United Kingdom of Great Britain and Northern Ireland is an \u003cstrong>island nation\u003c/strong> situated off the north-western coast of the European mainland. Geographically, it forms the major part of the British \u003cstrong>archipelago\u003c/strong>, separated from continental Europe by the North Sea and the narrow English Channel.","Politically, the UK consists of four distinct \u003cstrong>constituent countries\u003c/strong>: England, Scotland, Wales, and Northern Ireland. England occupies the largest area, characterized by rolling agricultural \u003cstrong>lowlands\u003c/strong> in the south and east, while the Pennine \u003cstrong>mountain range\u003c/strong> stretches down its centre like a spine. To the north lies Scotland, which features some of the most dramatic wilderness in Europe. Here you will find the Scottish \u003cstrong>Highlands\u003c/strong>, lakes and sea inlets known locally as \u003cstrong>lochs\u003c/strong>—including the deep Loch Ness—and the country's \u003cstrong>highest peak\u003c/strong>, Ben Nevis. Wales, to the west, is a rugged \u003cstrong>peninsula\u003c/strong> partly covered by the Cambrian Mountains and Snowdonia, while Northern Ireland across the Irish Sea is famous for Lough Neagh, the largest lake in the UK by surface area.","The geography of the British Isles is profoundly shaped by the \u003cstrong>surrounding seas\u003c/strong>. Partly thanks to the warm ocean currents of the \u003cstrong>Gulf Stream\u003c/strong>, the UK enjoys a \u003cstrong>temperate maritime climate\u003c/strong>. This means temperatures rarely drop below freezing for long, though the weather is famously changeable, often bringing rain and light \u003cstrong>drizzle\u003c/strong>. From the majestic White \u003cstrong>Cliffs\u003c/strong> of Dover to the scenic riverbanks of the Thames and Severn, the physical map of the UK provides an extraordinary variety of landscapes across its islands."],"answer_info":"B2, ~250 slov","questions":[{"cat":"Popis","text":"Where on the map are the four constituent parts of the United Kingdom located?"},{"cat":"Srovnání","text":"In what ways does the terrain of Scotland differ from the landscape of southern England?"},{"cat":"Zeměpisné vlivy","text":"How does the Atlantic Gulf Stream influence the everyday weather and climate in the British Isles?"},{"cat":"Popis","text":"Which bodies of water separate Great Britain from mainland Europe and from Ireland?"},{"cat":"Názor","text":"Why do you think the Lake District and the Scottish Highlands have become such popular destinations?"},{"cat":"Hypotéza","text":"If global warming were to weaken or disrupt the Gulf Stream in the North Atlantic, how would that transform the British climate?"},{"cat":"Srovnání","text":"How do the size and terrain of the United Kingdom compare with those of the Czech Republic?"}],"phrases":[{"head":"\u003cstrong>When we examine the physical map of the UK,...\u003c/strong>","gloss":"Když se podíváme na fyzickou mapu Spojeného království,...","note":"zeměpisný úvod"},{"head":"\u003cstrong>It mostly consists of... / It is mainly characterized by...\u003c/strong>","gloss":"Vyznačuje se převážně... / Skládá se hlavně z...","note":"popis rysů krajiny"},{"head":"\u003cstrong>To the north / south / east / west lies...\u003c/strong>","gloss":"Na severu / jihu / východě / západě leží...","note":"určení polohy"},{"head":"\u003cstrong>What is particularly notable about its geography is...\u003c/strong>","gloss":"Co je na její geografii obzvláště pozoruhodné, je...","note":"upozornění na zajímavost"},{"head":"\u003cstrong>In terms of altitude and terrain,...\u003c/strong>","gloss":"Co se týče nadmořské výšky a terénu,...","note":"kategorie popisu"},{"head":"\u003cstrong>Thanks to the proximity of the ocean,...\u003c/strong>","gloss":"Díky blízkosti oceánu...","note":"příčinná souvislost"},{"head":"\u003cstrong>To conclude, the geographical variety of the UK is...\u003c/strong>","gloss":"Na závěr, zeměpisná rozmanitost Spojeného království je...","note":"závěrečné shrnutí"}],"unverified":0},{"file":"tema-s18-usa-on-the-map.md","title":"The USA – on the map","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu. Jazykové opravy: Claude, 25. 11. 2026 (#1158), čekají na kontrolu a schválení učitelem. Věcné opravy: Claude, 26. 11. 2026 (#1173), čekají na kontrolu a schválení učitelem.","s":18,"v":18,"vocab":[{"head":"\u003cstrong>contiguous states\u003c/strong> (contiguous /kənˈtɪɡjuəs/) [plural]","gloss":"souvislé státy, státy tvořící souvislé území (48 států USA se společnými hranicemi, bez oddělené Aljašky a ostrovní Havaje)","example":"The contiguous states span four different standard time zones from the Atlantic to the Pacific coast."},{"head":"\u003cstrong>mountain range\u003c/strong> [C]","gloss":"pohoří","example":"The Rocky Mountains form a massive mountain range in the western part of the continent."},{"head":"\u003cstrong>Great Plains\u003c/strong> [proper noun, plural]","gloss":"Velké planiny (rozsáhlé travnaté prérie ve střední části USA)","example":"The endless wheat fields of the Great Plains are often called the breadbasket of America."},{"head":"\u003cstrong>river basin\u003c/strong> (basin /ˈbeɪsn/) [C]","gloss":"povodí řeky","example":"The Mississippi-Missouri river basin drains water from over thirty states into the Gulf of Mexico."},{"head":"\u003cstrong>canyon\u003c/strong> /ˈkænjən/ [C]","gloss":"kaňon, hluboká soutěska","example":"Carved by the Colorado River over millions of years, the Grand Canyon is an awe-inspiring spectacle."},{"head":"\u003cstrong>Great Lakes\u003c/strong> [proper noun, plural]","gloss":"Velká jezera (Hořejší, Michiganské, Huronské, Erijské a Ontarijské)","example":"The Great Lakes along the Canadian border hold roughly one fifth of the world's surface fresh water."},{"head":"\u003cstrong>arid\u003c/strong> /ˈærɪd/ (adjective)","gloss":"suchý, vyprahlý (aridní)","example":"The arid deserts of Arizona feature giant cacti and extreme daytime temperatures."},{"head":"\u003cstrong>peninsula\u003c/strong> /pəˈnɪnsjələ/ AmE /pəˈnɪnsələ/ [C]","gloss":"poloostrov","example":"The Florida peninsula is flat and marshy, and it is famous for the Everglades and warm weather."},{"head":"\u003cstrong>subtropical\u003c/strong> /ˌsʌbˈtrɒpɪkl/ AmE /ˌsʌbˈtrɑːpɪkl/ (adjective)","gloss":"subtropický","example":"Much of the southeastern United States enjoys a humid subtropical climate with mild winters and long, hot summers."},{"head":"\u003cstrong>natural wonder\u003c/strong> [C]","gloss":"přírodní div","example":"Yellowstone was established as the world's first national park in 1872 to protect unique geysers and other natural wonders."},{"head":"\u003cstrong>national park\u003c/strong> /ˌnæʃnəl ˈpɑːk/ AmE /ˌnæʃnəl ˈpɑːrk/ [C]","gloss":"národní park","example":"Hiking enthusiasts visit Yosemite National Park to admire towering granite cliffs and giant sequoia trees."},{"head":"\u003cstrong>time zone\u003c/strong> /ˈtaɪm zəʊn/ [C]","gloss":"časové pásmo","example":"Because the country covers such vast distances, travelling across the US means passing through several time zones."},{"head":"\u003cstrong>fertile soil\u003c/strong> (fertile /ˈfɜːtaɪl/ AmE /ˈfɜːrtl/) [U]","gloss":"úrodná půda","example":"The Midwest is renowned for deep, fertile soil ideal for large-scale corn and soybean cultivation."},{"head":"\u003cstrong>tributary\u003c/strong> /ˈtrɪbjətri/ AmE /ˈtrɪbjəteri/ [C]","gloss":"přítok (řeky)","example":"The Ohio River is the largest eastern tributary of the mighty Mississippi."},{"head":"\u003cstrong>continental climate\u003c/strong> /ˌkɒntɪnentl ˈklaɪmət/ AmE /ˌkɑːntɪnentl ˈklaɪmət/ [C/U]","gloss":"vnitrozemské / kontinentální podnebí","example":"Many interior states experience a pronounced continental climate with freezing winters and scorching summers."},{"head":"\u003cstrong>Tornado Alley\u003c/strong> (tornado /tɔːˈneɪdəʊ/ AmE /tɔːrˈneɪdəʊ/; alley /ˈæli/) [proper noun / U]","gloss":"tornádová alej (oblast ve středu USA s častým výskytem tornád)","example":"Residents living in Tornado Alley often rely on storm cellars or safe interior rooms to protect against destructive springtime tornadoes."},{"head":"\u003cstrong>volcano\u003c/strong> /vɒlˈkeɪnəʊ/ AmE /vɑːlˈkeɪnoʊ/ [C]","gloss":"sopka","example":"The Hawaiian Islands were formed by active volcanoes rising from the Pacific ocean floor."},{"head":"\u003cstrong>glacier\u003c/strong> /ˈɡlæsiə(r)/ AmE /ˈɡleɪʃər/ [C]","gloss":"ledovec","example":"Alaska is celebrated for its pristine fjords, wilderness, and massive blue glaciers."},{"head":"\u003cstrong>gulf\u003c/strong> /ɡʌlf/ [C]","gloss":"záliv","example":"The warm waters of the Gulf of Mexico can feed powerful tropical hurricanes in late summer."},{"head":"\u003cstrong>border on\u003c/strong> (border /ˈbɔːdə/ AmE /ˈbɔːrdər/) (verb)","gloss":"hraničit s","example":"The United States borders on Canada to the north and Mexico to the south."},{"head":"\u003cstrong>vast expanse\u003c/strong> (vast /vɑːst/ AmE /væst/; expanse /ɪkˈspæns/) [C]","gloss":"rozlehlá plocha, nesmírná rozloha","example":"Driving across the vast expanse of Texas takes many hours."},{"head":"\u003cstrong>coastline\u003c/strong> /ˈkəʊstlaɪn/ [C/U]","gloss":"pobřeží","example":"The dramatic Pacific coastline along California features rugged cliffs dropping into ocean waves."}],"answer":["When we look at the physical map of the world, the United States of America is remarkable for its vast continental scale and geographic diversity. Covering roughly forty percent of North America, the United States \u003cstrong>borders on\u003c/strong> Canada to the north and Mexico to the south. Its coasts face the Atlantic Ocean to the east and the Pacific Ocean to the west. The nation consists of fifty states: forty-eight \u003cstrong>contiguous states\u003c/strong> between Canada and Mexico, the vast wilderness of Alaska in the far north-west, and the tropical volcanic islands of Hawaii.","Two long \u003cstrong>mountain ranges\u003c/strong> shape the physical terrain. In the east, the older, rounded Appalachian Mountains run parallel to the Atlantic \u003cstrong>coastline\u003c/strong>. As we move westward across the fertile agricultural flatlands of the Midwest and the expansive prairies of the \u003cstrong>Great Plains\u003c/strong>, the land rises dramatically into the Rocky Mountains. This rugged western spine stretches from Canada all the way into New Mexico. Further west lie spectacular desert landscapes, including the breathtaking Grand \u003cstrong>Canyon\u003c/strong> carved by the Colorado River, and beyond them is the Pacific coast.","Hydrology is another defining feature of the US map. The mighty Mississippi River and its major \u003cstrong>tributaries\u003c/strong> create an immense \u003cstrong>river basin\u003c/strong> draining the heart of the country into the \u003cstrong>Gulf of Mexico\u003c/strong>, while along the northern border lies the chain of the \u003cstrong>Great Lakes\u003c/strong>. Partly because the country is so enormous, its climate varies from arctic cold with \u003cstrong>glaciers\u003c/strong> in Alaska to a humid \u003cstrong>subtropical\u003c/strong> environment in much of Florida, and hot, \u003cstrong>arid\u003c/strong> conditions in the Southwest. Dozens of magnificent \u003cstrong>national parks\u003c/strong> protect the endless natural variety of American geography."],"answer_info":"B2, ~255 slov","questions":[{"cat":"Popis","text":"What natural boundaries and bodies of water border the United States?"},{"cat":"Srovnání","text":"In what ways do the older Appalachian Mountains in the east differ from the younger Rocky Mountains in the west?"},{"cat":"Zeměpisné vlivy","text":"How does the immense geographic size of the USA contribute to its wide variety of climate zones?"},{"cat":"Popis","text":"What is the significance of the Mississippi River system and the Great Lakes for American trade and agriculture?"},{"cat":"Zkušenost / preference","text":"Which American national park or natural wonder would you be most eager to visit?"},{"cat":"Hypotéza","text":"If you had to travel across the United States from New York to San Francisco by car, what geographical regions would you encounter along your journey?"},{"cat":"Přírodní rizika","text":"What extreme weather phenomena and natural hazards are typical of different regions in the United States?"}],"phrases":[{"head":"\u003cstrong>From a geographic point of view,...\u003c/strong>","gloss":"Ze zeměpisného hlediska...","note":"zeměpisný úvod"},{"head":"\u003cstrong>The landscape can be broadly divided into...\u003c/strong>","gloss":"Krajinu lze obecně rozdělit na...","note":"členění prostoru"},{"head":"\u003cstrong>Because the country stretches across thousands of miles,...\u003c/strong>","gloss":"Protože se země táhne přes tisíce mil,...","note":"popis rozlohy"},{"head":"\u003cstrong>Compared with the eastern states, the western states...\u003c/strong>","gloss":"Ve srovnání s východními státy západní státy...","note":"regionální srovnání"},{"head":"\u003cstrong>One of the most remarkable geographical features is...\u003c/strong>","gloss":"Jedním z nejpozoruhodnějších geografických rysů je...","note":"vyzdvižení zajímavosti"},{"head":"\u003cstrong>It plays a vital role in...\u003c/strong>","gloss":"Hraje to zásadní / klíčovou roli v...","note":"význam pro hospodářství/přírodu"},{"head":"\u003cstrong>To summarize the physical geography of the US,...\u003c/strong>","gloss":"Abych shrnul fyzickou geografii USA,...","note":"závěr"}],"unverified":0},{"file":"tema-s19-cr-on-the-map.md","title":"The CR – on the map","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu. Jazykové opravy: Claude, 25. 11. 2026 (#1158), čekají na kontrolu a schválení učitelem. Věcné opravy: Claude, 26. 11. 2026 (#1173), čekají na kontrolu a schválení učitelem.","s":19,"v":19,"vocab":[{"head":"\u003cstrong>landlocked country\u003c/strong> (landlocked /ˈlændlɒkt/ AmE /ˈlændlɑːkt/) [C]","gloss":"vnitrozemský stát (stát bez přístupu k moři)","example":"The Czech Republic is a landlocked country situated in Central Europe, often called the heart of Europe."},{"head":"\u003cstrong>border on\u003c/strong> (border /ˈbɔːdə/ AmE /ˈbɔːrdər/) (verb)","gloss":"hraničit s","example":"Our country borders on Germany to the west, Poland to the north, Slovakia to the east, and Austria to the south."},{"head":"\u003cstrong>mountain range\u003c/strong> [C]","gloss":"pohoří","example":"Natural mountain ranges form most of the historical borders surrounding the Bohemian basin."},{"head":"\u003cstrong>highest peak\u003c/strong> (peak /piːk/) [C]","gloss":"nejvyšší vrchol","example":"Sněžka in the Krkonoše Mountains is the highest peak of the country, reaching 1,603 metres above sea level."},{"head":"\u003cstrong>historical lands\u003c/strong> [plural]","gloss":"historické země (tradiční země koruny české: Čechy, Morava a Slezsko)","example":"The Czech Republic consists of three historical lands: Bohemia, Moravia, and Czech Silesia."},{"head":"\u003cstrong>longest river\u003c/strong> [C]","gloss":"nejdelší řeka","example":"The Vltava is the longest river in the Czech Republic, meandering past historic towns before joining the Elbe."},{"head":"\u003cstrong>tributary\u003c/strong> /ˈtrɪbjətri/ AmE /ˈtrɪbjəteri/ [C]","gloss":"přítok (řeky)","example":"The Berounka and Sázava rivers are well-known tributaries flowing into the Vltava."},{"head":"\u003cstrong>drainage divide / watershed\u003c/strong> (drainage /ˈdreɪnɪdʒ/) [C]","gloss":"rozvodí (hranice mezi povodími; hlavní či kontinentální rozvodí: \u003cem>major / continental drainage divide\u003c/em>; v US \u003cem>watershed\u003c/em> = povodí)","example":"The Czech Republic lies on a major European drainage divide, shedding water into three different seas; because of this, it is sometimes nicknamed \"the roof of Europe\"."},{"head":"\u003cstrong>temperate climate\u003c/strong> (temperate /ˈtempərət/) [C/U]","gloss":"mírné podnebí (podnebí mírného pásma s mírnými teplotami bez extrémních výkyvů)","example":"Central Europe experiences a temperate climate with distinct seasonal changes."},{"head":"\u003cstrong>distinct seasons\u003c/strong> (distinct /dɪˈstɪŋkt/) [plural]","gloss":"výrazná / odlišná roční období","example":"Living here means enjoying distinct seasons, from snowy winter slopes to warm summer afternoons."},{"head":"\u003cstrong>fertile lowlands\u003c/strong> (fertile /ˈfɜːtaɪl/ AmE /ˈfɜːrtl/) [plural]","gloss":"úrodné nížiny","example":"The fertile lowlands along the Elbe River and the Haná region in Moravia produce cereals and sugar beet."},{"head":"\u003cstrong>rolling hills\u003c/strong> (rolling /ˈrəʊlɪŋ/) [plural]","gloss":"zvlněná pahorkatina, mírné kopce","example":"The Bohemian-Moravian Highlands feature picturesque rolling hills, peaceful pastures, and forests."},{"head":"\u003cstrong>national park\u003c/strong> /ˌnæʃnəl ˈpɑːk/ AmE /ˌnæʃnəl ˈpɑːrk/ [C]","gloss":"národní park","example":"There are currently four designated national parks (as of 2026) in the Czech Republic: Krkonoše, Šumava, Podyjí, and Bohemian Switzerland."},{"head":"\u003cstrong>sandstone rock formations / rock towns\u003c/strong> (sandstone /ˈsændstəʊn/) [plural]","gloss":"pískovcové skalní útvary, skalní města","example":"Tourists from around the world visit Bohemian Switzerland to admire breathtaking sandstone rock formations."},{"head":"\u003cstrong>fishpond\u003c/strong> [C]","gloss":"(chovný) rybník (obecně rybník či vodní nádrž: \u003cem>pond\u003c/em>)","example":"South Bohemia is famous for its intricate network of carp fishponds established in the Middle Ages and expanded in the sixteenth century."},{"head":"\u003cstrong>spa town\u003c/strong> (spa /spɑː/) [C]","gloss":"lázeňské město","example":"West Bohemia is celebrated for elegant spa towns like Karlovy Vary, famous for hot mineral springs."},{"head":"\u003cstrong>dense forest\u003c/strong> (dense /dens/) [C/U]","gloss":"hustý les","example":"The Šumava National Park protects extensive areas of dense forest and peat bogs."},{"head":"\u003cstrong>water reservoir\u003c/strong> (reservoir /ˈrezəvwɑː(r)/ AmE /ˈrezərvwɑːr/) [C]","gloss":"vodní nádrž, přehradní jezero (samotná hráz je \u003cem>dam\u003c/em>)","example":"Lipno is the largest water reservoir in the country by surface area and a magnet for water sports enthusiasts."},{"head":"\u003cstrong>natural resources\u003c/strong> [plural]","gloss":"přírodní zdroje, přírodní bohatství (zahrnuje půdu, lesy i nerostné suroviny – \u003cem>mineral resources\u003c/em>)","example":"The country possesses valuable natural resources, including mineral springs, fertile soil, and timber."},{"head":"\u003cstrong>heart of Europe\u003c/strong> (europe /ˈjʊərəp/ AmE /ˈjʊrəp/) [phrase]","gloss":"srdce Evropy","example":"Because of its central geographic location, the Czech Republic is frequently described as the heart of Europe."},{"head":"\u003cstrong>natural boundary\u003c/strong> (boundary /ˈbaʊndri/) [C]","gloss":"přirozená hranice","example":"High mountain ridges and major rivers can form natural boundaries between neighbouring states."},{"head":"\u003cstrong>protected landscape area\u003c/strong> (landscape /ˈlændskeɪp/) [C]","gloss":"chráněná krajinná oblast (CHKO)","example":"The Jizera Mountains are preserved as a protected landscape area popular with cross-country skiers."}],"answer":["The Czech Republic is a \u003cstrong>landlocked country\u003c/strong> in Central Europe, covering an area of roughly 79,000 square kilometres. It has a population of nearly eleven million people, and its capital and largest city is Prague, home to around 1.4 million inhabitants. Administratively, the state is divided into fourteen regions, while culturally it consists of three \u003cstrong>historical lands\u003c/strong>: Bohemia in the west, Moravia in the east, and part of Silesia in the north-east. Our territory \u003cstrong>borders on\u003c/strong> four neighbours: Germany, Poland, Slovakia, and Austria.","In terms of physical landscape, Bohemia forms a broad basin surrounded by natural \u003cstrong>mountain ranges\u003c/strong>. The Krkonoše Mountains stretch along the northern border, where our \u003cstrong>highest peak\u003c/strong>, Sněžka, rises to 1,603 metres. To the south-west lies Šumava, characterized by \u003cstrong>dense forest\u003c/strong> and peat bogs. The interior features \u003cstrong>rolling hills\u003c/strong>, such as the Bohemian-Moravian Highlands, and \u003cstrong>fertile lowlands\u003c/strong> along the River Elbe and in southern Moravia.","Water plays a vital role in our geography. The country lies on a continental \u003cstrong>drainage divide\u003c/strong>, with rivers flowing to three different seas. Our \u003cstrong>longest river\u003c/strong> is the Vltava, which meanders through Bohemia to join the Elbe. We also have famous artificial \u003cstrong>fishponds\u003c/strong> in the south and the Lipno \u003cstrong>water reservoir\u003c/strong>, which is the country's largest reservoir by surface area. Along our northern borderlands, dramatic \u003cstrong>sandstone rock formations\u003c/strong> also attract thousands of hikers. The country has a \u003cstrong>temperate climate\u003c/strong> with \u003cstrong>distinct seasons\u003c/strong>, and it preserves unique landscapes in four \u003cstrong>national parks\u003c/strong> (as of 2026)."],"answer_info":"B2, ~250 slov","questions":[{"cat":"Popis","text":"Which neighbouring countries surround the Czech Republic?"},{"cat":"Popis","text":"What natural mountain borders define our territory?"},{"cat":"Srovnání","text":"In what ways do the landscapes of Bohemia and Moravia differ in terms of terrain and agriculture?"},{"cat":"Vodní toky","text":"Why is the European drainage divide passing through our country sometimes compared to a roof shedding water into different seas?"},{"cat":"Zkušenost","text":"What made your visit to a Czech national park or mountain area memorable?"},{"cat":"Názor","text":"What are the advantages and drawbacks of being a landlocked country without direct access to the sea?"},{"cat":"Hypotéza","text":"If climate change leads to hotter, drier summers in Central Europe, how could that impact Czech agriculture and river levels?"},{"cat":"Srovnání","text":"In terms of geography, how does the Czech Republic compare to neighbours that have either high Alpine peaks or a sea coastline?"}],"phrases":[{"head":"\u003cstrong>Geographically speaking, the Czech Republic is situated in...\u003c/strong>","gloss":"Ze zeměpisného hlediska se Česká republika nachází v...","note":"zeměpisná poloha"},{"head":"\u003cstrong>The country is completely surrounded by...\u003c/strong>","gloss":"Země je zcela obklopena...","note":"popis hranic"},{"head":"\u003cstrong>What is especially fascinating about our landscape is...\u003c/strong>","gloss":"Co je na naší krajině obzvláště fascinující, je...","note":"vyzdvižení zajímavosti"},{"head":"\u003cstrong>When you travel from north to south,...\u003c/strong>","gloss":"Když cestujete ze severu na jih,...","note":"popis průřezu zemí"},{"head":"\u003cstrong>An important feature of our river system is...\u003c/strong>","gloss":"Důležitým rysem naší říční sítě je...","note":"popis vodstva"},{"head":"\u003cstrong>Thanks to four distinct seasons,...\u003c/strong>","gloss":"Díky čtyřem odlišným ročním obdobím...","note":"souvislost s klimatem"},{"head":"\u003cstrong>To conclude, our geographic position makes the country...\u003c/strong>","gloss":"Na závěr, naše geografická poloha činí zemi...","note":"závěrečné shrnutí"}],"unverified":0},{"file":"tema-s20-education-school-system-learning.md","title":"Education, school system, learning","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu. Jazykové opravy: Claude, 25. 11. 2026 (#1158), čekají na kontrolu a schválení učitelem. Věcné opravy: Claude, 26. 11. 2026 (#1173), čekají na kontrolu a schválení učitelem.","s":20,"v":20,"vocab":[{"head":"\u003cstrong>grammar school\u003c/strong> /ˈɡræmə skuːl/ AmE /ˈɡræmər skuːl/ [C]","gloss":"gymnázium (POZOR: slovo \u003cem>gymnasium\u003c/em> znamená v angličtině tělocvičnu!)","example":"Eight-year grammar schools start after Year 5; four-year ones after Year 9."},{"head":"\u003cstrong>compulsory education\u003c/strong> (compulsory /kəmˈpʌlsəri/) [U]","gloss":"povinné vzdělávání (v ČR zahrnuje devět let povinné školní docházky a jeden povinný předškolní rok)","example":"In the Czech Republic, compulsory education consists of nine years of compulsory schooling alongside one mandatory preschool year."},{"head":"\u003cstrong>school-leaving examination\u003c/strong> (examination /ɪɡˌzæmɪˈneɪʃn/) [C]","gloss":"maturitní zkouška (často označovaná jako \u003cem>maturita exam\u003c/em>)","example":"Passing the school-leaving examination is the standard requirement for entering most university degree programmes."},{"head":"\u003cstrong>curriculum\u003c/strong> /kəˈrɪkjələm/ [C, plural curricula]","gloss":"vzdělávací program, školní vzdělávací plán (dřívější termín: školní osnovy)","example":"The modern school curriculum places greater emphasis on digital literacy."},{"head":"\u003cstrong>vocational school\u003c/strong> /vəʊˈkeɪʃənl skuːl/ [C]","gloss":"odborné učiliště, škola s výučním listem","example":"Students who prefer practical trades like carpentry or mechanics often choose a vocational school."},{"head":"\u003cstrong>higher education\u003c/strong> /ˌhaɪər edʒuˈkeɪʃn/ [U]","gloss":"vysokoškolské vzdělávání","example":"Enrolling in higher education opens up opportunities to pursue specialized research and academic professions."},{"head":"\u003cstrong>tuition fees\u003c/strong> (tuition /tjuˈɪʃn/ AmE /tuˈɪʃn/) [plural]","gloss":"školné","example":"Unlike many English and American universities that charge high tuition fees, Czech public universities provide degree programmes taught in Czech free of charge within the standard length of study."},{"head":"\u003cstrong>state school\u003c/strong> /ˈsteɪt skuːl/ [C]","gloss":"státní škola (bezplatná veřejná škola)","example":"The vast majority of Czech students attend a state school funded by the government."},{"head":"\u003cstrong>public school\u003c/strong> /ˌpʌblɪk ˈskuːl/ [C]","gloss":"prestižní soukromá škola (v britském systému, např. Eton či Harrow)","example":"In Britain, confusingly, an elite fee-paying independent boarding school is historically called a public school."},{"head":"\u003cstrong>critical thinking\u003c/strong> /ˌkrɪtɪkl ˈθɪŋkɪŋ/ [U]","gloss":"kritické myšlení","example":"Many modern teachers strive to teach critical thinking rather than simply forcing students to memorize facts."},{"head":"\u003cstrong>rote learning\u003c/strong> (rote /rəʊt/) [U]","gloss":"biflování, mechanické učení nazpaměť","example":"Relying on rote learning can mean you quickly forget the information right after taking the test."},{"head":"\u003cstrong>extracurricular activities\u003c/strong> (extracurricular /ˌekstrəkəˈrɪkjələ(r)/ AmE /ˌekstrəkəˈrɪkjələr/) [plural]","gloss":"mimoškolní aktivity, kroužky (pomnožné: \u003cem>activities are...\u003c/em>)","example":"Participating in extracurricular activities, like debating clubs or the school choir, can help build social skills."},{"head":"\u003cstrong>cram for an exam\u003c/strong> (cram /kræm/) (informal phrase)","gloss":"šprtat se na zkoušku (na poslední chvíli)","example":"Staying up all night to cram for an exam rarely leads to good long-term understanding."},{"head":"\u003cstrong>continuous assessment\u003c/strong> /kənˌtɪnjuəs əˈsesmənt/ [U]","gloss":"průběžné hodnocení (známkování v průběhu celého roku)","example":"Many educational systems combine final tests with continuous assessment based on essays and presentations."},{"head":"\u003cstrong>degree\u003c/strong> /dɪˈɡriː/ [C]","gloss":"vysokoškolský titul, akademický diplom","example":"Graduating with a master's degree typically requires submitting a detailed thesis and defending it before a committee."},{"head":"\u003cstrong>revise for\u003c/strong> (revise /rɪˈvaɪz/) (verb)","gloss":"opakovat si na (zkoušku nebo test)","example":"I have created a daily study schedule to revise for my upcoming maturita tests."},{"head":"\u003cstrong>attendance\u003c/strong> /əˈtendəns/ [U]","gloss":"školní docházka","example":"Good attendance helps you keep up with the rest of the class."},{"head":"\u003cstrong>headteacher / principal\u003c/strong> (headteacher /ˌhedˈtiːtʃə/ AmE /ˌhedˈtiːtʃər/) [C]","gloss":"ředitel / ředitelka školy","example":"The headteacher delivered an inspiring opening speech at the beginning of the academic year."},{"head":"\u003cstrong>specialise in\u003c/strong> (verb)","gloss":"specializovat se na","example":"In their final two years, students can choose optional seminars to specialise in biology or the humanities."},{"head":"\u003cstrong>academic achievement\u003c/strong> [C/U]","gloss":"studijní výsledky / úspěchy (průběžný prospěch a známky jsou spíše \u003cem>marks / grades\u003c/em>)","example":"The school awards book prizes to pupils with outstanding academic achievement."},{"head":"\u003cstrong>peer learning\u003c/strong> (peer /pɪə(r)/ AmE /pɪr/) [U]","gloss":"vzájemné učení mezi vrstevníky / spolužáky","example":"Studying in small groups promotes peer learning, as classmates explain difficult problems to one another."},{"head":"\u003cstrong>state-funded\u003c/strong> (adjective)","gloss":"financovaný státem","example":"Our grammar school is a state-funded institution that offers free quality education."}],"answer":["School and education take up a huge part of our everyday lives. As a student in my final year at a \u003cstrong>grammar school\u003c/strong> in České Budějovice, I have experienced the Czech education system firsthand. In our country, \u003cstrong>compulsory education\u003c/strong> covers nine years of compulsory schooling alongside one mandatory preschool year. After completing basic education, teenagers choose their path: some opt for practical training at a \u003cstrong>vocational school\u003c/strong>, while others choose secondary technical schools or academically demanding grammar schools.","Right now, my classmates and I are focused on preparing for the \u003cstrong>school-leaving examination\u003c/strong>, commonly known as the maturita. It is a major milestone that tests our knowledge of Czech, a foreign language or maths, and further subjects from the range that our school offers for our field of study. Success in these exams is the essential prerequisite for most students wishing to enter \u003cstrong>higher education\u003c/strong>. One great advantage of the Czech system over those of many English-speaking countries—such as England or the United States—is that public universities do not charge \u003cstrong>tuition fees\u003c/strong> for degree programmes taught in Czech within the standard length of study, which allows students from diverse backgrounds to earn a \u003cstrong>degree\u003c/strong>.","How we learn is just as important as what we learn. In the past, schools often emphasized \u003cstrong>rote learning\u003c/strong>, expecting students to memorize dates and formulas. Today, there is a welcome shift in education policy towards teaching \u003cstrong>critical thinking\u003c/strong>, media literacy, and practical problem-solving. Outside regular lessons, taking part in \u003cstrong>extracurricular activities\u003c/strong> like sports or language clubs can help us build teamwork and friendships. In short, a good school should not just test our memory; it should inspire curiosity and prepare young people for real adult life."],"answer_info":"B2, ~250 slov","questions":[{"cat":"Popis","text":"How is the Czech educational system structured from nursery school up to university level?"},{"cat":"Srovnání","text":"In what ways do British secondary schools differ from Czech grammar schools in terms of exams and subject choices?"},{"cat":"Zkušenost","text":"What study methods work best for you when you revise for a demanding school test?"},{"cat":"Názor","text":"Is critical thinking more important in schools than memorizing factual information? Why?"},{"cat":"Popis","text":"What is the British distinction between a state school and a historic public school?"},{"cat":"Hypotéza","text":"If you had the authority to change three things about secondary school curricula in the Czech Republic, what would you reform?"},{"cat":"Názor","text":"What are the strongest arguments for and against charging university tuition fees?"}],"phrases":[{"head":"\u003cstrong>When we look at our school system, we can see that...\u003c/strong>","gloss":"Když se podíváme na náš školní systém, vidíme, že...","note":"úvod k tématu"},{"head":"\u003cstrong>A crucial turning point for students is...\u003c/strong>","gloss":"Zásadním zlomovým bodem pro studenty je...","note":"vyzdvižení klíčového momentu"},{"head":"\u003cstrong>Unlike traditional rote learning, modern ways of learning...\u003c/strong>","gloss":"Na rozdíl od tradičního biflování moderní způsoby učení...","note":"kontrast způsobů učení"},{"head":"\u003cstrong>One of the greatest benefits of our system is that...\u003c/strong>","gloss":"Jednou z největších výhod našeho systému je, že...","note":"vyzdvižení kladu"},{"head":"\u003cstrong>From a student's point of view,...\u003c/strong>","gloss":"Z pohledu studenta...","note":"osobní perspektiva"},{"head":"\u003cstrong>It is essential to find a balance between...\u003c/strong>","gloss":"Je zásadní najít rovnováhu mezi...","note":"vyvážení teorie a praxe"},{"head":"\u003cstrong>To sum up, the primary purpose of education should be...\u003c/strong>","gloss":"Abych to shrnul, hlavním smyslem vzdělávání by mělo být...","note":"závěrečná myšlenka"}],"unverified":0},{"file":"tema-s21-uk-usa-history-people.md","title":"The UK and the USA – history and people","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu. Jazykové opravy: Claude, 25. 11. 2026 (#1158), čekají na kontrolu a schválení učitelem. Věcné opravy: Claude, 26. 11. 2026 (#1173), čekají na kontrolu a schválení učitelem.","s":21,"v":21,"vocab":[{"head":"\u003cstrong>conquest\u003c/strong> /ˈkɒŋkwest/ AmE /ˈkɑːŋkwest/ [C/U]","gloss":"dobytí, podmanění","example":"The Norman Conquest of 1066 under William the Conqueror dramatically transformed the English language and culture."},{"head":"\u003cstrong>Native Americans\u003c/strong> [plural]","gloss":"původní obyvatelé Ameriky, indiáni","example":"Long before European explorers arrived, diverse tribes of Native Americans inhabited the continent."},{"head":"\u003cstrong>colony\u003c/strong> /ˈkɒləni/ AmE /ˈkɑːləni/ [C]","gloss":"kolonie","example":"The United States began as thirteen British colonies along the eastern seaboard of North America."},{"head":"\u003cstrong>Declaration of Independence\u003c/strong> (declaration /ˌdekləˈreɪʃn/; independence /ˌɪndɪˈpendəns/) [proper noun]","gloss":"Deklarace nezávislosti (klíčový americký dokument z roku 1776; obecně prohlášení nezávislosti: \u003cem>declaration of independence\u003c/em> [C])","example":"Adopted on July 4, 1776, the Declaration of Independence announced the birth of a new sovereign nation."},{"head":"\u003cstrong>civil war\u003c/strong> /ˌsɪvl ˈwɔː(r)/ AmE /ˌsɪvl ˈwɔːr/ [C]","gloss":"občanská válka","example":"The American Civil War between the Union and the slave-holding Confederacy lasted from 1861 to 1865."},{"head":"\u003cstrong>abolition of slavery\u003c/strong> (abolition /ˌæbəˈlɪʃn/; slavery /ˈsleɪvəri/) [U]","gloss":"zrušení otroctví","example":"Abraham Lincoln played a vital role in the abolition of slavery; the Thirteenth Amendment of 1865 banned it except as a punishment for crime."},{"head":"\u003cstrong>Industrial Revolution\u003c/strong> (industrial /ɪnˈdʌstriəl/; revolution /ˌrevəˈluːʃn/) [proper noun / U]","gloss":"průmyslová revoluce","example":"The Industrial Revolution started in eighteenth-century Britain, replacing manual labour with machinery."},{"head":"\u003cstrong>melting pot\u003c/strong> /ˈmeltɪŋ pɒt/ AmE /ˈmeltɪŋ pɑːt/ [C, usually singular]","gloss":"tavicí kotel (společnost, kde se mísí různé kultury v novou identitu)","example":"For generations, the United States was described as a melting pot where millions of immigrants blended together."},{"head":"\u003cstrong>empire\u003c/strong> /ˈempaɪə/ AmE /ˈempaɪər/ [C]","gloss":"impérium, říše","example":"At its peak, the British Empire covered roughly one quarter of the world's land surface and governed hundreds of millions of people."},{"head":"\u003cstrong>settler\u003c/strong> /ˈsetlə/ AmE /ˈsetlər/ [C]","gloss":"osadník, kolonista (přistěhovalec obecně je \u003cem>immigrant\u003c/em>)","example":"Early European settlers faced harsh winters, disease, and starvation when building their first settlements."},{"head":"\u003cstrong>civil rights movement\u003c/strong> (civil /ˈsɪvl/) [C, usually singular]","gloss":"hnutí za občanská práva (v textu se členem a malými písmeny: \u003cem>the civil rights movement\u003c/em>)","example":"Led by people such as Martin Luther King Jr., the civil rights movement in the 1960s fought against racial segregation."},{"head":"\u003cstrong>monarch\u003c/strong> /ˈmɒnək/ AmE /ˈmɑːnərk/ [C]","gloss":"panovník, král či královna","example":"King Charles III serves as the constitutional monarch of the United Kingdom."},{"head":"\u003cstrong>reign\u003c/strong> /reɪn/ [C]","gloss":"vláda, panování","example":"The Victorian era was marked by the long reign of Queen Victoria, during which Britain expanded industrially."},{"head":"\u003cstrong>multicultural society\u003c/strong> (multicultural /ˌmʌltiˈkʌltʃərəl/) [C]","gloss":"multikulturní společnost","example":"Post-war immigration helped to make Britain a vibrant multicultural society."},{"head":"\u003cstrong>heritage\u003c/strong> /ˈherɪtɪdʒ/ [U]","gloss":"historické a kulturní dědictví","example":"Both countries take pride in preserving their architectural, political, and literary heritage."},{"head":"\u003cstrong>Founding Fathers\u003c/strong> [proper noun, plural]","gloss":"Otcové zakladatelé (klíčové osobnosti vzniku a ústavy USA)","example":"Figures like George Washington, Thomas Jefferson, and Benjamin Franklin are revered as the Founding Fathers of the United States."},{"head":"\u003cstrong>treaty\u003c/strong> /ˈtriːti/ [C]","gloss":"mezinárodní smlouva, úmluva (mírová smlouva je specificky \u003cem>peace treaty\u003c/em>)","example":"The Treaty of Paris in 1783 officially brought the American Revolutionary War to an end."},{"head":"\u003cstrong>immigrant\u003c/strong> /ˈɪmɪɡrənt/ [C]","gloss":"přistěhovalec, imigrant","example":"Millions of hopeful European immigrants entered New York Harbor through Ellis Island after it opened in 1892."},{"head":"\u003cstrong>racial segregation\u003c/strong> (racial /ˈreɪʃl/; segregation /ˌseɡrɪˈɡeɪʃn/) [U]","gloss":"rasová segregace","example":"Before the 1960s, African Americans in southern states were subjected to legal racial segregation in schools and on buses."},{"head":"\u003cstrong>Pilgrim Fathers\u003c/strong> (pilgrim /ˈpɪlɡrɪm/) [plural]","gloss":"Otcové poutníci (angličtí puritáni, kteří připluli na lodi Mayflower roku 1620)","example":"The Pilgrim Fathers established Plymouth Colony in search of religious freedom from the Church of England."},{"head":"\u003cstrong>struggle for freedom\u003c/strong> (struggle /ˈstrʌɡl/; freedom /ˈfriːdəm/) [C/U]","gloss":"boj za svobodu","example":"A struggle for freedom from colonial rule can inspire democratic movements in other countries."},{"head":"\u003cstrong>diversity\u003c/strong> /daɪˈvɜːsəti/ AmE /daɪˈvɜːrsəti/ [U]","gloss":"rozmanitost","example":"The ethnic and cultural diversity of modern American cities reflects waves of immigration over two centuries."}],"answer":["The histories of the United Kingdom and the United States are closely linked, but each nation followed its own path. British history stretches back thousands of years. A major turning point came in 1066 with the Norman \u003cstrong>Conquest\u003c/strong>, which brought French influences into the English language and created a strong royal government. Over the centuries, Britain grew into a major power. The \u003cstrong>Industrial Revolution\u003c/strong>, which began in the eighteenth century, transformed it into the world's workshop, while the \u003cstrong>British Empire\u003c/strong> spread the English language, legal principles, and sports across the world. Since 1945, waves of immigration have helped to turn modern Britain into a diverse \u003cstrong>multicultural society\u003c/strong>.","Across the Atlantic, American history started with ancient \u003cstrong>Native American\u003c/strong> nations and later European \u003cstrong>settlers\u003c/strong>, including the \u003cstrong>Pilgrim Fathers\u003c/strong> who sailed over in 1620. Frustration with British taxes and other aspects of British rule led the thirteen \u003cstrong>colonies\u003c/strong> to fight the Revolutionary War, and in 1776 they adopted the \u003cstrong>Declaration of Independence\u003c/strong>. It was drafted by Thomas Jefferson and supported by \u003cstrong>Founding Fathers\u003c/strong> like Benjamin Franklin and George Washington.","The young republic soon faced profound challenges. The American \u003cstrong>Civil War\u003c/strong> in the 1860s preserved the nation and led to the \u003cstrong>abolition of slavery\u003c/strong>. President Abraham Lincoln had supported ending slavery. A century later, the \u003cstrong>civil rights movement\u003c/strong>, led by people such as Martin Luther King Jr., bravely fought against \u003cstrong>racial segregation\u003c/strong>. Often described as a \u003cstrong>melting pot\u003c/strong>, the United States was built by millions of \u003cstrong>immigrants\u003c/strong> seeking freedom and opportunity. Together, British parliamentary roots and American democratic energy remain powerful forces today."],"answer_info":"B2, ~250 slov","questions":[{"cat":"Popis","text":"What was the significance of the Norman Conquest in 1066 for British culture and language?"},{"cat":"Srovnání","text":"In what ways did the historical development of democracy differ between the British monarchy and the American republic?"},{"cat":"Příčiny a důsledky","text":"What main factors caused the American colonies to declare independence from Great Britain in 1776?"},{"cat":"Popis","text":"What role did Abraham Lincoln play in the American Civil War and the abolition of slavery?"},{"cat":"Názor","text":"Why is Martin Luther King Jr. considered such an influential figure in twentieth-century American history?"},{"cat":"Srovnání konceptů","text":"How does the traditional American metaphor of a \"melting pot\" compare to the modern concept of a \"salad bowl\" or mosaic?"},{"cat":"Hypotéza","text":"If the American colonists had negotiated full representation in the British Parliament in the 1770s, how might history have changed?"}],"phrases":[{"head":"\u003cstrong>A major turning point in their history was...\u003c/strong>","gloss":"Hlavním zlomovým bodem v jejich historii bylo...","note":"označení klíčové události"},{"head":"\u003cstrong>Historically speaking, both nations...\u003c/strong>","gloss":"Z historického hlediska oba národy...","note":"historické srovnání"},{"head":"\u003cstrong>The roots of this conflict can be traced back to...\u003c/strong>","gloss":"Kořeny tohoto konfliktu lze vystopovat až k...","note":"hledání příčin"},{"head":"\u003cstrong>It is widely recognized that...\u003c/strong>","gloss":"Je všeobecně uznáváno, že...","note":"odkaz na historický fakt"},{"head":"\u003cstrong>In the aftermath of the war,...\u003c/strong>","gloss":"V období po válce / v důsledku války...","note":"popis následků"},{"head":"\u003cstrong>When we look at modern society, it is clear that...\u003c/strong>","gloss":"Když se podíváme na moderní společnost, je jasné, že...","note":"popis složení obyvatelstva"},{"head":"\u003cstrong>To sum up, the historical legacy of both countries...\u003c/strong>","gloss":"Abych to shrnul, historický odkaz obou zemí...","note":"závěrečné vyhodnocení"}],"unverified":0},{"file":"tema-s22-cr-history-people.md","title":"The CR – history and people","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu.","s":22,"v":22,"vocab":[{"head":"\u003cstrong>reign\u003c/strong> /reɪn/ [C]","gloss":"panování, vláda","example":"During the glorious reign of Charles IV in the fourteenth century, Prague flourished as the cultural capital of the Holy Roman Empire."},{"head":"\u003cstrong>patron saint\u003c/strong> /ˌpeɪtrən ˈseɪnt/ [C]","gloss":"svatý ochránce, zemský patron (svatý Václav byl historicky kníže – \u003cem>Duke of Bohemia\u003c/em>, v britské koledě J. M. Neala z roku 1853 folklórně označovaný jako \u003cem>Good King Wenceslas\u003c/em>)","example":"Saint Wenceslas is venerated as the principal patron saint of the Czech nation."},{"head":"\u003cstrong>Holy Roman Emperor\u003c/strong> (holy /ˈhəʊli/; roman /ˈrəʊmən/; emperor /ˈempərə(r)/ AmE /ˈempərər/) [C]","gloss":"císař Svaté říše římské","example":"Charles IV served as both King of Bohemia and Holy Roman Emperor, founding Charles University in 1348."},{"head":"\u003cstrong>Hussite Wars\u003c/strong> [proper noun, plural]","gloss":"husitské války (nikoli pouhé lokální povstání – \u003cem>uprising\u003c/em>)","example":"The Hussite Wars in the fifteenth century were driven by religious reform and resistance to papal authority."},{"head":"\u003cstrong>national revival\u003c/strong> (revival /rɪˈvaɪvl/) [proper noun / U]","gloss":"národní obrození","example":"In the nineteenth century, scholars and writers led the Czech National Revival to revive our language and culture."},{"head":"\u003cstrong>founder\u003c/strong> /ˈfaʊndə/ AmE /ˈfaʊndər/ [C]","gloss":"zakladatel","example":"Tomáš Garrigue Masaryk is revered as the philosophical and political founder of independent Czechoslovakia in 1918."},{"head":"\u003cstrong>milestone\u003c/strong> /ˈmaɪlstəʊn/ AmE /ˈmaɪlstoʊn/ [C]","gloss":"historický milník","example":"The proclamation of Czechoslovak independence on October 28, 1918, was a monumental milestone in our history."},{"head":"\u003cstrong>occupation\u003c/strong> /ˌɒkjuˈpeɪʃn/ AmE /ˌɑːkjuˈpeɪʃn/ [C/U]","gloss":"okupace, vojenské obsazení (na úrovni B1 také běžně: zaměstnání, povolání)","example":"The Nazi occupation during the Second World War brought immense suffering and loss of life to the Czech lands."},{"head":"\u003cstrong>totalitarian rule\u003c/strong> (totalitarian /təʊˌtæləˈteəriən/ AmE /təʊˌtæləˈteriən/) [U]","gloss":"totalitní vláda","example":"More than four decades of Communist totalitarian rule restricted basic freedoms and persecuted political critics."},{"head":"\u003cstrong>invasion\u003c/strong> /ɪnˈveɪʒn/ [C]","gloss":"invaze, vojenský vpád","example":"In August 1968, the Soviet-led Warsaw Pact invasion violently crushed the democratic hopes of the Prague Spring."},{"head":"\u003cstrong>dissident\u003c/strong> /ˈdɪsɪdənt/ [C]","gloss":"disident, odpůrce režimu","example":"Playwright and dissident Václav Havel bravely spoke out against state censorship and human rights abuses."},{"head":"\u003cstrong>Velvet Revolution\u003c/strong> (velvet /ˈvelvɪt/; revolution /ˌrevəˈluːʃn/) [proper noun]","gloss":"sametová revoluce (listopad 1989)","example":"The peaceful student demonstrations of the Velvet Revolution in November 1989 brought about the fall of Communism."},{"head":"\u003cstrong>peaceful transition\u003c/strong> (transition /trænˈzɪʃn/) [C]","gloss":"mírový přechod","example":"The Velvet Revolution ensured a peaceful transition from authoritarian rule to democracy without bloodshed."},{"head":"\u003cstrong>dissolution\u003c/strong> /ˌdɪsəˈluːʃn/ [U]","gloss":"rozpuštění, zánik, rozpad (státu)","example":"The peaceful dissolution of Czechoslovakia on January 1, 1993, is commonly known as the Velvet Divorce."},{"head":"\u003cstrong>sovereignty\u003c/strong> /ˈsɒvrənti/ AmE /ˈsɑːvrənti/ [U]","gloss":"suverenita, státní svrchovanost","example":"Joining NATO and the European Union cemented the democratic sovereignty and security of the modern Czech Republic."},{"head":"\u003cstrong>heritage\u003c/strong> /ˈherɪtɪdʒ/ [U]","gloss":"kulturní a historické dědictví","example":"Czechs take immense pride in their musical heritage, from Bedřich Smetana to Antonín Dvořák."},{"head":"\u003cstrong>sense of humour\u003c/strong> (humour /ˈhjuːmə(r)/ AmE /ˈhjuːmər/) [U]","gloss":"smysl pro humor","example":"Czech people are renowned for their dry, self-deprecating sense of humour, often using irony to cope with adversity."},{"head":"\u003cstrong>hospitality\u003c/strong> /ˌhɒspɪˈtæləti/ AmE /ˌhɑːspɪˈtæləti/ [U]","gloss":"pohostinnost","example":"Foreign tourists frequently praise the warm hospitality they encounter in rural guesthouses and wineries."},{"head":"\u003cstrong>weekend cottage\u003c/strong> [C]","gloss":"víkendová chata, chalupa (české chataření se vyjadřuje slovesně, např. \u003cem>going to the cottage\u003c/em> nebo \u003cem>spending weekends at a cottage\u003c/em>)","example":"Many Czech families escape the busy city to relax at a cosy weekend cottage in the countryside."},{"head":"\u003cstrong>persecute\u003c/strong> /ˈpɜːsɪkjuːt/ AmE /ˈpɜːrsɪkjuːt/ (verb)","gloss":"politicky nebo nábožensky pronásledovat (POZOR na záměnu s \u003cem>prosecute\u003c/em> = soudně stíhat, obžalovat)","example":"The Communist secret police regularly persecuted independent thinkers and religious believers."},{"head":"\u003cstrong>oppression\u003c/strong> /əˈpreʃn/ [U]","gloss":"útlak, poroba","example":"Generations of Czechs demonstrated tremendous resilience in the face of foreign oppression."},{"head":"\u003cstrong>democracy\u003c/strong> /dɪˈmɒkrəsi/ AmE /dɪˈmɑːkrəsi/ [C/U]","gloss":"demokracie (jako systém [U], jako demokratický stát [C])","example":"Preserving a vibrant democracy requires active civic participation and critical thinking."}],"answer":["Czech history is a fascinating story of struggles for independence, golden eras, and cultural resilience in the heart of Europe. A famous high point came in the fourteenth century under King of Bohemia and \u003cstrong>Holy Roman Emperor\u003c/strong> Charles IV. During his \u003cstrong>reign\u003c/strong>, Prague blossomed with the founding of Charles University in 1348 and the construction of Charles Bridge. Centuries later, after surviving Habsburg rule and the cultural renewal of the \u003cstrong>National Revival\u003c/strong>, our nation achieved full independence in 1918. Led by our respected \u003cstrong>founder\u003c/strong> and first president, Tomáš Garrigue Masaryk, the First Czechoslovak Republic became a thriving \u003cstrong>democracy\u003c/strong> in Central Europe.","However, the twentieth century also brought dark periods of foreign \u003cstrong>oppression\u003c/strong>. The devastating Nazi \u003cstrong>occupation\u003c/strong> during the Second World War was followed by over forty years of Communist \u003cstrong>totalitarian rule\u003c/strong>. When the reformist Prague Spring of 1968 offered hope of change, it was crushed by a foreign Warsaw Pact \u003cstrong>invasion\u003c/strong>. Despite decades of persecution, courageous \u003cstrong>dissidents\u003c/strong> like Václav Havel refused to remain silent. In November 1989, student protests sparked the \u003cstrong>Velvet Revolution\u003c/strong>, bringing a swift and \u003cstrong>peaceful transition\u003c/strong> back to freedom. Shortly afterwards, on January 1, 1993, Czechoslovakia underwent a peaceful \u003cstrong>dissolution\u003c/strong>, creating the modern Czech Republic.","Today, Czech people are shaped by this rich history. We are known for our dry, ironic \u003cstrong>sense of humour\u003c/strong>, our modesty, and our love for spending weekends in nature at a family \u003cstrong>weekend cottage\u003c/strong>. We take pride in our architectural and musical \u003cstrong>heritage\u003c/strong>, cherishing our hard-won freedom in a peaceful Europe."],"answer_info":"B2, ~255 slov","questions":[{"cat":"Popis","text":"What major achievements make Charles IV one of the most celebrated monarchs in Czech history?"},{"cat":"Příčiny a souvislosti","text":"How did Tomáš Garrigue Masaryk contribute to the founding of independent Czechoslovakia in 1918?"},{"cat":"Význam","text":"What were the main consequences of the 1968 Warsaw Pact invasion for Czechoslovak society?"},{"cat":"Popis","text":"Why was the revolution of November 1989 named the \"Velvet Revolution\"?"},{"cat":"Názor","text":"What character traits and cultural habits do you consider typical of Czech people today?"},{"cat":"Srovnání","text":"How did the peaceful \"Velvet Divorce\" of 1993 compare to the violent conflicts accompanying the breakup of other states in the 1990s?"},{"cat":"Hypotéza","text":"If Britain and France had not signed the Munich Agreement with Hitler in September 1938, how might the course of European history have differed?"}],"phrases":[{"head":"\u003cstrong>When we delve into Czech history,...\u003c/strong>","gloss":"Když se ponoříme do české historie,...","note":"historický úvod"},{"head":"\u003cstrong>A defining milestone in our national journey was...\u003c/strong>","gloss":"Zásadním milníkem v naší národní cestě bylo...","note":"zdůraznění významu"},{"head":"\u003cstrong>Despite facing decades of oppression, our people...\u003c/strong>","gloss":"Přestože naši lidé čelili desetiletím útlaku,...","note":"vyzdvižení odolnosti"},{"head":"\u003cstrong>What stands out about this period is...\u003c/strong>","gloss":"To, co v tomto období vystupuje do popředí, je...","note":"upozornění na klíčový rys"},{"head":"\u003cstrong>In the eyes of modern Czechs,...\u003c/strong>","gloss":"V očích dnešních Čechů...","note":"pohled současníků"},{"head":"\u003cstrong>It clearly proves the resilience of our nation...\u003c/strong>","gloss":"Jasně to dokazuje houževnatost našeho národa...","note":"vyhodnocení"},{"head":"\u003cstrong>To summarize the Czech national spirit,...\u003c/strong>","gloss":"Abych shrnul českého národního ducha,...","note":"závěrečné shrnutí"}],"unverified":0},{"file":"tema-s23-media-and-communication.md","title":"Media and communication","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu. Jazykové opravy: Claude, 25. 11. 2026 (#1158), čekají na kontrolu a schválení učitelem. Věcné opravy: Claude, 26. 11. 2026 (#1173), čekají na kontrolu a schválení učitelem.","s":23,"v":23,"vocab":[{"head":"\u003cstrong>mass media\u003c/strong> (mass /mæs/) [plural or singular]","gloss":"masová média, hromadné sdělovací prostředky","example":"Mass media play a fundamental role in shaping public opinion and informing citizens."},{"head":"\u003cstrong>broadsheet\u003c/strong> /ˈbrɔːdʃiːt/ [C]","gloss":"seriózní noviny (zaměřené na hlubší analýzy a politiku)","example":"Educated readers often prefer a broadsheet with in-depth reporting over superficial tabloids."},{"head":"\u003cstrong>tabloid\u003c/strong> /ˈtæblɔɪd/ [C]","gloss":"bulvární tisk, bulvár","example":"Tabloids attract readers with celebrity scandals, dramatic headlines, and sensational photographs."},{"head":"\u003cstrong>fake news\u003c/strong> /ˌfeɪk ˈnjuːz/ AmE /ˌfeɪk ˈnuːz/ [U]","gloss":"falešné zprávy, dezinformace","example":"Social media algorithms can rapidly spread fake news before fact-checkers have time to react."},{"head":"\u003cstrong>media literacy\u003c/strong> (literacy /ˈlɪtərəsi/) [U]","gloss":"mediální gramotnost","example":"Teaching media literacy in secondary schools can help teenagers recognize manipulation and online propaganda."},{"head":"\u003cstrong>reliable source\u003c/strong> [C]","gloss":"důvěryhodný / spolehlivý zdroj","example":"Before sharing an alarming article online, always verify whether it comes from a reliable source."},{"head":"\u003cstrong>social media platform\u003c/strong> [C]","gloss":"platforma sociálních sítí","example":"Teens use popular social media platforms to chat, share photos, and follow news."},{"head":"\u003cstrong>headline\u003c/strong> /ˈhedlaɪn/ [C]","gloss":"novinový titulek","example":"A sensational headline is often designed to provoke an emotional reaction rather than inform."},{"head":"\u003cstrong>censorship\u003c/strong> /ˈsensəʃɪp/ AmE /ˈsensərʃɪp/ [U]","gloss":"cenzura","example":"Totalitarian regimes enforce strict censorship to silence political opposition and control information."},{"head":"\u003cstrong>freedom of speech\u003c/strong> (freedom /ˈfriːdəm/) [U]","gloss":"svoboda slova","example":"Freedom of speech is a cornerstone of every democratic society, allowing citizens to express opinions openly."},{"head":"\u003cstrong>bias\u003c/strong> /ˈbaɪəs/ [U/C]","gloss":"předpojatost, zaujatost","example":"Journalists must be trained to report objectively and avoid political bias in their news coverage."},{"head":"\u003cstrong>broadcast\u003c/strong> /ˈbrɔːdkɑːst/ AmE /ˈbrɔːdkæst/ [C/U; verb]","gloss":"vysílání, relace; vysílat","example":"The national television network broadcasts the evening news at seven o'clock every day."},{"head":"\u003cstrong>commercial\u003c/strong> /kəˈmɜːʃl/ AmE /kəˈmɜːrʃl/ [C]","gloss":"reklama (televizní nebo rozhlasová)","example":"Many viewers switch channels as soon as the commercials start."},{"head":"\u003cstrong>screen time\u003c/strong> /ˈskriːn taɪm/ [U]","gloss":"čas strávený před obrazovkou","example":"Psychologists advise teenagers to limit their daily screen time to prevent poor sleep and anxiety."},{"head":"\u003cstrong>investigative journalism\u003c/strong> (investigative /ɪnˈvestɪɡətɪv/ AmE /ɪnˈvestɪɡeɪtɪv/; journalism /ˈdʒɜːnəlɪzəm/ AmE /ˈdʒɜːrnəlɪzəm/) [U]","gloss":"investigativní žurnalistika","example":"Rigorous investigative journalism can expose political corruption and corporate misconduct."},{"head":"\u003cstrong>influencer\u003c/strong> /ˈɪnfluənsə/ AmE /ˈɪnfluənsər/ [C]","gloss":"influencer (tvůrce obsahu na sociálních sítích s velkým vlivem)","example":"Many fashion brands collaborate with a prominent influencer to promote new cosmetic lines."},{"head":"\u003cstrong>echo chamber\u003c/strong> /ˈekəʊ tʃeɪmbə(r)/ AmE /ˈekəʊ tʃeɪmbər/ [C]","gloss":"názorová bublina (prostředí, kde se setkáváme jen s názory, se kterými souhlasíme)","example":"Social networks can trap users in an echo chamber where opposing viewpoints are filtered out."},{"head":"\u003cstrong>cyberbullying\u003c/strong> /ˈsaɪbəbʊliɪŋ/ AmE /ˈsaɪbərbʊliɪŋ/ [U]","gloss":"kyberšikana","example":"Anonymous online harassment and cyberbullying can cause severe emotional harm to young victims."},{"head":"\u003cstrong>verify information\u003c/strong> (verify /ˈverɪfaɪ/) (
