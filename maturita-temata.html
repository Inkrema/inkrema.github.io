ng grammar textbooks?"}],"phrases":[{"head":"\u003cstrong>I have always been fond of...\u003c/strong>","gloss":"Vždy jsem měl v oblibě...","note":"vyjádření osobní záliby"},{"head":"\u003cstrong>What captivates me most about a story is...\u003c/strong>","gloss":"Co mě na příběhu nejvíce upoutá, je...","note":"zdůraznění klíčového prvku"},{"head":"\u003cstrong>Speaking from personal experience,...\u003c/strong>","gloss":"Když mluvím z vlastní zkušenosti,...","note":"osobní svědectví"},{"head":"\u003cstrong>While some people argue that..., I take the view that...\u003c/strong>","gloss":"Zatímco někteří tvrdí, že..., já zastávám názor, že...","note":"kontrast názorů"},{"head":"\u003cstrong>It allows the reader to put themselves in someone else's shoes.\u003c/strong>","gloss":"Umožňuje to čtenáři vžít se do kůže někoho jiného.","note":"idiom pro empatii"},{"head":"\u003cstrong>All things considered, books provide...\u003c/strong>","gloss":"Když vše zvážím, knihy poskytují...","note":"zobecnění"},{"head":"\u003cstrong>To put it another way,...\u003c/strong>","gloss":"Jinými slovy,...","note":"přeformulování myšlenky"}],"unverified":0},{"file":"tema-v1-william-shakespeare.md","title":"William Shakespeare","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu. Jazykové opravy: Claude, 25. 11. 2026 (#1158), čekají na kontrolu a schválení učitelem. Věcné opravy: Claude, 26. 11. 2026 (#1173), čekají na kontrolu a schválení učitelem.","s":null,"v":1,"vocab":[{"head":"\u003cstrong>playwright\u003c/strong> /ˈpleɪraɪt/ [C]","gloss":"dramatik, autor divadelních her","example":"William Shakespeare is widely celebrated as the greatest playwright in the English language."},{"head":"\u003cstrong>tragedy\u003c/strong> /ˈtrædʒədi/ [C/U]","gloss":"tragédie (žánr i konkrétní hra)","example":"Macbeth is a powerful Jacobean tragedy exploring political ambition and guilt."},{"head":"\u003cstrong>comedy\u003c/strong> /ˈkɒmədi/ AmE /ˈkɑːmədi/ [C/U]","gloss":"komedie (žánr i konkrétní hra)","example":"A Midsummer Night's Dream is a popular romantic comedy full of magic and comic misunderstandings."},{"head":"\u003cstrong>sonnet\u003c/strong> /ˈsɒnɪt/ AmE /ˈsɑːnɪt/ [C]","gloss":"sonet (báseň o čtrnácti verších)","example":"Shakespeare wrote a celebrated collection of 154 sonnets dealing with love, beauty, and mortality."},{"head":"\u003cstrong>soliloquy\u003c/strong> /səˈlɪləkwi/ [C]","gloss":"jevištní samomluva, dramatický monolog postavy na scéně","example":"Hamlet's famous speech \"To be or not to be\" is one of the best-known soliloquies in English theatre."},{"head":"\u003cstrong>stage\u003c/strong> /steɪdʒ/ [C]","gloss":"divadelní jeviště","example":"In Elizabethan public theatres, female roles on stage were usually performed by boys or young men."},{"head":"\u003cstrong>Globe Theatre / the Globe\u003c/strong> (globe /ɡləʊb/) [proper noun]","gloss":"divadlo Globe (alžbětinské divadlo s nezastřešeným vnitřním dvorem spojené se Shakespearem)","example":"Audiences in the pit stood around the stage of the Globe Theatre, while wealthier patrons sat in covered galleries."},{"head":"\u003cstrong>the Elizabethan era\u003c/strong> (elizabethan /ɪˌlɪzəˈbiːθn/; era /ˈɪərə/ AmE /ˈɪrə/) [proper noun / U]","gloss":"alžbětinská doba (vláda Alžběty I.; Shakespeare tvořil i v následující jakobínské době)","example":"English drama experienced an extraordinary golden age during the Elizabethan era."},{"head":"\u003cstrong>tragic flaw\u003c/strong> (tragic /ˈtrædʒɪk/; flaw /flɔː/) [C]","gloss":"osudová / tragická slabina hrdiny","example":"Othello's intense jealousy proved to be the tragic flaw that brought about his destruction."},{"head":"\u003cstrong>betrayal\u003c/strong> /bɪˈtreɪəl/ [U/C]","gloss":"zrada","example":"Themes of political ambition and betrayal are central to Roman tragedies like Julius Caesar."},{"head":"\u003cstrong>ambition\u003c/strong> /æmˈbɪʃn/ [U]","gloss":"ctižádost, ctižádostivost","example":"Macbeth's uncontrollable ambition leads him to assassinate King Duncan to seize the throne."},{"head":"\u003cstrong>adaptation\u003c/strong> /ˌædæpˈteɪʃn/ [C]","gloss":"adaptace, zpracování (filmové, divadelní)","example":"Director Baz Luhrmann created a modern film adaptation of Romeo and Juliet in 1996."},{"head":"\u003cstrong>quotation\u003c/strong> /kwəʊˈteɪʃn/ [C]","gloss":"citát","example":"Famous lines, such as \"All the world's a stage\" from As You Like It, have become widely recognized quotations from Shakespeare."},{"head":"\u003cstrong>timeless\u003c/strong> /ˈtaɪmləs/ (adjective)","gloss":"nadčasový","example":"His plays can feel timeless because they address universal human emotions like love, greed, and envy."},{"head":"\u003cstrong>acting troupe\u003c/strong> (acting /ˈæktɪŋ/; troupe /truːp/) [C]","gloss":"herecká společnost / divadelní soubor","example":"Shakespeare acted and held shares in the Lord Chamberlain's Men, a prominent London acting troupe."},{"head":"\u003cstrong>jealousy\u003c/strong> /ˈdʒeləsi/ [U]","gloss":"žárlivost","example":"Destructive jealousy consumes Othello after he is manipulated by the villain Iago."},{"head":"\u003cstrong>verse\u003c/strong> /vɜːs/ AmE /vɜːrs/ [U]","gloss":"veršovaná řeč, básnický jazyk / poezie (v divadle protiklad prózy; jednotlivý verš/řádek se v angličtině častěji označuje jako \u003cem>line\u003c/em> [C])","example":"Shakespeare skilfully alternated between rhythmic blank verse and prose, frequently using verse for elevated moments or noble characters."},{"head":"\u003cstrong>rivalry / feud\u003c/strong> (rivalry /ˈraɪvlri/) [U/C]","gloss":"\u003cem>rivalry\u003c/em>: soupeření, rivalita; \u003cem>feud\u003c/em>: dlouholeté nepřátelství, spor","example":"The bitter feud between the Capulets and Montagues prevents Romeo and Juliet from being together."},{"head":"\u003cstrong>fateful\u003c/strong> /ˈfeɪtfl/ (adjective)","gloss":"osudový","example":"A fateful miscommunication leads the young lovers to their premature deaths in the family tomb."},{"head":"\u003cstrong>performance\u003c/strong> /pəˈfɔːməns/ AmE /pərˈfɔːrməns/ [C]","gloss":"divadelní představení","example":"A live theatre performance of A Midsummer Night's Dream brings magical forest scenes alive."},{"head":"\u003cstrong>masterpiece\u003c/strong> /ˈmɑːstəpiːs/ AmE /ˈmæstərpiːs/ [C]","gloss":"mistrovské dílo","example":"King Lear is regarded by many literary scholars as a dramatic masterpiece."},{"head":"\u003cstrong>human nature\u003c/strong> /ˌhjuːmən ˈneɪtʃə(r)/ AmE /ˌhjuːmən ˈneɪtʃər/ [U]","gloss":"lidská přirozenost, lidská povaha","example":"Shakespeare had a deep understanding of the complex contradictions of human nature."}],"answer":["William Shakespeare is widely regarded as the greatest \u003cstrong>playwright\u003c/strong> in English literature. Born in Stratford-upon-Avon, he spent much of his professional life in London, writing during both the Elizabethan and Jacobean eras. He was not only a writer, but also an actor and shareholder in an \u003cstrong>acting troupe\u003c/strong> known as the Lord Chamberlain's Men. His company performed many of his greatest works at the \u003cstrong>Globe Theatre\u003c/strong>, a famous open-air playhouse on the Thames.","For me, what makes Shakespeare's work so compelling today is his timeless insight into \u003cstrong>human nature\u003c/strong>. He wrote around thirty-eight plays, including masterpieces in both \u003cstrong>tragedy\u003c/strong> and \u003cstrong>comedy\u003c/strong>, as well as over one hundred and fifty \u003cstrong>sonnets\u003c/strong>. In his tragedies, he examined how internal weaknesses can destroy great people. In \u003cem>Macbeth\u003c/em>, uncontrolled \u003cstrong>ambition\u003c/strong> leads a Scottish nobleman into murder, while \u003cem>Othello\u003c/em> portrays the tragic consequences of obsessive \u003cstrong>jealousy\u003c/strong>. In contrast, comedies like \u003cem>A Midsummer Night's Dream\u003c/em> feature humorous misunderstandings, playful magic, and romantic reconciliation.","In the Czech Republic, there is a long tradition of brilliant Shakespeare translations, notably by Martin Hilský, and Shakespeare's plays are regularly staged at the Summer Shakespeare Festival at Prague Castle. For me as a secondary school student, \u003cem>Romeo and Juliet\u003c/em> is the most accessible story. The bitter \u003cstrong>rivalry\u003c/strong> between two noble families destroys two young lovers, showing how ancient hatred harms innocent lives. Many everyday expressions and \u003cstrong>quotations\u003c/strong> in modern English are attributed to his dramatic \u003cstrong>verse\u003c/strong>. Whether in live theatre \u003cstrong>performances\u003c/strong> or contemporary film \u003cstrong>adaptations\u003c/strong>, I find Shakespeare's stories truly \u003cstrong>timeless\u003c/strong>."],"answer_info":"B2, ~245 slov","questions":[{"cat":"Popis","text":"What do we know about William Shakespeare's life in Stratford-upon-Avon and his career in London?"},{"cat":"Srovnání","text":"In what ways do Shakespeare's tragedies differ from his romantic comedies in tone and ending?"},{"cat":"Divadelní prostředí","text":"How did the theatre experience at the Globe Theatre differ between groundlings standing in the yard and wealthier visitors in the galleries?"},{"cat":"Osobní reflexe / rozbor","text":"Which Shakespearean play or modern film adaptation has made the strongest impression on you, and why?"},{"cat":"Názor","text":"Why do Shakespeare's plays continue to be studied in schools and staged worldwide four centuries after his death?"},{"cat":"Hypotéza","text":"If Shakespeare were writing for modern cinema or streaming series today, what contemporary themes might inspire his plots?"},{"cat":"Jazykový vliv","text":"How did Shakespeare's writing influence the vocabulary and idioms of the modern English language?"}],"phrases":[{"head":"\u003cstrong>William Shakespeare is widely regarded as...\u003c/strong>","gloss":"William Shakespeare je široce považován za...","note":"uvedení autora"},{"head":"\u003cstrong>His works can be broadly divided into...\u003c/strong>","gloss":"Jeho díla lze obecně rozdělit na...","note":"členění tvorby"},{"head":"\u003cstrong>What makes his plays so memorable is...\u003c/strong>","gloss":"To, proč jsou jeho hry tak zapamatovatelné, je...","note":"vyzdvižení nadčasovosti"},{"head":"\u003cstrong>The main conflict in the story revolves around...\u003c/strong>","gloss":"Hlavní konflikt v příběhu se točí kolem...","note":"popis zápletky"},{"head":"\u003cstrong>A striking example of this theme is...\u003c/strong>","gloss":"Výrazným příkladem tohoto tématu je...","note":"odkaz na hru"},{"head":"\u003cstrong>In addition to that,...\u003c/strong>","gloss":"Kromě toho / Vedle toho...","note":"doplnění myšlenky"},{"head":"\u003cstrong>To conclude, Shakespeare's genius lies in...\u003c/strong>","gloss":"Na závěr, Shakespearův génius spočívá v...","note":"závěrečné shrnutí"}],"unverified":0},{"file":"tema-v2-czech-literature-in-the-world.md","title":"Czech literature in the world","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu.","s":null,"v":2,"vocab":[{"head":"\u003cstrong>global renown\u003c/strong> (renown /rɪˈnaʊn/) [U]","gloss":"celosvětové uznání, mezinárodní věhlas","example":"Several prominent Czech authors achieved global renown despite writing in a minor Central European language."},{"head":"\u003cstrong>playwright\u003c/strong> /ˈpleɪraɪt/ [C]","gloss":"dramatik, autor divadelních her","example":"Karel Čapek was an extraordinarily versatile journalist, novelist, and playwright."},{"head":"\u003cstrong>coin a term\u003c/strong> (phrase)","gloss":"vytvořit / poprvé použít nové slovo","example":"In his science-fiction play R.U.R. (1920), Karel Čapek helped coin the term \"robot\", suggested by his brother Josef."},{"head":"\u003cstrong>dystopian novel\u003c/strong> (dystopian /dɪsˈtəʊpiən/) [C]","gloss":"dystopický román","example":"War with the Newts is a brilliant satirical dystopian novel warning against totalitarian greed."},{"head":"\u003cstrong>alienation\u003c/strong> /ˌeɪliəˈneɪʃn/ [U]","gloss":"odcizení, osamění","example":"Franz Kafka's stories capture the deep anxiety and psychological alienation of modern individuals."},{"head":"\u003cstrong>bureaucracy\u003c/strong> /bjʊəˈrɒkrəsi/ AmE /bjʊˈrɑːkrəsi/ [U]","gloss":"byrokracie, úřední aparát","example":"In The Trial, the protagonist is trapped in the incomprehensible machinery of anonymous state bureaucracy."},{"head":"\u003cstrong>existentialism\u003c/strong> /ˌeɡzɪˈstenʃəlɪzəm/ [U]","gloss":"existencialismus (POZOR na pravopis: v angličtině se píše s 't' – \u003cem>existentialism\u003c/em>, nikoliv české 'c'!)","example":"Kafka's literary works had a massive influence on twentieth-century European existentialism."},{"head":"\u003cstrong>satire\u003c/strong> /ˈsætaɪə(r)/ AmE /ˈsætaɪər/ [U/C]","gloss":"satira","example":"The Good Soldier Švejk by Jaroslav Hašek is a classic anti-war satire demonstrating the absurdity of military conflict."},{"head":"\u003cstrong>anti-war novel\u003c/strong> (anti /ˈænti/) [C]","gloss":"protiválečný román","example":"Hašek's humorous anti-war novel is celebrated as the most translated Czech novel."},{"head":"\u003cstrong>translate into\u003c/strong> (translate /trænzˈleɪt/) (verb phrase)","gloss":"překládat / přeložit do (cizích jazyků)","example":"The novel was translated into dozens of foreign languages and inspired multiple foreign adaptations."},{"head":"\u003cstrong>Nobel Prize in Literature\u003c/strong> [proper noun]","gloss":"Nobelova cena za literaturu","example":"Poet Jaroslav Seifert remains the sole Czech writer to be awarded the prestigious Nobel Prize in Literature, in 1984."},{"head":"\u003cstrong>philosophical dilemma\u003c/strong> (philosophical /ˌfɪləˈsɒfɪkl/ AmE /ˌfɪləˈsɑːfɪkl/; dilemma /dɪˈlemə/) [C]","gloss":"filozofické dilema","example":"Milan Kundera explores philosophical dilemmas regarding personal freedom and historical memory."},{"head":"\u003cstrong>exile\u003c/strong> /ˈeksaɪl/ AmE /ˈeɡzaɪl/ [U/C]","gloss":"exil, život v emigraci (i exulant [C])","example":"After leaving Czechoslovakia in 1975, Milan Kundera wrote several celebrated novels while living in exile in France."},{"head":"\u003cstrong>adapt into a film\u003c/strong> (adapt /əˈdæpt/) (phrase)","gloss":"převést / adaptovat do podoby filmu","example":"Bohumil Hrabal's Closely Watched Trains was adapted by director Jiří Menzel into a 1966 film that won an Academy Award in 1968."},{"head":"\u003cstrong>the theatre of the absurd\u003c/strong> (absurd /əbˈsɜːd/ AmE /əbˈsɜːrd/) [proper noun / U]","gloss":"absurdní divadlo (vyžaduje určitý člen \u003cem>the\u003c/em>)","example":"Václav Havel wrote biting plays belonging to the theatre of the absurd, satirizing totalitarian bureaucracy."},{"head":"\u003cstrong>dissident\u003c/strong> /ˈdɪsɪdənt/ [C]","gloss":"disident, odpůrce režimu","example":"Havel's powerful essay \"The Power of the Powerless\" from 1978 circulated internationally among dissidents and human rights activists."},{"head":"\u003cstrong>totalitarian regime\u003c/strong> (totalitarian /təʊˌtæləˈteəriən/ AmE /təʊˌtæləˈteriən/; regime /reɪˈʒiːm/) [C]","gloss":"totalitní režim","example":"Czech literature often reflects the painful lived experience of surviving under a repressive totalitarian regime."},{"head":"\u003cstrong>allegory\u003c/strong> /ˈæləɡəri/ AmE /ˈæləɡɔːri/ [C/U]","gloss":"jinotaj, alegorie","example":"Čapek used science fiction as an allegory to highlight the dangers of rapid technological exploitation."},{"head":"\u003cstrong>protagonist\u003c/strong> /prəˈtæɡənɪst/ [C]","gloss":"hlavní hrdina","example":"Josef K. is the bewildered protagonist accused of an unspecified crime in Kafka's dark novel."},{"head":"\u003cstrong>literary heritage\u003c/strong> (literary /ˈlɪtərəri/ AmE /ˈlɪtəreri/; heritage /ˈherɪtɪdʒ/) [U]","gloss":"literární dědictví","example":"Prague possesses a unique multilingual literary heritage blending Czech, German, and Jewish cultures."},{"head":"\u003cstrong>masterpiece\u003c/strong> /ˈmɑːstəpiːs/ AmE /ˈmæstərpiːs/ [C]","gloss":"mistrovské dílo","example":"The Unbearable Lightness of Being is widely regarded as Kundera's greatest literary masterpiece."},{"head":"\u003cstrong>black humour / dark humour\u003c/strong> (humour /ˈhjuːmə(r)/ AmE /ˈhjuːmər/) [U]","gloss":"černý humor","example":"Czech writers frequently rely on irony and dark humour to cope with tragic historical events."}],"answer":["Although Czech is spoken by only around ten million people, Czech literature has left a profound mark on world culture. Over the past century, several Czech authors achieved \u003cstrong>global renown\u003c/strong> by addressing universal themes of freedom, human identity, and the absurdity of power.","In the interwar period, Karel Čapek gained international fame as a forward-thinking \u003cstrong>playwright\u003c/strong> and thinker. In his 1920 drama \u003cem>R.U.R.\u003c/em>, he introduced the world to artificial workers and helped \u003cstrong>coin the term\u003c/strong> \"robot\", which became part of many languages worldwide. In his satirical \u003cstrong>dystopian novel\u003c/strong> \u003cem>War with the Newts\u003c/em>, Čapek used science fiction as an \u003cstrong>allegory\u003c/strong> to warn humanity against the rising threat of Nazism and unchecked greed. Alongside Čapek, the German-speaking Prague writer Franz Kafka captured the modern sense of \u003cstrong>alienation\u003c/strong>. In celebrated works such as \u003cem>The Metamorphosis\u003c/em>, where a salesman turns into an insect, and \u003cem>The Trial\u003c/em>, where a man is prosecuted by an absurd judicial \u003cstrong>bureaucracy\u003c/strong>, Kafka depicted helpless individuals and influenced modern \u003cstrong>existentialism\u003c/strong>.","Humour in the face of disaster is another distinct feature of our literature. Jaroslav Hašek’s \u003cstrong>anti-war novel\u003c/strong> \u003cem>The Good Soldier Švejk\u003c/em> used sharp \u003cstrong>satire\u003c/strong> to expose the folly of the First World War. Later in the twentieth century, writers like Milan Kundera explored \u003cstrong>philosophical dilemmas\u003c/strong> of love and memory in \u003cstrong>exile\u003c/strong>, notably in his \u003cstrong>masterpiece\u003c/strong> \u003cem>The Unbearable Lightness of Being\u003c/em>. Furthermore, poet Jaroslav Seifert won the \u003cstrong>Nobel Prize in Literature\u003c/strong> in 1984, while \u003cstrong>dissident\u003c/strong> and later president Václav Havel used \u003cstrong>the theatre of the absurd\u003c/strong> to expose the hypocrisy of the Communist \u003cstrong>totalitarian regime\u003c/strong>. These works show that great literature can come from any country, no matter how small, as long as it speaks to common human experiences."],"answer_info":"B2, ~255 slov","questions":[{"cat":"Popis","text":"Which Czech authors have gained the greatest international recognition?"},{"cat":"Jazykový a kulturní vliv","text":"How did Karel Čapek and his brother contribute the word \"robot\" to global science fiction?"},{"cat":"Rozbor témat","text":"What are the central motifs of bureaucracy and alienation in the works of Franz Kafka?"},{"cat":"Srovnání","text":"In what ways does the humour in Jaroslav Hašek's Švejk differ from the philosophical irony in Milan Kundera's novels?"},{"cat":"Historický kontext","text":"How did the experience of living under a totalitarian regime influence writers like Václav Havel or Milan Kundera?"},{"cat":"Hypotéza","text":"If Karel Čapek were alive today to observe the rapid rise of generative artificial intelligence, what warnings might he express in his plays?"},{"cat":"Názor","text":"How does reading Czech authors in English translation help foreign readers understand Central European culture and history?"}],"phrases":[{"head":"\u003cstrong>Even though Czech is a minor language, our literature...\u003c/strong>","gloss":"I když je čeština malý jazyk, naše literatura...","note":"úvodní zamyšlení"},{"head":"\u003cstrong>One of the most influential figures in this field is...\u003c/strong>","gloss":"Jednou z nejvlivnějších osobností v této oblasti je...","note":"představení autora"},{"head":"\u003cstrong>What resonates most with international audiences is...\u003c/strong>","gloss":"To, co nejvíce rezonuje u zahraničního publika, je...","note":"mezinárodní dosah"},{"head":"\u003cstrong>His works can be interpreted as an allegory for...\u003c/strong>","gloss":"Jeho díla lze interpretovat jako alegorii na...","note":"výklad smyslu"},{"head":"\u003cstrong>The central theme running through the book is...\u003c/strong>","gloss":"Ústředním tématem prolínajícím se knihou je...","note":"hlavní motiv"},{"head":"\u003cstrong>Through the use of irony and dark humour,...\u003c/strong>","gloss":"Prostřednictvím ironie a černého humoru...","note":"literární styl"},{"head":"\u003cstrong>To conclude, these authors succeeded because...\u003c/strong>","gloss":"Na závěr, tito autoři uspěli, protože...","note":"závěrečné shrnutí"}],"unverified":0},{"file":"tema-v3-great-british-and-american-writers.md","title":"Great British and American writers","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu. Jazykové opravy: Claude, 25. 11. 2026 (#1158), čekají na kontrolu a schválení učitelem. Věcné opravy: Claude, 26. 11. 2026 (#1173), čekají na kontrolu a schválení učitelem.","s":null,"v":3,"vocab":[{"head":"\u003cstrong>novelist\u003c/strong> /ˈnɒvəlɪst/ AmE /ˈnɑːvəlɪst/ [C]","gloss":"autor románů, romanopisec","example":"Charles Dickens was the most celebrated English novelist of the Victorian period."},{"head":"\u003cstrong>dystopian fiction\u003c/strong> (dystopian /dɪsˈtəʊpiən/) [U]","gloss":"dystopická literatura","example":"George Orwell's novel 1984 is one of the most famous works of twentieth-century dystopian fiction."},{"head":"\u003cstrong>social critique\u003c/strong> (critique /krɪˈtiːk/) [C/U]","gloss":"společenská kritika","example":"Dickens used vibrant stories like Oliver Twist as a biting social critique of child labour and poverty."},{"head":"\u003cstrong>The American Dream\u003c/strong> /ði əˌmerɪkən ˈdriːm/ [proper noun / U]","gloss":"americký sen","example":"The Great Gatsby critically examines the disillusionment and hollow materialism behind the American Dream."},{"head":"\u003cstrong>Lost Generation\u003c/strong> [proper noun]","gloss":"Ztracená generace (američtí spisovatelé poznamenaní 1. světovou válkou podle rčení Gertrudy Steinové)","example":"Ernest Hemingway and F. Scott Fitzgerald were prominent voices of the expatriate Lost Generation in Paris."},{"head":"\u003cstrong>iceberg theory\u003c/strong> (iceberg /ˈaɪsbɜːɡ/ AmE /ˈaɪsbɜːrɡ/) [phrase]","gloss":"teorie ledovce (Hemingwayův minimalistický styl formulovaný v knize Death in the Afternoon z roku 1932)","example":"Hemingway's concise writing relies on the iceberg theory, where seven eighths of the meaning lies beneath the surface."},{"head":"\u003cstrong>allegorical novella\u003c/strong> (allegorical /ˌæləˈɡɒrɪkl/ AmE /ˌæləˈɡɔːrɪkl/; novella /nəˈvelə/) [C]","gloss":"alegorická novela","example":"Animal Farm is an allegorical novella exposing how revolutionary ideals are corrupted by tyrannical leaders."},{"head":"\u003cstrong>Jazz Age\u003c/strong> [proper noun]","gloss":"jazzový věk (bujará 20. léta v USA)","example":"Fitzgerald popularized the phrase \"the Jazz Age\" to capture the glittering parties and moral emptiness of the 1920s."},{"head":"\u003cstrong>Great Depression\u003c/strong> (depression /dɪˈpreʃn/) [proper noun]","gloss":"velká hospodářská krize (30. léta v USA)","example":"John Steinbeck wrote moving accounts of displaced farming families struggling through the Great Depression."},{"head":"\u003cstrong>gothic horror\u003c/strong> (gothic /ˈɡɒθɪk/ AmE /ˈɡɑːθɪk/) [U]","gloss":"gotický horor","example":"Edgar Allan Poe is regarded as a master of gothic horror and the father of the modern detective story."},{"head":"\u003cstrong>protagonist\u003c/strong> /prəˈtæɡənɪst/ [C]","gloss":"hlavní hrdina","example":"In The Old Man and the Sea, the ageing fisherman Santiago is a resilient protagonist who struggles against nature."},{"head":"\u003cstrong>setting\u003c/strong> /ˈsetɪŋ/ [C]","gloss":"prostředí, dějiště (příběhu)","example":"Mark Twain chose the mighty Mississippi River as the picturesque setting for Huckleberry Finn."},{"head":"\u003cstrong>poverty\u003c/strong> /ˈpɒvəti/ AmE /ˈpɑːvərti/ [U]","gloss":"chudoba, nuzota","example":"The harsh reality of nineteenth-century London poverty is depicted realistically in many Victorian novels."},{"head":"\u003cstrong>satirize\u003c/strong> /ˈsætəraɪz/ (verb)","gloss":"satirizovat, zesměšňovat","example":"Jane Austen skilfully used witty dialogues to satirize social snobbery and marriage conventions."},{"head":"\u003cstrong>detective fiction\u003c/strong> [U]","gloss":"detektivní literatura","example":"Sir Arthur Conan Doyle created Sherlock Holmes, the hero of many classics of detective fiction."},{"head":"\u003cstrong>symbolism\u003c/strong> /ˈsɪmbəlɪzəm/ [U]","gloss":"symbolika (užití symbolů v díle; i umělecký směr symbolismus)","example":"In The Great Gatsby, the glowing green light at the end of the dock is rich with poetic symbolism."},{"head":"\u003cstrong>masterpiece\u003c/strong> /ˈmɑːstəpiːs/ AmE /ˈmæstərpiːs/ [C]","gloss":"mistrovské dílo","example":"Of Mice and Men remains an accessible and deeply moving masterpiece exploring friendship and loneliness."},{"head":"\u003cstrong>concise\u003c/strong> /kənˈsaɪs/ (adjective)","gloss":"stručný, výstižný","example":"Hemingway preferred concise sentences to flowery descriptions."},{"head":"\u003cstrong>literary canon\u003c/strong> (literary /ˈlɪtərəri/ AmE /ˈlɪtəreri/; canon /ˈkænən/) [C]","gloss":"literární kánon (soubor uznávaných klasických děl)","example":"These outstanding British and American classics occupy a central place in the global literary canon."},{"head":"\u003cstrong>tyranny\u003c/strong> /ˈtɪrəni/ [U, C]","gloss":"tyranie, krutovláda","example":"Animal Farm shows how a revolution against tyranny can end in a new tyranny."},{"head":"\u003cstrong>enduring legacy\u003c/strong> (enduring /ɪnˈdjʊərɪŋ/ AmE /ɪnˈdʊrɪŋ/; legacy /ˈleɡəsi/) [C, usually singular]","gloss":"trvalý odkaz","example":"Twain's humorous stories left an enduring legacy of authentic American storytelling."},{"head":"\u003cstrong>moral dilemma\u003c/strong> (moral /ˈmɒrəl/ AmE /ˈmɔːrəl/; dilemma /dɪˈlemə/) [C]","gloss":"morální dilema","example":"Many classic authors compel readers to confront difficult moral dilemmas regarding justice and compassion."}],"answer":["British and American literature offer an incredible range of stories that have shaped modern culture worldwide. While British literature often reflects centuries of class structures and social changes, American authors have frequently explored individualism, freedom, and the elusive promise of \u003cstrong>the American Dream\u003c/strong>.","Among British writers, two major authors often read for the maturita exam are Charles Dickens and George Orwell. In the nineteenth century, Charles Dickens used compelling storytelling as a powerful \u003cstrong>social critique\u003c/strong>. In \u003cem>Oliver Twist\u003c/em>, he exposed the grim reality of Victorian \u003cstrong>poverty\u003c/strong> and child labour, and in \u003cem>Great Expectations\u003c/em> he explored class and ambition. A century later, George Orwell confronted totalitarian regimes. In his famous work of \u003cstrong>dystopian fiction\u003c/strong>, \u003cem>1984\u003c/em>, he introduced terrifying concepts like Big Brother and the Thought Police, while his brilliant \u003cstrong>allegorical novella\u003c/strong> \u003cem>Animal Farm\u003c/em> satirized the betrayal of revolutionary ideals.","Across the Atlantic, American literature developed a voice of its own. Mark Twain brought the Mississippi River to life, using humour to \u003cstrong>satirize\u003c/strong> racial prejudice in \u003cem>Adventures of Huckleberry Finn\u003c/em>. In the 1920s, writers of the \u003cstrong>Lost Generation\u003c/strong> captured the spirit of the \u003cstrong>Jazz Age\u003c/strong>. F. Scott Fitzgerald's \u003cstrong>masterpiece\u003c/strong> \u003cem>The Great Gatsby\u003c/em> explored the shallow pursuit of wealth. Ernest Hemingway influenced modern prose with his \u003cstrong>concise\u003c/strong> style and \u003cstrong>iceberg theory\u003c/strong>, which can still be seen in his late novella \u003cem>The Old Man and the Sea\u003c/em>. In the 1930s, John Steinbeck described ordinary workers during the \u003cstrong>Great Depression\u003c/strong>. For me, studying these authors shows how books can capture the spirit of both nations."],"answer_info":"B2, ~250 slov","questions":[{"cat":"Popis","text":"How did Charles Dickens use his Victorian novels to criticize social inequality and poverty in England?"},{"cat":"Srovnání","text":"In what ways do the warnings against totalitarianism in George Orwell's 1984 compare with those in his animal allegory Animal Farm?"},{"cat":"Americká témata","text":"What does F. Scott Fitzgerald's The Great Gatsby tell us about the promise and illusions of the American Dream?"},{"cat":"Styl","text":"How does Ernest Hemingway's minimalist style, based on his \"iceberg theory\", differ from the elaborate descriptive style of nineteenth-century authors?"},{"cat":"Význam","text":"Why is Mark Twain considered one of the founding fathers of authentic American literature?"},{"cat":"Hypotéza","text":"If George Orwell could witness modern internet surveillance, smart cameras, and digital propaganda today, how would he view our society?"},{"cat":"Názor","text":"Which British or American book that you have read personally made the strongest emotional impression on you?"}],"phrases":[{"head":"\u003cstrong>When I contrast British and American authors, I...\u003c/strong>","gloss":"Když srovnávám britské a americké autory, ...","note":"úvodní srovnání"},{"head":"\u003cstrong>A defining characteristic of his writing is...\u003c/strong>","gloss":"Charakteristickým rysem jeho psaní je...","note":"popis stylu"},{"head":"\u003cstrong>The book offers a powerful critique of...\u003c/strong>","gloss":"Kniha nabízí silnou kritiku...","note":"funkce díla"},{"head":"\u003cstrong>Beneath the exciting surface of the story lies...\u003c/strong>","gloss":"Pod napínavým povrchem příběhu leží...","note":"odhalení hlubšího smyslu"},{"head":"\u003cstrong>He is particularly celebrated for his ability to...\u003c/strong>","gloss":"Je obzvláště oceňován pro svou schopnost...","note":"vyzdvižení autorské dovednosti"},{"head":"\u003cstrong>From a stylistic point of view,...\u003c/strong>","gloss":"Ze stylistického hlediska...","note":"jazyková analýza"},{"head":"\u003cstrong>To sum up, the lasting impact of these writers is that...\u003c/strong>","gloss":"Abych to shrnul, trvalý vliv těchto spisovatelů spočívá v tom, že...","note":"závěrečné shrnutí"}],"unverified":0},{"file":"tema-v9-films-based-on-books.md","title":"Films based on books","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu. Jazykové opravy: Claude, 25. 11. 2026 (#1158), čekají na kontrolu a schválení učitelem. Věcné opravy: Claude, 26. 11. 2026 (#1173), čekají na kontrolu a schválení učitelem.","s":null,"v":9,"vocab":[{"head":"\u003cstrong>adaptation\u003c/strong> /ˌædæpˈteɪʃn/ [C]","gloss":"filmová adaptace, převedení knihy na plátno","example":"Peter Jackson directed an epic three-part film adaptation of J.R.R. Tolkien's The Lord of the Rings."},{"head":"\u003cstrong>screenplay\u003c/strong> /ˈskriːnpleɪ/ [C]","gloss":"filmový scénář","example":"Adapting a six-hundred-page novel into a concise two-hour screenplay requires difficult creative choices."},{"head":"\u003cstrong>blockbuster\u003c/strong> /ˈblɒkˌbʌstə/ AmE /ˈblɑːkˌbʌstər/ [C]","gloss":"kasovní trhák, komerčně úspěšný velkofilm","example":"The fantasy book series was quickly transformed into a Hollywood blockbuster breaking box office records."},{"head":"\u003cstrong>omit\u003c/strong> /əˈmɪt/ (verb)","gloss":"vynechat, opomenout","example":"Filmmakers often omit minor subplots to keep the movie from running too long."},{"head":"\u003cstrong>subplot\u003c/strong> /ˈsʌbplɒt/ AmE /ˈsʌbplɑːt/ [C]","gloss":"vedlejší dějová linie, podzápletka","example":"While the book features several fascinating subplots, the film focuses purely on the central romance."},{"head":"\u003cstrong>inner thoughts\u003c/strong> (inner /ˈɪnə(r)/ AmE /ˈɪnər/) [plural]","gloss":"vnitřní myšlenky (vnitřní svět postavy)","example":"Novels easily describe a protagonist's inner thoughts, whereas films often convey them visually or through voice-over narration."},{"head":"\u003cstrong>faithful to the original\u003c/strong> (faithful /ˈfeɪθfl/) (phrase)","gloss":"věrný knižní předloze","example":"Purist fans were delighted that the director remained remarkably faithful to the original text."},{"head":"\u003cstrong>cast\u003c/strong> /kɑːst/ AmE /kæst/ [C; verb]","gloss":"herecké obsazení [C]; obsadit herce [verb]","example":"The director assembled an outstanding cast of British actors to bring the story to life."},{"head":"\u003cstrong>visual effects\u003c/strong> (visual /ˈvɪʒuəl/) [plural]","gloss":"vizuální / počítačové triky a efekty","example":"Many modern sci-fi films rely on cutting-edge visual effects to depict alien creatures and distant galaxies."},{"head":"\u003cstrong>soundtrack\u003c/strong> /ˈsaʊndtræk/ [C]","gloss":"filmový hudební doprovod, soundtrack","example":"The dramatic orchestral soundtrack elevated the emotional atmosphere of the final battle scene."},{"head":"\u003cstrong>pacing\u003c/strong> /ˈpeɪsɪŋ/ [U]","gloss":"tempo, spád příběhu","example":"The film suffered from uneven pacing, rushing through the beginning and dragging in the middle."},{"head":"\u003cstrong>cinematography\u003c/strong> /ˌsɪnəməˈtɒɡrəfi/ AmE /ˌsɪnəməˈtɑːɡrəfi/ [U]","gloss":"kamera, kameramanské umění","example":"The magnificent mountain cinematography captured the untamed beauty of the wilderness perfectly."},{"head":"\u003cstrong>lead role\u003c/strong> [C]","gloss":"hlavní role","example":"Playing the lead role of Harry Potter in the 2001–2011 film series based on J.K. Rowling's novels made Daniel Radcliffe an international household name."},{"head":"\u003cstrong>bring to life\u003c/strong> (phrase)","gloss":"vdechnout život (postavě či světu)","example":"A talented actor can bring a beloved literary character to life in ways readers never anticipated."},{"head":"\u003cstrong>condense\u003c/strong> /kənˈdens/ (verb)","gloss":"zhustit, zkrátit","example":"Screenwriters had to condense months of fictional events into a swift ninety-minute film."},{"head":"\u003cstrong>diverge from\u003c/strong> (diverge /daɪˈvɜːdʒ/ AmE /daɪˈvɜːrdʒ/) (verb)","gloss":"odchýlit se od, odklonit se od","example":"The movie's controversial ending completely diverges from the tragic conclusion written in the novel."},{"head":"\u003cstrong>critical acclaim\u003c/strong> (critical /ˈkrɪtɪkl/; acclaim /əˈkleɪm/) [U]","gloss":"uznání odborné kritiky","example":"Frank Darabont's 1994 film The Shawshank Redemption, based on a novella by Stephen King, achieved widespread critical acclaim."},{"head":"\u003cstrong>box office\u003c/strong> /ˈbɒks ɒfɪs/ AmE /ˈbɑːks ɑːfɪs/ [U]","gloss":"tržby z prodeje vstupenek v kinech (POZOR na falešného přítele: \u003cem>a billion dollars\u003c/em> = miliarda dolarů, nikoliv český bilion!)","example":"Earning over a billion dollars at the international box office proved the global appeal of the franchise."},{"head":"\u003cstrong>imagination\u003c/strong> /ɪˌmædʒɪˈneɪʃn/ [U]","gloss":"lidská představivost, fantazie","example":"Reading forces you to use your own imagination to picture what the characters and places look like."},{"head":"\u003cstrong>disappointment\u003c/strong> /ˌdɪsəˈpɔɪntmənt/ [C/U]","gloss":"zklamání","example":"For passionate readers who imagined the magical world differently, the movie was a mild disappointment."},{"head":"\u003cstrong>Academy Award\u003c/strong> (academy /əˈkædəmi/) [C]","gloss":"cena americké filmové akademie, Oscar","example":"Peter Jackson's 2003 film The Lord of the Rings: The Return of the King swept eleven Academy Awards, including Best Picture."},{"head":"\u003cstrong>bestseller\u003c/strong> /ˌbestˈselə(r)/ AmE /ˌbestˈselər/ [C]","gloss":"knižní bestseller","example":"Publishing companies often rerelease the original bestseller with the movie poster on the front cover."}],"answer":["When a popular novel is turned into a movie, lively discussions often start between book lovers and film fans. Many people have heard the familiar phrase: \"The book was much better than the film.\" As a secondary school student who enjoys both reading fiction and watching films, I find this comparison between literature and screen \u003cstrong>adaptations\u003c/strong> truly fascinating.","The central difference between the two media lies in how they engage our senses. When reading a \u003cstrong>bestseller\u003c/strong>, we rely on our personal \u003cstrong>imagination\u003c/strong>. A novelist has unlimited room to develop complex \u003cstrong>subplots\u003c/strong> and take us deep inside a character's \u003cstrong>inner thoughts\u003c/strong>. In contrast, a movie often has around two hours to tell the entire story. Therefore, screenwriters must \u003cstrong>condense\u003c/strong> extensive chapters, adjust the \u003cstrong>pacing\u003c/strong>, and sometimes \u003cstrong>omit\u003c/strong> secondary characters altogether. Furthermore, directors occasionally decide to \u003cstrong>diverge from\u003c/strong> the book's ending to create greater visual drama.","Nonetheless, cinema offers unique strengths of its own. A visionary director and a talented \u003cstrong>cast\u003c/strong> can \u003cstrong>bring to life\u003c/strong> worlds that readers previously only pictured in their minds. Epic fantasy stories, like Peter Jackson's \u003cem>The Lord of the Rings\u003c/em> or the \u003cem>Harry Potter\u003c/em> series, combine spectacular \u003cstrong>cinematography\u003c/strong>, magical \u003cstrong>visual effects\u003c/strong>, and unforgettable orchestral \u003cstrong>soundtracks\u003c/strong>. In addition, classic films like \u003cem>The Shawshank Redemption\u003c/em> achieved worldwide acclaim even though they won no \u003cstrong>Academy Awards\u003c/strong> at the time. Ultimately, books and films are complementary art forms that inspire one another."],"answer_info":"B2, ~250 slov","questions":[{"cat":"Srovnání","text":"Why do people so often claim that \"the book was better than the movie\"?"},{"cat":"Tvůrčí proces","text":"What major challenges do directors and screenwriters face when condensing a long novel into a two-hour film?"},{"cat":"Zkušenost","text":"What was the best film adaptation of a book you have ever watched, and what made it so good?"},{"cat":"Vliv","text":"How does watching a movie before reading the book affect the reader's personal imagination and visualization of the story?"},{"cat":"Přednosti","text":"What artistic tools do filmmakers have—such as cinematography, sound, and visual effects—that novelists do not?"},{"cat":"Tvůrčí spory","text":"How should disagreements between book authors and film directors over script changes be handled?"},{"cat":"Názor","text":"How does adapting long fantasy book series into multi-season television series, such as \u003cem>Game of Thrones\u003c/em> (2011–2019), compare with making traditional films?"}],"phrases":[{"head":"\u003cstrong>A classic dilemma when we compare books and films is...\u003c/strong>","gloss":"Klasickým dilematem, když porovnáváme knihy a filmy, je...","note":"uvedení tématu"},{"head":"\u003cstrong>While the written word allows for greater depth,...\u003c/strong>","gloss":"Zatímco psané slovo umožňuje větší hloubku,...","note":"srovnání předností"},{"head":"\u003cstrong>What a movie brings to the story is...\u003c/strong>","gloss":"To, co film do příběhu vnáší, je...","note":"vyzdvižení filmových prvků"},{"head":"\u003cstrong>When filmmakers turn a book into a film, they...\u003c/strong>","gloss":"Když filmaři zpracovávají knihu jako film, ...","note":"popis procesu adaptace"},{"head":"\u003cstrong>The filmmakers had to make difficult compromises, such as...\u003c/strong>","gloss":"Tvůrci filmu museli udělat těžké kompromisy, jako například...","note":"analýza úprav"},{"head":"\u003cstrong>From my personal perspective as a viewer,...\u003c/strong>","gloss":"Z mého osobního pohledu diváka...","note":"divácká zkušenost"},{"head":"\u003cstrong>To conclude, both formats offer distinct experiences because...\u003c/strong>","gloss":"Na závěr, oba formáty nabízejí odlišné zážitky, protože...","note":"závěrečné shrnutí"}],"unverified":0}],"built":"26. 11. 2026 09:45","menu_note":"Všechna témata navrhla AI a čekají na kontrolu a schválení učitelem. Výslovnost: Oxford Learner's Dictionaries, ověřeno s Wiktionary (kaikki.org, CC BY-SA)."}</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("data").textContent);
const TOPICS = DATA.topics;
const app = document.getElementById("app");
const blank = document.getElementById("blank");
const root = document.documentElement;
const dpr0 = window.devicePixelRatio || 1;
const SECTIONS = [
  { name: "Slovní zásoba", one: "Slovo", all: "celý seznam" },
  { name: "Vzorová odpověď", one: "Odstavec", all: "celý text" },
  { name: "Otázky", one: "Otázka", all: "všechny otázky" },
  { name: "Fráze", one: "Fráze", all: "všechny fráze" },
];
const FILTERS = [["all", "Všechna témata"], ["s", "Sportovní obor"], ["v", "Všeobecný obor"]];

let size = 1;          // + and −; the browser's zoom comes on top
let view = "menu";     // "menu" or "topic"
let filter = "all";    // the programme shown in the menu
let current = null;    // index of the open topic
let section = 0;       // 0–3, SECTIONS
let pos = [0, 0, 0, 0];               // the step within each section
let whole = [false, false, false, false];  // each section one item at a time, or all at once

function esc(text) {
  return String(text).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
}
function nums(t) {
  return [t.s != null ? `S ${t.s}` : "", t.v != null ? `V ${t.v}` : ""].filter(Boolean).join(" · ");
}
function control(act, key, words) { return `<button class="key" data-act="${act}"><b>${key}</b> ${words}</button>`; }

// The menu: the topics of one programme in its order, or of both, a topic shared by both programmes once.
function listed() {
  const ids = TOPICS.map((t, i) => i).filter(i => filter === "all" || TOPICS[i][filter] != null);
  const rank = t => filter === "all" ? Math.min(t.s ?? 99, t.v ?? 99) * 2 + (t.s != null ? 0 : 1) : t[filter];
  return ids.sort((a, b) => rank(TOPICS[a]) - rank(TOPICS[b]));
}
function menuView() {
  const ids = listed();
  return `<header class="bar"><h1>Maturita z angličtiny – ústní témata (B2)</h1><span class="ai">${esc(DATA.menu_note)}</span></header>
<main>
<div class="chips">${FILTERS.map(([f, label]) => `<button data-filter="${f}" aria-pressed="${filter === f}">${label}</button>`).join("")}<span class="count">${ids.length} témat</span></div>
<div class="grid">${ids.map(i => `<button class="tile" data-topic="${i}"><span class="nums">${nums(TOPICS[i])}</span>${esc(TOPICS[i].title)}</button>`).join("")}</div>
</main>
<footer class="bar"><span>S = sportovní obor, V = všeobecný obor · ← → výběr tématu, Enter otevřít · sestaveno ${esc(DATA.built)}</span><span>${control("blank", "B", "zatemnit")} · ${control("fullscreen", "F", "celá obrazovka")} · ${control("smaller", "−", "menší")} ${control("bigger", "+", "větší")}</span></footer>`;
}

function steps(i) {
  const t = TOPICS[current];
  if (whole[i]) return 1;
  return [t.vocab.length * 2, t.answer.length, t.questions.length, t.phrases.length * 2][i];
}
function counter() {
  const t = TOPICS[current];
  const n = [t.vocab.length, t.answer.length, t.questions.length, t.phrases.length][section];
  const info = section === 1 && t.answer_info ? ` · ${esc(t.answer_info)}` : "";
  if (whole[section]) return `${n} ${["slov", "odstavce", "otázek", "frází"][section]}${info}`;
  const k = section === 0 || section === 3 ? Math.floor(pos[section] / 2) : pos[section];
  return `${SECTIONS[section].one} ${k + 1} / ${n}${info}`;
}
// Vocabulary and phrases: an odd step shows the meaning of the item the even step put up, so the class guesses first.
function revealed(k) { return k % 2 === 1; }
function sectionView() {
  const t = TOPICS[current];
  const p = pos[section];
  if (section === 0) {
    if (whole[0]) return `<ol class="list">${t.vocab.map(v => `<li><span class="term-l">${v.head}</span> – <span class="gloss-l">${v.gloss}</span><br><span class="ex">${v.example}</span></li>`).join("")}</ol>`;
    const v = t.vocab[Math.floor(p / 2)], shown = revealed(p);
    return `<div class="stage"><p class="term">${v.head}</p><div class="rev${shown ? "" : " hid"}"><p class="gloss">${v.gloss}</p><p class="ex">${v.example}</p></div><p class="hint${shown ? " hid" : ""}">→ ukáže význam a příklad</p></div>`;
  }
  if (section === 1) {
    if (whole[1]) return `<div class="alltext">${t.answer.map(a => `<p>${a}</p>`).join("")}</div>`;
    return `<div class="stage"><p class="para">${t.answer[p]}</p></div>`;
  }
  if (section === 2) {
    if (whole[2]) return `<ol class="list">${t.questions.map(q => `<li>${q.cat ? `<span class="qcat">${q.cat}:</span> ` : ""}${q.text}</li>`).join("")}</ol>`;
    const q = t.questions[p];
    return `<div class="stage">${q.cat ? `<p class="qcat">${q.cat}</p>` : ""}<p class="q">${q.text}</p></div>`;
  }
  if (whole[3]) return `<ol class="list">${t.phrases.map(f => `<li>${f.head} – ${f.gloss}${f.note ? ` <span class="note">(${f.note})</span>` : ""}</li>`).join("")}</ol>`;
  const f = t.phrases[Math.floor(p / 2)], shown = revealed(p);
  return `<div class="stage"><p class="phrase">${f.head}</p><div class="rev${shown ? "" : " hid"}"><p class="gloss">${f.gloss}</p>${f.note ? `<p class="note">${f.note}</p>` : ""}</div><p class="hint${shown ? " hid" : ""}">→ ukáže význam</p></div>`;
}
function topicView() {
  const t = TOPICS[current];
  const tabs = SECTIONS.map((s, i) => `<button data-sec="${i}" aria-pressed="${i === section}"><b>${i + 1}</b> ${s.name}</button>`).join("");
  const mode = whole[section] ? "po jednom" : SECTIONS[section].all;
  return `<header class="bar"><h1 class="title"><span class="nums">${nums(t)}</span> ${esc(t.title)}</h1><span class="ai">${esc(t.label)}</span></header>
<nav class="tabs">${tabs}<span class="sp"></span>${control("whole", "V", mode)}<span class="count">${counter()}</span></nav>
<main>${sectionView()}</main>
<footer class="bar"><span>${control("prev", "←", "zpět")} ${control("next", "→", "další")}</span><span>${control("blank", "B", "zatemnit")} · ${control("fullscreen", "F", "celá obrazovka")} · ${control("smaller", "−", "")}${control("bigger", "+", "")} · ${control("menu", "Esc", "menu")}</span></footer>`;
}

function render() {
  document.body.dataset.view = view;
  document.body.dataset.mode = view === "topic" && !whole[section] ? "one" : "all";
  app.innerHTML = view === "menu" ? menuView() : topicView();
  keepClear();
}
function openTopic(i) {
  current = i; section = 0; pos = [0, 0, 0, 0]; whole = [false, false, false, false];
  view = "topic"; render(); window.scrollTo(0, 0);
}
function toMenu() {
  view = "menu"; render();
  const tile = app.querySelector(`.tile[data-topic="${current}"]`);
  if (tile) { tile.focus(); tile.scrollIntoView({ block: "nearest" }); } else window.scrollTo(0, 0);
}
function setSection(i, step) {
  section = i;
  if (step != null) pos[i] = step;
  render(); window.scrollTo(0, 0);
}
// A whole list scrolls a screen at a time; at its end → goes on to the next section, at its top ← back.
function scrollStep(dir) {
  const max = root.scrollHeight - window.innerHeight;
  if (dir > 0 ? window.scrollY >= max - 2 : window.scrollY <= 0) return false;
  window.scrollBy(0, dir * window.innerHeight * 0.7);
  return true;
}
function next() {
  if (whole[section] ? scrollStep(1) : pos[section] < steps(section) - 1 && (pos[section]++, true)) {
    if (!whole[section]) { render(); window.scrollTo(0, 0); }
  } else if (section < SECTIONS.length - 1) setSection(section + 1, 0);
}
function prev() {
  if (whole[section] ? scrollStep(-1) : pos[section] > 0 && (pos[section]--, true)) {
    if (!whole[section]) { render(); window.scrollTo(0, 0); }
  } else if (section > 0) setSection(section - 1, steps(section - 1) - 1);
}
function toggleWhole() {
  whole[section] = !whole[section];
  if (!whole[section]) pos[section] = 0;
  render(); window.scrollTo(0, 0);
}
function moveFocus(dir) {
  const tiles = [...app.querySelectorAll(".tile")];
  const k = tiles.indexOf(document.activeElement);
  const target = tiles[k < 0 ? (dir > 0 ? 0 : tiles.length - 1) : (k + dir + tiles.length) % tiles.length];
  target.focus(); target.scrollIntoView({ block: "nearest" });
}

// Browser zoom shrinks the CSS viewport, so text sized in vh alone would not grow with Ctrl + mouse wheel. The
// ratio of devicePixelRatio to its value at load puts the zoom back in; CSS max() keeps the lower bounds.
function applySize() { root.style.setProperty("--z", ((window.devicePixelRatio || 1) / dpr0 * size).toFixed(3)); }
function resize(step) { size = Math.min(2, Math.max(0.8, Math.round(size * 10 + step) / 10)); applySize(); keepClear(); }
// A scroll stops below the sticky header, so the AI label never covers the text.
function keepClear() { root.style.scrollPaddingTop = `${app.querySelector("header").offsetHeight}px`; }
function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else root.requestFullscreen?.().catch(() => {});
}
window.addEventListener("resize", () => { applySize(); keepClear(); });
(function watchResolution() {
  matchMedia(`(resolution: ${window.devicePixelRatio || 1}dppx)`)
    .addEventListener("change", () => { applySize(); watchResolution(); }, { once: true });
})();

const ACTS = {
  next, prev, menu: toMenu, whole: toggleWhole, fullscreen: toggleFullscreen,
  blank: () => { blank.hidden = false; }, smaller: () => resize(-1), bigger: () => resize(1),
};
app.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.topic) openTopic(+b.dataset.topic);
  else if (b.dataset.sec) setSection(+b.dataset.sec);
  else if (b.dataset.filter) { filter = b.dataset.filter; render(); }
  else if (ACTS[b.dataset.act]) ACTS[b.dataset.act]();
});
blank.addEventListener("click", () => { blank.hidden = true; });

document.addEventListener("keydown", e => {
  if (!blank.hidden) { blank.hidden = true; e.preventDefault(); return; }  // any key brings the picture back
  if (e.ctrlKey || e.metaKey || e.altKey) return;  // Ctrl + and Ctrl − stay the browser's zoom
  const k = e.key;
  if (k === "b" || k === "B" || k === ".") blank.hidden = false;
  else if (k === "f" || k === "F" || k === "F5") toggleFullscreen();  // a presenter remote's start key sends F5
  else if (k === "+" || k === "=") resize(1);
  else if (k === "-" || k === "_") resize(-1);
  else if (view === "menu") {
    if (k === "ArrowRight" || k === "ArrowDown" || k === "PageDown") moveFocus(1);
    else if (k === "ArrowLeft" || k === "ArrowUp" || k === "PageUp") moveFocus(-1);
    else if (k === "Enter" && !document.activeElement?.classList.contains("tile")) moveFocus(1);
    else return;  // Enter or space on a chosen topic opens it as a click does
  } else {
    if (k === "ArrowRight" || k === "PageDown" || k === " " || k === "Enter") next();
    else if (k === "ArrowLeft" || k === "PageUp") prev();
    else if (k.length === 1 && "1234".includes(k)) setSection(+k - 1);
    else if (k === "v" || k === "V") toggleWhole();
    else if (k === "Escape") toMenu();
    else return;
  }
  e.preventDefault();
});

applySize();
render();
</script>
<p class="inkrema-verze"><small>Beta, verze z 26. 11. 2026 (210c51d) · Navrhla AI; u každého tématu je uvedeno, zda ho už schválil učitel</small></p>
</body>
