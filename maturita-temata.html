phrase)","gloss":"ověřovat informace","example":"Critical readers take time to verify information across multiple independent news outlets."},{"head":"\u003cstrong>clickbait\u003c/strong> /ˈklɪkbeɪt/ [U]","gloss":"clickbait, lákavý obsah či titulek (senzacechtivý obsah určený k nalákání ke kliknutí)","example":"Clickbait articles often exaggerate ordinary events simply to generate website traffic and advertising revenue."},{"head":"\u003cstrong>current affairs\u003c/strong> /ˌkʌrənt əˈfeəz/ AmE /ˌkɜːrənt əˈferz/ [plural]","gloss":"aktuální dění, současné události (POZOR na falešného přítele: \u003cem>actual ≠ aktuální!\u003c/em> Aktuální je \u003cem>current\u003c/em>, zatímco \u003cem>actual\u003c/em> znamená skutečný/faktický)","example":"Listening to morning podcasts is a convenient way to stay updated on international current affairs."},{"head":"\u003cstrong>subscriber\u003c/strong> /səbˈskraɪbə(r)/ AmE /səbˈskraɪbər/ [C]","gloss":"předplatitel, odběratel","example":"Many digital news sites offer exclusive articles and podcasts to each paying subscriber."}],"answer":["In our interconnected twenty-first-century world, media and communication influence many of the choices we make. How people receive information has changed a lot within a single generation. While our parents grew up reading paper newspapers or watching the evening news \u003cstrong>broadcast\u003c/strong> on television, my generation consumes information mostly through smartphones and social networks.","Social media platforms have transformed everyday communication, offering clear benefits alongside serious risks. On the positive side, following international journalists and listening to news podcasts allow us to stay informed about global \u003cstrong>current affairs\u003c/strong> in real time. We can connect with friends and share creative content instantly. However, there is also a dark side to this constant digital connection. Algorithms can trap users in an ideological \u003cstrong>echo chamber\u003c/strong>, reinforcing prejudices and promoting sensational \u003cstrong>clickbait\u003c/strong> designed solely to collect views.","Even more concerning is the spread of \u003cstrong>fake news\u003c/strong> and online manipulation. In an era where anyone can post anything online or become an \u003cstrong>influencer\u003c/strong>, telling true facts from lies is a real challenge. That is why developing strong \u003cstrong>media literacy\u003c/strong> in secondary school is vital for our generation. We need to learn how to \u003cstrong>verify information\u003c/strong> carefully and check if an article comes from a \u003cstrong>reliable source\u003c/strong>. While we must protect \u003cstrong>freedom of speech\u003c/strong> against political \u003cstrong>censorship\u003c/strong>, we also need to be responsible digital citizens. Ultimately, learning to manage our \u003cstrong>screen time\u003c/strong> and to read critically helps to ensure that technology serves us rather than controls our minds."],"answer_info":"B2, ~245 slov","questions":[{"cat":"Popis","text":"How does the way young people consume news today differ from the way older generations consumed it?"},{"cat":"Srovnání","text":"In what ways do sensational tabloids differ from quality broadsheets in terms of journalistic standards?"},{"cat":"Zkušenost","text":"How do you personally decide whether a piece of news you encounter on social media is trustworthy or fake?"},{"cat":"Názor","text":"Why can social media algorithms create echo chambers for their users?"},{"cat":"Popis","text":"What are the most serious psychological dangers associated with excessive screen time and cyberbullying among teenagers?"},{"cat":"Hypotéza","text":"If all traditional print newspapers ceased publication next year, what consequences would that have for society and older readers?"},{"cat":"Názor / etika","text":"Where should society draw the line between protecting freedom of speech and restricting harmful disinformation or hate speech online?"}],"phrases":[{"head":"\u003cstrong>In our fast-paced digital world,...\u003c/strong>","gloss":"V našem uspěchaném digitálním světě,...","note":"úvodní zamyšlení"},{"head":"\u003cstrong>One of the greatest dangers of social media is...\u003c/strong>","gloss":"Jedním z největších nebezpečí sociálních sítí je...","note":"pojmenování rizika"},{"head":"\u003cstrong>When I evaluate the credibility of a news story, I...\u003c/strong>","gloss":"Když posuzuji věrohodnost zprávy,...","note":"kritické myšlení"},{"head":"\u003cstrong>On the one hand..., on the other hand...\u003c/strong>","gloss":"Na jedné straně..., na druhé straně...","note":"vážení kladů a záporů"},{"head":"\u003cstrong>It is essential for young people to...\u003c/strong>","gloss":"Je nezbytné, aby mladí lidé...","note":"doporučení"},{"head":"\u003cstrong>From my personal perspective,...\u003c/strong>","gloss":"Z mého osobního pohledu...","note":"vyjádření postoje"},{"head":"\u003cstrong>To sum up, media literacy helps us...\u003c/strong>","gloss":"Abych to shrnul, mediální gramotnost nám pomáhá...","note":"závěrečné shrnutí"}],"unverified":0},{"file":"tema-s24-environment-and-ecology.md","title":"Environment and ecology","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu. Jazykové opravy: Claude, 25. 11. 2026 (#1158), čekají na kontrolu a schválení učitelem. Věcné opravy: Claude, 26. 11. 2026 (#1173), čekají na kontrolu a schválení učitelem.","s":24,"v":24,"vocab":[{"head":"\u003cstrong>climate change\u003c/strong> /ˈklaɪmət tʃeɪndʒ/ [U]","gloss":"změna klimatu","example":"Rising global temperatures and shifting weather patterns are clear consequences of climate change."},{"head":"\u003cstrong>global warming\u003c/strong> /ˌɡləʊbl ˈwɔːmɪŋ/ AmE /ˌɡləʊbl ˈwɔːrmɪŋ/ [U]","gloss":"globální oteplování","example":"Scientists warn that global warming is accelerating the melting of polar glaciers."},{"head":"\u003cstrong>greenhouse gas emissions\u003c/strong> (greenhouse /ˈɡriːnhaʊs/) [plural]","gloss":"emise skleníkových plynů","example":"Governments must agree to cut greenhouse gas emissions from power stations and transport."},{"head":"\u003cstrong>renewable energy\u003c/strong> [U]","gloss":"obnovitelná energie","example":"Investing in renewable energy, like solar and wind power, can reduce our reliance on coal."},{"head":"\u003cstrong>fossil fuels\u003c/strong> (fossil /ˈfɒsl/ AmE /ˈfɑːsl/) [plural]","gloss":"fosilní paliva","example":"Burning fossil fuels releases massive amounts of carbon dioxide into the atmosphere."},{"head":"\u003cstrong>deforestation\u003c/strong> /ˌdiːˌfɒrɪˈsteɪʃn/ AmE /ˌdiːˌfɔːrɪˈsteɪʃn/ [U]","gloss":"odlesňování, kácení lesů","example":"Massive deforestation in tropical rainforests destroys unique wildlife habitats."},{"head":"\u003cstrong>endangered species\u003c/strong> (endangered /ɪnˈdeɪndʒəd/ AmE /ɪnˈdeɪndʒərd/; species /ˈspiːʃiːz/) [C, plural unchanged: species]","gloss":"ohrožený druh / ohrožené druhy","example":"International conservation programmes strive to protect endangered species from poaching and habitat loss."},{"head":"\u003cstrong>biodiversity loss\u003c/strong> (biodiversity /ˌbaɪəʊdaɪˈvɜːsəti/ AmE /ˌbaɪəʊdaɪˈvɜːrsəti/) [U]","gloss":"úbytek biologické rozmanitosti","example":"Pollution and expanding agriculture are leading to rapid biodiversity loss worldwide."},{"head":"\u003cstrong>landfill\u003c/strong> /ˈlændfɪl/ [C]","gloss":"skládka odpadu","example":"Mountains of plastic packaging end up buried in a landfill where they take centuries to decompose."},{"head":"\u003cstrong>recycle\u003c/strong> /ˌriːˈsaɪkl/ (verb)","gloss":"recyklovat (zpracovat vytříděný odpad na nový materiál; domácí třídění je \u003cem>waste sorting\u003c/em>)","example":"Czech households are remarkably disciplined about sorting paper and glass so that towns can recycle them."},{"head":"\u003cstrong>single-use plastic\u003c/strong> [U/C; also adjective]","gloss":"jednorázový plast [substantivum]; jednorázový plastový [adjektivum]","example":"Many countries have introduced bans on single-use plastic bags and straws to reduce ocean waste."},{"head":"\u003cstrong>carbon footprint\u003c/strong> /ˌkɑːbən ˈfʊtprɪnt/ AmE /ˌkɑːrbən ˈfʊtprɪnt/ [C]","gloss":"uhlíková stopa","example":"Choosing trains instead of short-haul flights significantly lowers your personal carbon footprint."},{"head":"\u003cstrong>drought\u003c/strong> /draʊt/ [C/U]","gloss":"sucho","example":"Prolonged summer droughts in Central Europe threaten crops and lower groundwater levels."},{"head":"\u003cstrong>flood\u003c/strong> /flʌd/ [C]","gloss":"povodeň, záplava","example":"Sudden torrential rain can cause a devastating flood along river valleys."},{"head":"\u003cstrong>solar panel\u003c/strong> /ˌsəʊlə ˈpænl/ AmE /ˌsəʊlər ˈpænl/ [C]","gloss":"solární panel (často v plurálu: \u003cem>solar panels\u003c/em>)","example":"Many homeowners are installing solar panels on rooftops to generate clean electricity."},{"head":"\u003cstrong>natural habitat\u003c/strong> (habitat /ˈhæbɪtæt/) [C]","gloss":"přirozené prostředí, biotop","example":"Urban expansion can destroy the natural habitat of migratory birds and small mammals."},{"head":"\u003cstrong>eco-friendly\u003c/strong> /ˌiːkəʊ ˈfrendli/ (adjective)","gloss":"ekologický, šetrný k životnímu prostředí","example":"Using eco-friendly cleaning detergents helps reduce the amount of harmful chemicals entering waterways."},{"head":"\u003cstrong>conserve energy\u003c/strong> (conserve /kənˈsɜːv/ AmE /kənˈsɜːrv/) (phrase)","gloss":"šetřit energii","example":"Turning off lights and lowering heating temperatures are easy ways to conserve energy at home."},{"head":"\u003cstrong>pollution\u003c/strong> /pəˈluːʃn/ [U]","gloss":"znečištění","example":"Industrial pollution in some regions can contribute to respiratory diseases."},{"head":"\u003cstrong>extinct\u003c/strong> /ɪkˈstɪŋkt/ (adjective)","gloss":"vyhynulý","example":"Unless human pressure eases, many unique amphibians risk becoming completely extinct."},{"head":"\u003cstrong>sustainable\u003c/strong> /səˈsteɪnəbl/ (adjective)","gloss":"udržitelný","example":"Adopting sustainable farming practices can help to preserve topsoil fertility for future generations."},{"head":"\u003cstrong>waste sorting\u003c/strong> [U]","gloss":"třídění odpadu","example":"Effective waste sorting allows municipalities to reuse valuable raw materials."}],"answer":["For me, environmental protection is one of the most important topics discussed by our generation. Across the world, the effects of \u003cstrong>climate change\u003c/strong> and \u003cstrong>global warming\u003c/strong> are no longer distant scientific theories—we can feel them directly in our own everyday lives. Here in the Czech Republic, we regularly experience increasingly hot summers, longer periods of seasonal \u003cstrong>drought\u003c/strong>, declining groundwater levels, and occasional severe storms leading to a sudden \u003cstrong>flood\u003c/strong>.","At the core of the ecological crisis lies our consumption of resources. For decades, industry and transport have relied heavily on burning \u003cstrong>fossil fuels\u003c/strong>, releasing massive \u003cstrong>greenhouse gas emissions\u003c/strong> into our atmosphere. At the same time, worldwide \u003cstrong>deforestation\u003c/strong> threatens the \u003cstrong>natural habitat\u003c/strong> of wildlife, causing alarming \u003cstrong>biodiversity loss\u003c/strong> and pushing many \u003cstrong>endangered species\u003c/strong> to the brink of becoming \u003cstrong>extinct\u003c/strong>.","However, giving up is not an option. Real progress begins with gradually moving away from dirty energy towards clean \u003cstrong>renewable energy\u003c/strong>, such as power from wind farms and rooftop \u003cstrong>solar panels\u003c/strong>. Furthermore, young people can make a difference through everyday choices. Here in South Bohemia, many secondary school students take \u003cstrong>waste sorting\u003c/strong> very seriously. By taking public transport instead of driving cars, choosing to \u003cstrong>recycle\u003c/strong>, cutting down on \u003cstrong>single-use plastic\u003c/strong>, and learning to \u003cstrong>conserve energy\u003c/strong>, we can actively lower our personal \u003cstrong>carbon footprint\u003c/strong>. Adopting a more \u003cstrong>sustainable\u003c/strong> lifestyle is about taking practical steps to preserve a healthy planet for future generations."],"answer_info":"B2, ~245 slov","questions":[{"cat":"Popis","text":"What everyday evidence of climate change and environmental problems can we observe in the Czech Republic?"},{"cat":"Srovnání","text":"How do renewable energy sources like solar and wind power compare to traditional fossil fuels?"},{"cat":"Osobní přístup","text":"How do you and your family personally contribute to environmental protection in your daily life?"},{"cat":"Názor","text":"Why do some developing countries find it difficult to transition rapidly from fossil fuels to clean renewable energy?"},{"cat":"Popis","text":"What happens to household waste after it is collected from recycling bins in our towns?"},{"cat":"Hypotéza","text":"If the government made all public transport completely free for everyone, what environmental benefits and economic problems would arise?"},{"cat":"Názor","text":"How much responsibility do ordinary people have for protecting the climate compared to big industrial corporations?"}],"phrases":[{"head":"\u003cstrong>When it comes to ecological issues,...\u003c/strong>","gloss":"Pokud jde o ekologické otázky,...","note":"uvedení tématu"},{"head":"\u003cstrong>The biggest environmental threat we face today is...\u003c/strong>","gloss":"Největší ekologickou hrozbou, které dnes čelíme, je...","note":"pojmenování priority"},{"head":"\u003cstrong>Small everyday changes can make a big difference, such as...\u003c/strong>","gloss":"Malé každodenní změny mohou mít velký dopad, jako například...","note":"praktický přístup"},{"head":"\u003cstrong>We need to find a balance between modern living and...\u003c/strong>","gloss":"Musíme najít rovnováhu mezi moderním způsobem života a...","note":"vyvážení zájmů"},{"head":"\u003cstrong>From my personal perspective,...\u003c/strong>","gloss":"Z mého osobního pohledu...","note":"vyjádření postoje"},{"head":"\u003cstrong>You cannot deny that... / There is no doubt that...\u003c/strong>","gloss":"Nelze popřít, že... / Není pochyb o tom, že...","note":"přiznání faktu"},{"head":"\u003cstrong>To put it in a nutshell, protecting the environment is about...\u003c/strong>","gloss":"V kostce řečeno, ochrana životního prostředí je o...","note":"závěrečné shrnutí"}],"unverified":0},{"file":"tema-s25-global-problems-current-affairs.md","title":"Global problems and current affairs","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu. Jazykové opravy: Claude, 25. 11. 2026 (#1158), čekají na kontrolu a schválení učitelem. Věcné opravy: Claude, 26. 11. 2026 (#1173), čekají na kontrolu a schválení učitelem.","s":25,"v":25,"vocab":[{"head":"\u003cstrong>armed conflict\u003c/strong> (armed /ɑːmd/ AmE /ɑːrmd/; conflict /ˈkɒnflɪkt/ AmE /ˈkɑːnflɪkt/) [C/U]","gloss":"ozbrojený konflikt","example":"Ongoing armed conflicts force millions of civilians to abandon their homes and seek safety."},{"head":"\u003cstrong>humanitarian aid\u003c/strong> (humanitarian /hjuːˌmænɪˈteəriən/ AmE /hjuːˌmænɪˈteriən/; aid /eɪd/) [U]","gloss":"humanitární pomoc","example":"Convoys delivering food, clean water, and medicine bring essential humanitarian aid to war zones."},{"head":"\u003cstrong>refugee\u003c/strong> /ˌrefjuˈdʒiː/ [C]","gloss":"uprchlík","example":"International law protects refugees who flee persecution."},{"head":"\u003cstrong>poverty\u003c/strong> /ˈpɒvəti/ AmE /ˈpɑːvərti/ [U]","gloss":"chudoba","example":"Eradicating extreme poverty requires fair access to primary education and healthcare."},{"head":"\u003cstrong>famine\u003c/strong> /ˈfæmɪn/ [C/U]","gloss":"hladomor","example":"Prolonged drought and civil war can trigger catastrophic famine in developing regions."},{"head":"\u003cstrong>economic inequality\u003c/strong> (inequality /ˌɪnɪˈkwɒləti/ AmE /ˌɪnɪˈkwɑːləti/) [U]","gloss":"ekonomická nerovnost","example":"Economic inequality between wealthy nations and developing countries fuels migration."},{"head":"\u003cstrong>international community\u003c/strong> [C, usually singular]","gloss":"mezinárodní společenství","example":"The international community must unite to condemn state aggression and uphold peace."},{"head":"\u003cstrong>peacekeeping mission\u003c/strong> (peacekeeping /ˈpiːskiːpɪŋ/; mission /ˈmɪʃn/) [C]","gloss":"mírová mise (např. jednotek OSN)","example":"The United Nations deploys soldiers on a peacekeeping mission to monitor fragile ceasefires."},{"head":"\u003cstrong>terrorism\u003c/strong> /ˈterərɪzəm/ [U]","gloss":"terorismus","example":"International intelligence agencies cooperate closely to prevent acts of terrorism."},{"head":"\u003cstrong>threat\u003c/strong> /θret/ [C]","gloss":"hrozba","example":"Cyberattacks on public hospitals and power grids pose a serious security threat."},{"head":"\u003cstrong>asylum seeker\u003c/strong> /əˈsaɪləm siːkə(r)/ AmE /əˈsaɪləm siːkər/ [C]","gloss":"žadatel o azyl","example":"Authorities review documentation to assess whether an asylum seeker meets the legal criteria for protection."},{"head":"\u003cstrong>diplomatic negotiations\u003c/strong> (diplomatic /ˌdɪpləˈmætɪk/) [plural]","gloss":"diplomatická jednání, diplomatické vyjednávání","example":"Resolving territorial disputes through patient diplomatic negotiations prevents unnecessary bloodshed."},{"head":"\u003cstrong>economic sanctions\u003c/strong> [plural]","gloss":"ekonomické / hospodářské sankce","example":"Democratic nations often impose targeted economic sanctions to punish aggressive foreign regimes."},{"head":"\u003cstrong>human rights violation\u003c/strong> (violation /ˌvaɪəˈleɪʃn/) [C]","gloss":"porušení lidských práv","example":"Independent monitors document human rights violations in authoritarian states."},{"head":"\u003cstrong>charity\u003c/strong> /ˈtʃærəti/ [C/U]","gloss":"charita, dobročinná organizace","example":"Many students donate pocket money or warm clothes to a local charity helping homeless people."},{"head":"\u003cstrong>displaced person\u003c/strong> /dɪsˌpleɪst ˈpɜːsn/ AmE /dɪsˌpleɪst ˈpɜːrsn/ [C]","gloss":"vysídlená osoba (člověk nuceně opouštějící domov)","example":"Camps provide temporary shelter and food for displaced people in the border region."},{"head":"\u003cstrong>global pandemic\u003c/strong> (pandemic /pænˈdemɪk/) [C]","gloss":"celosvětová pandemie","example":"The recent global pandemic demonstrated that contagious diseases respect no national borders."},{"head":"\u003cstrong>tackle a problem\u003c/strong> (tackle /ˈtækl/) (phrase)","gloss":"řešit problém, postavit se problému čelem","example":"Global leaders must cooperate effectively if we are to tackle the problem of resource scarcity."},{"head":"\u003cstrong>volunteer\u003c/strong> /ˌvɒlənˈtɪə/ AmE /ˌvɑːlənˈtɪr/ [C; verb]","gloss":"dobrovolník [C]; pracovat jako dobrovolník [verb]","example":"Many teenagers volunteer at animal shelters or help out as volunteers in community centres."},{"head":"\u003cstrong>solidarity\u003c/strong> /ˌsɒlɪˈdærəti/ AmE /ˌsɑːlɪˈdærəti/ [U]","gloss":"solidarita, vzájemná pomoc","example":"Czech citizens showed inspiring solidarity by opening their homes to families escaping the war in Ukraine."},{"head":"\u003cstrong>current affairs\u003c/strong> /ˌkʌrənt əˈfeəz/ AmE /ˌkɜːrənt əˈferz/ [plural]","gloss":"aktuální dění, současné světové události (POZOR: \u003cem>actual ≠ aktuální\u003c/em>)","example":"Reading reputable international magazines helps students stay well informed about current affairs."},{"head":"\u003cstrong>crisis\u003c/strong> /ˈkraɪsɪs/ [C, plural crises]","gloss":"krize","example":"Managing an acute energy crisis requires international cooperation and energy saving."}],"answer":["Living in a deeply interconnected world means that global problems affect our daily lives, even if they happen thousands of miles away. As secondary school students preparing for adult life, we follow \u003cstrong>current affairs\u003c/strong> not only for school but also because following them helps us understand our place in the wider world. From economic troubles and health crises to the tragic reality of war, our world faces many serious challenges today.","For me, the most heartbreaking global challenge is the resurgence of \u003cstrong>armed conflict\u003c/strong>. The devastating war in Ukraine reminded European nations that peace and democratic freedoms cannot be taken for granted. Military conflicts create immense human suffering, destroying infrastructure and forcing millions of innocent families to become \u003cstrong>refugees\u003c/strong>. When the war broke out, Czech society showed remarkable \u003cstrong>solidarity\u003c/strong>, offering shelter, schooling, and \u003cstrong>humanitarian aid\u003c/strong> to those who had lost everything.","Beyond regional conflicts, humanity faces structural issues like extreme \u003cstrong>poverty\u003c/strong>, hunger, and \u003cstrong>economic inequality\u003c/strong>. In many parts of the developing world, climate catastrophes contribute to severe \u003cstrong>famine\u003c/strong> and displace entire communities. Tackling these challenges is very difficult for any single country acting alone. The \u003cstrong>international community\u003c/strong>, through organizations like the United Nations, must rely on \u003cstrong>diplomatic negotiations\u003c/strong> and international law. We must also defend ourselves against \u003cstrong>threats\u003c/strong> like \u003cstrong>terrorism\u003c/strong> and cyberattacks. In my view, young people cannot solve global crises overnight. Still, working as a \u003cstrong>volunteer\u003c/strong> in local \u003cstrong>charity\u003c/strong> projects and staying well informed help us become responsible citizens who care about peace and fairness."],"answer_info":"B2, ~245 slov","questions":[{"cat":"Popis","text":"What do you consider the most urgent global problems facing humanity today?"},{"cat":"Srovnání","text":"In what ways do today's military and security threats differ from those of the twentieth century?"},{"cat":"Zkušenost","text":"How have recent global events, such as the war in Ukraine or the energy crisis, affected life in the Czech Republic?"},{"cat":"Názor","text":"Why is it often difficult for international organizations like the United Nations to stop armed conflicts quickly?"},{"cat":"Popis","text":"What is the difference between an economic migrant and a refugee?"},{"cat":"Hypotéza","text":"If developed countries invested significantly more in schools and healthcare in poorer regions, how would that improve global stability?"},{"cat":"Osobní role","text":"How can individual citizens and teenagers actively contribute to resolving global or community problems?"}],"phrases":[{"head":"\u003cstrong>In our interconnected world, no country can...\u003c/strong>","gloss":"V našem propojeném světě nemůže žádná země...","note":"globální souvislost"},{"head":"\u003cstrong>The most alarming crisis we are witnessing today is...\u003c/strong>","gloss":"Nejvíce alarmující krizí, jíž jsme dnes svědky, je...","note":"vyzdvižení závažnosti"},{"head":"\u003cstrong>When we look at the main reasons behind this conflict,...\u003c/strong>","gloss":"Když se podíváme na hlavní příčiny tohoto konfliktu,...","note":"analýza příčin"},{"head":"\u003cstrong>International cooperation is essential when...\u003c/strong>","gloss":"Mezinárodní spolupráce je nezbytná, když...","note":"nutnost spolupráce"},{"head":"\u003cstrong>From a humanitarian standpoint,...\u003c/strong>","gloss":"Z humanitárního hlediska...","note":"lidský rozměr"},{"head":"\u003cstrong>While it is easy to feel powerless,...\u003c/strong>","gloss":"Ačkoliv je snadné cítit se bezmocný,...","note":"naděje / aktivní přístup"},{"head":"\u003cstrong>To conclude, tackling these challenges requires...\u003c/strong>","gloss":"Na závěr: zvládnout tyto výzvy vyžaduje...","note":"závěrečné shrnutí"}],"unverified":0},{"file":"tema-s4-place-where-i-live-study.md","title":"Place where I live/study","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu. Věcné opravy: Claude, 26. 11. 2026 (#1173), čekají na kontrolu a schválení učitelem.","s":4,"v":4,"vocab":[{"head":"\u003cstrong>commute to / from\u003c/strong> (commute /kəˈmjuːt/) (verb)","gloss":"dojíždět do / z","example":"Many students commute to České Budějovice from surrounding villages every morning."},{"head":"\u003cstrong>suburb\u003c/strong> /ˈsʌbɜːb/ AmE /ˈsʌbɜːrb/ [C]","gloss":"předměstí, okrajová část města","example":"They decided to move to a quiet suburb where children can play outside safely."},{"head":"\u003cstrong>amenities\u003c/strong> [plural]","gloss":"občanská vybavenost, služby a zázemí (sportoviště, knihovny, obchody apod.)","example":"Our neighbourhood offers excellent amenities, including a library, a post office, and a sports centre."},{"head":"\u003cstrong>hustle and bustle\u003c/strong> (hustle /ˈhʌsl/; bustle /ˈbʌsl/) [U]","gloss":"shon a ruch","example":"After a hectic week in the hustle and bustle of the town centre, I enjoy relaxing in nature."},{"head":"\u003cstrong>picturesque\u003c/strong> /ˌpɪktʃəˈresk/ (adjective)","gloss":"malebný","example":"South Bohemia is famous for its picturesque countryside and historic ponds."},{"head":"\u003cstrong>housing estate\u003c/strong> /ˈhaʊzɪŋ ɪsteɪt/ [C]","gloss":"sídliště","example":"I grew up in a block of flats on a lively housing estate near the park."},{"head":"\u003cstrong>within walking distance\u003c/strong> (walking /ˈwɔːkɪŋ/) (phrase)","gloss":"v docházkové vzdálenosti","example":"My secondary school is located within walking distance of the train station."},{"head":"\u003cstrong>public transport\u003c/strong> /ˌpʌblɪk ˈtrænspɔːt/ AmE /ˌpʌblɪk ˈtrænspɔːrt/ [U]","gloss":"městská hromadná doprava, veřejná doprava","example":"Taking public transport can be faster than driving during peak traffic."},{"head":"\u003cstrong>historic centre\u003c/strong> [C]","gloss":"historické centrum","example":"Many tourists love strolling through the historic centre with its cobblestone streets and old town hall."},{"head":"\u003cstrong>residential area\u003c/strong> (residential /ˌrezɪˈdenʃl/) [C]","gloss":"obytná čtvrť, rezidenční oblast","example":"Heavy lorries are not allowed to enter this peaceful residential area."},{"head":"\u003cstrong>surroundings\u003c/strong> /səˈraʊndɪŋz/ [plural]","gloss":"okolí, prostředí","example":"The school has pleasant green surroundings where students spend their lunch breaks."},{"head":"\u003cstrong>rush hour\u003c/strong> /ˈrʌʃ aʊə(r)/ AmE /ˈrʌʃ aʊər/ [C/U]","gloss":"dopravní špička (v jednotném čísle se členem \u003cem>the rush hour\u003c/em> i nepočitatelně \u003cem>during rush hour\u003c/em>)","example":"Buses are often packed with commuters during the morning rush hour."},{"head":"\u003cstrong>green space\u003c/strong> [C/U]","gloss":"zeleň, zelené prostranství","example":"Town planners should create more green space so that residents have places to exercise."},{"head":"\u003cstrong>hometown\u003c/strong> [C]","gloss":"rodné město","example":"Even if I study abroad one day, I will always consider České Budějovice my hometown."},{"head":"\u003cstrong>landmark\u003c/strong> /ˈlændmɑːk/ AmE /ˈlændmɑːrk/ [C]","gloss":"dominanta, významný orientační bod","example":"The Black Tower is a well-known landmark of the town."},{"head":"\u003cstrong>overcrowded\u003c/strong> /ˌəʊvəˈkraʊdɪd/ AmE /ˌəʊvərˈkraʊdɪd/ (adjective)","gloss":"přelidněný, přeplněný","example":"In the middle of the afternoon, the main square gets quite overcrowded with shoppers and visitors."},{"head":"\u003cstrong>secondary school\u003c/strong> /ˈsekəndri skuːl/ AmE /ˈsekənderi skuːl/ [C]","gloss":"střední škola","example":"Attending a demanding secondary school requires careful time management."},{"head":"\u003cstrong>facilities\u003c/strong> [plural]","gloss":"zařízení, vybavení","example":"Our school provides modern facilities, such as updated science laboratories and a gym."},{"head":"\u003cstrong>traffic jam\u003c/strong> /ˈtræfɪk dʒæm/ [C]","gloss":"dopravní zácpa","example":"Drivers can get stuck in a traffic jam when crossing the main bridge."},{"head":"\u003cstrong>detached house\u003c/strong> (detached /dɪˈtætʃt/) [C]","gloss":"samostatně stojící rodinný dům","example":"My grandparents live in a cosy detached house with a large vegetable garden."},{"head":"\u003cstrong>pedestrian zone\u003c/strong> (pedestrian /pəˈdestriən/; zone /zəʊn/) [C]","gloss":"pěší zóna","example":"The main street was recently turned into a pedestrian zone full of outdoor cafés."},{"head":"\u003cstrong>lively\u003c/strong> /ˈlaɪvli/ (adjective)","gloss":"živý, rušný","example":"The square becomes particularly lively during the annual Christmas market."}],"answer":["I live in South Bohemia and I study at a \u003cstrong>secondary school\u003c/strong> located near the heart of České Budějovice. My family lives in a quiet \u003cstrong>residential area\u003c/strong> on the edge of the town, in a comfortable \u003cstrong>detached house\u003c/strong>. What I value most about our neighbourhood is that we have plenty of \u003cstrong>green space\u003c/strong> and parks nearby, which gives us a calm break from daily stress. At the same time, we do not feel cut off, because all essential \u003cstrong>amenities\u003c/strong>, like sports grounds, a library, and shops, are \u003cstrong>within walking distance\u003c/strong>.","Every weekday morning, my routine revolves around my journey to school. Because our house is located a bit further out, I rely on \u003cstrong>public transport\u003c/strong>. During the morning \u003cstrong>rush hour\u003c/strong>, buses can be somewhat \u003cstrong>overcrowded\u003c/strong>, and occasionally we get stuck in a \u003cstrong>traffic jam\u003c/strong> near the river. Even so, taking the bus allows me to review my notes or listen to music before lessons begin.","Our school itself has great \u003cstrong>facilities\u003c/strong>, including modern classrooms and sports grounds. Since it stands close to the \u003cstrong>historic centre\u003c/strong>, my classmates and I often spend our free periods in the nearby \u003cstrong>pedestrian zone\u003c/strong>. České Budějovice is a great place to study; it is not as overwhelming as Prague, but it is certainly \u003cstrong>lively\u003c/strong> enough and it is a wonderful \u003cstrong>hometown\u003c/strong> for me. On weekends, I love exploring the \u003cstrong>picturesque surroundings\u003c/strong>, whether that means cycling along the river Vltava or visiting Hluboká castle. In short, I really like having a quiet home while studying in an energetic town. It gives me a great balance between schoolwork and an active social life."],"answer_info":"B2, ~250 slov","questions":[{"cat":"Popis","text":"How would you describe the area where your house or flat is situated to someone who has never been there?"},{"cat":"Srovnání","text":"In what ways does living in a large housing estate differ from living in a detached house in the countryside?"},{"cat":"Zkušenost","text":"How do you usually spend your time during your daily journey to school?"},{"cat":"Názor","text":"Why do many teenagers feel that small villages do not offer enough opportunities for their free time?"},{"cat":"Hypotéza","text":"If your local council gave you the budget to improve your neighbourhood, what specific changes would you introduce?"},{"cat":"Srovnání","text":"What are the advantages and drawbacks of studying in a regional town compared to studying in the capital city?"},{"cat":"Názor / budoucnost","text":"Where do you see yourself living once you finish your education and start your career, and what factors will influence your choice?"}],"phrases":[{"head":"\u003cstrong>To tell you the truth,...\u003c/strong>","gloss":"Abych řekl pravdu,...","note":"osobní komentář / úvod"},{"head":"\u003cstrong>What I appreciate most about my neighbourhood is...\u003c/strong>","gloss":"Co na svém okolí oceňuji nejvíce, je...","note":"vyzdvižení kladu"},{"head":"\u003cstrong>It is conveniently located because...\u003c/strong>","gloss":"Má výhodnou polohu, protože...","note":"odůvodnění polohy"},{"head":"\u003cstrong>On the downside,...\u003c/strong>","gloss":"Stinnou stránkou / nevýhodou je to, že...","note":"uvedení záporu"},{"head":"\u003cstrong>When you compare the two,...\u003c/strong>","gloss":"Když obě možnosti porovnáte,...","note":"srovnání"},{"head":"\u003cstrong>Generally speaking, life here is rather...\u003c/strong>","gloss":"Obecně vzato je zde život poměrně...","note":"zobecnění"},{"head":"\u003cstrong>All in all, I wouldn't change my current living situation because...\u003c/strong>","gloss":"Celkově vzato bych své současné bydlení neměnil, protože...","note":"závěrečné shrnutí"}],"unverified":0},{"file":"tema-s5-health-and-medical-care.md","title":"Health and medical care / Health and body care","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu. Jazykové opravy: Claude, 25. 11. 2026 (#1158), čekají na kontrolu a schválení učitelem. Věcné opravy: Claude, 26. 11. 2026 (#1173), čekají na kontrolu a schválení učitelem.","s":5,"v":5,"vocab":[{"head":"\u003cstrong>general practitioner (GP)\u003c/strong> (general practitioner /ˌdʒenrəl prækˈtɪʃənə(r)/ AmE /ˌdʒenrəl prækˈtɪʃənər/) [C]","gloss":"praktický lékař","example":"When you fall ill, your first step is usually to visit your general practitioner."},{"head":"\u003cstrong>prescription\u003c/strong> /prɪˈskrɪpʃn/ [C]","gloss":"lékařský předpis, recept na léky","example":"Antibiotics cannot be bought freely; you always need a prescription from a doctor."},{"head":"\u003cstrong>over-the-counter\u003c/strong> /ˌəʊvə ðə ˈkaʊntə(r)/ AmE /ˌəʊvər ðə ˈkaʊntər/ (adjective / adverb)","gloss":"volně prodejný (bez lékařského předpisu); bez předpisu","example":"You can easily buy over-the-counter painkillers and nasal sprays at any local pharmacy."},{"head":"\u003cstrong>symptom\u003c/strong> /ˈsɪmptəm/ [C]","gloss":"příznak (nemoci), symptom","example":"A persistent dry cough and high fever are common symptoms of respiratory infections."},{"head":"\u003cstrong>recover from\u003c/strong> (recover /rɪˈkʌvə/ AmE /rɪˈkʌvər/) (verb)","gloss":"zotavit se z, uzdravit se z","example":"It took him nearly two weeks to fully recover from the seasonal flu."},{"head":"\u003cstrong>preventative check-up\u003c/strong> [C]","gloss":"preventivní prohlídka","example":"Dentists recommend having a regular preventative check-up to detect problems early."},{"head":"\u003cstrong>painkiller\u003c/strong> /ˈpeɪnkɪlə/ AmE /ˈpeɪnkɪlər/ [C]","gloss":"lék proti bolesti","example":"She took a mild painkiller to relieve her throbbing headache."},{"head":"\u003cstrong>balanced diet\u003c/strong> (balanced /ˈbælənst/) [singular/U]","gloss":"vyvážená strava (obvykle se členem: \u003cem>a balanced diet\u003c/em>)","example":"Eating fresh vegetables, fruit, and lean meat helps you maintain a balanced diet."},{"head":"\u003cstrong>contagious\u003c/strong> /kənˈteɪdʒəs/ (adjective)","gloss":"nakažlivý (přenášený přímým kontaktem; širší obecný termín pro infekční je \u003cem>infectious\u003c/em>)","example":"Students with contagious viral infections should stay at home until they are no longer infectious."},{"head":"\u003cstrong>sprain\u003c/strong> /spreɪn/ (verb)","gloss":"podvrtnout si (kloub, např. kotník; vykloubení je \u003cem>dislocation\u003c/em>)","example":"He accidentally sprained his left ankle during basketball training."},{"head":"\u003cstrong>well-being\u003c/strong> /ˈwel biːɪŋ/ [U]","gloss":"tělesná a duševní pohoda, celkové zdraví","example":"Regular physical activity contributes greatly to your long-term mental and physical well-being."},{"head":"\u003cstrong>sedentary lifestyle\u003c/strong> (sedentary /ˈsedntri/ AmE /ˈsednteri/) [C]","gloss":"sedavý způsob života","example":"Spending eight hours a day in front of a computer screen can lead to a sedentary lifestyle."},{"head":"\u003cstrong>immune system\u003c/strong> /ɪˈmjuːn sɪstəm/ [C]","gloss":"imunitní systém","example":"Getting sufficient sleep and regular exercise can help your immune system fight winter bugs."},{"head":"\u003cstrong>treatment\u003c/strong> /ˈtriːtmənt/ [C/U]","gloss":"léčba, ošetření","example":"Early diagnosis greatly improves the chances that medical treatment will be quick and effective."},{"head":"\u003cstrong>side effect\u003c/strong> /ˈsaɪd ɪfekt/ [C]","gloss":"nežádoucí účinek, vedlejší účinek","example":"Always read the package leaflet to check whether the medication causes any drowsiness or other side effects."},{"head":"\u003cstrong>exhaustion\u003c/strong> /ɪɡˈzɔːstʃən/ [U]","gloss":"vyčerpání","example":"After preparing for difficult exams without proper rest, several students suffered from extreme exhaustion."},{"head":"\u003cstrong>cope with stress\u003c/strong> (cope /kəʊp/) (phrase)","gloss":"zvládat stres, vyrovnávat se se stresem","example":"Finding time for hobbies and outdoor walks can help teenagers cope with school stress."},{"head":"\u003cstrong>first aid kit\u003c/strong> /ˌfɜːst ˈeɪd kɪt/ AmE /ˌfɜːrst ˈeɪd kɪt/ [C]","gloss":"lékárnička","example":"Every school and passenger car should be equipped with a properly stocked first aid kit."},{"head":"\u003cstrong>ointment\u003c/strong> /ˈɔɪntmənt/ [C/U]","gloss":"léčivá mast","example":"The doctor advised applying an antiseptic ointment to the scratch twice a day."},{"head":"\u003cstrong>surgery\u003c/strong> /ˈsɜːdʒəri/ AmE /ˈsɜːrdʒəri/ [C/U]","gloss":"ordinace lékaře [C]; chirurgie, operativní léčba / zákrok [U]","example":"Patients waited quietly in the waiting room outside the doctor's surgery."},{"head":"\u003cstrong>undergo an operation\u003c/strong> (undergo /ˌʌndəˈɡəʊ/ AmE /ˌʌndərˈɡəʊ/) (phrase)","gloss":"podstoupit operaci","example":"He had to undergo a minor knee operation after tearing a ligament in football."},{"head":"\u003cstrong>body care\u003c/strong> [U]","gloss":"péče o tělo (hygiena a péče o pokožku)","example":"Good body care involves proper hygiene, protecting your skin from the sun, and staying clean."}],"answer":["For me, maintaining good health is perhaps the most important thing in life, especially during demanding school years. For us secondary school students, taking care of our health is not always easy. We spend hours sitting in classrooms and studying for exams, so it is easy to slip into a \u003cstrong>sedentary lifestyle\u003c/strong>. When pressure builds up, lack of sleep and \u003cstrong>exhaustion\u003c/strong> can quickly weaken the \u003cstrong>immune system\u003c/strong>, making us more vulnerable to seasonal bugs.","In my view, staying healthy requires a sensible daily routine rather than extreme measures. I try to combine regular physical exercise with a \u003cstrong>balanced diet\u003c/strong> rich in fruit and vitamins. Physical activity is not just about staying fit; it is also an effective way to \u003cstrong>cope with stress\u003c/strong> and boost overall mental \u003cstrong>well-being\u003c/strong>. Everyday \u003cstrong>body care\u003c/strong> and hygiene, alongside getting eight to nine hours of restful sleep, help us feel refreshed every morning.","When someone falls ill, I think our healthcare system provides reliable support. In the Czech Republic, public health insurance covers essential medical care at a doctor's surgery or emergency department. For mild colds or headaches, we can take an \u003cstrong>over-the-counter\u003c/strong> \u003cstrong>painkiller\u003c/strong> and rest in bed. However, for a persistent condition or serious infection, we need to visit our \u003cstrong>general practitioner\u003c/strong>. The doctor examines the patient, writes a \u003cstrong>prescription\u003c/strong>, and recommends proper \u003cstrong>treatment\u003c/strong>. I also believe in prevention; attending a regular \u003cstrong>preventative check-up\u003c/strong> can catch hidden issues early. I am convinced that looking after our health is the best investment in our future."],"answer_info":"B2, ~245 slov","questions":[{"cat":"Popis","text":"What happens when a patient visits their general practitioner with symptoms of a viral infection?"},{"cat":"Zkušenost","text":"How do you personally look after your physical and mental health when you are feeling overwhelmed by schoolwork?"},{"cat":"Srovnání","text":"In what ways do modern lifestyle habits and our grandparents' habits differ in their health risks?"},{"cat":"Názor","text":"Why do some people prefer taking over-the-counter painkillers immediately instead of addressing the root causes of their pain?"},{"cat":"Hypotéza","text":"If secondary schools introduced mandatory daily physical exercise sessions, how would that affect students' concentration and well-being?"},{"cat":"Srovnání","text":"What are the differences between universal healthcare funded by public insurance, as in the Czech Republic, and systems that rely heavily on private insurance, as in the United States?"},{"cat":"Názor / etika","text":"How can society encourage young people to adopt healthier eating habits without making food choices feel restrictive or boring?"}],"phrases":[{"head":"\u003cstrong>As the saying goes, prevention is better than cure.\u003c/strong>","gloss":"Jak se říká, prevence je lepší než léčba.","note":"uvedení obecné zásady"},{"head":"\u003cstrong>From my personal experience,...\u003c/strong>","gloss":"Podle mé osobní zkušenosti...","note":"uvedení příkladu z praxe"},{"head":"\u003cstrong>When it comes to maintaining a healthy lifestyle,...\u003c/strong>","gloss":"Pokud jde o udržování zdravého životního stylu,...","note":"přechod k tématu"},{"head":"\u003cstrong>It is essential to find a balance between...\u003c/strong>","gloss":"Je zásadní najít rovnováhu mezi...","note":"vyvážení dvou aspektů"},{"head":"\u003cstrong>A major concern among teenagers today is...\u003c/strong>","gloss":"Velkou starostí mezi dnešními teenagery je...","note":"uvedení problému"},{"head":"\u003cstrong>On top of that,...\u003c/strong>","gloss":"A navíc / Kromě toho...","note":"přidání dalšího argumentu"},{"head":"\u003cstrong>To put it briefly, staying healthy is about...\u003c/strong>","gloss":"Stručně řečeno, zůstat zdravý znamená především...","note":"závěrečná myšlenka"}],"unverified":0},{"file":"tema-s6-money-shopping-services.md","title":"Money, shopping, services","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu. Jazykové opravy: Claude, 25. 11. 2026 (#1158), čekají na kontrolu a schválení učitelem. Věcné opravy: Claude, 26. 11. 2026 (#1173), čekají na kontrolu a schválení učitelem.","s":6,"v":6,"vocab":[{"head":"\u003cstrong>budget\u003c/strong> /ˈbʌdʒɪt/ [C]","gloss":"rozpočet","example":"Students who manage a monthly budget are less likely to run into financial trouble."},{"head":"\u003cstrong>pocket money\u003c/strong> /ˈpɒkɪt mʌni/ AmE /ˈpɑːkɪt mʌni/ [U]","gloss":"kapesné","example":"My parents give me a fixed amount of pocket money each month to cover my leisure activities."},{"head":"\u003cstrong>part-time job\u003c/strong> [C]","gloss":"práce na částečný úvazek, brigáda","example":"Working in a local café on weekends is a part-time job that some secondary school students do."},{"head":"\u003cstrong>brick-and-mortar shop\u003c/strong> (brick /brɪk/; mortar /ˈmɔːtə(r)/ AmE /ˈmɔːrtər/) [C]","gloss":"kamenný obchod","example":"Although many people prefer shopping online, brick-and-mortar shops allow customers to try clothes on."},{"head":"\u003cstrong>bargain\u003c/strong> /ˈbɑːɡən/ AmE /ˈbɑːrɡən/ [C]","gloss":"výhodná koupě","example":"She found a genuine designer jacket on sale for a quarter of the original price, which was a real bargain."},{"head":"\u003cstrong>receipt\u003c/strong> /rɪˈsiːt/ [C]","gloss":"účtenka, pokladní doklad","example":"Always keep your receipt in case you need to exchange an item or make a warranty claim."},{"head":"\u003cstrong>refund\u003c/strong> /ˈriːfʌnd/ [C]","gloss":"vrácení peněz (při reklamaci)","example":"Because the electronic gadget was already broken when the customer unpacked it, the store issued an immediate refund."},{"head":"\u003cstrong>contactless payment\u003c/strong> (contactless /ˈkɒntæktləs/ AmE /ˈkɑːntæktləs/) [C/U]","gloss":"bezkontaktní platba","example":"In many places in the Czech Republic, you can pay for goods using contactless payment with your mobile phone."},{"head":"\u003cstrong>in cash\u003c/strong> (phrase)","gloss":"v hotovosti","example":"Some small farmers at the Saturday market still accept payments only in cash."},{"head":"\u003cstrong>current account\u003c/strong> /ˈkʌrənt əkaʊnt/ AmE /ˈkɜːrənt əkaʊnt/ [C]","gloss":"běžný účet (v bance)","example":"Many teenagers open their first current account to receive wages from summer jobs."},{"head":"\u003cstrong>savings\u003c/strong> /ˈseɪvɪŋz/ [plural]","gloss":"úspory","example":"He decided to put aside ten percent of his earnings every month to build up his savings."},{"head":"\u003cstrong>afford\u003c/strong> /əˈfɔːd/ AmE /əˈfɔːrd/ (verb, usually with can/could)","gloss":"dovolit si (finančně)","example":"I would love to buy a new laptop, but I cannot afford it until I finish my summer job."},{"head":"\u003cstrong>overspend\u003c/strong> /ˌəʊvəˈspend/ AmE /ˌəʊvərˈspend/ (verb)","gloss":"přečerpat rozpočet, utratit víc, než je záhodno","example":"It is easy to overspend when you pay only by card or phone without seeing actual banknotes."},{"head":"\u003cstrong>faulty goods\u003c/strong> (faulty /ˈfɔːlti/) [plural]","gloss":"vadné zboží","example":"Consumer protection laws give buyers of faulty goods the right to a repair, a replacement or, in some cases, a refund within a statutory period."},{"head":"\u003cstrong>warranty\u003c/strong> /ˈwɒrənti/ AmE /ˈwɔːrənti/ [C/U]","gloss":"záruka (smluvní či obchodní záruka; zákonná práva z vadného plnění v ČR chrání kupujícího, projeví-li se vada do 24 měsíců)","example":"The new smartphone comes with a two-year warranty covering manufacturing defects."},{"head":"\u003cstrong>delivery fee\u003c/strong> (delivery /dɪˈlɪvəri/; fee /fiː/) [C]","gloss":"poplatek za doručení, poštovné","example":"Online shops frequently offer free shipping if your purchase exceeds a certain amount, so you save the delivery fee."},{"head":"\u003cstrong>customer service\u003c/strong> /ˌkʌstəmə ˈsɜːvɪs/ AmE /ˌkʌstəmər ˈsɜːrvɪs/ [U]","gloss":"zákaznický servis","example":"Polite and responsive customer service can turn a disappointed shopper into a loyal customer."},{"head":"\u003cstrong>second-hand\u003c/strong> /ˌsekənd ˈhænd/ (adjective)","gloss":"použitý, z druhé ruky","example":"Buying second-hand books and vintage clothes has become popular with many young people."},{"head":"\u003cstrong>chain store\u003c/strong> /ˈtʃeɪn stɔː(r)/ AmE /ˈtʃeɪn stɔːr/ [C]","gloss":"prodejna obchodního řetězce","example":"Many large shopping malls are dominated by international chain stores selling identical fashion."},{"head":"\u003cstrong>financial literacy\u003c/strong> (literacy /ˈlɪtərəsi/) [U]","gloss":"finanční gramotnost","example":"Developing basic financial literacy at secondary school can help young adults avoid dangerous debts."},{"head":"\u003cstrong>rip-off\u003c/strong> /ˈrɪp ɒf/ AmE /ˈrɪp ɔːf/ [C, informal]","gloss":"předražená věc, zlodějina","example":"Charging ten euros for a bottle of tap water at the airport is a total rip-off."},{"head":"\u003cstrong>convenience\u003c/strong> /kənˈviːniəns/ [U]","gloss":"pohodlí, výhodnost","example":"One great advantage of online shopping is sheer convenience: you order from your bed at midnight."}],"answer":["In our everyday lives, money and shopping play an essential role, and how we handle them is changing. As a secondary school student, I do not have a regular income yet, but managing \u003cstrong>pocket money\u003c/strong> and earnings from a summer \u003cstrong>part-time job\u003c/strong> has taught me the importance of personal \u003cstrong>financial literacy\u003c/strong>. To avoid reckless habits, I try to keep a simple monthly \u003cstrong>budget\u003c/strong>. It is remarkably easy to \u003cstrong>overspend\u003c/strong> if you constantly pay by card or with mobile apps, because paying digitally feels less real than paying \u003cstrong>in cash\u003c/strong>. Putting aside even a small portion of money into \u003cstrong>savings\u003c/strong> gives me a reassuring sense of independence.","When it comes to consumer habits, patterns among young people have shifted towards e-commerce. The \u003cstrong>convenience\u003c/strong> of ordering clothes or school supplies online with next-day delivery is hard to resist, especially when online shops waive the \u003cstrong>delivery fee\u003c/strong>. On the other hand, I still enjoy visiting a traditional \u003cstrong>brick-and-mortar shop\u003c/strong>, particularly when buying shoes or clothing, because you can inspect the quality and try items on before paying.","Services and consumer rights are another crucial area. Whenever we buy electronics or more expensive items, keeping the \u003cstrong>receipt\u003c/strong> is vital. If you receive \u003cstrong>faulty goods\u003c/strong>, consumer protection laws provide statutory rights if a defect appears within two years, alongside any store \u003cstrong>warranty\u003c/strong>. Customers can usually request repair or replacement first, and if the seller cannot resolve the issue, customers may ask for a price reduction or a full \u003cstrong>refund\u003c/strong>. In my experience, good \u003cstrong>customer service\u003c/strong> makes all the difference when a shop deals with complaints. Ultimately, I think learning to spend thoughtfully, spotting a genuine \u003cstrong>bargain\u003c/strong>, and avoiding unnecessary debts are fundamental life skills every young adult needs."],"answer_info":"B2, ~255 slov","questions":[{"cat":"Popis","text":"How do most teenagers in your country typically manage their money and monthly expenses?"},{"cat":"Srovnání","text":"What are the main differences between shopping online and buying goods in a traditional brick-and-mortar shop?"},{"cat":"Zkušenost","text":"What is the best bargain you have ever found, or conversely, a purchase that turned out to be a complete rip-off?"},{"cat":"Názor","text":"Why do some economists warn that a completely cashless society could create difficulties for certain groups of people?"},{"cat":"Popis procesu","text":"What steps should a customer take if they purchase an appliance that stops working after a few weeks?"},{"cat":"Hypotéza","text":"If your secondary school introduced a compulsory course on personal finance and investing, what key topics should it cover?"},{"cat":"Názor","text":"How does aggressive advertising on social media influence the shopping decisions of young people today?"}],"phrases":[{"head":"\u003cstrong>When it comes to personal finance,...\u003c/strong>","gloss":"Pokud jde o osobní finance,...","note":"uvedení tématu"},{"head":"\u003cstrong>From my point of view,...\u003c/strong>","gloss":"Z mého úhlu pohledu...","note":"vyjádření názoru"},{"head":"\u003cstrong>There is no denying that...\u003c/strong>","gloss":"Nelze popřít, že...","note":"přiznání zřejmého faktu"},{"head":"\u003cstrong>On the one hand..., on the other hand...\u003c/strong>","gloss":"Na jedné straně..., na druhé straně...","note":"vážení protikladů"},{"head":"\u003cstrong>A major advantage of this approach is...\u003c/strong>","gloss":"Hlavní výhodou tohoto přístupu je...","note":"zdůraznění pozitiva"},{"head":"\u003cstrong>It is wise to keep the receipt in case something goes wrong.\u003c/strong>","gloss":"Je rozumné nechat si účtenku pro případ, že by se něco pokazilo.","note":"opatření předem"},{"head":"\u003cstrong>To sum up, the key to sensible spending is...\u003c/strong>","gloss":"Abych to shrnul, klíčem k rozumnému utrácení je...","note":"závěr"}],"unverified":0},{"file":"tema-s7-major-cities.md","title":"Major cities (UK, USA, CR, ESC)","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu.","s":7,"v":7,"vocab":[{"head":"\u003cstrong>metropolis\u003c/strong> /məˈtrɒpəlɪs/ AmE /məˈtrɑːpəlɪs/ [C]","gloss":"metropole, velkoměsto","example":"London is a truly global metropolis attracting millions of international visitors every year."},{"head":"\u003cstrong>capital city\u003c/strong> /ˌkæpɪtl ˈsɪti/ [C]","gloss":"hlavní město","example":"Prague is the capital city and the administrative centre of the Czech Republic."},{"head":"\u003cstrong>skyline\u003c/strong> /ˈskaɪlaɪn/ [C]","gloss":"silueta města, panorama","example":"The Manhattan skyline with its illuminated skyscrapers is world-famous."},{"head":"\u003cstrong>skyscraper\u003c/strong> /ˈskaɪskreɪpə/ AmE /ˈskaɪskreɪpər/ [C]","gloss":"mrakodrap","example":"The Empire State Building was once the tallest skyscraper in the world."},{"head":"\u003cstrong>landmark\u003c/strong> /ˈlændmɑːk/ AmE /ˈlændmɑːrk/ [C]","gloss":"dominanta, významná pamětihodnost","example":"Big Ben and Tower Bridge are two of the most recognizable landmarks in Great Britain."},{"head":"\u003cstrong>sightseeing\u003c/strong> /ˈsaɪtsiːɪŋ/ [U]","gloss":"prohlídka památek","example":"Tourists enjoy a whole day of sightseeing in Rome and Edinburgh."},{"head":"\u003cstrong>heritage site\u003c/strong> (heritage /ˈherɪtɪdʒ/) [C]","gloss":"památka kulturního či přírodního dědictví","example":"The historic centre of Prague has been designated as a UNESCO World Heritage site."},{"head":"\u003cstrong>traffic congestion\u003c/strong> (congestion /kənˈdʒestʃən/) [U]","gloss":"dopravní zácpy, přetížení dopravy","example":"Many major cities introduce congestion charges to reduce heavy traffic congestion in downtown areas."},{"head":"\u003cstrong>district\u003c/strong> /ˈdɪstrɪkt/ [C]","gloss":"čtvrť, obvod města","example":"Wall Street is situated in the financial district of Lower Manhattan."},{"head":"\u003cstrong>commuter\u003c/strong> /kəˈmjuːtə/ AmE /kəˈmjuːtər/ [C]","gloss":"dojíždějící (člověk pravidelně dojíždějící za prací nebo do školy)","example":"Every weekday morning, thousands of commuters pour into the central railway station."},{"head":"\u003cstrong>vibrant\u003c/strong> /ˈvaɪbrənt/ (adjective)","gloss":"pulzující, plný života","example":"Dublin boasts a vibrant cultural life with traditional music sessions in almost every pub."},{"head":"\u003cstrong>cosmopolitan\u003c/strong> /ˌkɒzməˈpɒlɪtən/ AmE /ˌkɑːzməˈpɑːlɪtən/ (adjective)","gloss":"kosmopolitní, mezinárodní","example":"Sydney has a cosmopolitan atmosphere thanks to its multicultural communities from across the Pacific."},{"head":"\u003cstrong>cost of living\u003c/strong> [U]","gloss":"životní náklady","example":"The high cost of living in cities like New York and London makes renting a flat difficult for young graduates."},{"head":"\u003cstrong>public square\u003c/strong> [C]","gloss":"náměstí","example":"A bustling public square is often the social and architectural heart of a European town."},{"head":"\u003cstrong>commercial hub\u003c/strong> (hub /hʌb/) [C]","gloss":"centrum obchodu, hospodářské středisko","example":"Toronto functions as the primary financial and commercial hub of Canada."},{"head":"\u003cstrong>underground\u003c/strong> /ˈʌndəɡraʊnd/ AmE /ˈʌndərɡraʊnd/ [singular, usually the] / \u003cstrong>subway\u003c/strong> /ˈsʌbweɪ/ [C]","gloss":"metro, podzemní dráha","example":"The London Underground, often called the Tube, is the oldest subterranean railway system in the world, having opened in 1863."},{"head":"\u003cstrong>bustling\u003c/strong> /ˈbʌslɪŋ/ (adjective)","gloss":"rušný, kypící životem","example":"The bustling market stalls near the harbour offer fresh seafood and local crafts."},{"head":"\u003cstrong>cultural diversity\u003c/strong> (diversity /daɪˈvɜːsəti/ AmE /daɪˈvɜːrsəti/) [U]","gloss":"kulturní rozmanitost","example":"Major cities celebrate their cultural diversity through international food festivals and street art."},{"head":"\u003cstrong>inhabitant\u003c/strong> /ɪnˈhæbɪtənt/ [C]","gloss":"obyvatel (stálý)","example":"With over eight million inhabitants, London is one of the most populated cities in Europe."},{"head":"\u003cstrong>harbour\u003c/strong> /ˈhɑːbə(r)/ AmE /ˈhɑːrbər/ [C]","gloss":"přístav (přírodní či umělý)","example":"The Sydney Opera House stands majestically right on the edge of the natural harbour."},{"head":"\u003cstrong>urban sprawl\u003c/strong> (urban /ˈɜːbən/ AmE /ˈɜːrbən/; sprawl /sprɔːl/) [U]","gloss":"živelné rozrůstání měst do krajiny","example":"Urban sprawl in American cities has made private cars essential for everyday life."},{"head":"\u003cstrong>avenue\u003c/strong> /ˈævənjuː/ AmE /ˈævənuː/ [C]","gloss":"široká třída, bulvár","example":"Fifth Avenue in New York is renowned for luxury fashion boutiques and department stores."}],"answer":["When comparing major cities around the globe, each \u003cstrong>metropolis\u003c/strong> has its own unique character, blending history, architecture, and lifestyle. In the United Kingdom, London stands out as a truly \u003cstrong>cosmopolitan\u003c/strong> hub. It combines centuries of British history, represented by royal \u003cstrong>landmarks\u003c/strong> like the Tower of London, with the modern energy of its financial \u003cstrong>district\u003c/strong>. Its comprehensive \u003cstrong>underground\u003c/strong> network makes navigating the \u003cstrong>bustling\u003c/strong> streets manageable for both locals and millions of tourists enjoying \u003cstrong>sightseeing\u003c/strong>.","Across the Atlantic, the United States offers cities built on a massive scale. New York City, the iconic \"Big Apple\", captivates visitors with its dramatic \u003cstrong>skyline\u003c/strong> filled with legendary \u003cstrong>skyscrapers\u003c/strong> like the Empire State Building. Life there moves at an extraordinary pace, whereas the capital, Washington D.C., feels entirely different with its wide \u003cstrong>avenues\u003c/strong>, low neoclassical government buildings, and open green spaces. In other English-speaking countries, cities like Sydney in Australia impress visitors with their stunning natural \u003cstrong>harbour\u003c/strong> and the famous Sydney Opera House.","Closer to home, the Czech Republic offers gems of European heritage. Prague, our \u003cstrong>capital city\u003c/strong>, is renowned for its romantic historic centre, recognized as a UNESCO \u003cstrong>heritage site\u003c/strong>. Strolling across Charles Bridge or through a historic \u003cstrong>public square\u003c/strong>, such as Old Town Square in Prague, allows you to experience compact medieval and Baroque architecture on foot, in contrast to car-dependent \u003cstrong>urban sprawl\u003c/strong> typical of many large metropolises. However, life in any great city involves challenges. The high \u003cstrong>cost of living\u003c/strong>, expensive housing, and constant \u003cstrong>traffic congestion\u003c/strong> are everyday realities for every \u003cstrong>commuter\u003c/strong>. Despite these downsides, major cities remain magnets for ambitious young people because of their endless career opportunities and vibrant \u003cstrong>cultural diversity\u003c/strong>."],"answer_info":"B2, ~260 slov","questions":[{"cat":"Srovnání","text":"In what ways do European capitals like Prague and London differ in layout and architecture from American cities like New York?"},{"cat":"Popis","text":"What are the most iconic landmarks that represent London to international visitors, and why?"},{"cat":"Zkušenost","text":"Which major city that you have visited left the strongest impression on you, and what made it memorable?"},{"cat":"Názor","text":"Why do you think so many young professionals are willing to tolerate the high cost of living in large metropolises?"},{"cat":"Hypotéza","text":"If you had the opportunity to spend a university semester in either London, New York, or Sydney, which one would you choose and what factors would guide your decision?"},{"cat":"Řešení problémů","text":"How can city authorities reduce heavy traffic congestion and encourage residents to use public transit instead of private cars?"},{"cat":"Názor","text":"What are the main social advantages and potential drawbacks of living in an extremely culturally diverse city?"}],"phrases":[{"head":"\u003cstrong>Without a shadow of a doubt,...\u003c/strong>","gloss":"Zcela bezpochyby,...","note":"důraz na tvrzení"},{"head":"\u003cstrong>What sets this city apart from others is...\u003c/strong>","gloss":"To, co toto město odlišuje od ostatních, je...","note":"vyzdvižení specifičnosti"},{"head":"\u003cstrong>In stark contrast to...\u003c/strong>","gloss":"V ostrém kontrastu k...","note":"výrazný protiklad"},{"head":"\u003cstrong>It is widely recognized as...\u003c/strong>","gloss":"Je všeobecně uznáváno jako...","note":"odkaz na všeobecné povědomí"},{"head":"\u003cstrong>When you take a stroll through the streets,...\u003c/strong>","gloss":"Když se projdete ulicemi,...","note":"popis atmosféry"},{"head":"\u003cstrong>On the negative side, one cannot overlook...\u003c/strong>","gloss":"Pokud jde o stinné stránky / Mezi zápory nelze přehlédnout...","note":"uvedení negativního jevu"},{"head":"\u003cstrong>To put it in perspective,...\u003c/strong>","gloss":"Abychom to zasadili do širších souvislostí,...","note":"zasazení do kontextu"}],"unverified":0},{"file":"tema-s8-english-speaking-countries.md","title":"The English-speaking countries","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu. Jazykové opravy: Claude, 25. 11. 2026 (#1158), čekají na kontrolu a schválení učitelem. Věcné opravy: Claude, 26. 11. 2026 (#1173), čekají na kontrolu a schválení učitelem.","s":8,"v":8,"vocab":[{"head":"\u003cstrong>lingua franca\u003c/strong> /ˌlɪŋɡwə ˈfræŋkə/ [C, usually singular]","gloss":"společný dorozumívací jazyk (mezi mluvčími různých jazyků)","example":"English has become a major lingua franca of international business, science, and travel."},{"head":"\u003cstrong>mother tongue\u003c/strong> /ˌmʌðə ˈtʌŋ/ AmE /ˌmʌðər ˈtʌŋ/ [C]","gloss":"mateřský jazyk","example":"Even though my mother tongue is Czech, I practice English almost every day by reading and watching series."},{"head":"\u003cstrong>native speaker\u003c/strong> /ˌneɪtɪv ˈspiːkə(r)/ AmE /ˌneɪtɪv ˈspiːkər/ [C]","gloss":"rodilý mluvčí","example":"Listening to podcasts hosted by a native speaker can help learners pick up authentic pronunciation."},{"head":"\u003cstrong>indigenous people\u003c/strong> (indigenous /ɪnˈdɪdʒənəs/) [plural]","gloss":"původní / domorodé obyvatelstvo","example":"The history of Canada and Australia is closely tied to the traditions and rights of their indigenous people."},{"head":"\u003cstrong>constitutional monarchy\u003c/strong> (constitutional /ˌkɒnstɪˈtjuːʃənl/ AmE /ˌkɑːnstɪˈtuːʃənl/; monarchy /ˈmɒnəki/ AmE /ˈmɑːnərki/) [C]","gloss":"konstituční monarchie","example":"The United Kingdom is a constitutional monarchy where the king reigns but does not rule."},{"head":"\u003cstrong>federal republic\u003c/strong> (federal /ˈfedərəl/; republic /rɪˈpʌblɪk/) [C]","gloss":"federativní republika","example":"The United States is a federal republic composed of fifty states with substantial local powers."},{"head":"\u003cstrong>head of state\u003c/strong> /ˌhed əv ˈsteɪt/ [C]","gloss":"hlava státu","example":"As of 2026, the British monarch serves as the constitutional head of state in fifteen countries, including the UK, Canada, Australia, and twelve other Commonwealth realms."},{"head":"\u003cstrong>Commonwealth of Nations\u003c/strong> (commonwealth /ˈkɒmənwelθ/ AmE /ˈkɑːmənwelθ/) [proper noun]","gloss":"Společenství národů","example":"As of 2026, the Commonwealth of Nations is a voluntary association of 56 independent member countries, mostly former territories of the British Empire."},{"head":"\u003cstrong>bilingual\u003c/strong> /ˌbaɪˈlɪŋɡwəl/ (adjective)","gloss":"dvojjazyčný","example":"Canada is officially a bilingual country, with both English and French holding equal status at the federal level."},{"head":"\u003cstrong>settler\u003c/strong> /ˈsetlə/ AmE /ˈsetlər/ [C]","gloss":"osadník, kolonista","example":"Many European settlers arrived in North America in search of fertile land or religious freedom."},{"head":"\u003cstrong>outback\u003c/strong> /ˈaʊtbæk/ [singular, usually the outback]","gloss":"vnitrozemská pustina (v Austrálii)","example":"Much of central Australia consists of the vast, arid outback, where sheep and cattle stations are miles apart."},{"head":"\u003cstrong>accent\u003c/strong> /ˈæksent/ [C]","gloss":"přízvuk","example":"You can easily tell a Scottish accent apart from an Australian or an American accent."},{"head":"\u003cstrong>vast\u003c/strong> /vɑːst/ AmE /væst/ (adjective)","gloss":"rozlehlý, nesmírný","example":"Both Canada and the United States cover vast land areas spanning several time zones."},{"head":"\u003cstrong>hemisphere\u003c/strong> /ˈhemɪsfɪə/ AmE /ˈhemɪsfɪr/ [C]","gloss":"polokoule (severní / jižní)","example":"Because Australia and New Zealand lie in the southern hemisphere, their summer lasts from December to February."},{"head":"\u003cstrong>colonisation\u003c/strong> [U]","gloss":"kolonizace","example":"The historical colonisation by the British Empire spread English law, education, and language across many continents."},{"head":"\u003cstrong>flora and fauna\u003c/strong> (flora /ˈflɔːrə/; fauna /ˈfɔːnə/) [plural / collective]","gloss":"flóra a fauna, rostlinstvo a zvířena","example":"Partly due to geographic isolation, Australia developed unique flora and fauna, including kangaroos and koalas."},{"head":"\u003cstrong>multicultural\u003c/strong> /ˌmʌltiˈkʌltʃərəl/ (adjective)","gloss":"multikulturní","example":"Cities like Toronto and Melbourne are celebrated as remarkably multicultural societies."},{"head":"\u003cstrong>sovereign state\u003c/strong> (sovereign /ˈsɒvrɪn/ AmE /ˈsɑːvrɪn/) [C]","gloss":"suverénní stát","example":"New Zealand is an independent sovereign state renowned for its breathtaking landscapes and progressive policies."},{"head":"\u003cstrong>island nation\u003c/strong> [C]","gloss":"ostrovní stát","example":"New Zealand is a breathtaking island nation in the South Pacific famous for its dramatic fjords."},{"head":"\u003cstrong>territory\u003c/strong> /ˈterətri/ AmE /ˈterətɔːri/ [C]","gloss":"území, teritorium","example":"Canada consists of ten provinces and three northern territories, which are sparsely populated."},{"head":"\u003cstrong>diversity\u003c/strong> /daɪˈvɜːsəti/ AmE /daɪˈvɜːrsəti/ [U]","gloss":"rozmanitost","example":"The linguistic and geographic diversity of the English-speaking world offers endless topics to explore."},{"head":"\u003cstrong>standard of living\u003c/strong> /ˌstændəd əv ˈlɪvɪŋ/ AmE /ˌstændərd əv ˈlɪvɪŋ/ [C/U]","gloss":"životní úroveň","example":"In the 2025 Human Development Report, Australia and Canada are near the top of the ranking, partly because of their high standard of living."}],"answer":["When we talk about the English-speaking world, we are looking at very different cultures across several continents. Britain is where the language started. It is a traditional \u003cstrong>constitutional monarchy\u003c/strong> that spread English around the globe through centuries of trade and \u003cstrong>colonisation\u003c/strong>. Today, English works as a global \u003cstrong>lingua franca\u003c/strong>, allowing people from many countries to talk to each other.","If we compare the main countries, we find both clear similarities and important differences in their political systems and in their landscapes. The United States is a huge \u003cstrong>federal republic\u003c/strong> of fifty states, known for its dynamic lifestyle and global influence. Just north of the US, Canada covers \u003cstrong>vast\u003c/strong> open territories and is an officially \u003cstrong>bilingual\u003c/strong> nation, where English and French both have official status. In North America, European \u003cstrong>settlers\u003c/strong> helped to build modern society, which today also tries to respect the heritage of \u003cstrong>indigenous people\u003c/strong>.","Down in the southern \u003cstrong>hemisphere\u003c/strong>, Australia and New Zealand are home to unique and varied natural landscapes. Australia is famous for its unusual \u003cstrong>flora and fauna\u003c/strong>, its sunny beaches, and the empty red plains of the \u003cstrong>outback\u003c/strong>. New Zealand is a peaceful \u003cstrong>island nation\u003c/strong> with spectacular mountains and rich Māori traditions. Both countries are independent democracies within the \u003cstrong>Commonwealth of Nations\u003c/strong>, yet they still share the same monarch as their constitutional \u003cstrong>head of state\u003c/strong>. For me as a student, learning about these places shows how much cultural \u003cstrong>diversity\u003c/strong> exists within one language."],"answer_info":"B2, ~265 slov","questions":[{"cat":"Popis","text":"What are the core political differences between the systems of government of the United Kingdom and the United States?"},{"cat":"Srovnání","text":"In what ways do the geographic features and climates of Canada and Australia contrast with each other?"},{"cat":"Názor","text":"Why has English become a major global lingua franca, although languages such as Spanish or Mandarin have larger numbers of native speakers?"},{"cat":"Popis","text":"How has the historical heritage of indigenous communities shaped modern identity in New Zealand and Canada?"},{"cat":"Zkušenost","text":"Which English-speaking country appeals to you the most for future travel or university exchange, and what specific reasons support your choice?"},{"cat":"Hypotéza","text":"If international business decided to adopt a neutral artificial language like Esperanto instead of English, what practical obstacles would arise?"},{"cat":"Srovnání","text":"How do everyday British English and American English differ in terms of vocabulary, pronunciation, and spelling?"}],"phrases":[{"head":"\u003cstrong>First and foremost,...\u003c/strong>","gloss":"V prvé řadě / především,...","note":"uvedení hlavního bodu"},{"head":"\u003cstrong>Geographically speaking,...\u003c/strong>","gloss":"Ze zeměpisného hlediska...","note":"zeměpisný kontext"},{"head":"\u003cstrong>One major difference between them is that...\u003c/strong>","gloss":"Jedním hlavním rozdílem mezi nimi je, že...","note":"kontrast dvou systémů"},{"head":"\u003cstrong>It is worth pointing out that...\u003c/strong>","gloss":"Stojí za to vyzdvihnout, že...","note":"upozornění na zajímavost"},{"head":"\u003cstrong>Although these countries are thousands of miles apart, they...\u003c/strong>","gloss":"Přestože tyto země dělí tisíce mil, ...","note":"překlenutí vzdálenosti"},{"head":"\u003cstrong>From a global standpoint,...\u003c/strong>","gloss":"Z globálního hlediska...","note":"celosvětový pohled"},{"head":"\u003cstrong>To conclude, what unites all these countries is...\u003c/strong>","gloss":"Na závěr, tím, co všechny tyto země spojuje, je...","note":"závěrečné shrnutí"}],"unverified":0},{"file":"tema-s9-reading-and-literature.md","title":"Reading and literature","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu.","s":9,"v":null,"vocab":[{"head":"\u003cstrong>fiction\u003c/strong> /ˈfɪkʃn/ [U]","gloss":"beletrie, krásná literatura (vymyšlené příběhy)","example":"She enjoys reading contemporary fiction, especially detective stories and psychological drama."},{"head":"\u003cstrong>non-fiction\u003c/strong> /ˌnɒn ˈfɪkʃn/ AmE /ˌnɑːn ˈfɪkʃn/ [U]","gloss":"literatura faktu, naučná literatura","example":"Biographies and history books belong to popular categories of non-fiction."},{"head":"\u003cstrong>plot\u003c/strong> /plɒt/ AmE /plɑːt/ [C]","gloss":"děj, zápletka","example":"The thrilling mystery kept readers guessing until the very end of the complex plot."},{"head":"\u003cstrong>main character\u003c/strong> [C]","gloss":"hlavní postava","example":"The author created a main character who is deeply flawed yet genuinely likable."},{"head":"\u003cstrong>genre\u003c/strong> /ˈʒɒnrə/ AmE /ˈʒɑːnrə/ [C]","gloss":"žánr","example":"Science fiction and fantasy are my favourite literary genres."},{"head":"\u003cstrong>paperback\u003c/strong> /ˈpeɪpəbæk/ AmE /ˈpeɪpərbæk/ [C]","gloss":"kniha s měkkou vazbou, brožovaný výtisk","example":"Paperbacks are lighter and more practical to carry in a backpack during daily commutes."},{"head":"\u003cstrong>hardback / hardcover\u003c/strong> (hardback /ˈhɑːdbæk/ AmE /ˈhɑːrdbæk/) [C]","gloss":"kniha v pevné vazbě","example":"Collectors prefer buying hardbacks because they look elegant on a bookshelf and last longer."},{"head":"\u003cstrong>e-book reader\u003c/strong> (e /iː/) [C]","gloss":"čtečka elektronických knih","example":"Carrying an e-book reader allows you to pack hundreds of novels on holiday without heavy luggage."},{"head":"\u003cstrong>expand one's vocabulary\u003c/strong> (vocabulary /vəˈkæbjələri/ AmE /vəˈkæbjəleri/) (phrase)","gloss":"rozšířit si slovní zásobu","example":"Reading English novels with a pencil in hand is a great way to expand your vocabulary."},{"head":"\u003cstrong>page-turner\u003c/strong> /ˈpeɪdʒ tɜːnə(r)/ AmE /ˈpeɪdʒ tɜːrnər/ [C, informal]","gloss":"napínavá kniha (čtená jedním dechem)","example":"Her latest psychological thriller was such an addictive page-turner that I finished it in one evening."},{"head":"\u003cstrong>compulsory / required reading\u003c/strong> (compulsory /kəmˈpʌlsəri/) [U]","gloss":"povinná / předepsaná školní četba","example":"Many students initially complain about compulsory reading, but some classic titles turn out to be genuinely fascinating."},{"head":"\u003cstrong>audiobook\u003c/strong> /ˈɔːdiəʊbʊk/ AmE /ˈɔːdioʊbʊk/ [C]","gloss":"audiokniha","example":"Listening to an audiobook while cleaning or jogging is an efficient way to enjoy literature."},{"head":"\u003cstrong>masterpiece\u003c/strong> /ˈmɑːstəpiːs/ AmE /ˈmæstərpiːs/ [C]","gloss":"mistrovské dílo","example":"George Orwell's 1984 is widely recognized as a twentieth-century dystopian masterpiece."},{"head":"\u003cstrong>bestseller\u003c/strong> /ˌbestˈselə(r)/ AmE /ˌbestˈselər/ [C]","gloss":"bestseller, prodejní trhák","example":"The fantasy series quickly became an international bestseller translated into dozens of languages."},{"head":"\u003cstrong>blurb\u003c/strong> /blɜːb/ AmE /blɜːrb/ [C]","gloss":"anotace (krátký propagační text na zadní straně obálky)","example":"Before buying a book, I always read the blurb on the back cover to see what the story is about."},{"head":"\u003cstrong>unexpected twist\u003c/strong> (unexpected /ˌʌnɪkˈspektɪd/; twist /twɪst/) [C]","gloss":"nečekaný zvrat","example":"The final chapter delivered an unexpected twist that completely overturned everything the reader assumed."},{"head":"\u003cstrong>novelist\u003c/strong> /ˈnɒvəlɪst/ AmE /ˈnɑːvəlɪst/ [C]","gloss":"romanopisec, autor románů","example":"Charles Dickens was a renowned Victorian novelist whose works highlighted social inequality."},{"head":"\u003cstrong>set in\u003c/strong> (phrasal verb, usually passive)","gloss":"zasadit do, odehrávat se v","example":"The historical novel is set in Prague during the reign of Rudolf II."},{"head":"\u003cstrong>flick through\u003c/strong> (flick /flɪk/) (phrasal verb)","gloss":"zběžně prolistovat","example":"Whenever I visit a bookstore, I love to flick through newly published poetry and art books."},{"head":"\u003cstrong>relatable\u003c/strong> /rɪˈleɪtəbl/ (adjective)","gloss":"blízký, snadno pochopitelný (postava, se kterou se lze ztotožnit)","example":"Young readers connect with novels where protagonists face relatable struggles with family and school."},{"head":"\u003cstrong>reading habits\u003c/strong> [plural]","gloss":"čtenářské návyky","example":"Social media and short video platforms have significantly changed the reading habits of teenagers."},{"head":"\u003cstrong>imagination\u003c/strong> /ɪˌmædʒɪˈneɪʃn/ [U]","gloss":"představivost, obrazotvornost","example":"Unlike watching a film where visuals are given, reading requires you to use your own imagination."}],"answer":["In our digital age, people often wonder whether books still matter to teenagers. From my perspective as a secondary school student, reading remains one of the most rewarding ways to spend free time. While movies and social media offer instant stimulation, sitting down with a good book stimulates our \u003cstrong>imagination\u003c/strong> in a completely unique way. It encourages our brains to visualize characters and settings, while helping us naturally \u003cstrong>expand our vocabulary\u003c/strong>.","My personal \u003cstrong>reading habits\u003c/strong> include both traditional printed books and digital formats. I still love holding a \u003cstrong>paperback\u003c/strong> because of the physical feel of turning pages, but an \u003cstrong>e-book reader\u003c/strong> or an \u003cstrong>audiobook\u003c/strong> is incredibly convenient when travelling on buses. In terms of taste, I lean towards contemporary \u003cstrong>fiction\u003c/strong>, especially dystopian stories and murder mysteries. When a book is a real \u003cstrong>page-turner\u003c/strong> with a fast-moving \u003cstrong>plot\u003c/strong> and an \u003cstrong>unexpected twist\u003c/strong>, I can easily read until late at night. What makes a story memorable for me is a \u003cstrong>relatable\u003c/strong> \u003cstrong>main character\u003c/strong> who faces realistic dilemmas.","Of course, our relationship with literature is also shaped by school. We all have to deal with \u003cstrong>compulsory reading\u003c/strong> for the maturita exams. While some nineteenth-century books can feel slow-paced at first, discovering a twentieth-century \u003cstrong>masterpiece\u003c/strong>—such as Orwell's \u003cem>Animal Farm\u003c/em> or Karel Čapek's works—shows that powerful ideas remain timeless. To sum up, literature is not just about passing school exams; it gives us empathy, broadens our perspective on life, and lets us experience worlds completely different from our own."],"answer_info":"B2, ~250 slov","questions":[{"cat":"Popis","text":"What factors usually convince you to pick up a book and start reading it?"},{"cat":"Srovnání","text":"In what ways does reading a printed paperback differ from reading on an electronic device or listening to an audiobook?"},{"cat":"Zkušenost","text":"Which book that you have read for school or pleasure made the deepest impression on you?"},{"cat":"Názor","text":"Why do many young people nowadays struggle to read long, demanding classic novels?"},{"cat":"Srovnání","text":"How do literary adaptations into films compare to the original books in terms of storytelling depth?"},{"cat":"Hypotéza","text":"If paper books were completely replaced by digital formats in schools, what benefits and drawbacks would students experience?"},{"cat":"Názor","text":"How does reading literature in a foreign language contribute to mastering that language compared to simply studyi
