e local economy."},{"head":"\u003cstrong>seasonal employment\u003c/strong> (seasonal /ˈsiːzənl/)","gloss":"sezónní zaměstnání","example":"Seasonal employment can offer temporary work."},{"head":"\u003cstrong>visitor spending\u003c/strong>","gloss":"výdaje návštěvníků","example":"Visitor spending can support small businesses."},{"head":"\u003cstrong>carry-on luggage [U]\u003c/strong> (luggage /ˈlʌɡɪdʒ/)","gloss":"příruční zavazadla; nepočitatelné: \u003cem>a piece of carry-on luggage\u003c/em> = jeden kus příručního zavazadla","example":"She packed her essentials in her carry-on luggage."},{"head":"\u003cstrong>travel insurance\u003c/strong> (insurance /ɪnˈʃʊərəns/ AmE /ɪnˈʃʊrəns/)","gloss":"cestovní pojištění","example":"He checked whether the travel insurance covered hiking."}],"answer":["Tourism is more than a holiday on the beach. The \u003cstrong>tourism industry\u003c/strong> connects visitors with businesses and services at a destination. These can include accommodation, attractions and guides. From a Czech perspective, \u003cstrong>domestic tourism\u003c/strong> means that residents travel within the Czech Republic. \u003cstrong>Inbound tourism\u003c/strong> involves non-resident visitors travelling within the Czech Republic, while \u003cstrong>outbound tourism\u003c/strong> means residents travelling to other countries.","People take holidays for different reasons. A \u003cstrong>city break\u003c/strong> may be ideal for someone who enjoys sightseeing, while a \u003cstrong>seaside holiday\u003c/strong> offers a chance to relax by the water. An \u003cstrong>activity holiday\u003c/strong> might include walking or cycling. Personally, I like a mixture: I would rather spend a morning exploring and keep the afternoon free than follow a strict \u003cstrong>itinerary\u003c/strong> every day.","Travellers can arrange services separately or choose a package holiday. A \u003cstrong>tour operator\u003c/strong> organises packages, while a \u003cstrong>travel agent\u003c/strong> may sell them or help customers compare offers. An all-inclusive offer can be convenient, but I would read the exact conditions because the included services differ. A last-minute deal might save money, although it can also limit the choice. Before booking, I would check cancellation conditions and whether my travel insurance covers planned activities.","The timing matters too. During peak season, popular places may be busy. In the off-season, visitors may find a quieter atmosphere but some businesses may be closed. The shoulder season can be a compromise.","Tourism can support the local economy through visitor spending and jobs, including seasonal employment. At the same time, too many visitors can put pressure on local services. In my view, good tourism planning should benefit both guests and residents."],"answer_info":"","questions":[{"cat":"","text":"What activities and businesses make up the tourism industry?"},{"cat":"","text":"How do domestic, inbound and outbound tourism differ?"},{"cat":"","text":"What are the advantages and disadvantages of a package holiday?"},{"cat":"","text":"How would you choose between a city break and an activity holiday?"},{"cat":"","text":"What would you check before buying an all-inclusive offer?"},{"cat":"","text":"How can the time of year affect a holiday experience?"},{"cat":"","text":"How might tourism benefit and challenge a local community?"}],"phrases":[{"head":"\u003cstrong>Tourism includes more than...\u003c/strong>","gloss":"Cestovní ruch zahrnuje více než...","note":""},{"head":"\u003cstrong>A key difference is...\u003c/strong>","gloss":"Hlavním rozdílem je...","note":""},{"head":"\u003cstrong>Depending on the traveller's needs...\u003c/strong>","gloss":"Podle potřeb cestovatele...","note":""},{"head":"\u003cstrong>One advantage is...\u003c/strong>","gloss":"Jednou z výhod je...","note":""},{"head":"\u003cstrong>It is worth checking whether...\u003c/strong>","gloss":"Stojí za to ověřit, zda...","note":""},{"head":"\u003cstrong>At the same time,...\u003c/strong>","gloss":"Zároveň...","note":""},{"head":"\u003cstrong>In my view, a good holiday...\u003c/strong>","gloss":"Podle mě dobrá dovolená...","note":""}],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>tourism industry\u003c/strong> (noun phrase; A2 + A2)","gloss":"odvětví cestovního ruchu","example":"The tourism industry includes many kinds of business."},{"head":"\u003cstrong>tourism in your own country\u003c/strong> (noun phrase; A2 + A1 + A1 + A1 + A1)","gloss":"domácí cestovní ruch (odborně \u003cem>domestic tourism\u003c/em>)","example":"Tourism in your own country means travelling within it."},{"head":"\u003cstrong>tourism from other countries\u003c/strong> (noun phrase; A2 + A1 + A1 + A1)","gloss":"příjezdový cestovní ruch (odborně \u003cem>inbound tourism\u003c/em>): v zemi cestují návštěvníci, kteří v ní nežijí","example":"In tourism from other countries, people who live abroad travel here."},{"head":"\u003cstrong>tourism to other countries\u003c/strong> (noun phrase; A2 + A1 + A1 + A1)","gloss":"výjezdový cestovní ruch (odborně \u003cem>outbound tourism\u003c/em>): lidé, kteří v zemi žijí, cestují do zahraničí","example":"In tourism to other countries, people who live here travel abroad."},{"head":"\u003cstrong>tour operator\u003c/strong> (operator /ˈɒpəreɪtə(r)/ AmE /ˈɑːpəreɪtər/) [C; slovo k tématu, B2]","gloss":"pořadatel zájezdů","example":"The tour operator explained what the holiday included."},{"head":"\u003cstrong>travel agent\u003c/strong> /ˈtrævl eɪdʒənt/ [C; slovo k tématu, B2]","gloss":"prodejce cestovních služeb nebo zájezdů","example":"The travel agent helped us compare offers."},{"head":"\u003cstrong>travel plan\u003c/strong> (noun phrase; A1 + A1)","gloss":"plán cesty","example":"Our travel plan leaves an afternoon free."},{"head":"\u003cstrong>organized trip\u003c/strong> (noun phrase; B1 + A1)","gloss":"výlet, zpravidla kratší a organizovaný","example":"The organized trip includes a guided walk."},{"head":"\u003cstrong>city break\u003c/strong> (noun phrase; A1 + A1)","gloss":"krátká dovolená ve městě","example":"A city break can fit into a weekend with an extra free day or two."},{"head":"\u003cstrong>seaside holiday\u003c/strong> (seaside /ˈsiːsaɪd/) (noun phrase; B1 + A1)","gloss":"dovolená u moře","example":"They prefer a quiet seaside holiday."},{"head":"\u003cstrong>activity holiday\u003c/strong> (noun phrase; A1 + A1)","gloss":"aktivní dovolená","example":"An activity holiday might include hiking lessons."},{"head":"\u003cstrong>the busiest season\u003c/strong> (noun phrase; A1 + B1)","gloss":"hlavní sezóna","example":"Prices can be higher during the busiest season."},{"head":"\u003cstrong>the quiet season\u003c/strong> (noun phrase; A1 + B1)","gloss":"mimosezóna, období mimo hlavní sezónu","example":"In the quiet season some attractions may be closed."},{"head":"\u003cstrong>time between the busiest and quiet seasons\u003c/strong> (noun phrase; A1 + A1 + A1 + A1 + B1)","gloss":"období mezi hlavní sezónou a mimosezónou","example":"The time between the busiest and quiet seasons can be less crowded."},{"head":"\u003cstrong>local economy\u003c/strong> (noun phrase; A1 + B1)","gloss":"místní ekonomika","example":"Visitors may spend money in the local economy."},{"head":"\u003cstrong>jobs for the season\u003c/strong> (noun phrase; A1 + B1)","gloss":"sezónní zaměstnání","example":"Jobs for the season can offer work for a short time."},{"head":"\u003cstrong>visitor spending\u003c/strong> (noun phrase; A1 + B1)","gloss":"výdaje návštěvníků","example":"Visitor spending can support small businesses."},{"head":"\u003cstrong>hand luggage [U]\u003c/strong> (noun phrase; B1)","gloss":"příruční zavazadla; nepočitatelné: \u003cem>a piece of hand luggage\u003c/em> = jeden kus příručního zavazadla","example":"She packed the things that she needed most in her hand luggage."},{"head":"\u003cstrong>travel insurance\u003c/strong> (insurance /ɪnˈʃʊərəns/ AmE /ɪnˈʃʊrəns/) [U; slovo k tématu, B2]","gloss":"cestovní pojištění","example":"He checked whether the travel insurance included hiking."}],"answer":["The \u003cstrong>tourism industry\u003c/strong> connects visitors with businesses and services at a destination. \u003cstrong>Tourism in your own country\u003c/strong> means people who live in the Czech Republic travel within it. \u003cstrong>Tourism from other countries\u003c/strong> means visitors who do not live here travel here. \u003cstrong>Tourism to other countries\u003c/strong> means people who live here travel abroad.","A \u003cstrong>city break\u003c/strong> may be ideal for someone who enjoys sightseeing. A \u003cstrong>seaside holiday\u003c/strong> offers a chance to relax by the water. An \u003cstrong>activity holiday\u003c/strong> might include walking or cycling. Personally, I prefer exploring in the morning and keeping the afternoon free.","Travellers can arrange each service on its own or choose a package holiday. A \u003cstrong>tour operator\u003c/strong> organizes these holidays, while a \u003cstrong>travel agent\u003c/strong> may sell them or help customers compare offers. I would check whether my \u003cstrong>travel insurance\u003c/strong> includes my planned activities.","During \u003cstrong>the busiest season\u003c/strong>, popular places may be crowded. In \u003cstrong>the quiet season\u003c/strong>, some businesses may be closed.","Tourism can support the \u003cstrong>local economy\u003c/strong> through \u003cstrong>visitor spending\u003c/strong> and jobs, including \u003cstrong>jobs for the season\u003c/strong>. But local services can find it hard to deal with too many visitors. In my view, good tourism planning should benefit guests and local people."],"questions":[{"cat":"","text":"What activities and businesses make up the tourism industry?"},{"cat":"","text":"How are the three types of tourism different? \u003cem>(tourism in your own country, from other countries and to other countries)\u003c/em>"},{"cat":"","text":"What are the advantages and disadvantages of a package holiday?"},{"cat":"","text":"How would you choose between a city break and an activity holiday?"},{"cat":"","text":"What would you check before buying an offer where everything is included?"},{"cat":"","text":"How can the time of year affect a holiday?"},{"cat":"","text":"How might tourism benefit a local community? \u003cem>(and the problems it can bring)\u003c/em>"}],"phrases":[{"head":"\u003cstrong>Tourism includes more than...\u003c/strong>","gloss":"Cestovní ruch zahrnuje více než...","note":""},{"head":"\u003cstrong>A key difference is...\u003c/strong>","gloss":"Hlavním rozdílem je...","note":""},{"head":"\u003cstrong>It depends on the traveller's needs...\u003c/strong>","gloss":"Záleží na potřebách cestovatele...","note":""},{"head":"\u003cstrong>One advantage is...\u003c/strong>","gloss":"Jednou z výhod je...","note":""},{"head":"\u003cstrong>It is worth checking whether...\u003c/strong>","gloss":"Stojí za to ověřit, zda...","note":""},{"head":"\u003cstrong>At the same time,...\u003c/strong>","gloss":"Zároveň...","note":""},{"head":"\u003cstrong>In my view, a good holiday...\u003c/strong>","gloss":"Podle mě dobrá dovolená...","note":""}]},"codes":["CR 11a","CR 13a"],"groups":["cr"],"rank":{"cr":22,"all":22.5}},{"file":"tema-c12b-hotel-services-and-classification.md","title":"Hotel services and classification","label":"Navrhl AI (Hermes, gpt-6.1-terra), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu.","vocab":[{"head":"\u003cstrong>turn-down service [U]\u003c/strong>","gloss":"večerní úprava pokoje","example":"The turn-down service prepares the bed for the night."},{"head":"\u003cstrong>wake-up call [C]\u003c/strong> /ˈweɪk ʌp kɔːl/","gloss":"telefonické buzení","example":"I requested a wake-up call for six."},{"head":"\u003cstrong>luggage storage [U]\u003c/strong> (luggage /ˈlʌɡɪdʒ/; storage /ˈstɔːrɪdʒ/)","gloss":"úschova zavazadel","example":"Luggage storage lets guests leave bags after checkout."},{"head":"\u003cstrong>express checkout [U]\u003c/strong> (checkout /ˈtʃekaʊt/)","gloss":"zrychlené odhlášení z hotelu","example":"Express checkout can save time in the morning."},{"head":"\u003cstrong>room service [U]\u003c/strong> /ˈruːm sɜːvɪs/ AmE /ˈruːm sɜːrvɪs/","gloss":"pokojová služba","example":"We ordered tea through room service."},{"head":"\u003cstrong>accessible facilities [plural]\u003c/strong> (accessible /əkˈsesəbl/)","gloss":"bezbariérové vybavení","example":"Accessible facilities help guests with limited mobility."},{"head":"\u003cstrong>shuttle service [C/U]\u003c/strong> (shuttle /ˈʃʌtl/)","gloss":"kyvadlová doprava","example":"The shuttle service takes guests to the station."},{"head":"\u003cstrong>laundry service [C/U]\u003c/strong> (laundry /ˈlɔːndri/)","gloss":"služba praní prádla","example":"The laundry service returns clean clothes to guests."},{"head":"\u003cstrong>late checkout [U]\u003c/strong> (checkout /ˈtʃekaʊt/)","gloss":"pozdní odhlášení z hotelu","example":"Late checkout may cost extra."},{"head":"\u003cstrong>ironing service [C/U]\u003c/strong> (ironing /ˈaɪənɪŋ/ AmE /ˈaɪərnɪŋ/)","gloss":"služba žehlení prádla","example":"The ironing service can press a guest's shirt."},{"head":"\u003cstrong>additional charge [C]\u003c/strong> (additional /əˈdɪʃənl/)","gloss":"příplatek","example":"There is an additional charge for parking."},{"head":"\u003cstrong>meeting room hire [U]\u003c/strong>","gloss":"pronájem zasedací místnosti","example":"Meeting room hire may be useful for a business event."},{"head":"\u003cstrong>star rating [C]\u003c/strong> (rating /ˈreɪtɪŋ/)","gloss":"hvězdičkové hodnocení","example":"A star rating gives guests a basic guide."},{"head":"\u003cstrong>classification criteria [plural]\u003c/strong> (classification /ˌklæsɪfɪˈkeɪʃn/)","gloss":"kritéria klasifikace","example":"Classification criteria include room features."},{"head":"\u003cstrong>minimum requirement [C]\u003c/strong> (minimum /ˈmɪnɪməm/; requirement /rɪˈkwaɪəmənt/ AmE /rɪˈkwaɪərmənt/)","gloss":"minimální požadavek","example":"The hotel meets the minimum requirement."},{"head":"\u003cstrong>inspection [C]\u003c/strong> /ɪnˈspekʃn/","gloss":"kontrola, inspekce","example":"An inspection checks the stated facilities."},{"head":"\u003cstrong>category [C]\u003c/strong> /ˈkætəɡəri/ AmE /ˈkætəɡɔːri/","gloss":"kategorie","example":"This hotel belongs to a higher category."},{"head":"\u003cstrong>harmonised standard [C]\u003c/strong>","gloss":"sjednocený standard","example":"A harmonised standard makes comparison easier."},{"head":"\u003cstrong>optional service [C]\u003c/strong> (optional /ˈɒpʃənl/ AmE /ˈɑːpʃənl/)","gloss":"volitelná služba","example":"A massage is an optional service here."},{"head":"\u003cstrong>guest feedback [U]\u003c/strong> (feedback /ˈfiːdbæk/)","gloss":"zpětná vazba hostů","example":"Guest feedback helps the manager improve service."}],"answer":["As a tourism student, I think that hotel services are just as important as the building itself. Before booking, I would check what is included and whether there is an \u003cstrong>additional charge\u003c/strong> for anything I need. An \u003cstrong>ironing service\u003c/strong> can be useful before a business meeting, but a warm welcome and clear information matter even more.","A hotel may offer \u003cstrong>luggage storage\u003c/strong> after checkout, which is helpful if a guest wants to explore the town before leaving. A \u003cstrong>wake-up call\u003c/strong> can help someone catch an early train. Some properties also offer \u003cstrong>room service\u003c/strong>, a \u003cstrong>shuttle service\u003c/strong> or late checkout, depending on their facilities and the price. A laundry service can help guests during a longer stay, while accessible facilities make a stay more comfortable for people with limited mobility. Guests organising an event can ask about \u003cstrong>meeting room hire\u003c/strong> and the conditions before they book.","Hotels can also be compared by their \u003cstrong>star rating\u003c/strong>. The Hotelstars Union uses common \u003cstrong>classification criteria\u003c/strong> in participating European countries, including the Czech Republic. These cover areas such as services and room features. Different categories have different requirements; stars do not mean that every hotel offers exactly the same services. I would also look at the hotel's own website and recent reviews rather than relying on stars alone.","In my view, good service means listening carefully and solving problems politely. If a guest has a concern, staff should respond honestly instead of promising something they cannot provide. As a future tourism professional, I would use \u003cstrong>guest feedback\u003c/strong> to learn what could be improved."],"answer_info":"","questions":[{"cat":"","text":"What services would you recommend to a guest arriving early?"},{"cat":"","text":"How do hotel services affect your choice of accommodation?"},{"cat":"","text":"What does a star rating tell a traveller and what does it not tell them?"},{"cat":"","text":"How would you explain an extra charge to a guest?"},{"cat":"","text":"How might accessible facilities influence a guest's experience?"},{"cat":"","text":"What would you do if an advertised service was unavailable?"},{"cat":"","text":"How would you compare star ratings with guest reviews?"}],"phrases":[{"head":"\u003cstrong>The service I would value most is...\u003c/strong>","gloss":"Nejvíce bych ocenil/a službu...","note":""},{"head":"\u003cstrong>The price may include...\u003c/strong>","gloss":"Cena může zahrnovat...","note":""},{"head":"\u003cstrong>There could be an extra charge for...\u003c/strong>","gloss":"Za ... může být příplatek.","note":""},{"head":"\u003cstrong>The rating gives a general idea of...\u003c/strong>","gloss":"Hodnocení dává obecnou představu o...","note":""},{"head":"\u003cstrong>I would check in advance whether...\u003c/strong>","gloss":"Předem bych ověřil/a, zda...","note":""},{"head":"\u003cstrong>From the guest's point of view...\u003c/strong>","gloss":"Z pohledu hosta...","note":""},{"head":"\u003cstrong>To conclude, good service means...\u003c/strong>","gloss":"Závěrem, dobrá služba znamená...","note":""}],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>prepare the bed for the night [phrase; A1 + A1 + A1]\u003c/strong>","gloss":"večerní úprava pokoje (připravit postel na noc)","example":"The hotel prepares the bed for the night."},{"head":"\u003cstrong>wake-up call [C; slovo k tématu, B2]\u003c/strong> /ˈweɪk ʌp kɔːl/","gloss":"telefonické buzení","example":"I requested a wake-up call for six."},{"head":"\u003cstrong>keep luggage [phrase; A1 + A2]\u003c/strong> (luggage /ˈlʌɡɪdʒ/)","gloss":"úschova zavazadel (uschovat zavazadla)","example":"The hotel can keep guests' luggage after they check out."},{"head":"\u003cstrong>check out quickly [phrase; B1 + A1]\u003c/strong>","gloss":"zrychlené odhlášení z hotelu (rychle se odhlásit)","example":"Checking out quickly can save time in the morning."},{"head":"\u003cstrong>room service [U; slovo k tématu, B2]\u003c/strong> /ˈruːm sɜːvɪs/ AmE /ˈruːm sɜːrvɪs/","gloss":"pokojová služba","example":"We ordered tea through room service."},{"head":"\u003cstrong>accessible facilities [plural; slovo k tématu, C1 + B2]\u003c/strong> (accessible /əkˈsesəbl/)","gloss":"bezbariérové vybavení","example":"Accessible facilities help guests who cannot move easily."},{"head":"\u003cstrong>hotel bus [C; A1 + A1]\u003c/strong>","gloss":"kyvadlová doprava (hotelový autobus)","example":"The hotel bus takes guests to the station."},{"head":"\u003cstrong>wash clothes [phrase; A1 + A1]\u003c/strong>","gloss":"služba praní prádla (prát hostům prádlo)","example":"The hotel washes guests' clothes and returns them clean."},{"head":"\u003cstrong>check out late [phrase; B1 + A1]\u003c/strong>","gloss":"pozdní odhlášení z hotelu (odhlásit se později)","example":"Checking out late may cost extra."},{"head":"\u003cstrong>ironing service [C/U; B1 + A2]\u003c/strong> (ironing /ˈaɪənɪŋ/ AmE /ˈaɪərnɪŋ/)","gloss":"služba žehlení prádla","example":"The ironing service can iron a guest's shirt."},{"head":"\u003cstrong>extra charge [C; A1 + B1]\u003c/strong>","gloss":"příplatek","example":"There is an extra charge for parking."},{"head":"\u003cstrong>hire a meeting room [phrase; B1 + A1 + A1]\u003c/strong>","gloss":"pronájem zasedací místnosti (pronajmout si zasedací místnost)","example":"Hiring a meeting room may be useful for a business event."},{"head":"\u003cstrong>number of stars [phrase; A1 + A1]\u003c/strong>","gloss":"hvězdičkové hodnocení (počet hvězdiček)","example":"The number of stars gives guests a basic idea."},{"head":"\u003cstrong>official check [C; B1 + A2]\u003c/strong>","gloss":"kontrola, inspekce","example":"Official checks make sure that hotels have what they say they have."},{"head":"\u003cstrong>category [C; B1]\u003c/strong> /ˈkætəɡəri/ AmE /ˈkætəɡɔːri/","gloss":"kategorie","example":"This hotel belongs to a higher category."},{"head":"\u003cstrong>common standard [C; B1 + B1]\u003c/strong>","gloss":"sjednocený standard","example":"A common standard makes comparison easier."},{"head":"\u003cstrong>guests' opinions [plural; A2 + A1]\u003c/strong>","gloss":"zpětná vazba hostů","example":"Guests' opinions help the manager improve service."},{"head":"\u003cstrong>Hotelstars Union\u003c/strong> [vlastní jméno]","gloss":"Hotelstars Union (organizace se společnými pravidly pro hvězdičky hotelů v zapojených evropských zemích)","example":"The Hotelstars Union uses common standards for giving stars."}],"answer":["As a tourism student, I think that hotel services are just as important as the building itself. Before I book, I would check what is included and whether there is an \u003cstrong>extra charge\u003c/strong> for anything I need.","A hotel may \u003cstrong>keep luggage\u003c/strong> after guests check out. A \u003cstrong>wake-up call\u003c/strong> can help someone catch an early train. Some hotels also offer \u003cstrong>room service\u003c/strong> or a \u003cstrong>hotel bus\u003c/strong>, or they let guests \u003cstrong>check out late\u003c/strong>. \u003cstrong>Accessible facilities\u003c/strong> make a stay more comfortable for people who cannot move easily. Guests who organise an event can ask about \u003cstrong>hiring a meeting room\u003c/strong>.","Hotels can also be compared by their \u003cstrong>number of stars\u003c/strong>. The \u003cstrong>Hotelstars Union\u003c/strong> uses \u003cstrong>common standards\u003c/strong> for giving stars in the European countries that take part, including the Czech Republic. These cover areas such as services and room features. Hotels in different \u003cstrong>categories\u003c/strong> must have different things. Stars do not mean that every hotel offers exactly the same services. I would also look at recent reviews, not only at the stars.","In my view, good service means listening carefully and solving problems politely. In my future job in tourism, I would use \u003cstrong>guests' opinions\u003c/strong> to learn what could be improved."],"questions":[{"cat":"","text":"What services would you recommend to a guest who arrives early?"},{"cat":"","text":"How do hotel services affect your choice of accommodation?"},{"cat":"","text":"What does the number of stars tell a traveller? \u003cem>(and what it does not tell them)\u003c/em>"},{"cat":"","text":"How would you explain an extra charge to a guest?"},{"cat":"","text":"How might accessible facilities influence a guest's stay?"},{"cat":"","text":"What would you do if an advertised service was not available?"},{"cat":"","text":"How would you compare the number of stars with guest reviews?"}],"phrases":[{"head":"\u003cstrong>For me, the most important service would be...\u003c/strong>","gloss":"Nejdůležitější by pro mě byla služba...","note":""},{"head":"\u003cstrong>The price may include...\u003c/strong>","gloss":"Cena může zahrnovat...","note":""},{"head":"\u003cstrong>There could be an extra charge for...\u003c/strong>","gloss":"Za ... může být příplatek.","note":""},{"head":"\u003cstrong>The number of stars gives a general idea of...\u003c/strong>","gloss":"Počet hvězdiček dává obecnou představu o...","note":""},{"head":"\u003cstrong>I would check before my stay whether...\u003c/strong>","gloss":"Před pobytem bych ověřil/a, zda...","note":""},{"head":"\u003cstrong>From the guest's point of view...\u003c/strong>","gloss":"Z pohledu hosta...","note":""},{"head":"\u003cstrong>To conclude, good service means...\u003c/strong>","gloss":"Závěrem, dobrá služba znamená...","note":""}]},"codes":["CR 12b"],"groups":["cr"],"rank":{"cr":25,"all":25.5}},{"file":"tema-c13b-serving-food.md","title":"Serving food","label":"Navrhl AI (Hermes, gpt-6.1-terra), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu.","vocab":[{"head":"\u003cstrong>take an order\u003c/strong>","gloss":"přijmout objednávku","example":"The server takes an order at the table."},{"head":"\u003cstrong>seat a guest\u003c/strong>","gloss":"usadit hosta","example":"The host seats a guest near the window."},{"head":"\u003cstrong>greet a guest\u003c/strong>","gloss":"přivítat hosta","example":"We greet a guest with a smile."},{"head":"\u003cstrong>table setting [C]\u003c/strong>","gloss":"prostření stolu","example":"The table setting is ready for dinner."},{"head":"\u003cstrong>tray [C]\u003c/strong> /treɪ/","gloss":"podnos","example":"She carries the glasses on a tray."},{"head":"\u003cstrong>serving tongs [plural]\u003c/strong> (serving /ˈsɜːvɪŋ/ AmE /ˈsɜːrvɪŋ/; tongs /tɒŋz/ AmE /tɑːŋz/)","gloss":"servírovací kleště","example":"Use serving tongs to handle the bread."},{"head":"\u003cstrong>refill [C]\u003c/strong> /ˈriːfɪl/","gloss":"doplnění nápoje","example":"The guest asked for a refill of water."},{"head":"\u003cstrong>recommend a dish\u003c/strong>","gloss":"doporučit pokrm","example":"I can recommend a dish without meat."},{"head":"\u003cstrong>check back (with somebody)\u003c/strong>","gloss":"zeptat se dodatečně na spokojenost","example":"The server checks back with the guests after serving."},{"head":"\u003cstrong>clear the table\u003c/strong>","gloss":"sklidit ze stolu","example":"We clear the table after everyone has finished."},{"head":"\u003cstrong>split the bill\u003c/strong> (split /splɪt/)","gloss":"rozdělit účet","example":"The group asked us to split the bill."},{"head":"\u003cstrong>itemised bill [C]\u003c/strong>","gloss":"položkový účet","example":"The guest checked the itemised bill."},{"head":"\u003cstrong>payment terminal [C]\u003c/strong> (terminal /ˈtɜːmɪnl/ AmE /ˈtɜːrmɪnl/)","gloss":"platební terminál","example":"The server brings the payment terminal to the table."},{"head":"\u003cstrong>tip [C]\u003c/strong> /tɪp/","gloss":"spropitné","example":"The guest left a small tip."},{"head":"\u003cstrong>service charge [C]\u003c/strong> /ˈsɜːvɪs tʃɑːdʒ/ AmE /ˈsɜːrvɪs tʃɑːrdʒ/","gloss":"poplatek za obsluhu","example":"The service charge appears on the bill."},{"head":"\u003cstrong>spillage [C/U]\u003c/strong> /ˈspɪlɪdʒ/","gloss":"rozlití tekutiny","example":"The server quickly cleaned up the spillage."},{"head":"\u003cstrong>apologise for something\u003c/strong>","gloss":"omluvit se za něco","example":"I apologised for the delay."},{"head":"\u003cstrong>replace a dish\u003c/strong>","gloss":"vyměnit pokrm","example":"The kitchen offered to replace the dish."},{"head":"\u003cstrong>waiting time [C/U]\u003c/strong> (waiting /ˈweɪtɪŋ/)","gloss":"doba čekání","example":"We explained the waiting time to the guests."},{"head":"\u003cstrong>food allergy [C]\u003c/strong> (allergy /ˈælədʒi/ AmE /ˈælərdʒi/)","gloss":"potravinová alergie","example":"A guest mentioned a food allergy."}],"answer":["In a restaurant, good service begins before the food arrives. I would \u003cstrong>greet a guest\u003c/strong> politely, check the booking and \u003cstrong>seat a guest\u003c/strong> at a suitable table. Then I would offer the menu and give everyone time to choose. A neat \u003cstrong>table setting\u003c/strong> creates a good first impression, but the staff's attitude is just as important.","When guests are ready, I would \u003cstrong>take an order\u003c/strong>, repeat the details and ask about any \u003cstrong>food allergy\u003c/strong>. I would never guess whether a meal is safe: I would check the information with the kitchen. If someone is unsure, I could \u003cstrong>recommend a dish\u003c/strong> and describe it clearly. I would also explain the expected \u003cstrong>waiting time\u003c/strong> if the kitchen was particularly busy.","When carrying plates, I would use a \u003cstrong>tray\u003c/strong> if appropriate and make sure each person receives the correct meal. After a short while, I would \u003cstrong>check back\u003c/strong> with the guests without interrupting their conversation too often. Once everyone has finished, I would \u003cstrong>clear the table\u003c/strong> and offer further choices.","If a customer complained, I would listen, apologise for the problem and speak to the kitchen or a supervisor. For example, we might replace a dish if it was not what the guest ordered. Finally, I would bring an itemised bill and, if requested, split the bill. I think professional service is calm and attentive rather than overly formal. Even when something goes wrong, an honest explanation can help guests feel respected."],"answer_info":"","questions":[{"cat":"","text":"How would you welcome and seat a group of guests?"},{"cat":"","text":"What information should you check when taking an order?"},{"cat":"","text":"How would you respond when a guest mentions an allergy?"},{"cat":"","text":"What makes a restaurant server attentive without being intrusive?"},{"cat":"","text":"How would you handle a complaint about the wrong meal?"},{"cat":"","text":"What would you do if guests wanted to pay separately?"},{"cat":"","text":"How does good communication affect the dining experience?"}],"phrases":[{"head":"\u003cstrong>Good evening, may I show you to your table?\u003c/strong>","gloss":"Dobrý večer, mohu vás uvést ke stolu?","note":""},{"head":"\u003cstrong>Are you ready to order, or would you like more time?\u003c/strong>","gloss":"Jste připraveni objednat, nebo chcete více času?","note":""},{"head":"\u003cstrong>Could you tell me about your allergy?\u003c/strong>","gloss":"Můžete mi říct něco o své alergii?","note":""},{"head":"\u003cstrong>Let me check that with the kitchen.\u003c/strong>","gloss":"Ověřím to v kuchyni.","note":""},{"head":"\u003cstrong>I am sorry about the problem.\u003c/strong>","gloss":"Omlouvám se za problém.","note":""},{"head":"\u003cstrong>How would you like to pay?\u003c/strong>","gloss":"Jak byste chtěli zaplatit?","note":""},{"head":"\u003cstrong>Thank you for visiting us.\u003c/strong>","gloss":"Děkujeme za návštěvu.","note":""}],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>take an order [phrase; A1 + A2]\u003c/strong>","gloss":"přijmout objednávku","example":"The waiter takes an order at the table."},{"head":"\u003cstrong>show a guest to a table [phrase; A2 + A2 + A1]\u003c/strong>","gloss":"usadit hosta (uvést hosta ke stolu)","example":"A guest is shown to a table near the window."},{"head":"\u003cstrong>greet a guest [phrase; A2 + A2]\u003c/strong>","gloss":"přivítat hosta","example":"We greet a guest with a smile."},{"head":"\u003cstrong>set the table [phrase; B1 + A1]\u003c/strong>","gloss":"prostřít stůl (prostření stolu)","example":"The table is set for dinner."},{"head":"\u003cstrong>tray [C; slovo k tématu, C1]\u003c/strong> /treɪ/","gloss":"podnos","example":"She carries the glasses on a tray."},{"head":"\u003cstrong>another drink (of the same kind) [C; A1 + A1]\u003c/strong>","gloss":"doplnění nápoje (další nápoj stejného druhu)","example":"The guest asked for another drink of water."},{"head":"\u003cstrong>recommend a dish [phrase; A2 + A1]\u003c/strong>","gloss":"doporučit pokrm","example":"I can recommend a dish without meat."},{"head":"\u003cstrong>ask if everything is all right [phrase; A1 + A1 + A2]\u003c/strong>","gloss":"zeptat se dodatečně na spokojenost","example":"After serving, the waiter asks the guests if everything is all right."},{"head":"\u003cstrong>clear the table [phrase; B1 + A1]\u003c/strong>","gloss":"sklidit ze stolu","example":"We clear the table after everyone has finished."},{"head":"\u003cstrong>divide the bill [phrase; B1 + A1]\u003c/strong>","gloss":"rozdělit účet","example":"The group asked us to divide the bill."},{"head":"\u003cstrong>card machine [C; A1 + A1]\u003c/strong>","gloss":"platební terminál","example":"The waiter brings the card machine to the table."},{"head":"\u003cstrong>tip [C; B1]\u003c/strong> /tɪp/","gloss":"spropitné","example":"The guest left a small tip."},{"head":"\u003cstrong>charge for service [C; B1 + A2]\u003c/strong>","gloss":"poplatek za obsluhu","example":"The charge for service appears on the bill."},{"head":"\u003cstrong>apologise for something [phrase; B1]\u003c/strong>","gloss":"omluvit se za něco","example":"I apologised for the wait."},{"head":"\u003cstrong>replace a dish [phrase; A2 + A1]\u003c/strong>","gloss":"vyměnit pokrm","example":"The kitchen offered to replace the dish."},{"head":"\u003cstrong>waiting time [C/U; A1 + A1]\u003c/strong> (waiting /ˈweɪtɪŋ/)","gloss":"doba čekání","example":"We explained the waiting time to the guests."},{"head":"\u003cstrong>food allergy [C; slovo k tématu, B2]\u003c/strong> (allergy /ˈælədʒi/ AmE /ˈælərdʒi/)","gloss":"potravinová alergie","example":"A guest mentioned a food allergy."}],"answer":["In a restaurant, good service begins before the food arrives. I would \u003cstrong>greet a guest\u003c/strong> politely, check the reservation and \u003cstrong>show a guest to a table\u003c/strong>.","When guests are ready, I would \u003cstrong>take an order\u003c/strong>, repeat the details and ask about any \u003cstrong>food allergy\u003c/strong>. I would never guess whether a meal is safe: I would check the information with the kitchen. If someone is unsure, I could \u003cstrong>recommend a dish\u003c/strong> and describe it clearly. I would also explain the expected \u003cstrong>waiting time\u003c/strong> if the kitchen was particularly busy.","To carry plates, I would use a \u003cstrong>tray\u003c/strong> if it was suitable. I would make sure that each person receives the correct meal. After a short while, I would \u003cstrong>ask if everything is all right\u003c/strong>. But I would not bother the guests too often. Once everyone has finished, I would \u003cstrong>clear the table\u003c/strong>.","If a customer complained, I would listen, \u003cstrong>apologise for the problem\u003c/strong> and speak to the kitchen. For example, we might \u003cstrong>replace a dish\u003c/strong> if it was not what the guest ordered. Finally, if the guests asked, I would \u003cstrong>divide the bill\u003c/strong>. I think professional service means being calm and paying attention to guests rather than being too formal."],"questions":[{"cat":"","text":"How would you welcome a group of guests and show them to a table?"},{"cat":"","text":"What information should you check when you take an order?"},{"cat":"","text":"How would you respond when a guest mentions an allergy?"},{"cat":"","text":"How can a waiter pay attention to guests without bothering them?"},{"cat":"","text":"How would you deal with a complaint about the wrong meal?"},{"cat":"","text":"What would you do if each guest wanted to pay for themselves?"},{"cat":"","text":"How does good communication affect a guest's visit to a restaurant?"}],"phrases":[{"head":"\u003cstrong>Good evening, may I show you to your table?\u003c/strong>","gloss":"Dobrý večer, mohu vás uvést ke stolu?","note":""},{"head":"\u003cstrong>Are you ready to order, or would you like more time?\u003c/strong>","gloss":"Jste připraveni objednat, nebo chcete více času?","note":""},{"head":"\u003cstrong>Could you tell me about your allergy?\u003c/strong>","gloss":"Můžete mi říct něco o své alergii?","note":""},{"head":"\u003cstrong>Let me check that with the kitchen.\u003c/strong>","gloss":"Ověřím to v kuchyni.","note":""},{"head":"\u003cstrong>I am sorry about the problem.\u003c/strong>","gloss":"Omlouvám se za problém.","note":""},{"head":"\u003cstrong>How would you like to pay?\u003c/strong>","gloss":"Jak byste chtěli zaplatit?","note":""},{"head":"\u003cstrong>Thank you for visiting us.\u003c/strong>","gloss":"Děkujeme za návštěvu.","note":""}]},"codes":["CR 13b"],"groups":["cr"],"rank":{"cr":27,"all":27.5}},{"file":"tema-c14b-washington-dc-new-york.md","title":"Washington, D.C. and New York","label":"Navrhla AI, schválil učitel (7. 11. 2026).","vocab":[{"head":"\u003cstrong>government\u003c/strong> /ˈɡʌvənmənt/ AmE /ˈɡʌvərnmənt/ [C or U; B1]","gloss":"vláda, státní moc a správa (v USA zahrnuje všechny tři složky federální moci)","example":"Washington, D.C. is the seat of the federal government of the United States."},{"head":"\u003cstrong>representative\u003c/strong> /ˌreprɪˈzentətɪv/ [C; B2]","gloss":"poslanec, volený zástupce (člen Sněmovny reprezentantů)","example":"Elected representatives and senators work in the US Capitol."},{"head":"\u003cstrong>law\u003c/strong> /lɔː/ [C or U; B1]","gloss":"zákon, právo","example":"The class discussed a new law and its possible effects on everyday life."},{"head":"\u003cstrong>judge\u003c/strong> /dʒʌdʒ/ [C; B2]","gloss":"soudce, soudkyně","example":"The judge listened carefully to both sides of the case."},{"head":"\u003cstrong>justice\u003c/strong> /ˈdʒʌstɪs/ [U; B2]","gloss":"spravedlnost, soudnictví","example":"Everyone in our debate agreed that equal access to justice matters."},{"head":"\u003cstrong>diplomat\u003c/strong> /ˈdɪpləmæt/ [C; B2]","gloss":"diplomat, diplomatka","example":"A diplomat represented her country at the international meeting."},{"head":"\u003cstrong>embassy\u003c/strong> /ˈembəsi/ [C; B1]","gloss":"velvyslanectví, ambasáda","example":"The traveller contacted her country's embassy for information."},{"head":"\u003cstrong>speech\u003c/strong> /spiːtʃ/ [C; B2]","gloss":"projev, řeč, proslov","example":"Our teacher asked us to prepare a short speech about a famous city."},{"head":"\u003cstrong>protest\u003c/strong> /ˈprəʊtest/ AmE /ˈproʊtest/ [C or U; B2]","gloss":"protest, demonstrace","example":"The students discussed how a peaceful protest can draw attention to a problem."},{"head":"\u003cstrong>aircraft\u003c/strong> /ˈeəkrɑːft/ AmE /ˈerkræft/ [C; B2]","gloss":"letadlo, letoun (stejný tvar v sg. i pl.)","example":"Historic aircraft are displayed at the Smithsonian National Air and Space Museum."},{"head":"\u003cstrong>rocket\u003c/strong> /ˈrɒkɪt/ AmE /ˈrɑːkɪt/ [C; B2]","gloss":"raketa (vesmírná)","example":"The exhibition explained how a rocket carries equipment into space."},{"head":"\u003cstrong>liberty\u003c/strong> /ˈlɪbəti/ AmE /ˈlɪbərti/ [U; B2]","gloss":"svoboda, volnost","example":"The Statue of Liberty is a symbol of liberty."},{"head":"\u003cstrong>ferry\u003c/strong> /ˈferi/ [C; B1]","gloss":"trajekt, přívoz","example":"Visitors can take a ferry to Liberty Island."},{"head":"\u003cstrong>financial\u003c/strong> /faɪˈnænʃl/ (adjective; B1)","gloss":"finanční","example":"Our school project examined the financial costs of a trip to New York."},{"head":"\u003cstrong>investor\u003c/strong> /ɪnˈvestə/ AmE /ɪnˈvestər/ [C; B2]","gloss":"investor, investorka","example":"An investor should consider the risks before buying company shares."},{"head":"\u003cstrong>headquarters\u003c/strong> /ˌhedˈkwɔːtəz/ AmE /ˈhedkwɔːrtərz/ [C; B2]","gloss":"sídlo, ústředí, centrála (stejný tvar v sg. i pl.)","example":"The United Nations has its headquarters in New York City."},{"head":"\u003cstrong>storey\u003c/strong> /ˈstɔːri/ [C; B2]","gloss":"patro, podlaží (budovy; AmE \u003cem>story\u003c/em>)","example":"We stayed in a small two-storey hotel."},{"head":"\u003cstrong>steel\u003c/strong> /stiːl/ [U; B2]","gloss":"ocel","example":"The architect chose steel for the frame of the new building."},{"head":"\u003cstrong>concrete\u003c/strong> /ˈkɒŋkriːt/ AmE /ˈkɑːnkriːt/ [U; B2]","gloss":"beton","example":"The new apartment building combines concrete, glass and steel."},{"head":"\u003cstrong>block\u003c/strong> /blɒk/ AmE /blɑːk/ [C; B1]","gloss":"domovní blok (skupina budov obklopená ulicemi)","example":"A road runs along each side of this city block."},{"head":"\u003cstrong>pond\u003c/strong> /pɒnd/ AmE /pɑːnd/ [C; B2]","gloss":"jezírko, rybníček (v městském parku)","example":"We stopped beside a small pond and watched the ducks."},{"head":"\u003cstrong>jogging\u003c/strong> /ˈdʒɒɡɪŋ/ AmE /ˈdʒɑːɡɪŋ/ [U; B1]","gloss":"kondiční běh, běhání","example":"I would like to go jogging in Central Park during my visit."},{"head":"\u003cstrong>energetic\u003c/strong> /ˌenəˈdʒetɪk/ AmE /ˌenərˈdʒetɪk/ (adjective; B2)","gloss":"energický, plný energie","example":"Our energetic guide kept the whole group interested throughout the tour."},{"head":"\u003cstrong>global\u003c/strong> /ˈɡləʊbl/ AmE /ˈɡloʊbl/ (adjective; B2)","gloss":"celosvětový, globální","example":"The class discussed a global problem that affects people in many countries."}],"answer":["As a tourism student in České Budějovice, I would like to compare Washington, D.C. and New York City. Washington is the capital of the United States. New York would give me a different city experience, and I would consider the \u003cstrong>financial\u003c/strong> costs of visiting both places.","Washington is the seat of the federal \u003cstrong>government\u003c/strong>. Congress, made up of the Senate and House of Representatives, meets in the US Capitol and makes federal \u003cstrong>law\u003c/strong>. The president leads the executive branch, while the Supreme Court and other federal courts form the judicial branch. I would like to see the Capitol and learn how these institutions work. I could then prepare a short \u003cstrong>speech\u003c/strong> comparing the American and Czech political systems.","For sightseeing, I would choose the National Mall and its Smithsonian museums. Admission to these museums is free. Historic \u003cstrong>aircraft\u003c/strong> at the National Air and Space Museum would particularly interest me.","In New York, I would take a \u003cstrong>ferry\u003c/strong> to Liberty Island. The Statue of Liberty was a gift from France, dedicated in 1886, and represents \u003cstrong>liberty\u003c/strong>. I would also like to visit the United Nations \u003cstrong>headquarters\u003c/strong> and learn about international cooperation. On another morning, I would go \u003cstrong>jogging\u003c/strong> in Central Park before starting my sightseeing. A ten-\u003cstrong>storey\u003c/strong> hotel might offer a view, but price and convenient transport would matter more to me."],"answer_info":"","questions":[{"cat":"","text":"\u003cstrong>How does the atmosphere and architecture of Washington, D.C. differ from New York City?\u003c/strong> \u003cem>(government buildings, museums, streets and parks; impressions from photographs or a visit)\u003c/em>"},{"cat":"","text":"\u003cstrong>How do the three branches of the US federal government divide their responsibilities?\u003c/strong> \u003cem>(Congress makes laws; the president heads the executive branch; the Supreme Court and other federal courts interpret laws)\u003c/em>"},{"cat":"","text":"\u003cstrong>Why might the Statue of Liberty mean different things to different visitors?\u003c/strong> \u003cem>(freedom, France's gift, personal or family history, a famous landmark)\u003c/em>"},{"cat":"","text":"\u003cstrong>What can a tourist do in Manhattan without spending a lot of money?\u003c/strong> \u003cem>(walk, relax in Central Park, compare transport and food costs)\u003c/em>"},{"cat":"","text":"\u003cstrong>What experience of finding your way around a city could help you in New York?\u003c/strong> \u003cem>(maps, landmarks, asking for directions; a real or imagined situation)\u003c/em>"},{"cat":"","text":"\u003cstrong>Which Smithsonian museum on the National Mall in Washington, D.C. would interest you the most, and why?\u003c/strong> \u003cem>(aircraft, natural history, American history; explain your interests)\u003c/em>"},{"cat":"","text":"\u003cstrong>If you had a week on the East Coast of the USA, how many days would you spend in New York and how many in Washington, D.C.?\u003c/strong> \u003cem>(priorities, budget, travel time, museums, outdoor activities)\u003c/em>"}],"phrases":[{"head":"\u003cstrong>the seat of the federal government\u003c/strong>","gloss":"sídlo federální vlády","note":""},{"head":"\u003cstrong>compare two city destinations\u003c/strong>","gloss":"porovnat dvě městské destinace","note":""},{"head":"\u003cstrong>plan a sightseeing route\u003c/strong>","gloss":"naplánovat trasu prohlídky města","note":""},{"head":"\u003cstrong>take a ferry to Liberty Island\u003c/strong>","gloss":"jet trajektem na ostrov Liberty Island","note":""},{"head":"\u003cstrong>go up to the observation deck\u003c/strong>","gloss":"vyjet na vyhlídkovou plošinu (mrakodrapu)","note":""},{"head":"\u003cstrong>a green oasis in the middle of Manhattan\u003c/strong>","gloss":"zelená oáza uprostřed Manhattanu","note":""},{"head":"\u003cstrong>choose a conveniently located hotel\u003c/strong>","gloss":"vybrat hotel s výhodnou polohou","note":""}],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>government\u003c/strong> /ˈɡʌvənmənt/ AmE /ˈɡʌvərnmənt/ [C or U; A2]","gloss":"vláda, státní moc a správa (v USA zahrnuje všechny tři složky federální moci)","example":"The government of the United States is based in Washington, D.C."},{"head":"\u003cstrong>law\u003c/strong> /lɔː/ [C or U; A2]","gloss":"zákon, právo","example":"The class discussed a new law and its possible effects on everyday life."},{"head":"\u003cstrong>judge\u003c/strong> /dʒʌdʒ/ [C; B1]","gloss":"soudce, soudkyně","example":"The judge listened carefully to both sides of the case."},{"head":"\u003cstrong>speech\u003c/strong> /spiːtʃ/ [C; A2]","gloss":"projev, řeč, proslov","example":"Our teacher asked us to prepare a short speech about a famous city."},{"head":"\u003cstrong>protest\u003c/strong> /ˈprəʊtest/ AmE /ˈproʊtest/ [C or U; B1]","gloss":"protest, demonstrace","example":"The students discussed how a peaceful protest can make people notice a problem."},{"head":"\u003cstrong>Congress\u003c/strong> [vlastní jméno]","gloss":"Kongres (zákonodárný sbor USA; tvoří ho Senát a Sněmovna reprezentantů)","example":"Congress makes laws in the USA."},{"head":"\u003cstrong>Senate\u003c/strong> (the Senate) [vlastní jméno]","gloss":"Senát (jedna ze dvou částí Kongresu USA)","example":"Congress consists of the Senate and the House of Representatives."},{"head":"\u003cstrong>House of Representatives\u003c/strong> (the House of Representatives) [vlastní jméno]","gloss":"Sněmovna reprezentantů (druhá část Kongresu USA)","example":"The House of Representatives is one of the two parts of Congress."},{"head":"\u003cstrong>Supreme Court\u003c/strong> (the Supreme Court) [vlastní jméno]","gloss":"Nejvyšší soud USA (součást soudní moci)","example":"The Supreme Court and other courts decide what laws mean."},{"head":"\u003cstrong>ferry\u003c/strong> /ˈferi/ [C; B1]","gloss":"trajekt, přívoz","example":"Visitors can take a ferry to Liberty Island."},{"head":"\u003cstrong>financial\u003c/strong> /faɪˈnænʃl/ (adjective; B1)","gloss":"finanční","example":"Our school project examined the financial costs of a trip to New York."},{"head":"\u003cstrong>block\u003c/strong> /blɒk/ AmE /blɑːk/ [C; B1]","gloss":"domovní blok (skupina budov obklopená ulicemi)","example":"A road runs along each side of this city block."},{"head":"\u003cstrong>jogging\u003c/strong> /ˈdʒɒɡɪŋ/ AmE /ˈdʒɑːɡɪŋ/ [U; A2]","gloss":"kondiční běh, běhání","example":"I would like to go jogging in Central Park during my visit."},{"head":"\u003cstrong>global\u003c/strong> /ˈɡləʊbl/ AmE /ˈɡloʊbl/ (adjective; B1)","gloss":"celosvětový, globální","example":"The class discussed a global problem that affects people in many countries."},{"head":"\u003cstrong>United Nations\u003c/strong> (the United Nations) [vlastní jméno]","gloss":"Organizace spojených národů (OSN)","example":"I would like to visit the main offices of the United Nations."}],"answer":["As a tourism student in České Budějovice, I would like to compare Washington, D.C. and New York City. Washington is the capital of the United States. New York would give me a different city experience, and I would consider the \u003cstrong>financial\u003c/strong> costs of visiting both places.","The federal \u003cstrong>government\u003c/strong> is based in Washington. \u003cstrong>Congress\u003c/strong> consists of the \u003cstrong>Senate\u003c/strong> and \u003cstrong>House of Representatives\u003c/strong>. It meets in the Capitol and makes federal \u003cstrong>law\u003c/strong>. The president leads the executive branch. The \u003cstrong>Supreme Court\u003c/strong> and other federal courts are the judicial branch. I would like to see the Capitol and learn how the government works. I could then prepare a short \u003cstrong>speech\u003c/strong> that compares the American and Czech political systems.","For sightseeing, I would choose the National Mall and its Smithsonian museums. These museums are free. Historic planes at the National Air and Space Museum would interest me.","In New York, I would take a \u003cstrong>ferry\u003c/strong> to Liberty Island. The Statue of Liberty was a gift from France. It had an official ceremony in 1886 and represents the idea of being free. I would like to visit the main offices of the \u003cstrong>United Nations\u003c/strong>. One morning, I would go \u003cstrong>jogging\u003c/strong> in Central Park."],"questions":[{"cat":"","text":"\u003cstrong>How are the atmosphere and architecture of Washington, D.C. different from New York City?\u003c/strong> \u003cem>(government buildings, museums, streets and parks; impressions from photographs or a visit)\u003c/em>"},{"cat":"","text":"\u003cstrong>How do the three branches of the US federal government divide their responsibilities?\u003c/strong> \u003cem>(Congress makes laws; the president heads the executive branch; the Supreme Court and other federal courts decide what laws mean)\u003c/em>"},{"cat":"","text":"\u003cstrong>Why might the Statue of Liberty mean different things to different visitors?\u003c/strong> \u003cem>(being free, France's gift, personal or family history, a famous sight)\u003c/em>"},{"cat":"","text":"\u003cstrong>What can a tourist do in Manhattan without spending a lot of money?\u003c/strong> \u003cem>(walk, relax in Central Park, compare transport and food costs)\u003c/em>"},{"cat":"","text":"\u003cstrong>What experience of finding your way around a city could help you in New York?\u003c/strong> \u003cem>(maps, places that are easy to recognise, asking for directions; a real or imagined situation)\u003c/em>"},{"cat":"","text":"\u003cstrong>Which Smithsonian museum on the National Mall in Washington, D.C. would interest you the most?\u003c/strong> \u003cem>(planes, natural history, American history; explain your interests)\u003c/em>"},{"cat":"","text":"\u003cstrong>How would you divide a week between New York and Washington, D.C.?\u003c/strong> \u003cem>(what is most important to you, how much you can spend, travel time, museums, outdoor activities)\u003c/em>"}],"phrases":[{"head":"\u003cstrong>the US government is based in…\u003c/strong>","gloss":"vláda USA sídlí v…","note":""},{"head":"\u003cstrong>compare two city destinations\u003c/strong>","gloss":"porovnat dvě městské destinace","note":""},{"head":"\u003cstrong>plan a sightseeing route\u003c/strong>","gloss":"naplánovat trasu prohlídky města","note":""},{"head":"\u003cstrong>take a ferry to Liberty Island\u003c/strong>","gloss":"jet trajektem na ostrov Liberty Island","note":""},{"head":"\u003cstrong>go up a skyscraper for the view\u003c/strong>","gloss":"vyjet nahoru na mrakodrap kvůli výhledu","note":""},{"head":"\u003cstrong>a green place in the middle of Manhattan\u003c/strong>","gloss":"zelené místo uprostřed Manhattanu","note":""},{"head":"\u003cstrong>choose a hotel in a convenient location\u003c/strong>","gloss":"vybrat hotel s výhodnou polohou","note":""}]},"codes":["CR 14b"],"groups":["cr"],"rank":{"cr":29,"all":29.5}},{"file":"tema-c15a-weather-and-climate.md","title":"Weather and climate","label":"Navrhl AI (Hermes, gpt-6.1-terra), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu.","vocab":[{"head":"\u003cstrong>weather forecast [C]\u003c/strong> /ˈweðə fɔːkɑːst/ AmE /ˈweðər fɔːrkæst/","gloss":"předpověď počasí","example":"The weather forecast predicts rain tomorrow."},{"head":"\u003cstrong>cloud cover [U]\u003c/strong>","gloss":"oblačnost","example":"Cloud cover hid the sun all afternoon."},{"head":"\u003cstrong>visibility [U]\u003c/strong> /ˌvɪzəˈbɪləti/","gloss":"viditelnost","example":"Fog reduced visibility on the road."},{"head":"\u003cstrong>humidity [U]\u003c/strong> /hjuːˈmɪdəti/","gloss":"vlhkost vzduchu","example":"High humidity made the room feel uncomfortable."},{"head":"\u003cstrong>heatwave [C]\u003c/strong> /ˈhiːtweɪv/","gloss":"vlna veder","example":"The heatwave changed our plans for the afternoon."},{"head":"\u003cstrong>cold spell [C]\u003c/strong>","gloss":"období chladného počasí","example":"A cold spell arrived in early spring."},{"head":"\u003cstrong>frost [U/C]\u003c/strong> /frɒst/ AmE /frɔːst/","gloss":"mráz, jinovatka","example":"Frost covered the grass in the morning."},{"head":"\u003cstrong>thaw [C]\u003c/strong> /θɔː/","gloss":"obleva","example":"The thaw turned the snow to water."},{"head":"\u003cstrong>downpour [C]\u003c/strong> /ˈdaʊnpɔː(r)/ AmE /ˈdaʊnpɔːr/","gloss":"prudký liják","example":"We sheltered from a sudden downpour."},{"head":"\u003cstrong>sleet [U]\u003c/strong> /sliːt/","gloss":"déšť se sněhem","example":"Sleet fell as we left the station."},{"head":"\u003cstrong>hail [U]\u003c/strong> /heɪl/","gloss":"krupobití, kroupy","example":"Hail hit the roof during the storm."},{"head":"\u003cstrong>gust [C]\u003c/strong> /ɡʌst/","gloss":"poryv větru","example":"A gust blew my hat away."},{"head":"\u003cstrong>breeze [C]\u003c/strong> /briːz/","gloss":"vánek","example":"A cool breeze made the walk pleasant."},{"head":"\u003cstrong>overcast (adj)\u003c/strong> /ˌəʊvəˈkɑːst/ AmE /ˌoʊvərˈkæst/","gloss":"zatažený","example":"The sky was overcast all morning."},{"head":"\u003cstrong>changeable (adj)\u003c/strong> /ˈtʃeɪndʒəbl/","gloss":"proměnlivý","example":"The weather was changeable during our trip."},{"head":"\u003cstrong>soaked (adj)\u003c/strong> /səʊkt/ AmE /soʊkt/","gloss":"promoklý","example":"I was soaked after walking in the rain."},{"head":"\u003cstrong>weather warning [C]\u003c/strong>","gloss":"výstraha před nebezpečným počasím","example":"We checked the weather warning before hiking."},{"head":"\u003cstrong>shelter [C/U]\u003c/strong> /ˈʃeltə/ AmE /ˈʃeltər/","gloss":"úkryt, přístřeší","example":"We found shelter from the rain."},{"head":"\u003cstrong>long-term pattern [C]\u003c/strong>","gloss":"dlouhodobý vzorec","example":"A long-term pattern is different from one day's weather."},{"head":"\u003cstrong>seasonal conditions [plural]\u003c/strong> (seasonal /ˈsiːzənl/)","gloss":"sezónní podmínky","example":"Seasonal conditions affect what visitors pack."}],"answer":["Weather is something we notice every day. It describes conditions in the atmosphere at a particular time and place, whereas climate concerns typical weather over a long period. A rainy afternoon does not tell us what the climate of an area is like. To understand that, we need to look at a \u003cstrong>long-term pattern\u003c/strong>, not just one trip or one week.","As a student interested in tourism, I usually check the \u003cstrong>weather forecast\u003c/strong> before an excursion. If the sky is \u003cstrong>overcast\u003c/strong>, I take a jacket, and if the weather is \u003cstrong>changeable\u003c/strong>, I pack layers. Some \u003cstrong>sleet\u003c/strong> might make a walking tour uncomfortable, and a sudden \u003cstrong>downpour\u003c/strong> can leave everyone \u003cstrong>soaked\u003c/strong>. A strong \u003cstrong>gust\u003c/strong> may make an outdoor activity uncomfortable, while a light \u003cstrong>breeze\u003c/strong> can make a summer walk pleasant.","It is also important to pay attention to a \u003cstrong>weather warning\u003c/strong>. Poor visibility can affect travel, and during a heatwave I would choose a shorter route, carry enough water and plan breaks in the shade. In colder months, frost can make paths slippery. If conditions are unsafe, I would change the plan and find shelter rather than take unnecessary risks.","When planning a holiday, I would consider the usual seasonal conditions, but I would still check a recent forecast just before departure. Personally, I enjoy mild weather because I can spend the whole day outside. For a group, though, flexibility matters more than my own preference: a good guide should always have an indoor alternative."],"answer_info":"","questions":[{"cat":"","text":"How would you explain the difference between weather and climate?"},{"cat":"","text":"What kind of weather do you enjoy most and why?"},{"cat":"","text":"How does a forecast influence your plans for a trip?"},{"cat":"","text":"How would you prepare a group for a very hot day?"},{"cat":"","text":"What problems can poor visibility cause for travellers?"},{"cat":"","text":"How might you change an excursion after a weather warning?"},{"cat":"","text":"How do seasonal conditions affect what tourists pack?"}],"phrases":[{"head":"\u003cstrong>The main difference is that...\u003c/strong>","gloss":"Hlavní rozdíl je v tom, že...","note":""},{"head":"\u003cstrong>According to the forecast...\u003c/strong>","gloss":"Podle předpovědi...","note":""},{"head":"\u003cstrong>I prefer this kind of weather because...\u003c/strong>","gloss":"Tento typ počasí mám raději, protože...","note":""},{"head":"\u003cstrong>It is worth checking...\u003c/strong>","gloss":"Vyplatí se ověřit...","note":""},{"head":"\u003cstrong>If the conditions change, I would...\u003c/strong>","gloss":"Pokud se podmínky změní, ...","note":""},{"head":"\u003cstrong>A possible alternative would be...\u003c/strong>","gloss":"Možnou alternativou by bylo...","note":""},{"head":"\u003cstrong>In the long term...\u003c/strong>","gloss":"Z dlouhodobého hlediska...","note":""}],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>weather forecast [C; B1]\u003c/strong> /ˈweðə fɔːkɑːst/ AmE /ˈweðər fɔːrkæst/","gloss":"předpověď počasí","example":"The weather forecast predicts rain tomorrow."},{"head":"\u003cstrong>amount of cloud [U; A2 + A2]\u003c/strong>","gloss":"oblačnost","example":"A large amount of cloud hid the sun all afternoon."},{"head":"\u003cstrong>amount of water in the air [U; A2 + A1 + A1]\u003c/strong>","gloss":"vlhkost vzduchu","example":"A large amount of water in the air made the room uncomfortable."},{"head":"\u003cstrong>period of very hot weather [phrase; A1 + A1]\u003c/strong>","gloss":"vlna veder","example":"A period of very hot weather changed our plans for the afternoon."},{"head":"\u003cstrong>period of cold weather [phrase; A1 + A1]\u003c/strong>","gloss":"období chladného počasí","example":"A period of cold weather arrived in early spring."},{"head":"\u003cstrong>frost [U/C; slovo k tématu, C1]\u003c/strong> /frɒst/ AmE /frɔːst/","gloss":"mráz, jinovatka","example":"Frost covered the grass in the morning."},{"head":"\u003cstrong>heavy rain [U; B1 + A1]\u003c/strong>","gloss":"silný déšť, liják","example":"We hid from a sudden heavy rain."},{"head":"\u003cstrong>rain and snow together [phrase; A1 + A1]\u003c/strong>","gloss":"déšť se sněhem","example":"Rain and snow fell together when we left the station."},{"head":"\u003cstrong>hail [U; slovo k tématu, C2]\u003c/strong> /heɪl/","gloss":"krupobití, kroupy","example":"Hail hit the roof during the storm."},{"head":"\u003cstrong>sudden strong wind [C; B1 + A1 + A1]\u003c/strong>","gloss":"poryv větru","example":"A sudden strong wind blew my hat away."},{"head":"\u003cstrong>light wind [C; B1 + A1]\u003c/strong>","gloss":"vánek","example":"A cool light wind made the walk pleasant."},{"head":"\u003cstrong>cloudy (adj; B1)\u003c/strong>","gloss":"zatažený","example":"The sky was cloudy all morning."},{"head":"\u003cstrong>change often [phrase; A1 + A1]\u003c/strong>","gloss":"být proměnlivý (o počasí)","example":"The weather changed often during our trip."},{"head":"\u003cstrong>very wet (adj; A1 + A2)\u003c/strong>","gloss":"promoklý","example":"I was very wet after walking in the rain."},{"head":"\u003cstrong>weather warning [C; A1 + B1]\u003c/strong>","gloss":"výstraha před nebezpečným počasím","example":"We checked the weather warning before hiking."},{"head":"\u003cstrong>pattern over a long period [phrase; A2 + A1 + A1]\u003c/strong>","gloss":"dlouhodobý vzorec","example":"A pattern over a long period is different from one day's weather."},{"head":"\u003cstrong>weather at that time of year [phrase; A1 + A1 + A1]\u003c/strong>","gloss":"sezónní podmínky (počasí v danou roční dobu)","example":"The weather at that time of year affects what visitors pack."}],"answer":["Weather describes conditions in the atmosphere at a particular time and place. Climate is the typical weather over a long period. To understand it, we need to look at a \u003cstrong>pattern over a long period\u003c/strong>, not just one week.","As a tourism student, I usually check the \u003cstrong>weather forecast\u003c/strong> before a trip. If the sky is \u003cstrong>cloudy\u003c/strong>, I take a jacket, and if the weather \u003cstrong>changes often\u003c/strong>, I pack layers of clothes. Sudden \u003cstrong>heavy rain\u003c/strong> can make everyone \u003cstrong>very wet\u003c/strong>.","It is also important to pay attention to a \u003cstrong>weather warning\u003c/strong>. When it is hard to see far, this can affect travel. During a \u003cstrong>period of very hot weather\u003c/strong>, I would choose a shorter route and carry enough water. In colder months, \u003cstrong>frost\u003c/strong> can make it easy to fall on paths. If conditions are not safe, I would change the plan and find a safe place.","When I plan a holiday, I would consider the usual \u003cstrong>weather at that time of year\u003c/strong>. But I would still check a recent \u003cstrong>weather forecast\u003c/strong> just before departure. Personally, I enjoy mild weather because I can spend the whole day outside. For a group, though, a good guide should always have an indoor alternative."],"questions":[{"cat":"","text":"How would you explain the difference between weather and climate?"},{"cat":"","text":"What kind of weather do you enjoy most? \u003cem>(your reasons)\u003c/em>"},{"cat":"","text":"How does a weather forecast influence your plans for a trip?"},{"cat":"","text":"How would you prepare a group for a very hot day?"},{"cat":"","text":"What problems can travellers have when it is hard to see far?"},{"cat":"","text":"How might you change a trip after a weather warning?"},{"cat":"","text":"How does the weather in different seasons affect what tourists pack?"}],"phrases":[{"head":"\u003cstrong>The main difference is that...\u003c/strong>","gloss":"Hlavní rozdíl je v tom, že...","note":""},{"head":"\u003cstrong>According to the weather forecast...\u003c/strong>","gloss":"Podle předpovědi počasí...","note":""},{"head":"\u003cstrong>I prefer this kind of weather because...\u003c/strong>","gloss":"Tento typ počasí mám raději, protože...","note":""},{"head":"\u003cstrong>It is worth checking...\u003c/strong>","gloss":"Vyplatí se ověřit...","note":""},{"head":"\u003cstrong>If the conditions change, I would...\u003c/strong>","gloss":"Pokud se podmínky změní, ...","note":""},{"head":"\u003cstrong>A possible alternative would be...\u003c/strong>","gloss":"Možnou alternativou by bylo...","note":""},{"head":"\u003cstrong>Over a long period of time...\u003c/strong>","gloss":"Během delšího období...","note":""}]},"codes":["CR 15a"],"groups":["cr"],"rank":{"cr":30,"all":30.5}},{"file":"tema-c15b-the-menu.md","title":"The menu","label":"Navrhl AI (Hermes, gpt-6.1-terra), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu.","vocab":[{"head":"\u003cstrong>à la carte (adv/adj)\u003c/strong> (la /lɑː/)","gloss":"výběrem jednotlivých jídel z lístku","example":"Guests can order à la carte tonight."},{"head":"\u003cstrong>set menu [C]\u003c/strong>","gloss":"pevně sestavené menu","example":"The set menu includes three courses."},{"head":"\u003cstrong>menu description [C]\u003c/strong>","gloss":"popis pokrmu na jídelním lístku","example":"The menu description explains how the fish is prepared."},{"head":"\u003cstrong>daily special [C]\u003c/strong>","gloss":"denní nabídka, denní specialita","example":"The daily special changes each day."},{"head":"\u003cstrong>listed price [C]\u003c/strong>","gloss":"uvedená cena","example":"The listed price is next to the description."},{"head":"\u003cstrong>portion size [C]\u003c/strong> (portion /ˈpɔːʃn/ AmE /ˈpɔːrʃn/)","gloss":"velikost porce","example":"Ask the server about the portion size."},{"head":"\u003cstrong>garnish [C]\u003c/strong> /ˈɡɑːnɪʃ/ AmE /ˈɡɑːrnɪʃ/","gloss":"ozdoba pokrmu","example":"Fresh herbs make a colourful garnish."},{"head":"\u003cstrong>seasonal produce [U]\u003c/strong> (seasonal /ˈsiːzənl/)","gloss":"sezónní ovoce a zelenina","example":"The chef uses seasonal produce in the salad."},{"head":"\u003cstrong>grilled (adj)\u003c/strong> /ɡrɪld/","gloss":"grilovaný","example":"The grilled vegetables are served warm."},{"head":"\u003cstrong>steamed (adj)\u003c/strong> /stiːmd/","gloss":"vařený v páře","example":"The steamed rice is ready."},{"head":"\u003cstrong>braised (adj)\u003c/strong> /breɪzd/","gloss":"dušený","example":"The braised beef takes time to prepare."},{"head":"\u003cstrong>poached (adj)\u003c/strong> /pəʊtʃt/ AmE /poʊtʃt/","gloss":"pozvolna vařený v tekutině, například ve vodě, vývaru či víně","example":"She chose a poached egg."},{"head":"\u003cstrong>marinated (adj)\u003c/strong>","gloss":"marinovaný, naložený v marinádě","example":"The marinated vegetables have a rich taste."},{"head":"\u003cstrong>simmer (verb)\u003c/strong> /ˈsɪmə/ AmE /ˈsɪmər/","gloss":"mírně vařit pod bodem varu","example":"Simmer the sauce gently."},{"head":"\u003cstrong>allergen [C]\u003c/strong> /ˈælədʒən/ AmE /ˈælərdʒən/","gloss":"alergen","example":"Milk is an allergen in this sauce."},{"head":"\u003cstrong>cross-contact [U]\u003c/strong>","gloss":"nechtěný přenos alergenu na jiné jídlo","example":"Separate utensils help reduce cross-contact."},{"head":"\u003cstrong>dietary requirement [C]\u003c/strong> (dietary /ˈdaɪətəri/ AmE /ˈdaɪəteri/; requirement /rɪˈkwaɪəmənt/ AmE /rɪˈkwaɪərmənt/)","gloss":"stravovací požadavek","example":"Please tell us about your dietary requirements."},{"head":"\u003cstrong>plant-based (adj)\u003c/strong> /ˈplɑːnt beɪst/ AmE /ˈplænt beɪst/","gloss":"rostlinný","example":"The plant-based dish contains beans."},{"head":"\u003cstrong>dairy-free (adj)\u003c/strong> /ˌdeəri ˈfriː/ AmE /ˌderi ˈfriː/","gloss":"bez mléčných výrobků","example":"The dairy-free option is marked on the menu."},{"head":"\u003cstrong>gluten-free (adj)\u003c/strong> /ˌɡluːtn ˈfriː/","gloss":"bez lepku","example":"Ask the staff about a gluten-free option."},{"head":"\u003cstrong>saucepan [C]\u003c/strong> /ˈsɔːspən/ AmE /ˈsɔːspæn/","gloss":"hlubší hrnec či rendlík s držadlem","example":"The sauce is warming in a saucepan."},{"head":"\u003cstrong>boil (v.; B1)\u003c/strong> /bɔɪl/","gloss":"vařit ve vroucí vodě","example":"Boil the potatoes until they are soft."},{"head":"\u003cstrong>stir (v.; B1)\u003c/strong> /stɜː(r)/ AmE /stɜːr/","gloss":"míchat","example":"Stir the sauce before serving it."},{"head":"\u003cstrong>mild (adj.; B2)\u003c/strong> /maɪld/","gloss":"jemné, nepříliš výrazné chuti","example":"The mild sauce is suitable for guests who dislike strong flavours."},{"head":"\u003cstrong>raw (adj.; B1)\u003c/strong> /rɔː/","gloss":"syrový","example":"The salad contains raw vegetables."},{"head":"\u003cstrong>spicy (adj.; B1)\u003c/strong> /ˈspaɪsi/","gloss":"kořeněný, pikantní","example":"The menu describes the soup as spicy."},{"head":"\u003cstrong>contain (v.; B1)\u003c/strong> /kənˈteɪn/","gloss":"obsahovat","example":"The dish contains milk."},{"head":"\u003cstrong>substitute (v.; B2)\u003c/strong> /ˈsʌbstɪtjuːt/ AmE /ˈsʌbstɪtuːt/","gloss":"použít místo něčeho jiného","example":"The cook can substitute rice for potatoes."}],"answer":["A menu helps guests choose a meal and understand what they are paying for. As a tourism student, I think it should be easy to read, with a \u003cstrong>menu description\u003c/strong> and a \u003cstrong>listed price\u003c/strong> for each option. It can be divided into sections for different dishes, drinks and other choices. A \u003cstrong>daily special\u003c/strong> can add variety, while a \u003cstrong>set menu\u003c/strong> offers a fixed selection. Guests who prefer more freedom can order \u003cstrong>à la carte\u003c/strong>.","Descriptions of preparation are useful because two dishes with similar ingredients can be quite different. For example, vegetables may be grilled, steamed or \u003cstrong>marinated\u003c/strong>. Meat might be braised, and an egg can be poached. A menu can also explain the portion size or a garnish and highlight \u003cstrong>seasonal produce\u003c/strong>. I would avoid using complicated words without explaining them, especially when serving international visitors.","Another important point is safety. In the EU, allergen information must be provided for non-prepacked food, including food served in restaurants. A guest may have a \u003cstrong>dietary requirement\u003c/strong> and ask whether a dish is dairy-free, gluten-free or plant-based. These labels are not interchangeable, and a plant-based dish is not automatically free from every \u003cstrong>allergen\u003c/strong>. Staff should check the actual ingredients and preparation with the kitchen rather than make assumptions. They should also consider \u003cstrong>cross-contact\u003c/strong> when answering questions.","Personally, I like a short menu with clear choices. It makes ordering less stressful and helps me find something suitable. In my future work I would explain unfamiliar terms politely and make sure guests know whom to ask if they need more information."],"answer_info":"","questions":[{"cat":"","text":"How would you organise a clear restaurant menu?"},{"cat":"","text":"What is the difference between a set menu and ordering à la carte?"},{"cat":"","text":"How do preparation methods influence a guest's choice?"},{"cat":"","text":"What details should a menu provide besides the name of a dish?"},{"cat":"","text":"How would you respond to a guest with a dietary requirement?"},{"cat":"","text":"Why should staff check for cross-contact in the kitchen?"},{"cat":"","text":"What would you change about a confusing menu?"}],"phrases":[{"head":"\u003cstrong>The menu is divided into...\u003c/strong>","gloss":"Jídelní lístek je rozdělen na...","note":""},{"head":"\u003cstrong>This dish is prepared by...\u003c/strong>","gloss":"Tento pokrm se připravuje...","note":""},{"head":"\u003cstrong>The price includes...\u003c/strong>","gloss":"Cena zahrnuje...","note":""},{"head":"\u003cstrong>Our daily special is...\u003c/strong>","gloss":"Naší dnešní specialitou je...","note":""},{"head":"\u003cstrong>Please tell us about any dietary requirements.\u003c/strong>","gloss":"Prosím sdělte nám své stravovací požadavky.","note":""},{"head":"\u003cstrong>I will check the ingredients with the kitchen.\u003c/strong>","gloss":"Ověřím složení v kuchyni.","note":""},{"head":"\u003cstrong>In my opinion, a clear menu should...\u003c/strong>","gloss":"Podle mě by měl přehledný jídelní lístek...","note":""}],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>à la carte (adv/adj; slovo k tématu, C2)\u003c/strong> (la /lɑː/)","gloss":"výběrem jednotlivých jídel z lístku","example":"Guests can order à la carte tonight."},{"head":"\u003cstrong>fixed-price menu\u003c/strong> [C; B1 + A1 + A1]","gloss":"menu za pevnou cenu, pevně sestavené menu","example":"The fixed-price menu includes three courses."},{"head":"\u003cstrong>menu description [C; A1 + A1]\u003c/strong>","gloss":"popis pokrmu na jídelním lístku","example":"The menu description explains how the fish is prepared."},{"head":"\u003cstrong>dish of the day\u003c/strong> [C; A1 + A1]","gloss":"denní nabídka, denní specialita","example":"The dish of the day changes each day."},{"head":"\u003cstrong>price on the menu\u003c/strong> [C; A1 + A1]","gloss":"uvedená cena (cena na jídelním lístku)","example":"The price on the menu is next to the description."},{"head":"\u003cstrong>amount of food\u003c/strong> [C; A2 + A1]","gloss":"množství jídla, velikost porce","example":"Ask the waiter about the amount of food."},{"head":"\u003cstrong>grilled (adj; slovo k tématu, B2)\u003c/strong> /ɡrɪld/","gloss":"grilovaný","example":"The grilled vegetables are served warm."},{"head":"\u003cstrong>allergen [C; slovo k tématu, C2]\u003c/strong> /ˈælədʒən/ AmE /ˈælərdʒən/","gloss":"alergen","example":"Milk is an allergen in this sauce."},{"head":"\u003cstrong>special diet\u003c/strong> [C; A1 + A1]","gloss":"zvláštní strava, stravovací požadavek","example":"Please tell us about your special diet."},{"head":"\u003cstrong>plant-based (adj; B1)\u003c/strong> /ˈplɑːnt beɪst/ AmE /ˈplænt beɪst/","gloss":"rostlinný","example":"The plant-based dish contains beans."},{"head":"\u003cstrong>without milk products\u003c/strong> (phrase; A1 + A1 + A1)","gloss":"bez mléčných výrobků","example":"The option without milk products is marked on the menu."},{"head":"\u003cstrong>gluten-free (adj; slovo k tématu, C2)\u003c/strong> /ˌɡluːtn ˈfriː/","gloss":"bez lepku","example":"Ask the staff about a gluten-free option."},{"head":"\u003cstrong>saucepan [C; B1]\u003c/strong> /ˈsɔːspən/ AmE /ˈsɔːspæn/","gloss":"hlubší hrnec či rendlík s držadlem","example":"The sauce is warming in a saucepan."},{"head":"\u003cstrong>boil (v.; A2)\u003c/strong> /bɔɪl/","gloss":"vařit ve vroucí vodě","example":"Boil the potatoes until they are soft."},{"head":"\u003cstrong>mild (adj.; B1)\u003c/strong> /maɪld/","gloss":"jemné, nepříliš výrazné chuti","example":"The mild sauce is suitable for guests who dislike strong tastes."},{"head":"\u003cstrong>not cooked\u003c/strong> (phrase; A1 + A1)","gloss":"syrový, tepelně neupravený","example":"The salad contains vegetables that are not cooked."},{"head":"\u003cstrong>spicy (adj.; B1)\u003c/strong> /ˈspaɪsi/","gloss":"kořeněný, pikantní","example":"The menu describes the soup as spicy."},{"head":"\u003cstrong>contain (v.; A2)\u003c/strong> /kənˈteɪn/","gloss":"obsahovat","example":"The dish contains milk."},{"head":"\u003cstrong>use something instead of something\u003c/strong> (phrase; A1 + A2)","gloss":"použít místo něčeho jiného","example":"The cook can use rice instead of potatoes."},{"head":"\u003cstrong>EU\u003c/strong> (the European Union) [vlastní jméno]","gloss":"Evropská unie","example":"In the EU, restaurants must give allergen information."}],"answer":["A menu helps guests choose a meal and understand what they are paying for. As a tourism student, I think it should be easy to read. Each option should have a \u003cstrong>menu description\u003c/strong> and a \u003cstrong>price on the menu\u003c/strong>. The menu can be divided into sections for different dishes, drinks and other choices. A \u003cstrong>dish of the day\u003c/strong> can add variety, while a \u003cstrong>fixed-price menu\u003c/strong> offers a fixed choice. Guests who prefer more choice can order \u003cstrong>à la carte\u003c/strong>.","Descriptions of how a dish is prepared are useful, because two dishes with similar ingredients can be quite different. For example, vegetables may be \u003cstrong>grilled\u003c/strong>. A menu can also explain the \u003cstrong>amount of food\u003c/strong>.","Another important point is safety. In the \u003cstrong>EU\u003c/strong>, \u003cstrong>allergen\u003c/strong> information must be provided for food that is not packed, including food in restaurants. A guest may have a \u003cstrong>special diet\u003c/strong> and ask whether a dish is \u003cstrong>without milk products\u003c/strong>, \u003cstrong>gluten-free\u003c/strong> or \u003cstrong>plant-based\u003c/strong>. A \u003cstrong>plant-based\u003c/strong> dish can still \u003cstrong>contain\u003c/strong> an \u003cstrong>allergen\u003c/strong>. Staff should check the ingredients with the kitchen instead of guessing. They should also consider how an \u003cstrong>allergen\u003c/strong> from one food can end up in another.","Personally, I like a short menu with clear choices."],"questions":[{"cat":"","text":"How would you organise a clear restaurant menu?"},{"cat":"","text":"What is the difference between a fixed-price menu and ordering à la carte?"},{"cat":"","text":"How does the way a dish is prepared influence a guest's choice?"},{"cat":"","text":"What details should a menu provide apart from the name of a dish?"},{"cat":"","text":"How would you respond to a guest with a special diet?"},{"cat":"","text":"Why should staff check that allergens do not move between foods in the kitchen?"},{"cat":"","text":"What would you change about a menu that is difficult to understand?"}],"phrases":[{"head":"\u003cstrong>The menu is divided into...\u003c/strong>","gloss":"Jídelní lístek je rozdělen na...","note":""},{"head":"\u003cstrong>This dish is prepared by...\u003c/strong>","gloss":"Tento pokrm se připravuje...","note":""},{"head":"\u003cstrong>The price includes...\u003c/strong>","gloss":"Cena zahrnuje...","note":""},{"head":"\u003cstrong>Our dish of the day is...\u003c/strong>","gloss":"Naší dnešní specialitou je...","note":""},{"head":"\u003cstrong>Please tell us about any special diets.\u003c/strong>","gloss":"Prosím sdělte nám své stravovací požadavky.","note":""},{"head":"\u003cstrong>I will check the ingredients with the kitchen.\u003c/strong>","gloss":"Ověřím složení v kuchyni.","note":""},{"head":"\u003cstrong>In my opinion, a clear menu should...\u003c/strong>","gloss":"Podle mě by měl přehledný jídelní lístek...","note":""}]},"codes":["CR 15b"],"groups":["cr"],"rank":{"cr":31,"all":31.5}},{"file":"tema-c17a-clothes-and-fashion.md","title":"Clothes and fashion","label":"Navrhl AI (Hermes, gpt-6.1-terra), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu.","vocab":[{"head":"\u003cstrong>outfit [C]\u003c/strong> /ˈaʊtfɪt/","gloss":"oblečení tvořící komplet","example":"My interview outfit is simple."},{"head":"\u003cstrong>wardrobe [C]\u003c/strong> /ˈwɔːdrəʊb/ AmE /ˈwɔːrdroʊb/","gloss":"šatník, soubor oblečení","example":"Her wardrobe contains several jackets."},{"head":"\u003cstrong>sleeve [C]\u003c/strong> /sliːv/","gloss":"rukáv","example":"The sleeve is too long."},{"head":"\u003cstrong>collar [C]\u003c/strong> /ˈkɒlə/ AmE /ˈkɑːlər/","gloss":"límec","example":"This shirt has a soft collar."},{"head":"\u003cstrong>hem [C]\u003c/strong> /hem/","gloss":"dolní lem oděvu","example":"The hem needs
