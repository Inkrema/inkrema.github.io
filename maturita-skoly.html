əʊzi/ AmE /ˈkoʊzi/ (adjective)","gloss":"útulný","example":"With a burning fireplace and wooden floors, the attic bedroom feels very cosy."},{"head":"\u003cstrong>fully furnished\u003c/strong> (fully /ˈfʊli/; furnished /ˈfɜːnɪʃt/ AmE /ˈfɜːrnɪʃt/) (phrase)","gloss":"plně zařízený (nábytkem)","example":"Students prefer renting fully furnished flats so they do not have to purchase wardrobes and beds."},{"head":"\u003cstrong>utilities\u003c/strong> [plural]","gloss":"poplatky za energie a služby (elektřina, plyn, voda, topení)","example":"When calculating living expenses, do not forget to add monthly utilities to the base rent."},{"head":"\u003cstrong>household appliances\u003c/strong> (household /ˈhaʊshəʊld/) [plural]","gloss":"domácí spotřebiče","example":"Modern energy-efficient household appliances, like dishwashers and washing machines, save both time and money."},{"head":"\u003cstrong>maintenance\u003c/strong> /ˈmeɪntənəns/ [U]","gloss":"údržba (domu, nemovitosti, zahrady)","example":"Owning an older house requires continuous maintenance, from repairing roof tiles to painting fences."},{"head":"\u003cstrong>renovate\u003c/strong> /ˈrenəveɪt/ (verb)","gloss":"rekonstruovat, zmodernizovat","example":"They bought a traditional stone cottage and decided to renovate it step by step."},{"head":"\u003cstrong>cottage\u003c/strong> /ˈkɒtɪdʒ/ AmE /ˈkɑːtɪdʒ/ [C]","gloss":"venkovský domek, chalupa (pro víkendové pobyty též \u003cem>holiday cottage\u003c/em>)","example":"Many Czech families spend their summer weekends relaxing at a countryside cottage."},{"head":"\u003cstrong>suburb\u003c/strong> /ˈsʌbɜːb/ AmE /ˈsʌbɜːrb/ [C]","gloss":"předměstí, okrajová čtvrť","example":"Families with small children often migrate to quiet suburbs outside large cities."},{"head":"\u003cstrong>countryside\u003c/strong> /ˈkʌntrisaɪd/ [U]","gloss":"venkov, venkovská příroda","example":"Living in the peaceful countryside offers fresh air, though residents often have to commute to town by car."},{"head":"\u003cstrong>neighbourhood\u003c/strong> /ˈneɪbəhʊd/ AmE /ˈneɪbərhʊd/ [C]","gloss":"sousedství, okolí bydliště","example":"Our neighbourhood is safe and friendly, with plenty of playgrounds and leafy trees."},{"head":"\u003cstrong>housing market\u003c/strong> (housing /ˈhaʊzɪŋ/) [C]","gloss":"trh s bydlením","example":"Rapidly rising property prices make it very challenging to enter the housing market."},{"head":"\u003cstrong>amenities\u003c/strong> [plural]","gloss":"občanská vybavenost (služby v okolí bydliště)","example":"Proximity to essential amenities like shops, medical clinics, and tram stops makes city life practical."}],"answer":["Having a comfortable place to live is essential for our daily well-being and sense of security. People's living arrangements vary widely depending on their personal preferences, financial means, and stage of life. In the Czech Republic, many city residents live in a \u003cstrong>block of flats\u003c/strong>, while families in smaller towns and villages often own a \u003cstrong>detached house\u003c/strong> surrounded by a private garden.","Currently, I live with my parents in a \u003cstrong>spacious\u003c/strong> three-room flat in a quiet \u003cstrong>neighbourhood\u003c/strong> of České Budějovice. What I appreciate most about our home is how \u003cstrong>cosy\u003c/strong> and convenient it is. We do not have to worry about demanding exterior \u003cstrong>maintenance\u003c/strong> or mowing lawns, and all basic \u003cstrong>amenities\u003c/strong> are just a short walk away. On the other hand, many Czechs, including my relatives, love spending weekends at a countryside \u003cstrong>cottage\u003c/strong>, which offers a peaceful escape from urban traffic and concrete buildings.","Looking ahead to the future, finding suitable accommodation is a major concern for my generation. The current \u003cstrong>housing market\u003c/strong> is under severe pressure with high property prices. Most young graduates start out as tenants in a shared or \u003cstrong>fully furnished\u003c/strong> apartment, paying monthly \u003cstrong>rent\u003c/strong> and \u003cstrong>utilities\u003c/strong>. Over time, buying an independent home usually means securing a long-term bank \u003cstrong>mortgage\u003c/strong>. When I imagine my dream house, I would love a comfortable house in a green \u003cstrong>suburb\u003c/strong>, combining peace and quiet with easy access to city life."],"answer_info":"","questions":[{"cat":"Popis","text":"Which room in your home is your personal favourite, and how is it furnished?"},{"cat":"Srovnání","text":"What are the main advantages and drawbacks of living in a flat in a block of flats compared to living in a detached family house?"},{"cat":"Názor","text":"Why is it increasingly difficult for young people to buy their own property today?"},{"cat":"Srovnání","text":"In what ways does life in the countryside differ from living in a busy urban centre?"},{"cat":"Popis","text":"What factors should a student consider before signing a rental agreement for a student flat?"},{"cat":"Hypotéza","text":"If you had unlimited funds to design and build your dream home, what unique features would you include?"},{"cat":"Názor","text":"How do household responsibilities and chores contribute to preparing teenagers for independent adult life?"}],"phrases":[{"head":"\u003cstrong>There is no place like home, because...\u003c/strong>","gloss":"Není nad domov, protože...","note":"vyjádření vztahu k domovu"},{"head":"\u003cstrong>When deciding between city and countryside living,...\u003c/strong>","gloss":"Při rozhodování mezi životem ve městě a na venkově...","note":"uvedení dilematu"},{"head":"\u003cstrong>The main downside of owning a house is...\u003c/strong>","gloss":"Hlavní nevýhodou vlastnictví domu je...","note":"uvedení záporu"},{"head":"\u003cstrong>In terms of everyday convenience,...\u003c/strong>","gloss":"Co se týče každodenního pohodlí,...","note":"aspekt praktičnosti"},{"head":"\u003cstrong>From a financial point of view,...\u003c/strong>","gloss":"Z finančního hlediska...","note":"ekonomický argument"},{"head":"\u003cstrong>If I had to make a choice,...\u003c/strong>","gloss":"Kdybych si musel vybrat,...","note":"vyjádření preference"},{"head":"\u003cstrong>To sum up, the most important thing about housing is...\u003c/strong>","gloss":"Abych to shrnul, nejdůležitější věcí na bydlení je...","note":"závěrečné shrnutí"}],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>detached house\u003c/strong> (detached /dɪˈtætʃt/) [C; slovo k tématu, B2]","gloss":"samostatně stojící rodinný dům","example":"Living in a detached house with a private garden means that you feel free and other people rarely watch you."},{"head":"\u003cstrong>semi-detached house\u003c/strong> (semi /ˈsemi/; detached /dɪˈtætʃt/) [C; slovo k tématu, B2]","gloss":"dvojdomek (dva domy spojené jednou společnou zdí)","example":"Semi-detached houses are extremely common in British neighbourhoods outside the city centre."},{"head":"\u003cstrong>terraced house\u003c/strong> /ˌterəst ˈhaʊs/ [C; slovo k tématu, C1]","gloss":"řadový dům","example":"Long rows of terraced houses are typical of northern English towns with a lot of industry."},{"head":"\u003cstrong>block of flats\u003c/strong> [C; B1]","gloss":"bytový dům, činžovní dům (zahrnuje i panelové domy)","example":"Our family lives on the third floor of a block of flats."},{"head":"\u003cstrong>mortgage\u003c/strong> /ˈmɔːɡɪdʒ/ AmE /ˈmɔːrɡɪdʒ/ [C; slovo k tématu, B2]","gloss":"hypotéka","example":"Getting a thirty-year mortgage is the only practical way for most young couples to buy a home."},{"head":"\u003cstrong>rent\u003c/strong> /rent/ [U; B1]","gloss":"nájemné","example":"In a capital city, paying rent every month takes a large part of the salary from a first job."},{"head":"\u003cstrong>look after\u003c/strong> (phrasal verb; A2)","gloss":"starat se o (dům, zahradu), udržovat","example":"If you own an older house, you must always look after it."},{"head":"\u003cstrong>cottage\u003c/strong> /ˈkɒtɪdʒ/ AmE /ˈkɑːtɪdʒ/ [C; B1]","gloss":"venkovský domek, chalupa (pro víkendové pobyty též \u003cem>holiday cottage\u003c/em>)","example":"Many Czech families spend their summer weekends relaxing at a countryside cottage."},{"head":"\u003cstrong>countryside\u003c/strong> /ˈkʌntrisaɪd/ [U; B1]","gloss":"venkov, venkovská příroda","example":"Living in the peaceful countryside offers fresh air, but people there often have to commute to town by car."},{"head":"\u003cstrong>neighbourhood\u003c/strong> /ˈneɪbəhʊd/ AmE /ˈneɪbərhʊd/ [C; B1]","gloss":"sousedství, okolí bydliště","example":"Our neighbourhood is safe and friendly, with plenty of playgrounds and trees."}],"answer":["A comfortable place to live is essential for feeling good and safe every day. In the Czech Republic, many people in cities live in a \u003cstrong>block of flats\u003c/strong>. Families in smaller towns and villages often own a \u003cstrong>detached house\u003c/strong> with a private garden.","Currently, I live with my parents in a big three-room flat in a quiet \u003cstrong>neighbourhood\u003c/strong> of České Budějovice. Most of all, I appreciate our home because it is warm, comfortable and convenient. We do not have to worry about \u003cstrong>looking after\u003c/strong> the outside of a house or cutting the grass. But many Czechs, including my relatives, love spending weekends at a \u003cstrong>cottage\u003c/strong> in the \u003cstrong>countryside\u003c/strong>.","When I think about the future, finding suitable accommodation is a big worry for my generation. Today, flats and houses are very expensive. Most young graduates first live in a shared flat or one that already has furniture. They pay \u003cstrong>rent\u003c/strong> and bills for electricity, gas and water every month. Later, buying your own home usually means a bank \u003cstrong>mortgage\u003c/strong> for many years. My dream is a comfortable house in a green area on the edge of a city. It would give me peace and quiet and easy access to city life."],"questions":[{"cat":"Popis","text":"Which room in your home is your personal favourite? \u003cem>(what furniture there is in it)\u003c/em>"},{"cat":"Srovnání","text":"What are the main advantages and disadvantages of living in a block of flats? \u003cem>(how it is different from living in a detached family house)\u003c/em>"},{"cat":"Názor","text":"Why is it more and more difficult for young people to buy their own property?"},{"cat":"Srovnání","text":"How is life in the countryside different from living in a busy city centre?"},{"cat":"Popis","text":"What factors should a student consider before signing an agreement to rent a student flat?"},{"cat":"Hypotéza","text":"If money were no problem, what would you include in your dream home? \u003cem>(how you would design and build it; features that no other home has)\u003c/em>"},{"cat":"Názor","text":"How do responsibilities and chores at home help to prepare teenagers for independent adult life?"}],"phrases":[{"head":"\u003cstrong>Home is the best place, because...\u003c/strong>","gloss":"Není nad domov, protože...","note":"vyjádření vztahu k domovu"},{"head":"\u003cstrong>When you decide between living in the city and in the countryside,...\u003c/strong>","gloss":"Při rozhodování mezi životem ve městě a na venkově...","note":"uvedení dilematu"},{"head":"\u003cstrong>The main disadvantage of owning a house is...\u003c/strong>","gloss":"Hlavní nevýhodou vlastnictví domu je...","note":"uvedení záporu"},{"head":"\u003cstrong>When I think about what is convenient in everyday life,...\u003c/strong>","gloss":"Když myslím na to, co je v každodenním životě pohodlné,...","note":"aspekt praktičnosti"},{"head":"\u003cstrong>From a financial point of view,...\u003c/strong>","gloss":"Z finančního hlediska...","note":"ekonomický argument"},{"head":"\u003cstrong>If I had to make a choice,...\u003c/strong>","gloss":"Kdybych si musel vybrat,...","note":"vyjádření preference"},{"head":"\u003cstrong>In conclusion, the most important thing about the place where we live is...\u003c/strong>","gloss":"Závěrem: nejdůležitější věcí na bydlení je...","note":"závěrečné shrnutí"}]},"codes":["SSO 4","CR 3a"],"groups":["cr","sso"],"rank":{"cr":6,"sso":8,"all":6.5}},{"file":"tema-c4a-daily-routines.md","title":"Daily routines","label":"Navrhl AI (Hermes, gpt-6.1-terra, openai-codex), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu.","vocab":[{"head":"\u003cstrong>alarm clock\u003c/strong> /əˈlɑːm klɒk/ AmE /əˈlɑːrm klɑːk/ [C]","gloss":"budík. \u003cem>My alarm clock rings at seven.\u003c/em>","example":""},{"head":"\u003cstrong>get out of bed\u003c/strong> (phrase)","gloss":"vstát z postele. \u003cem>I get out of bed when I hear music.\u003c/em>","example":""},{"head":"\u003cstrong>oversleep\u003c/strong> /ˌəʊvəˈsliːp/ AmE /ˌoʊvərˈsliːp/ (verb)","gloss":"zaspat. \u003cem>I overslept and missed the bus.\u003c/em>","example":""},{"head":"\u003cstrong>get dressed\u003c/strong> (phrase)","gloss":"obléknout se. \u003cem>I get dressed before breakfast.\u003c/em>","example":""},{"head":"\u003cstrong>pack a bag\u003c/strong> (phrase)","gloss":"sbalit tašku. \u003cem>I pack my bag in the evening.\u003c/em>","example":""},{"head":"\u003cstrong>set off\u003c/strong> (phrasal verb)","gloss":"vyrazit na cestu. \u003cem>We set off early.\u003c/em>","example":""},{"head":"\u003cstrong>morning rush\u003c/strong> (rush /rʌʃ/) [C]","gloss":"ranní shon. \u003cem>The morning rush makes me nervous.\u003c/em>","example":""},{"head":"\u003cstrong>first period\u003c/strong> [C]","gloss":"první vyučovací hodina. \u003cem>Our first period begins at eight.\u003c/em>","example":""},{"head":"\u003cstrong>break between lessons\u003c/strong> [C]","gloss":"přestávka mezi vyučovacími hodinami. \u003cem>I talk to my friends during the break between lessons.\u003c/em>","example":""},{"head":"\u003cstrong>hand in homework\u003c/strong> (phrase)","gloss":"odevzdat domácí úkol. \u003cem>I hand in homework on Fridays.\u003c/em>","example":""},{"head":"\u003cstrong>lay out clothes\u003c/strong> (phrase)","gloss":"připravit si oblečení. \u003cem>I lay out clothes for the next morning.\u003c/em>","example":""},{"head":"\u003cstrong>make time for\u003c/strong> (verb phrase + noun)","gloss":"udělat si čas na. \u003cem>I make time for reading.\u003c/em>","example":""},{"head":"\u003cstrong>put off\u003c/strong> (phrasal verb + noun / -ing)","gloss":"odložit. \u003cem>Don't put off doing your homework.\u003c/em>","example":""},{"head":"\u003cstrong>stick to a schedule\u003c/strong> (phrase)","gloss":"držet se rozvrhu. \u003cem>I stick to a schedule during the week.\u003c/em>","example":""},{"head":"\u003cstrong>stay up late\u003c/strong> (phrase)","gloss":"zůstat vzhůru dlouho do noci. \u003cem>I sometimes stay up late on Saturday.\u003c/em>","example":""},{"head":"\u003cstrong>sleep in\u003c/strong> /ˌsliːp ˈɪn/ (phrasal verb)","gloss":"ráno si přispat. \u003cem>I sleep in on Sundays.\u003c/em>","example":""},{"head":"\u003cstrong>get sidetracked\u003c/strong> (phrase)","gloss":"nechat se vyrušit od původní činnosti. \u003cem>I get sidetracked when I check my phone during homework.\u003c/em>","example":""},{"head":"\u003cstrong>run an errand\u003c/strong> (errand /ˈerənd/) (phrase)","gloss":"obstarat pochůzku. \u003cem>I run an errand for my neighbour.\u003c/em>","example":""},{"head":"\u003cstrong>get ready for bed\u003c/strong> (phrase)","gloss":"připravit se do postele. \u003cem>I get ready for bed at ten.\u003c/em>","example":""},{"head":"\u003cstrong>change of pace\u003c/strong> [C]","gloss":"změna tempa. \u003cem>A quiet Sunday is a welcome change of pace.\u003c/em>","example":""},{"head":"\u003cstrong>adjust\u003c/strong> /əˈdʒʌst/ (verb + noun; B2)","gloss":"přizpůsobit či upravit. \u003cem>I adjust my routine when my first lesson starts later.\u003c/em>","example":""},{"head":"\u003cstrong>interrupt\u003c/strong> /ˌɪntəˈrʌpt/ (verb; B1)","gloss":"přerušit někoho při mluvení. \u003cem>I try not to interrupt my classmates when they are speaking.\u003c/em>","example":""},{"head":"\u003cstrong>concentrate\u003c/strong> /ˈkɒnsntreɪt/ AmE /ˈkɑːnsntreɪt/ (verb; B1)","gloss":"soustředit se. \u003cem>I concentrate better after a short break.\u003c/em>","example":""},{"head":"\u003cstrong>remind\u003c/strong> /rɪˈmaɪnd/ (verb; B1)","gloss":"připomenout. \u003cem>My calendar reminds me about an appointment.\u003c/em>","example":""},{"head":"\u003cstrong>organize\u003c/strong> /ˈɔːɡənaɪz/ AmE /ˈɔːrɡənaɪz/ (verb; B1)","gloss":"naplánovat či uspořádat. \u003cem>I organize my tasks before I start studying.\u003c/em>","example":""},{"head":"\u003cstrong>regularly\u003c/strong> /ˈreɡjələli/ AmE /ˈreɡjələrli/ (adverb; B1)","gloss":"pravidelně. \u003cem>I regularly check my timetable.\u003c/em>","example":""},{"head":"\u003cstrong>rest\u003c/strong> /rest/ (verb; B1)","gloss":"odpočívat. \u003cem>I rest for a while after a busy day.\u003c/em>","example":""},{"head":"\u003cstrong>avoid\u003c/strong> /əˈvɔɪd/ (verb; B1)","gloss":"vyhnout se. \u003cem>I leave early to avoid the morning traffic.\u003c/em>","example":""}],"answer":["My weekdays usually start with an \u003cstrong>alarm clock\u003c/strong> at seven. I try to \u003cstrong>get out of bed\u003c/strong> straight away, although I sometimes want another five minutes. If I \u003cstrong>oversleep\u003c/strong>, the whole morning feels stressful. I \u003cstrong>get dressed\u003c/strong>, have breakfast and check that I have everything for school. I prefer to \u003cstrong>pack a bag\u003c/strong> the night before because it makes the \u003cstrong>morning rush\u003c/strong> easier. Then I \u003cstrong>set off\u003c/strong> for school and listen to music on the way.","My \u003cstrong>first period\u003c/strong> is often English. During a \u003cstrong>break between lessons\u003c/strong>, I chat with classmates or look at my notes. I try to hand in homework on time, but sometimes I forget and have to explain what happened. After school, I might go home and help my family. In the evening I \u003cstrong>lay out clothes\u003c/strong> for the next morning. I also try to make time for my friends. If there is a lot to do, I write a short list rather than put off the difficult tasks.","At the weekend I usually sleep in and enjoy a slower start. Sometimes I run an errand for my family, and in the afternoon I meet friends or go for a walk. I occasionally stay up late on Saturday, but on Sunday I try to get ready for bed earlier. This change of pace helps me prepare for Monday. I do not always stick to a schedule: unexpected things happen, and I think a routine should leave room for them. For me, a good routine is useful, but it should not control every minute."],"answer_info":"","questions":[{"cat":"","text":"What does a normal school morning look like for you?"},{"cat":"","text":"How does your routine change at weekends?"},{"cat":"","text":"What do you do when you wake up late?"},{"cat":"","text":"Which part of your day do you enjoy most, and why?"},{"cat":"","text":"How does your routine compare with that of someone in your family?"},{"cat":"","text":"What would you change about your day if school started later?"},{"cat":"","text":"How do you make time for friends when you are busy?"}],"phrases":[{"head":"\u003cstrong>On a typical weekday, ...\u003c/strong>","gloss":"V běžný pracovní den…","note":""},{"head":"\u003cstrong>The first thing I do is ...\u003c/strong>","gloss":"První věc, kterou udělám, je…","note":""},{"head":"\u003cstrong>After that, I usually ...\u003c/strong>","gloss":"Potom obvykle…","note":""},{"head":"\u003cstrong>At the weekend, things are different because ...\u003c/strong>","gloss":"O víkendu je to jiné, protože…","note":""},{"head":"\u003cstrong>What works best for me is ...\u003c/strong>","gloss":"Nejlépe mi vyhovuje…","no ing after dinner."},{"head":"\u003cstrong>hedge\u003c/strong> /hedʒ/ [C; B2]","gloss":"živý plot","example":"My host showed me the green hedge around her garden."},{"head":"\u003cstrong>behave\u003c/strong> /bɪˈheɪv/ (verb; B1)","gloss":"chovat se, jednat určitým způsobem","example":"I try to behave politely when I visit someone for the first time."}],"answer":["When visiting England, I would show \u003cstrong>politeness\u003c/strong> by saying \"please\" and \"thank you\". I would join the back of a \u003cstrong>queue\u003c/strong> and be \u003cstrong>patient\u003c/strong>. Good \u003cstrong>manners\u003c/strong> matter when meeting a \u003cstrong>stranger\u003c/strong>, and I would try to \u003cstrong>behave\u003c/strong> considerately. For breakfast, I might buy a \u003cstrong>pint\u003c/strong> of milk. Later, I would enjoy afternoon tea with sandwiches, scones and cakes, drinking from a cup on a \u003cstrong>saucer\u003c/strong>. I would not expect everyone to follow this tradition daily. I would also like to try a warm fruit \u003cstrong>pudding\u003c/strong>, watch an English comedy to explore its humour, and visit a garden with a carefully trimmed \u003cstrong>hedge\u003c/strong>."],"answer_info":"","questions":[{"cat":"","text":"\u003cstrong>How might your weekday routine change if you studied in England?\u003c/strong> \u003cem>(travel to school, meal times, homework and meeting new friends)\u003c/em>"},{"cat":"","text":"\u003cstrong>What advice about politeness would you give a visitor to England, and how does it compare with Czech habits?\u003c/strong> \u003cem>(waiting your turn, please and thank you, personal experience and individual differences)\u003c/em>"},{"cat":"","text":"\u003cstrong>Which English traditions or leisure activities would you like to try, and why?\u003c/strong> \u003cem>(afternoon tea, visiting a garden, watching a comedy or joining a pub quiz)\u003c/em>"}],"phrases":[],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>queue\u003c/strong> /kjuː/ [C; B1]","gloss":"fronta","example":"I joined the queue at the bus stop and waited for my turn."},{"head":"\u003cstrong>polite\u003c/strong> (adjective; A2)","gloss":"zdvořilý, slušný","example":"Saying \"please\" and \"thank you\" is a simple way to be polite."},{"head":"\u003cstrong>manners\u003c/strong> /ˈmænəz/ AmE /ˈmænərz/ [plural; A2]","gloss":"způsoby, společenské chování","example":"I try to show good table manners when I visit someone for dinner."},{"head":"\u003cstrong>stranger\u003c/strong> /ˈstreɪndʒə/ AmE /ˈstreɪndʒər/ [C; B1]","gloss":"cizí člověk, neznámý","example":"I felt nervous about starting a conversation with a stranger on the train."},{"head":"\u003cstrong>pint\u003c/strong> /paɪnt/ [C; slovo k tématu, C1]","gloss":"pinta (jednotka objemu)","example":"I bought a pint of milk for breakfast."},{"head":"\u003cstrong>dessert\u003c/strong> [C or U; A2]","gloss":"dezert, sladký moučník po jídle","example":"I would choose a warm fruit dessert after dinner."},{"head":"\u003cstrong>behave\u003c/strong> /bɪˈheɪv/ (verb; A2)","gloss":"chovat se, jednat určitým způsobem","example":"I try to behave politely when I visit someone for the first time."}],"answer":["In England, I would be \u003cstrong>polite\u003c/strong> and say \"please\" and \"thank you\". I would join the back of a \u003cstrong>queue\u003c/strong> and wait for my turn. Good \u003cstrong>manners\u003c/strong> matter when I meet a \u003cstrong>stranger\u003c/strong>, and I would try to think about other people's feelings. For breakfast, I might buy a \u003cstrong>pint\u003c/strong> of milk. I would enjoy afternoon tea with sandwiches and cakes. I would not expect everyone to follow this tradition daily. I would like to try a warm fruit \u003cstrong>dessert\u003c/strong>."],"questions":[{"cat":"","text":"\u003cstrong>How might your weekday routine change if you studied in England?\u003c/strong> \u003cem>(travel to school, meal times, homework and meeting new friends)\u003c/em>"},{"cat":"","text":"\u003cstrong>What advice about being polite would you give a visitor to England?\u003c/strong> \u003cem>(waiting your turn, please and thank you, comparing with Czech habits, personal experience and individual differences)\u003c/em>"},{"cat":"","text":"\u003cstrong>Which English traditions or leisure activities would you like to try?\u003c/strong> \u003cem>(afternoon tea, visiting a garden, watching a comedy or joining a pub quiz; your reasons)\u003c/em>"}],"phrases":[]},"codes":["SSO 5"],"groups":["sso"],"rank":{"sso":10,"all":10}},{"file":"tema-o6-c16b-canada.md","title":"Canada","label":"Navrhla AI, schválil učitel (7. 11. 2026).","vocab":[{"head":"\u003cstrong>waterfall\u003c/strong> /ˈwɔːtəfɔːl/ AmE /ˈwɔːtərfɔːl/ [C; B1]","gloss":"vodopád","example":"I would love to take a boat trip near a huge waterfall."},{"head":"\u003cstrong>freezing\u003c/strong> /ˈfriːzɪŋ/ (adjective; B1)","gloss":"mrazivý, ledový","example":"I would need warm boots for freezing winter mornings."},{"head":"\u003cstrong>parliament\u003c/strong> /ˈpɑːləmənt/ AmE /ˈpɑːrləmənt/ [C/U; B2]","gloss":"parlament, zákonodárný sbor","example":"Members of parliament meet in Ottawa to debate new federal laws."},{"head":"\u003cstrong>immigration\u003c/strong> /ˌɪmɪˈɡreɪʃn/ [U; B2]","gloss":"přistěhovalectví, imigrace","example":"Our class discussed how immigration can change a country's population."},{"head":"\u003cstrong>bay\u003c/strong> /beɪ/ [C; B1]","gloss":"zátoka, mořský záliv","example":"Fishing boats shelter in a quiet bay along the Atlantic coast."},{"head":"\u003cstrong>valley\u003c/strong> /ˈvæli/ [C; B1]","gloss":"údolí","example":"A scenic railway line runs through a green valley between the mountains."},{"head":"\u003cstrong>port\u003c/strong> /pɔːt/ AmE /pɔːrt/ [C; B1]","gloss":"přístavní město, přístav","example":"A busy port connects local businesses with foreign markets."},{"head":"\u003cstrong>export\u003c/strong> /ɪkˈspɔːt/ AmE /ɪkˈspɔːrt/ (verb; B2)","gloss":"vyvážet (zboží do zahraničí)","example":"Some companies export food to customers overseas."},{"head":"\u003cstrong>citizen\u003c/strong> /ˈsɪtɪzn/ [C; B2]","gloss":"občan, státní příslušník","example":"Each citizen has rights and responsibilities."},{"head":"\u003cstrong>govern\u003c/strong> /ˈɡʌvn/ AmE /ˈɡʌvərn/ (verb; B2)","gloss":"vládnout čemu, spravovat co (zemi či oblast)","example":"The federal cabinet and provincial leaders govern different areas of public life."},{"head":"\u003cstrong>harvest\u003c/strong> /ˈhɑːvɪst/ AmE /ˈhɑːrvɪst/ [C/U; B2]","gloss":"sklizeň (sklízení plodin)","example":"Heavy rain delayed the harvest this year."},{"head":"\u003cstrong>symbol\u003c/strong> /ˈsɪmbl/ [C; B2]","gloss":"symbol, znak","example":"The red maple leaf is a symbol of Canada."},{"head":"\u003cstrong>attract\u003c/strong> /əˈtrækt/ (verb; B1)","gloss":"přitahovat, lákat","example":"Clean lakes and mountain trails attract hikers from all over the world."},{"head":"\u003cstrong>trade\u003c/strong> /treɪd/ [U; B1]","gloss":"obchod (zejména mezinárodní směna zboží a služeb)","example":"Our course includes lessons about international trade."},{"head":"\u003cstrong>agriculture\u003c/strong> /ˈæɡrɪkʌltʃə/ AmE /ˈæɡrɪkʌltʃər/ [U; B2]","gloss":"zemědělství","example":"Our project explores the role of agriculture in rural communities."},{"head":"\u003cstrong>population\u003c/strong> /ˌpɒpjuˈleɪʃn/ AmE /ˌpɑːpjuˈleɪʃn/ [C; B1]","gloss":"obyvatelstvo, populace","example":"A city's population can grow when new workers move there."},{"head":"\u003cstrong>minister\u003c/strong> /ˈmɪnɪstə(r)/ AmE /ˈmɪnɪstər/ [C; B2]","gloss":"ministr, člen vlády","example":"The health minister announced plans for new hospitals."},{"head":"\u003cstrong>election\u003c/strong> /ɪˈlekʃn/ [C/U; B1]","gloss":"volby, volba","example":"Voters chose a new government in the federal election."},{"head":"\u003cstrong>explore\u003c/strong> /ɪkˈsplɔː(r)/ AmE /ɪkˈsplɔːr/ (verb; B1)","gloss":"prozkoumat, poznávat (místo či oblast)","example":"I would like to explore the western national parks."},{"head":"\u003cstrong>preserve\u003c/strong> /prɪˈzɜːv/ AmE /prɪˈzɜːrv/ (verb; B2)","gloss":"uchovat, chránit (před poškozením nebo zánikem)","example":"Strict park rules help preserve untouched nature for future generations."},{"head":"\u003cstrong>northern\u003c/strong> /ˈnɔːðən/ AmE /ˈnɔːrðərn/ (adjective; B1)","gloss":"severní","example":"Our hotel is in the northern part of the town."},{"head":"\u003cstrong>coastal\u003c/strong> /ˈkəʊstl/ AmE /ˈkoʊstl/ (adjective; B2)","gloss":"pobřežní","example":"Small coastal towns can be pleasant stops on a road trip."},{"head":"\u003cstrong>wheat\u003c/strong> /wiːt/ [U; B2]","gloss":"pšenice","example":"Farmers use machines to harvest wheat from the fields."},{"head":"\u003cstrong>whale\u003c/strong> /weɪl/ [C; B1]","gloss":"velryba","example":"Visitors on boat tours often spot a whale near the ocean shore."}],"answer":["Canada is the second-largest country in the world by total area, covering nearly ten million square kilometres. Its estimated \u003cstrong>population\u003c/strong> was about 41.8 million on 1 July 2026. As a student in České Budějovice, I am interested in its towns, countryside and working life. I would compare its population distribution with that of the Czech Republic. I dislike \u003cstrong>freezing\u003c/strong> weather, so I would check the forecast before choosing my travel dates.","Canada is a federation of ten provinces and three territories. It is a constitutional monarchy and parliamentary democracy. In November 2026, King Charles III is the head of state and Mark Carney is prime minister. Elected representatives sit in the federal \u003cstrong>parliament\u003c/strong> in the capital, Ottawa. English and French are official languages at the federal level. I would like to learn how \u003cstrong>immigration\u003c/strong> shapes everyday life and what becoming a Canadian \u003cstrong>citizen\u003c/strong> means. The national flag, introduced in 1965, features a red maple leaf, an important Canadian \u003cstrong>symbol\u003c/strong>.","For a school project, I would compare Canadian and Czech \u003cstrong>agriculture\u003c/strong> and look at how international \u003cstrong>trade\u003c/strong> connects producers with customers. I could follow \u003cstrong>wheat\u003c/strong> from the harvest to a shop. Quebec produces maple syrup, which I would enjoy tasting during a visit. I would also like to see Niagara Falls and stand close to a huge \u003cstrong>waterfall\u003c/strong>. Another choice would be Banff National Park, with its mountains and lakes. I would rather explore a few places properly than spend my whole holiday travelling between them.","\u003cem>Varianta SSO: „As a business-school student…“; varianta SŠ CR: „As a tourism-school student…“.\u003c/em>"],"answer_info":"","questions":[{"cat":"","text":"How would you introduce Canada's geography and political system to a Czech classmate?"},{"cat":"","text":"What are the main roles of the monarch and the prime minister in Canada's political system?"},{"cat":"","text":"What experience of learning a language or travelling could help you during a stay in Canada?"},{"cat":"","text":"Which Canadian cities or natural sights would you recommend to a Czech tourist, and why?"},{"cat":"","text":"How does life in a large Canadian city like Toronto differ from life in the northern territories?"},{"cat":"","text":"What makes Canada an attractive destination for people who enjoy outdoor activities?"},{"cat":"","text":"If you could spend a summer working or studying in Canada, which province would you choose and what would you do there?"}],"phrases":[{"head":"\u003cstrong>In terms of total area, Canada is...\u003c/strong>","gloss":"Co se týče celkové rozlohy, Kanada je...","note":""},{"head":"\u003cstrong>The vast majority of people live...\u003c/strong>","gloss":"Naprostá většina obyvatel žije...","note":""},{"head":"\u003cstrong>At the federal level, the country is...\u003c/strong>","gloss":"Na federální úrovni je země...","note":""},{"head":"\u003cstrong>The economy relies heavily on...\u003c/strong>","gloss":"Ekonomika se výrazně opírá o...","note":""},{"head":"\u003cstrong>One place well worth visiting is...\u003c/strong>","gloss":"Jedním z míst, která rozhodně stojí za návštěvu, je...","note":""},{"head":"\u003cstrong>Compared with Central Europe, distances in Canada are...\u003c/strong>","gloss":"Ve srovnání se střední Evropou jsou vzdálenosti v Kanadě...","note":""},{"head":"\u003cstrong>If I had the chance to travel to Canada, I would...\u003c/strong>","gloss":"Kdybych měl/a možnost cestovat do Kanady, ...","note":""}],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>waterfall\u003c/strong> /ˈwɔːtəfɔːl/ AmE /ˈwɔːtərfɔːl/ [C; B1]","gloss":"vodopád","example":"I would love to take a boat trip near a huge waterfall."},{"head":"\u003cstrong>freezing\u003c/strong> /ˈfriːzɪŋ/ (adjective; B1)","gloss":"mrazivý, ledový","example":"I would need warm boots for freezing winter mornings."},{"head":"\u003cstrong>parliament\u003c/strong> /ˈpɑːləmənt/ AmE /ˈpɑːrləmənt/ [C/U; slovo k tématu, B2]","gloss":"parlament, zákonodárný sbor","example":"Members of parliament meet in Ottawa to discuss new laws."},{"head":"\u003cstrong>immigration\u003c/strong> /ˌɪmɪˈɡreɪʃn/ [U; slovo k tématu, B2]","gloss":"přistěhovalectví, imigrace","example":"Our class discussed how immigration can change a country's population."},{"head":"\u003cstrong>valley\u003c/strong> /ˈvæli/ [C; A2]","gloss":"údolí","example":"A railway line runs through a green valley between the mountains."},{"head":"\u003cstrong>port\u003c/strong> /pɔːt/ AmE /pɔːrt/ [C; B1]","gloss":"přístavní město, přístav","example":"A busy port connects local businesses with foreign markets."},{"head":"\u003cstrong>export\u003c/strong> /ɪkˈspɔːt/ AmE /ɪkˈspɔːrt/ (verb; B1)","gloss":"vyvážet (zboží do zahraničí)","example":"Some companies export food to customers in other countries."},{"head":"\u003cstrong>citizen\u003c/strong> /ˈsɪtɪzn/ [C; slovo k tématu, B2]","gloss":"občan, státní příslušník","example":"Each citizen has rights and responsibilities."},{"head":"\u003cstrong>symbol\u003c/strong> /ˈsɪmbl/ [C; A2]","gloss":"symbol, znak","example":"The red leaf on the flag is a symbol of Canada."},{"head":"\u003cstrong>attract\u003c/strong> /əˈtrækt/ (verb; B1)","gloss":"přitahovat, lákat","example":"Clean lakes and mountain paths attract people who love hiking from all over the world."},{"head":"\u003cstrong>trade\u003c/strong> /treɪd/ [U; B1]","gloss":"obchod (zejména mezinárodní směna zboží a služeb)","example":"Our course includes lessons about international trade."},{"head":"\u003cstrong>farming\u003c/strong> [U; A2]","gloss":"zemědělství","example":"Our project looks at farming's role in communities in the countryside."},{"head":"\u003cstrong>population\u003c/strong> /ˌpɒpjuˈleɪʃn/ AmE /ˌpɑːpjuˈleɪʃn/ [C; A2]","gloss":"obyvatelstvo, populace","example":"A city's population can grow when new workers move there."},{"head":"\u003cstrong>election\u003c/strong> /ɪˈlekʃn/ [C/U; B1]","gloss":"volby, volba","example":"Voters chose a new government in the election."},{"head":"\u003cstrong>explore\u003c/strong> /ɪkˈsplɔː(r)/ AmE /ɪkˈsplɔːr/ (verb; B1)","gloss":"prozkoumat, poznávat (místo či oblast)","example":"I would like to explore the western national parks."},{"head":"\u003cstrong>protect\u003c/strong> (verb; A2)","gloss":"chránit (před poškozením nebo zánikem)","example":"Park rules help protect nature for future generations."},{"head":"\u003cstrong>northern\u003c/strong> /ˈnɔːðən/ AmE /ˈnɔːrðərn/ (adjective; B1)","gloss":"severní","example":"Our hotel is in the northern part of the town."},{"head":"\u003cstrong>coast\u003c/strong> [C; A2]","gloss":"pobřeží","example":"Towns on the coast can be pleasant stops on a road trip."},{"head":"\u003cstrong>whale\u003c/strong> /weɪl/ [C; A2]","gloss":"velryba","example":"Visitors on boat tours often see a whale near the coast."}],"answer":["Canada is the second-largest country in the world by total area. Its area is nearly ten million square kilometres. Its \u003cstrong>population\u003c/strong> was about 41.8 million on 1 July 2026. As a student in České Budějovice, I am interested in its towns, countryside and working life. I dislike \u003cstrong>freezing\u003c/strong> weather, so I would check the weather before choosing my travel dates.","Canada has ten provinces and three territories. In November 2026, King Charles III is the head of state and Mark Carney is prime minister. Members of \u003cstrong>parliament\u003c/strong> are chosen in an \u003cstrong>election\u003c/strong>, and they meet in the capital, Ottawa. English and French are official languages at the national level. I would like to learn how \u003cstrong>immigration\u003c/strong> influences everyday life and what it means to become a Canadian \u003cstrong>citizen\u003c/strong>. The national flag from 1965 has a red maple leaf, an important Canadian \u003cstrong>symbol\u003c/strong>.","For a school project, I would compare Canadian and Czech \u003cstrong>farming\u003c/strong>. I would also look at how international \u003cstrong>trade\u003c/strong> connects producers with customers. I would like to see Niagara Falls and stand close to a huge \u003cstrong>waterfall\u003c/strong>. I would rather \u003cstrong>explore\u003c/strong> a few places properly than travel between them for my whole holiday.","\u003cem>Varianta SSO: „As a business-school student…“; varianta SŠ CR: „As a tourism-school student…“.\u003c/em>"],"questions":[{"cat":"","text":"How would you introduce Canada's geography and political system to a Czech classmate?"},{"cat":"","text":"What are the main roles of the King and the prime minister in Canada?"},{"cat":"","text":"What experience of learning a language or travelling could help you in Canada?"},{"cat":"","text":"Which Canadian cities or natural sights would you recommend to a Czech tourist? \u003cem>(your reasons)\u003c/em>"},{"cat":"","text":"How is life in cities like Toronto different from life in the northern territories?"},{"cat":"","text":"What makes Canada an attractive destination for people who enjoy outdoor activities?"},{"cat":"","text":"If you could work or study in Canada one summer, which province would you choose? \u003cem>(what you would do there)\u003c/em>"}],"phrases":[{"head":"\u003cstrong>By total area, Canada is...\u003c/strong>","gloss":"Podle celkové rozlohy je Kanada...","note":""},{"head":"\u003cstrong>Most people live...\u003c/strong>","gloss":"Většina obyvatel žije...","note":""},{"head":"\u003cstrong>At the national level, the country is...\u003c/strong>","gloss":"Na celostátní úrovni je země...","note":""},{"head":"\u003cstrong>The economy depends a lot on...\u003c/strong>","gloss":"Ekonomika do velké míry závisí na...","note":""},{"head":"\u003cstrong>One place well worth visiting is...\u003c/strong>","gloss":"Jedním z míst, která rozhodně stojí za návštěvu, je...","note":""},{"head":"\u003cstrong>In comparison with Central Europe, distances in Canada are...\u003c/strong>","gloss":"Ve srovnání se střední Evropou jsou vzdálenosti v Kanadě...","note":""},{"head":"\u003cstrong>If I had the chance to travel to Canada, I would...\u003c/strong>","gloss":"Kdybych měl/a možnost cestovat do Kanady, ...","note":""}]},"codes":["SSO 6","CR 16b"],"groups":["cr","sso"],"rank":{"cr":33,"sso":12,"all":12}},{"file":"tema-s20-education-school-system-learning.md","title":"Education, school system, learning","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu.","vocab":[{"head":"\u003cstrong>grammar school\u003c/strong> /ˈɡræmə skuːl/ AmE /ˈɡræmər skuːl/ [C]","gloss":"gymnázium (POZOR: slovo \u003cem>gymnasium\u003c/em> znamená v angličtině tělocvičnu!)","example":"After finishing primary education, ambitious pupils often apply to an eight-year or four-year grammar school."},{"head":"\u003cstrong>compulsory education\u003c/strong> (compulsory /kəmˈpʌlsəri/) [U]","gloss":"povinné vzdělávání (v ČR zahrnuje devět let povinné školní docházky a jeden povinný předškolní rok)","example":"In the Czech Republic, compulsory education consists of nine years of compulsory schooling alongside one mandatory preschool year."},{"head":"\u003cstrong>school-leaving examination\u003c/strong> (examination /ɪɡˌzæmɪˈneɪʃn/) [C]","gloss":"maturitní zkouška (často označovaná jako \u003cem>maturita exam\u003c/em>)","example":"Passing the school-leaving examination is the standard requirement for entering most university degree programmes."},{"head":"\u003cstrong>curriculum\u003c/strong> /kəˈrɪkjələm/ [C, plural curricula]","gloss":"vzdělávací program, školní vzdělávací plán (dřívější termín: školní osnovy)","example":"The modern school curriculum places greater emphasis on foreign languages and digital literacy."},{"head":"\u003cstrong>vocational school\u003c/strong> /vəʊˈkeɪʃənl skuːl/ [C]","gloss":"odborné učiliště, střední odborná škola","example":"Students who prefer practical trades like carpentry or mechanics typically choose a vocational school."},{"head":"\u003cstrong>higher education\u003c/strong> /ˌhaɪər edʒuˈkeɪʃn/ [U]","gloss":"vysokoškolské vzdělávání","example":"Enrolling in higher education opens up opportunities to pursue specialized research and academic professions."},{"head":"\u003cstrong>tuition fees\u003c/strong> (tuition /tjuˈɪʃn/ AmE /tuˈɪʃn/) [plural]","gloss":"školné","example":"Unlike many English and American universities that charge high tuition fees, Czech public universities provide degree programmes taught in Czech free of charge within the standard length of study."},{"head":"\u003cstrong>state school\u003c/strong> /ˈsteɪt skuːl/ [C]","gloss":"státní škola (bezplatná veřejná škola)","example":"The vast majority of Czech students attend a state school funded by the government."},{"head":"\u003cstrong>public school\u003c/strong> /ˌpʌblɪk ˈskuːl/ [C]","gloss":"prestižní soukromá škola (v britském systému, např. Eton či Harrow)","example":"In Britain, confusingly, an elite fee-paying independent boarding school is historically called a public school."},{"head":"\u003cstrong>critical thinking\u003c/strong> /ˌkrɪtɪkl ˈθɪŋkɪŋ/ [U]","gloss":"kritické myšlení","example":"Modern teachers strive to teach critical thinking rather than simply forcing students to memorize facts."},{"head":"\u003cstrong>rote learning\u003c/strong> (rote /rəʊt/) [U]","gloss":"biflování, mechanické učení nazpaměť","example":"Relying on rote learning means you quickly forget the information right after taking the test."},{"head":"\u003cstrong>extracurricular activities\u003c/strong> (extracurricular /ˌekstrəkəˈrɪkjələ(r)/ AmE /ˌekstrəkəˈrɪkjələr/) [plural]","gloss":"mimoškolní aktivity, kroužky (pomnožné: \u003cem>activities are...\u003c/em>)","example":"Participating in extracurricular activities, like debating clubs or school choir, builds social skills."},{"head":"\u003cstrong>cram for an exam\u003c/strong> (cram /kræm/) (informal phrase)","gloss":"šprtat se na zkoušku (na poslední chvíli)","example":"Staying up all night to cram for an exam rarely leads to good long-term understanding."},{"head":"\u003cstrong>continuous assessment\u003c/strong> /kənˌtɪnjuəs əˈsesmənt/ [U]","gloss":"průběžné hodnocení (známkování v průběhu celého roku)","example":"Many educational systems combine final tests with continuous assessment based on essays and presentations."},{"head":"\u003cstrong>degree\u003c/strong> /dɪˈɡriː/ [C]","gloss":"vysokoškolský titul, akademický diplom","example":"Graduating with a master's degree typically requires submitting a detailed thesis and defending it before a committee."},{"head":"\u003cstrong>revise for\u003c/strong> (revise /rɪˈvaɪz/) (verb)","gloss":"opakovat si na (zkoušku nebo test)","example":"I have created a daily study schedule to revise for my upcoming maturita tests."},{"head":"\u003cstrong>attendance\u003c/strong> /əˈtendəns/ [U]","gloss":"školní docházka","example":"Secondary students must maintain minimum attendance to be admitted to final examinations."},{"head":"\u003cstrong>headteacher / principal\u003c/strong> (headteacher /ˌhedˈtiːtʃə/ AmE /ˌhedˈtiːtʃər/) [C]","gloss":"ředitel / ředitelka školy","example":"The headteacher delivered an inspiring opening speech at the beginning of the academic year."},{"head":"\u003cstrong>specialise in\u003c/strong> (verb)","gloss":"specializovat se na","example":"In their final two years, students can choose optional seminars to specialise in biology or humanities."},{"head":"\u003cstrong>academic achievement\u003c/strong> [C/U]","gloss":"studijní výsledky / úspěchy (průběžný prospěch a známky jsou spíše \u003cem>marks / grades\u003c/em>)","example":"The school awards book prizes to pupils with outstanding academic achievement."},{"head":"\u003cstrong>peer learning\u003c/strong> (peer /pɪə(r)/ AmE /pɪr/) [U]","gloss":"vzájemné učení mezi vrstevníky / spolužáky","example":"Studying in small groups promotes peer learning, as classmates explain difficult problems to one another."},{"head":"\u003cstrong>state-funded\u003c/strong> (adjective)","gloss":"financovaný státem","example":"Our grammar school is a state-funded institution that offers free quality education."}],"answer":["School and education take up a huge part of our everyday lives. As a student in my final year at a \u003cstrong>grammar school\u003c/strong> in České Budějovice, I have experienced the Czech education system firsthand. In our country, \u003cstrong>compulsory education\u003c/strong> covers nine years of compulsory schooling alongside one mandatory preschool year. After completing basic education, teenagers choose their path: some opt for practical training at a \u003cstrong>vocational school\u003c/strong>, while others choose secondary technical schools or academically demanding grammar schools.","Right now, my classmates and I are focused on preparing for the \u003cstrong>school-leaving examination\u003c/strong>, commonly known as the maturita. It is a major milestone that tests our knowledge of Czech, foreign languages, and chosen specialized subjects. Success in these exams is the essential prerequisite for most students wishing to enter \u003cstrong>higher education\u003c/strong>. One great advantage of the Czech system compared to many English-speaking countries—such as England or the United States—is that public universities do not charge \u003cstrong>tuition fees\u003c/strong> for degree programmes taught in Czech within the standard length of study, which allows students from diverse backgrounds to earn a \u003cstrong>degree\u003c/strong>.","How we learn is just as important as what we learn. In the past, schools often emphasized \u003cstrong>rote learning\u003c/strong>, expecting students to memorize dates and formulas. Today, there is a welcome shift towards teaching \u003cstrong>critical thinking\u003c/strong>, media literacy, and practical problem-solving. Outside regular lessons, taking part in \u003cstrong>extracurricular activities\u003c/strong> like sports or language clubs helps us build teamwork and friendships. In short, a good school should not just test our memory; it should inspire curiosity and prepare young people for real adult life."],"answer_info":"","questions":[{"cat":"Popis","text":"How is the Czech educational system structured from nursery school up to university level?"},{"cat":"Srovnání","text":"In what ways do British secondary schools differ from Czech grammar schools in terms of exams and subject choices?"},{"cat":"Zkušenost","text":"What study methods work best for you when you revise for a demanding school test?"},{"cat":"Názor","text":"Why is critical thinking becoming more important in schools than memorizing factual information?"},{"cat":"Popis","text":"What is the British distinction between a state school and a historic public school?"},{"cat":"Hypotéza","text":"If you had the authority to change three things about secondary school curricula in the Czech Republic, what would you reform?"},{"cat":"Názor","text":"What are the strongest arguments for and against charging university tuition fees?"}],"phrases":[{"head":"\u003cstrong>When looking at our school system,...\u003c/strong>","gloss":"Když se podíváme na náš školní systém,...","note":"úvod k tématu"},{"head":"\u003cstrong>A crucial turning point for students is...\u003c/strong>","gloss":"Zásadním zlomovým bodem pro studenty je...","note":"vyzdvižení klíčového momentu"},{"head":"\u003cstrong>Unlike traditional rote learning,...\u003c/strong>","gloss":"Na rozdíl od tradičního biflování...","note":"kontrast výukových metod"},{"head":"\u003cstrong>One of the greatest benefits of our system is that...\u003c/strong>","gloss":"Jednou z největších výhod našeho systému je, že...","note":"vyzdvižení kladu"},{"head":"\u003cstrong>From a student's point of view,...\u003c/strong>","gloss":"Z pohledu studenta...","note":"osobní perspektiva"},{"head":"\u003cstrong>It is essential to find a balance between...\u003c/strong>","gloss":"Je zásadní najít rovnováhu mezi...","note":"vyvážení teorie a praxe"},{"head":"\u003cstrong>To sum up, the primary purpose of education should be...\u003c/strong>","gloss":"Abych to shrnul, hlavním smyslem vzdělávání by mělo být...","note":"závěrečná myšlenka"}],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>grammar school\u003c/strong> /ˈɡræmə skuːl/ AmE /ˈɡræmər skuːl/ [C; slovo k tématu, C1]","gloss":"gymnázium (POZOR: slovo \u003cem>gymnasium\u003c/em> znamená v angličtině tělocvičnu!)","example":"After finishing primary education, ambitious students often apply to an eight-year or four-year grammar school."},{"head":"\u003cstrong>school-leaving exam\u003c/strong> (noun phrase; A1)","gloss":"maturitní zkouška (často označovaná jako \u003cem>maturita exam\u003c/em>)","example":"For most university programmes, you need to pass the school-leaving exam."},{"head":"\u003cstrong>higher education\u003c/strong> /ˌhaɪər edʒuˈkeɪʃn/ [U; B1]","gloss":"vysokoškolské vzdělávání","example":"Higher education gives students the chance to do research and have academic careers."},{"head":"\u003cstrong>state school\u003c/strong> /ˈsteɪt skuːl/ [C; slovo k tématu, B2]","gloss":"státní škola (bezplatná veřejná škola)","example":"Most Czech students go to a state school that the government pays for."},{"head":"\u003cstrong>public school\u003c/strong> /ˌpʌblɪk ˈskuːl/ [C; slovo k tématu, C1]","gloss":"prestižní soukromá škola (v britském systému, např. Eton či Harrow)","example":"In Britain, a top private school where students also live is called a public school."},{"head":"\u003cstrong>critical thinking\u003c/strong> /ˌkrɪtɪkl ˈθɪŋkɪŋ/ [U; slovo k tématu, bez úrovně]","gloss":"kritické myšlení","example":"Modern teachers try to teach critical thinking rather than just forcing students to memorize facts."},{"head":"\u003cstrong>memorize\u003c/strong> (verb; B1)","gloss":"učit se nazpaměť, zapamatovat si","example":"If you only memorize information, you quickly forget it after the test."},{"head":"\u003cstrong>after-school activities\u003c/strong> (noun; B1 + A1)","gloss":"mimoškolní aktivity, kroužky (pomnožné: \u003cem>activities are...\u003c/em>)","example":"Taking part in after-school activities builds social skills."},{"head":"\u003cstrong>degree\u003c/strong> /dɪˈɡriː/ [C; A2]","gloss":"vysokoškolský titul, akademický diplom","example":"Students usually have to write a long piece of work before they get a second university degree."},{"head":"\u003cstrong>revise for\u003c/strong> (revise /rɪˈvaɪz/) (verb; B1)","gloss":"opakovat si na (zkoušku nebo test)","example":"I have created a daily study schedule to revise for my maturita tests."},{"head":"\u003cstrong>headteacher\u003c/strong> (headteacher /ˌhedˈtiːtʃə/ AmE /ˌhedˈtiːtʃər/) [C; A2]","gloss":"ředitel / ředitelka školy","example":"The headteacher gave a speech at the beginning of the school year."},{"head":"\u003cstrong>focus on\u003c/strong> (verb; A2)","gloss":"specializovat se na, zaměřit se na","example":"In their final two years, students can focus on biology."},{"head":"\u003cstrong>academic achievement\u003c/strong> [C/U; B1]","gloss":"studijní výsledky / úspěchy (průběžný prospěch a známky jsou spíše \u003cem>marks / grades\u003c/em>)","example":"The school gives book prizes to students with excellent academic achievement."}],"answer":["I am a student in my final year at a \u003cstrong>grammar school\u003c/strong> in České Budějovice. In our country, children must go to school for nine years. They must also have one year of education before primary school. After basic education, teenagers decide what to do next. Some go to a school where they get practical training for a job. Others choose secondary schools with technical subjects or difficult academic \u003cstrong>grammar schools\u003c/strong>.","We are preparing for the \u003cstrong>school-leaving exam\u003c/strong>, which people usually call the maturita. It tests our knowledge of Czech, foreign languages and subjects that we choose. Most students must pass these exams before they can start \u003cstrong>higher education\u003c/strong>. Czech public universities do not charge students for programmes in Czech within the standard length of study. This is a great advantage over many English-speaking countries, such as England or the United States. So students from all kinds of backgrounds can get a \u003cstrong>degree\u003c/strong>.","In the past, schools often expected students to \u003cstrong>memorize\u003c/strong> dates. Today, there is a welcome change: schools teach more \u003cstrong>critical thinking\u003c/strong>, understanding of the media and solving practical problems. A good school should make us want to know more and prepare young people for real adult life."],"questions":[{"cat":"Popis","text":"How is the Czech education system organized, from schools for small children up to university?"},{"cat":"Srovnání","text":"How are British secondary schools different from Czech grammar schools? \u003cem>(exams and choosing subjects)\u003c/em>"},{"cat":"Zkušenost","text":"What study methods work best for you when you revise for a difficult school test?"},{"cat":"Názor","text":"Why is critical thinking becoming more important in schools than memorizing facts?"},{"cat":"Popis","text":"What is the difference between a British state school and a historic public school?"},{"cat":"Hypotéza","text":"What three things would you change about what Czech secondary schools teach?"},{"cat":"Názor","text":"What are the strongest arguments for and against making students pay for university?"}],"phrases":[{"head":"\u003cstrong>When we look at our school system,...\u003c/strong>","gloss":"Když se podíváme na náš školní systém,...","note":"úvod k tématu"},{"head":"\u003cstrong>A very important moment of change for students is...\u003c/strong>","gloss":"Velmi důležitým okamžikem změny pro studenty je...","note":"vyzdvižení klíčového momentu"},{"head":"\u003cstrong>Unlike the traditional way of memorizing facts,...\u003c/strong>","gloss":"Na rozdíl od tradičního biflování...","note":"kontrast výukových metod"},{"head":"\u003cstrong>One of the greatest benefits of our system is that...\u003c/strong>","gloss":"Jednou z největších výhod našeho systému je, že...","note":"vyzdvižení kladu"},{"head":"\u003cstrong>From a student's point of view,...\u003c/strong>","gloss":"Z pohledu studenta...","note":"osobní perspektiva"},{"head":"\u003cstrong>It is essential to find a balance between...\u003c/strong>","gloss":"Je zásadní najít rovnováhu mezi...","note":"vyvážení teorie a praxe"},{"head":"\u003cstrong>In conclusion, the main purpose of education should be...\u003c/strong>","gloss":"Závěrem: hlavním smyslem vzdělávání by mělo být...","note":"závěrečná myšlenka"}]},"codes":["SSO 7","CR 5a"],"groups":["cr","sso"],"rank":{"cr":10,"sso":14,"all":10.5}},{"file":"doplnek-o7-education-systems.md","title":"Doplněk O7: Our school; education in England and the USA","label":"Navrhla AI, schválil učitel (7. 11. 2026).","vocab":[{"head":"\u003cstrong>economics\u003c/strong> /ˌiːkəˈnɒmɪks/ AmE /ˌiːkəˈnɑːmɪks/ (noun [U]; B1)","gloss":"ekonomie, nauka o fungování hospodářství","example":"I would like to study economics to understand how prices change."},{"head":"\u003cstrong>marketing\u003c/strong> /ˈmɑːkɪtɪŋ/ AmE /ˈmɑːrkɪtɪŋ/ (noun [U]; B2)","gloss":"marketing, činnost podporující prodej výrobků či služeb","example":"Good marketing helps a small company reach new customers."},{"head":"\u003cstrong>finance\u003c/strong> /ˈfaɪnæns/ (noun [U]; B2)","gloss":"finance, správa a zajišťování peněžních prostředků","example":"The course introduces finance through simple examples of company spending."},{"head":"\u003cstrong>management\u003c/strong> /ˈmænɪdʒmənt/ (noun [U]; B2)","gloss":"řízení a organizování podniku nebo činnosti","example":"Careful management can keep a project on schedule."},{"head":"\u003cstrong>certificate\u003c/strong> /səˈtɪfɪkət/ AmE /sərˈtɪfɪkət/ (noun [C]; B1)","gloss":"osvědčení získané po úspěšném složení zkoušky","example":"I hope to receive a language certificate after the exam."},{"head":"\u003cstrong>grade\u003c/strong> /ɡreɪd/ (noun [C]; B1)","gloss":"známka, hodnocení školní práce","example":"I was pleased with the grade I received for my essay."},{"head":"\u003cstrong>campus\u003c/strong> /ˈkæmpəs/ (noun [C or U]; B2)","gloss":"areál vysoké školy","example":"I would like to visit the campus before choosing a university."},{"head":"\u003cstrong>academic\u003c/strong> /ˌækəˈdemɪk/ (adjective; B2)","gloss":"studijní, související se vzděláváním a teoretickým studiem","example":"I want to combine academic study with practical experience."}],"answer":["I study at a business school in České Budějovice. I want to understand \u003cstrong>economics\u003c/strong>, \u003cstrong>finance\u003c/strong>, \u003cstrong>marketing\u003c/strong> and \u003cstrong>management\u003c/strong>, not just get a good \u003cstrong>grade\u003c/strong>. In England, pupils usually take GCSEs at around sixteen. They must then continue education or training until eighteen; \u003cstrong>academic\u003c/strong> A-levels are one option. American pupils generally progress through elementary, middle and high school. They complete required courses for a high-school diploma; requirements differ by state. I would compare both routes with our maturita before choosing further study. Later, I might visit a university \u003cstrong>campus\u003c/strong> and compare courses. A language \u003cstrong>certificate\u003c/strong> could help me show my skills."],"answer_info":"","questions":[{"cat":"","text":"How do the subjects in your own programme prepare you for work or further study? \u003cem>Nápověda: Uveď ověřené předměty svého oboru a vlastní příklad jejich použití.\u003c/em>"},{"cat":"","text":"How would you compare the Czech secondary-school route with GCSEs and A-levels in England? \u003cem>Nápověda: Navazuj na český systém ze s20; A-levels jsou jednou z možností, nikoli povinnou cestou všech žáků.\u003c/em>"},{"cat":"","text":"How would you compare the requirements for an American high-school diploma with the maturita? \u003cem>Nápověda: Povinné předměty, průběžné výsledky a závěrečné hodnocení; požadavky na americký diplom se liší podle státu. Nepředpokládej jednotné přijímací podmínky všech univerzit.\u003c/em>"}],"phrases":[],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>economics\u003c/strong> /ˌiːkəˈnɒmɪks/ AmE /ˌiːkəˈnɑːmɪks/ (noun [U]; slovo k tématu, B2)","gloss":"ekonomie, nauka o fungování hospodářství","example":"I would like to study economics to understand how prices change."},{"head":"\u003cstrong>marketing\u003c/strong> /ˈmɑːkɪtɪŋ/ AmE /ˈmɑːrkɪtɪŋ/ (noun [U]; B1)","gloss":"marketing, činnost podporující prodej výrobků či služeb","example":"Good marketing helps a small company get its message to new customers."},{"head":"\u003cstrong>finance\u003c/strong> /ˈfaɪnæns/ (noun [U]; slovo k tématu, B2)","gloss":"finance, správa a zajišťování peněžních prostředků","example":"The course introduces finance through simple examples of company spending."},{"head":"\u003cstrong>management\u003c/strong> /ˈmænɪdʒmənt/ (noun [U]; B1)","gloss":"řízení a organizování podniku nebo činnosti","example":"Careful management can keep a project on schedule."},{"head":"\u003cstrong>grade\u003c/strong> /ɡreɪd/ (noun [C]; B1)","gloss":"známka, hodnocení školní práce","example":"I was pleased with the grade I received for my essay."},{"head":"\u003cstrong>campus\u003c/strong> /ˈkæmpəs/ (noun [C or U]; B1)","gloss":"areál vysoké školy","example":"I would like to visit the campus before choosing a university."},{"head":"\u003cstrong>academic\u003c/strong> /ˌækəˈdemɪk/ (adjective; B1)","gloss":"studijní, související se vzděláváním a teoretickým studiem","example":"I want to combine academic study with practical experience."},{"head":"\u003cstrong>GCSE\u003c/strong> [vlastní jméno]","gloss":"GCSE (zkouška, kterou žáci v Anglii obvykle skládají kolem šestnácti let)","example":"In England, students usually take GCSEs at around sixteen."},{"head":"\u003cstrong>A-level\u003c/strong> [vlastní jméno]","gloss":"A-level (akademická zkouška, jedna z možností po GCSE do osmnácti let)","example":"Academic A-levels are one option after GCSEs."}],"answer":["I study at a business school in České Budějovice. I want to understand \u003cstrong>economics\u003c/strong>, \u003cstrong>finance\u003c/strong>, \u003cstrong>marketing\u003c/strong> and \u003cstrong>management\u003c/strong>, not just get a good \u003cstrong>grade\u003c/strong>. In England, students usually take \u003cstrong>GCSEs\u003c/strong> at around sixteen. They must then continue education or training until eighteen; \u003cstrong>academic\u003c/strong> \u003cstrong>A-levels\u003c/strong> are one option. American students generally attend elementary, middle and high school. They complete required courses for a high-school diploma; this is different in each state. I would compare both routes with our maturita."],"questions":[{"cat":"","text":"How do the subjects in your own programme prepare you for work or further study? \u003cem>Nápověda: Uveď ověřené předměty svého oboru a vlastní příklad jejich použití.\u003c/em>"},{"cat":"","text":"How would you compare the Czech secondary-school route with GCSEs and A-levels in England? \u003cem>Nápověda: Navazuj na český systém ze s20; A-levels jsou jednou z možností, nikoli povinnou cestou všech žáků.\u003c/em>"},{"cat":"","text":"How would you compare what you need for an American high-school diploma with the maturita? \u003cem>Nápověda: Povinné předměty, průběžné výsledky a závěrečné hodnocení; požadavky na americký diplom se liší podle státu. Nepředpokládej jednotné přijímací podmínky všech univerzit.\u003c/em>"}],"phrases":[]},"codes":["SSO 7"],"groups":["sso"],"rank":{"sso":14,"all":14}},{"file":"tema-3-sports-and-games.md","title":"Sports and games","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu.","vocab":[{"head":"\u003cstrong>athletics\u003c/strong> /æθˈletɪks/ [U]","gloss":"lehká atletika","example":"Athletics includes running, jumping, and throwing disciplines."},{"head":"\u003cstrong>extreme sports\u003c/strong> [plural]","gloss":"extrémní sporty","example":"Rock climbing and white-water kayaking are thrilling forms of extreme sports."},{"head":"\u003cstrong>indoor sports\u003c/strong> [plural]","gloss":"halové / vnitřní sporty","example":"Gymnastics and table tennis are popular indoor sports during winter months."},{"head":"\u003cstrong>spectator sport\u003c/strong> /spekˈteɪtə spɔːt/ AmE /spekˈteɪtər spɔːrt/","gloss":"divácký sport","example":"Ice hockey is widely considered one of the most popular spectator sports in the Czech Republic."},{"head":"\u003cstrong>board games\u003c/strong> [plural]","gloss":"deskové hry","example":"On cold winter evenings, our family often plays strategic board games together."},{"head":"\u003cstrong>rules\u003c/strong> /ruːlz/ [plural]","gloss":"pravidla (hry, sportu)","example":"Before starting a new match, every player must understand the basic rules of the game."},{"head":"\u003cstrong>foul\u003c/strong> /faʊl/","gloss":"faul, nedovolený zákrok","example":"The defender committed an intentional foul to stop the opponent's counter-attack."},{"head":"\u003cstrong>leisure activity\u003c/strong>","gloss":"volnočasová aktivita","example":"Walking the dog or riding a bicycle through the park is an enjoyable leisure activity."},{"head":"\u003cstrong>sedentary lifestyle\u003c/strong> (sedentary /ˈsedntri/ AmE /ˈsednteri/)","gloss":"sedavý způsob života","example":"A sedentary lifestyle increases the risk of back pain and poor physical fitness."},{"head":"\u003cstrong>rivalry\u003c/strong> /ˈraɪvlri/","gloss":"rivalita, soupeření","example":"The traditional rivalry between local football clubs attracts passionate crowds."},{"head":"\u003cstrong>champion\u003c/strong> /ˈtʃæmpiən/","gloss":"šampion, mistr","example":"The Czech tennis player was crowned Wimbledon champion after an intense final."},{"head":"\u003cstrong>take up a sport\u003c/strong> (phrase)","gloss":"začít se věnovat sportu","example":"Doctors often advise teenagers to take up a sport to combat stress."},{"head":"\u003cstrong>competitive\u003c/strong> /kəmˈpetətɪv/","gloss":"soutěživý, soutěžní","example":"School football matches can become very competitive when neighbouring towns play each other."},{"head":"\u003cstrong>amateur\u003c/strong> /ˈæmətə/ AmE /ˈæmətʃər/","gloss":"amatérský / amatér","example":"Unlike professionals, an amateur athlete competes mainly for the love of the game and personal enjoyment."},{"head":"\u003cstrong>fitness tracker\u003c/strong> /ˈfɪtnəs trækə(r)/ AmE /ˈfɪtnəs trækər/","gloss":"chytrý náramek / fitness náramek","example":"Many young people use a fitness tracker to monitor their daily step count and heart rate."},{"head":"\u003cstrong>cheating\u003c/strong> /ˈtʃiːtɪŋ/ [U]","gloss":"podvádění","example":"Any form of cheating ruins the integrity of sport and destroys trust."},{"head":"\u003cstrong>boost\u003c/strong> /buːst/ (verb)","gloss":"posílit, povzbudit","example":"Regular physical exercise helps boost both your immune system and your mood."},{"head":"\u003cstrong>outdoor pursuits\u003c/strong> [plural]","gloss":"venkovní aktivity / koníčky v přírodě","example":"Hiking and cross-country skiing are wonderful outdoor pursuits in the Šumava mountains."},{"head":"\u003cstrong>fan base\u003c/strong> /ˈfæn beɪs/","gloss":"fanouškovská základna","example":"The national hockey team has a remarkably devoted fan base across the country."},{"head":"\u003cstrong>handicap\u003c/strong> /ˈhændikæp/","gloss":"hendikep (vyrovnávací bodové zvýhodnění ve sportu, např. v golfu)","example":"In golf, a player's handicap allows golfers of different ability levels to compete fairly against one another."},{"head":"\u003cstrong>cooperation\u003c/strong> /kəʊˌɒpəˈreɪʃn/ AmE /koʊˌɑːpəˈreɪʃn/ [U]","gloss":"spolupráce","example":"Success in team games relies heavily on mutual communication and cooperation."},{"head":"\u003cstrong>esports\u003c/strong> [plural or U]","gloss":"elektronické sporty, esport","example":"Debates continue over whether competitive video gaming, known as esports, should be classified as real sport."},{"head":"\u003cstrong>physical education (PE)\u003c/strong> (physical education /ˌfɪzɪkl edʒuˈkeɪʃn/) [U]","gloss":"tělesná výchova","example":"At our school, physical education classes take place twice a week."},{"head":"\u003cstrong>adrenaline rush\u003c/strong> (adrenaline /əˈdrenəlɪn/; rush /rʌʃ/)","gloss":"nával adrenalinu","example":"Activities like bungee jumping give participants a powerful adrenaline rush."}],"answer":["Sports and games have played an important role in human society for centuries. From ancient competitions to modern stadium matches, they provide entertainment, keep us healthy, and bring people together. In the Czech Republic, sports culture is exceptionally strong; almost every weekend, thousands of families either head out into nature or gather around television screens to support their favourite teams.","When examining this broad topic, we can distinguish between several categories. First, there are active physical disciplines, ranging from traditional track-and-field \u003cstrong>athletics\u003c/strong> and team sports like football or ice hockey to thrilling \u003cstrong>extreme sports\u003c/strong> that deliver a strong \u003cstrong>adrenaline rush\u003c/strong>. For those who prefer calmer recreation, \u003cstrong>outdoor pursuits\u003c/strong> such as hiking or cross-country skiing in the Šumava mountains offer a wonderful break from daily routine. In school, \u003cstrong>physical education (PE)\u003c/strong> helps us combat the \u003cstrong>sedentary lifestyle\u003c/strong> that so many teenagers struggle with today. Sitting in classrooms all day can drain our energy, whereas running or playing volleyball helps \u003cstrong>boost\u003c/strong> our mood and concentration.","At the same time, the idea of what counts as a sport is constantly changing. In recent years, \u003cstrong>esports\u003c/strong> has grown into a huge global phenomenon with a passionate \u003cstrong>fan base\u003c/strong>, sparking lively discussions about whether gaming belongs alongside traditional physical activities. Meanwhile, classic intellectual games like chess test deep tactical patience, while modern \u003cstrong>board games\u003c/strong> often encourage strategic thinking and social \u003cstrong>cooperation\u003c/strong> without physical strain.","Ultimately, whether you are an ambitious \u003cstrong>amateur\u003c/strong> striving to win, or someone who simply enjoys a relaxing \u003cstrong>leisure activity\u003c/strong> with friends, games and sports teach us essential values. They remind us that following the \u003cstrong>rules\u003c/strong> and avoiding any form of \u003cstrong>cheating\u003c/strong> are necessary principles not only in sport, but in everyday life as well."],"answer_info":"","questions":[{"cat":"Popis","text":"What are the most characteristic differences between physical sports and mental or tabletop games?"},{"cat":"Zkušenost","text":"How has school physical education influenced your personal relationship with sports and regular exercise?"},{"cat":"Názor","text":"Why do you think extreme sports have become increasingly popular among young adults despite the high risk of injury?"},{"cat":"Srovnání","text":"How do sports fans in the Czech Republic differ when supporting ice hockey compared to football?"},{"cat":"Srovnání","text":"In what ways does exercising outdoors in nature benefit human well-being compared to working out in an indoor gym?"},{"cat":"Hypotéza","text":"If competitive esports were officially introduced into the Olympic Games programme, how would the public and traditional sports federations react?"},{"cat":"Názor / návrh","text":"What measures should schools implement to motivate teenagers who tend to avoid physical activity?"}],"phrases":[{"head":"\u003cstrong>Broadly speaking, we can classify...\u003c/strong>","gloss":"Obecně řečeno můžeme klasifikovat...","note":"kategorizace / úvod"},{"head":"\u003cstrong>In contrast to..., which focus on...\u003c/strong>","gloss":"Na rozdíl od..., které se soustředí na...","note":"srovnání"},{"head":"\u003cstrong>A clear illustration of this phenomenon is...\u003c/strong>","gloss":"Jasnou ilustrací tohoto jevu je...","note":"příklad"},{"head":"\u003cstrong>It is often believed that..., but the reality is...\u003c/strong>","gloss":"Často se věří, že..., ale realita je taková, že...","note":"vyvrácení mýtu / kontrast"},{"head":"\u003cstrong>From a psychological standpoint,...\u003c/strong>","gloss":"Z psychologického hlediska...","note":"úhel pohledu"},{"head":"\u003cstrong>This brings me to the point that...\u003c/strong>","gloss":"To mě přivádí k myšlence, že...","note":"přechod mezi myšlenkami"},{"head":"\u003cstrong>To draw a general conclusion,...\u003c/strong>","gloss":"Kdybych měl / měla vyvodit obecný závěr,...","note":"závěr"}],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>athletics\u003c/strong> /æθˈletɪks/ [U; B1]","gloss":"lehká atletika","example":"Athletics includes running, jumping and throwing."},{"head":"\u003cstrong>extreme sports\u003c/strong> [plural; B1]","gloss":"extrémní sporty","example":"Rock climbing and white-water kayaking are exciting forms of extreme sports."},{"head":"\u003cstrong>indoor sports\u003c/strong> [plural; B1]","gloss":"halové / vnitřní sporty","example":"Gymnastics and table tennis are popular indoor sports during winter months."},{"head":"\u003cstrong>board games\u003c/strong> [plural; A2]","gloss":"deskové hry","example":"On cold winter evenings, our family often plays board games that need careful planning."},{"head":"\u003cstrong>leisure activity\u003c/strong> [B1]","gloss":"volnočasová aktivita","example":"Walking the dog or riding a bicycle through the park is a pleasant leisure activity."},{"head":"\u003cstrong>champion\u003c/strong> /ˈtʃæmpiən/ [B1]","gloss":"šampion, mistr","example":"The Czech tennis player won the final and became Wimbledon champion."},{"head":"\u003cstrong>take up a sport\u003c/strong> (phrase; B1)","gloss":"začít se věnovat sportu","example":"Doctors often advise teenagers to take up a sport to reduce stress."},{"head":"\u003cstrong>competitive\u003c/strong> /kəmˈpetətɪv/ [B1]","gloss":"soutěživý, soutěžní","example":"Football matches between schools from towns that are close to each other can become very competitive."},{"head":"\u003cstrong>cheating\u003c/strong> /ˈtʃiːtɪŋ/ [U; B1]","gloss":"podvádění","example":"Any form of cheating destroys honest sport, and people stop believing in it."},{"head":"\u003cstrong>outdoor activities\u003c/strong> (noun; B1 + A1)","gloss":"venkovní aktivity / koníčky v přírodě","example":"Hiking and cross-country skiing are wonderful outdoor activities in the Šumava mountains."},{"head":"\u003cstrong>fans\u003c/strong> (noun; A2)","gloss":"fanoušci, fanouškovská základna","example":"Fans all over the country support the national hockey team very strongly."},{"head":"\u003cstrong>work together\u003c/strong> (phrase; A1 + A1)","gloss":"spolupracovat","example":"Success in team games depends a lot on communication and working together."},{"head":"\u003cstrong>esports\u003c/strong> [plural or U; B1 podle učitele]","gloss":"elektronické sporty, esport","example":"People still discuss whether esports, which are competitions in video games, should be called real sport."},{"head":"\u003cstrong>physical education (PE)\u003c/strong> (physical education /ˌfɪzɪkl edʒuˈkeɪʃn/) [U; B1]","gloss":"tělesná výchova","example":"At our school, physical education classes take place twice a week."},{"head":"\u003cstrong>the Olympic Games\u003c/strong> [proper noun; vlastní jméno, Oxford B1]","gloss":"olympijské hry","example":"The Olympic Games take place every four years in a different country."}],"answer":["Sports and games have played an important role in human society for centuries. From ancient competitions to modern stadium matches, they provide entertainment, keep us healthy and bring people together. In the Czech Republic, sports culture is extremely strong. Almost every weekend, thousands of families go out into nature or support their favourite teams in front of the TV.","We can divide sports and games into several categories. First, there are physical sports, such as \u003cstrong>athletics\u003c/strong>, team sports like football or ice hockey, and exciting \u003cstrong>extreme sports\u003c/strong>. For people who prefer something calmer, there are \u003cstrong>outdoor activities\u003c/strong> such as hiking or cross-country skiing in the Šumava mountains. Many teenagers today sit too much, and \u003cstrong>physical education\u003c/strong> (PE) at school helps us fight this.","In recent years, \u003cstrong>esports\u003c/strong> has become very popular around the world, with many keen \u003cstrong>fans\u003c/strong>. Modern \u003cstrong>board games\u003c/strong> often encourage us to plan and to \u003cstrong>work together\u003c/strong> without much physical effort.","Whether you try hard to win or simply enjoy a \u003cstrong>leisure activity\u003c/strong>, games and sports teach us essential values. They remind us that we must follow the rules and avoid any form of \u003cstrong>cheating\u003c/strong>. This is necessary not only in sport, but in everyday life too."],"questions":[{"cat":"Popis","text":"What are the main differences between physical sports and other games? \u003cem>(games for the mind, games that you play at a table)\u003c/em>"},{"cat":"Zkušenost","text":"How has school physical education influenced your personal relationship with sports and regular exercise?"},{"cat":"Názor","text":"Why do you think extreme sports have become more and more popular among young adults? \u003cem>(although the risk of injury is high)\u003c/em>"},{"cat":"Srovnání","text":"How are Czech fans different when they support ice hockey and when they support football?"},{"cat":"Srovnání","text":"How is exercising in nature better for people than working out in an indoor gym? \u003cem>(health and happiness)\u003c/em>"},{"cat":"Hypotéza","text":"If esports became part of the Olympic Games, how would people react? \u003cem>(the public and traditional sports organizations)\u003c/em>"},{"cat":"Názor / návrh","text":"What should schools do to encourage teenagers who often avoid physical activity?"}],"phrases":[{"head":"\u003cstrong>Generally, we can divide...\u003c/strong>","gloss":"Obecně řečeno můžeme rozdělit...","note":"kategorizace / úvod"},{"head":"\u003cstrong>Unlike..., which focus on...\u003c/strong>","gloss":"Na rozdíl od..., které se soustředí na...","note":"srovnání"},{"head":"\u003cstrong>A clear example of this is...\u003c/strong>","gloss":"Jasným příkladem toho je...","note":"příklad"},{"head":"\u003cstrong>It is often believed that..., but the reality is...\u003c/strong>","gloss":"Často se věří, že..., ale realita je taková, že...","note":"vyvrácení mýtu / kontrast"},{"head":"\u003cstrong>Mentally,...\u003c/strong>","gloss":"Z psychického hlediska...","note":"úhel pohledu"},{"head":"\u003cstrong>This brings me to the point that...\u003c/strong>","gloss":"To mě přivádí k myšlence, že...","note":"přechod mezi myšlenkami"},{"head":"\u003cstrong>As a general conclusion,...\u003c/strong>","gloss":"Jako obecný závěr bych řekl / řekla,...","note":"závěr"}]},"codes":["SSO 8","CR 9a"],"groups":["cr","sso"],"rank":{"cr":18,"sso":16,"all":16}},{"file":"tema-2-my-sport.md","title":"My sport","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu.","vocab":[{"head":"\u003cstrong>equipment\u003c/strong> /ɪˈkwɪpmənt/ [U]","gloss":"vybavení, výstroj","example":"High-quality safety equipment is essential for preventing severe injuries."},{"head":"\u003cstrong>work out\u003c/strong> /ˌwɜːk ˈaʊt/ AmE /ˌwɜːrk ˈaʊt/ (verb)","gloss":"cvičit, posilovat","example":"I try to work out at least three times a week to stay in shape."},{"head":"\u003cstrong>stamina\u003c/strong> /ˈstæmɪnə/ [U]","gloss":"fyzická výdrž, kondice","example":"Long-distance running helps build both mental and physical stamina."},{"head":"\u003cstrong>warm up\u003c/strong> /ˌwɔːm ˈʌp/ AmE /ˌwɔːrm ˈʌp/
