<style>
/* Sizes follow the screen height, as in Inkrema's projector file: no text below 3 % of the height. --z grows them
   with + and − and with the browser's zoom (Ctrl + mouse wheel), see applySize(). Every colour pair is 7:1 or more. */
:root {
  --z: 1;
  --ink: #101a23; --muted: #36414c; --accent: #08503f; --line: #b8c4cf; --panel: #f2f5f7;
  --mark: #fff0b3; --warn: #7a1414; --warn-bg: #fbe9e9;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: #fff; color: var(--ink); font-family: "Segoe UI", Calibri, Arial, sans-serif; }
body { font-size: max(3vh, calc(3.2vh * var(--z))); line-height: 1.35; overflow-wrap: anywhere; }
#app { min-height: 100vh; display: flex; flex-direction: column; gap: 1.4vh; padding: 0 3vw 1.5vh; }
.bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 0.6vh 2vw; font-size: max(3vh, calc(3vh * var(--z))); }
/* The header holds the AI label: it stays on screen while a long list scrolls. */
header.bar { position: sticky; top: 0; z-index: 1; padding: 1.2vh 0 0.8vh; background: #fff; border-bottom: 0.1em solid var(--line); }
footer.bar { margin-top: auto; padding-top: 0.8vh; color: var(--muted); border-top: 0.1em solid var(--line); }
main { flex: 1 0 auto; display: flex; flex-direction: column; gap: 1.6vh; }
h1 { margin: 0; font-size: max(3.4vh, calc(4vh * var(--z))); line-height: 1.25; }
h1.title { font-size: max(3vh, calc(3.4vh * var(--z))); }
p { margin: 0; }
button { font: inherit; color: var(--ink); background: var(--panel); border: 0.1em solid var(--line); border-radius: 0.4em; cursor: pointer; text-align: left; padding: 0.15em 0.5em; }
button:focus-visible, .tile:focus { outline: 0.18em solid var(--accent); outline-offset: 0.1em; }
button[aria-pressed="true"] { color: #fff; background: var(--accent); border-color: var(--accent); }
button.key { padding: 0 0.35em; color: var(--muted); }
button b, .key b { color: var(--ink); }
button[aria-pressed="true"] b { color: #fff; }
.ai { color: var(--accent); border: 0.1em solid var(--accent); border-radius: 0.5em; padding: 0 0.6em; font-weight: 600; }
.nums { color: var(--accent); font-weight: 700; white-space: nowrap; }
.count { color: var(--muted); }
.chips, .tabs { display: flex; flex-wrap: wrap; align-items: baseline; gap: 1vh 1vw; }
.tabs .sp { flex: 1; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 28vw), 1fr)); gap: 1.2vh 1.2vw; }
.tile { padding: 0.35em 0.6em; line-height: 1.25; }
.tile .nums { display: block; white-space: normal; }
.warn { color: var(--warn); background: var(--warn-bg); border: 0.08em solid var(--warn); border-radius: 0.25em; padding: 0 0.25em; font-style: normal; font-weight: 700; }
strong.m, .para strong, .alltext strong { background: var(--mark); padding: 0 0.15em; border-radius: 0.2em; }
.hid { visibility: hidden; }
.hint { color: var(--muted); }
.lvl { color: var(--accent); font-weight: 700; white-space: nowrap; }
.chips > .sp { width: 2vw; }
/* One item per screen: centred; an item taller than the room starts below the header and scrolls. */
body[data-mode="one"] main { text-align: center; }
body[data-mode="one"] main > :first-child { margin-top: auto; }
body[data-mode="one"] main > :last-child { margin-bottom: auto; }
.stage { display: flex; flex-direction: column; gap: 2vh; align-items: center; }
.term { color: var(--muted); font-size: max(3vh, calc(3.4vh * var(--z))); }
.term strong { color: var(--ink); font-size: max(5vh, calc(7vh * var(--z))); line-height: 1.15; }
.gloss { color: var(--accent); font-weight: 600; font-size: max(3.6vh, calc(4.6vh * var(--z))); }
.ex { font-style: italic; font-size: max(3vh, calc(3.8vh * var(--z))); max-width: 60em; }
.rev { display: flex; flex-direction: column; gap: 1.6vh; align-items: center; }
.para { text-align: left; font-size: max(3.4vh, calc(4vh * var(--z))); line-height: 1.45; max-width: 52em; }
.qcat { color: var(--accent); font-weight: 700; }
.q { font-size: max(4vh, calc(5vh * var(--z))); line-height: 1.3; max-width: 34em; }
.phrase { font-size: max(4vh, calc(5.4vh * var(--z))); font-weight: 700; }
.note { color: var(--muted); }
/* Whole lists: every entry at body size, the page scrolls with → and ←. */
ol.list { margin: 0; padding-left: 1.6em; display: flex; flex-direction: column; gap: 1.1vh; }
ol.list strong { font-weight: 700; }
ol.list .ex, ol.list .note { font-size: inherit; color: var(--muted); }
.alltext { display: flex; flex-direction: column; gap: 1.6vh; }
#blank { position: fixed; inset: 0; z-index: 10; background: #000; }
#blank[hidden] { display: none; }
</style>

<script id="data" type="application/json">{"topics":[{"file":"tema-o1-favourite-book-or-film.md","title":"My Favourite Book or Film","label":"Navrhla AI, schválil učitel (7. 11. 2026).","vocab":[{"head":"\u003cstrong>author\u003c/strong> /ˈɔːθə/ AmE /ˈɔːθər/ [C; B1]","gloss":"autor, autorka, spisovatel(ka)","example":"I would like to read another book by the same author."},{"head":"\u003cstrong>publish\u003c/strong> /ˈpʌblɪʃ/ (verb; B1)","gloss":"vydat, publikovat (knihu)","example":"I hope to publish a short story one day."},{"head":"\u003cstrong>chapter\u003c/strong> /ˈtʃæptə/ AmE /ˈtʃæptər/ [C; B1]","gloss":"kapitola","example":"Each chapter builds tension until I cannot put the book down."},{"head":"\u003cstrong>realistic\u003c/strong> /ˌriːəˈlɪstɪk/ (adjective; B2)","gloss":"realistický, věrohodný","example":"The characters' conversations make the story feel realistic."},{"head":"\u003cstrong>hero\u003c/strong> /ˈhɪərəʊ/ AmE /ˈhɪroʊ/ [C; B1]","gloss":"hrdina (obdivovaný pro statečnost); hlavní mužská postava příběhu","example":"Unlike a traditional action hero, Winston Smith is an ordinary office worker."},{"head":"\u003cstrong>ending\u003c/strong> /ˈendɪŋ/ [C; B1]","gloss":"konec, závěr (knihy nebo filmu)","example":"Instead of a happy ending, the story finishes with a dark and realistic warning."},{"head":"\u003cstrong>theme\u003c/strong> /θiːm/ [C; B2]","gloss":"téma, hlavní myšlenka díla","example":"Propaganda, censorship and the loss of privacy are the central themes of the book."},{"head":"\u003cstrong>warn\u003c/strong> /wɔːn/ AmE /wɔːrn/ (verb; B1)","gloss":"varovat","example":"I think stories can warn us about the dangers of unchecked power."},{"head":"\u003cstrong>director\u003c/strong> /dəˈrektə(r)/ AmE /dəˈrektər/ [C; B1]","gloss":"režisér, režisérka","example":"Frank Darabont is the director of The Shawshank Redemption."},{"head":"\u003cstrong>release\u003c/strong> /rɪˈliːs/ (verb; B2)","gloss":"uvést do kin, vydat (film)","example":"The studio plans to release a new film next month."},{"head":"\u003cstrong>scene\u003c/strong> /siːn/ [C; B1]","gloss":"scéna, výjev (část filmu nebo divadelní hry odehrávající se na jednom místě)","example":"My favourite scene is a quiet conversation between the main characters."},{"head":"\u003cstrong>dialogue\u003c/strong> /ˈdaɪəlɒɡ/ AmE /ˈdaɪəlɑːɡ/ [C or U; B2]","gloss":"dialog, rozhovory postav v knize, hře či filmu","example":"The natural dialogue helps me understand how the characters feel."},{"head":"\u003cstrong>thriller\u003c/strong> /ˈθrɪlə/ AmE /ˈθrɪlər/ [C; B1]","gloss":"thriller, napínavý film nebo román","example":"If I am in the mood for excitement, I watch a psychological thriller."},{"head":"\u003cstrong>review\u003c/strong> /rɪˈvjuː/ [C; B1]","gloss":"recenze, posudek","example":"Before buying cinema tickets, I usually read online film reviews."},{"head":"\u003cstrong>critic\u003c/strong> /ˈkrɪtɪk/ [C; B2]","gloss":"kritik, recenzent","example":"I sometimes disagree with a film critic's opinion."},{"head":"\u003cstrong>innocent\u003c/strong> /ˈɪnəsnt/ (adjective; B2)","gloss":"nevinný","example":"Andy Dufresne insists that he is innocent of the crime he was sent to prison for."},{"head":"\u003cstrong>guilty\u003c/strong> /ˈɡɪlti/ (adjective; B2)","gloss":"vinný (spácháním trestného činu)","example":"The court finds Andy guilty of murder, although he is innocent."},{"head":"\u003cstrong>escape\u003c/strong> /ɪˈskeɪp/ (verb; B1)","gloss":"uprchnout, utéct","example":"A prison story often makes readers wonder whether someone will escape."},{"head":"\u003cstrong>friendship\u003c/strong> /ˈfrendʃɪp/ [C or U; B1]","gloss":"přátelství","example":"The growing friendship between Andy and Red helps both men survive prison life."},{"head":"\u003cstrong>loyalty\u003c/strong> /ˈlɔɪəlti/ [U; B2]","gloss":"věrnost, oddanost, loajalita","example":"True loyalty between friends is tested when they face injustice and fear."},{"head":"\u003cstrong>moving\u003c/strong> /ˈmuːvɪŋ/ (adjective; B2)","gloss":"dojemný, jímavý","example":"I found the ending deeply moving."},{"head":"\u003cstrong>unforgettable\u003c/strong> /ˌʌnfəˈɡetəbl/ AmE /ˌʌnfərˈɡetəbl/ (adjective; B1)","gloss":"nezapomenutelný","example":"The friendship at the centre of the film makes it unforgettable for me."},{"head":"\u003cstrong>entertaining\u003c/strong> /ˌentəˈteɪnɪŋ/ AmE /ˌentərˈteɪnɪŋ/ (adjective; B2)","gloss":"zábavný, poutavý","example":"I find films with witty dialogue especially entertaining."},{"head":"\u003cstrong>emotional\u003c/strong> /ɪˈməʊʃənl/ AmE /ɪˈmoʊʃənl/ (adjective; B2)","gloss":"dojatý, prožívající silné emoce","example":"I get emotional when I talk about the final scene."}],"answer":["I study at a business school in České Budějovice. I enjoy reading and watching films, so I would like to compare my favourite book, \u003cem>Nineteen Eighty-Four\u003c/em>, with my favourite film, \u003cem>The Shawshank Redemption\u003c/em>.","I admire the book's \u003cstrong>author\u003c/strong>, George Orwell, for making difficult ideas interesting. The novel was published in 1949. Its main character, Winston Smith, works at the Ministry of Truth, rewriting the past to suit the Party. Two-way screens called telescreens broadcast information and let the authorities watch people. Winston begins a secret relationship with Julia. For me, he is an interesting \u003cstrong>hero\u003c/strong> because he has doubts and weaknesses. The central \u003cstrong>theme\u003c/strong> is the danger of power without limits. Each \u003cstrong>chapter\u003c/strong> makes me think. I think the book can \u003cstrong>warn\u003c/strong> us about manipulation, even though its imagined world is very different from my daily life.","\u003cem>The Shawshank Redemption\u003c/em> was released in 1994 and directed by Frank Darabont. Andy Dufresne, played by Tim Robbins, is found \u003cstrong>guilty\u003c/strong> of murder although he is \u003cstrong>innocent\u003c/strong>. In prison, he develops a close \u003cstrong>friendship\u003c/strong> with Red, played by Morgan Freeman. I enjoy their \u003cstrong>dialogue\u003c/strong>. While watching, I kept wondering whether Andy would ever \u003cstrong>escape\u003c/strong>. I found the ending very moving.","These stories make me think about freedom in different ways. I like discussing the characters with friends because we do not always agree about their choices. Reading lets me imagine a scene for myself, while a film adds voices and music. I would recommend both works to someone who enjoys serious stories."],"answer_info":"","questions":[{"cat":"","text":"\u003cstrong>Why did you choose this particular book or film as your favourite, and when did you first read or see it?\u003c/strong> \u003cem>(personal impression, school reading list vs. recommendation from a friend, memorable characters)\u003c/em>"},{"cat":"","text":"\u003cstrong>What are the advantages of reading a book first compared with watching its film adaptation?\u003c/strong> \u003cem>(using your own imagination and inner monologue vs. visual effects, acting and music; time needed)\u003c/em>"},{"cat":"","text":"\u003cstrong>What makes a character in a book or film realistic and easy to sympathize with?\u003c/strong> \u003cem>(human strengths and weaknesses, moral choices, relatable struggles, character development)\u003c/em>"},{"cat":"","text":"\u003cstrong>What are the pros and cons of watching foreign films in the cinema with Czech subtitles versus Czech dubbing?\u003c/strong> \u003cem>(hearing the actors' original voices and practising English vs. relaxing without reading text on the screen)\u003c/em>"},{"cat":"","text":"\u003cstrong>How have streaming platforms changed the way young people watch films and series today?\u003c/strong> \u003cem>(watching at home on demand, binge-watching whole seasons vs. the atmosphere of a big cinema screen with friends)\u003c/em>"},{"cat":"","text":"\u003cstrong>Why do you think George Orwell's \u003cem>1984\u003c/em> is still relevant in the twenty-first century?\u003c/strong> \u003cem>(online surveillance, social media algorithms, fake news, manipulation of facts)\u003c/em>"},{"cat":"","text":"\u003cstrong>Which book or film would you never want to read or watch again, and what disappointed you about it?\u003c/strong> \u003cem>(predictable plot, weak acting, slow pacing, boring dialogue or unconvincing ending)\u003c/em>"}],"phrases":[{"head":"\u003cstrong>the story is set in…\u003c/strong>","gloss":"příběh se odehrává v… (místo a doba)","note":""},{"head":"\u003cstrong>be based on a novel / novella by…\u003c/strong>","gloss":"být natočen podle románu / novely od…","note":""},{"head":"\u003cstrong>the main character is played by…\u003c/strong>","gloss":"hlavní postavu hraje…","note":""},{"head":"\u003cstrong>I couldn't put the book down\u003c/strong>","gloss":"nemohl(a) jsem se od té knihy odtrhnout","note":""},{"head":"\u003cstrong>keep the audience on the edge of their seats\u003c/strong>","gloss":"udržovat diváky v napětí","note":""},{"head":"\u003cstrong>receive positive reviews from film critics\u003c/strong>","gloss":"získat kladné recenze od filmových kritiků","note":""},{"head":"\u003cstrong>leave a lasting impression on the viewer\u003c/strong>","gloss":"zanechat v divákovi trvalý dojem","note":""}],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>author\u003c/strong> /ˈɔːθə/ AmE /ˈɔːθər/ [C; A2]","gloss":"autor, autorka, spisovatel(ka)","example":"I would like to read another book by the same author."},{"head":"\u003cstrong>publish\u003c/strong> /ˈpʌblɪʃ/ (verb; A2)","gloss":"vydat, publikovat (knihu)","example":"I hope to publish a short story one day."},{"head":"\u003cstrong>chapter\u003c/strong> /ˈtʃæptə/ AmE /ˈtʃæptər/ [C; B1]","gloss":"kapitola","example":"Each chapter makes the story more exciting until I cannot put the book down."},{"head":"\u003cstrong>hero\u003c/strong> /ˈhɪərəʊ/ AmE /ˈhɪroʊ/ [C; A2]","gloss":"hrdina (obdivovaný pro statečnost); hlavní mužská postava příběhu","example":"Unlike a traditional action hero, Winston Smith is an ordinary office worker."},{"head":"\u003cstrong>ending\u003c/strong> /ˈendɪŋ/ [C; A2]","gloss":"konec, závěr (knihy nebo filmu)","example":"Instead of a happy ending, the story finishes with a warning."},{"head":"\u003cstrong>theme\u003c/strong> /θiːm/ [C; B1]","gloss":"téma, hlavní myšlenka díla","example":"People are watched all the time, and this is a central theme of the book."},{"head":"\u003cstrong>warn\u003c/strong> /wɔːn/ AmE /wɔːrn/ (verb; B1)","gloss":"varovat","example":"I think stories can warn us about the dangers of power without limits."},{"head":"\u003cstrong>director\u003c/strong> /dəˈrektə(r)/ AmE /dəˈrektər/ [C; A2]","gloss":"režisér, režisérka","example":"Frank Darabont is the director of The Shawshank Redemption."},{"head":"\u003cstrong>release\u003c/strong> /rɪˈliːs/ (verb; slovo k tématu, B2)","gloss":"uvést do kin, vydat (film)","example":"The studio plans to release a new film next month."},{"head":"\u003cstrong>scene\u003c/strong> /siːn/ [C; A2]","gloss":"scéna, výjev (část filmu nebo divadelní hry odehrávající se na jednom místě)","example":"My favourite scene is a quiet conversation between the main characters."},{"head":"\u003cstrong>thriller\u003c/strong> /ˈθrɪlə/ AmE /ˈθrɪlər/ [C; B1]","gloss":"thriller, napínavý film nebo román","example":"If I am in the mood for excitement, I watch a thriller."},{"head":"\u003cstrong>review\u003c/strong> /rɪˈvjuː/ [C; A2]","gloss":"recenze, posudek","example":"Before buying cinema tickets, I usually read online film reviews."},{"head":"\u003cstrong>entertain\u003c/strong> (verb; B1)","gloss":"bavit, pobavit","example":"Films with clever and funny dialogue entertain me most of all."},{"head":"\u003cstrong>innocent\u003c/strong> /ˈɪnəsnt/ (adjective; B1)","gloss":"nevinný","example":"Andy Dufresne says that he is innocent of the crime he was sent to prison for."},{"head":"\u003cstrong>guilty\u003c/strong> /ˈɡɪlti/ (adjective; B1)","gloss":"vinný (spácháním trestného činu)","example":"The court finds Andy guilty of murder, although he is innocent."},{"head":"\u003cstrong>escape\u003c/strong> /ɪˈskeɪp/ (verb; B1)","gloss":"uprchnout, utéct","example":"A prison story often makes readers wonder whether someone will escape."},{"head":"\u003cstrong>friendship\u003c/strong> /ˈfrendʃɪp/ [C or U; B1]","gloss":"přátelství","example":"The growing friendship between Andy and Red helps both men survive prison life."},{"head":"\u003cstrong>unforgettable\u003c/strong> /ˌʌnfəˈɡetəbl/ AmE /ˌʌnfərˈɡetəbl/ (adjective; B1)","gloss":"nezapomenutelný","example":"The friendship at the centre of the film makes it unforgettable for me."},{"head":"\u003cstrong>emotion\u003c/strong> [C or U; B1]","gloss":"emoce, silný pocit, dojetí","example":"I feel strong emotions when I talk about the final scene."}],"answer":["I study at a business school in České Budějovice. I would like to compare my favourite book, \u003cem>Nineteen Eighty-Four\u003c/em>, with my favourite film, \u003cem>The Shawshank Redemption\u003c/em>.","I admire the book's \u003cstrong>author\u003c/strong>, George Orwell, for making difficult ideas interesting. The novel was \u003cstrong>published\u003c/strong> in 1949. Its main character, Winston Smith, works at the Ministry of Truth and changes the past to suit the Party. Screens which are called telescreens send out information and let the Party watch people. For me, Winston is an interesting \u003cstrong>hero\u003c/strong> because he has doubts and bad qualities. The central \u003cstrong>theme\u003c/strong> is the danger of power without limits. I think the book can \u003cstrong>warn\u003c/strong> us about people who try to control our thoughts.","\u003cem>The Shawshank Redemption\u003c/em> was \u003cstrong>released\u003c/strong> in 1994 and directed by Frank Darabont. Andy Dufresne, who is played by Tim Robbins, is found \u003cstrong>guilty\u003c/strong> of murder although he is \u003cstrong>innocent\u003c/strong>. In prison, he develops a close \u003cstrong>friendship\u003c/strong> with Red, who is played by Morgan Freeman. As I watched, I kept wondering whether Andy would ever \u003cstrong>escape\u003c/strong>. The \u003cstrong>ending\u003c/strong> made me feel strong \u003cstrong>emotions\u003c/strong>.","These stories make me think about being free in different ways. I would recommend both works to someone who enjoys serious stories."],"questions":[{"cat":"","text":"\u003cstrong>Why did you choose this particular book or film as your favourite?\u003c/strong> \u003cem>(when you first read or saw it, personal impression, a school reading list or a recommendation from a friend, characters that are easy to remember)\u003c/em>"},{"cat":"","text":"\u003cstrong>What are the advantages of reading a book before you watch its film version?\u003c/strong> \u003cem>(imagining things for yourself and reading the characters' thoughts, or effects on the screen, acting and music; the time you need)\u003c/em>"},{"cat":"","text":"\u003cstrong>What makes a character in a book or film seem real and easy to understand?\u003c/strong> \u003cem>(good and bad qualities of people, choices between right and wrong, problems that we know from our own lives, how the character changes)\u003c/em>"},{"cat":"","text":"\u003cstrong>What is good and bad about watching foreign films with Czech subtitles or in Czech?\u003c/strong> \u003cem>(hearing the actors' original voices and practising English, or relaxing without reading text on the screen)\u003c/em>"},{"cat":"","text":"\u003cstrong>How have online film services changed the way young people watch films and series today?\u003c/strong> \u003cem>(watching at home whenever you want, watching a whole series at once, or the atmosphere of a big cinema screen with friends)\u003c/em>"},{"cat":"","text":"\u003cstrong>Why do you think George Orwell's \u003cem>1984\u003c/em> still matters in the twenty-first century?\u003c/strong> \u003cem>(being watched online, how social media choose what we see, false news, changing facts in a way that is not honest)\u003c/em>"},{"cat":"","text":"\u003cstrong>Which book or film would you never want to read or watch again?\u003c/strong> \u003cem>(what disappointed you: a plot that was easy to guess, weak acting, a story that moved too slowly, boring dialogue or an ending that was hard to believe)\u003c/em>"}],"phrases":[{"head":"\u003cstrong>the story is set in…\u003c/strong>","gloss":"příběh se odehrává v… (místo a doba)","note":""},{"head":"\u003cstrong>be based on a novel / a short novel by…\u003c/strong>","gloss":"být natočen podle románu / novely od…","note":""},{"head":"\u003cstrong>the main character is played by…\u003c/strong>","gloss":"hlavní postavu hraje…","note":""},{"head":"\u003cstrong>I couldn't put the book down\u003c/strong>","gloss":"nemohl(a) jsem se od té knihy odtrhnout","note":""},{"head":"\u003cstrong>keep the audience excited until the end\u003c/strong>","gloss":"udržovat diváky v napětí až do konce","note":""},{"head":"\u003cstrong>receive positive reviews\u003c/strong>","gloss":"získat kladné recenze","note":""},{"head":"\u003cstrong>stay in the viewer's memory for a long time\u003c/strong>","gloss":"zůstat divákovi dlouho v paměti","note":""}]},"codes":["SSO 1"],"groups":["sso"],"rank":{"sso":2,"all":2}},{"file":"tema-s12-family-friends-relationships.md","title":"Family, friends, relationships","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu.","vocab":[{"head":"\u003cstrong>nuclear family\u003c/strong> /ˌnjuːkliə ˈfæməli/ AmE /ˌnuːkliər ˈfæməli/ [C]","gloss":"základní rodina (pouze rodiče a děti)","example":"Many households are structured as a traditional nuclear family consisting of parents and their children."},{"head":"\u003cstrong>extended family\u003c/strong> /ɪkˌstendɪd ˈfæməli/ [C]","gloss":"širší rodina (zahrnující prarodiče, strýce, tety a bratrance)","example":"We gather our entire extended family together twice a year for Christmas and summer barbecues."},{"head":"\u003cstrong>generation gap\u003c/strong> [C]","gloss":"generační propast, rozdíl v názorech mezi generacemi","example":"Different views on technology and lifestyle often highlight the generation gap between teenagers and grandparents."},{"head":"\u003cstrong>upbringing\u003c/strong> /ˈʌpbrɪŋɪŋ/ [U]","gloss":"výchova (dítěte rodiči v rodině)","example":"A loving and supportive upbringing gives young people emotional resilience for adult life."},{"head":"\u003cstrong>rely on\u003c/strong> (rely /rɪˈlaɪ/) (phrasal verb)","gloss":"spoléhat se na","example":"True friends are those rare individuals whom you can rely on no matter what troubles you face."},{"head":"\u003cstrong>get on well with sb\u003c/strong> (phrasal verb)","gloss":"dobře vycházet s někým","example":"I am fortunate to get on well with my younger sister, even though we occasionally squabble over clothes."},{"head":"\u003cstrong>fall out with sb\u003c/strong> (phrasal verb)","gloss":"pohádat se / rozkmotřit se s někým","example":"It is painful when close friends fall out with each other over silly misunderstandings."},{"head":"\u003cstrong>make up (with sb)\u003c/strong> (make up /ˌmeɪk ˈʌp/) (phrasal verb)","gloss":"usmířit se (s někým)","example":"After discussing their hurt feelings openly, the two friends managed to make up with each other."},{"head":"\u003cstrong>confide in sb\u003c/strong> (confide /kənˈfaɪd/) (verb)","gloss":"svěřit se někomu (s důvěrnou věcí)","example":"Whenever I feel anxious about my school performance, I confide in my mother."},{"head":"\u003cstrong>peer pressure\u003c/strong> /ˈpɪə preʃə(r)/ AmE /ˈpɪr preʃər/ [U]","gloss":"tlak vrstevníků","example":"Adolescents sometimes try smoking or drinking alcohol simply because of intense peer pressure."},{"head":"\u003cstrong>acquaintance\u003c/strong> /əˈkweɪntəns/ [C]","gloss":"známý (člověk, kterého známe, ale není blízkým přítelem)","example":"Social media makes it easy to have hundreds of acquaintances, but genuine friends remain few."},{"head":"\u003cstrong>look up to sb\u003c/strong> (phrasal verb)","gloss":"vzhlížet k někomu, chovat k někomu úctu","example":"Many students look up to their older siblings or sports coaches as inspiring role models."},{"head":"\u003cstrong>take after sb\u003c/strong> (phrasal verb)","gloss":"podobat se někomu (povahou nebo vzhledem v rodině)","example":"In terms of patience and calm temper, I definitely take after my father."},{"head":"\u003cstrong>household chores\u003c/strong> (household /ˈhaʊshəʊld/) [plural]","gloss":"domácí práce","example":"Sharing household chores, like vacuuming and washing dishes, teaches teenagers responsibility."},{"head":"\u003cstrong>supportive\u003c/strong> /səˈpɔːtɪv/ AmE /səˈpɔːrtɪv/ (adjective)","gloss":"podporující, chápající","example":"Having a supportive family makes dealing with exam anxiety far easier."},{"head":"\u003cstrong>mutual trust\u003c/strong> (mutual /ˈmjuːtʃuəl/; trust /trʌst/) [U]","gloss":"vzájemná důvěra","example":"Any long-lasting romantic relationship or deep friendship is rooted in mutual trust."},{"head":"\u003cstrong>sibling rivalry\u003c/strong> (sibling /ˈsɪblɪŋ/; rivalry /ˈraɪvlri/) [U]","gloss":"sourozenecká rivalita","example":"A certain amount of sibling rivalry is natural when brothers compete for parental attention."},{"head":"\u003cstrong>reach a compromise\u003c/strong> (compromise /ˈkɒmprəmaɪz/ AmE /ˈkɑːmprəmaɪz/) (phrase)","gloss":"dosáhnout kompromisu","example":"When conflicts arise at home, parents and teenagers should sit down and reach a compromise."},{"head":"\u003cstrong>drift apart\u003c/strong> (drift /drɪft/) (phrasal verb)","gloss":"odcizit se, vzájemně se vzdálit","example":"After finishing school and moving to different cities, former classmates frequently drift apart."},{"head":"\u003cstrong>adolescence\u003c/strong> /ˌædəˈlesns/ [U]","gloss":"dospívání (vývojové období mezi dětstvím a dospělostí; tělesná puberta je \u003cem>puberty\u003c/em>)","example":"During adolescence, young people search for their own identity and desire greater independence."},{"head":"\u003cstrong>sympathetic\u003c/strong> /ˌsɪmpəˈθetɪk/ (adjective)","gloss":"soucitný, chápavý (POZOR: neznamená „sympatický“, ale „projevující soucit“)","example":"When my dog died, my teacher was remarkably sympathetic and gave me extra time."},{"head":"\u003cstrong>empathy\u003c/strong> /ˈempəθi/ [U]","gloss":"vcítění, empatie","example":"Being a good listener requires genuine empathy and patience."}],"answer":["Relationships with family and friends are the most important part of our everyday lives. As a teenager going through \u003cstrong>adolescence\u003c/strong>, my family and my friends fulfill different, but equally vital roles in my daily life. At home, I live in a traditional \u003cstrong>nuclear family\u003c/strong> with my parents and my brother. Naturally, occasional tensions arise, whether regarding \u003cstrong>household chores\u003c/strong> or bedtime rules, often magnified by the typical \u003cstrong>generation gap\u003c/strong>. However, whenever serious disagreements occur, we sit down to talk and \u003cstrong>reach a compromise\u003c/strong>. Knowing that I have a \u003cstrong>supportive\u003c/strong> background where parents show \u003cstrong>empathy\u003c/strong> and where I can always \u003cstrong>confide in\u003c/strong> them gives me immense security.","At the same time, friendships become increasingly significant during secondary school years. There is a huge distinction between having dozens of online \u003cstrong>acquaintances\u003c/strong> and having true companions. True friendship is built on \u003cstrong>mutual trust\u003c/strong>, shared humour, and honest communication. While you might sometimes \u003cstrong>fall out with\u003c/strong> a close friend over trivial disagreements, genuine friends always swallow their pride and \u003cstrong>make up\u003c/strong> afterwards.","Another challenge many young people face is \u003cstrong>peer pressure\u003c/strong>. In secondary school environments, the desire to fit into a particular social group can push teenagers into doing things that conflict with their personal values. In my opinion, the healthiest friendships are those where people respect your individuality instead of pressuring you to change. As we mature and prepare for adulthood, some childhood relationships inevitably \u003cstrong>drift apart\u003c/strong>, but the loyal friends whom you can truly \u003cstrong>rely on\u003c/strong> stay with you for a lifetime."],"answer_info":"","questions":[{"cat":"Popis","text":"What qualities do you value most in a close friend?"},{"cat":"Srovnání","text":"In what ways do the roles of parents and friends differ when a teenager is experiencing personal problems?"},{"cat":"Zkušenost","text":"How do members of your family usually handle disagreements or conflicts of opinion?"},{"cat":"Názor","text":"Why do you think some childhood friendships last into adulthood while others gradually drift apart?"},{"cat":"Popis","text":"What are the most common causes of misunderstandings between teenagers and their grandparents?"},{"cat":"Hypotéza","text":"If a friend asked you to cover for them while they were doing something dishonest, how would you respond to balance honesty and loyalty?"},{"cat":"Názor","text":"How has communicating through digital messages and social networks altered the depth of personal relationships among young people?"}],"phrases":[{"head":"\u003cstrong>Family comes first because...\u003c/strong>","gloss":"Rodina je na prvním místě, protože...","note":"vyjádření hodnoty"},{"head":"\u003cstrong>When there is a clash of personalities,...\u003c/strong>","gloss":"Když dojde ke střetu osobností,...","note":"popis konfliktu"},{"head":"\u003cstrong>I firmly believe that open communication is key to...\u003c/strong>","gloss":"Pevně věřím, že otevřená komunikace je klíčem k...","note":"doporučení"},{"head":"\u003cstrong>On the whole, my friends and I...\u003c/strong>","gloss":"Celkově vzato, moji přátelé a já...","note":"obecný pohled"},{"head":"\u003cstrong>A common source of tension between generations is...\u003c/strong>","gloss":"Běžným zdrojem napětí mezi generacemi je...","note":"pojmenování příčiny"},{"head":"\u003cstrong>From my personal perspective, true loyalty means...\u003c/strong>","gloss":"Z mého osobního pohledu skutečná věrnost znamená...","note":"definice"},{"head":"\u003cstrong>All in all, healthy relationships require...\u003c/strong>","gloss":"Celkově vzato, zdravé vztahy vyžadují...","note":"závěr"}],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>generation gap\u003c/strong> [C; B1 + B1]","gloss":"generační propast, rozdíl v názorech mezi generacemi","example":"Different views on technology and lifestyle often highlight the generation gap between teenagers and grandparents."},{"head":"\u003cstrong>depend on\u003c/strong> (phrasal verb; A2)","gloss":"spoléhat se na","example":"True friends are rare people that you can always depend on."},{"head":"\u003cstrong>get on well with sb\u003c/strong> (phrasal verb; B1)","gloss":"dobře vycházet s někým","example":"I am lucky to get on well with my younger sister, although we sometimes argue about clothes."},{"head":"\u003cstrong>become friends again\u003c/strong> (phrase; A1 + A1 + A1)","gloss":"usmířit se (s někým)","example":"After talking about their hurt feelings, they managed to become friends again."},{"head":"\u003cstrong>peer pressure\u003c/strong> /ˈpɪə preʃə(r)/ AmE /ˈpɪr preʃər/ [U; slovo k tématu, bez úrovně]","gloss":"tlak vrstevníků","example":"Teenagers sometimes try smoking or drinking alcohol simply because of strong peer pressure."},{"head":"\u003cstrong>admire\u003c/strong> (verb; B1)","gloss":"obdivovat, vzhlížet k někomu","example":"Many students admire their older brothers and sisters or sports coaches."},{"head":"\u003cstrong>housework\u003c/strong> (noun; A2)","gloss":"domácí práce","example":"Sharing housework, like washing dishes, teaches teenagers responsibility."},{"head":"\u003cstrong>support\u003c/strong> (verb; A2)","gloss":"podporovat (pomáhat a povzbuzovat)","example":"Exam worries are easier to deal with if your family supports you."},{"head":"\u003cstrong>become less close\u003c/strong> (phrase; A1 + A2 + B1)","gloss":"odcizit se, vzájemně se vzdálit","example":"Old classmates who move to different cities frequently become less close."},{"head":"\u003cstrong>teenage years\u003c/strong> (noun; A2 + A1)","gloss":"dospívání (věk mezi 13 a 19 lety)","example":"In their teenage years, young people look for their own identity."}],"answer":["In my \u003cstrong>teenage years\u003c/strong>, my family and my friends play different but equally important roles in my daily life. At home, I live in a traditional family with my parents and my brother. Naturally, there are sometimes problems between us, for example about \u003cstrong>housework\u003c/strong>. The typical \u003cstrong>generation gap\u003c/strong> often makes them worse. However, when we really disagree, we sit down to talk. Then everyone gives up something, and we agree. My parents \u003cstrong>support\u003c/strong> me, and I can always talk to them about private things.","Friendships become more and more important in secondary school. True friends can \u003cstrong>depend on\u003c/strong> each other and are honest with each other. You might sometimes argue with a close friend about something small. But true friends always end the argument and \u003cstrong>become friends again\u003c/strong>.","Another challenge that many young people face is \u003cstrong>peer pressure\u003c/strong>. The wish to belong to a particular group can make teenagers do things that they think are wrong. In my opinion, in the healthiest friendships, people accept you as you are. When we grow up, some friends from childhood naturally \u003cstrong>become less close\u003c/strong>. But the true friends that you can really \u003cstrong>depend on\u003c/strong> stay with you for your whole life."],"questions":[{"cat":"Popis","text":"What qualities do you think are most important in a close friend?"},{"cat":"Srovnání","text":"How are the roles of parents and friends different when a teenager has personal problems?"},{"cat":"Zkušenost","text":"How do members of your family usually deal with situations when they disagree?"},{"cat":"Názor","text":"Why do you think some childhood friendships last until people are adults? \u003cem>(and why other friends slowly become less close)\u003c/em>"},{"cat":"Popis","text":"What are the most common reasons why teenagers and their grandparents don't understand each other?"},{"cat":"Hypotéza","text":"If a friend asked you to lie for them, what would you do? \u003cem>(they are doing something that is not honest; how to be both honest and a good friend)\u003c/em>"},{"cat":"Názor","text":"How have digital messages and social media changed how close young people's relationships are?"}],"phrases":[{"head":"\u003cstrong>Family is the most important thing because...\u003c/strong>","gloss":"Rodina je na prvním místě, protože...","note":"vyjádření hodnoty"},{"head":"\u003cstrong>When people with different personalities do not get on,...\u003c/strong>","gloss":"Když si lidé s odlišnou povahou nerozumějí,...","note":"popis konfliktu"},{"head":"\u003cstrong>I strongly believe that honest communication is the key to...\u003c/strong>","gloss":"Pevně věřím, že upřímná komunikace je klíčem k...","note":"doporučení"},{"head":"\u003cstrong>In general, my friends and I...\u003c/strong>","gloss":"Celkově vzato, moji přátelé a já...","note":"obecný pohled"},{"head":"\u003cstrong>A common cause of problems between generations is...\u003c/strong>","gloss":"Běžnou příčinou problémů mezi generacemi je...","note":"pojmenování příčiny"},{"head":"\u003cstrong>From my personal point of view, always supporting someone means...\u003c/strong>","gloss":"Z mého osobního pohledu vždy někoho podporovat (být věrný) znamená...","note":"definice"},{"head":"\u003cstrong>In conclusion, healthy relationships require...\u003c/strong>","gloss":"Závěrem: zdravé vztahy vyžadují...","note":"závěr"}]},"codes":["SSO 2","CR 1a","CR 2a"],"groups":["cr","sso"],"rank":{"cr":2,"sso":4,"all":2.5}},{"file":"tema-s15-traditions-holidays-festivals.md","title":"Traditions, holidays, festivals","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu.","vocab":[{"head":"\u003cstrong>tradition\u003c/strong> /trəˈdɪʃn/ [C/U]","gloss":"tradice","example":"Celebrating Christmas with immediate family is a cherished tradition in Central Europe."},{"head":"\u003cstrong>custom\u003c/strong> /ˈkʌstəm/ [C]","gloss":"zvyk, obyčej","example":"Pouring lead or floating walnut shells are old Czech Christmas customs to foretell the future."},{"head":"\u003cstrong>Christmas Eve\u003c/strong> /ˌkrɪsməs ˈiːv/ [proper noun]","gloss":"Štědrý den (24. prosince)","example":"In the Czech Republic, families sit down for their festive dinner and unwrap presents on Christmas Eve."},{"head":"\u003cstrong>public holiday\u003c/strong> /ˌpʌblɪk ˈhɒlədeɪ/ AmE /ˌpʌblɪk ˈhɑːlədeɪ/ [C]","gloss":"státní svátek","example":"Most schools and banks typically remain closed on an official public holiday."},{"head":"\u003cstrong>commemorate\u003c/strong> /kəˈmeməreɪt/ (verb)","gloss":"připomínat si (historickou událost nebo osobnost)","example":"On November 17th, Czechs commemorate the struggle for freedom and democracy."},{"head":"\u003cstrong>gathering\u003c/strong> /ˈɡæðərɪŋ/ [C]","gloss":"rodinné setkání, sešlost","example":"Thanksgiving is an occasion for an enormous family gathering across the United States."},{"head":"\u003cstrong>unwrap presents\u003c/strong> (unwrap /ʌnˈræp/) (phrase)","gloss":"rozbalovat dárky","example":"Children can hardly contain their excitement before they unwrap presents beneath the Christmas tree."},{"head":"\u003cstrong>carol\u003c/strong> /ˈkærəl/ [C]","gloss":"vánoční koleda","example":"Singing traditional carols around the lit tree creates a warm and peaceful mood."},{"head":"\u003cstrong>festive atmosphere\u003c/strong> (festive /ˈfestɪv/) [usually singular / U]","gloss":"sváteční atmosféra","example":"The smell of cinnamon and gingerbread filling the house contributes to a wonderful festive atmosphere."},{"head":"\u003cstrong>feast\u003c/strong> /fiːst/ [C]","gloss":"hostina, slavnostní hodování","example":"A lavish feast with roasted poultry and seasonal pastries is typical of winter celebrations."},{"head":"\u003cstrong>Thanksgiving\u003c/strong> /ˌθæŋksˈɡɪvɪŋ/ [proper noun]","gloss":"Den díkůvzdání (čtvrtý čtvrtek v listopadu v USA)","example":"Families across America travel long distances to share roast turkey on Thanksgiving."},{"head":"\u003cstrong>Independence Day\u003c/strong> /ˌɪndɪˈpendəns deɪ/ [proper noun]","gloss":"Den nezávislosti (4. července v USA)","example":"Americans celebrate Independence Day with outdoor barbecues, picnics, and parades."},{"head":"\u003cstrong>fireworks display\u003c/strong> (display /dɪˈspleɪ/) [C]","gloss":"ohňostroj","example":"Crowds gathered along the riverbank to admire the spectacular fireworks display at midnight."},{"head":"\u003cstrong>bonfire\u003c/strong> /ˈbɒnfaɪə/ AmE /ˈbɑːnfaɪər/ [C]","gloss":"vatra, velký oheň","example":"On the fifth of November, British people light a bonfire and burn effigies to mark Guy Fawkes Night."},{"head":"\u003cstrong>hand down from generation to generation\u003c/strong> (phrase)","gloss":"předávat z generace na generaci","example":"Folklore songs, embroidery techniques, and holiday recipes are handed down from generation to generation."},{"head":"\u003cstrong>Easter egg\u003c/strong> /ˈiːstər eɡ/ [C]","gloss":"velikonoční vajíčko, kraslice (v anglosaském světě často čokoládové či barvené vařené vajíčko určené ke hledání – \u003cem>egg hunt\u003c/em>)","example":"Decorating boiled Easter eggs with melted wax is a delicate and time-consuming art."},{"head":"\u003cstrong>braided willow rod\u003c/strong> (willow /ˈwɪləʊ/; rod /rɒd/ AmE /rɑːd/) [C] (Czech: \u003cem>pomlázka\u003c/em>)","gloss":"pomlázka (spletená z vrbového proutí)","example":"On Easter Monday morning, boys visit girls carrying a traditional braided willow rod."},{"head":"\u003cstrong>costume\u003c/strong> /ˈkɒstjuːm/ AmE /ˈkɑːstuːm/ [C]","gloss":"kostým, maškarní převlek (POZOR na falešného přítele: dámský společenský/pracovní kostým je \u003cem>suit\u003c/em> nebo \u003cem>trouser suit\u003c/em>)","example":"Children love dressing up in spooky costumes for Halloween trick-or-treating."},{"head":"\u003cstrong>parade\u003c/strong> /pəˈreɪd/ [C]","gloss":"slavnostní průvod","example":"St Patrick's Day in Dublin is celebrated with a vibrant street parade and green clothing."},{"head":"\u003cstrong>commercialized\u003c/strong> (adjective)","gloss":"zkomercializovaný","example":"Many people regret that holidays have become overly commercialized by retailers eager to maximize profits."},{"head":"\u003cstrong>fried carp\u003c/strong> (fried /fraɪd/; carp /kɑːp/ AmE /kɑːrp/) [U]","gloss":"smažený kapr (POZOR: \u003cem>roast\u003c/em> znamená pečený v troubě, \u003cem>fried\u003c/em> je smažený na pánvi)","example":"Fried carp served with homemade potato salad is the quintessential Czech Christmas Eve meal."},{"head":"\u003cstrong>Boxing Day\u003c/strong> /ˈbɒksɪŋ deɪ/ AmE /ˈbɑːksɪŋ deɪ/ [proper noun]","gloss":"26. prosinec (ve Velké Británii a Commonwealthu)","example":"In Great Britain, December 26th is celebrated as Boxing Day, often dedicated to shopping sales and sports."}],"answer":["Holidays and family traditions play an important role in every society. They give us a welcome break from school or work, and bring families together throughout the year. In the Czech Republic, Christmas is definitely the most beloved holiday. Unlike the English-speaking world where Santa brings gifts on Christmas Day morning, Czech families gather on \u003cstrong>Christmas Eve\u003c/strong>. We prepare a festive dinner of \u003cstrong>fried carp\u003c/strong> and homemade potato salad, listen to traditional \u003cstrong>carols\u003c/strong>, and eagerly \u003cstrong>unwrap presents\u003c/strong> under the tree. The warm and peaceful \u003cstrong>festive atmosphere\u003c/strong> at home is what makes this holiday so special for me.","In contrast, traditions in English-speaking nations offer different customs. In the United States, \u003cstrong>Thanksgiving\u003c/strong> in late November is perhaps even more culturally significant than Christmas. It centers around a nationwide family \u003cstrong>gathering\u003c/strong> and a hearty \u003cstrong>feast\u003c/strong> featuring roast turkey, pumpkin pie, and cranberry sauce to express gratitude. Another major American celebration is \u003cstrong>Independence Day\u003c/strong> on July 4th, famous for backyard barbecues, community \u003cstrong>parades\u003c/strong>, and colourful \u003cstrong>fireworks displays\u003c/strong>. In Britain, autumn brings Guy Fawkes Night on November 5th, when people gather around a large \u003cstrong>bonfire\u003c/strong> to commemorate the failure of the Gunpowder Plot in 1605.","Springtime traditions are also deeply rooted. In the Czech Republic, Easter involves unique folklore, such as boys carrying \u003cstrong>braided willow rods\u003c/strong> and girls painting colourful \u003cstrong>Easter eggs\u003c/strong>. While some people say holidays are now too \u003cstrong>commercialized\u003c/strong>, the simple joy of sharing a good meal and keeping customs \u003cstrong>handed down from generation to generation\u003c/strong> remains as strong as ever."],"answer_info":"","questions":[{"cat":"Popis","text":"How do Czech families typically spend Christmas Eve from morning until evening?"},{"cat":"Srovnání","text":"In what ways do British Christmas customs differ from Czech holiday traditions?"},{"cat":"Zkušenost","text":"Which holiday or cultural festival do you look forward to the most every year?"},{"cat":"Názor","text":"Why do some people feel that modern holidays have lost their original spiritual meaning and become too commercialized?"},{"cat":"Popis","text":"What is the historical origin and significance of Thanksgiving in the United States?"},{"cat":"Hypotéza","text":"If you had to explain the Czech Easter tradition of the braided willow rod to an international visitor, how would you describe its meaning and symbolism?"},{"cat":"Srovnání","text":"How does the celebration of Halloween in the USA compare with All Souls' Day (Dušičky) in the Czech Republic?"}],"phrases":[{"head":"\u003cstrong>Traditions hold a special place in our culture because...\u003c/strong>","gloss":"Tradice mají v naší kultuře zvláštní místo, protože...","note":"vyjádření významu"},{"head":"\u003cstrong>The most distinctive aspect of this celebration is...\u003c/strong>","gloss":"Nejcharakterističtějším aspektem této oslavy je...","note":"vyzdvižení zvláštnosti"},{"head":"\u003cstrong>Compared to Czech customs,...\u003c/strong>","gloss":"Ve srovnání s českými zvyky...","note":"srovnání kultur"},{"head":"\u003cstrong>It is an occasion for families to...\u003c/strong>","gloss":"Je to příležitost pro rodiny, aby...","note":"funkce svátku"},{"head":"\u003cstrong>Historically speaking, this event dates back to...\u003c/strong>","gloss":"Z historického hlediska tato událost sahá až do...","note":"historický původ"},{"head":"\u003cstrong>What strikes me most about this holiday is...\u003c/strong>","gloss":"Co mě na tomto svátku nejvíce zaujme, je...","note":"osobní postřeh"},{"head":"\u003cstrong>To sum up, while traditions evolve over time, they still...\u003c/strong>","gloss":"Abych to shrnul, ačkoliv se tradice v čase vyvíjejí, stále...","note":"závěr"}],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>tradition\u003c/strong> /trəˈdɪʃn/ [C/U; A2]","gloss":"tradice","example":"In Central Europe, celebrating Christmas with close family is a tradition that people love."},{"head":"\u003cstrong>custom\u003c/strong> /ˈkʌstəm/ [C; B1]","gloss":"zvyk, obyčej","example":"Some old Czech Christmas customs are ways of predicting the future."},{"head":"\u003cstrong>Christmas\u003c/strong> [proper noun; vlastní jméno, Oxford A1]","gloss":"Vánoce","example":"In the Czech Republic, Christmas is the holiday that people love most."},{"head":"\u003cstrong>Christmas Eve\u003c/strong> /ˌkrɪsməs ˈiːv/ [proper noun; vlastní jméno, Oxford C1]","gloss":"Štědrý den (24. prosince)","example":"In the Czech Republic, families sit down for their Christmas dinner and open presents on Christmas Eve."},{"head":"\u003cstrong>Christmas Day\u003c/strong> [proper noun; vlastní jméno, bez úrovně]","gloss":"1. svátek vánoční (25. prosince)","example":"In the English-speaking world, Santa brings gifts on Christmas Day morning."},{"head":"\u003cstrong>public holiday\u003c/strong> /ˌpʌblɪk ˈhɒlədeɪ/ AmE /ˌpʌblɪk ˈhɑːlədeɪ/ [C; A2]","gloss":"státní svátek","example":"Most schools and banks typically remain closed on an official public holiday."},{"head":"\u003cstrong>get together\u003c/strong> (phrasal verb; B1)","gloss":"sejít se (rodina, přátelé)","example":"Thanksgiving is an occasion when families get together across the United States."},{"head":"\u003cstrong>open presents\u003c/strong> (phrase; A1 + A1)","gloss":"rozbalovat dárky","example":"Children are very excited before they open presents under the Christmas tree."},{"head":"\u003cstrong>carol\u003c/strong> /ˈkærəl/ [C; slovo k tématu, C1]","gloss":"vánoční koleda","example":"Singing traditional carols around the Christmas tree creates a warm and peaceful mood."},{"head":"\u003cstrong>Christmas atmosphere\u003c/strong> (noun phrase; A1 + B1)","gloss":"vánoční atmosféra","example":"The smell of baking helps to create a wonderful Christmas atmosphere."},{"head":"\u003cstrong>Thanksgiving\u003c/strong> /ˌθæŋksˈɡɪvɪŋ/ [proper noun; vlastní jméno, Oxford B1]","gloss":"Den díkůvzdání (čtvrtý čtvrtek v listopadu v USA)","example":"Families across America travel long distances to share roast turkey on Thanksgiving."},{"head":"\u003cstrong>Independence Day\u003c/strong> /ˌɪndɪˈpendəns deɪ/ [proper noun; vlastní jméno, Oxford C1]","gloss":"Den nezávislosti (4. července v USA)","example":"Americans celebrate Independence Day with outdoor barbecues and picnics."},{"head":"\u003cstrong>Guy Fawkes Night\u003c/strong> [proper noun; vlastní jméno, Oxford bez úrovně]","gloss":"Noc Guye Fawkese (5. listopadu ve Velké Británii)","example":"On Guy Fawkes Night, British people light large outdoor fires."},{"head":"\u003cstrong>the Gunpowder Plot\u003c/strong> [proper noun; vlastní jméno, bez úrovně]","gloss":"Spiknutí střelného prachu (nezdařené, 1605)","example":"People remember how the Gunpowder Plot failed in 1605."},{"head":"\u003cstrong>Easter\u003c/strong> [proper noun; vlastní jméno, Oxford B1]","gloss":"Velikonoce","example":"At Czech Easter, girls paint eggs in bright colours."},{"head":"\u003cstrong>Easter egg\u003c/strong> /ˈiːstər eɡ/ [C; slovo k tématu, B2]","gloss":"velikonoční vajíčko, kraslice (v anglosaském světě často čokoládové či barvené vařené vajíčko určené ke hledání – \u003cem>egg hunt\u003c/em>)","example":"Decorating boiled Easter eggs is an art that needs care and takes a lot of time."},{"head":"\u003cstrong>braided willow rod\u003c/strong> (willow /ˈwɪləʊ/; rod /rɒd/ AmE /rɑːd/) [C; slovo k tématu, C2] (Czech: \u003cem>pomlázka\u003c/em>)","gloss":"pomlázka (spletená z vrbového proutí)","example":"On Easter Monday morning, boys visit girls with a traditional braided willow rod."},{"head":"\u003cstrong>costume\u003c/strong> /ˈkɒstjuːm/ AmE /ˈkɑːstuːm/ [C; B1]","gloss":"kostým, maškarní převlek (POZOR na falešného přítele: dámský společenský/pracovní kostým je \u003cem>suit\u003c/em> nebo \u003cem>trouser suit\u003c/em>)","example":"Children love wearing scary costumes for Halloween."},{"head":"\u003cstrong>Halloween\u003c/strong> [proper noun; vlastní jméno, Oxford B2]","gloss":"Halloween","example":"People celebrate Halloween in the USA."},{"head":"\u003cstrong>All Souls' Day\u003c/strong> [proper noun; vlastní jméno, bez úrovně]","gloss":"Dušičky (Památka zesnulých)","example":"In the Czech Republic, people remember the dead on All Souls' Day."},{"head":"\u003cstrong>St Patrick's Day\u003c/strong> [proper noun; vlastní jméno, Oxford bez úrovně]","gloss":"svátek svatého Patrika","example":"In Dublin, people wear green clothes to celebrate St Patrick's Day."},{"head":"\u003cstrong>fried carp\u003c/strong> (fried /fraɪd/; carp /kɑːp/ AmE /kɑːrp/) [U; slovo k tématu, bez úrovně]","gloss":"smažený kapr (POZOR: \u003cem>roast\u003c/em> znamená pečený v troubě, \u003cem>fried\u003c/em> je smažený na pánvi)","example":"Fried carp with potato salad is the most typical Czech Christmas Eve meal."},{"head":"\u003cstrong>Boxing Day\u003c/strong> /ˈbɒksɪŋ deɪ/ AmE /ˈbɑːksɪŋ deɪ/ [proper noun; vlastní jméno, Oxford C2]","gloss":"26. prosinec (ve Velké Británii a Commonwealthu)","example":"In Great Britain, December 26th is Boxing Day, often a day for sales and sport."}],"answer":["Holidays and family \u003cstrong>traditions\u003c/strong> play an important role in every society. They help families to \u003cstrong>get together\u003c/strong> throughout the year. In the Czech Republic, \u003cstrong>Christmas\u003c/strong> is definitely the holiday that people love most. Unlike the English-speaking world where Santa brings gifts on \u003cstrong>Christmas Day\u003c/strong> morning, Czech families gather on \u003cstrong>Christmas Eve\u003c/strong>. We prepare a \u003cstrong>Christmas\u003c/strong> dinner of \u003cstrong>fried carp\u003c/strong> and potato salad. We listen to traditional \u003cstrong>carols\u003c/strong> and \u003cstrong>open presents\u003c/strong> under the tree. The warm and peaceful \u003cstrong>Christmas atmosphere\u003c/strong> makes this holiday so special for me.","In the United States, \u003cstrong>Thanksgiving\u003c/strong> in late November is perhaps even more important than \u003cstrong>Christmas\u003c/strong>. Families all over the country \u003cstrong>get together\u003c/strong> for a big meal with roast turkey to show that they are grateful. \u003cstrong>Independence Day\u003c/strong> on July 4th is famous for barbecues, parades and fireworks. In Britain, \u003cstrong>Guy Fawkes Night\u003c/strong> is on November 5th. People gather around a large outdoor fire to remember how \u003cstrong>the Gunpowder Plot\u003c/strong> failed in 1605.","At Czech \u003cstrong>Easter\u003c/strong>, boys carry \u003cstrong>braided willow rods\u003c/strong>, and girls paint \u003cstrong>Easter eggs\u003c/strong> in bright colours. Some people say that holidays are now too much about money. But people still enjoy sharing a good meal and keeping \u003cstrong>customs\u003c/strong> from generation to generation."],"questions":[{"cat":"Popis","text":"How do Czech families typically spend Christmas Eve from morning until evening?"},{"cat":"Srovnání","text":"How are British Christmas customs different from Czech holiday traditions?"},{"cat":"Zkušenost","text":"Which holiday or cultural festival do you look forward to the most every year?"},{"cat":"Názor","text":"Why do some people feel that modern holidays have lost their original meaning? \u003cem>(holidays that are now too much about money)\u003c/em>"},{"cat":"Popis","text":"How did Thanksgiving begin in the United States? \u003cem>(why it is important)\u003c/em>"},{"cat":"Hypotéza","text":"How would you explain the Czech Easter braided willow rod to an international visitor? \u003cem>(its meaning and what it is a symbol of)\u003c/em>"},{"cat":"Srovnání","text":"How does Halloween in the USA compare with All Souls' Day in the Czech Republic? \u003cem>(All Souls' Day = Dušičky)\u003c/em>"}],"phrases":[{"head":"\u003cstrong>Traditions have a special place in our culture because...\u003c/strong>","gloss":"Tradice mají v naší kultuře zvláštní místo, protože...","note":"vyjádření významu"},{"head":"\u003cstrong>The most special thing about this celebration is...\u003c/strong>","gloss":"Nejvýjimečnější na této oslavě je...","note":"vyzdvižení zvláštnosti"},{"head":"\u003cstrong>When I compare this with Czech customs,...\u003c/strong>","gloss":"Když to srovnám s českými zvyky...","note":"srovnání kultur"},{"head":"\u003cstrong>It is an occasion for families to...\u003c/strong>","gloss":"Je to příležitost pro rodiny, aby...","note":"funkce svátku"},{"head":"\u003cstrong>This event started in...\u003c/strong>","gloss":"Tato událost vznikla v...","note":"historický původ"},{"head":"\u003cstrong>The most interesting thing about this holiday for me is...\u003c/strong>","gloss":"Nejzajímavější je pro mě na tomto svátku...","note":"osobní postřeh"},{"head":"\u003cstrong>In conclusion, although traditions develop over time, they still...\u003c/strong>","gloss":"Závěrem: ačkoliv se tradice v čase vyvíjejí, stále...","note":"závěr"}]},"codes":["SSO 2","SSO 22","CR 13a","CR 18a"],"groups":["cr","sso"],"rank":{"cr":26,"sso":4,"all":4}},{"file":"tema-s4-place-where-i-live-study.md","title":"Place where I live/study","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu.","vocab":[{"head":"\u003cstrong>commute to / from\u003c/strong> (commute /kəˈmjuːt/) (verb)","gloss":"dojíždět do / z","example":"Many students commute to České Budějovice from surrounding villages every morning."},{"head":"\u003cstrong>suburb\u003c/strong> /ˈsʌbɜːb/ AmE /ˈsʌbɜːrb/ [C]","gloss":"předměstí, okrajová část města","example":"They decided to move to a quiet suburb where children can play outside safely."},{"head":"\u003cstrong>amenities\u003c/strong> [plural]","gloss":"občanská vybavenost, služby a zázemí (sportoviště, knihovny, obchody apod.)","example":"Our neighbourhood offers excellent amenities, including a library, a post office, and a sports centre."},{"head":"\u003cstrong>hustle and bustle\u003c/strong> (hustle /ˈhʌsl/; bustle /ˈbʌsl/) [U]","gloss":"shon a ruch","example":"After a hectic week in the hustle and bustle of the town centre, I enjoy relaxing in nature."},{"head":"\u003cstrong>picturesque\u003c/strong> /ˌpɪktʃəˈresk/ (adjective)","gloss":"malebný","example":"South Bohemia is famous for its picturesque countryside and historic ponds."},{"head":"\u003cstrong>housing estate\u003c/strong> /ˈhaʊzɪŋ ɪsteɪt/ [C]","gloss":"sídliště","example":"I grew up in a block of flats on a lively housing estate near the park."},{"head":"\u003cstrong>within walking distance\u003c/strong> (walking /ˈwɔːkɪŋ/) (phrase)","gloss":"v docházkové vzdálenosti","example":"My secondary school is located within walking distance of the train station."},{"head":"\u003cstrong>public transport\u003c/strong> /ˌpʌblɪk ˈtrænspɔːt/ AmE /ˌpʌblɪk ˈtrænspɔːrt/ [U]","gloss":"městská hromadná doprava, veřejná doprava","example":"Taking public transport is usually much faster than driving during peak traffic."},{"head":"\u003cstrong>historic centre\u003c/strong> [C]","gloss":"historické centrum","example":"Tourists love strolling through the historic centre with its cobblestone streets and old town hall."},{"head":"\u003cstrong>residential area\u003c/strong> (residential /ˌrezɪˈdenʃl/) [C]","gloss":"obytná čtvrť, rezidenční oblast","example":"Heavy lorries are not allowed to enter this peaceful residential area."},{"head":"\u003cstrong>surroundings\u003c/strong> /səˈraʊndɪŋz/ [plural]","gloss":"okolí, prostředí","example":"The school has pleasant green surroundings where students spend their lunch breaks."},{"head":"\u003cstrong>rush hour\u003c/strong> /ˈrʌʃ aʊə(r)/ AmE /ˈrʌʃ aʊər/ [C/U]","gloss":"dopravní špička (v jednotném čísle se členem \u003cem>the rush hour\u003c/em> i nepočitatelně \u003cem>during rush hour\u003c/em>)","example":"Buses are regularly packed with commuters during the morning rush hour."},{"head":"\u003cstrong>green space\u003c/strong> [C/U]","gloss":"zeleň, zelené prostranství","example":"Town planners should create more green space so that residents have places to exercise."},{"head":"\u003cstrong>hometown\u003c/strong> [C]","gloss":"rodné město","example":"Even if I study abroad one day, I will always consider České Budějovice my hometown."},{"head":"\u003cstrong>landmark\u003c/strong> /ˈlændmɑːk/ AmE /ˈlændmɑːrk/ [C]","gloss":"dominanta, významný orientační bod","example":"The Black Tower is undoubtedly the most recognizable landmark of the town."},{"head":"\u003cstrong>overcrowded\u003c/strong> /ˌəʊvəˈkraʊdɪd/ AmE /ˌəʊvərˈkraʊdɪd/ (adjective)","gloss":"přelidněný, přeplněný","example":"In the middle of the afternoon, the main square gets quite overcrowded with shoppers and visitors."},{"head":"\u003cstrong>secondary school\u003c/strong> /ˈsekəndri skuːl/ AmE /ˈsekənderi skuːl/ [C]","gloss":"střední škola","example":"Attending a demanding secondary school requires careful time management."},{"head":"\u003cstrong>facilities\u003c/strong> [plural]","gloss":"zařízení, vybavení","example":"Our school provides modern facilities, such as updated science laboratories and a gym."},{"head":"\u003cstrong>traffic jam\u003c/strong> /ˈtræfɪk dʒæm/ [C]","gloss":"dopravní zácpa","example":"Drivers frequently get stuck in a traffic jam when crossing the main bridge."},{"head":"\u003cstrong>detached house\u003c/strong> (detached /dɪˈtætʃt/) [C]","gloss":"samostatně stojící rodinný dům","example":"My grandparents live in a cosy detached house with a large vegetable garden."},{"head":"\u003cstrong>pedestrian zone\u003c/strong> (pedestrian /pəˈdestriən/; zone /zəʊn/) [C]","gloss":"pěší zóna","example":"The main street was recently turned into a pedestrian zone full of outdoor cafés."},{"head":"\u003cstrong>lively\u003c/strong> /ˈlaɪvli/ (adjective)","gloss":"živý, rušný","example":"The square becomes particularly lively during the annual Christmas market."}],"answer":["I live in South Bohemia and I study at a \u003cstrong>secondary school\u003c/strong> located near the heart of České Budějovice. My family lives in a quiet \u003cstrong>residential area\u003c/strong> on the edge of the town, in a comfortable \u003cstrong>detached house\u003c/strong>. What I value most about our neighbourhood is that we have plenty of \u003cstrong>green space\u003c/strong> and parks nearby, which gives us a calm break from daily stress. At the same time, we do not feel cut off, because all essential \u003cstrong>amenities\u003c/strong>, like sports grounds, a library, and shops, are \u003cstrong>within walking distance\u003c/strong>.","Every weekday morning, my routine revolves around my journey to school. Because our house is located a bit further out, I rely on \u003cstrong>public transport\u003c/strong>. During the morning \u003cstrong>rush hour\u003c/strong>, buses can be somewhat \u003cstrong>overcrowded\u003c/strong>, and occasionally we get stuck in a \u003cstrong>traffic jam\u003c/strong> near the river. Even so, taking the bus allows me to review my notes or listen to music before lessons begin.","Our school itself has great \u003cstrong>facilities\u003c/strong>, including modern classrooms and sports grounds. Since it stands close to the \u003cstrong>historic centre\u003c/strong>, my classmates and I often spend our free periods in the nearby \u003cstrong>pedestrian zone\u003c/strong>. České Budějovice is a great place to study; it is not as overwhelming as Prague, but it is certainly \u003cstrong>lively\u003c/strong> enough and it is a wonderful \u003cstrong>hometown\u003c/strong> for me. On weekends, I love exploring the \u003cstrong>picturesque surroundings\u003c/strong>, whether that means cycling along the river Vltava or visiting Hluboká castle. In short, I really like having a quiet home while studying in an energetic town. It gives me a great balance between schoolwork and an active social life."],"answer_info":"","questions":[{"cat":"Popis","text":"How would you describe the area where your house or flat is situated to someone who has never been there?"},{"cat":"Srovnání","text":"In what ways does living in a large housing estate differ from living in a detached house in the countryside?"},{"cat":"Zkušenost","text":"How do you usually spend your time during your daily journey to school?"},{"cat":"Názor","text":"Why do many teenagers feel that small villages do not offer enough opportunities for their free time?"},{"cat":"Hypotéza","text":"If your local council gave you the budget to improve your neighbourhood, what specific changes would you introduce?"},{"cat":"Srovnání","text":"What are the advantages and drawbacks of studying in a regional town compared to studying in the capital city?"},{"cat":"Názor / budoucnost","text":"Where do you see yourself living once you finish your education and start your career, and what factors will influence your choice?"}],"phrases":[{"head":"\u003cstrong>To tell you the truth,...\u003c/strong>","gloss":"Abych řekl pravdu,...","note":"osobní komentář / úvod"},{"head":"\u003cstrong>What I appreciate most about my neighbourhood is...\u003c/strong>","gloss":"Co na svém okolí oceňuji nejvíce, je...","note":"vyzdvižení kladu"},{"head":"\u003cstrong>It is conveniently located because...\u003c/strong>","gloss":"Má výhodnou polohu, protože...","note":"odůvodnění polohy"},{"head":"\u003cstrong>On the downside,...\u003c/strong>","gloss":"Stinnou stránkou / nevýhodou je to, že...","note":"uvedení záporu"},{"head":"\u003cstrong>When you compare the two,...\u003c/strong>","gloss":"Když obě možnosti porovnáte,...","note":"srovnání"},{"head":"\u003cstrong>Generally speaking, life here is rather...\u003c/strong>","gloss":"Obecně vzato je zde život poměrně...","note":"zobecnění"},{"head":"\u003cstrong>All in all, I wouldn't change my current living situation because...\u003c/strong>","gloss":"Celkově vzato bych své současné bydlení neměnil, protože...","note":"závěrečné shrnutí"}],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>commute to / from\u003c/strong> (commute /kəˈmjuːt/) (verb; B1)","gloss":"dojíždět do / z","example":"Many students commute to České Budějovice from villages around the town every morning."},{"head":"\u003cstrong>housing estate\u003c/strong> /ˈhaʊzɪŋ ɪsteɪt/ [C; slovo k tématu, B2]","gloss":"sídliště","example":"I grew up in a block of flats on a housing estate near the park."},{"head":"\u003cstrong>within walking distance\u003c/strong> (walking /ˈwɔːkɪŋ/) (phrase; B1)","gloss":"v docházkové vzdálenosti","example":"My secondary school is located within walking distance of the train station."},{"head":"\u003cstrong>public transport\u003c/strong> /ˌpʌblɪk ˈtrænspɔːt/ AmE /ˌpʌblɪk ˈtrænspɔːrt/ [U; A2]","gloss":"městská hromadná doprava, veřejná doprava","example":"Taking public transport is usually much faster than driving when the traffic is heaviest."},{"head":"\u003cstrong>historic centre\u003c/strong> [C; B1]","gloss":"historické centrum","example":"Tourists love walking slowly through the historic centre with its old town hall."},{"head":"\u003cstrong>green space\u003c/strong> [C/U; A1 + A2]","gloss":"zeleň, zelené prostranství","example":"More green space should be created so that local people have places to exercise."},{"head":"\u003cstrong>crowded\u003c/strong> (adjective; A2)","gloss":"přeplněný, plný lidí","example":"In the afternoon, the square gets too crowded with shoppers and visitors."},{"head":"\u003cstrong>secondary school\u003c/strong> /ˈsekəndri skuːl/ AmE /ˈsekənderi skuːl/ [C; B1]","gloss":"střední škola","example":"If you go to a difficult secondary school, you need to plan your time carefully."},{"head":"\u003cstrong>detached house\u003c/strong> (detached /dɪˈtætʃt/) [C; slovo k tématu, B2]","gloss":"samostatně stojící rodinný dům","example":"My grandparents live in a detached house with a large vegetable garden."},{"head":"\u003cstrong>pedestrian area\u003c/strong> (noun; B1 + A1)","gloss":"pěší zóna","example":"The main street recently became a pedestrian area full of outdoor cafés."},{"head":"\u003cstrong>full of life\u003c/strong> (phrase; A1 + A1 + B1)","gloss":"plný života, živý, rušný","example":"The square becomes particularly full of life during the Christmas market."}],"answer":["I live in South Bohemia, and I study at a \u003cstrong>secondary school\u003c/strong> near the centre of České Budějovice. My family lives in a quiet area on the edge of the town, in a comfortable \u003cstrong>detached house\u003c/strong>. Most of all, I appreciate our neighbourhood because we have plenty of \u003cstrong>green space\u003c/strong> and parks near our house. But all the essential places, like sports grounds, a library and shops, are \u003cstrong>within walking distance\u003c/strong>.","Because our house is a bit further from the centre, I depend on \u003cstrong>public transport\u003c/strong>. In the morning, when many people travel to work and school, buses can be a bit too \u003cstrong>crowded\u003c/strong>.","Our school has modern classrooms and sports grounds. It is close to the \u003cstrong>historic centre\u003c/strong>. So my classmates and I often spend free time between lessons in the \u003cstrong>pedestrian area\u003c/strong> there. České Budějovice is a great place to study. It is certainly \u003cstrong>full of life\u003c/strong>. I also grew up in this wonderful town. I really like that my home is quiet, but my school is in a town full of energy. It gives me a great balance between studying and an active social life."],"questions":[{"cat":"Popis","text":"How would you describe the area where your house or flat is? \u003cem>(to someone who has never been there)\u003c/em>"},{"cat":"Srovnání","text":"How is living in a large housing estate different from living in a detached house? \u003cem>(in the countryside)\u003c/em>"},{"cat":"Zkušenost","text":"How do you usually spend your time during your daily journey to school?"},{"cat":"Názor","text":"Why do many teenagers feel that small villages do not offer enough opportunities? \u003cem>(for their free time)\u003c/em>"},{"cat":"Hypotéza","text":"If you were given money to improve your neighbourhood, what specific changes would you make?"},{"cat":"Srovnání","text":"What are the advantages and disadvantages of studying in a town outside the capital? \u003cem>(how it is different from studying in the capital city)\u003c/em>"},{"cat":"Názor / budoucnost","text":"Where do you see yourself living after you finish your education and start your career? \u003cem>(what factors will influence your choice)\u003c/em>"}],"phrases":[{"head":"\u003cstrong>The truth is that...\u003c/strong>","gloss":"Pravdou je, že...","note":"osobní komentář / úvod"},{"head":"\u003cstrong>Most of all, I appreciate my neighbourhood because...\u003c/strong>","gloss":"Nejvíce ze všeho oceňuji své okolí, protože...","note":"vyzdvižení kladu"},{"head":"\u003cstrong>It is in a convenient place because...\u003c/strong>","gloss":"Má výhodnou polohu, protože...","note":"odůvodnění polohy"},{"head":"\u003cstrong>One disadvantage is that...\u003c/strong>","gloss":"Nevýhodou je to, že...","note":"uvedení záporu"},{"head":"\u003cstrong>When you compare the two,...\u003c/strong>","gloss":"Když obě možnosti porovnáte,...","note":"srovnání"},{"head":"\u003cstrong>Generally, life here is rather...\u003c/strong>","gloss":"Obecně vzato je zde život poměrně...","note":"zobecnění"},{"head":"\u003cstrong>In conclusion, I wouldn't change the place where I live now because...\u003c/strong>","gloss":"Závěrem: své současné bydlení bych neměnil, protože...","note":"závěrečné shrnutí"}]},"codes":["SSO 3","SSO 10","CR 1b"],"groups":["cr","sso"],"rank":{"cr":3,"sso":6,"all":3.5}},{"file":"doplnek-o3-my-town.md","title":"Doplněk: České Budějovice – My Town","label":"Navrhla AI, schválil učitel (7. 11. 2026).","vocab":[{"head":"\u003cstrong>central\u003c/strong> /ˈsentrəl/ (adjective; B1)","gloss":"v centru, centrální (o poloze)","example":"Our map shows the central square of České Budějovice."},{"head":"\u003cstrong>row\u003c/strong> /rəʊ/ AmE /roʊ/ [C; B1]","gloss":"řada (domů, sedadel)","example":"I would photograph a row of houses while walking around the square."},{"head":"\u003cstrong>taste\u003c/strong> /teɪst/ (verb; B1)","gloss":"ochutnat","example":"I like to taste a local dish when I visit a new town."},{"head":"\u003cstrong>visible\u003c/strong> /ˈvɪzəbl/ (adjective; B2)","gloss":"viditelný","example":"I would choose a meeting point that is clearly visible from the bus stop."},{"head":"\u003cstrong>permission\u003c/strong> /pəˈmɪʃn/ AmE /pərˈmɪʃn/ [U; B1]","gloss":"svolení, povolení","example":"I would ask for permission before taking a photograph of someone."},{"head":"\u003cstrong>urban\u003c/strong> /ˈɜːbən/ AmE /ˈɜːrbən/ (adjective; B2)","gloss":"městský","example":"For me, parks and trees are an important part of urban life."},{"head":"\u003cstrong>bench\u003c/strong> /bentʃ/ [C; B2]","gloss":"lavička (dlouhé sedadlo pro několik lidí)","example":"I like sitting on a bench with a friend after school."},{"head":"\u003cstrong>remarkable\u003c/strong> /rɪˈmɑːkəbl/ AmE /rɪˈmɑːrkəbl/ (adjective; B2)","gloss":"pozoruhodný","example":"I think the old square is remarkable because of its shape and historic buildings."}],"answer":["I study in České Budějovice, where the Vltava and Malše rivers meet. King Přemysl Otakar II founded the town in 1265. I would start a visitor's tour in Přemysl Otakar II Square, the \u003cstrong>central\u003c/strong> square. A \u003cstrong>row\u003c/strong> of historic houses is ideal for photographs; I would ask for \u003cstrong>permission\u003c/strong> before photographing people. Samson's Fountain stands in the square. I would choose a clearly \u003cstrong>visible\u003c/strong> meeting point before showing visitors the Black Tower. To me, the centre is \u003cstrong>remarkable\u003c/strong> because it connects history with everyday \u003cstrong>urban\u003c/strong> life. After the walk, we could \u003cstrong>taste\u003c/strong> a local dish. I usually walk to school through quiet streets. After lessons, I sometimes sit on a \u003cstrong>bench\u003c/strong> with friends."],"answer_info":"","questions":[{"cat":"","text":"\u003cstrong>How would you present České Budějovice to someone who has never been there?\u003c/strong> \u003cem>(founder, historic square, Samson’s Fountain, Black Tower, your impression)\u003c/em>"},{"cat":"","text":"\u003cstrong>What is your neighbourhood like, and how do you usually travel to school?\u003c/strong> \u003cem>(housing, streets, transport, distance, places you use)\u003c/em>"},{"cat":"","text":"\u003cstrong>What would you improve in České Budějovice to make everyday life better?\u003c/strong> \u003cem>(safe crossings, public spaces, services, parks, your reasons)\u003c/em>"}],"phrases":[],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>central\u003c/strong> /ˈsentrəl/ (adjective; B1)","gloss":"v centru, centrální (o poloze)","example":"Our map shows the central square of České Budějovice."},{"head":"\u003cstrong>row\u003c/strong> /rəʊ/ AmE /roʊ/ [C; B1]","gloss":"řada (domů, sedadel)","example":"I would photograph a row of houses while I walk around the square."},{"head":"\u003cstrong>taste\u003c/strong> /teɪst/ (verb; A2)","gloss":"ochutnat","example":"I like to taste a local dish when I visit a new town."},{"head":"\u003cstrong>permission\u003c/strong> /pəˈmɪʃn/ AmE /pərˈmɪʃn/ [U; A2]","gloss":"svolení, povolení","example":"I would ask for permission before taking a photograph of someone."},{"head":"\u003cstrong>city life\u003c/strong> (noun phrase; A1 + A1)","gloss":"městský život, život ve městě","example":"For me, parks and trees are an important part of city life."},{"head":"\u003cstrong>impressive\u003c/strong> (adjective; B1)","gloss":"působivý, budící obdiv","example":"I find the old square impressive for its shape and historic buildings."}],"answer":["I study in České Budějovice, where the Vltava and Malše rivers join. King Přemysl Otakar II founded the town in 1265. I would start a tour for visitors in Přemysl Otakar II Square, the \u003cstrong>central\u003c/strong> square. A \u003cstrong>row\u003c/strong> of historic houses is ideal for photographs; I would ask for \u003cstrong>permission\u003c/strong> before photographing people. To me, the centre is \u003cstrong>impressive\u003c/strong> because it connects history with everyday \u003cstrong>city life\u003c/strong>. After the walk, we could \u003cstrong>taste\u003c/strong> a local dish."],"questions":[{"cat":"","text":"\u003cstrong>How would you present České Budějovice to someone who has never been there?\u003c/strong> \u003cem>(who founded the town, historic square, Samson’s Fountain, Black Tower, your impression)\u003c/em>"},{"cat":"","text":"\u003cstrong>How would you describe your neighbourhood?\u003c/strong> \u003cem>(homes, streets, places you use; how you usually travel to school, transport, distance)\u003c/em>"},{"cat":"","text":"\u003cstrong>What would you improve in České Budějovice to make everyday life better?\u003c/strong> \u003cem>(safe places to cross the road, public spaces, services, parks, your reasons)\u003c/em>"}],"phrases":[]},"codes":["SSO 3"],"groups":["sso"],"rank":{"sso":6,"all":6}},{"file":"tema-s13-living-and-housing.md","title":"Living and housing","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu.","vocab":[{"head":"\u003cstrong>detached house\u003c/strong> (detached /dɪˈtætʃt/) [C]","gloss":"samostatně stojící rodinný dům","example":"Living in a detached house with a private garden offers great privacy and freedom."},{"head":"\u003cstrong>semi-detached house\u003c/strong> (semi /ˈsemi/; detached /dɪˈtætʃt/) [C]","gloss":"dvojdomek (dva domy spojené jednou společnou zdí)","example":"Semi-detached houses are extremely common across British suburban neighbourhoods."},{"head":"\u003cstrong>terraced house\u003c/strong> /ˌterəst ˈhaʊs/ [C]","gloss":"řadový dům","example":"Long rows of brick terraced houses are typical of northern English industrial towns."},{"head":"\u003cstrong>block of flats\u003c/strong> [C]","gloss":"bytový dům, činžovní dům (zahrnuje i panelové domy)","example":"Our family lives on the third floor of a newly renovated block of flats."},{"head":"\u003cstrong>mortgage\u003c/strong> /ˈmɔːɡɪdʒ/ AmE /ˈmɔːrɡɪdʒ/ [C]","gloss":"hypotéka","example":"Taking out a thirty-year mortgage is the only realistic way for most young couples to buy a home."},{"head":"\u003cstrong>landlord / landlady\u003c/strong> (landlord /ˈlændlɔːd/ AmE /ˈlændlɔːrd/) [C]","gloss":"pronajímatel / pronajímatelka (majitel bytu či domu)","example":"Our landlord is reasonable and always fixes plumbing problems without delay."},{"head":"\u003cstrong>tenant\u003c/strong> /ˈtenənt/ [C]","gloss":"nájemník","example":"The contract clearly states what rights and responsibilities each tenant has."},{"head":"\u003cstrong>rent\u003c/strong> /rent/ [U]","gloss":"nájemné","example":"Paying monthly rent in a capital city consumes a substantial part of an entry-level salary."},{"head":"\u003cstrong>spacious\u003c/strong> /ˈspeɪʃəs/ (adjective)","gloss":"prostorný","example":"The open-plan living room feels remarkably bright and spacious."},{"head":"\u003cstrong>cramped\u003c/strong> /kræmpt/ (adjective)","gloss":"stísněný","example":"Sharing a small room with two roommates felt cramped and uncomfortable."},{"head":"\u003cstrong>cosy\u003c/strong> /ˈk
