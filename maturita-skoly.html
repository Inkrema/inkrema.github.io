(verb)","gloss":"rozcvičit se, rozehřát se","example":"It is crucial to warm up thoroughly before any demanding exercise."},{"head":"\u003cstrong>injury\u003c/strong> /ˈɪndʒəri/","gloss":"zranění","example":"A sudden muscle injury forced him to take a two-month break from competition."},{"head":"\u003cstrong>coach\u003c/strong> /kəʊtʃ/ AmE /koʊtʃ/","gloss":"trenér","example":"Our basketball coach always motivates us when we are losing a match."},{"head":"\u003cstrong>referee\u003c/strong> /ˌrefəˈriː/","gloss":"rozhodčí (ve fotbale, basketbalu apod.)","example":"The referee made an unpopular decision and awarded a penalty kick."},{"head":"\u003cstrong>tournament\u003c/strong> /ˈtʊənəmənt/ AmE /ˈtʊrnəmənt/","gloss":"turnaj","example":"Our school volleyball team took part in a regional tournament last weekend."},{"head":"\u003cstrong>opponent\u003c/strong> /əˈpəʊnənt/ AmE /əˈpoʊnənt/","gloss":"soupeř, protivník","example":"You must respect your opponent, even if you are confident of victory."},{"head":"\u003cstrong>teammate\u003c/strong> /ˈtiːmmeɪt/","gloss":"spoluhráč","example":"Good communication among teammates is the key to winning team matches."},{"head":"\u003cstrong>pitch\u003c/strong> /pɪtʃ/","gloss":"hřiště (fotbalové, ragbyové)","example":"Heavy rain turned the grass pitch into a muddy swamp."},{"head":"\u003cstrong>court\u003c/strong> /kɔːt/ AmE /kɔːrt/","gloss":"kurt, hřiště (tenisové, basketbalové, florbalové)","example":"The players spent two hours practising their serves on the clay court."},{"head":"\u003cstrong>push oneself to the limit\u003c/strong> (phrase)","gloss":"sáhnout si na dno, jít na doraz","example":"During the final intervals of a race, runners have to push themselves to the limit."},{"head":"\u003cstrong>discipline\u003c/strong> /ˈdɪsəplɪn/ [U]","gloss":"sebekázeň, disciplína","example":"Balancing regular training sessions with schoolwork requires great discipline."},{"head":"\u003cstrong>draw\u003c/strong> /drɔː/","gloss":"remíza","example":"Neither team managed to score in the second half, so the match ended in a draw."},{"head":"\u003cstrong>defeat\u003c/strong> /dɪˈfiːt/ (noun / verb: defeat sb)","gloss":"porážka / porazit někoho","example":"Our local team suffered an unexpected defeat last weekend."},{"head":"\u003cstrong>give up\u003c/strong> (verb)","gloss":"vzdát se","example":"Even when falling behind by ten points, we refused to give up."},{"head":"\u003cstrong>recover from\u003c/strong> (recover /rɪˈkʌvə/ AmE /rɪˈkʌvər/) (verb)","gloss":"zotavit se z","example":"It took her several weeks to recover from a twisted ankle."},{"head":"\u003cstrong>keep fit\u003c/strong> /ˌkiːp ˈfɪt/ (phrase)","gloss":"udržovat se v kondici","example":"Cycling to school every morning is a great way to keep fit."},{"head":"\u003cstrong>protective gear\u003c/strong> (protective /prəˈtektɪv/; gear /ɡɪə(r)/ AmE /ɡɪr/) [U]","gloss":"ochranná výstroj / pomůcky","example":"Ice hockey players must never step onto the ice without full protective gear."},{"head":"\u003cstrong>coordination\u003c/strong> /kəʊˌɔːdɪˈneɪʃn/ AmE /kəʊˌɔːrdɪˈneɪʃn/ [U]","gloss":"koordinace","example":"Table tennis demands rapid reflexes and precise hand-eye coordination."},{"head":"\u003cstrong>participate in\u003c/strong> (participate /pɑːˈtɪsɪpeɪt/ AmE /pɑːrˈtɪsɪpeɪt/) (verb)","gloss":"účastnit se čeho","example":"Over fifty secondary school students decided to participate in the local triathlon."},{"head":"\u003cstrong>cheer sb on\u003c/strong> (cheer /tʃɪə(r)/ AmE /tʃɪr/) (verb)","gloss":"povzbuzovat / fandit někomu","example":"Parents and classmates gathered along the track to cheer the runners on."},{"head":"\u003cstrong>setback\u003c/strong> /ˈsetbæk/","gloss":"překážka, nepříjemná komplikace, dílčí nezdar","example":"He viewed the temporary injury not as a disaster, but as a setback to learn from."}],"answer":["Sport plays a central role in my everyday life. While I enjoy various outdoor activities, my true passion is floorball, which is extremely popular among teenagers in the Czech Republic. I train three times a week with our local youth team and regularly \u003cstrong>participate in\u003c/strong> weekend matches.","For me, playing floorball is the best way to \u003cstrong>keep fit\u003c/strong> and relieve stress after demanding days of study at secondary school. When I arrive at the sports hall, put on my shoes and start to \u003cstrong>warm up\u003c/strong>, all worries about tests and grades simply disappear. The game requires rapid reflexes, good hand-eye \u003cstrong>coordination\u003c/strong>, and solid \u003cstrong>stamina\u003c/strong>, especially during fast counter-attacks. Because it is a dynamic indoor game, you also need reliable \u003cstrong>equipment\u003c/strong>, such as a lightweight stick and comfortable shoes that provide grip on the indoor \u003cstrong>court\u003c/strong>.","Beyond physical health, sport has taught me vital life lessons. Being part of a team means you cannot think only about yourself; you have to trust each \u003cstrong>teammate\u003c/strong> and listen closely to your \u003cstrong>coach\u003c/strong>. We celebrate exciting victories together, but we also learn how to handle a bitter \u003cstrong>defeat\u003c/strong> or a frustrating \u003cstrong>draw\u003c/strong>. A few months ago, I suffered a minor ankle \u003cstrong>injury\u003c/strong>, and having to patiently \u003cstrong>recover from\u003c/strong> it tested my patience and determination. It showed me that training involves unexpected \u003cstrong>setbacks\u003c/strong>, but you must never \u003cstrong>give up\u003c/strong>.","In conclusion, my sport provides me with more than just physical exercise. It teaches personal \u003cstrong>discipline\u003c/strong>, builds lasting friendships, and motivates me to \u003cstrong>work out\u003c/strong> and challenge my limits every single week."],"answer_info":"","questions":[{"cat":"Popis","text":"What specific equipment and facilities are necessary to practice your favourite sport safely and effectively?"},{"cat":"Zkušenost","text":"What was the most memorable match or training session in your sporting life, and what important lesson did it teach you?"},{"cat":"Názor","text":"How difficult is it for Czech secondary school students to balance competitive sports training with academic responsibilities?"},{"cat":"Srovnání","text":"What are the main psychological differences between competing in an individual sport and playing in a team sport?"},{"cat":"Srovnání","text":"How has your attitude towards physical fitness and exercise changed since you entered secondary school?"},{"cat":"Hypotéza","text":"If a serious injury prevented you from playing sports for an entire year, what alternative activities would you pursue to maintain your well-being?"},{"cat":"Názor","text":"In what ways can parents and coaches best help young athletes cope constructively with defeat?"}],"phrases":[{"head":"\u003cstrong>As far as my own experience is concerned,...\u003c/strong>","gloss":"Co se týče mých vlastních zkušeností,...","note":"osobní zkušenost"},{"head":"\u003cstrong>What I find most rewarding about it is...\u003c/strong>","gloss":"Co na tom považuji za nejpřínosnější / nejvíce naplňující, je...","note":"vyjádření hodnoty / pocitu"},{"head":"\u003cstrong>In contrast to individual sports,...\u003c/strong>","gloss":"Na rozdíl od individuálních sportů,...","note":"srovnání"},{"head":"\u003cstrong>For instance, whenever we face...\u003c/strong>","gloss":"Například kdykoliv čelíme...","note":"uvedení konkrétního příkladu"},{"head":"\u003cstrong>On top of that,...\u003c/strong>","gloss":"Kromě toho... / Navíc...","note":"přidání dalšího argumentu"},{"head":"\u003cstrong>Looking back on that situation,...\u003c/strong>","gloss":"Když se na tu situaci podívám zpětně,...","note":"reflexe minulosti"},{"head":"\u003cstrong>To sum up my thoughts,...\u003c/strong>","gloss":"Abych to shrnul / shrnula,...","note":"závěr"}],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>equipment\u003c/strong> /ɪˈkwɪpmənt/ [U; A2]","gloss":"vybavení, výstroj","example":"Good safety equipment is essential for preventing serious injuries."},{"head":"\u003cstrong>work out\u003c/strong> /ˌwɜːk ˈaʊt/ AmE /ˌwɜːrk ˈaʊt/ (verb; A2)","gloss":"cvičit, posilovat","example":"I try to work out at least three times a week to stay fit."},{"head":"\u003cstrong>warm up\u003c/strong> /ˌwɔːm ˈʌp/ AmE /ˌwɔːrm ˈʌp/ (verb; B1 podle učitele)","gloss":"rozcvičit se, rozehřát se","example":"It is very important to warm up before any hard exercise."},{"head":"\u003cstrong>injury\u003c/strong> /ˈɪndʒəri/ (noun; A2)","gloss":"zranění","example":"A sudden muscle injury forced him to take a two-month break from competition."},{"head":"\u003cstrong>coach\u003c/strong> /kəʊtʃ/ AmE /koʊtʃ/ (noun; A2)","gloss":"trenér","example":"Our basketball coach always makes us want to try harder when we are losing a match."},{"head":"\u003cstrong>referee\u003c/strong> /ˌrefəˈriː/ (noun; B1 podle učitele)","gloss":"rozhodčí (ve fotbale, basketbalu apod.)","example":"The referee made a decision that many people did not like."},{"head":"\u003cstrong>opponent\u003c/strong> /əˈpəʊnənt/ AmE /əˈpoʊnənt/ (noun; B1 podle učitele)","gloss":"soupeř, protivník","example":"You must respect your opponent, even if you are confident of winning."},{"head":"\u003cstrong>court\u003c/strong> /kɔːt/ AmE /kɔːrt/ (noun; B1)","gloss":"kurt, hřiště (tenisové, basketbalové, florbalové)","example":"The players spent two hours practising on the court."},{"head":"\u003cstrong>field\u003c/strong> (noun; A2)","gloss":"hřiště (fotbalové, ragbyové)","example":"After heavy rain, the grass field was wet and full of mud."},{"head":"\u003cstrong>team member\u003c/strong> (noun; A1 + A1)","gloss":"člen týmu, spoluhráč","example":"Good communication between team members is the key to winning team matches."},{"head":"\u003cstrong>beat\u003c/strong> (verb; B1)","gloss":"porazit (někoho ve hře nebo soutěži)","example":"Nobody expected it, but our local team was beaten last weekend."},{"head":"\u003cstrong>give up\u003c/strong> (verb; A2)","gloss":"vzdát se","example":"Even when we were ten points behind, we refused to give up."},{"head":"\u003cstrong>get better\u003c/strong> (phrase; A1 + A2)","gloss":"zotavit se, uzdravit se","example":"It took her several weeks to get better after an ankle injury."},{"head":"\u003cstrong>keep fit\u003c/strong> /ˌkiːp ˈfɪt/ (phrase; A1 + A2)","gloss":"udržovat se v kondici","example":"Cycling to school every morning is a great way to keep fit."},{"head":"\u003cstrong>participate in\u003c/strong> (participate /pɑːˈtɪsɪpeɪt/ AmE /pɑːrˈtɪsɪpeɪt/) (verb; B1)","gloss":"účastnit se čeho","example":"Over fifty secondary school students decided to participate in the local triathlon."}],"answer":["Sport plays a central role in my everyday life. My true passion is floorball, which is extremely popular among teenagers in the Czech Republic. I train three times a week with our local team for young players and regularly \u003cstrong>participate in\u003c/strong> weekend matches.","For me, playing floorball is the best way to \u003cstrong>keep fit\u003c/strong> and reduce stress after difficult days. When I arrive at the sports hall and start to \u003cstrong>warm up\u003c/strong>, all worries about tests and grades disappear. The game requires quick reactions. You also need reliable \u003cstrong>equipment\u003c/strong>, such as a light stick and comfortable shoes for the indoor \u003cstrong>court\u003c/strong>.","Sport has also taught me very important life lessons. You have to believe in every \u003cstrong>team member\u003c/strong> and listen carefully to your \u003cstrong>coach\u003c/strong>. We celebrate wins together, but we also learn how to deal with it when other teams \u003cstrong>beat\u003c/strong> us. A few months ago, I had a small ankle \u003cstrong>injury\u003c/strong>, and waiting until I \u003cstrong>got better\u003c/strong> was hard. It showed me that you must never \u003cstrong>give up\u003c/strong>.","In conclusion, my sport provides me with more than physical exercise. It helps me build friendships that last and makes me want to \u003cstrong>work out\u003c/strong> and test my limits every week."],"questions":[{"cat":"Popis","text":"What equipment and places are necessary to practise your favourite sport safely and well?"},{"cat":"Zkušenost","text":"Which match or practice do you remember best? \u003cem>(what important lesson it taught you)\u003c/em>"},{"cat":"Názor","text":"How difficult is it for Czech secondary school students to combine sport and studying? \u003cem>(training for competitions, responsibilities at school)\u003c/em>"},{"cat":"Srovnání","text":"How is competing in an individual sport different from playing in a team sport? \u003cem>(how you think and feel)\u003c/em>"},{"cat":"Srovnání","text":"How has your attitude towards fitness and exercise changed since you started secondary school?"},{"cat":"Hypotéza","text":"If a serious injury stopped you playing sports for a year, what would you do? \u003cem>(other activities to stay healthy and happy)\u003c/em>"},{"cat":"Názor","text":"How can parents and coaches best help young athletes deal with losing? \u003cem>(in a positive way)\u003c/em>"}],"phrases":[{"head":"\u003cstrong>In my own experience,...\u003c/strong>","gloss":"Podle mých vlastních zkušeností,...","note":"osobní zkušenost"},{"head":"\u003cstrong>Most of all, it makes me happy because...\u003c/strong>","gloss":"Nejvíc mě to těší (naplňuje), protože...","note":"vyjádření hodnoty / pocitu"},{"head":"\u003cstrong>Unlike individual sports,...\u003c/strong>","gloss":"Na rozdíl od individuálních sportů,...","note":"srovnání"},{"head":"\u003cstrong>For example, whenever we face...\u003c/strong>","gloss":"Například kdykoliv čelíme...","note":"uvedení konkrétního příkladu"},{"head":"\u003cstrong>In addition,...\u003c/strong>","gloss":"Kromě toho... / Navíc...","note":"přidání dalšího argumentu"},{"head":"\u003cstrong>When I think about that situation now,...\u003c/strong>","gloss":"Když se na tu situaci podívám zpětně,...","note":"reflexe minulosti"},{"head":"\u003cstrong>In conclusion,...\u003c/strong>","gloss":"Závěrem,...","note":"závěr"}]},"codes":["SSO 8","CR 9a"],"groups":["cr","sso"],"rank":{"cr":18,"sso":16,"all":16}},{"file":"doplnek-o8-sports-in-cr.md","title":"Doplněk: Sports in the Czech Republic, Rules and Places to Play","label":"Navrhla AI, schválil učitel (7. 11. 2026).","vocab":[{"head":"\u003cstrong>stick\u003c/strong> /stɪk/ [C; B1]","gloss":"hokejka, hůl","example":"The player used his stick to pass the puck to a teammate."},{"head":"\u003cstrong>helmet\u003c/strong> /ˈhelmɪt/ [C; B2]","gloss":"helma, přilba","example":"Before training, I checked that my helmet fitted properly."},{"head":"\u003cstrong>goalkeeper\u003c/strong> /ˈɡəʊlkiːpə/ AmE /ˈɡoʊlkiːpər/ [C; B1]","gloss":"brankář, brankářka","example":"The goalkeeper stopped the final shot and protected the team's lead."},{"head":"\u003cstrong>defender\u003c/strong> /dɪˈfendə(r)/ AmE /dɪˈfendər/ [C; B2]","gloss":"obránce, obránkyně","example":"A strong defender blocks shots and clears the puck from the defensive zone."},{"head":"\u003cstrong>skate\u003c/strong> /skeɪt/ (verb; B1)","gloss":"bruslit","example":"I learnt to skate at my local ice rink."},{"head":"\u003cstrong>score\u003c/strong> /skɔː(r)/ AmE /skɔːr/ (verb; B1)","gloss":"skórovat, vstřelit gól","example":"The home crowd jumped to their feet when the captain managed to score the winning goal."},{"head":"\u003cstrong>penalty\u003c/strong> /ˈpenəlti/ [C; B2]","gloss":"trest, vyloučení","example":"The player received a minor penalty and had to leave the ice for up to two minutes."},{"head":"\u003cstrong>league\u003c/strong> /liːɡ/ [C; B1]","gloss":"liga","example":"I follow my favourite team's results in the national league."},{"head":"\u003cstrong>trophy\u003c/strong> /ˈtrəʊfi/ AmE /ˈtroʊfi/ [C; B2]","gloss":"trofej, pohár","example":"The captain lifted the trophy while her teammates celebrated."},{"head":"\u003cstrong>victory\u003c/strong> /ˈvɪktəri/ [C or U; B2]","gloss":"vítězství","example":"We celebrated our team's victory after the final match."}],"answer":["In Czechia, I enjoy football, floorball and ice hockey. Football is played on a pitch, and the team that scores more goals wins. In a sports hall, floorball players use sticks and a light ball to \u003cstrong>score\u003c/strong> goals. In hockey, players \u003cstrong>skate\u003c/strong> on an ice rink, wearing a \u003cstrong>helmet\u003c/strong> and holding a \u003cstrong>stick\u003c/strong>. I would play as a \u003cstrong>defender\u003c/strong>. At full strength, each side normally has five skaters and a \u003cstrong>goalkeeper\u003c/strong>. A minor \u003cstrong>penalty\u003c/strong> can mean up to two minutes off the ice. I follow a local \u003cstrong>league\u003c/strong> and hope my team wins a \u003cstrong>trophy\u003c/strong>. Czechia's \u003cstrong>victory\u003c/strong> at the men's world championship in Prague in 2024 is a success I would discuss."],"answer_info":"","questions":[{"cat":"","text":"\u003cstrong>Which Czech sporting achievement would you choose for a school presentation, and why?\u003c/strong> \u003cem>(men's ice hockey gold at Nagano 1998 or the world title in Prague in 2024; explaining your choice)\u003c/em>"},{"cat":"","text":"\u003cstrong>How would you explain the basic rules of international ice hockey to a new spectator?\u003c/strong> \u003cem>(three twenty-minute periods, normal team composition and replacing the goalkeeper, scoring, minor and other penalties)\u003c/em>"},{"cat":"","text":"\u003cstrong>How would you compare the places, equipment and playing positions used in football, floorball and ice hockey?\u003c/strong> \u003cem>(football pitch, sports hall, ice rink; ball or puck, sticks, protective equipment; defender and goalkeeper)\u003c/em>"}],"phrases":[],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>stick\u003c/strong> /stɪk/ [C; B1]","gloss":"hokejka, hůl","example":"The player used his stick to pass to another player in his team."},{"head":"\u003cstrong>goalkeeper\u003c/strong> /ˈɡəʊlkiːpə/ AmE /ˈɡoʊlkiːpər/ [C; B1]","gloss":"brankář, brankářka","example":"At the end, the goalkeeper stopped the other team from scoring and protected the team's lead."},{"head":"\u003cstrong>helmet\u003c/strong> /ˈhelmɪt/ [C; slovo k tématu, B2]","gloss":"helma, přilba","example":"Before training, I checked that my helmet fitted properly."},{"head":"\u003cstrong>skate\u003c/strong> /skeɪt/ (verb; B1)","gloss":"bruslit","example":"I learnt to skate in my town."},{"head":"\u003cstrong>score\u003c/strong> /skɔː(r)/ AmE /skɔːr/ (verb; A2)","gloss":"skórovat, vstřelit gól","example":"The home crowd jumped to their feet when the captain managed to score the winning goal."},{"head":"\u003cstrong>penalty\u003c/strong> /ˈpenəlti/ [C; slovo k tématu, C1]","gloss":"trest, vyloučení","example":"The player received a less serious penalty and had to leave the ice for up to two minutes."},{"head":"\u003cstrong>win\u003c/strong> [C; B1]","gloss":"výhra, vítězství","example":"We celebrated our team's win after the final match."},{"head":"\u003cstrong>World Championship\u003c/strong> [vlastní jméno]","gloss":"mistrovství světa (zde v ledním hokeji)","example":"Czechia won the World Championship in Prague in 2024."}],"answer":["In Czechia, I enjoy football, floorball and ice hockey. Football is played on a field, and the team that \u003cstrong>scores\u003c/strong> more goals wins. Floorball players use \u003cstrong>sticks\u003c/strong> and a light ball in a sports hall. In hockey, players \u003cstrong>skate\u003c/strong> and wear a \u003cstrong>helmet\u003c/strong>. Each side normally has a \u003cstrong>goalkeeper\u003c/strong> and five other players. A less serious \u003cstrong>penalty\u003c/strong> can mean up to two minutes off the ice. I would discuss Czechia's \u003cstrong>win\u003c/strong> at the \u003cstrong>World Championship\u003c/strong> in Prague in 2024."],"questions":[{"cat":"","text":"\u003cstrong>Which Czech success in sport would you choose for a school presentation?\u003c/strong> \u003cem>(men's ice hockey gold at Nagano 1998 or the World Championship in Prague in 2024; explaining your choice)\u003c/em>"},{"cat":"","text":"\u003cstrong>How would you explain the basic rules of international ice hockey?\u003c/strong> \u003cem>(for someone who is watching a game for the first time; three twenty-minute periods, how many players a team normally has on the ice and replacing the goalkeeper, scoring, less serious penalties and other penalties)\u003c/em>"},{"cat":"","text":"\u003cstrong>How would you compare the places and equipment in football, floorball and ice hockey?\u003c/strong> \u003cem>(a football field, a sports hall, a special area of ice; a ball or a puck, sticks, equipment that protects players; what different players do: players who stop the other team from scoring, and goalkeepers)\u003c/em>"}],"phrases":[]},"codes":["SSO 8"],"groups":["sso"],"rank":{"sso":16,"all":16}},{"file":"tema-v1-william-shakespeare.md","title":"William Shakespeare","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu.","vocab":[{"head":"\u003cstrong>playwright\u003c/strong> /ˈpleɪraɪt/ [C]","gloss":"dramatik, autor divadelních her","example":"William Shakespeare is widely celebrated as the greatest playwright in the English language."},{"head":"\u003cstrong>tragedy\u003c/strong> /ˈtrædʒədi/ [C/U]","gloss":"tragédie (žánr i konkrétní hra)","example":"Macbeth is a powerful Jacobean tragedy exploring political ambition and guilt."},{"head":"\u003cstrong>comedy\u003c/strong> /ˈkɒmədi/ AmE /ˈkɑːmədi/ [C/U]","gloss":"komedie (žánr i konkrétní hra)","example":"A Midsummer Night's Dream is a popular romantic comedy full of magic and disguise."},{"head":"\u003cstrong>sonnet\u003c/strong> /ˈsɒnɪt/ AmE /ˈsɑːnɪt/ [C]","gloss":"sonet (báseň o čtrnácti verších)","example":"Shakespeare wrote a celebrated collection of 154 sonnets dealing with love, beauty, and mortality."},{"head":"\u003cstrong>soliloquy\u003c/strong> /səˈlɪləkwi/ [C]","gloss":"jevištní samomluva, dramatický monolog postavy na scéně","example":"Hamlet's famous speech \"To be or not to be\" is the best-known soliloquy in English theatre."},{"head":"\u003cstrong>stage\u003c/strong> /steɪdʒ/ [C]","gloss":"divadelní jeviště","example":"In Elizabethan public theatres, female roles on stage were performed by boy actors."},{"head":"\u003cstrong>Globe Theatre / the Globe\u003c/strong> (globe /ɡləʊb/) [proper noun]","gloss":"divadlo Globe (alžbětinské divadlo s nezastřešeným vnitřním dvorem spojené se Shakespearem)","example":"Audiences in the pit stood around the stage of the Globe Theatre, while wealthier patrons sat in covered galleries."},{"head":"\u003cstrong>the Elizabethan era\u003c/strong> (elizabethan /ɪˌlɪzəˈbiːθn/; era /ˈɪərə/ AmE /ˈɪrə/) [proper noun / U]","gloss":"alžbětinská doba (vláda Alžběty I.; Shakespeare tvořil i v následující jakobínské době)","example":"English drama experienced an extraordinary golden age during the Elizabethan era."},{"head":"\u003cstrong>tragic flaw\u003c/strong> (tragic /ˈtrædʒɪk/; flaw /flɔː/) [C]","gloss":"osudová / tragická slabina hrdiny","example":"Othello's intense jealousy proved to be the tragic flaw that brought about his destruction."},{"head":"\u003cstrong>betrayal\u003c/strong> /bɪˈtreɪəl/ [U/C]","gloss":"zrada","example":"Themes of political ambition and betrayal are central to Roman tragedies like Julius Caesar."},{"head":"\u003cstrong>ambition\u003c/strong> /æmˈbɪʃn/ [U]","gloss":"ctižádost, ctižádostivost","example":"Macbeth's uncontrollable ambition leads him to assassinate King Duncan to seize the throne."},{"head":"\u003cstrong>adaptation\u003c/strong> /ˌædæpˈteɪʃn/ [C]","gloss":"adaptace, zpracování (filmové, divadelní)","example":"Director Baz Luhrmann created a modern film adaptation of Romeo and Juliet in 1996."},{"head":"\u003cstrong>quotation\u003c/strong> /kwəʊˈteɪʃn/ [C]","gloss":"citát","example":"Famous lines, such as \"All the world's a stage\" from As You Like It, have become widely recognized quotations from Shakespeare."},{"head":"\u003cstrong>timeless\u003c/strong> /ˈtaɪmləs/ (adjective)","gloss":"nadčasový","example":"His plays remain timeless because they address universal human emotions like love, greed, and envy."},{"head":"\u003cstrong>acting troupe\u003c/strong> (acting /ˈæktɪŋ/; troupe /truːp/) [C]","gloss":"herecká společnost / divadelní soubor","example":"Shakespeare acted and held shares in the Lord Chamberlain's Men, a prominent London acting troupe."},{"head":"\u003cstrong>jealousy\u003c/strong> /ˈdʒeləsi/ [U]","gloss":"žárlivost","example":"Destructive jealousy consumes Othello after he is manipulated by the villain Iago."},{"head":"\u003cstrong>verse\u003c/strong> /vɜːs/ AmE /vɜːrs/ [U]","gloss":"veršovaná řeč, básnický jazyk / poezie (v divadle protiklad prózy; jednotlivý verš/řádek se v angličtině častěji označuje jako \u003cem>line\u003c/em> [C])","example":"Shakespeare skilfully alternated between rhythmic blank verse and prose, frequently using verse for elevated moments or noble characters."},{"head":"\u003cstrong>rivalry / feud\u003c/strong> (rivalry /ˈraɪvlri/) [U/C]","gloss":"soupeření, rodová nepřátelství (krevní msta)","example":"The bitter feud between the Capulets and Montagues prevents Romeo and Juliet from being together."},{"head":"\u003cstrong>fateful\u003c/strong> /ˈfeɪtfl/ (adjective)","gloss":"osudový","example":"A fateful miscommunication leads the young lovers to their premature deaths in the family tomb."},{"head":"\u003cstrong>performance\u003c/strong> /pəˈfɔːməns/ AmE /pərˈfɔːrməns/ [C]","gloss":"divadelní představení","example":"A live theatre performance of A Midsummer Night's Dream brings magical forest scenes alive."},{"head":"\u003cstrong>masterpiece\u003c/strong> /ˈmɑːstəpiːs/ AmE /ˈmæstərpiːs/ [C]","gloss":"mistrovské dílo","example":"King Lear is regarded by literary scholars as a dramatic masterpiece."},{"head":"\u003cstrong>human nature\u003c/strong> /ˌhjuːmən ˈneɪtʃə(r)/ AmE /ˌhjuːmən ˈneɪtʃər/ [U]","gloss":"lidská přirozenost, lidská povaha","example":"Shakespeare had a deep understanding of the complex contradictions of human nature."}],"answer":["William Shakespeare is celebrated as the greatest \u003cstrong>playwright\u003c/strong> in English literature. Born in Stratford-upon-Avon, he spent much of his professional life in London, writing during both the Elizabethan and Jacobean eras. He was not only a writer, but also an actor and shareholder in an \u003cstrong>acting troupe\u003c/strong> known as the Lord Chamberlain's Men. His company performed many of his greatest works at the \u003cstrong>Globe Theatre\u003c/strong>, a famous open-air playhouse on the Thames.","What makes Shakespeare's work so compelling today is his timeless insight into \u003cstrong>human nature\u003c/strong>. He wrote around thirty-eight plays, including masterpieces in both \u003cstrong>tragedy\u003c/strong> and \u003cstrong>comedy\u003c/strong>, as well as over one hundred and fifty \u003cstrong>sonnets\u003c/strong>. In his tragedies, he examined how internal weaknesses can destroy great people. In \u003cem>Macbeth\u003c/em>, uncontrolled \u003cstrong>ambition\u003c/strong> leads a Scottish nobleman into murder, while \u003cem>Othello\u003c/em> portrays the tragic consequences of obsessive \u003cstrong>jealousy\u003c/strong>. In contrast, comedies like \u003cem>A Midsummer Night's Dream\u003c/em> feature humorous misunderstandings, playful magic, and romantic reconciliation.","In the Czech Republic, Shakespeare has a long tradition of brilliant translations, notably by Martin Hilský, and his plays are regularly staged at the Summer Shakespeare Festival at Prague Castle. For secondary school students, \u003cem>Romeo and Juliet\u003c/em> is usually the most accessible story. The bitter \u003cstrong>rivalry\u003c/strong> between two noble families destroys two young lovers, showing how ancient hatred harms innocent lives. Many everyday expressions and \u003cstrong>quotations\u003c/strong> in modern English are attributed to his dramatic \u003cstrong>verse\u003c/strong>. Whether in live theatre \u003cstrong>performances\u003c/strong> or contemporary film \u003cstrong>adaptations\u003c/strong>, Shakespeare's stories remain truly \u003cstrong>timeless\u003c/strong>."],"answer_info":"","questions":[{"cat":"Popis","text":"What do we know about William Shakespeare's life in Stratford-upon-Avon and his career in London?"},{"cat":"Srovnání","text":"In what ways do Shakespeare's tragedies differ from his romantic comedies in tone and ending?"},{"cat":"Divadelní prostředí","text":"How did the theatre experience at the Globe Theatre differ between groundlings standing in the yard and wealthier visitors in the galleries?"},{"cat":"Osobní reflexe / rozbor","text":"Which Shakespearean play or modern film adaptation has made the strongest impression on you, and why?"},{"cat":"Názor","text":"Why do Shakespeare's plays continue to be studied in schools and staged worldwide four centuries after his death?"},{"cat":"Hypotéza","text":"If Shakespeare were writing for modern cinema or streaming series today, what contemporary themes might inspire his plots?"},{"cat":"Jazykový vliv","text":"How did Shakespeare's writing influence the vocabulary and idioms of the modern English language?"}],"phrases":[{"head":"\u003cstrong>William Shakespeare is widely regarded as...\u003c/strong>","gloss":"William Shakespeare je široce považován za...","note":"uvedení autora"},{"head":"\u003cstrong>His works can be broadly divided into...\u003c/strong>","gloss":"Jeho díla lze obecně rozdělit na...","note":"členění tvorby"},{"head":"\u003cstrong>What makes his plays so memorable is...\u003c/strong>","gloss":"To, proč jsou jeho hry tak zapamatovatelné, je...","note":"vyzdvižení nadčasovosti"},{"head":"\u003cstrong>The main conflict in the story revolves around...\u003c/strong>","gloss":"Hlavní konflikt v příběhu se točí kolem...","note":"popis zápletky"},{"head":"\u003cstrong>A striking example of this theme is...\u003c/strong>","gloss":"Výrazným příkladem tohoto tématu je...","note":"odkaz na hru"},{"head":"\u003cstrong>In addition to that,...\u003c/strong>","gloss":"Kromě toho / Vedle toho...","note":"doplnění myšlenky"},{"head":"\u003cstrong>To conclude, Shakespeare's genius lies in...\u003c/strong>","gloss":"Na závěr, Shakespearův génius spočívá v...","note":"závěrečné shrnutí"}],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>writer of plays\u003c/strong> (noun; A1 + A1)","gloss":"dramatik, autor divadelních her","example":"William Shakespeare is famous as the greatest writer of plays in English."},{"head":"\u003cstrong>tragedy\u003c/strong> /ˈtrædʒədi/ [C/U; slovo k tématu, B2]","gloss":"tragédie (žánr i konkrétní hra)","example":"Macbeth is a powerful Jacobean tragedy about political ambition and feeling guilty."},{"head":"\u003cstrong>comedy\u003c/strong> /ˈkɒmədi/ AmE /ˈkɑːmədi/ [C/U; A2]","gloss":"komedie (žánr i konkrétní hra)","example":"A Midsummer Night's Dream is a popular romantic comedy full of magic."},{"head":"\u003cstrong>sonnet\u003c/strong> /ˈsɒnɪt/ AmE /ˈsɑːnɪt/ [C; slovo k tématu, C2]","gloss":"sonet (báseň o čtrnácti verších)","example":"Shakespeare wrote a famous collection of 154 sonnets about love, beauty and the fact that people die."},{"head":"\u003cstrong>stage\u003c/strong> /steɪdʒ/ [C; A2]","gloss":"divadelní jeviště","example":"In Elizabethan public theatres, female roles on stage were performed by boy actors."},{"head":"\u003cstrong>Globe Theatre / the Globe\u003c/strong> (globe /ɡləʊb/) [proper noun; vlastní jméno, Oxford B2 (globe)]","gloss":"divadlo Globe (alžbětinské divadlo s nezastřešeným vnitřním dvorem spojené se Shakespearem)","example":"Some people stood around the stage of the Globe Theatre, while richer visitors sat under a roof."},{"head":"\u003cstrong>the Elizabethan period\u003c/strong> (elizabethan /ɪˌlɪzəˈbiːθn/) [proper noun; vlastní jméno]","gloss":"alžbětinská doba (vláda Alžběty I.; Shakespeare tvořil i v následující jakobínské době)","example":"English drama had its best years during the Elizabethan period."},{"head":"\u003cstrong>the Jacobean period\u003c/strong> [proper noun; vlastní jméno]","gloss":"jakobínská doba (navazuje na alžbětinskou dobu)","example":"Shakespeare wrote Macbeth in the Jacobean period."},{"head":"\u003cstrong>ambition\u003c/strong> /æmˈbɪʃn/ [U; B1]","gloss":"ctižádost, ctižádostivost","example":"Macbeth's ambition, which he cannot control, leads him to murder King Duncan so that he can become king."},{"head":"\u003cstrong>film version\u003c/strong> (noun; A1 + B1)","gloss":"filmová adaptace, filmové zpracování","example":"In 1996, Luhrmann made a modern film version of Romeo and Juliet."},{"head":"\u003cstrong>quotation\u003c/strong> /kwəʊˈteɪʃn/ [C; B1]","gloss":"citát","example":"Famous lines, such as \"All the world's a stage\" from As You Like It, have become well-known quotations from Shakespeare."},{"head":"\u003cstrong>theatre company\u003c/strong> (noun; A1 + A2)","gloss":"herecká společnost / divadelní soubor","example":"Shakespeare acted in and owned part of a theatre company in London."},{"head":"\u003cstrong>the Lord Chamberlain's Men\u003c/strong> [proper noun; vlastní jméno]","gloss":"Služebníci lorda komořího (Shakespearova herecká společnost)","example":"The Lord Chamberlain's Men were a theatre company in London."},{"head":"\u003cstrong>the Summer Shakespeare Festival\u003c/strong> [proper noun; vlastní jméno]","gloss":"Letní shakespearovské slavnosti","example":"Shakespeare's plays are performed at the Summer Shakespeare Festival at Prague Castle."},{"head":"\u003cstrong>jealousy\u003c/strong> /ˈdʒeləsi/ [U; slovo k tématu, B2]","gloss":"žárlivost","example":"Jealousy destroys Othello after the bad character Iago tricks him."},{"head":"\u003cstrong>performance\u003c/strong> /pəˈfɔːməns/ AmE /pərˈfɔːrməns/ [C; B1]","gloss":"divadelní představení","example":"A live theatre performance of A Midsummer Night's Dream makes the magic forest scenes feel real."},{"head":"\u003cstrong>human nature\u003c/strong> /ˌhjuːmən ˈneɪtʃə(r)/ AmE /ˌhjuːmən ˈneɪtʃər/ [U; A2]","gloss":"lidská přirozenost, lidská povaha","example":"Shakespeare understood human nature very well."}],"answer":["William Shakespeare is famous as the greatest \u003cstrong>writer of plays\u003c/strong> in English literature. He was born in Stratford-upon-Avon but spent much of his working life in London. He wrote during \u003cstrong>the Elizabethan period\u003c/strong> and also in \u003cstrong>the Jacobean period\u003c/strong>. He was also an actor and owned part of a \u003cstrong>theatre company\u003c/strong>, \u003cstrong>the Lord Chamberlain's Men\u003c/strong>. The company performed many of his greatest plays at the \u003cstrong>Globe Theatre\u003c/strong>.","His work is still very interesting today because he understood \u003cstrong>human nature\u003c/strong> so well. He wrote around thirty-eight plays, including great works of both \u003cstrong>tragedy\u003c/strong> and \u003cstrong>comedy\u003c/strong>, and over one hundred and fifty \u003cstrong>sonnets\u003c/strong>. In \u003cem>Macbeth\u003c/em>, \u003cstrong>ambition\u003c/strong> without limits leads a Scottish man to murder. \u003cem>Othello\u003c/em> shows the terrible results of \u003cstrong>jealousy\u003c/strong> that a man cannot control. However, \u003cstrong>comedies\u003c/strong> like \u003cem>A Midsummer Night's Dream\u003c/em> are funny and full of magic.","In the Czech Republic, his plays are regularly performed at \u003cstrong>the Summer Shakespeare Festival\u003c/strong> at Prague Castle. In \u003cem>Romeo and Juliet\u003c/em>, the fight between two families destroys two young lovers. People say that many everyday expressions and \u003cstrong>quotations\u003c/strong> in modern English come from his plays. In live theatre \u003cstrong>performances\u003c/strong> and modern \u003cstrong>film versions\u003c/strong>, his stories never seem old-fashioned."],"questions":[{"cat":"Popis","text":"What do we know about William Shakespeare's life in Stratford-upon-Avon and his career in London?"},{"cat":"Srovnání","text":"How are Shakespeare's tragedies different from his romantic comedies? \u003cem>(how serious or funny they are, how they end)\u003c/em>"},{"cat":"Divadelní prostředí","text":"How was the experience at the Globe Theatre different for poorer and richer visitors? \u003cem>(people who stood around the stage, visitors who sat under a roof)\u003c/em>"},{"cat":"Osobní reflexe / rozbor","text":"Which play by Shakespeare or modern film version has made the strongest impression on you? \u003cem>(your reasons)\u003c/em>"},{"cat":"Názor","text":"Why are Shakespeare's plays still studied in schools and performed all over the world? \u003cem>(four hundred years after his death)\u003c/em>"},{"cat":"Hypotéza","text":"If Shakespeare wrote for modern cinema or online series, what themes might he choose? \u003cem>(themes from today's world for his stories)\u003c/em>"},{"cat":"Jazykový vliv","text":"How did Shakespeare's writing influence the vocabulary and expressions of modern English?"}],"phrases":[{"head":"\u003cstrong>Many people think that William Shakespeare is...\u003c/strong>","gloss":"Mnoho lidí si myslí, že William Shakespeare je...","note":"uvedení autora"},{"head":"\u003cstrong>His works can be divided into...\u003c/strong>","gloss":"Jeho díla lze rozdělit na...","note":"členění tvorby"},{"head":"\u003cstrong>His plays are so easy to remember because...\u003c/strong>","gloss":"Jeho hry jsou tak zapamatovatelné, protože...","note":"vyzdvižení nadčasovosti"},{"head":"\u003cstrong>In the story, the main fight is between...\u003c/strong>","gloss":"V příběhu je hlavní spor mezi...","note":"popis zápletky"},{"head":"\u003cstrong>A very clear example of this theme is...\u003c/strong>","gloss":"Velmi jasným příkladem tohoto tématu je...","note":"odkaz na hru"},{"head":"\u003cstrong>In addition to that,...\u003c/strong>","gloss":"Kromě toho / Vedle toho...","note":"doplnění myšlenky"},{"head":"\u003cstrong>In conclusion, Shakespeare's great talent is that...\u003c/strong>","gloss":"Na závěr: Shakespearův velký talent je v tom, že...","note":"závěrečné shrnutí"}]},"codes":["SSO 9"],"groups":["sso"],"rank":{"sso":18,"all":18}},{"file":"tema-s10-arts-and-entertainment.md","title":"Arts and entertainment, likes and hobbies","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu.","vocab":[{"head":"\u003cstrong>exhibition\u003c/strong> /ˌeksɪˈbɪʃn/ [C]","gloss":"výstava","example":"The Aleš South Bohemian Gallery regularly hosts an inspiring exhibition of visual arts."},{"head":"\u003cstrong>live performance\u003c/strong> [C]","gloss":"živé vystoupení","example":"Nothing compares to the raw energy of watching a rock band give a live performance on stage."},{"head":"\u003cstrong>audience\u003c/strong> /ˈɔːdiəns/ [C, collective]","gloss":"publikum, diváci","example":"The enthusiastic audience gave the actors a standing ovation at the end of the musical."},{"head":"\u003cstrong>creative outlet\u003c/strong> (outlet /ˈaʊtlet/) [C]","gloss":"tvůrčí ventil, způsob kreativního vyjádření","example":"Painting watercolours in the evening provides a wonderful creative outlet after a stressful day."},{"head":"\u003cstrong>catchy tune\u003c/strong> (catchy /ˈkætʃi/; tune /tjuːn/ AmE /tuːn/) [C]","gloss":"chytlavá melodie","example":"The pop song has such a catchy tune that people cannot stop humming it all morning."},{"head":"\u003cstrong>streaming service\u003c/strong> /ˈstriːmɪŋ sɜːvɪs/ AmE /ˈstriːmɪŋ sɜːrvɪs/ [C]","gloss":"streamovací služba","example":"Subscribing to a digital streaming service gives subscribers instant access to thousands of movies and songs."},{"head":"\u003cstrong>stage\u003c/strong> /steɪdʒ/ [C]","gloss":"jeviště, scéna, koncertní pódium","example":"When the lead guitarist stepped onto the stage, the crowd erupted in cheers."},{"head":"\u003cstrong>visual arts\u003c/strong> (visual /ˈvɪʒuəl/) [plural / the visual arts]","gloss":"výtvarné umění","example":"Students interested in the visual arts often visit historic galleries and sculptors' studios."},{"head":"\u003cstrong>passion for\u003c/strong> (passion /ˈpæʃn/) [C/U]","gloss":"vášeň pro, nadšení pro","example":"Ever since childhood, he has had a deep passion for playing the acoustic guitar."},{"head":"\u003cstrong>take up a hobby\u003c/strong> (phrase)","gloss":"začít se věnovat koníčku","example":"During the autumn term, I decided to take up a new hobby and registered for photography classes."},{"head":"\u003cstrong>unwind\u003c/strong> /ˌʌnˈwaɪnd/ (verb)","gloss":"odreagovat se, uvolnit se","example":"Listening to acoustic melodies is one of the best ways to unwind after finishing your homework."},{"head":"\u003cstrong>gig\u003c/strong> /ɡɪɡ/ [C, informal]","gloss":"koncert, živé hudební vystoupení","example":"Local bands often play small gigs in pub cellars on Friday nights."},{"head":"\u003cstrong>leisure time\u003c/strong> [U]","gloss":"volný čas","example":"Between demanding classes and exam preparation, finding quality leisure time is a genuine challenge."},{"head":"\u003cstrong>binge-watch\u003c/strong> (binge /bɪndʒ/) (verb)","gloss":"zhlédnout více dílů na jeden zátah","example":"It is tempting to binge-watch an entire season of a drama series over a single weekend."},{"head":"\u003cstrong>performer\u003c/strong> /pəˈfɔːmə/ AmE /pərˈfɔːrmər/ [C]","gloss":"účinkující, interpret, umělec","example":"A talented street performer gathered a fascinated circle of onlookers in the square."},{"head":"\u003cstrong>applause\u003c/strong> /əˈplɔːz/ [U]","gloss":"potlesk","example":"The pianist bowed deeply as thunderous applause echoed across the concert hall."},{"head":"\u003cstrong>stand-up comedy\u003c/strong> [U]","gloss":"stand-up komedie","example":"Going to a stand-up comedy club is a great way to enjoy sharp humour with friends."},{"head":"\u003cstrong>recreation\u003c/strong> /ˌrekriˈeɪʃn/ [U]","gloss":"odpočinková činnost, volnočasové aktivity (POZOR: neznamená rekreační pobyt!)","example":"Outdoor recreation, such as hill walking or canoeing, refreshes both body and mind."},{"head":"\u003cstrong>enthusiast\u003c/strong> /ɪnˈθjuːziæst/ AmE /ɪnˈθuːziæst/ [C]","gloss":"nadšenec","example":"As a dedicated cinema enthusiast, she rarely misses an independent film screening."},{"head":"\u003cstrong>lyrics\u003c/strong> /ˈlɪrɪks/ [plural]","gloss":"text písně (v angličtině množné číslo: \u003cem>the lyrics are\u003c/em>)","example":"I pay close attention to song lyrics because thoughtful poetry makes music far more meaningful."},{"head":"\u003cstrong>art gallery\u003c/strong> /ˈɑːt ɡæləri/ AmE /ˈɑːrt ɡæləri/ [C]","gloss":"umělecká galerie","example":"Admission to the national art gallery is often discounted for secondary students."},{"head":"\u003cstrong>soundtrack\u003c/strong> /ˈsaʊndtræk/ [C]","gloss":"filmový soundtrack, hudební doprovod","example":"The dramatic orchestral soundtrack elevated the emotional impact of the movie."}],"answer":["Outside of school and daily homework, arts and hobbies are vital because they allow us to \u003cstrong>unwind\u003c/strong> and recharge our mental energy. For me, having a personal \u003cstrong>passion for\u003c/strong> creative activities is not just a pleasant distraction; it serves as a healthy \u003cstrong>creative outlet\u003c/strong>. Whether through music, visual arts, or sports, our personal hobbies define who we are outside the classroom.","Music plays the biggest role in my daily routine. Like most teenagers, I use a digital \u003cstrong>streaming service\u003c/strong> to listen to playlists while studying or travelling on the bus. However, recorded tracks cannot match the excitement of a \u003cstrong>live performance\u003c/strong>. Attending a local \u003cstrong>gig\u003c/strong> or a summer music festival, seeing the musicians step onto the \u003cstrong>stage\u003c/strong>, and sharing the vibrant atmosphere with an energetic \u003cstrong>audience\u003c/strong> is an unforgettable experience. I also appreciate good \u003cstrong>lyrics\u003c/strong> and melodies that stay in your head for days.","Beyond music, cinema and digital entertainment take up a lot of our \u003cstrong>leisure time\u003c/strong>. While it is very easy to \u003cstrong>binge-watch\u003c/strong> an entire series on a Friday night, I still love visiting the cinema for the big-screen experience and immersive \u003cstrong>soundtrack\u003c/strong>. On weekends, I try to balance screen time with active pursuits. Recently, I decided to \u003cstrong>take up a hobby\u003c/strong> in analogue photography. Taking my camera on trips around South Bohemia encourages me to slow down, look at details, and visit the occasional photography \u003cstrong>exhibition\u003c/strong> in an \u003cstrong>art gallery\u003c/strong>. Ultimately, engaging with arts and having fun with meaningful hobbies helps us maintain a balanced lifestyle."],"answer_info":"","questions":[{"cat":"Popis","text":"How do you typically like to spend your free time when you want to relax after a challenging school week?"},{"cat":"Srovnání","text":"In what ways does experiencing a live theatrical or musical performance differ from watching a stream at home?"},{"cat":"Zkušenost","text":"What was the most memorable cultural event, concert, or exhibition you have ever attended?"},{"cat":"Názor","text":"Why do some critics argue that binge-watching TV shows is replacing more active or creative hobbies among teenagers?"},{"cat":"Hypotéza","text":"If you had unlimited resources and free time for one year, what brand-new skill or art form would you pursue?"},{"cat":"Srovnání","text":"How do traditional forms of entertainment, like going to the theatre or art galleries, compete with digital gaming and social media for young audiences?"},{"cat":"Názor","text":"Why do you think governments should or should not support classical arts and museums with public funds?"}],"phrases":[{"head":"\u003cstrong>Whenever I feel the need to switch off,...\u003c/strong>","gloss":"Kdykoli cítím potřebu vypnout,...","note":"uvolnění a relaxace"},{"head":"\u003cstrong>Music is an integral part of my daily life because...\u003c/strong>","gloss":"Hudba je nedílnou součástí mého života, protože...","note":"vyjádření významu"},{"head":"\u003cstrong>There is an undeniable magic about...\u003c/strong>","gloss":"Je nepopiratelné kouzlo na...","note":"vyzdvižení atmosféry"},{"head":"\u003cstrong>From my personal standpoint,...\u003c/strong>","gloss":"Z mého osobního hlediska...","note":"vyjádření postoje"},{"head":"\u003cstrong>It allows me to broaden my horizons by...\u003c/strong>","gloss":"Umožňuje mi to rozšířit si obzory tím, že...","note":"rozvoj osobnosti"},{"head":"\u003cstrong>On the other side of the coin,...\u003c/strong>","gloss":"Na druhé straně mince,...","note":"uvedení opačného aspektu"},{"head":"\u003cstrong>To sum up my thoughts, hobbies are essential because...\u003c/strong>","gloss":"Abych shrnul své myšlenky, koníčky jsou nezbytné, protože...","note":"závěr"}],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>exhibition\u003c/strong> /ˌeksɪˈbɪʃn/ [C; B1]","gloss":"výstava","example":"The Aleš South Bohemian Gallery regularly holds an art exhibition."},{"head":"\u003cs ry students."}],"answer":["Outside of school and daily homework, arts and hobbies are essential. They allow us to \u003cstrong>switch off\u003c/strong> and get new mental energy. For me, having a personal \u003cstrong>passion for\u003c/strong> creative activities is a healthy way to express myself.","Music plays the biggest role in my daily routine. Like most teenagers, I use an online service to listen to music while I study or travel on the bus. However, recorded songs are not as exciting as a \u003cstrong>live performance\u003c/strong>. Attending a local concert or a music festival in summer is an unforgettable experience. You see the musicians walk onto the \u003cstrong>stage\u003c/strong> and share the atmosphere with an \u003cstrong>audience\u003c/strong> full of energy.","Apart from music, cinema and digital entertainment take up a lot of our \u003cstrong>leisure time\u003c/strong>. It is very easy to watch a whole series on a Friday night. However, I still love visiting the cinema for the big screen. Recently, I decided to \u003cstrong>take up a hobby\u003c/strong>: taking photos with a film camera. Taking my camera on trips around South Bohemia encourages me to slow down and look at details. It also encourages me to visit a photography \u003cstrong>exhibition\u003c/strong> in an \u003cstrong>art gallery\u003c/strong> sometimes."],"questions":[{"cat":"Popis","text":"How do you typically like to relax after a difficult school week?"},{"cat":"Srovnání","text":"How is a live theatre or musical performance different from watching it online?"},{"cat":"Zkušenost","text":"Which cultural event, concert or exhibition that you have attended do you remember best?"},{"cat":"Názor","text":"Why do some critics argue that watching many TV episodes without stopping is replacing hobbies? \u003cem>(more active or creative hobbies among teenagers)\u003c/em>"},{"cat":"Hypotéza","text":"What would you learn if money and time were no problem? \u003cem>(for one year; a completely
