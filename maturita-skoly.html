he city could do to make public spaces better."},{"head":"\u003cstrong>tunnel\u003c/strong> /ˈtʌnl/ [C; B1]","gloss":"tunel","example":"I sometimes feel nervous when a train enters a long, dark tunnel."},{"head":"\u003cstrong>escalator\u003c/strong> /ˈeskəleɪtə/ AmE /ˈeskəleɪtər/ [C; B2]","gloss":"eskalátor, pohyblivé schody","example":"I hold the handrail when using an escalator in a busy station."},{"head":"\u003cstrong>cab\u003c/strong> /kæb/ [C; B1]","gloss":"taxi, taxík (zejm. tradiční londýnský \u003cem>black cab\u003c/em>)","example":"If I were tired after sightseeing, I might take a cab back to my hotel."},{"head":"\u003cstrong>route\u003c/strong> /ruːt/ AmE /raʊt/ [C; B1]","gloss":"trasa, linka","example":"I would check the bus route carefully before starting a journey across London."}],"answer":["London is the capital of the United Kingdom and lies on the River Thames. As a secondary school student in České Budějovice, I would like to visit London because I could combine historic buildings, art and entertainment in one trip. I would plan my days by area to avoid spending too much time travelling.","Buckingham Palace is an official royal residence in London. Outside the \u003cstrong>palace\u003c/strong>, I would ask a \u003cstrong>guard\u003c/strong> where visitors are allowed to stand. Another place I would like to see is the Houses of Parliament. Their famous clock \u003cstrong>tower\u003c/strong> is called the Elizabeth Tower, and Big Ben is the name of the large \u003cstrong>bell\u003c/strong> inside it.","St Paul's Cathedral was designed by the \u003cstrong>architect\u003c/strong> Christopher Wren. I would also visit the Tower of London, which has served as both a fortress and a \u003cstrong>prison\u003c/strong>. Walking along the \u003cstrong>bank\u003c/strong> of the Thames would give me time to enjoy the city between visits.","For art, I would choose the National Gallery on Trafalgar Square. Admission to its permanent \u003cstrong>collection\u003c/strong> is free, although some exhibitions charge a fee. The gallery would be the main \u003cstrong>attraction\u003c/strong> of my trip, and free entry would help me stay within my budget. In the evening, I would enjoy a \u003cstrong>musical\u003c/strong>, but I would compare ticket prices before booking.","For transport, I could use the Underground, also called the Tube, or a bus. Oyster and contactless cards are accepted on both. If I took a cab, I would check its fare and payment options before getting in. My ideal visit would balance sightseeing with time to relax."],"answer_info":"","questions":[{"cat":"","text":"\u003cstrong>Which three London sights would you include in a one-day itinerary, and why?\u003c/strong> \u003cem>(Buckingham Palace, Elizabeth Tower, St Paul’s Cathedral, Tower of London, National Gallery)\u003c/em>"},{"cat":"","text":"\u003cstrong>How would you prepare a visit to London on a student budget?\u003c/strong> \u003cem>(transport, accommodation, food, permanent collection at the National Gallery, paid exhibitions)\u003c/em>"},{"cat":"","text":"\u003cstrong>What would you like to learn about the history of the Tower of London?\u003c/strong> \u003cem>(its different uses, life in a fortress or prison, questions to research before visiting)\u003c/em>"},{"cat":"","text":"\u003cstrong>How would you choose between the Tube, a bus, walking and a cab?\u003c/strong> \u003cem>(distance, time, prices, mobility needs, cab fares and payment options)\u003c/em>"},{"cat":"","text":"\u003cstrong>How would you spend a rainy day in London?\u003c/strong> \u003cem>(art, a musical, a café, booking tickets, changing plans)\u003c/em>"},{"cat":"","text":"\u003cstrong>What differences would you expect between visiting London and Prague?\u003c/strong> \u003cem>(your experience or expectations; transport, buildings, language, budget)\u003c/em>"},{"cat":"","text":"\u003cstrong>How could London make sightseeing easier for visitors with different needs?\u003c/strong> \u003cem>(clear signs, accessible information, places to rest, helpful staff)\u003c/em>"}],"phrases":[{"head":"\u003cstrong>walk along the bank of the River Thames\u003c/strong>","gloss":"procházet se po břehu Temže","note":""},{"head":"\u003cstrong>ask where visitors are allowed to stand\u003c/strong>","gloss":"zeptat se, kde mohou návštěvníci stát","note":""},{"head":"\u003cstrong>admission to the permanent collection is free\u003c/strong>","gloss":"vstup do stálé sbírky je zdarma","note":""},{"head":"\u003cstrong>check the price before booking\u003c/strong>","gloss":"zjistit cenu před rezervací","note":""},{"head":"\u003cstrong>pay with an Oyster or contactless card\u003c/strong>","gloss":"zaplatit kartou Oyster nebo bezkontaktní kartou","note":""},{"head":"\u003cstrong>check cab payment options before getting in\u003c/strong>","gloss":"zjistit možnosti platby za taxi před nastoupením","note":""},{"head":"\u003cstrong>balance sightseeing with time to relax\u003c/strong>","gloss":"vyvážit prohlížení památek časem na odpočinek","note":""}],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>royal\u003c/strong> /ˈrɔɪəl/ (adjective; B1)","gloss":"královský","example":"I would include a royal home in my plan for a visit to London."},{"head":"\u003cstrong>palace\u003c/strong> /ˈpæləs/ [C; A2]","gloss":"palác, zámek (sídlo panovníka)","example":"Buckingham Palace is an official royal palace in London."},{"head":"\u003cstrong>guard\u003c/strong> /ɡɑːd/ AmE /ɡɑːrd/ [C; B1]","gloss":"stráž, strážce","example":"I would ask a guard where visitors should wait before entering the building."},{"head":"\u003cstrong>tower\u003c/strong> /ˈtaʊə/ AmE /ˈtaʊər/ [C; A2]","gloss":"věž","example":"The clock tower at the Houses of Parliament is called the Elizabeth Tower."},{"head":"\u003cstrong>bell\u003c/strong> /bel/ [C; B1]","gloss":"zvon","example":"Big Ben is the name of the large bell inside the Elizabeth Tower."},{"head":"\u003cstrong>prison\u003c/strong> /ˈprɪzn/ [C or U; A2]","gloss":"vězení, věznice","example":"The Tower of London has been used as a prison."},{"head":"\u003cstrong>architect\u003c/strong> /ˈɑːkɪtekt/ AmE /ˈɑːrkɪtekt/ [C; A2]","gloss":"architekt, architektka","example":"Christopher Wren was the architect who designed St Paul's Cathedral."},{"head":"\u003cstrong>statue\u003c/strong> /ˈstætʃuː/ [C; B1]","gloss":"socha","example":"I like to draw a statue from several sides before taking a photograph."},{"head":"\u003cstrong>sculpture\u003c/strong> /ˈskʌlptʃə/ AmE /ˈskʌlptʃər/ [U; B1]","gloss":"sochařství","example":"I enjoy sculpture as much as painting when I visit an art museum."},{"head":"\u003cstrong>collection\u003c/strong> /kəˈlekʃn/ [C; B1]","gloss":"sbírka","example":"The National Gallery has a collection of paintings that I would like to see."},{"head":"\u003cstrong>musical\u003c/strong> /ˈmjuːzɪkl/ [C; B1]","gloss":"muzikál","example":"I would like to see a musical, especially one with songs I already know."},{"head":"\u003cstrong>attraction\u003c/strong> /əˈtrækʃn/ [C; B1]","gloss":"atrakce, lákadlo, zajímavost","example":"For me, an art museum would be the main attraction of a city trip."},{"head":"\u003cstrong>bank\u003c/strong> /bæŋk/ [C; B1]","gloss":"břeh (řeky)","example":"I would enjoy walking along the bank of the Thames on a sunny day."},{"head":"\u003cstrong>route\u003c/strong> /ruːt/ AmE /raʊt/ [C; A2]","gloss":"trasa, linka","example":"I would check the bus route carefully before starting a journey across London."}],"answer":["London is the capital of the United Kingdom and is on the River Thames. I am a secondary school student in České Budějovice. I would like to visit London because I could combine historic buildings, art and entertainment in one trip.","Buckingham Palace is an official \u003cstrong>royal\u003c/strong> home in London. Outside the \u003cstrong>palace\u003c/strong>, I would ask a \u003cstrong>guard\u003c/strong> where visitors are allowed to stand. The clock \u003cstrong>tower\u003c/strong> of the Houses of Parliament is called the Elizabeth Tower. Big Ben is the name of the large \u003cstrong>bell\u003c/strong> inside it.","St Paul's Cathedral was designed by the \u003cstrong>architect\u003c/strong> Christopher Wren. I would visit the Tower of London, which has been used as a fortress and a \u003cstrong>prison\u003c/strong>. Between visits, I would walk along the \u003cstrong>bank\u003c/strong> of the Thames.","For art, I would choose the National Gallery on Trafalgar Square. Entry to its \u003cstrong>collection\u003c/strong> is free, although you have to pay for some exhibitions. The gallery would be the main \u003cstrong>attraction\u003c/strong> of my trip. In the evening, I would enjoy a \u003cstrong>musical\u003c/strong>, but I would compare ticket prices before booking.","For transport, I could use the Underground, which is called the Tube, or a bus. Oyster and contactless cards are accepted on both."],"questions":[{"cat":"","text":"\u003cstrong>Which three London sights would you include in a one-day plan?\u003c/strong> \u003cem>(Buckingham Palace, Elizabeth Tower, St Paul’s Cathedral, Tower of London, National Gallery; your reasons)\u003c/em>"},{"cat":"","text":"\u003cstrong>How would you prepare a visit to London as a student with little money?\u003c/strong> \u003cem>(transport, accommodation, food, the collection at the National Gallery, exhibitions you pay for)\u003c/em>"},{"cat":"","text":"\u003cstrong>What would you like to learn about the history of the Tower of London?\u003c/strong> \u003cem>(its different uses, life in a fortress or prison, questions to research before visiting)\u003c/em>"},{"cat":"","text":"\u003cstrong>How would you choose between the Tube, a bus, walking and a taxi?\u003c/strong> \u003cem>(distance, time, prices, how easily you can move around, taxi prices and payment options)\u003c/em>"},{"cat":"","text":"\u003cstrong>How would you spend a rainy day in London?\u003c/strong> \u003cem>(art, a musical, a café, booking tickets, changing plans)\u003c/em>"},{"cat":"","text":"\u003cstrong>What differences would you expect between visiting London and Prague?\u003c/strong> \u003cem>(your experience or what you expect; transport, buildings, language, how much you can spend)\u003c/em>"},{"cat":"","text":"\u003cstrong>How could London make sightseeing easier for visitors with different needs?\u003c/strong> \u003cem>(clear signs, information that everyone can use, places to rest, helpful staff)\u003c/em>"}],"phrases":[{"head":"\u003cstrong>walk along the bank of the River Thames\u003c/strong>","gloss":"procházet se po břehu Temže","note":""},{"head":"\u003cstrong>ask where visitors are allowed to stand\u003c/strong>","gloss":"zeptat se, kde mohou návštěvníci stát","note":""},{"head":"\u003cstrong>entry to the collection is free\u003c/strong>","gloss":"vstup do sbírky je zdarma","note":""},{"head":"\u003cstrong>check the price before booking\u003c/strong>","gloss":"zjistit cenu před rezervací","note":""},{"head":"\u003cstrong>pay with an Oyster card\u003c/strong>","gloss":"zaplatit kartou Oyster","note":""},{"head":"\u003cstrong>check how you can pay for a taxi before getting in\u003c/strong>","gloss":"zjistit možnosti platby za taxi před nastoupením","note":""},{"head":"\u003cstrong>balance sightseeing with time to relax\u003c/strong>","gloss":"vyvážit prohlížení památek časem na odpočinek","note":""}]},"codes":["SSO 13","SSO 18","CR 10b"],"groups":["cr","sso"],"rank":{"cr":21,"sso":26,"all":21.5}},{"file":"tema-c7b-prague.md","title":"Prague","label":"Navrhla AI, schválil učitel (7. 11. 2026).","vocab":[{"head":"\u003cstrong>medieval\u003c/strong> /ˌmediˈiːvl/ (adjective; B2)","gloss":"středověký","example":"I would like to learn how people lived in a medieval town."},{"head":"\u003cstrong>kingdom\u003c/strong> /ˈkɪŋdəm/ [C; B2]","gloss":"království","example":"The exhibition could explain how a kingdom was governed in the past."},{"head":"\u003cstrong>found\u003c/strong> /faʊnd/ (verb; B2)","gloss":"založit (město, instituci, organizaci)","example":"Our class would like to found a history society after visiting Prague."},{"head":"\u003cstrong>construct\u003c/strong> /kənˈstrʌkt/ (verb; B2)","gloss":"postavit, vybudovat, zkonstruovat","example":"In our project, we must decide where to construct a new bridge."},{"head":"\u003cstrong>restore\u003c/strong> /rɪˈstɔː(r)/ AmE /rɪˈstɔːr/ (verb; B2)","gloss":"zrestaurovat, obnovit, opravit","example":"I think the city should restore old buildings before they become unsafe."},{"head":"\u003cstrong>decorate\u003c/strong> /ˈdekəreɪt/ (verb; B1)","gloss":"vyzdobit, ozdobit","example":"We could decorate our classroom with photographs from our trip to Prague."},{"head":"\u003cstrong>stone\u003c/strong> /stəʊn/ AmE /stoʊn/ [C or U; B1]","gloss":"kámen (materiál nebo kus kamene)","example":"Charles Bridge was built using large blocks of stone."},{"head":"\u003cstrong>monument\u003c/strong> /ˈmɒnjumənt/ AmE /ˈmɑːnjumənt/ [C; B2]","gloss":"památka, pomník, památník","example":"I would use a printed guide to learn about the history of a monument."},{"head":"\u003cstrong>surround\u003c/strong> /səˈraʊnd/ (verb; B1)","gloss":"obklopovat, obepínat","example":"In my drawing, trees surround a quiet square with an old church."},{"head":"\u003cstrong>slope\u003c/strong> /sləʊp/ AmE /sloʊp/ [C; B2]","gloss":"svah, úbočí kopce","example":"I would choose a gentle slope for our walk rather than a steep hill."},{"head":"\u003cstrong>pavement\u003c/strong> /ˈpeɪvmənt/ [C or U; B1]","gloss":"chodník (britská angličtina)","example":"I always stay on the pavement when walking beside a busy road."},{"head":"\u003cstrong>narrow\u003c/strong> /ˈnærəʊ/ AmE /ˈnæroʊ/ (adjective; B1)","gloss":"úzký","example":"Golden Lane is a row of tiny colourful houses along a narrow castle street."},{"head":"\u003cstrong>winding\u003c/strong> /ˈwaɪndɪŋ/ (adjective; B2)","gloss":"klikatý, vinoucí se","example":"I enjoy exploring winding streets, but I always take a map with me."},{"head":"\u003cstrong>lane\u003c/strong> /leɪn/ [C; B2]","gloss":"ulička, úzká cesta","example":"We could take a quiet lane instead of walking beside the main road."},{"head":"\u003cstrong>charming\u003c/strong> /ˈtʃɑːmɪŋ/ AmE /ˈtʃɑːrmɪŋ/ (adjective; B1)","gloss":"okouzlující, půvabný","example":"To me, a small café in an old street can be very charming."},{"head":"\u003cstrong>peaceful\u003c/strong> /ˈpiːsfl/ (adjective; B1)","gloss":"klidný, pokojný","example":"I would like to find a peaceful place to sit after the tour."},{"head":"\u003cstrong>admire\u003c/strong> /ədˈmaɪə(r)/ AmE /ədˈmaɪər/ (verb; B1)","gloss":"obdivovat","example":"I would stop on Charles Bridge to admire the view of the city."},{"head":"\u003cstrong>column\u003c/strong> /ˈkɒləm/ AmE /ˈkɑːləm/ [C; B2]","gloss":"sloup, pilíř","example":"In our sketch, a tall stone column supports the roof above the entrance."},{"head":"\u003cstrong>display\u003c/strong> /dɪˈspleɪ/ (verb; B1)","gloss":"vystavovat, ukazovat (veřejnosti)","example":"Our class could display photographs of Prague in the school entrance hall."},{"head":"\u003cstrong>cemetery\u003c/strong> /ˈsemətri/ AmE /ˈseməteri/ [C; B2]","gloss":"hřbitov","example":"When visiting a cemetery, I keep quiet and respect the people around me."},{"head":"\u003cstrong>legend\u003c/strong> /ˈledʒənd/ [C or U; B2]","gloss":"legenda, pověst","example":"I would enjoy hearing an old legend about a castle or its surroundings."},{"head":"\u003cstrong>cellar\u003c/strong> /ˈselə/ AmE /ˈselər/ [C; B2]","gloss":"sklep, sklepení (místnost pod přízemím)","example":"In our story, the old house has a cool cellar beneath the kitchen."},{"head":"\u003cstrong>guide\u003c/strong> /ɡaɪd/ [C; B1]","gloss":"průvodce (kniha s informacemi)","example":"I would buy a printed guide to Prague and mark the places I want to visit."},{"head":"\u003cstrong>souvenir\u003c/strong> /ˌsuːvəˈnɪə/ AmE /ˌsuːvəˈnɪr/ [C; B1]","gloss":"suvenýr, upomínkový předmět","example":"I would choose a postcard as a souvenir of my first visit to Prague."}],"answer":["Prague is the capital of the Czech Republic and lies on the Vltava River. Its historic centre is on the UNESCO World Heritage List. I would recommend it to someone who enjoys history, architecture and walking. The mixture of \u003cstrong>medieval\u003c/strong> buildings and everyday city life makes it interesting to me.","I would begin at Prague Castle, whose grounds include St Vitus Cathedral and Golden Lane. The small, colourful houses along this \u003cstrong>narrow\u003c/strong> street look especially \u003cstrong>charming\u003c/strong> to me. I would take a printed \u003cstrong>guide\u003c/strong> so that I could learn about the buildings at my own pace.","Next, I would cross Charles Bridge, a historic \u003cstrong>stone\u003c/strong> bridge over the Vltava. I would stop to \u003cstrong>admire\u003c/strong> the view, then continue to Old Town Square and its Astronomical Clock. I would also like to see the National Museum at the top of Wenceslas Square. Instead of buying an expensive \u003cstrong>souvenir\u003c/strong>, I might keep a postcard and write a few notes about the day.","For longer journeys, I could use the metro or a tram. I would plan time for lunch and a \u003cstrong>peaceful\u003c/strong> break, because a full day of sightseeing can be tiring. If I were responsible for tourism, I would help visitors understand why every historic \u003cstrong>monument\u003c/strong> deserves care. Money from tourism could help \u003cstrong>restore\u003c/strong> old buildings. In my opinion, a successful visit should leave time to notice details and respect the people who live there."],"answer_info":"","questions":[{"cat":"","text":"\u003cstrong>How would you plan a one-day walking tour of Prague for a first-time visitor?\u003c/strong> \u003cem>(Prague Castle, Golden Lane, Charles Bridge, Old Town Square; a realistic pace and breaks)\u003c/em>"},{"cat":"","text":"\u003cstrong>Which building or place in Prague interests you most, and what would you like to learn about it?\u003c/strong> \u003cem>(appearance, history, photographs, information in a printed guide)\u003c/em>"},{"cat":"","text":"\u003cstrong>How would you prepare for a trip to Prague if you had a limited budget?\u003c/strong> \u003cem>(transport, food, opening times, admission prices, free time)\u003c/em>"},{"cat":"","text":"\u003cstrong>How would you choose between walking and using Prague's public transport?\u003c/strong> \u003cem>(distance, weather, time, mobility needs, metro and trams)\u003c/em>"},{"cat":"","text":"\u003cstrong>What could a visitor learn by comparing Prague Castle with the streets around Old Town Square?\u003c/strong> \u003cem>(different buildings, functions, atmosphere, details to observe)\u003c/em>"},{"cat":"","text":"\u003cstrong>What problems can large numbers of visitors cause in a historic city, and how could these be reduced?\u003c/strong> \u003cem>(noise, crowded streets, litter, respect for local people)\u003c/em>"},{"cat":"","text":"\u003cstrong>How would you compare a visit to Prague with a day in České Budějovice?\u003c/strong> \u003cem>(your experience or expectations; sights, travel time, pace, costs)\u003c/em>"}],"phrases":[{"head":"\u003cstrong>plan a walking tour of the historic centre\u003c/strong>","gloss":"naplánovat pěší prohlídku historického centra","note":""},{"head":"\u003cstrong>take time to admire the view\u003c/strong>","gloss":"udělat si čas na obdivování výhledu","note":""},{"head":"\u003cstrong>be on the UNESCO World Heritage List\u003c/strong>","gloss":"být na seznamu světového dědictví UNESCO","note":""},{"head":"\u003cstrong>see the Astronomical Clock in Old Town Square\u003c/strong>","gloss":"vidět orloj na Staroměstském náměstí","note":""},{"head":"\u003cstrong>explore the city at my own pace\u003c/strong>","gloss":"prozkoumávat město vlastním tempem","note":""},{"head":"\u003cstrong>respect the people who live there\u003c/strong>","gloss":"respektovat lidi, kteří tam bydlí","note":""},{"head":"\u003cstrong>use the metro or a tram\u003c/strong>","gloss":"jet metrem nebo tramvají","note":""}],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>medieval\u003c/strong> /ˌmediˈiːvl/ (adjective; slovo k tématu, C1)","gloss":"středověký","example":"I would like to learn how people lived in a medieval town."},{"head":"\u003cstrong>set up\u003c/strong> (phrasal verb; B1)","gloss":"založit (spolek, organizaci)","example":"Our class would like to set up a history society."},{"head":"\u003cstrong>decorate\u003c/strong> /ˈdekəreɪt/ (verb; B1)","gloss":"vyzdobit, ozdobit","example":"We could decorate our classroom with photographs from our trip to Prague."},{"head":"\u003cstrong>stone\u003c/strong> /stəʊn/ AmE /stoʊn/ [C or U; A2]","gloss":"kámen (materiál nebo kus kamene)","example":"Charles Bridge was built from large blocks of stone."},{"head":"\u003cstrong>monument\u003c/strong> /ˈmɒnjumənt/ AmE /ˈmɑːnjumənt/ [C; slovo k tématu, B2]","gloss":"památka, pomník, památník","example":"I would use a printed guide to learn about the history of a monument."},{"head":"\u003cstrong>narrow\u003c/strong> /ˈnærəʊ/ AmE /ˈnæroʊ/ (adjective; A2)","gloss":"úzký","example":"Golden Lane is a row of tiny houses in bright colours along a narrow castle street."},{"head":"\u003cstrong>lovely\u003c/strong> (adjective; A2)","gloss":"krásný, půvabný","example":"To me, a small café in an old street can be lovely."},{"head":"\u003cstrong>peaceful\u003c/strong> /ˈpiːsfl/ (adjective; B1)","gloss":"klidný, pokojný","example":"I would like to find a peaceful place to sit after the tour."},{"head":"\u003cstrong>admire\u003c/strong> /ədˈmaɪə(r)/ AmE /ədˈmaɪər/ (verb; B1)","gloss":"obdivovat","example":"I would stop on Charles Bridge to admire the view of the city."},{"head":"\u003cstrong>guide\u003c/strong> /ɡaɪd/ [C; A2]","gloss":"průvodce (kniha s informacemi)","example":"I would buy a printed guide to Prague and mark the places I want to visit."},{"head":"\u003cstrong>souvenir\u003c/strong> /ˌsuːvəˈnɪə/ AmE /ˌsuːvəˈnɪr/ [C; A2]","gloss":"suvenýr, upomínkový předmět","example":"I would choose a postcard as a souvenir of my first visit to Prague."},{"head":"\u003cstrong>UNESCO World Heritage List\u003c/strong> (the UNESCO World Heritage List) [vlastní jméno]","gloss":"Seznam světového dědictví UNESCO","example":"Prague's historic centre is on the UNESCO World Heritage List."}],"answer":["Prague is the capital of the Czech Republic and is on the Vltava River. Its historic centre is on the \u003cstrong>UNESCO World Heritage List\u003c/strong>. I would recommend it to someone who enjoys history, architecture and walking. The mixture of \u003cstrong>medieval\u003c/strong> buildings and everyday city life makes it interesting to me.","I would begin at Prague Castle. St Vitus Cathedral and Golden Lane are part of it. The small houses in bright colours along this \u003cstrong>narrow\u003c/strong> street look especially \u003cstrong>lovely\u003c/strong> to me. I would take a printed \u003cstrong>guide\u003c/strong> to learn about the buildings.","Next, I would cross Charles Bridge, a historic \u003cstrong>stone\u003c/strong> bridge over the Vltava. I would stop to \u003cstrong>admire\u003c/strong> the view, then continue to Old Town Square and its Astronomical Clock. I would also like to see the National Museum at the top of Wenceslas Square. Instead of buying an expensive \u003cstrong>souvenir\u003c/strong>, I might keep a postcard.","For longer journeys, I could use the metro or a tram. I would plan time for lunch and a \u003cstrong>peaceful\u003c/strong> break, because a full day of sightseeing can make you tired. If I were responsible for tourism, I would help visitors understand why every historic \u003cstrong>monument\u003c/strong> should be looked after."],"questions":[{"cat":"","text":"\u003cstrong>How would you plan a one-day walking tour of Prague for a first-time visitor?\u003c/strong> \u003cem>(Prague Castle, Golden Lane, Charles Bridge, Old Town Square; a speed that visitors can manage, and breaks)\u003c/em>"},{"cat":"","text":"\u003cstrong>Which building or place in Prague interests you most?\u003c/strong> \u003cem>(appearance, history, photographs, information in a printed guide; what you would like to learn about it)\u003c/em>"},{"cat":"","text":"\u003cstrong>How would you prepare for a trip to Prague if you had little money?\u003c/strong> \u003cem>(transport, food, opening times, entry prices, free time)\u003c/em>"},{"cat":"","text":"\u003cstrong>How would you choose between walking and using Prague's public transport?\u003c/strong> \u003cem>(distance, weather, time, how easily you can move around, metro and trams)\u003c/em>"},{"cat":"","text":"\u003cstrong>What could visitors learn by comparing Prague Castle with the streets around Old Town Square?\u003c/strong> \u003cem>(different buildings, functions, atmosphere, details to notice)\u003c/em>"},{"cat":"","text":"\u003cstrong>What problems can large numbers of visitors cause in a historic city?\u003c/strong> \u003cem>(noise, crowded streets, rubbish, respect for local people; how the problems could be reduced)\u003c/em>"},{"cat":"","text":"\u003cstrong>How would you compare a visit to Prague with a day in České Budějovice?\u003c/strong> \u003cem>(your experience or what you expect; sights, travel time, costs)\u003c/em>"}],"phrases":[{"head":"\u003cstrong>plan a walking tour of the historic centre\u003c/strong>","gloss":"naplánovat pěší prohlídku historického centra","note":""},{"head":"\u003cstrong>take time to admire the view\u003c/strong>","gloss":"udělat si čas na obdivování výhledu","note":""},{"head":"\u003cstrong>be on the UNESCO World Heritage List\u003c/strong>","gloss":"být na seznamu světového dědictví UNESCO","note":""},{"head":"\u003cstrong>see the Astronomical Clock in Old Town Square\u003c/strong>","gloss":"vidět orloj na Staroměstském náměstí","note":""},{"head":"\u003cstrong>explore the city at my own speed\u003c/strong>","gloss":"prozkoumávat město vlastním tempem","note":""},{"head":"\u003cstrong>respect the people who live there\u003c/strong>","gloss":"respektovat lidi, kteří tam bydlí","note":""},{"head":"\u003cstrong>use the metro or a tram\u003c/strong>","gloss":"jet metrem nebo tramvají","note":""}]},"codes":["SSO 13","CR 7b"],"groups":["cr","sso"],"rank":{"cr":15,"sso":26,"all":15.5}},{"file":"doplnek-o13-transport-prague-london.md","title":"Doplněk: Travelling and Public Transport in Prague and London","label":"Navrhla AI, schválil učitel (7. 11. 2026).","vocab":[{"head":"\u003cstrong>inspector\u003c/strong> /ɪnˈspektə(r)/ AmE /ɪnˈspektər/ [C; B2]","gloss":"revizor, kontrolor","example":"In Prague, a ticket inspector can ask to see a valid travel ticket."},{"head":"\u003cstrong>valid\u003c/strong> /ˈvælɪd/ (adjective; B2)","gloss":"platný (jízdenka, doklad)","example":"I always check that my ticket is valid for the journey I want to make."},{"head":"\u003cstrong>fine\u003c/strong> /faɪn/ [C; B1]","gloss":"pokuta","example":"In Prague, travelling without a valid ticket can result in a fine."},{"head":"\u003cstrong>zone\u003c/strong> /zəʊn/ AmE /zoʊn/ [C; B1]","gloss":"pásmo, zóna (tarifní)","example":"In London, the travel zone is one factor that affects a Tube fare."},{"head":"\u003cstrong>connection\u003c/strong> /kəˈnekʃn/ [C; B2]","gloss":"spoj, přípoj","example":"I would leave enough time to catch my connection if the first train arrived late."},{"head":"\u003cstrong>frequent\u003c/strong> /ˈfriːkwənt/ (adjective; B1)","gloss":"častý (o spojích)","example":"I prefer frequent services because I do not want to wait long at a stop."},{"head":"\u003cstrong>reliable\u003c/strong> /rɪˈlaɪəbl/ (adjective; B1)","gloss":"spolehlivý","example":"For an important journey, I would look for a reliable transport service."},{"head":"\u003cstrong>rail\u003c/strong> /reɪl/ [U; B1]","gloss":"železnice, kolejová doprava","example":"Heathrow and Gatwick both have rail connections to London."},{"head":"\u003cstrong>terminal\u003c/strong> /ˈtɜːmɪnl/ AmE /ˈtɜːrmɪnl/ [C; B2]","gloss":"terminál (letištní, dopravní)","example":"I would check which terminal my flight leaves from before travelling to the airport."},{"head":"\u003cstrong>board\u003c/strong> /bɔːd/ AmE /bɔːrd/ (verb; B1)","gloss":"nastoupit (do autobusu, vlaku, letadla)","example":"I would check the destination before I board a train to the airport."}],"answer":["For a city trip, I would compare trains, coaches and flights. I prefer \u003cstrong>frequent\u003c/strong>, \u003cstrong>reliable\u003c/strong> services. In Prague, I can use the metro or a tram. A ticket \u003cstrong>inspector\u003c/strong> can check whether my ticket is \u003cstrong>valid\u003c/strong>. If it is not, I may have to pay a \u003cstrong>fine\u003c/strong>. Trolleybus 59 connects the airport with Metro A at Nádraží Veleslavín. In London, Tube fares depend partly on the travel \u003cstrong>zone\u003c/strong>, while buses have a flat fare. I can use Oyster or contactless payment on both. Heathrow has Tube and \u003cstrong>rail\u003c/strong> links. Gatwick also has train connections to London. I would check the \u003cstrong>terminal\u003c/strong>, plan each \u003cstrong>connection\u003c/strong>, and \u003cstrong>board\u003c/strong> with time to spare."],"answer_info":"","questions":[{"cat":"","text":"\u003cstrong>How would you prepare to pay for public transport in Prague and London?\u003c/strong> \u003cem>(valid Prague ticket, ticket inspection; Oyster or contactless in London; Tube zones and flat bus fares)\u003c/em>"},{"cat":"","text":"\u003cstrong>How would you choose a means of transport for sightseeing in either city?\u003c/strong> \u003cem>(walking, metro or Tube, tram or bus; weather, budget, time, personal needs)\u003c/em>"},{"cat":"","text":"\u003cstrong>How would you travel from Prague Airport into Prague, and from Heathrow or Gatwick into London?\u003c/strong> \u003cem>(Prague: trolleybus 59 and Metro A; Heathrow: Tube or rail; Gatwick: train; check the exact connection)\u003c/em>"}],"phrases":[],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>zone\u003c/strong> /zəʊn/ AmE /zoʊn/ [C; slovo k tématu, B2]","gloss":"pásmo, zóna (tarifní)","example":"In London, the travel zone is one thing that affects the price of a Tube journey."},{"head":"\u003cstrong>reliable\u003c/strong> /rɪˈlaɪəbl/ (adjective; B1)","gloss":"spolehlivý","example":"For an important journey, I would look for a reliable transport service."},{"head":"\u003cstrong>fine\u003c/strong> /faɪn/ [C; slovo k tématu, C1]","gloss":"pokuta","example":"In Prague, travelling without a ticket that allows it can result in a fine."},{"head":"\u003cstrong>board\u003c/strong> /bɔːd/ AmE /bɔːrd/ (verb; B1)","gloss":"nastoupit (do autobusu, vlaku, letadla)","example":"I would check the destination before I board a train to the airport."},{"head":"\u003cstrong>railway\u003c/strong> (noun; A2)","gloss":"železnice, kolejová doprava","example":"Heathrow and Gatwick both have railway links to London."}],"answer":["On the Prague metro or a tram, my ticket can be checked. Without a ticket that allows me to travel, I may have to pay a \u003cstrong>fine\u003c/strong>. Line 59 connects the airport with Metro A. In London, the travel \u003cstrong>zone\u003c/strong> affects Tube prices, and buses have one price. I can use Oyster or contactless payment on both. Heathrow has Tube and \u003cstrong>railway\u003c/strong> links, and Gatwick has trains to London. I would leave plenty of time to \u003cstrong>board\u003c/strong>."],"questions":[{"cat":"","text":"\u003cstrong>How would you prepare to pay for public transport in Prague and London?\u003c/strong> \u003cem>(a Prague ticket that allows you to travel, ticket checks; Oyster or contactless in London; Tube zones and one price for every bus journey)\u003c/em>"},{"cat":"","text":"\u003cstrong>How would you choose a form of transport for sightseeing in either city?\u003c/strong> \u003cem>(walking, metro or Tube, tram or bus; weather, how much you can spend, time, personal needs)\u003c/em>"},{"cat":"","text":"\u003cstrong>How would you travel into Prague and London from their airports?\u003c/strong> \u003cem>(Prague: line 59 and Metro A; Heathrow: Tube or train; Gatwick: train; check exactly which train or bus to take)\u003c/em>"}],"phrases":[]},"codes":["SSO 13"],"groups":["sso"],"rank":{"sso":26,"all":26}},{"file":"tema-s5-health-and-medical-care.md","title":"Health and medical care / Health and body care","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu.","vocab":[{"head":"\u003cstrong>general practitioner (GP)\u003c/strong> (general practitioner /ˌdʒenrəl prækˈtɪʃənə(r)/ AmE /ˌdʒenrəl prækˈtɪʃənər/) [C]","gloss":"praktický lékař","example":"When you fall ill, your first step is usually to visit your general practitioner."},{"head":"\u003cstrong>prescription\u003c/strong> /prɪˈskrɪpʃn/ [C]","gloss":"lékařský předpis, recept na léky","example":"Antibiotics cannot be bought freely; you always need a prescription from a doctor."},{"head":"\u003cstrong>over-the-counter\u003c/strong> /ˌəʊvə ðə ˈkaʊntə(r)/ AmE /ˌəʊvər ðə ˈkaʊntər/ (adjective / adverb)","gloss":"volně prodejný (bez lékařského předpisu); bez předpisu","example":"You can easily buy over-the-counter painkillers and nasal sprays at any local pharmacy."},{"head":"\u003cstrong>symptom\u003c/strong> /ˈsɪmptəm/ [C]","gloss":"příznak (nemoci), symptom","example":"A persistent dry cough and high fever are common symptoms of respiratory infections."},{"head":"\u003cstrong>recover from\u003c/strong> (recover /rɪˈkʌvə/ AmE /rɪˈkʌvər/) (verb)","gloss":"zotavit se z, uzdravit se z","example":"It took him nearly two weeks to fully recover from the seasonal flu."},{"head":"\u003cstrong>preventative check-up\u003c/strong> [C]","gloss":"preventivní prohlídka","example":"Dentists recommend having a preventative check-up twice a year to detect problems early."},{"head":"\u003cstrong>painkiller\u003c/strong> /ˈpeɪnkɪlə/ AmE /ˈpeɪnkɪlər/ [C]","gloss":"lék proti bolesti","example":"She took a mild painkiller to relieve her throbbing headache."},{"head":"\u003cstrong>balanced diet\u003c/strong> (balanced /ˈbælənst/) [singular/U]","gloss":"vyvážená strava (obvykle se členem: \u003cem>a balanced diet\u003c/em>)","example":"Eating fresh vegetables, fruit, and lean meat helps you maintain a balanced diet."},{"head":"\u003cstrong>contagious\u003c/strong> /kənˈteɪdʒəs/ (adjective)","gloss":"nakažlivý (přenášený přímým kontaktem; širší obecný termín pro infekční je \u003cem>infectious\u003c/em>)","example":"Students with contagious viral infections should stay at home until they are no longer infectious."},{"head":"\u003cstrong>sprain\u003c/strong> /spreɪn/ (verb)","gloss":"podvrtnout si (kloub, např. kotník; vykloubení / vymknutí v kloubním pouzdru je \u003cem>dislocation\u003c/em>)","example":"He accidentally sprained his left ankle during basketball training."},{"head":"\u003cstrong>well-being\u003c/strong> /ˈwel biːɪŋ/ [U]","gloss":"tělesná a duševní pohoda, celkové zdraví","example":"Regular physical activity contributes greatly to your long-term mental and physical well-being."},{"head":"\u003cstrong>sedentary lifestyle\u003c/strong> (sedentary /ˈsedntri/ AmE /ˈsednteri/) [C]","gloss":"sedavý způsob života","example":"Spending eight hours a day in front of a computer screen leads to a sedentary lifestyle."},{"head":"\u003cstrong>immune system\u003c/strong> /ɪˈmjuːn sɪstəm/ [C]","gloss":"imunitní systém","example":"Getting sufficient sleep and regular exercise strengthens your immune system against winter bugs."},{"head":"\u003cstrong>treatment\u003c/strong> /ˈtriːtmənt/ [C/U]","gloss":"léčba, ošetření","example":"Early diagnosis greatly improves the chances that medical treatment will be quick and effective."},{"head":"\u003cstrong>side effect\u003c/strong> /ˈsaɪd ɪfekt/ [C]","gloss":"nežádoucí účinek, vedlejší účinek","example":"Always read the package leaflet to check whether the medication causes any drowsiness or other side effects."},{"head":"\u003cstrong>exhaustion\u003c/strong> /ɪɡˈzɔːstʃən/ [U]","gloss":"vyčerpání","example":"After preparing for intense exam sessions without proper rest, several students suffered from extreme exhaustion."},{"head":"\u003cstrong>cope with stress\u003c/strong> (cope /kəʊp/) (phrase)","gloss":"zvládat stres, vyrovnávat se se stresem","example":"Finding time for hobbies and outdoor walks helps teenagers cope with school stress."},{"head":"\u003cstrong>first aid kit\u003c/strong> /ˌfɜːst ˈeɪd kɪt/ AmE /ˌfɜːrst ˈeɪd kɪt/ [C]","gloss":"lékárnička","example":"Every school and passenger car is equipped with a properly stocked first aid kit."},{"head":"\u003cstrong>ointment\u003c/strong> /ˈɔɪntmənt/ [C/U]","gloss":"léčivá mast","example":"The doctor advised applying an antiseptic ointment to the scratch twice a day."},{"head":"\u003cstrong>surgery\u003c/strong> /ˈsɜːdʒəri/ AmE /ˈsɜːrdʒəri/ [C/U]","gloss":"ordinace lékaře [C]; chirurgie, operativní léčba / zákrok [U]","example":"Patients waited quietly in the waiting room outside the doctor's surgery."},{"head":"\u003cstrong>undergo an operation\u003c/strong> (undergo /ˌʌndəˈɡəʊ/ AmE /ˌʌndərˈɡəʊ/) (phrase)","gloss":"podstoupit operaci","example":"He had to undergo a minor knee operation after tearing a ligament in football."},{"head":"\u003cstrong>body care\u003c/strong> [U]","gloss":"péče o tělo (hygiena a péče o pokožku)","example":"Good body care involves proper hygiene, protecting your skin from the sun, and staying clean."}],"answer":["Maintaining good health is perhaps the most important thing in life, especially during demanding school years. For secondary school students, taking care of our health is not always easy. We spend hours sitting in classrooms and studying for exams, so it is easy to slip into a \u003cstrong>sedentary lifestyle\u003c/strong>. When pressure builds up, lack of sleep and \u003cstrong>exhaustion\u003c/strong> can quickly weaken the \u003cstrong>immune system\u003c/strong>, making us more vulnerable to seasonal bugs.","In my view, staying healthy requires a sensible daily routine rather than extreme measures. I try to combine regular physical exercise with a \u003cstrong>balanced diet\u003c/strong> rich in fruit and vitamins. Physical activity is not just about staying fit; it is also one of the most effective ways to \u003cstrong>cope with stress\u003c/strong> and boost overall mental \u003cstrong>well-being\u003c/strong>. Everyday \u003cstrong>body care\u003c/strong> and hygiene, alongside getting eight to nine hours of restful sleep, help us feel refreshed every morning.","When someone falls ill, our healthcare system provides reliable support. In the Czech Republic, public health insurance covers essential medical care at a doctor's surgery or emergency department. For mild colds or headaches, we can take an \u003cstrong>over-the-counter\u003c/strong> \u003cstrong>painkiller\u003c/strong> and rest in bed. However, for a persistent condition or serious infection, you need to visit your \u003cstrong>general practitioner\u003c/strong>. The doctor performs a check, writes a \u003cstrong>prescription\u003c/strong>, and recommends proper \u003cstrong>treatment\u003c/strong>. I also believe in prevention; attending a regular \u003cstrong>preventative check-up\u003c/strong> can catch hidden issues early. Looking after our health is the best investment in our future."],"answer_info":"","questions":[{"cat":"Popis","text":"What happens when a patient visits their general practitioner with symptoms of a viral infection?"},{"cat":"Zkušenost","text":"How do you personally look after your physical and mental health when you are feeling overwhelmed by schoolwork?"},{"cat":"Srovnání","text":"In what ways do modern lifestyle habits present greater health risks compared to the way our grandparents lived?"},{"cat":"Názor","text":"Why do some people prefer taking over-the-counter painkillers immediately instead of addressing the root causes of their pain?"},{"cat":"Hypotéza","text":"If secondary schools introduced mandatory daily physical exercise sessions, how would that affect students' concentration and well-being?"},{"cat":"Srovnání","text":"What are the differences between universal healthcare funded by public insurance, as in the Czech Republic, and systems that rely heavily on private insurance, such as in the United States?"},{"cat":"Názor / etika","text":"How can society encourage young people to adopt healthier eating habits without making food choices feel restrictive or boring?"}],"phrases":[{"head":"\u003cstrong>As the saying goes, prevention is better than cure.\u003c/strong>","gloss":"Jak se říká, prevence je lepší než léčba.","note":"uvedení obecné zásady"},{"head":"\u003cstrong>From my personal experience,...\u003c/strong>","gloss":"Podle mé osobní zkušenosti...","note":"uvedení příkladu z praxe"},{"head":"\u003cstrong>When it comes to maintaining a healthy lifestyle,...\u003c/strong>","gloss":"Pokud jde o udržování zdravého životního stylu,...","note":"přechod k tématu"},{"head":"\u003cstrong>It is essential to find a balance between...\u003c/strong>","gloss":"Je zásadní najít rovnováhu mezi...","note":"vyvážení dvou aspektů"},{"head":"\u003cstrong>A major concern among teenagers today is...\u003c/strong>","gloss":"Velkou starostí mezi dnešními teenagery je...","note":"uvedení problému"},{"head":"\u003cstrong>On top of that,...\u003c/strong>","gloss":"A navíc / Kromě toho...","note":"přidání dalšího argumentu"},{"head":"\u003cstrong>To put it briefly, staying healthy is about...\u003c/strong>","gloss":"Stručně řečeno, zůstat zdravý znamená především...","note":"závěrečná myšlenka"}],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>family doctor\u003c/strong> (noun; B1)","gloss":"praktický lékař","example":"When you fall ill, you usually visit your family doctor first."},{"head":"\u003cstrong>prescription\u003c/strong> /prɪˈskrɪpʃn/ [C; slovo k tématu, C1]","gloss":"lékařský předpis, recept na léky","example":"Some medicines can only be bought with a prescription from a doctor."},{"head":"\u003cstrong>symptom\u003c/strong> /ˈsɪmptəm/ [C; B1]","gloss":"příznak (nemoci), symptom","example":"A dry cough that does not go away and a high temperature are common symptoms of illnesses that affect breathing."},{"head":"\u003cstrong>get better\u003c/strong> (phrase; A1 + A2)","gloss":"zotavit se, uzdravit se","example":"It took him nearly two weeks to get better after the flu."},{"head":"\u003cstrong>health check\u003c/strong> (noun; B1)","gloss":"preventivní prohlídka (zdravotní kontrola)","example":"Dentists recommend a health check twice a year to find problems early."},{"head":"\u003cstrong>medicine for pain\u003c/strong> (noun phrase; A2 + A1 + A2)","gloss":"lék proti bolesti","example":"She took a mild medicine for pain to make her headache better."},{"head":"\u003cstrong>balanced diet\u003c/strong> (balanced /ˈbælənst/) [singular/U; slovo k tématu, B2]","gloss":"vyvážená strava (obvykle se členem: \u003cem>a balanced diet\u003c/em>)","example":"Eating fresh vegetables, fruit and meat with little fat helps you have a balanced diet."},{"head":"\u003cstrong>health and happiness\u003c/strong> (noun phrase; A1 + B1)","gloss":"tělesná a duševní pohoda, celkové zdraví","example":"Regular physical activity helps your health and happiness a lot."},{"head":"\u003cstrong>immune system\u003c/strong> /ɪˈmjuːn sɪstəm/ [C; slovo k tématu, C2]","gloss":"imunitní systém","example":"Getting enough sleep and regular exercise makes your immune system stronger against winter illnesses."},{"head":"\u003cstrong>treatment\u003c/strong> /ˈtriːtmənt/ [C/U; B1]","gloss":"léčba, ošetření","example":"Finding an illness early makes it much more likely that medical treatment will be quick and effective."},{"head":"\u003cstrong>exhausted\u003c/strong> (adjective; B1)","gloss":"vyčerpaný","example":"After studying for exams without proper rest, several students were completely exhausted."},{"head":"\u003cstrong>deal with stress\u003c/strong> (phrase; A2 + A2)","gloss":"zvládat stres, vyrovnávat se se stresem","example":"Time for hobbies and outdoor walks helps teenagers deal with school stress."},{"head":"\u003cstrong>cream\u003c/strong> (noun; B1)","gloss":"léčivá mast, krém","example":"The doctor advised putting a cream on the skin twice a day."},{"head":"\u003cstrong>have an operation\u003c/strong> (phrase; A1 + B1)","gloss":"podstoupit operaci","example":"He had to have a small knee operation after a football injury."},{"head":"\u003cstrong>body care\u003c/strong> [U; A1 + A2]","gloss":"péče o tělo (hygiena a péče o pokožku)","example":"Good body care involves protecting your skin from the sun and staying clean."}],"answer":["Staying healthy is perhaps the most important thing in life, especially during difficult school years. We spend hours sitting in classrooms and studying for exams. So it is easy to get used to sitting too much. When pressure grows, lack of sleep and being \u003cstrong>exhausted\u003c/strong> can quickly make the \u003cstrong>immune system\u003c/strong> weaker.","In my view, staying healthy requires a sensible daily routine rather than extreme measures. I try to combine regular physical exercise with a \u003cstrong>balanced diet\u003c/strong> that has a lot of fruit. Physical activity is one of the most effective ways to \u003cstrong>deal with stress\u003c/strong> and improve our mental \u003cstrong>health and happiness\u003c/strong>. Everyday \u003cstrong>body care\u003c/strong> and eight to nine hours of sleep help us feel full of energy every morning.","In the Czech Republic, public health insurance pays for essential medical care at the doctor's or in an emergency department. For mild colds or headaches, we can take \u003cstrong>medicine for pain\u003c/strong> and rest in bed. But for a condition that does not go away or a serious infection, you need to visit your \u003cstrong>family doctor\u003c/strong>. The doctor does a check, writes a \u003cstrong>prescription\u003c/strong> and recommends proper \u003cstrong>treatment\u003c/strong>. A regular \u003cstrong>health check\u003c/strong> can find problems early, before we notice them."],"questions":[{"cat":"Popis","text":"What happens when a patient visits their family doctor with symptoms of a virus?"},{"cat":"Zkušenost","text":"How do you personally look after your health when school gives you too much work? \u003cem>(physical and mental health)\u003c/em>"},{"cat":"Srovnání","text":"How are modern lifestyle habits a bigger health risk than our grandparents' way of life?"},{"cat":"Názor","text":"Why do some people take medicine for pain immediately instead of dealing with the cause? \u003cem>(medicine that you can buy without a prescription; the real causes of the pain)\u003c/em>"},{"cat":"Hypotéza","text":"If secondary schools made all students exercise daily, how would that affect them? \u003cem>(how well they can concentrate, their health and happiness)\u003c/em>"},{"cat":"Srovnání","text":"How is the Czech health system different from the American one? \u003cem>(in the Czech Republic, public insurance pays for care for everyone; in the USA, the system depends a lot on private insurance)\u003c/em>"},{"cat":"Názor / etika","text":"How can society encourage young people to develop healthier eating habits? \u003cem>(without making them feel that they cannot always choose what they want, or that food choices are boring)\u003c/em>"}],"phrases":[{"head":"\u003cstrong>As people often say, it is better to stop an illness from happening than to treat it.\u003c/strong>","gloss":"Jak se říká, prevence je lepší než léčba.","note":"uvedení obecné zásady"},{"head":"\u003cstrong>From my personal experience,...\u003c/strong>","gloss":"Podle mé osobní zkušenosti...","note":"uvedení příkladu z praxe"},{"head":"\u003cstrong>When we talk about keeping a healthy lifestyle,...\u003c/strong>","gloss":"Když mluvíme o udržování zdravého životního stylu,...","note":"přechod k tématu"},{"head":"\u003cstrong>It is essential to find a balance between...\u003c/strong>","gloss":"Je zásadní najít rovnováhu mezi...","note":"vyvážení dvou aspektů"},{"head":"\u003cstrong>A major worry among teenagers today is...\u003c/strong>","gloss":"Velkou starostí mezi dnešními teenagery je...","note":"uvedení problému"},{"head":"\u003cstrong>In addition,...\u003c/strong>","gloss":"A navíc / Kromě toho...","note":"přidání dalšího argumentu"},{"head":"\u003cstrong>To say it in a few words, staying healthy is about...\u003c/strong>","gloss":"Stručně řečeno, zůstat zdravý znamená především...","note":"závěrečná myšlenka"}]},"codes":["SSO 14","CR 6a"],"groups":["cr","sso"],"rank":{"cr":12,"sso":28,"all":12.5}},{"file":"tema-o15-c20b-healthy-lifestyle-and-food.md","title":"Healthy Lifestyle and Food","label":"Navrhla AI, schválil učitel (7. 11. 2026).","vocab":[{"head":"\u003cstrong>protein\u003c/strong> /ˈprəʊtiːn/ AmE /ˈproʊtiːn/ [C or U; B2]","gloss":"bílkovina","example":"In class, we compared how much protein different foods contain."},{"head":"\u003cstrong>varied\u003c/strong> /ˈveərid/ AmE /ˈverid/ (adjective; B2)","gloss":"pestrý, rozmanitý","example":"I try to plan varied meals instead of eating the same food every day."},{"head":"\u003cstrong>vitamin\u003c/strong> /ˈvɪtəmɪn/ AmE /ˈvaɪtəmɪn/ [C; B2]","gloss":"vitamín","example":"We discussed vitamin C during a lesson about food."},{"head":"\u003cstrong>fat\u003c/strong> /fæt/ [C or U; B2]","gloss":"tuk (v potravinách)","example":"I check how much fat a snack contains before I buy it."},{"head":"\u003cstrong>salty\u003c/strong> /ˈsɔːlti/ (adjective; B2)","gloss":"slaný, přesolený","example":"Eating too many salty snacks like crisps can raise your blood pressure."},{"head":"\u003cstrong>canned\u003c/strong> /kænd/ (adjective; B2)","gloss":"konzervovaný (v plechovce)","example":"Canned beans and tomatoes are useful when you want to cook a quick dinner at home."},{"head":"\u003cstrong>label\u003c/strong> /ˈleɪbl/ [C; B1]","gloss":"etiketa, štítek (na obalu potraviny)","example":"I always check the nutrition label on the packet to see how much sugar it contains."},{"head":"\u003cstrong>convenient\u003c/strong> /kənˈviːniənt/ (adjective; B1)","gloss":"pohodlný, praktický, vyhovující","example":"A prepared salad is convenient when I have little time for lunch."},{"head":"\u003cstrong>consume\u003c/strong> /kənˈsjuːm/ AmE /kənˈsuːm/ (verb + food/drink; B2)","gloss":"konzumovat, sníst či vypít","example":"I try to notice how many sugary drinks I consume during the week."},{"head":"\u003cstrong>chop\u003c/strong> /tʃɒp/ AmE /tʃɑːp/ (verb; B2)","gloss":"nakrájet, nasekat (na kousky)","example":"First, wash the fresh vegetables and chop the carrots and courgettes into small cubes."},{"head":"\u003cstrong>fry\u003c/strong> /fraɪ/ (verb; B1)","gloss":"smažit, osmažit","example":"We sometimes fry potatoes in a little oil."},{"head":"\u003cstrong>grill\u003c/strong> /ɡrɪl/ (verb; B1)","gloss":"grilovat, opékat na grilu","example":"In summer, we like to grill chicken breast and fish with fresh herbs."},{"head":"\u003cstrong>pour\u003c/strong> /pɔː(r)/ AmE /pɔːr/ (verb; B1)","gloss":"nalít, polít","example":"Pour a spoonful of olive oil and lemon juice over the green salad."},{"head":"\u003cstrong>pan\u003c/strong> /pæn/ [C; B1]","gloss":"pánev, kastrol","example":"I use a small pan when I cook dinner for myself."},{"head":"\u003cstrong>oven\u003c/strong> /ˈʌvn/ [C; B1]","gloss":"trouba","example":"I put the vegetables in the oven while I prepare the salad."},{"head":"\u003cstrong>habit\u003c/strong> /ˈhæbɪt/ [C; B1]","gloss":"zvyk, návyk","example":"Preparing my lunch before school has become a useful habit."},{"head":"\u003cstrong>limit\u003c/strong> /ˈlɪmɪt/ (verb; B2)","gloss":"omezit, stanovit hranici","example":"Health authorities advise people to limit the amount of salt they eat."},{"head":"\u003cstrong>reduce\u003c/strong> /rɪˈdjuːs/ AmE /rɪˈduːs/ (verb; B1)","gloss":"snížit, zmenšit","example":"I am trying to reduce the amount of food I throw away."},{"head":"\u003cstrong>overweight\u003c/strong> /ˌəʊvəˈweɪt/ AmE /ˌoʊvərˈweɪt/ (adjective; B2)","gloss":"mající nadváhu","example":"The article discusses the experiences of people who are overweight."},{"head":"\u003cstrong>disease\u003c/strong> /dɪˈziːz/ [C or U; B1]","gloss":"onemocnění, choroba, nemoc","example":"We read an article about heart disease in class."},{"head":"\u003cstrong>workout\u003c/strong> /ˈwɜːkaʊt/ AmE /ˈwɜːrkaʊt/ [C; B1]","gloss":"trénink, cvičení","example":"I enjoy a short workout after a busy day at school."},{"head":"\u003cstrong>stretch\u003c/strong> /stretʃ/ (verb; B2)","gloss":"protáhnout se, protahovat (svaly)","example":"During a study break, I stand up and stretch my arms."},{"head":"\u003cstrong>mental\u003c/strong> /ˈmentl/ (adjective; B2)","gloss":"duševní, psychický","example":"I make time to talk about mental health with people I trust."},{"head":"\u003cstrong>peel\u003c/strong> /piːl/ (verb; B2)","gloss":"oloupat, odstranit slupku","example":"I peel the carrots before I chop them for the soup."},{"head":"\u003cstrong>low-fat\u003c/strong> /ˌləʊ ˈfæt/ (adjective; B2)","gloss":"nízkotučný, s nízkým obsahem tuku","example":"I would ask a dietitian whether a low-fat eating plan would suit my needs."},{"head":"\u003cstrong>calorie\u003c/strong> /ˈkæləri/ [C; B1]","gloss":"kalorie (jednotka energie obsažené v potravinách)","example":"The app shows the calorie content of each meal."}],"answer":["As a student in České Budějovice, I try to combine a \u003cstrong>varied\u003c/strong> diet with exercise, enough sleep and time to relax. I sometimes check how much \u003cstrong>protein\u003c/strong> my meals contain. I include plenty of fruit and vegetables and try to \u003cstrong>limit\u003c/strong> salt, because too much can raise blood pressure.","For me, healthy food includes vegetables, fruit, wholegrain bread, beans and a variety of other ingredients. Junk food can be \u003cstrong>convenient\u003c/strong>, especially when I am in a hurry. However, snacks such as crisps can be very \u003cstrong>salty\u003c/strong>, while sweets and fizzy drinks contain a lot of sugar. I try to notice what I \u003cstrong>consume\u003c/strong> instead of eating without thinking. A healthy diet can help protect against heart \u003cstrong>disease\u003c/strong>. I would not judge someone who is overweight, because health is more complicated than appearance.","Cooking at home gives me control over the ingredients. I like to \u003cstrong>grill\u003c/strong> chicken or fish, or roast vegetables in the oven. For a quick dinner, I chop tomatoes, cucumbers and peppers, add chickpeas, and pour a little olive oil and lemon juice over the salad.","I see a difference between a diet for weight loss and one needed for a medical condition. Before choosing a \u003cstrong>low-fat\u003c/strong> plan or tracking the calorie content of meals, I would ask a dietitian about my needs. Coeliac disease, for example, is an autoimmune condition managed with a gluten-free diet. I might choose vegetarian meals for ethical reasons too.","Finally, I enjoy cycling and a short \u003cstrong>workout\u003c/strong>, but I also need rest. Healthy adults generally need seven to nine hours of sleep; teenagers usually need more. During busy school weeks, I try to keep a regular bedtime and leave time for friends."],"answer_info":"","questions":[{"cat":"","text":"\u003cstrong>How would you describe the difference between a varied diet and a diet based mainly on junk food?\u003c/strong> \u003cem>(different food groups, ingredients and labels, amount of salt and sugar, personal examples)\u003c/em>"},{"cat":"","text":"\u003cstrong>What is your favourite healthy meal to cook at home, and how do you prepare it step by step?\u003c/strong> \u003cem>(choosing fresh ingredients, chopping vegetables, grilling or baking instead of frying, seasoning with herbs and olive oil)\u003c/em>"},{"cat":"","text":"\u003cstrong>What are the main reasons why people follow special diets such as vegetarian, vegan, lactose-free or gluten-free?\u003c/strong> \u003cem>(ethical and environmental reasons, animal welfare, religious beliefs, food allergies, intolerances, or autoimmune conditions like coeliac disease)\u003c/em>"},{"cat":"","text":"\u003cstrong>How does a student's daily routine during the school year affect their eating and sleeping habits?\u003c/strong> \u003cem>(skipping breakfast, buying snacks from vending machines, studying late at night, screen time before bed)\u003c/em>"},{"cat":"","text":"\u003cstrong>Besides food, what other factors are essential for a healthy lifestyle and good mental wellbeing?\u003c/strong> \u003cem>(regular physical activity, enough sleep for one's age, drinking water, managing school stress, spending time with friends)\u003c/em>"},{"cat":"","text":"\u003cstrong>How can schools and restaurants encourage people to choose healthier food options?\u003c/strong> \u003cem>(offering fresh salads and fruit in school canteens, clear ingredient information on menus, smaller portion sizes, replacing sugary drinks with water)\u003c/em>"},{"cat":"","text":"\u003cstrong>How would you respond if a friend wanted to follow a very restrictive diet promoted online?\u003c/strong> \u003cem>(asking about their reasons, checking the source, discussing concerns with a qualified professional)\u003c/em>"}],"phrases":[{"head":"\u003cstrong>include fruit and vegetables in daily meals\u003c/strong>","gloss":"zařazovat ovoce a zeleninu do každodenního jídelníčku","note":""},{"head":"\u003cstrong>cut down on sugary drinks and salty snacks\u003c/strong>","gloss":"omezit slazené nápoje a slané pochutiny","note":""},{"head":"\u003cstrong>cook from scratch using fresh ingredients\u003c/strong>","gloss":"vařit od základu z čerstvých surovin","note":""},{"head":"\u003cstrong>check the nutrition label on the packaging\u003c/strong>","gloss":"zkontrolovat výživové údaje na obalu","note":""},{"head":"\u003cstrong>combine a balanced diet with regular exercise\u003c/strong>","gloss":"spojit vyváženou stravu s pravidelným pohybem","note":""},{"head":"\u003cstrong>reduce the risk of heart disease\u003c/strong>","gloss":"snížit riziko srdečních onemocnění","note":""},{"head":"\u003cstrong>get enough quality sleep every night\u003c/strong>","gloss":"dopřát si každou noc dostatek kvalitního spánku","note":""}],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>protein\u003c/strong> /ˈprəʊtiːn/ AmE /ˈproʊtiːn/ [C or U; slovo k tématu, B2]","gloss":"bílkovina","example":"In class, we compared how much protein different foods contain."},{"head":"\u003cstrong>variety\u003c/strong> [sg; A2]","gloss":"řada různých, různé druhy (a variety of)","example":"I plan a variety of meals, not the same food every day."},{"head":"\u003cstrong>vitamin\u003c/strong> /ˈvɪtəmɪn/ AmE /ˈvaɪtəmɪn/ [C; slovo k tématu, B2]","gloss":"vitamín","example":"We discussed vitamin C during a lesson about food."},{"head":"\u003cstrong>fat\u003c/strong> /fæt/ [C or U; A2]","gloss":"tuk (v potravinách)","example":"I check how much fat a snack contains before I buy it."},{"head":"\u003cstrong>salty\u003c/strong> /ˈsɔːlti/ (adjective; A2)","gloss":"slaný, přesolený","example":"Eating too many salty snacks like crisps can raise your blood pressure."},{"head":"\u003cstrong>tin\u003c/strong> [C; B1]","gloss":"plechovka, konzerva","example":"A tin of beans is useful for a quick dinner at home."},{"head":"\u003cstrong>label\u003c/strong> /ˈleɪbl/ [C; B1]","gloss":"etiketa, štítek (na obalu potraviny)","example":"I always check the label to see how much sugar the food contains."},{"head":"\u003cstrong>convenient\u003c/strong> /kənˈviːniənt/ (adjective; B1)","gloss":"pohodlný, praktický, vyhovující","example":"A prepared salad is convenient when I have little time for lunch."},{"head":"\u003cstrong>consume\u003c/strong> /kənˈsjuːm/ AmE /kənˈsuːm/ (verb + food/drink; B1)","gloss":"konzumovat, sníst či vypít","example":"I try to notice how many drinks with sugar I consume during the week."},{"head":"\u003cstrong>fry\u003c/strong> /fraɪ/ (verb; B1)","gloss":"smažit, osmažit","example":"We sometimes fry potatoes in a little oil."},{"head":"\u003cstrong>grill\u003c/strong> /ɡrɪl/ (verb; slovo k tématu, B2)","gloss":"grilovat, opékat na grilu","example":"In summer, we like to grill chicken and fish."},{"head":"\u003cstrong>pour\u003c/strong> /pɔː(r)/ AmE /pɔːr/ (verb; B1)","gloss":"nalít, polít","example":"Pour a little olive oil and lemon juice over the green salad."},{"head":"\u003cstrong>pan\u003c/strong> /pæn/ [C; B1]","gloss":"pánev, kastrol","example":"I use a small pan when I cook dinner for myself."},{"head":"\u003cstrong>oven\u003c/strong> /ˈʌvn/ [C; A2]","gloss":"trouba","example":"I put the vegetables in the oven while I prepare the salad."},{"head":"\u003cstrong>habit\u003c/strong> /ˈhæbɪt/ [C; A2]","gloss":"zvyk, návyk","example":"Preparing my lunch before school has become a useful habit."},{"head":"\u003cstrong>limit\u003c/strong> /ˈlɪmɪt/ (verb; B1)","gloss":"omezit, stanovit hranici","example":"People are advised to limit the amount of salt they eat."},{"head":"\u003cstrong>reduce\u003c/strong> /rɪˈdjuːs/ AmE /rɪˈduːs/ (verb; A2)","gloss":"snížit, zmenšit","example":"I am trying to reduce the amount of food I throw away."},{"head":"\u003cstrong>disease\u003c/strong> /dɪˈziːz/ [C or U; A2]","gloss":"onemocnění, choroba, nemoc","example":"We read an article about heart disease in class."},{"head":"\u003cstrong>work out\u003c/strong> (phrasal verb; A2)","gloss":"cvičit, posilovat","example":"I enjoy working out for a short time after school."},{"head":"\u003cstrong>mental\u003c/strong> /ˈmentl/ (adjective; B1)","gloss":"duševní, psychický","example":"I make time to talk about mental health."},{"head":"\u003cstrong>calorie\u003c/strong> /ˈkæləri/ [C; B1]","gloss":"kalorie (jednotka energie obsažené v potravinách)","example":"The app shows the calorie content of each meal."}],"answer":["As a student in České Budějovice, I try to eat a \u003cstrong>variety\u003c/strong> of food. I combine it with exercise, enough sleep and time to relax. I sometimes check how much \u003cstrong>protein\u003c/strong> my meals contain. I include plenty of fruit and vegetables and try to \u003cstrong>limit\u003c/strong> salt, because too much can raise blood pressure.","Junk food can be \u003cstrong>convenient\u003c/strong> when I am in a hurry. But crisps can be very \u003cstrong>salty\u003c/strong>, and sweets and fizzy drinks contain a lot of sugar. A healthy diet can help protect against heart \u003cstrong>disease\u003c/strong>.","I like to \u003cstrong>grill\u003c/strong> chicken or fish, or roast vegetables in the \u003cstrong>oven\u003c/strong>. For a quick dinner, I make a salad. I cut tomatoes into small pieces and add chickpeas.","I see a difference between a diet for weight loss and a diet for a medical condition. Before I started counting the \u003cstrong>calorie\u003c/strong> content of my meals, I would ask a dietitian about my needs. I might also choose vegetarian meals because I think it is the right thing to do.","I enjoy cycling and I \u003cstrong>work out\u003c/strong> for a short time, but I also need rest. Healthy adults generally need seven to nine hours of sleep; teenagers usually need more."],"questions":[{"cat":"","text":"\u003cstrong>How is eating a variety of food different from eating mostly junk food?\u003c/strong> \u003cem>(different food groups, ingredients and labels, amount of salt and sugar, personal examples)\u003c/em>"},{"cat":"","text":"\u003cstrong>How do you cook your favourite healthy meal at home, step by step?\u003c/strong> \u003cem>(choosing fresh ingredients, cutting vegetables, grilling or baking instead of frying, adding olive oil)\u003c/em>"},{"cat":"","text":"\u003cstrong>Why do some people follow special diets, for example a vegetarian diet?\u003c/strong> \u003cem>(what people think is right or wrong, how animals are treated, the environment, religion, food allergies, health problems with some foods)\u003c/em>"},{"cat":"","text":"\u003cstrong>How does a student's daily routine in the school year affect eating and sleeping habits?\u003c/strong> \u003cem>(no breakfast, snacks from machines, studying late at night, screen time before bed)\u003c/em>"},{"cat":"","text":"\u003cstrong>Apart from food, what is important for a healthy body and mind?\u003c/strong> \u003cem>(regular exercise, enough sleep for your age, drinking water, school stress, time with friends, good mental health)\u003c/em>"},{"cat":"","text":"\u003cstrong>How can schools and restaurants encourage people to choose healthier food options?\u003c/strong> \u003cem>(fresh salads and fruit in school canteens, clear information about ingredients on menus, smaller meals, water instead of drinks with sugar)\u003c/em>"},{"cat":"","text":"\u003cstrong>How would you respond if a friend wanted to follow an extreme diet?\u003c/strong> \u003cem>(a diet from the internet with very little food, asking about their reasons, checking the source, talking to a qualified expert about your worries)\u003c/em>"}],"phrases":[{"head":"\u003cstrong>include fruit and vegetables in daily meals\u003c/strong>","gloss":"zařazovat ovoce a zeleninu do každodenního jídelníčku","note":""},{"head":"\u003cstrong>have fewer drinks with sugar and fewer salty snacks\u003c/strong>","gloss":"omezit slazené nápoje a slané pochutiny","note":""},{"head":"\u003cstrong>cook meals yourself from fresh ingredients\u003c/strong>","gloss":"vařit od základu z čerstvých surovin","note":""},{"head":"\u003cstrong>check the label to see what is in the food\u003c/strong>","gloss":"zkontrolovat na etiketě, co jídlo obsahuje (výživové údaje)","note":""},{"head":"\u003cstrong>eat the right amounts of different foods and exercise regularly\u003c/strong>","gloss":"jíst vyváženě a pravidelně se hýbat","note":""},{"head":"\u003cstrong>reduce the risk of heart disease\u003c/strong>","gloss":"snížit riziko srdečních onemocnění","note":""},{"head":"\u003cstrong>get enough quality sleep every night\u003c/strong>","gloss":"dopřát si každou noc dostatek kvalitního spánku","note":""}]},"codes":["SSO 15","CR 6a","CR 20b"],"groups":["cr","sso"],"rank":{"cr":12,"sso":30,"all":12.5}},{"file":"tema-c19b-national-cuisines.md","title":"Czech, British and American national cuisines","label":"Navrhl AI (Hermes, gpt-6.1-terra), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu.","vocab":[{"head":"\u003cstrong>roast pork [U]\u003c/strong> (roast /rəʊst/; pork /pɔːk/ AmE /pɔːrk/)","gloss":"pečené vepřové maso","example":"We served roast pork for lunch."},{"head":"\u003cstrong>sauerkraut [U]\u003c/strong> /ˈsaʊəkraʊt/ AmE /ˈsaʊərkraʊt/","gloss":"kysané zelí","example":"The plate included sauerkraut."},{"head":"\u003cstrong>cream sauce [C/U]\u003c/strong>","gloss":"smetanová omáčka","example":"The beef came with cream sauce."},{"head":"\u003cstrong>cranberries\u003c/strong> (cranberry /ˈkrænbəri/ AmE /ˈkrænberi/) [plural; jednotné číslo \u003cem>a cranberry\u003c/em>, C]","gloss":"brusinky","example":"A few cranberries added colour to the plate."},{"head":"\u003cstrong>goulash [C/U]\u003c/strong> /ˈɡuːlæʃ/ AmE /ˈɡuːlɑːʃ/","gloss":"guláš","example":"The restaurant serves goulash."},{"head":"\u003cstrong>paprika [U]\u003c/strong> /ˈpæprɪkə/ AmE /pəˈpriːkə/","gloss":"mletá paprika","example":"The stew contains paprika."},{"head":"\u003cstrong>fish and chips [U]\u003c/strong> /ˌfɪʃ ən ˈtʃɪps/","gloss":"smažená ryba s hranolky","example":"They ordered fish and chips."},{"head":"\u003cstrong>batter [U]\u003c/strong> /ˈbætə/ AmE /ˈbætər/","gloss":"těstíčko na smažení","example":"The fish was coated in batter."},{"head":"\u003cstrong>malt vinegar [U]\u003c/strong> /ˌmɔːlt ˈvɪnɪɡə(r)/ AmE /ˌmɔːlt ˈvɪnɪɡər/","gloss":"sladový ocet","example":"He added malt vinegar to the chips."},{"head":"\u003cstrong>roast beef [U]\u003c/strong> (roast /rəʊst/)","gloss":"pečené hovězí","example":"The family shared roast beef."},{"head":"\u003cstrong>Yorkshire pudding [C/U]\u003c/strong> /ˌjɔːkʃə ˈpʊdɪŋ/ AmE /ˌjɔːrkʃər ˈpʊdɪŋ/","gloss":"pečená příloha z těstíčka","example":"Yorkshire pudding came with the beef."},{"head":"\u003cstrong>gravy [U]\u003c/strong> /ˈɡreɪvi/","gloss":"šťáva či omáčka k masu","example":"She poured gravy over the meat."},{"head":"\u003cstrong>burger patty [C]\u003c/strong> (burger /ˈbɜːɡə(r)/ AmE /ˈbɜːrɡər/; patty /ˈpæti/)","gloss":"karbanátek do burgeru","example":"The burger patty was cooked thoroughly."},{"head":"\u003cstrong>bun [C]\u003c/strong> /bʌn/","gloss":"houska","example":"The patty was inside a bun."},{"head":"\u003cstrong>coleslaw [U]\u003c/strong> /ˈkəʊlslɔː/ AmE /ˈkoʊlslɔː/","gloss":"zelný salát s dresinkem","example":"The plate included coleslaw."},{"head":"\u003cstrong>barbecue [C/U]\u003c/strong> /ˈbɑːbɪkjuː/ AmE /ˈbɑːrbɪkjuː/","gloss":"grilování; grilované jídlo","example":"They invited us to a barbecue."},{"head":"\u003cstrong>cornbread [U]\u003c/strong> /ˈkɔːnbred/ AmE /ˈkɔːrnbred/","gloss":"kukuřičný chléb","example":"We ate cornbread with beans."},{"head":"\u003cstrong>apple pie [C/U]\u003c/strong> /ˌæpl ˈpaɪ/","gloss":"jablečný koláč","example":"They shared an apple pie."},{"head":"\u003cstrong>hearty (adj.)\u003c/strong> /ˈhɑːti/ AmE /ˈhɑːrti/","gloss":"vydatný","example":"The soup is hearty."},{"head":"\u003cstrong>regional (adj.)\u003c/strong> /ˈriːdʒənl/","gloss":"oblastní, regionální","example":"The menu offers regional dishes."},{"head":"\u003cstrong>variation [C]\u003c/strong> /ˌveəriˈeɪʃn/ AmE /ˌveriˈeɪʃn/","gloss":"obměna, varianta","example":"Each family has its own variation."}],"answer":["When I introduce visitors to food in the Czech Republic, I like to start with familiar examples rather than claim that everyone eats the same way. One possible meal is \u003cstrong>roast pork\u003c/strong> with \u003cstrong>sauerkraut\u003c/strong> and dumplings. Another is svíčková: beef with a \u003cstrong>cream sauce\u003c/strong>, dumplings and a few \u003cstrong>cranberries\u003c/strong>. It has roots in Austro-Hungarian cooking, with Czech adaptations. These dishes are often described as \u003cstrong>hearty\u003c/strong>, but each family can make its own \u003cstrong>variation\u003c/strong>. \u003cstrong>Goulash\u003c/strong> is also served here and is connected with Hungarian cooking. Different versions exist, so I would not assume that every recipe is the same.","For Britain, I might suggest \u003cstrong>fish and chips\u003c/strong>: fish covered in \u003cstrong>batter\u003c/strong> and served with fried potatoes. Some people add \u003cstrong>malt vinegar\u003c/strong>. The first shop is a matter of debate: different places claim to have been first around 1860. Another example is roast beef with Yorkshire pudding and gravy. These are examples, not a complete picture of what British people eat. Food choices depend on family, region and personal taste.","In the USA, a visitor could try a burger with a burger patty in a bun. A barbecue can be a social occasion as well as a way of preparing food. In Appalachia, regional examples include cornbread and fried apple pies. One claim about the hamburger's early history has been challenged, so I would avoid claiming that one person definitely invented it.","As a tourism student, I would ask guests what they enjoy and describe the food clearly. I would also mention that regional traditions and individual preferences can be very different. Trying a local dish is a useful way to begin a conversation, but it should never become a stereotype."],"answer_info":"","questions":[{"cat":"","text":"Which Czech dish would you recommend to a visitor and why?"},{"cat":"","text":"How would you describe its components in English?"},{"cat":"","text":"What examples of British dishes would you introduce?"},{"cat":"","text":"How might a visitor experience food in the USA?"},{"cat":"","text":"Why should we avoid saying that everyone in one country eats the same dishes?"},{"cat":"","text":"What similarities and differences do you see among these cuisines?"},{"cat":"","text":"If a guest asked about the origin of a dish, how would you check your answer?"}],"phrases":[{"head":"\u003cstrong>A dish I would recommend is...\u003c/strong>","gloss":"Doporučil/a bych pokrm...","note":""},{"head":"\u003cstrong>It is usually served with...\u003c/strong>","gloss":"Obvykle se podává s...","note":""},{"head":"\u003cstrong>One possible variation is...\u003c/strong>","gloss":"Jednou z možných variant je...","note":""},{"head":"\u003cstrong>This dish is associated with...\u003c/strong>","gloss":"Tento pokrm je spojován s...","note":""},{"head":"\u003cstrong>The origin is not completely clear.\u003c/strong>","gloss":"Původ není zcela jasný.","note":""},{"head":"\u003cstrong>Food habits differ from family to family.\u003c/strong>","gloss":"Stravovací zvyklosti se liší rodinu od rodiny.","note":""},{"head":"\u003cstrong>I would check the details before...\u003c/strong>","gloss":"Podrobnosti bych ověřil/a předtím, než...","note":""}],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>roast pork [U; A2]\u003c/strong> (roast /rəʊst/; pork /pɔːk/ AmE /pɔːrk/)","gloss":"pečené vepřové maso","example":"We served roast pork for lunch."},{"head":"\u003cstrong>sauerkraut [U; slovo k tématu, C2]\u003c/strong> /ˈsaʊəkraʊt/ AmE /ˈsaʊərkraʊt/","gloss":"kysané zelí","example":"The plate included sauerkraut."},{"head":"\u003cstrong>cream sauce [C/U; A1 + A2]\u003c/strong>","gloss":"smetanová omáčka","example":"The beef was served with cream sauce."},{"head":"\u003cstrong>goulash [C/U; slovo k tématu, C2]\u003c/strong> /ˈɡuːlæʃ/ AmE /ˈɡuːlɑːʃ/","gloss":"guláš","example":"The restaurant serves goulash."},{"head":"\u003cstrong>fish and chips [U; A2]\u003c/strong> /ˌfɪʃ ən ˈtʃɪps/","gloss":"smažená ryba s hranolky","example":"They ordered fish and chips."},{"head":"\u003cstrong>roast beef [U; A2]\u003c/strong> (roast /rəʊst/)","gloss":"pečené hovězí","example":"The family shared roast beef."},{"head":"\u003cstrong>Yorkshire pudding [C/U; slovo k tématu, bez úrovně]\u003c/strong> /ˌjɔːkʃə ˈpʊdɪŋ/ AmE /ˌjɔːrkʃər ˈpʊdɪŋ/","gloss":"pečená příloha z těstíčka","example":"Yorkshire pudding was served with the beef."},{"head":"\u003cstrong>gravy [U; slovo k tématu, C1]\u003c/strong> /ˈɡreɪvi/","gloss":"šťáva či omáčka k masu","example":"She poured gravy over the meat."},{"head":"\u003cstrong>bread roll\u003c/strong> [C; B1]","gloss":"houska","example":"The meat was inside a bread roll."},{"head":"\u003cstrong>barbecue [C/U; B1]\u003c/strong> /ˈbɑːbɪkjuː/ AmE /ˈbɑːrbɪkjuː/","gloss":"grilování; grilované jídlo","example":"They invited us to a barbecue."},{"head":"\u003cstrong>bread that is made from corn\u003c/strong> (noun phrase; A1 + B1)","gloss":"kukuřičný chléb (\u003cem>cornbread\u003c/em>)","example":"We ate beans with bread that is made from corn."},{"head":"\u003cstrong>make you feel full\u003c/strong> (phrase; A1 + B1)","gloss":"být vydatný, zasytit (o jídle; \u003cem>hearty\u003c/em>)","example":"The soup makes you feel full."},{"head":"\u003cstrong>region\u003c/strong> (noun; A2)","gloss":"oblast, region","example":"The menu offers dishes from the region."},{"head":"\u003cstrong>version\u003c/strong> (noun; B1)","gloss":"obměna, varianta, verze","example":"Each family has its own version."}],"answer":["When I introduce visitors to Czech food, I like to start with familiar examples. One possible meal is \u003cstrong>roast pork\u003c/strong> with \u003cstrong>sauerkraut\u003c/strong> and dumplings. Another is svíčková: beef with a \u003cstrong>cream sauce\u003c/strong> and dumplings. It comes from Austro-Hungarian cooking, and there are Czech \u003cstrong>versions\u003c/strong>. \u003cstrong>Goulash\u003c/strong> is also served here and is connected with Hungarian cooking.","For Britain, I might suggest \u003cstrong>fish and chips\u003c/strong>: fish with fried potatoes. Different places claim that they had the first shop, around 1860. Another example is \u003cstrong>roast beef\u003c/strong> with \u003cstrong>Yorkshire pudding\u003c/strong> and \u003cstrong>gravy\u003c/strong>. These are examples, not a complete picture of what British people eat.","In the USA, a visitor could try a burger: meat inside a \u003cstrong>bread roll\u003c/strong>. A \u003cstrong>barbecue\u003c/strong> can be a social occasion as well as a way of preparing food. In the Appalachian \u003cstrong>region\u003c/strong>, examples include \u003cstrong>bread that is made from corn\u003c/strong> and fried pies with apples. One claim about the hamburger's early history was questioned, so I would not say that one person definitely invented it.","As a tourism student, I would ask guests what they enjoy. Trying a local dish is a useful way to begin a conversation. But it should never become a fixed idea about a country."],"questions":[{"cat":"","text":"Which Czech dish would you recommend to a visitor? \u003cem>(your reasons)\u003c/em>"},{"cat":"","text":"How would you describe its parts in English?"},{"cat":"","text":"What examples of British dishes would you introduce?"},{"cat":"","text":"How might a visitor experience food in the USA?"},{"cat":"","text":"Why should we avoid saying that everyone in one country eats the same dishes?"},{"cat":"","text":"What similarities and differences do you see between Czech, British and American food?"},{"cat":"","text":"If a guest asked where a dish comes from, how would you check your answer?"}],"phrases":[{"head":"\u003cstrong>A dish I would recommend is...\u003c/strong>","gloss":"Doporučil/a bych pokrm...","note":""},{"head":"\u003cstrong>It is usually served with...\u003c/strong>","gloss":"Obvykle se podává s...","note":""},{"head":"\u003cstrong>One possible version is...\u003c/strong>","gloss":"Jednou z možných variant je...","note":""},{"head":"\u003cstrong>This dish is connected with...\u003c/strong>","gloss":"Tento pokrm je spojován s...","note":""},{"head":"\u003cstrong>It is not completely clear where it comes from.\u003c/strong>","gloss":"Původ není zcela jasný.","note":""},{"head":"\u003cstrong>Food habits are different in every family.\u003c/strong>","gloss":"Stravovací zvyklosti se liší rodinu od rodiny.","note":""},{"head":"\u003cstrong>I would check the details before...\u003c/strong>","gloss":"Podrobnosti bych ověřil/a předtím, než...","note":""}]},"codes":["SSO 16","CR 19b"],"groups":["cr","sso"],"rank":{"cr":39,"sso":32,"all":32}},{"file":"tema-s14-food-and-drink.md","title":"Food and drink","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu.","vocab":[{"head":"\u003cstrong>cuisine\u003c/strong> /kwɪˈziːn/ [U/C]","gloss":"kuchyně, gastronomie (národní kulinářský styl)","example":"Italian cuisine is celebrated globally for its fresh herbs, olive oil, and simple pasta dishes."},{"head":"\u003cstrong>recipe\u003c/strong> /ˈresəpi/ [C]","gloss":"kuchařský recept (POZOR: recept od lékaře je \u003cem>prescription\u003c/em>)","example":"My grandmother shared her secret family recipe for homemade apple strudel."},{"head":"\u003cstrong>ingredient\u003c/strong> /ɪnˈɡriːdiənt/ [C]","gloss":"surovina, ingredience, přísada","example":"Using fresh seasonal ingredients makes a massive differe
