stival","example":"I would enjoy a music festival where I could discover unfamiliar bands."},{"head":"\u003cstrong>orchestra\u003c/strong> /ˈɔːkɪstrə/ AmE /ˈɔːrkɪstrə/ [C; B1]","gloss":"orchestr","example":"I would like to hear the South Bohemian Philharmonic orchestra in České Budějovice."},{"head":"\u003cstrong>ballet\u003c/strong> /ˈbæleɪ/ AmE /bæˈleɪ/ [C or U; B1]","gloss":"balet","example":"The South Bohemian Theatre offers ballet as well as drama and opera."},{"head":"\u003cstrong>club\u003c/strong> /klʌb/ [C; B1]","gloss":"klub (podnik, kam se chodí večer tančit)","example":"My ideal evening would include dancing with friends at a club."},{"head":"\u003cstrong>stadium\u003c/strong> /ˈsteɪdiəm/ [C; B2]","gloss":"stadion","example":"I would rather watch a football match in a stadium than on television."},{"head":"\u003cstrong>interval\u003c/strong> /ˈɪntəvl/ AmE /ˈɪntərvl/ [C; B1]","gloss":"přestávka během představení (britská angličtina)","example":"During the interval, I would talk to my friend about the first part of the play."},{"head":"\u003cstrong>rehearsal\u003c/strong> /rɪˈhɜːsl/ AmE /rɪˈhɜːrsl/ [C or U; B2]","gloss":"zkouška představení či koncertu","example":"I would enjoy an open rehearsal because I could see how musicians prepare."}],"answer":["In České Budějovice, I can choose between different kinds of entertainment. The South Bohemian Theatre offers drama, opera and \u003cstrong>ballet\u003c/strong>. I would compare its programme with concerts by the South Bohemian Philharmonic \u003cstrong>orchestra\u003c/strong> before choosing an \u003cstrong>event\u003c/strong>. An open \u003cstrong>rehearsal\u003c/strong> would also interest me because I could learn how musicians prepare. During the \u003cstrong>interval\u003c/strong> at a performance, I like discussing what I have seen. At weekends, I enjoy meeting friends in a café or watching football at a \u003cstrong>stadium\u003c/strong>. Sometimes I would choose a music \u003cstrong>festival\u003c/strong> or dancing at a \u003cstrong>club\u003c/strong>. For me, good entertainment means spending time with others without spending too much money."],"answer_info":"","questions":[{"cat":"","text":"\u003cstrong>Which cultural activity in České Budějovice would you recommend to a visitor, and why?\u003c/strong> \u003cem>(South Bohemian Theatre, South Bohemian Philharmonic, your interests and budget)\u003c/em>"},{"cat":"","text":"\u003cstrong>How do you usually spend your free time after school and at weekends?\u003c/strong> \u003cem>(friends, cafés, walks, sport, music, activities at home)\u003c/em>"},{"cat":"","text":"\u003cstrong>How would you organise an evening of entertainment for friends with different interests?\u003c/strong> \u003cem>(compare programmes, agree on a budget, arrange tickets and transport, choose a meeting point)\u003c/em>"}],"phrases":[],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>event\u003c/strong> /ɪˈvent/ [C; A2]","gloss":"společenská či kulturní akce","example":"I would check the price and location before choosing an evening event."},{"head":"\u003cstrong>orchestra\u003c/strong> /ˈɔːkɪstrə/ AmE /ˈɔːrkɪstrə/ [C; slovo k tématu, B2]","gloss":"orchestr","example":"I would like to hear the South Bohemian Philharmonic orchestra in České Budějovice."},{"head":"\u003cstrong>ballet\u003c/strong> /ˈbæleɪ/ AmE /bæˈleɪ/ [C or U; slovo k tématu, B2]","gloss":"balet","example":"The South Bohemian Theatre offers ballet as well as drama."},{"head":"\u003cstrong>club\u003c/strong> /klʌb/ [C; A2]","gloss":"klub (podnik, kam se chodí večer tančit)","example":"My ideal evening would include dancing with friends at a club."},{"head":"\u003cstrong>stadium\u003c/strong> /ˈsteɪdiəm/ [C; B1]","gloss":"stadion","example":"I would rather watch a football match in a stadium than on television."}],"answer":["In České Budějovice, I can choose between different kinds of entertainment. The South Bohemian Theatre offers drama, opera and \u003cstrong>ballet\u003c/strong>. I would compare its programme with concerts by the South Bohemian Philharmonic \u003cstrong>orchestra\u003c/strong> before choosing an \u003cstrong>event\u003c/strong>. During the break at a performance, I like discussing what I have seen. At weekends, I enjoy meeting friends in a café or watching football at a \u003cstrong>stadium\u003c/strong>. Sometimes I would choose a music festival or dancing at a \u003cstrong>club\u003c/strong>."],"questions":[{"cat":"","text":"\u003cstrong>Which cultural activity in České Budějovice would you recommend to a visitor?\u003c/strong> \u003cem>(South Bohemian Theatre, South Bohemian Philharmonic, your interests and how much money you can spend, your reasons)\u003c/em>"},{"cat":"","text":"\u003cstrong>How do you usually spend your free time after school and at weekends?\u003c/strong> \u003cem>(friends, cafés, walks, sport, music, activities at home)\u003c/em>"},{"cat":"","text":"\u003cstrong>How would you organise an evening of entertainment for friends with different interests?\u003c/strong> \u003cem>(compare programmes, agree on how much to spend, arrange tickets and transport, choose a meeting point)\u003c/em>"}],"phrases":[]},"codes":["SSO 10"],"groups":["sso"],"rank":{"sso":20,"all":20}},{"file":"tema-s17-uk-on-the-map.md","title":"The UK – on the map","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu.","vocab":[{"head":"\u003cstrong>constituent country\u003c/strong> (constituent /kənˈstɪtʃuənt/) [C]","gloss":"konstituentní (součástková) země, dílčí země tvořící celek Spojeného království (Anglie, Skotsko, Wales a Severní Irsko; \u003cem>constituent\u003c/em> zde znamená „tvořící součást celku“)","example":"The United Kingdom is composed of four constituent countries, each with distinct cultural traditions."},{"head":"\u003cstrong>island nation\u003c/strong> [C]","gloss":"ostrovní stát","example":"As an island nation, Britain has historically maintained powerful naval forces and maritime trade."},{"head":"\u003cstrong>mountain range\u003c/strong> [C]","gloss":"pohoří, horské pásmo (horský hřeben je \u003cem>mountain ridge\u003c/em>)","example":"The Pennines are a rugged mountain range often referred to as the backbone of England."},{"head":"\u003cstrong>highest peak\u003c/strong> (peak /piːk/) [C]","gloss":"nejvyšší vrchol","example":"Ben Nevis in the Scottish Highlands is the highest peak in the British Isles, standing at 1,345 metres."},{"head":"\u003cstrong>strait / channel\u003c/strong> (strait /streɪt/) [C]","gloss":"průliv","example":"The English Channel separates the southern coast of England from northern France."},{"head":"\u003cstrong>temperate maritime climate\u003c/strong> (temperate /ˈtempərət/; maritime /ˈmærɪtaɪm/) [C/U]","gloss":"mírné přímořské podnebí","example":"Britain enjoys a temperate maritime climate with mild winters and cool summers."},{"head":"\u003cstrong>coastline\u003c/strong> /ˈkəʊstlaɪn/ [C/U]","gloss":"pobřeží, pobřežní linie","example":"The dramatic, rocky coastline of Cornwall attracts hikers from all over Europe."},{"head":"\u003cstrong>loch\u003c/strong> /lɒk/ AmE /lɑːk/ [C]","gloss":"skotské jezero (sladkovodní i mořský záliv)","example":"Loch Ness is internationally famous for both its deep waters and the mythical monster legend."},{"head":"\u003cstrong>highlands\u003c/strong> [plural]","gloss":"vysočina, hornatina","example":"The dramatic glens and bare peaks of the Scottish Highlands offer breathtaking natural scenery."},{"head":"\u003cstrong>lowlands\u003c/strong> [plural]","gloss":"nížiny (pomnožné: \u003cem>the lowlands are...\u003c/em>)","example":"The fertile lowlands of central and southern England are dominated by agriculture and rolling hills."},{"head":"\u003cstrong>peninsula\u003c/strong> /pəˈnɪnsjələ/ AmE /pəˈnɪnsələ/ [C]","gloss":"poloostrov","example":"Wales is largely a mountainous peninsula jutting out into the Irish Sea."},{"head":"\u003cstrong>fertile\u003c/strong> /ˈfɜːtaɪl/ AmE /ˈfɜːrtl/ (adjective)","gloss":"úrodný","example":"The fertile soil in eastern England produces high yields of wheat and barley."},{"head":"\u003cstrong>surrounding seas\u003c/strong> (surrounding /səˈraʊndɪŋ/) [plural]","gloss":"okolní moře","example":"The UK is washed by various surrounding seas, including the North Sea and the Irish Sea."},{"head":"\u003cstrong>scenery\u003c/strong> /ˈsiːnəri/ [U]","gloss":"krajina, přírodní scenérie","example":"The Lake District in north-west England is celebrated for its romantic mountain scenery and lakes."},{"head":"\u003cstrong>drizzle\u003c/strong> /ˈdrɪzl/ [U]","gloss":"mrholení, drobný déšť","example":"Grey skies and persistent light drizzle are typical weather features throughout autumn."},{"head":"\u003cstrong>cliff\u003c/strong> /klɪf/ [C]","gloss":"útes, skalní sráz","example":"The iconic White Cliffs of Dover provide a striking white landmark for ships crossing the Channel."},{"head":"\u003cstrong>moorland\u003c/strong> /ˈmɔːlənd/ AmE /ˈmʊrlənd/ [U]","gloss":"vřesoviště (otevřená neobdělávaná krajina porostlá vřesem a trávou; rašeliniště je \u003cem>peat bog / peatland\u003c/em>)","example":"The wild, windswept moorland of Yorkshire served as the atmospheric setting for classic Victorian novels."},{"head":"\u003cstrong>estuary\u003c/strong> /ˈestʃuəri/ AmE /ˈestʃueri/ [C]","gloss":"nálevkovité ústí řeky (do moře)","example":"London grew as a major international port along the tidal estuary of the River Thames."},{"head":"\u003cstrong>archipelago\u003c/strong> /ˌɑːkɪˈpeləɡəʊ/ AmE /ˌɑːrkɪˈpeləɡəʊ/ [C]","gloss":"souostroví","example":"The British Isles form a large archipelago comprising Great Britain, Ireland, and thousands of smaller islands."},{"head":"\u003cstrong>natural boundary\u003c/strong> (boundary /ˈbaʊndri/) [C]","gloss":"přirozená hranice","example":"Rivers and mountain ridges frequently serve as natural boundaries between historical counties."},{"head":"\u003cstrong>Gulf Stream\u003c/strong> (gulf /ɡʌlf/; stream /striːm/) [proper noun]","gloss":"Golfský proud (spolu se Severoatlantským proudem – \u003cem>North Atlantic Drift\u003c/em>)","example":"The warm waters of the Gulf Stream ensure that British winters remain significantly milder than Canadian ones."},{"head":"\u003cstrong>longest river\u003c/strong> [C]","gloss":"nejdelší řeka","example":"While the Thames is the most famous, the River Severn is officially the longest river in the United Kingdom, measuring about 354 kilometres."}],"answer":["When looking at the map of Europe, the United Kingdom of Great Britain and Northern Ireland is an \u003cstrong>island nation\u003c/strong> situated off the north-western coast of the European mainland. Geographically, it forms the major part of the British \u003cstrong>archipelago\u003c/strong>, separated from continental Europe by the North Sea and the narrow English Channel.","Politically and physically, the UK consists of four distinct \u003cstrong>constituent countries\u003c/strong>: England, Scotland, Wales, and Northern Ireland. England occupies the largest area, characterized by rolling agricultural \u003cstrong>lowlands\u003c/strong> in the south and east, while the Pennine \u003cstrong>mountain range\u003c/strong> stretches down its centre like a spine. To the north lies Scotland, which features some of the most dramatic wilderness in Europe. Here you will find the Scottish \u003cstrong>Highlands\u003c/strong>, deep freshwater bodies known locally as \u003cstrong>lochs\u003c/strong>—including Loch Ness—and the country's \u003cstrong>highest peak\u003c/strong>, Ben Nevis. Wales, to the west, is a rugged \u003cstrong>peninsula\u003c/strong> covered largely by the Cambrian Mountains and Snowdonia, while Northern Ireland across the Irish Sea is famous for Lough Neagh, the largest lake in the UK by surface area.","The geography of the British Isles is profoundly shaped by its \u003cstrong>surrounding seas\u003c/strong>. Thanks to the warm ocean currents of the \u003cstrong>Gulf Stream\u003c/strong>, the country enjoys a \u003cstrong>temperate maritime climate\u003c/strong>. This means temperatures rarely drop below freezing for long, though the weather is famously changeable, often bringing rain and light \u003cstrong>drizzle\u003c/strong>. From the majestic White \u003cstrong>Cliffs\u003c/strong> of Dover to the scenic riverbanks of the Thames and Severn, the physical map of the UK provides an extraordinary variety of landscapes across its islands."],"answer_info":"","questions":[{"cat":"Popis","text":"Where on the map are the four constituent parts of the United Kingdom located?"},{"cat":"Srovnání","text":"In what ways does the terrain of Scotland differ from the landscape of southern England?"},{"cat":"Zeměpisné vlivy","text":"How does the Atlantic Gulf Stream influence the everyday weather and climate in the British Isles?"},{"cat":"Popis","text":"Which bodies of water separate Great Britain from mainland Europe and from Ireland?"},{"cat":"Názor","text":"Why do you think the Lake District and the Scottish Highlands have become such popular destinations for domestic tourism?"},{"cat":"Hypotéza","text":"If global warming were to weaken or disrupt the Gulf Stream in the North Atlantic, how would that transform the British climate?"},{"cat":"Srovnání","text":"How does the geographical size and terrain of the United Kingdom compare with that of the Czech Republic?"}],"phrases":[{"head":"\u003cstrong>When we examine the physical map of the UK,...\u003c/strong>","gloss":"Když se podíváme na fyzickou mapu Spojeného království,...","note":"zeměpisný úvod"},{"head":"\u003cstrong>It mostly consists of... / It is mainly characterized by...\u003c/strong>","gloss":"Vyznačuje se převážně... / Skládá se hlavně z...","note":"popis rysů krajiny"},{"head":"\u003cstrong>To the north / south / east / west lies...\u003c/strong>","gloss":"Na severu / jihu / východě / západě leží...","note":"určení polohy"},{"head":"\u003cstrong>What is particularly notable about its geography is...\u003c/strong>","gloss":"Co je na její geografii obzvláště pozoruhodné, je...","note":"upozornění na zajímavost"},{"head":"\u003cstrong>In terms of altitude and terrain,...\u003c/strong>","gloss":"Co se týče nadmořské výšky a terénu,...","note":"kategorie popisu"},{"head":"\u003cstrong>Thanks to the proximity of the ocean,...\u003c/strong>","gloss":"Díky blízkosti oceánu...","note":"příčinná souvislost"},{"head":"\u003cstrong>To conclude, the geographical variety of the UK is...\u003c/strong>","gloss":"Na závěr, zeměpisná rozmanitost Spojeného království je...","note":"závěrečné shrnutí"}],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>island nation\u003c/strong> [C; A1 + B1]","gloss":"ostrovní stát","example":"As an island nation, Britain has traded by sea for a long time."},{"head":"\u003cstrong>highest mountain\u003c/strong> [C; A1 + A1]","gloss":"nejvyšší hora","example":"Ben Nevis is the highest mountain in the British Isles (1,345 metres)."},{"head":"\u003cstrong>mild climate\u003c/strong> [C; B1 + A2]","gloss":"mírné podnebí","example":"Britain has a mild climate with mild winters and cool summers."},{"head":"\u003cstrong>coastline\u003c/strong> /ˈkəʊstlaɪn/ [C/U; B1]","gloss":"pobřeží, pobřežní linie","example":"The coastline of Cornwall attracts walkers from all over Europe."},{"head":"\u003cstrong>loch\u003c/strong> /lɒk/ AmE /lɑːk/ [C; slovo k tématu, B2]","gloss":"skotské jezero (sladkovodní i mořský záliv)","example":"Loch Ness is internationally famous for its deep water and the story of the Loch Ness Monster."},{"head":"\u003cstrong>scenery\u003c/strong> /ˈsiːnəri/ [U; B1]","gloss":"krajina, přírodní scenérie","example":"The Lake District in north-west England is famous for its romantic mountain scenery and lakes."},{"head":"\u003cstrong>light rain\u003c/strong> [U; B1 + A1]","gloss":"slabý drobný déšť, mrholení","example":"Grey skies and light rain are typical weather throughout autumn."},{"head":"\u003cstrong>cliff\u003c/strong> /klɪf/ [C; slovo k tématu, B2]","gloss":"útes, skalní sráz","example":"The famous White Cliffs of Dover are easy to see from ships that cross the Channel."},{"head":"\u003cstrong>natural border\u003c/strong> [C; A1 + B1]","gloss":"přirozená hranice","example":"Rivers are often natural borders."},{"head":"\u003cstrong>Gulf Stream\u003c/strong> (gulf /ɡʌlf/; stream /striːm/) [proper noun; slovo k tématu, bez úrovně]","gloss":"Golfský proud (spolu se Severoatlantským proudem – \u003cem>North Atlantic Drift\u003c/em>)","example":"Because of the warm water of the Gulf Stream, British winters are much milder than Canadian ones."},{"head":"\u003cstrong>longest river\u003c/strong> [C; A1 + A1]","gloss":"nejdelší řeka","example":"The Thames is the most famous, but the River Severn is the longest river in the UK (about 354 kilometres)."},{"head":"\u003cstrong>group of islands\u003c/strong> [C; A1 + A1 + A1]","gloss":"souostroví","example":"The British Isles are a large group of islands."}],"answer":["The United Kingdom is an \u003cstrong>island nation\u003c/strong> off the north-western coast of Europe. It is the largest part of the British Isles, a \u003cstrong>group of islands\u003c/strong>. The North Sea and the English Channel separate it from the European continent.","The UK consists of four countries: England, Scotland, Wales and Northern Ireland. England is the largest and has low farmland in the south and east. The Pennine mountains are like a backbone in its centre. Scotland, to the north, has some of Europe's most impressive wild areas, such as the Scottish Highlands. Its deep lakes, such as Loch Ness, are called \u003cstrong>lochs\u003c/strong>. Scotland also has the country's \u003cstrong>highest mountain\u003c/strong>, Ben Nevis. Most of Wales, to the west, is covered by the Cambrian Mountains and Snowdonia. Northern Ireland, across the Irish Sea, is famous for Lough Neagh, the largest lake in the UK by surface area.","Thanks to the warm \u003cstrong>Gulf Stream\u003c/strong>, the country has a \u003cstrong>mild climate\u003c/strong>. Temperatures are rarely below zero for long, although the weather is famous for changing often. It often brings rain, sometimes only \u003cstrong>light rain\u003c/strong>. From the White \u003cstrong>Cliffs\u003c/strong> of Dover to the banks of the Thames and Severn, the UK's \u003cstrong>scenery\u003c/strong> has amazing variety."],"questions":[{"cat":"Popis","text":"Where on the map are the four parts of the United Kingdom located?"},{"cat":"Srovnání","text":"How is the land in Scotland different from the land in southern England?"},{"cat":"Zeměpisné vlivy","text":"How does the Gulf Stream influence the everyday weather and climate in the British Isles?"},{"cat":"Popis","text":"Which areas of water separate Great Britain from the European continent and from Ireland?"},{"cat":"Názor","text":"Why have the Lake District and the Scottish Highlands become so popular with British tourists?"},{"cat":"Hypotéza","text":"If global warming made the Gulf Stream weaker, how would the British climate change?"},{"cat":"Srovnání","text":"How different are the UK and the Czech Republic in size and type of land?"}],"phrases":[{"head":"\u003cstrong>When we examine the map of the UK,...\u003c/strong>","gloss":"Když se podíváme na mapu Spojeného království,...","note":"zeměpisný úvod"},{"head":"\u003cstrong>It mostly consists of...\u003c/strong>","gloss":"Skládá se hlavně z...","note":"popis rysů krajiny"},{"head":"\u003cstrong>... is to the north / south / east / west.\u003c/strong>","gloss":"... leží na severu / jihu / východě / západě.","note":"určení polohy"},{"head":"\u003cstrong>A particularly interesting thing about its geography is...\u003c/strong>","gloss":"Obzvláště zajímavé na její geografii je...","note":"upozornění na zajímavost"},{"head":"\u003cstrong>If we talk about height above sea level and the type of land,...\u003c/strong>","gloss":"Pokud jde o nadmořskou výšku a typ terénu,...","note":"kategorie popisu"},{"head":"\u003cstrong>Because the ocean is close,...\u003c/strong>","gloss":"Protože je oceán blízko,...","note":"příčinná souvislost"},{"head":"\u003cstrong>To conclude, the geographical variety of the UK is...\u003c/strong>","gloss":"Na závěr, zeměpisná rozmanitost Spojeného království je...","note":"závěrečné shrnutí"}]},"codes":["SSO 11","CR 8b"],"groups":["cr","sso"],"rank":{"cr":17,"sso":22,"all":17.5}},{"file":"tema-s21-uk-usa-history-people.md","title":"The UK and the USA – history and people","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu.","vocab":[{"head":"\u003cstrong>conquest\u003c/strong> /ˈkɒŋkwest/ AmE /ˈkɑːŋkwest/ [C/U]","gloss":"dobytí, podmanění","example":"The Norman Conquest of 1066 under William the Conqueror dramatically transformed the English language and culture."},{"head":"\u003cstrong>Native Americans\u003c/strong> [plural]","gloss":"původní obyvatelé Ameriky, indiáni","example":"Long before European explorers arrived, diverse tribes of Native Americans inhabited the continent."},{"head":"\u003cstrong>colony\u003c/strong> /ˈkɒləni/ AmE /ˈkɑːləni/ [C]","gloss":"kolonie","example":"Britain established thirteen original colonies along the eastern seaboard of North America."},{"head":"\u003cstrong>Declaration of Independence\u003c/strong> (declaration /ˌdekləˈreɪʃn/; independence /ˌɪndɪˈpendəns/) [proper noun]","gloss":"Deklarace nezávislosti (klíčový americký dokument z roku 1776; obecně prohlášení nezávislosti: \u003cem>declaration of independence\u003c/em> [C])","example":"Adopted on July 4, 1776, the Declaration of Independence announced the birth of a new sovereign nation."},{"head":"\u003cstrong>civil war\u003c/strong> /ˌsɪvl ˈwɔː(r)/ AmE /ˌsɪvl ˈwɔːr/ [C]","gloss":"občanská válka","example":"The American Civil War between the industrial North and the slave-holding South lasted from 1861 to 1865."},{"head":"\u003cstrong>abolition of slavery\u003c/strong> (abolition /ˌæbəˈlɪʃn/; slavery /ˈsleɪvəri/) [U]","gloss":"zrušení otroctví","example":"President Abraham Lincoln played a vital historical role in the abolition of slavery in 1865."},{"head":"\u003cstrong>Industrial Revolution\u003c/strong> (industrial /ɪnˈdʌstriəl/; revolution /ˌrevəˈluːʃn/) [proper noun / U]","gloss":"průmyslová revoluce","example":"The Industrial Revolution started in eighteenth-century Britain, replacing manual labour with steam-powered machinery."},{"head":"\u003cstrong>melting pot\u003c/strong> /ˈmeltɪŋ pɒt/ AmE /ˈmeltɪŋ pɑːt/ [C, usually singular]","gloss":"tavicí kotel (společnost, kde se mísí různé kultury v novou identitu)","example":"For generations, the United States was described as a melting pot where millions of immigrants blended together."},{"head":"\u003cstrong>empire\u003c/strong> /ˈempaɪə/ AmE /ˈempaɪər/ [C]","gloss":"impérium, říše","example":"At its peak, the British Empire covered roughly one quarter of the world's land surface and governed hundreds of millions of people."},{"head":"\u003cstrong>settler\u003c/strong> /ˈsetlə/ AmE /ˈsetlər/ [C]","gloss":"osadník, kolonista (přistěhovalec obecně je \u003cem>immigrant\u003c/em>)","example":"Early European settlers faced harsh winters, disease, and starvation when building their first settlements."},{"head":"\u003cstrong>civil rights movement\u003c/strong> (civil /ˈsɪvl/) [C, usually singular]","gloss":"hnutí za občanská práva (v textu se členem a malými písmeny: \u003cem>the civil rights movement\u003c/em>)","example":"Led by Martin Luther King Jr., the civil rights movement in the 1960s fought against racial segregation."},{"head":"\u003cstrong>monarch\u003c/strong> /ˈmɒnək/ AmE /ˈmɑːnərk/ [C]","gloss":"panovník, král či královna","example":"King Charles III serves as the constitutional monarch of the United Kingdom."},{"head":"\u003cstrong>reign\u003c/strong> /reɪn/ [C]","gloss":"vláda, panování","example":"The Victorian era was marked by the long reign of Queen Victoria, during which Britain expanded industrially."},{"head":"\u003cstrong>multicultural society\u003c/strong> (multicultural /ˌmʌltiˈkʌltʃərəl/) [C]","gloss":"multikulturní společnost","example":"Post-war immigration transformed Britain into a vibrant, modern multicultural society."},{"head":"\u003cstrong>heritage\u003c/strong> /ˈherɪtɪdʒ/ [U]","gloss":"historické a kulturní dědictví","example":"Both countries take pride in preserving their architectural, political, and literary heritage."},{"head":"\u003cstrong>Founding Fathers\u003c/strong> [proper noun, plural]","gloss":"Otcové zakladatelé (klíčové osobnosti vzniku a ústavy USA)","example":"Figures like George Washington, Thomas Jefferson, and Benjamin Franklin are revered as the Founding Fathers of the United States."},{"head":"\u003cstrong>treaty\u003c/strong> /ˈtriːti/ [C]","gloss":"mezinárodní smlouva, úmluva (mírová smlouva je specificky \u003cem>peace treaty\u003c/em>)","example":"The Treaty of Paris in 1783 officially brought the American Revolutionary War to an end."},{"head":"\u003cstrong>immigrant\u003c/strong> /ˈɪmɪɡrənt/ [C]","gloss":"přistěhovalec, imigrant","example":"Millions of hopeful European immigrants entered New York Harbor through Ellis Island after it opened in 1892."},{"head":"\u003cstrong>racial segregation\u003c/strong> (racial /ˈreɪʃl/; segregation /ˌseɡrɪˈɡeɪʃn/) [U]","gloss":"rasová segregace","example":"Before the 1960s, African Americans in southern states were subjected to legal racial segregation in schools and buses."},{"head":"\u003cstrong>Pilgrim Fathers\u003c/strong> (pilgrim /ˈpɪlɡrɪm/) [plural]","gloss":"Otcové poutníci (angličtí puritáni, kteří připluli na lodi Mayflower roku 1620)","example":"The Pilgrim Fathers established Plymouth Colony in search of religious freedom from the Church of England."},{"head":"\u003cstrong>struggle for freedom\u003c/strong> (struggle /ˈstrʌɡl/; freedom /ˈfriːdəm/) [C/U]","gloss":"boj za svobodu","example":"The historical struggle for freedom from colonial rule inspired democratic movements across the world."},{"head":"\u003cstrong>diversity\u003c/strong> /daɪˈvɜːsəti/ AmE /daɪˈvɜːrsəti/ [U]","gloss":"rozmanitost","example":"The ethnic and cultural diversity of modern American cities reflects waves of immigration over two centuries."}],"answer":["The histories of the United Kingdom and the United States are closely linked, but each nation followed its own path. British history stretches back thousands of years. A major turning point came in 1066 with the Norman \u003cstrong>Conquest\u003c/strong>, which brought French influences into the English language and created a strong royal government. Over the centuries, Britain grew into a major power. The \u003cstrong>Industrial Revolution\u003c/strong> in the eighteenth century transformed it into the world's workshop, while the \u003cstrong>British Empire\u003c/strong> spread the English language, legal principles, and sports across the world. Today, waves of post-war immigration have turned modern Britain into a diverse \u003cstrong>multicultural society\u003c/strong>.","Across the Atlantic, American history started with ancient \u003cstrong>Native American\u003c/strong> nations and later European \u003cstrong>settlers\u003c/strong>, including the \u003cstrong>Pilgrim Fathers\u003c/strong> who sailed over in 1620. Frustration with British taxes led the thirteen \u003cstrong>colonies\u003c/strong> to fight the Revolutionary War and adopt the \u003cstrong>Declaration of Independence\u003c/strong> in 1776, drafted by Thomas Jefferson and supported by \u003cstrong>Founding Fathers\u003c/strong> like Benjamin Franklin and George Washington.","The young republic soon faced profound challenges. The American \u003cstrong>Civil War\u003c/strong> in the 1860s preserved the nation and brought the \u003cstrong>abolition of slavery\u003c/strong> under Abraham Lincoln. A century later, the \u003cstrong>civil rights movement\u003c/strong> led by Martin Luther King Jr. bravely fought against \u003cstrong>racial segregation\u003c/strong>. Often described as a \u003cstrong>melting pot\u003c/strong>, the United States was built by millions of \u003cstrong>immigrants\u003c/strong> seeking freedom and opportunity. Together, British parliamentary roots and American democratic energy remain powerful forces today."],"answer_info":"","questions":[{"cat":"Popis","text":"What was the significance of the Norman Conquest in 1066 for British culture and language?"},{"cat":"Srovnání","text":"In what ways did the historical development of democracy differ between the British monarchy and the American republic?"},{"cat":"Příčiny a důsledky","text":"What main factors caused the American colonies to declare independence from Great Britain in 1776?"},{"cat":"Popis","text":"What role did Abraham Lincoln play in the American Civil War and the abolition of slavery?"},{"cat":"Názor","text":"Why is Martin Luther King Jr. considered such an influential figure in twentieth-century American history?"},{"cat":"Srovnání konceptů","text":"How does the traditional American metaphor of a \"melting pot\" compare to the modern concept of a \"salad bowl\" or mosaic?"},{"cat":"Hypotéza","text":"If the American colonists had negotiated full representation in the British Parliament in the 1770s, how might history have changed?"}],"phrases":[{"head":"\u003cstrong>A major turning point in their history was...\u003c/strong>","gloss":"Hlavním zlomovým bodem v jejich historii bylo...","note":"označení klíčové události"},{"head":"\u003cstrong>Historically speaking, both nations...\u003c/strong>","gloss":"Z historického hlediska oba národy...","note":"historické srovnání"},{"head":"\u003cstrong>The roots of this conflict can be traced back to...\u003c/strong>","gloss":"Kořeny tohoto konfliktu lze vystopovat až k...","note":"hledání příčin"},{"head":"\u003cstrong>It is widely recognized that...\u003c/strong>","gloss":"Je všeobecně uznáváno, že...","note":"odkaz na historický fakt"},{"head":"\u003cstrong>In the aftermath of the war,...\u003c/strong>","gloss":"V období po válce / v důsledku války...","note":"popis následků"},{"head":"\u003cstrong>When looking at modern society, it is clear that...\u003c/strong>","gloss":"Když se podíváme na moderní společnost, je jasné, že...","note":"popis složení obyvatelstva"},{"head":"\u003cstrong>To sum up, the historical legacy of both countries...\u003c/strong>","gloss":"Abych to shrnul, historický odkaz obou zemí...","note":"závěrečné vyhodnocení"}],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>the Norman Conquest\u003c/strong> (conquest /ˈkɒŋkwest/ AmE /ˈkɑːŋkwest/) [proper noun; vlastní jméno]","gloss":"normanské dobytí Anglie (1066)","example":"The Norman Conquest of 1066 changed the English language and culture a lot."},{"head":"\u003cstrong>Native Americans\u003c/strong> [plural; vlastní jméno]","gloss":"původní obyvatelé Ameriky, indiáni","example":"Long before European explorers arrived, Native Americans lived on the continent."},{"head":"\u003cstrong>colony\u003c/strong> /ˈkɒləni/ AmE /ˈkɑːləni/ [C; slovo k tématu, B2]","gloss":"kolonie","example":"Britain set up thirteen colonies on the east coast of North America."},{"head":"\u003cstrong>the Declaration of Independence\u003c/strong> (declaration /ˌdekləˈreɪʃn/; independence /ˌɪndɪˈpendəns/) [proper noun; vlastní jméno]","gloss":"Deklarace nezávislosti (klíčový americký dokument z roku 1776)","example":"The Declaration of Independence was accepted on July 4, 1776."},{"head":"\u003cstrong>the American Civil War\u003c/strong> (civil war /ˌsɪvl ˈwɔː(r)/ AmE /ˌsɪvl ˈwɔːr/) [proper noun; vlastní jméno]","gloss":"americká občanská válka","example":"The American Civil War between the North and the South lasted from 1861 to 1865."},{"head":"\u003cstrong>end of slavery\u003c/strong> (slavery /ˈsleɪvəri/) [U; A1 + slovo k tématu, C1]","gloss":"zrušení otroctví, konec otroctví","example":"Abraham Lincoln played a very important role in the end of slavery."},{"head":"\u003cstrong>the Industrial Revolution\u003c/strong> (industrial /ɪnˈdʌstriəl/; revolution /ˌrevəˈluːʃn/) [proper noun; vlastní jméno]","gloss":"průmyslová revoluce","example":"The Industrial Revolution started in Britain in the eighteenth century."},{"head":"\u003cstrong>melting pot\u003c/strong> /ˈmeltɪŋ pɒt/ AmE /ˈmeltɪŋ pɑːt/ [C, usually singular; slovo k tématu, bez úrovně]","gloss":"tavicí kotel (společnost, kde se mísí různé kultury v novou identitu)","example":"For generations, the United States was described as a melting pot where millions of immigrants mixed together."},{"head":"\u003cstrong>the British Empire\u003c/strong> (empire /ˈempaɪə/ AmE /ˈempaɪər/) [proper noun; vlastní jméno]","gloss":"Britské impérium","example":"At its biggest, the British Empire controlled hundreds of millions of people."},{"head":"\u003cstrong>movement for equal rights\u003c/strong> (noun phrase; B1 + A1 + B1 + B1)","gloss":"hnutí za rovná (občanská) práva","example":"Martin Luther King Jr. led the 1960s movement for equal rights."},{"head":"\u003cstrong>king or queen\u003c/strong> (noun phrase; A2 + A2)","gloss":"panovník, král či královna","example":"Charles III is the UK's king, but the law limits his power."},{"head":"\u003cstrong>society with many cultures\u003c/strong> (noun phrase; A2 + A1 + A1 + A1)","gloss":"multikulturní společnost","example":"After the war, immigrants made Britain a modern society with many cultures."},{"head":"\u003cstrong>the Second World War\u003c/strong> [proper noun; vlastní jméno]","gloss":"druhá světová válka","example":"After the Second World War, immigrants came to Britain."},{"head":"\u003cstrong>the Founding Fathers\u003c/strong> [proper noun, plural; vlastní jméno]","gloss":"Otcové zakladatelé (klíčové osobnosti vzniku a ústavy USA)","example":"George Washington, Thomas Jefferson and Benjamin Franklin are among the Founding Fathers."},{"head":"\u003cstrong>the Revolutionary War\u003c/strong> [proper noun; vlastní jméno]","gloss":"americká válka za nezávislost","example":"The Treaty of Paris ended the American Revolutionary War in 1783."},{"head":"\u003cstrong>immigrant\u003c/strong> /ˈɪmɪɡrənt/ [C; B1]","gloss":"přistěhovalec, imigrant","example":"Millions of European immigrants entered New York Harbor through Ellis Island after it opened in 1892."},{"head":"\u003cstrong>the Pilgrim Fathers\u003c/strong> (pilgrim /ˈpɪlɡrɪm/) [proper noun, plural; vlastní jméno]","gloss":"Otcové poutníci (angličtí puritáni, kteří připluli na lodi Mayflower roku 1620)","example":"The Pilgrim Fathers set up Plymouth Colony to be free from the Church of England."},{"head":"\u003cstrong>fight to be free\u003c/strong> (phrase; B1 + A1 + A1 + B1)","gloss":"boj za svobodu, bojovat za svobodu","example":"The historical fight to be free encouraged movements across the world."},{"head":"\u003cstrong>variety\u003c/strong> (noun; A2)","gloss":"rozmanitost","example":"Because of immigrants, modern American cities have a variety of cultures."},{"head":"\u003cstrong>Parliament\u003c/strong> [proper noun; vlastní jméno]","gloss":"britský parlament","example":"In the 1770s, the American colonies had no MPs in Parliament."}],"answer":["The UK and the USA have historical links, but each nation developed differently. A major change came in 1066 with \u003cstrong>the Norman Conquest\u003c/strong>. It brought French influences into the English language and created a strong royal government. In the eighteenth century, \u003cstrong>the Industrial Revolution\u003c/strong> made Britain the world's factory. \u003cstrong>The British Empire\u003c/strong> spread the English language and sports across the world. Since \u003cstrong>the Second World War\u003c/strong>, \u003cstrong>immigrants\u003c/strong> have made modern Britain a \u003cstrong>society with many cultures\u003c/strong>.","American history started with the ancient peoples of the \u003cstrong>Native Americans\u003c/strong>. Later, Europeans came to live there, like \u003cstrong>the Pilgrim Fathers\u003c/strong> in 1620. The thirteen \u003cstrong>colonies\u003c/strong> were annoyed about British taxes, so they fought \u003cstrong>the Revolutionary War\u003c/strong>. In 1776, they accepted \u003cstrong>the Declaration of Independence\u003c/strong>. Thomas Jefferson wrote its first version.","In the 1860s, \u003cstrong>the American Civil War\u003c/strong> kept the country together. It also brought the \u003cstrong>end of slavery\u003c/strong> while Abraham Lincoln was president. A century later, Martin Luther King Jr. led the \u003cstrong>movement for equal rights\u003c/strong>. It bravely fought against keeping people of different races apart. The United States is often described as a \u003cstrong>melting pot\u003c/strong>. It was built by millions of \u003cstrong>immigrants\u003c/strong> who wanted to be free and find opportunities."],"questions":[{"cat":"Popis","text":"Why was the Norman Conquest in 1066 important for British culture and language?"},{"cat":"Srovnání","text":"How did government by the people develop differently in Britain and the USA? \u003cem>(a country with a king or queen, a country with a president and no king or queen)\u003c/em>"},{"cat":"Příčiny a důsledky","text":"What were the main causes of the American Declaration of Independence in 1776?"},{"cat":"Popis","text":"What role did Abraham Lincoln play in the Civil War and the end of slavery?"},{"cat":"Názor","text":"Why do people think Martin Luther King Jr. was so important in twentieth-century American history?"},{"cat":"Srovnání konceptů","text":"How would you compare the American idea of a \"melting pot\" and a \"salad bowl\"? \u003cem>(the traditional idea and the modern idea)\u003c/em>"},{"cat":"Hypotéza","text":"Imagine the American colonies get MPs in Parliament in the 1770s. How might history change? \u003cem>(after talks with the British government; MPs for all the people in the colonies)\u003c/em>"}],"phrases":[{"head":"\u003cstrong>A major change in their history was...\u003c/strong>","gloss":"Velkou změnou v jejich historii bylo...","note":"označení klíčové události"},{"head":"\u003cstrong>If we look at history, both nations...\u003c/strong>","gloss":"Když se podíváme na historii, oba národy...","note":"historické srovnání"},{"head":"\u003cstrong>This fight started a long time before, with...\u003c/strong>","gloss":"Tento spor začal už dávno předtím, a to...","note":"hledání příčin"},{"head":"\u003cstrong>Most people agree that...\u003c/strong>","gloss":"Většina lidí souhlasí s tím, že...","note":"odkaz na historický fakt"},{"head":"\u003cstrong>In the years after the war,...\u003c/strong>","gloss":"V letech po válce...","note":"popis následků"},{"head":"\u003cstrong>When we look at modern society, it is clear that...\u003c/strong>","gloss":"Když se podíváme na moderní společnost, je jasné, že...","note":"popis složení obyvatelstva"},{"head":"\u003cstrong>In conclusion, the history of both countries has left...\u003c/strong>","gloss":"Závěrem: historie obou zemí zanechala...","note":"závěrečné vyhodnocení"}]},"codes":["SSO 11","SSO 23","CR 8b","CR 11b"],"groups":["cr","sso"],"rank":{"cr":17,"sso":22,"all":17.5}},{"file":"doplnek-o11-c8b-uk-politics-symbols-places.md","title":"Doplněk: UK Political System, Symbols and Places of Interest","label":"Navrhla AI, schválil učitel (7. 11. 2026).","vocab":[{"head":"\u003cstrong>elect\u003c/strong> /ɪˈlekt/ (verb; B2)","gloss":"zvolit (ve volbách)","example":"Voters elect 650 Members of Parliament in local constituencies across the UK."},{"head":"\u003cstrong>vote\u003c/strong> /vəʊt/ AmE /voʊt/ (verb; B1)","gloss":"hlasovat, volit","example":"If I could vote, I would read about the candidates first."},{"head":"\u003cstrong>debate\u003c/strong> /dɪˈbeɪt/ [C or U; B2]","gloss":"debata, rozprava","example":"I would like to follow a debate about an issue that affects young people."},{"head":"\u003cstrong>politician\u003c/strong> /ˌpɒləˈtɪʃn/ AmE /ˌpɑːləˈtɪʃn/ [C; B1]","gloss":"politik, politička","example":"I would ask a politician what they plan to do for schools."},{"head":"\u003cstrong>flag\u003c/strong> /flæɡ/ [C; B1]","gloss":"vlajka","example":"The Union Jack is the national flag of the United Kingdom."},{"head":"\u003cstrong>cross\u003c/strong> /krɒs/ AmE /krɔːs/ [C; B1]","gloss":"kříž (křesťanský symbol)","example":"In my drawing of a church, there is a cross above the entrance."},{"head":"\u003cstrong>rose\u003c/strong> /rəʊz/ AmE /roʊz/ [C; B1]","gloss":"růže","example":"The rose is a floral symbol of England."},{"head":"\u003cstrong>ruin\u003c/strong> /ˈruːɪn/ [C; B1]","gloss":"zřícenina, ruina","example":"I would enjoy visiting a castle ruin and imagining how people once lived there."},{"head":"\u003cstrong>mystery\u003c/strong> /ˈmɪstri/ AmE /ˈmɪstəri/ [C or U; B1]","gloss":"záhada, tajemství","example":"For our history project, we could write a story about an unsolved mystery."},{"head":"\u003cstrong>poet\u003c/strong> /ˈpəʊɪt/ AmE /ˈpoʊət/ [C; B1]","gloss":"básník, básnířka","example":"I would like to ask a poet how they choose the subjects of their poems."}],"answer":["The UK is a constitutional monarchy. In November 2026, King Charles III is head of state and Andy Burnham is Prime Minister. Voters \u003cstrong>elect\u003c/strong> MPs in local constituencies. The Commons and Lords examine laws through political \u003cstrong>debate\u003c/strong>. Before deciding how to \u003cstrong>vote\u003c/strong>, I would ask a \u003cstrong>politician\u003c/strong> about schools. The national \u003cstrong>flag\u003c/strong> combines the crosses of St George, St Andrew and St Patrick. Floral symbols include England's \u003cstrong>rose\u003c/strong>, Scotland's thistle, Wales's daffodil and Northern Ireland's shamrock. Outside London, I would visit Stonehenge's prehistoric stone circle and Edinburgh Castle. I would also explore a castle \u003cstrong>ruin\u003c/strong>, read a poem by a local \u003cstrong>poet\u003c/strong>, or investigate a historical \u003cstrong>mystery\u003c/strong> for school."],"answer_info":"","questions":[{"cat":"","text":"\u003cstrong>How do the roles of the monarch, Prime Minister and Parliament differ in the UK?\u003c/strong> \u003cem>(head of state, leadership of government, examining laws and government policy)\u003c/em>"},{"cat":"","text":"\u003cstrong>How do the Union Jack and floral symbols represent the countries of the UK?\u003c/strong> \u003cem>(crosses of St George, St Andrew and St Patrick; rose, thistle, daffodil and shamrock)\u003c/em>"},{"cat":"","text":"\u003cstrong>Which place outside London would you most like to visit, and why?\u003c/strong> \u003cem>(Stonehenge or Edinburgh Castle; history, appearance, your interests)\u003c/em>"}],"phrases":[],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>election\u003c/strong> [C or U; B1]","gloss":"volby","example":"In an election, voters choose 650 MPs in local areas."},{"head":"\u003cstrong>vote\u003c/strong> /vəʊt/ AmE /voʊt/ (verb; B1)","gloss":"hlasovat, volit","example":"If I could vote, I would read about the candidates first."},{"head":"\u003cstrong>discussion\u003c/strong> [C or U; A2]","gloss":"diskuse, rozprava","example":"I'd like to hear a discussion about something that affects young people."},{"head":"\u003cstrong>politician\u003c/strong> /ˌpɒləˈtɪʃn/ AmE /ˌpɑːləˈtɪʃn/ [C; B1]","gloss":"politik, politička","example":"I would ask a politician what they plan to do for schools."},{"head":"\u003cstrong>flag\u003c/strong> /flæɡ/ [C; B1]","gloss":"vlajka","example":"The Union Jack is the national flag of the United Kingdom."},{"head":"\u003cstrong>cross\u003c/strong> /krɒs/ AmE /krɔːs/ [C; B1]","gloss":"kříž (křesťanský symbol)","example":"In my drawing of a church, there is a cross above the entrance."},{"head":"\u003cstrong>rose\u003c/strong> /rəʊz/ AmE /roʊz/ [C; slovo k tématu, B2]","gloss":"růže","example":"The rose is a flower symbol of England."},{"head":"\u003cstrong>mystery\u003c/strong> /ˈmɪstri/ AmE /ˈmɪstəri/ [C or U; B1]","gloss":"záhada, tajemství","example":"For our history project, we could write a story about a mystery that nobody has solved."},{"head":"\u003cstrong>poet\u003c/strong> /ˈpəʊɪt/ AmE /ˈpoʊət/ [C; B1]","gloss":"básník, básnířka","example":"I would like to ask a poet how they choose the subjects of their poems."},{"head":"\u003cstrong>Parliament\u003c/strong> [vlastní jméno]","gloss":"britský parlament","example":"In the UK, Parliament examines laws."},{"head":"\u003cstrong>House of Commons\u003c/strong> (the Commons) [vlastní jméno]","gloss":"Dolní sněmovna britského parlamentu","example":"The House of Commons and the House of Lords examine laws."},{"head":"\u003cstrong>House of Lords\u003c/strong> (the Lords) [vlastní jméno]","gloss":"Sněmovna lordů (horní komora britského parlamentu)","example":"The House of Lords also examines laws."},{"head":"\u003cstrong>Union Jack\u003c/strong> (the Union Jack) [vlastní jméno]","gloss":"britská vlajka","example":"The Union Jack combines three crosses."}],"answer":["In November 2026, King Charles III is head of state and Andy Burnham is Prime Minister. The King's power is limited by law. In \u003cstrong>elections\u003c/strong>, voters choose local MPs. The \u003cstrong>Commons\u003c/strong> and \u003cstrong>Lords\u003c/strong> examine laws through political \u003cstrong>discussion\u003c/strong>. The national \u003cstrong>flag\u003c/strong> combines the \u003cstrong>crosses\u003c/strong> of St George, St Andrew and St Patrick. Each UK country has a flower symbol, such as England's \u003cstrong>rose\u003c/strong>. Outside London, I would visit Edinburgh Castle and Stonehenge. I would investigate a historical \u003cstrong>mystery\u003c/strong> for school."],"questions":[{"cat":"","text":"\u003cstrong>How are the roles of the King, Prime Minister and Parliament different in the UK?\u003c/strong> \u003cem>(head of state, leading the government, examining laws and government policy)\u003c/em>"},{"cat":"","text":"\u003cstrong>How do the Union Jack and flower symbols represent the countries of the UK?\u003c/strong> \u003cem>(crosses of St George, St Andrew and St Patrick; England's rose and the flower symbols of the other countries)\u003c/em>"},{"cat":"","text":"\u003cstrong>Which place outside London would you most like to visit?\u003c/strong> \u003cem>(Stonehenge or Edinburgh Castle; history, appearance, your interests, your reasons)\u003c/em>"}],"phrases":[]},"codes":["SSO 11","CR 8b"],"groups":["cr","sso"],"rank":{"cr":17,"sso":22,"all":17.5}},{"file":"tema-o12-c17b-australia-and-new-zealand.md","title":"Australia and New Zealand","label":"Navrhla AI, schválil učitel (7. 11. 2026).","vocab":[{"head":"\u003cstrong>continent\u003c/strong> /ˈkɒntɪnənt/ AmE /ˈkɑːntɪnənt/ [C; B1]","gloss":"kontinent, světadíl","example":"I would need a long holiday to travel across a whole continent."},{"head":"\u003cstrong>southern\u003c/strong> /ˈsʌðən/ AmE /ˈsʌðərn/ (adjective; B1)","gloss":"jižní","example":"I would like to explore the southern part of New Zealand."},{"head":"\u003cstrong>remote\u003c/strong> /rɪˈməʊt/ (adjective; B2)","gloss":"odlehlý, vzdálený","example":"We would plan carefully before visiting a remote village far from the nearest town."},{"head":"\u003cstrong>magnificent\u003c/strong> /mæɡˈnɪfɪsnt/ (adjective; B1)","gloss":"nádherný, velkolepý, obdivuhodný","example":"The view from the mountain path was magnificent."},{"head":"\u003cstrong>tropical\u003c/strong> /ˈtrɒpɪkl/ AmE /ˈtrɑːpɪkl/ (adjective; B2)","gloss":"tropický","example":"I would pack light clothes for a holiday in a tropical climate."},{"head":"\u003cstrong>rainforest\u003c/strong> /ˈreɪnfɒrɪst/ AmE /ˈreɪnfɔːrɪst/ [C or U; B1]","gloss":"deštný prales","example":"We walked through an ancient rainforest full of giant ferns and colourful birds."},{"head":"\u003cstrong>shore\u003c/strong> /ʃɔː/ AmE /ʃɔːr/ [C or U; B1]","gloss":"pobřeží, břeh (moře či jezera)","example":"We sat on the shore and watched the waves."},{"head":"\u003cstrong>sandy\u003c/strong> /ˈsændi/ (adjective; B1)","gloss":"písečný, písčitý","example":"I prefer a sandy beach to one covered in stones."},{"head":"\u003cstrong>rock\u003c/strong> /rɒk/ AmE /rɑːk/ [C or U; B1]","gloss":"skála, skalní útvar, hornina","example":"Uluru is a massive red sandstone rock that rises above the flat desert plain."},{"head":"\u003cstrong>earthquake\u003c/strong> /ˈɜːθkweɪk/ AmE /ˈɜːrθkweɪk/ [C; B2]","gloss":"zemětřesení","example":"The earthquake damaged several roads near the town."},{"head":"\u003cstrong>unique\u003c/strong> /juˈniːk/ (adjective; B2)","gloss":"jedinečný, unikátní","example":"Every visitor brings a unique combination of interests and experiences."},{"head":"\u003cstrong>species\u003c/strong> /ˈspiːʃiːz/ [C; B2]","gloss":"živočišný nebo rostlinný druh (stejný tvar v sg. i pl.)","example":"Hundreds of fish species live among the corals of the Great Barrier Reef."},{"head":"\u003cstrong>creature\u003c/strong> /ˈkriːtʃə/ AmE /ˈkriːtʃər/ [C; B1]","gloss":"tvor, živočich","example":"The guide showed us a tiny creature hiding under a leaf."},{"head":"\u003cstrong>poisonous\u003c/strong> /ˈpɔɪzənəs/ (adjective; B2)","gloss":"jedovatý","example":"We asked the guide whether the unfamiliar berries were poisonous."},{"head":"\u003cstrong>cattle\u003c/strong> /ˈkætl/ [plural; B1]","gloss":"skot, dobytek","example":"The farmer moved the cattle into a different field."},{"head":"\u003cstrong>discover\u003c/strong> /dɪˈskʌvə/ AmE /dɪˈskʌvər/ (verb; B1)","gloss":"objevit","example":"I hope to discover a new walking route during my holiday."},{"head":"\u003cstrong>settle\u003c/strong> /ˈsetl/ (verb; B2)","gloss":"usadit se, osídlit","example":"My cousin hopes to settle in New Zealand after finishing university."},{"head":"\u003cstrong>ancestor\u003c/strong> /ˈænsestə/ AmE /ˈænsestər/ [C; B2]","gloss":"předek","example":"The family keeps photographs and letters written by their ancestors."},{"head":"\u003cstrong>tribe\u003c/strong> /traɪb/ [C; B2]","gloss":"kmen","example":"The book describes the history of a local tribe."},{"head":"\u003cstrong>ceremony\u003c/strong> /ˈserəməni/ AmE /ˈserəməʊni/ [C; B1]","gloss":"obřad, slavnost","example":"Visitors listened quietly during the welcome ceremony."},{"head":"\u003cstrong>surf\u003c/strong> /sɜːf/ AmE /sɜːrf/ (verb; B1)","gloss":"surfovat (na vlnách)","example":"I would like to learn to surf with a qualified instructor."},{"head":"\u003cstrong>dive\u003c/strong> /daɪv/ (verb; B1)","gloss":"potápět se","example":"I would like to learn to dive with an instructor."},{"head":"\u003cstrong>sail\u003c/strong> /seɪl/ (verb; B1)","gloss":"plout, plachtit (na lodi či plachetnici)","example":"We hope to sail along the coast when the weather improves."},{"head":"\u003cstrong>backpacker\u003c/strong> /ˈbækpækə(r)/ AmE /ˈbækpækər/ [C; B1]","gloss":"baťůžkář, nezávislý cestovatel s batohem","example":"New Zealand is a dream destination for backpackers who enjoy hiking and camping in national parks."}],"answer":["Australia and New Zealand would be exciting destinations for a student from České Budějovice. Both are constitutional monarchies, with King Charles III as head of state. I would like to compare their ways of life with my own and practise English during the trip.","Australia is a federation of six states, and it has two self-governing territories. Canberra is the capital. Australia's estimated population was about 27.9 million on 31 March 2026. Travelling across a whole \u003cstrong>continent\u003c/strong> would take careful planning, so I would choose a few destinations. In Sydney, I would visit the Opera House and Harbour Bridge. I would also enjoy a \u003cstrong>sandy\u003c/strong> beach, learn to \u003cstrong>surf\u003c/strong>, and walk along the \u003cstrong>shore\u003c/strong>. For a trip to a \u003cstrong>remote\u003c/strong> area, I would plan transport and accommodation in advance. Uluru is a huge red \u003cstrong>rock\u003c/strong> in central Australia and a sacred place for the Anangu people. I would want to learn about its meaning from local guides. Another attraction is the Great Barrier Reef, where many coral and fish \u003cstrong>species\u003c/strong> live. Before a seaside holiday, I would take lessons to learn to \u003cstrong>dive\u003c/strong>.","New Zealand has two main islands, the North Island and the South Island, as well as smaller islands. Its capital is Wellington. On 30 June 2026, New Zealand's population was provisionally estimated at about 5.36 million. The landscape includes mountains, lakes and volcanoes. I would especially like to explore the \u003cstrong>southern\u003c/strong> part of the country. Māori are its indigenous people, and I would like to learn about their traditions. For me, each country would offer a \u003cstrong>unique\u003c/strong> experience. As a tourism student, I would compare ways of helping visitors enjoy these places while respecting local communities and nature.","\u003cem>Varianta SSO: poslední větu začni „As a business-school student…“ a porovnej služby pro návštěvníky.\u003c/em>"],"answer_info":"","questions":[{"cat":"","text":"\u003cstrong>What places would you include in a short introduction to Australia and New Zealand?\u003c/strong> \u003cem>(capitals, islands, Uluru, the Great Barrier Reef, reasons for your choices)\u003c/em>"},{"cat":"","text":"\u003cstrong>Which of New Zealand's two main islands would you choose for a holiday, and why?\u003c/strong> \u003cem>(reading a map, comparing landscapes, planning preferred activities)\u003c/em>"},{"cat":"","text":"\u003cstrong>What experience of a beach, mountain or forest holiday would help you plan this trip?\u003c/strong> \u003cem>(your experience or a trip you would like to try; equipment, weather, company)\u003c/em>"},{"cat":"","text":"\u003cstrong>How could visitors show respect for indigenous communities and sacred places?\u003c/strong> \u003cem>(local guides, asking before taking photographs, listening, following local rules)\u003c/em>"},{"cat":"","text":"\u003cstrong>How would travelling as a backpacker differ from joining an organised tour?\u003c/strong> \u003cem>(cost, independence, transport, meeting people, responsibility)\u003c/em>"},{"cat":"","text":"\u003cstrong>Which outdoor activities would you choose, and why?\u003c/strong> \u003cem>(surfing, diving, sailing, hiking, camping; preferences and experience)\u003c/em>"},{"cat":"","text":"\u003cstrong>What practical challenges would a Czech tourist face when planning a trip to Australia or New Zealand?\u003c/strong> \u003cem>(flights, budget, time zones, weather, accommodation, entry requirements)\u003c/em>"}],"phrases":[{"head":"\u003cstrong>Down Under\u003c/strong> \u003cem>(informal)\u003c/em>","gloss":"v Austrálii či na Novém Zélandu; do Austrálie či na Nový Zéland","note":""},{"head":"\u003cstrong>the Australian Outback\u003c/strong>","gloss":"vyprahlé a řídce osídlené australské vnitrozemí","note":""},{"head":"\u003cstrong>on the other side of the globe\u003c/strong>","gloss":"na opačné straně zeměkoule","note":""},{"head":"\u003cstrong>have a laid-back lifestyle\u003c/strong>","gloss":"mít pohodový, uvolněný životní styl","note":""},{"head":"\u003cstrong>be home to unique wildlife\u003c/strong>","gloss":"být domovem jedinečných živočichů a rostlin žijících volně v přírodě","note":""},{"head":"\u003cstrong>consist of two main islands\u003c/strong>","gloss":"skládat se ze dvou hlavních ostrovů","note":""},{"head":"\u003cstrong>be sacred to indigenous people\u003c/strong>","gloss":"být posvátný pro původní obyvatele","note":""}],"b1":{"label":"B1: zjednod > in central Australia and an important religious place for the \u003cstrong>Anangu\u003c/strong> people. Another attraction is the Great Barrier Reef, where many kinds of coral and fish live. I would take lessons to learn to \u003cstrong>dive\u003c/strong>.","New Zealand has two main islands, the North Island and the South Island. Its capital is Wellington. It has mountains, lakes and volcanoes. I would like to explore the \u003cstrong>southern\u003c/strong> part of the country. \u003cstrong>Māori\u003c/strong> are its first people, and I would like to learn about their traditions. As a tourism student, I would compare ways to help visitors enjoy these places and respect local communities and nature.","\u003cem>Varianta SSO: poslední větu začni „As a business-school student…“ a porovnej služby pro návštěvníky.\u003c/em>"],"questions":[{"cat":"","text":"\u003cstrong>What places would you include in a short introduction to Australia and New Zealand?\u003c/strong> \u003cem>(capitals, islands, Uluru, the Great Barrier Reef, reasons for your choices)\u003c/em>"},{"cat":"","text":"\u003cstrong>Which of New Zealand's two main islands would you choose for a holiday?\u003c/strong> \u003cem>(reading a map, comparing what the islands look like, planning the activities you prefer; your reasons)\u003c/em>"},{"cat":"","text":"\u003cstrong>What experience of a beach, mountain or forest holiday would help you plan this trip?\u003c/strong> \u003cem>(your experience or a trip you would like to try; equipment, weather, company)\u003c/em>"},{"cat":"","text":"\u003cstrong>How could visitors show respect for first peoples and their important religious places?\u003c/strong> \u003cem>(local guides, asking before taking photographs, listening, following local rules)\u003c/em>"},{"cat":"","text":"\u003cstrong>How would travelling as a backpacker be different from joining an organised tour?\u003c/strong> \u003cem>(cost, being free to choose, transport, meeting people, responsibility)\u003c/em>"},{"cat":"","text":"\u003cstrong>Which outdoor activities would you choose?\u003c/strong> \u003cem>(surfing, diving, sailing, hiking, camping; what you like, your experience and your reasons)\u003c/em>"},{"cat":"","text":"\u003cstrong>What practical challenges would a Czech tourist face when they plan this trip?\u003c/strong> \u003cem>(flights, how much money you can spend, the time difference, weather, accommodation, what you need to enter the country)\u003c/em>"}],"phrases":[{"head":"\u003cstrong>Down Under\u003c/strong> \u003cem>(informal)\u003c/em>","gloss":"v Austrálii či na Novém Zélandu; do Austrálie či na Nový Zéland","note":""},{"head":"\u003cstrong>the Australian Outback\u003c/strong>","gloss":"vyprahlé a řídce osídlené australské vnitrozemí","note":""},{"head":"\u003cstrong>on the other side of the world\u003c/strong>","gloss":"na opačné straně světa","note":""},{"head":"\u003cstrong>have a relaxed lifestyle\u003c/strong>","gloss":"mít pohodový, uvolněný životní styl","note":""},{"head":"\u003cstrong>be home to very unusual wild animals and plants\u003c/strong>","gloss":"být domovem velmi neobvyklých živočichů a rostlin žijících volně v přírodě","note":""},{"head":"\u003cstrong>consist of two main islands\u003c/strong>","gloss":"skládat se ze dvou hlavních ostrovů","note":""},{"head":"\u003cstrong>be an important religious place for Australia's first peoples\u003c/strong>","gloss":"být důležitým náboženským místem pro původní obyvatele Austrálie","note":""}]},"codes":["SSO 12","CR 17b"],"groups":["cr","sso"],"rank":{"cr":35,"sso":24,"all":24}},{"file":"tema-s16-travelling-and-transport.md","title":"Travelling and transport","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu.","vocab":[{"head":"\u003cstrong>means of transport\u003c/strong> (means /miːnz/) [C, plural unchanged: means]","gloss":"dopravní prostředek","example":"Trains and bicycles are among the most eco-friendly means of transport available."},{"head":"\u003cstrong>public transport\u003c/strong> /ˌpʌblɪk ˈtrænspɔːt/ AmE /ˌpʌblɪk ˈtrænspɔːrt/ [U]","gloss":"hromadná / veřejná doprava","example":"Using public transport in large cities saves money and helps avoid parking struggles."},{"head":"\u003cstrong>traffic congestion\u003c/strong> (congestion /kənˈdʒestʃən/) [U]","gloss":"dopravní zácpa, přetížení dopravy","example":"Heavy traffic congestion on highways causes frustrating delays for drivers."},{"head":"\u003cstrong>delay\u003c/strong> /dɪˈleɪ/ [C/U]","gloss":"zpoždění (počitatelné např. \u003cem>a ten-minute delay\u003c/em>, nepočitatelné např. \u003cem>without delay\u003c/em>)","example":"Due to severe winter weather, our morning train suffered a thirty-minute delay."},{"head":"\u003cstrong>boarding pass\u003c/strong> (boarding /ˈbɔːdɪŋ/ AmE /ˈbɔːrdɪŋ/) [C]","gloss":"palubní vstupenka","example":"Passengers must scan their electronic boarding pass before walking through the airport departure gate."},{"head":"\u003cstrong>luggage / baggage\u003c/strong> (luggage /ˈlʌɡɪdʒ/) [U]","gloss":"zavazadlo, zavazadla","example":"Airlines charge high extra fees if your cabin luggage exceeds the permitted weight limit."},{"head":"\u003cstrong>flight attendant\u003c/strong> /ˈflaɪt ətendənt/ [C]","gloss":"stevard, letuška","example":"The flight attendant demonstrated emergency safety procedures before the plane took off."},{"head":"\u003cstrong>carbon footprint\u003c/strong> /ˌkɑːbən ˈfʊtprɪnt/ AmE /ˌkɑːrbən ˈfʊtprɪnt/ [C]","gloss":"uhlíková stopa","example":"Flying frequently generates massive emissions that rapidly increase your personal carbon footprint."},{"head":"\u003cstrong>destination\u003c/strong> /ˌdestɪˈneɪʃn/ [C]","gloss":"cíl cesty (destinace)","example":"The Mediterranean coastline remains the most popular summer holiday destination for Czech families."},{"head":"\u003cstrong>accommodation\u003c/strong> /əˌkɒməˈdeɪʃn/ AmE /əˌkɑːməˈdeɪʃn/ [U]","gloss":"ubytování","example":"Booking youth hostel accommodation in advance is wise during the peak tourist season."},{"head":"\u003cstrong>backpacking\u003c/strong> [U]","gloss":"cestování s batohem na vlastní pěst","example":"After high school graduation, many young Europeans go backpacking across Scandinavia or Southeast Asia."},{"head":"\u003cstrong>package holiday\u003c/strong> /ˈpækɪdʒ hɒlədeɪ/ AmE /ˈpækɪdʒ hɑːlədeɪ/ [C]","gloss":"zájezd s cestovní kanceláří (organizovaný zájezd s kombinací služeb v ceně)","example":"Families with small children often opt for a convenient package holiday at a seaside resort."},{"head":"\u003cstrong>fare\u003c/strong> /feə(r)/ AmE /fer/ [C]","gloss":"jízdné (cena jízdenky na vlak, autobus či taxi)","example":"Students and seniors are entitled to a substantial discount on standard train fares."},{"head":"\u003cstrong>timetable\u003c/strong> /ˈtaɪmteɪbl/ [C]","gloss":"jízdní řád","example":"You should check the online timetable carefully to avoid missing the last bus connection."},{"head":"\u003cstrong>security check\u003c/strong> [C]","gloss":"bezpečnostní kontrola (na letišti)","example":"At many airport security checks, travellers still have to remove liquids and laptops from their hand luggage."},{"head":"\u003cstrong>seat belt\u003c/strong> /ˈsiːt belt/ [C]","gloss":"bezpečnostní pás","example":"Fastening your seat belt is mandatory both in cars and during aircraft takeoff and landing."},{"head":"\u003cstrong>eco-friendly\u003c/strong> /ˌiːkəʊ ˈfrendli/ (adjective)","gloss":"šetrný k životnímu prostředí, ekologický","example":"Electric trains and cycling paths offer clean, eco-friendly alternatives to diesel vehicles."},{"head":"\u003cstrong>jet lag\u003c/strong> /ˈdʒet læɡ/ [U]","gloss":"pásmová nemoc (únava způsobená rychlým přeletem časových pásem)","example":"Crossing six time zones on a flight to New York leaves most travellers dealing with severe jet lag."},{"head":"\u003cstrong>journey\u003c/strong> /ˈdʒɜːni/ AmE /ˈdʒɜːrni/ [C]","gloss":"cesta (z jednoho místa na druhé)","example":"The five-hour train journey through the Alps offered breathtaking mountain views."},{"head":"\u003cstrong>commute\u003c/strong> /kəˈmjuːt/ (verb / [C])","gloss":"dojíždět; pravidelné dojíždění do školy či práce (\u003cem>a daily commute\u003c/em>)","example":"Tens of thousands of people commute into Prague daily by suburban train lines."},{"head":"\u003cstrong>guesthouse\u003c/strong> /ˈɡesthaʊs/ [C]","gloss":"penzion (POZOR: slovo \u003cem>pension\u003c/em> znamená v běžné angličtině starobní důchod, ačkoli v evropském kontextu se užívá i pro ubytování)","example":"We spent a quiet weekend staying in a family-run guesthouse in the heart of Šumava."},{"head":"\u003cstrong>sightseeing tour\u003c/strong> (sightseeing /ˈsaɪtsiːɪŋ/) [C]","gloss":"poznávací okruh / zájezd","example":"Taking an open-top bus for a sightseeing tour is a great introduction to London landmarks."}],"answer":["Travelling is one of my favourite ways to spend school holidays and explore new places. Depending on our budget, time, and personal interests, how we travel can vary tremendously. Some people prefer the complete relaxation of an organized \u003cstrong>package holiday\u003c/strong> arranged by a travel agency, where flights and hotels are taken care of. In contrast, adventurous students often choose independent \u003cstrong>backpacking\u003c/strong>, staying in affordable youth hostels and meeting fellow travellers from around the world.","Choosing the right \u003cstrong>means of transport\u003c/strong> involves balancing speed, cost, and environmental responsibility. Flying is undeniably the fastest way to reach a distant overseas \u003cstrong>destination\u003c/strong>, but going through a crowded airport—from queuing at the \u003cstrong>security check\u003c/strong> to boarding—can be stressful. On top of that, flying long distances often results in exhausting \u003cstrong>jet lag\u003c/strong> and carries a significant \u003cstrong>carbon footprint\u003c/strong>.","For everyday trips within Europe and our own country, the railway system is an outstanding alternative. Travelling by train allows you to read, listen to music, or simply admire the landscape while avoiding stressful \u003cstrong>traffic congestion\u003c/strong> on motorways. In towns and cities, relying on reliable \u003cstrong>public transport\u003c/strong> or cycling is far more \u003cstrong>eco-friendly\u003c/strong> and economical than driving a private car, especially given rising fuel prices and parking problems. In short, whether it is a daily school \u003cstrong>commute\u003c/strong> or a longer summer \u003cstrong>journey\u003c/strong>, travelling teaches us to be independent, adaptable, and open to the world around us."],"answer_info":"","questions":[{"cat":"Popis","text":"What are the most common procedures a traveller must go through at an international airport before departure?"},{"cat":"Srovnání","text":"In what ways do independent backpacking trips compare to all-inclusive package holidays organized by travel agencies?"},{"cat":"Zkušenost","text":"What made your most memorable journey so special?"},{"cat":"Názor","text":"Why should governments invest heavily in modernising public transport systems rather than building wider motorways?"},{"cat":"Kritika","text":"How does mass tourism negatively impact popular destinations, such as historical cities or fragile natural parks?"},{"cat":"Hypotéza","text":"If commercial electric passenger planes become standard in the next twenty years, how will that change international travel?"},{"cat":"Srovnání","text":"What are the advantages and drawbacks of travelling alone compared to travelling with a group of close friends?"}],"phrases":[{"head":"\u003cstrong>Generally speaking, travelling opens your eyes because...\u003c/strong>","gloss":"Obecně řečeno, cestování člověku otevírá oči, protože...","note":"úvodní myšlenka"},{"head":"\u003cstrong>When weighing the pros and cons of flying versus trains,...\u003c/strong>","gloss":"Při zvažování kladů a záporů létání oproti vlakům...","note":"srovnání"},{"head":"\u003cstrong>The main benefit of this mode of travel is...\u003c/strong>","gloss":"Hlavní výhodou tohoto způsobu cestování je...","note":"uvedení kladu"},{"head":"\u003cstrong>One cannot ignore the environmental aspect, namely...\u003c/strong>","gloss":"Nelze ignorovat environmentální aspekt, konkrétně...","note":"ekologický pohled"},{"head":"\u003cstrong>In terms of affordability and freedom,...\u003c/strong>","gloss":"Co se týče cenové dostupnosti a svobody,...","note":"aspekt"},{"head":"\u003cstrong>From my personal perspective,...\u003c/strong>","gloss":"Z mého osobního pohledu...","note":"vyjádření názoru"},{"head":"\u003cstrong>To wrap up, what I love most about travelling is...\u003c/strong>","gloss":"Abych to shrnul, co na cestování miluji nejvíce, je...","note":"závěrečné shrnutí"}],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>form of transport\u003c/strong> [C; A2]","gloss":"dopravní prostředek, druh dopravy","example":"Trains and bicycles are among the greenest forms of transport."},{"head":"\u003cstrong>public transport\u003c/strong> /ˌpʌblɪk ˈtrænspɔːt/ AmE /ˌpʌblɪk ˈtrænspɔːrt/ [U; A2]","gloss":"hromadná / veřejná doprava","example":"Using public transport in large cities saves money and helps avoid parking problems."},{"head":"\u003cstrong>too much traffic\u003c/strong> (phrase; A1 + A1)","gloss":"příliš velký provoz, přetížené silnice","example":"Too much traffic on motorways makes drivers late and annoyed."},{"head":"\u003cstrong>luggage / baggage\u003c/strong> (luggage /ˈlʌɡɪdʒ/) [U; A2]","gloss":"zavazadlo, zavazadla","example":"Airlines charge a lot extra if your hand luggage is too heavy."},{"head":"\u003cstrong>flight attendant\u003c/strong> /ˈflaɪt ətendənt/ [C; B1]","gloss":"stevard, letuška","example":"The flight attendant showed passengers what to do in an emergency before the plane took off."},{"head":"\u003cstrong>carbon footprint\u003c/strong> /ˌkɑːbən ˈfʊtprɪnt/ AmE /ˌkɑːrbən ˈfʊtprɪnt/ [C; slovo k tématu, B2]","gloss":"uhlíková stopa","example":"If you fly often, your personal carbon footprint quickly gets much bigger."},{"head":"\u003cstrong>destination\u003c/strong> /ˌdestɪˈneɪʃn/ [C; B1]","gloss":"cíl cesty (destinace)","example":"The Mediterranean coastline remains the most popular destination for Czech families in summer."},{"head":"\u003cstrong>accommodation\u003c/strong> /əˌkɒməˈdeɪʃn/ AmE /əˌkɑːməˈdeɪʃn/ [U; B1]","gloss":"ubytování","example":"Booking accommodation in a youth hostel early is a good idea in the busiest part of the tourist season."},{"head":"\u003cstrong>backpacking\u003c/strong> [U; B1]","gloss":"cestování s batohem na vlastní pěst","example":"After high school, many young Europeans go backpacking across Scandinavia."},{"head":"\u003cstrong>package holiday\u003c/strong> /ˈpækɪdʒ hɒlədeɪ/ AmE /ˈpækɪdʒ hɑːlədeɪ/ [C; B1 podle učitele]","gloss":"zájezd s cestovní kanceláří (organizovaný zájezd s kombinací služeb v ceně)","example":"Families with small children often choose a convenient package holiday at the seaside."},{"head":"\u003cstrong>timetable\u003c/strong> /ˈtaɪmteɪbl/ [C; A2]","gloss":"jízdní řád","example":"You should check the online timetable carefully so that you do not miss the last bus."},{"head":"\u003cstrong>security check\u003c/strong> [C; B1]","gloss":"bezpečnostní kontrola (na letišti)","example":"At many security checks, travellers still have to remove liquids and laptops."},{"head":"\u003cstrong>seat belt\u003c/strong> /ˈsiːt belt/ [C; B1]","gloss":"bezpečnostní pás","example":"You must fasten your seat belt both in cars and when a plane takes off and lands."},{"head":"\u003cstrong>green\u003c/strong> (adjective; B1)","gloss":"šetrný k životnímu prostředí, ekologický","example":"Electric trains and cycling paths offer clean, green ways to travel."},{"head":"\u003cstrong>commute\u003c/strong> /kəˈmjuːt/ (verb / [C]; B1)","gloss":"dojíždět; pravidelné dojíždění do školy či práce (\u003cem>a daily commute\u003c/em>)","example":"Tens of thousands of people commute into Prague daily by train."},{"head":"\u003cstrong>sightseeing tour\u003c/strong> (sightseeing /ˈsaɪtsiːɪŋ/) [C; A2]","gloss":"poznávací okruh / zájezd","example":"Taking a bus for a sightseeing tour is a great way to see London's famous sights for the first time."}],"answer":["Travelling is one of my favourite ways to spend school holidays and explore new places. How we travel depends on our money, time and personal interests. Some people prefer the complete relaxation of an organized \u003cstrong>package holiday\u003c/strong>, where flights and hotels are taken care of. But students who like adventure often choose \u003cstrong>backpacking\u003c/strong>. They stay in cheap youth hostels and meet other travellers.","Choosing the right \u003cstrong>form of transport\u003c/strong> involves balancing speed, cost, and environmental responsibility. Flying is certainly the fastest way to reach a \u003cstrong>destination\u003c/strong> far away. But a crowded airport can be stressful, from queuing at the \u003cstrong>security check\u003c/strong> to getting on the plane. Long flights also often make you very tired because of the time difference, and they have a large \u003cstrong>carbon footprint\u003c/strong>.","For everyday trips within Europe and our own country, the railway system is an excellent alternative. Travelling by train allows you to read, listen to music, or simply admire the view. You avoid stressful motorways with \u003cstrong>too much traffic\u003c/strong>. In towns and cities, reliable \u003cstrong>public transport\u003c/strong> or cycling is far \u003cstrong>greener\u003c/strong> and cheaper than driving a private car. Travelling on a daily school \u003cstrong>commute\u003c/strong> or a longer summer journey teaches us to be independent."],"questions":[{"cat":"Popis","text":"What must a traveller usually do at an international airport before departure?"},{"cat":"Srovnání","text":"How are backpacking trips similar to or different from package holidays? \u003cem>(holidays where everything is included in the price)\u003c/em>"},{"cat":"Zkušenost","text":"What made the journey you remember best so special?"},{"cat":"Názor","text":"Why should governments invest a lot in making public transport more modern? \u003cem>(instead of building wider motorways)\u003c/em>"},{"cat":"Kritika","text":"How do large numbers of tourists have a bad effect on popular destinations? \u003cem>(for example, historical cities or natural parks that are easily damaged)\u003c/em>"},{"cat":"Hypotéza","text":"If electric passenger planes become normal within twenty years, how will international travel change?"},{"cat":"Srovnání","text":"What are the advantages and disadvantages of travelling alone? \u003cem>(how it is different from travelling with a group of close friends)\u003c/em>"}],"phrases":[{"head":"\u003cstrong>Generally, travelling helps you see the world differently because...\u003c/strong>","gloss":"Obecně vzato vám cestování pomáhá vidět svět jinak, protože...","note":"úvodní myšlenka"},{"head":"\u003cstrong>When I compare the advantages and disadvantages of flying and trains,...\u003c/strong>","gloss":"Když srovnávám výhody a nevýhody létání a vlaků...","note":"srovnání"},{"head":"\u003cstrong>The main benefit of this way of travelling is...\u003c/strong>","gloss":"Hlavní výhodou tohoto způsobu cestování je...","note":"uvedení kladu"},{"head":"\u003cstrong>We cannot ignore the effect of travelling on the environment:...\u003c/strong>","gloss":"Nelze přehlížet dopad cestování na životní prostředí:...","note":"ekologický pohled"},{"head":"\u003cstrong>When I think about whether I can afford it and do what I want,...\u003c/strong>","gloss":"Když přemýšlím o tom, jestli si to můžu dovolit a dělat, co chci,...","note":"aspekt"},{"head":"\u003cstrong>From my personal point of view,...\u003c/strong>","gloss":"Z mého osobního pohledu...","note":"vyjádření názoru"},{"head":"\u003cstrong>Finally, my favourite thing about travelling is...\u003c/strong>","gloss":"Na závěr: na cestování mám nejraději...","note":"závěrečné shrnutí"}]},"codes":["SSO 13","CR 9b","CR 20a"],"groups":["cr","sso"],"rank":{"cr":19,"sso":26,"all":19.5}},{"file":"tema-o18-c10b-london.md","title":"London","label":"Navrhla AI, schválil učitel (7. 11. 2026).","vocab":[{"head":"\u003cstrong>royal\u003c/strong> /ˈrɔɪəl/ (adjective; B2)","gloss":"královský","example":"I would include a royal residence in my plan for a visit to London."},{"head":"\u003cstrong>palace\u003c/strong> /ˈpæləs/ [C; B1]","gloss":"palác, zámek (sídlo panovníka)","example":"Buckingham Palace is an official royal palace in London."},{"head":"\u003cstrong>guard\u003c/strong> /ɡɑːd/ AmE /ɡɑːrd/ [C; B1]","gloss":"stráž, strážce","example":"I would ask a guard where visitors should wait before entering the building."},{"head":"\u003cstrong>tower\u003c/strong> /ˈtaʊə/ AmE /ˈtaʊər/ [C; B1]","gloss":"věž","example":"The clock tower at the Houses of Parliament is called the Elizabeth Tower."},{"head":"\u003cstrong>bell\u003c/strong> /bel/ [C; B2]","gloss":"zvon","example":"Big Ben is the name of the large bell inside the Elizabeth Tower."},{"head":"\u003cstrong>prison\u003c/strong> /ˈprɪzn/ [C or U; B1]","gloss":"vězení, věznice","example":"The Tower of London has served as a fortress and a prison."},{"head":"\u003cstrong>jewel\u003c/strong> /ˈdʒuːəl/ [C; B2]","gloss":"klenot, drahokam","example":"In the story, the queen wears a necklace with a bright red jewel."},{"head":"\u003cstrong>tomb\u003c/strong> /tuːm/ [C; B2]","gloss":"hrobka, náhrobek","example":"I would like to learn why important people were buried in a large tomb."},{"head":"\u003cstrong>rebuild\u003c/strong> /ˌriːˈbɪld/ (verb; B1)","gloss":"znovu postavit (po poškození či zničení)","example":"In our history project, we discuss how to rebuild a city after a fire."},{"head":"\u003cstrong>architect\u003c/strong> /ˈɑːkɪtekt/ AmE /ˈɑːrkɪtekt/ [C; B1]","gloss":"architekt, architektka","example":"Christopher Wren was the architect who designed St Paul's Cathedral."},{"head":"\u003cstrong>statue\u003c/strong> /ˈstætʃuː/ [C; B1]","gloss":"socha","example":"I like to draw a statue from several angles before taking a photograph."},{"head":"\u003cstrong>fountain\u003c/strong> /ˈfaʊntən/ AmE /ˈfaʊntn/ [C; B1]","gloss":"fontána, kašna","example":"I would enjoy sitting beside a fountain after a long walking tour."},{"head":"\u003cstrong>sculpture\u003c/strong> /ˈskʌlptʃə/ AmE /ˈskʌlptʃər/ [U; B1]","gloss":"sochařství","example":"I enjoy sculpture as much as painting when I visit an art museum."},{"head":"\u003cstrong>collection\u003c/strong> /kəˈlekʃn/ [C; B1]","gloss":"sbírka","example":"The National Gallery has a collection of paintings that I would like to see."},{"head":"\u003cstrong>treasure\u003c/strong> /ˈtreʒə/ AmE /ˈtreʒər/ [U; B2]","gloss":"poklad (zlato, drahé kameny, peníze)","example":"I enjoy adventure stories about ships carrying gold and buried treasure."},{"head":"\u003cstrong>musical\u003c/strong> /ˈmjuːzɪkl/ [C; B2]","gloss":"muzikál","example":"I would like to see a musical, especially one with songs I already know."},{"head":"\u003cstrong>attraction\u003c/strong> /əˈtrækʃn/ [C; B1]","gloss":"atrakce, lákadlo, zajímavost","example":"For me, an art museum would be the main attraction of a city trip."},{"head":"\u003cstrong>bank\u003c/strong> /bæŋk/ [C; B2]","gloss":"břeh (řeky)","example":"I would enjoy walking along the bank of the Thames on a sunny day."},{"head":"\u003cstrong>cruise\u003c/strong> /kruːz/ [C; B1]","gloss":"okružní plavba na lodi (dovolená)","example":"Before visiting London, we might take a week-long cruise on a large ship."},{"head":"\u003cstrong>mayor\u003c/strong> /meə(r)/ AmE /ˈmeɪər/ [C; B2]","gloss":"starosta, primátor","example":"I would ask the mayor what t
