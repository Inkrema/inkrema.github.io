does the huge size of the USA help to create so many different climates?"},{"cat":"Popis","text":"How are the Mississippi River system and the Great Lakes important for trade and farming?"},{"cat":"Zkušenost / preference","text":"Which American national park or natural wonder would you most like to visit?"},{"cat":"Hypotéza","text":"If you had to drive across the USA, which regions would you travel through? \u003cem>(from New York to San Francisco)\u003c/em>"},{"cat":"Přírodní rizika","text":"What extreme weather and natural dangers are typical of different regions in the United States?"}],"phrases":[{"head":"\u003cstrong>From a geographical point of view,...\u003c/strong>","gloss":"Ze zeměpisného hlediska...","note":"zeměpisný úvod"},{"head":"\u003cstrong>The land can be divided into...\u003c/strong>","gloss":"Krajinu lze rozdělit na...","note":"členění prostoru"},{"head":"\u003cstrong>The country is thousands of miles wide, and...\u003c/strong>","gloss":"Země je široká tisíce mil a...","note":"popis rozlohy"},{"head":"\u003cstrong>If we compare it with the eastern states,...\u003c/strong>","gloss":"Když to porovnáme s východními státy,...","note":"regionální srovnání"},{"head":"\u003cstrong>One of the most amazing geographical features is...\u003c/strong>","gloss":"Jedním z nejúžasnějších geografických rysů je...","note":"vyzdvižení zajímavosti"},{"head":"\u003cstrong>It plays a very important role in...\u003c/strong>","gloss":"Hraje to velmi důležitou roli v...","note":"význam pro hospodářství/přírodu"},{"head":"\u003cstrong>To summarize the geography of the US,...\u003c/strong>","gloss":"Abych shrnul geografii USA,...","note":"závěr"}]},"codes":["SSO 23","CR 11b"],"groups":["cr","sso"],"rank":{"cr":23,"sso":46,"all":23.5}},{"file":"tema-s8-english-speaking-countries.md","title":"The English-speaking countries","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu.","vocab":[{"head":"\u003cstrong>lingua franca\u003c/strong> /ˌlɪŋɡwə ˈfræŋkə/ [C, usually singular]","gloss":"společný dorozumívací jazyk (mezi mluvčími různých jazyků)","example":"English has become the universal lingua franca of international business, science, and travel."},{"head":"\u003cstrong>mother tongue\u003c/strong> /ˌmʌðə ˈtʌŋ/ AmE /ˌmʌðər ˈtʌŋ/ [C]","gloss":"mateřský jazyk","example":"Even though my mother tongue is Czech, I practice English almost every day by reading and watching series."},{"head":"\u003cstrong>native speaker\u003c/strong> /ˌneɪtɪv ˈspiːkə(r)/ AmE /ˌneɪtɪv ˈspiːkər/ [C]","gloss":"rodilý mluvčí","example":"Listening to podcasts hosted by a native speaker helps learners pick up authentic pronunciation."},{"head":"\u003cstrong>indigenous people\u003c/strong> (indigenous /ɪnˈdɪdʒənəs/) [plural]","gloss":"původní / domorodé obyvatelstvo","example":"The history of Canada and Australia is closely tied to the traditions and rights of their indigenous people."},{"head":"\u003cstrong>constitutional monarchy\u003c/strong> (constitutional /ˌkɒnstɪˈtjuːʃənl/ AmE /ˌkɑːnstɪˈtuːʃənl/; monarchy /ˈmɒnəki/ AmE /ˈmɑːnərki/) [C]","gloss":"konstituční monarchie","example":"The United Kingdom is a constitutional monarchy where the king reigns but does not rule."},{"head":"\u003cstrong>federal republic\u003c/strong> (federal /ˈfedərəl/; republic /rɪˈpʌblɪk/) [C]","gloss":"federativní republika","example":"The United States is a federal republic composed of fifty states with substantial local powers."},{"head":"\u003cstrong>head of state\u003c/strong> /ˌhed əv ˈsteɪt/ [C]","gloss":"hlava státu","example":"As of 2026, the British monarch serves as the constitutional head of state in fifteen countries, including the UK, Canada, Australia, and twelve other Commonwealth realms."},{"head":"\u003cstrong>Commonwealth of Nations\u003c/strong> (commonwealth /ˈkɒmənwelθ/ AmE /ˈkɑːmənwelθ/) [proper noun]","gloss":"Společenství národů","example":"As of 2026, the Commonwealth of Nations is a voluntary association of 56 independent member countries, mostly former territories of the British Empire."},{"head":"\u003cstrong>bilingual\u003c/strong> /ˌbaɪˈlɪŋɡwəl/ (adjective)","gloss":"dvojjazyčný","example":"Canada is officially a bilingual country, with both English and French holding equal status at the federal level."},{"head":"\u003cstrong>settler\u003c/strong> /ˈsetlə/ AmE /ˈsetlər/ [C]","gloss":"osadník, přistěhovalec","example":"European settlers arrived in North America in search of fertile land and religious freedom."},{"head":"\u003cstrong>outback\u003c/strong> /ˈaʊtbæk/ [singular, usually the outback]","gloss":"vnitrozemská pustina (v Austrálii)","example":"Much of central Australia consists of the vast, arid outback, where sheep and cattle stations are miles apart."},{"head":"\u003cstrong>accent\u003c/strong> /ˈæksent/ [C]","gloss":"přízvuk","example":"You can easily tell a Scottish accent apart from an Australian accent or an American drawl."},{"head":"\u003cstrong>vast\u003c/strong> /vɑːst/ AmE /væst/ (adjective)","gloss":"rozlehlý, nesmírný","example":"Both Canada and the United States cover vast land areas spanning several time zones."},{"head":"\u003cstrong>hemisphere\u003c/strong> /ˈhemɪsfɪə/ AmE /ˈhemɪsfɪr/ [C]","gloss":"polokoule (severní / jižní)","example":"Because Australia and New Zealand lie in the southern hemisphere, their summer takes place from December to February."},{"head":"\u003cstrong>colonisation\u003c/strong> [U]","gloss":"kolonizace","example":"The historical colonisation by the British Empire spread English law, education, and language across all continents."},{"head":"\u003cstrong>flora and fauna\u003c/strong> (flora /ˈflɔːrə/; fauna /ˈfɔːnə/) [plural / collective]","gloss":"flóra a fauna, rostlinstvo a zvířena","example":"Due to geographic isolation, Australia developed unique flora and fauna, including kangaroos and koalas."},{"head":"\u003cstrong>multicultural\u003c/strong> /ˌmʌltiˈkʌltʃərəl/ (adjective)","gloss":"multikulturní","example":"Cities like Toronto and Melbourne are celebrated as remarkably multicultural societies."},{"head":"\u003cstrong>sovereign state\u003c/strong> (sovereign /ˈsɒvrɪn/ AmE /ˈsɑːvrɪn/) [C]","gloss":"suverénní stát","example":"New Zealand is an independent sovereign state renowned for its breathtaking landscapes and progressive policies."},{"head":"\u003cstrong>island nation\u003c/strong> [C]","gloss":"ostrovní stát","example":"New Zealand is a breathtaking island nation in the South Pacific famous for its dramatic fjords."},{"head":"\u003cstrong>territory\u003c/strong> /ˈterətri/ AmE /ˈterətɔːri/ [C]","gloss":"území, teritorium","example":"Canada consists of ten provinces and three northern territories, which are sparsely populated."},{"head":"\u003cstrong>diversity\u003c/strong> /daɪˈvɜːsəti/ AmE /daɪˈvɜːrsəti/ [U]","gloss":"rozmanitost","example":"The linguistic and geographic diversity of the English-speaking world offers endless topics to explore."},{"head":"\u003cstrong>standard of living\u003c/strong> /ˌstændəd əv ˈlɪvɪŋ/ AmE /ˌstændərd əv ˈlɪvɪŋ/ [C/U]","gloss":"životní úroveň","example":"Countries like Australia and Canada consistently rank near the top of global surveys for high standard of living."}],"answer":["When we talk about the English-speaking world, we are looking at very different cultures across several continents. The United Kingdom is where the language started. It is a traditional \u003cstrong>constitutional monarchy\u003c/strong> that spread English around the globe through centuries of trade and \u003cstrong>colonisation\u003c/strong>. Today, English works as a global \u003cstrong>lingua franca\u003c/strong>, allowing people from everywhere to talk to each other without difficulty.","If we compare the main countries, their political systems and landscapes are completely different. The United States is a huge \u003cstrong>federal republic\u003c/strong> of fifty states, known for its dynamic lifestyle and global influence. Just north of the US, Canada covers \u003cstrong>vast\u003c/strong> open territories and is proud of being an officially \u003cstrong>bilingual\u003c/strong> nation, where English and French both have official status. In North America, modern society was built by European \u003cstrong>settlers\u003c/strong>, but it also respects the heritage of \u003cstrong>indigenous people\u003c/strong>.","Down in the southern \u003cstrong>hemisphere\u003c/strong>, Australia and New Zealand offer unique nature. Australia is famous for its wildlife, or \u003cstrong>flora and fauna\u003c/strong>, its sunny beaches, and the empty red plains of the \u003cstrong>outback\u003c/strong>. New Zealand is a peaceful \u003cstrong>island nation\u003c/strong> with spectacular mountains and rich Māori traditions. Both countries are independent democracies within the \u003cstrong>Commonwealth of Nations\u003c/strong>, yet they still share the same monarch as their constitutional \u003cstrong>head of state\u003c/strong>. For me as a student, learning about these places shows how much cultural \u003cstrong>diversity\u003c/strong> exists within one language."],"answer_info":"","questions":[{"cat":"Popis","text":"What are the core political differences between the system of government in the United Kingdom and the United States?"},{"cat":"Srovnání","text":"In what ways do the geographic features and climates of Canada and Australia contrast with each other?"},{"cat":"Názor","text":"Why has English become the dominant global lingua franca instead of languages with larger numbers of native speakers, such as Spanish or Mandarin?"},{"cat":"Popis","text":"How has the historical heritage of indigenous communities shaped modern identity in New Zealand and Canada?"},{"cat":"Zkušenost","text":"Which English-speaking country appeals to you the most for future travel or university exchange, and what specific reasons support your choice?"},{"cat":"Hypotéza","text":"If international business decided to adopt a neutral artificial language like Esperanto instead of English, what practical obstacles would arise?"},{"cat":"Srovnání","text":"How do everyday British English and American English differ in terms of vocabulary, pronunciation, and spelling?"}],"phrases":[{"head":"\u003cstrong>First and foremost,...\u003c/strong>","gloss":"V prvé řadě / především,...","note":"uvedení hlavního bodu"},{"head":"\u003cstrong>Geographically speaking,...\u003c/strong>","gloss":"Ze zeměpisného hlediska...","note":"zeměpisný kontext"},{"head":"\u003cstrong>One major difference between them is that...\u003c/strong>","gloss":"Jedním hlavním rozdílem mezi nimi je, že...","note":"kontrast dvou systémů"},{"head":"\u003cstrong>It is worth pointing out that...\u003c/strong>","gloss":"Stojí za to vyzdvihnout, že...","note":"upozornění na zajímavost"},{"head":"\u003cstrong>Despite being separated by thousands of miles,...\u003c/strong>","gloss":"Přestože je dělí tisíce mil,...","note":"překlenutí vzdálenosti"},{"head":"\u003cstrong>From a global standpoint,...\u003c/strong>","gloss":"Z globálního hlediska...","note":"celosvětový pohled"},{"head":"\u003cstrong>To conclude, what unites all these countries is...\u003c/strong>","gloss":"Na závěr, tím, co všechny tyto země spojuje, je...","note":"závěrečné shrnutí"}],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>common language\u003c/strong> [C; B1 + A1]","gloss":"společný dorozumívací jazyk (mezi mluvčími různých jazyků)","example":"English has become the common language of international business, science and travel."},{"head":"\u003cstrong>native speaker\u003c/strong> /ˌneɪtɪv ˈspiːkə(r)/ AmE /ˌneɪtɪv ˈspiːkər/ [C; B1]","gloss":"rodilý mluvčí","example":"Listening to a native speaker on podcasts helps learners learn real pronunciation."},{"head":"\u003cstrong>first peoples\u003c/strong> [plural; A1 + A1]","gloss":"původní / domorodé obyvatelstvo","example":"The history of Canada and Australia is connected with their first peoples."},{"head":"\u003cstrong>federal republic\u003c/strong> (federal /ˈfedərəl/; republic /rɪˈpʌblɪk/) [C; slovo k tématu, B2 + C1]","gloss":"federativní republika","example":"The United States is a federal republic of fifty states with a lot of local power."},{"head":"\u003cstrong>head of state\u003c/strong> /ˌhed əv ˈsteɪt/ [C; A2]","gloss":"hlava státu","example":"In 2026, the British King is head of state in fifteen countries, including the UK, Canada, Australia and twelve other countries."},{"head":"\u003cstrong>Commonwealth of Nations\u003c/strong> (commonwealth /ˈkɒmənwelθ/ AmE /ˈkɑːmənwelθ/) [proper noun; vlastní jméno]","gloss":"Společenství národů","example":"In 2026, the Commonwealth of Nations has 56 independent member countries, and Britain once ruled most of them."},{"head":"\u003cstrong>huge\u003c/strong> (adjective; A2)","gloss":"obrovský, rozlehlý","example":"Canada and the United States both have huge areas of land."},{"head":"\u003cstrong>colonisation\u003c/strong> [U; slovo k tématu, bez úrovně]","gloss":"kolonizace","example":"Colonisation by the British Empire spread English law, education and language to all continents."},{"head":"\u003cstrong>plants and animals\u003c/strong> [plural; A1 + A1 + A1]","gloss":"flóra a fauna, rostlinstvo a zvířena","example":"Australia has plants and animals that you cannot find anywhere else."},{"head":"\u003cstrong>independent country\u003c/strong> [C; A2 + A1]","gloss":"suverénní stát, nezávislá země","example":"New Zealand is an independent country with amazing scenery."},{"head":"\u003cstrong>island nation\u003c/strong> [C; A1 + B1]","gloss":"ostrovní stát","example":"New Zealand is an amazing island nation in the South Pacific."},{"head":"\u003cstrong>variety\u003c/strong> (noun; B1)","gloss":"rozmanitost","example":"The English-speaking world has great variety in language and geography."},{"head":"\u003cstrong>Māori\u003c/strong> [vlastní jméno]","gloss":"Maorové (původní obyvatelé Nového Zélandu)","example":"New Zealand has amazing mountains and Māori traditions."}],"answer":["When we talk about the English-speaking world, we are looking at very different cultures across several continents. The United Kingdom is where the language started. It has a king, but his power is limited by law. Through centuries of trade and \u003cstrong>colonisation\u003c/strong>, it spread English around the world. Today, English is a global \u003cstrong>common language\u003c/strong>.","The United States is a \u003cstrong>federal republic\u003c/strong> of fifty states. North of the US, Canada has \u003cstrong>huge\u003c/strong> open areas of land. It is proud of having two official languages, English and French. In North America, people who came from Europe to live there built modern society. However, it also respects the history and traditions of the \u003cstrong>first peoples\u003c/strong>.","Australia and New Zealand are in the southern half of the world. Australia is famous for its \u003cstrong>plants and animals\u003c/strong> and the empty red land of the Australian Outback. New Zealand is a peaceful \u003cstrong>island nation\u003c/strong> with amazing mountains and \u003cstrong>Māori\u003c/strong> traditions. Both are \u003cstrong>independent countries\u003c/strong> where people vote for their government. They are in the \u003cstrong>Commonwealth of Nations\u003c/strong> but still have the same King as their \u003cstrong>head of state\u003c/strong>. For me, learning about these places shows how much cultural \u003cstrong>variety\u003c/strong> exists within one language."],"questions":[{"cat":"Popis","text":"What are the main differences between the political systems of the UK and the USA?"},{"cat":"Srovnání","text":"How are the geography and climate of Canada and Australia different?"},{"cat":"Názor","text":"Why has English become the world's main common language instead of Spanish or Mandarin? \u003cem>(they have more native speakers)\u003c/em>"},{"cat":"Popis","text":"How have the history and traditions of first peoples influenced modern New Zealand and Canada? \u003cem>(how people there see their country today)\u003c/em>"},{"cat":"Zkušenost","text":"Which English-speaking country would you most like to visit for travel or a university exchange? \u003cem>(your reasons)\u003c/em>"},{"cat":"Hypotéza","text":"If international business used Esperanto instead of English, what practical problems would there be? \u003cem>(a language that people invented and that belongs to no country)\u003c/em>"},{"cat":"Srovnání","text":"How are everyday British and American English different in vocabulary, pronunciation and spelling?"}],"phrases":[{"head":"\u003cstrong>The most important point is that...\u003c/strong>","gloss":"V prvé řadě / Nejdůležitější je, že...","note":"uvedení hlavního bodu"},{"head":"\u003cstrong>From a geographical point of view,...\u003c/strong>","gloss":"Ze zeměpisného hlediska...","note":"zeměpisný kontext"},{"head":"\u003cstrong>One major difference between them is that...\u003c/strong>","gloss":"Jedním hlavním rozdílem mezi nimi je, že...","note":"kontrast dvou systémů"},{"head":"\u003cstrong>I would like to point out that...\u003c/strong>","gloss":"Rád/a bych upozornil/a, že...","note":"upozornění na zajímavost"},{"head":"\u003cstrong>Although they are thousands of miles apart,...\u003c/strong>","gloss":"Přestože je dělí tisíce mil,...","note":"překlenutí vzdálenosti"},{"head":"\u003cstrong>From a global point of view,...\u003c/strong>","gloss":"Z globálního hlediska...","note":"celosvětový pohled"},{"head":"\u003cstrong>To conclude, all these countries share...\u003c/strong>","gloss":"Na závěr, všechny tyto země spojuje...","note":"závěrečné shrnutí"}]},"codes":["SSO 23","CR 11b"],"groups":["cr","sso"],"rank":{"cr":23,"sso":46,"all":23.5}},{"file":"doplnek-o23-c11b-usa-basics.md","title":"Doplněk O23 / C11b: The USA – Basic Facts, Political System and Symbols","label":"Navrhla AI, schválil učitel (7. 11. 2026).","vocab":[{"head":"\u003cstrong>resident\u003c/strong> /ˈrezɪdənt/ (noun [C]; B2)","gloss":"obyvatel, rezident","example":"*Each resident received information about the new public library."},{"head":"\u003cstrong>democratic\u003c/strong> /ˌdeməˈkrætɪk/ (adjective; B2)","gloss":"demokratický","example":"*A democratic system allows people to choose their political representatives."},{"head":"\u003cstrong>leader\u003c/strong> /ˈliːdə/ AmE /ˈliːdər/ (noun [C]; B1)","gloss":"vůdce, představitel, lídr","example":"*The new leader explained her plans to the team."},{"head":"\u003cstrong>candidate\u003c/strong> /ˈkændɪdət/ (noun [C]; B2)","gloss":"kandidát, uchazeč (ve volbách)","example":"*The candidate answered questions about his plans before the election."},{"head":"\u003cstrong>official\u003c/strong> /əˈfɪʃl/ (adjective; B2)","gloss":"oficiální, úřední","example":"*Use the official website to check the museum's opening times."},{"head":"\u003cstrong>stripe\u003c/strong> /straɪp/ (noun [C]; B1)","gloss":"pruh (na vlajce)","example":"*The American flag has thirteen stripes, alternating red and white."},{"head":"\u003cstrong>eagle\u003c/strong> /ˈiːɡl/ (noun [C]; B2)","gloss":"orel (bald eagle = orel bělohlavý)","example":"*A bald eagle appears on the Great Seal of the United States."},{"head":"\u003cstrong>currency\u003c/strong> /ˈkʌrənsi/ AmE /ˈkɜːrənsi/ (noun [C or U]; B1)","gloss":"měna","example":"*The US dollar is the official currency of the United States."},{"head":"\u003cstrong>wealthy\u003c/strong> /ˈwelθi/ (adjective; B2)","gloss":"bohatý, zámožný","example":"*The wealthy family donated money to a local library."},{"head":"\u003cstrong>technology\u003c/strong> /tekˈnɒlədʒi/ AmE /tekˈnɑːlədʒi/ (noun [C or U]; B1)","gloss":"technologie, technika","example":"*Our school uses modern technology to help students practise English."}],"answer":["The USA is a \u003cstrong>democratic\u003c/strong> federal republic; Washington, D.C. is its capital. The country's estimated population was about 341.8 million on 1 July 2025. Congress makes laws, the president heads the executive branch, and federal courts, including the Supreme Court, form the judicial branch. In November 2026, Donald Trump is president. The flag has fifty stars for the states and thirteen red and white stripes for the original colonies. A bald \u003cstrong>eagle\u003c/strong> appears on the Great Seal. The \u003cstrong>official\u003c/strong> \u003cstrong>currency\u003c/strong> is the US dollar. I would ask a \u003cstrong>resident\u003c/strong> how \u003cstrong>technology\u003c/strong> affects daily life. Before supporting a \u003cstrong>candidate\u003c/strong>, I would consider their ideas: being \u003cstrong>wealthy\u003c/strong> does not make someone a good \u003cstrong>leader\u003c/strong>."],"answer_info":"","questions":[{"cat":"","text":"\u003cstrong>How is federal power divided among the three branches of the US government under the Constitution?\u003c/strong> * \u003cem>Nápověda:\u003c/em> Zákonodárná moc: Kongres; výkonná: prezident a výkonné úřady; soudní: Nejvyšší soud a další federální soudy. Vysvětli rozdíl jejich úloh."},{"cat":"","text":"\u003cstrong>How does the American flag represent the country's past and present?\u003c/strong> * \u003cem>Nápověda:\u003c/em> Třináct pruhů připomíná původní kolonie, padesát hvězd dnešní státy; vysvětli rozdíl."},{"cat":"","text":"\u003cstrong>Which basic facts would you include in a short introduction to the USA, and why?\u003c/strong> * \u003cem>Nápověda:\u003c/em> Hlavní město, datovaný počet obyvatel, státní zřízení, symboly, měna; vyber informace podle posluchačů."}],"phrases":[],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>democratic\u003c/strong> /ˌdeməˈkrætɪk/ (adjective; slovo k tématu, B2)","gloss":"demokratický","example":"*A democratic system allows people to choose the politicians who represent them."},{"head":"\u003cstrong>leader\u003c/strong> /ˈliːdə/ AmE /ˈliːdər/ (noun [C]; A2)","gloss":"vůdce, představitel, lídr","example":"*The new leader explained her plans to the team."},{"head":"\u003cstrong>candidate\u003c/strong> /ˈkændɪdət/ (noun [C]; B1)","gloss":"kandidát, uchazeč (ve volbách)","example":"*The candidate answered questions about his plans before the election."},{"head":"\u003cstrong>official\u003c/strong> /əˈfɪʃl/ (adjective; B1)","gloss":"oficiální, úřední","example":"*Use the official website to check when the museum is open."},{"head":"\u003cstrong>stripe\u003c/strong> /straɪp/ (noun [C]; B1)","gloss":"pruh (na vlajce)","example":"*The American flag has thirteen red and white stripes."},{"head":"\u003cstrong>eagle\u003c/strong> /ˈiːɡl/ (noun [C]; slovo k tématu, B2)","gloss":"orel (na Velké pečeti USA je orel bělohlavý)","example":"*There is an eagle on the Great Seal of the United States."},{"head":"\u003cstrong>currency\u003c/strong> /ˈkʌrənsi/ AmE /ˈkɜːrənsi/ (noun [C or U]; B1)","gloss":"měna","example":"*The US dollar is the official currency of the United States."},{"head":"\u003cstrong>technology\u003c/strong> /tekˈnɒlədʒi/ AmE /tekˈnɑːlədʒi/ (noun [C or U]; A2)","gloss":"technologie, technika","example":"*Our school uses modern technology to help students practise English."},{"head":"\u003cstrong>Congress\u003c/strong> [vlastní jméno]","gloss":"Kongres (zákonodárný sbor USA)","example":"*Congress makes laws in the USA."},{"head":"\u003cstrong>Supreme Court\u003c/strong> (the Supreme Court) [vlastní jméno]","gloss":"Nejvyšší soud USA","example":"*The Supreme Court decides what laws mean."},{"head":"\u003cstrong>Great Seal\u003c/strong> (the Great Seal) [vlastní jméno]","gloss":"Velká pečeť Spojených států","example":"*The Great Seal is a national symbol of the USA."}],"answer":["The USA is a \u003cstrong>democratic\u003c/strong> federal republic; Washington, D.C. is its capital. The country's population was about 341.8 million on 1 July 2025. The federal government has three branches: \u003cstrong>Congress\u003c/strong>, which makes laws, the president and federal courts, including the \u003cstrong>Supreme Court\u003c/strong>. In November 2026, Donald Trump is president. The flag has fifty stars for the states and thirteen red and white \u003cstrong>stripes\u003c/strong>. There is an \u003cstrong>eagle\u003c/strong> on the \u003cstrong>Great Seal\u003c/strong>. The \u003cstrong>official\u003c/strong> \u003cstrong>currency\u003c/strong> is the US dollar."],"questions":[{"cat":"","text":"\u003cstrong>How is power divided among the three branches of the US government?\u003c/strong> * \u003cem>Nápověda:\u003c/em> Zákonodárná moc: Kongres; výkonná: prezident a výkonné úřady; soudní: Nejvyšší soud a další federální soudy. Vysvětli rozdíl jejich úloh."},{"cat":"","text":"\u003cstrong>How does the American flag represent the country's past and present?\u003c/strong> * \u003cem>Nápověda:\u003c/em> Třináct pruhů připomíná původní kolonie, padesát hvězd dnešní státy; vysvětli rozdíl."},{"cat":"","text":"\u003cstrong>Which basic facts would you include in a short talk about the USA?\u003c/strong> * \u003cem>Nápověda:\u003c/em> Hlavní město, datovaný počet obyvatel, státní zřízení, symboly, měna; vyber informace podle posluchačů a zdůvodni svůj výběr."}],"phrases":[]},"codes":["SSO 23","CR 11b"],"groups":["cr","sso"],"rank":{"cr":23,"sso":46,"all":23.5}},{"file":"tema-s19-cr-on-the-map.md","title":"The CR – on the map","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu.","vocab":[{"head":"\u003cstrong>landlocked country\u003c/strong> (landlocked /ˈlændlɒkt/ AmE /ˈlændlɑːkt/) [C]","gloss":"vnitrozemský stát (stát bez přístupu k moři)","example":"The Czech Republic is a landlocked country situated in Central Europe, often called the heart of Europe."},{"head":"\u003cstrong>border on\u003c/strong> (border /ˈbɔːdə/ AmE /ˈbɔːrdər/) (verb)","gloss":"hraničit s","example":"Our country borders on Germany to the west, Poland to the north, Slovakia to the east, and Austria to the south."},{"head":"\u003cstrong>mountain range\u003c/strong> [C]","gloss":"pohoří","example":"Natural mountain ranges form most of the historical borders surrounding the Bohemian basin."},{"head":"\u003cstrong>highest peak\u003c/strong> (peak /piːk/) [C]","gloss":"nejvyšší vrchol","example":"Sněžka in the Krkonoše Mountains is the highest peak of the country, reaching 1,603 metres above sea level."},{"head":"\u003cstrong>historical lands\u003c/strong> [plural]","gloss":"historické země (tradiční země koruny české: Čechy, Morava a Slezsko)","example":"The Czech Republic consists of three historical lands: Bohemia, Moravia, and Czech Silesia."},{"head":"\u003cstrong>longest river\u003c/strong> [C]","gloss":"nejdelší řeka","example":"The Vltava is the longest river in the Czech Republic, meandering past historic towns before joining the Elbe."},{"head":"\u003cstrong>tributary\u003c/strong> /ˈtrɪbjətri/ AmE /ˈtrɪbjəteri/ [C]","gloss":"přítok (řeky)","example":"The Berounka and Sázava rivers are well-known tributaries flowing into the Vltava."},{"head":"\u003cstrong>drainage divide / watershed\u003c/strong> (drainage /ˈdreɪnɪdʒ/) [C]","gloss":"rozvodí (hranice mezi povodími; hlavní či kontinentální rozvodí: \u003cem>major / continental drainage divide\u003c/em>; v US \u003cem>watershed\u003c/em> = povodí)","example":"The Czech Republic lies on a major European drainage divide, shedding water into three different seas; because of this, it is sometimes nicknamed \"the roof of Europe\"."},{"head":"\u003cstrong>temperate climate\u003c/strong> (temperate /ˈtempərət/) [C/U]","gloss":"mírné podnebí (podnebí mírného pásma s mírnými teplotami bez extrémních výkyvů)","example":"Central Europe experiences a temperate climate with distinct seasonal changes."},{"head":"\u003cstrong>distinct seasons\u003c/strong> (distinct /dɪˈstɪŋkt/) [plural]","gloss":"výrazná / odlišná roční období","example":"Living here means enjoying distinct seasons, from snowy winter slopes to warm summer afternoons."},{"head":"\u003cstrong>fertile lowlands\u003c/strong> (fertile /ˈfɜːtaɪl/ AmE /ˈfɜːrtl/) [plural]","gloss":"úrodné nížiny","example":"The fertile lowlands along the Elbe River and the Haná region in Moravia produce cereals and sugar beet."},{"head":"\u003cstrong>rolling hills\u003c/strong> (rolling /ˈrəʊlɪŋ/) [plural]","gloss":"zvlněná pahorkatina, mírné kopce","example":"The Bohemian-Moravian Highlands feature picturesque rolling hills, peaceful pastures, and forests."},{"head":"\u003cstrong>national park\u003c/strong> /ˌnæʃnəl ˈpɑːk/ AmE /ˌnæʃnəl ˈpɑːrk/ [C]","gloss":"národní park","example":"There are currently four designated national parks (as of 2026) in the Czech Republic: Krkonoše, Šumava, Podyjí, and Bohemian Switzerland."},{"head":"\u003cstrong>sandstone rock formations / rock towns\u003c/strong> (sandstone /ˈsændstəʊn/) [plural]","gloss":"pískovcové skalní útvary, skalní města","example":"Tourists from around the world visit Bohemian Switzerland to admire breathtaking sandstone rock formations."},{"head":"\u003cstrong>fishpond\u003c/strong> [C]","gloss":"(chovný) rybník (obecně rybník či vodní nádrž: \u003cem>pond\u003c/em>)","example":"South Bohemia is famous for its intricate network of carp fishponds established in the Middle Ages and expanded in the sixteenth century."},{"head":"\u003cstrong>spa town\u003c/strong> (spa /spɑː/) [C]","gloss":"lázeňské město","example":"West Bohemia is celebrated for elegant spa towns like Karlovy Vary, famous for hot mineral springs."},{"head":"\u003cstrong>dense forest\u003c/strong> (dense /dens/) [C/U]","gloss":"hustý les","example":"The Šumava National Park protects extensive areas of dense forest and peat bogs."},{"head":"\u003cstrong>water reservoir\u003c/strong> (reservoir /ˈrezəvwɑː(r)/ AmE /ˈrezərvwɑːr/) [C]","gloss":"vodní nádrž, přehradní jezero (samotná hráz je \u003cem>dam\u003c/em>)","example":"Lipno is the largest water reservoir in the country by surface area and a magnet for water sports enthusiasts."},{"head":"\u003cstrong>natural resources\u003c/strong> [plural]","gloss":"přírodní zdroje, přírodní bohatství (zahrnuje půdu, lesy i nerostné suroviny – \u003cem>mineral resources\u003c/em>)","example":"The country possesses valuable natural resources, including mineral springs, fertile soil, and timber."},{"head":"\u003cstrong>heart of Europe\u003c/strong> (europe /ˈjʊərəp/ AmE /ˈjʊrəp/) [phrase]","gloss":"srdce Evropy","example":"Because of its central geographic location, the Czech Republic is frequently described as the heart of Europe."},{"head":"\u003cstrong>natural boundary\u003c/strong> (boundary /ˈbaʊndri/) [C]","gloss":"přirozená hranice","example":"High mountain ridges and major rivers form natural boundaries between neighbouring states."},{"head":"\u003cstrong>protected landscape area\u003c/strong> (landscape /ˈlændskeɪp/) [C]","gloss":"chráněná krajinná oblast (CHKO)","example":"The Jizera Mountains are preserved as a protected landscape area popular with cross-country skiers."}],"answer":["The Czech Republic is a \u003cstrong>landlocked country\u003c/strong> in Central Europe, covering an area of roughly 79,000 square kilometres. It has a population of nearly eleven million people, and its capital and largest city is Prague, home to around 1.4 million inhabitants. Administratively, the state is divided into fourteen regions, while culturally it consists of three \u003cstrong>historical lands\u003c/strong>: Bohemia in the west, Moravia in the east, and part of Silesia in the north-east. Our territory \u003cstrong>borders on\u003c/strong> four neighbours: Germany, Poland, Slovakia, and Austria.","In terms of physical landscape, Bohemia forms a broad basin surrounded by natural \u003cstrong>mountain ranges\u003c/strong>. The Krkonoše Mountains stretch along the northern border, where our \u003cstrong>highest peak\u003c/strong>, Sněžka, rises to 1,603 metres. To the south-west lies Šumava, characterized by \u003cstrong>dense forest\u003c/strong> and peat bogs. The interior features \u003cstrong>rolling hills\u003c/strong>, such as the Bohemian-Moravian Highlands, and \u003cstrong>fertile lowlands\u003c/strong> along the River Elbe and in southern Moravia.","Water plays a vital role in our geography. The country lies on a continental \u003cstrong>drainage divide\u003c/strong>, with rivers flowing to three different seas. Our \u003cstrong>longest river\u003c/strong> is the Vltava, which meanders through Bohemia to join the Elbe. We also have famous artificial \u003cstrong>fishponds\u003c/strong> in the south and the Lipno \u003cstrong>water reservoir\u003c/strong>, which is the country's largest reservoir by surface area. Along our northern borderlands, dramatic \u003cstrong>sandstone rock formations\u003c/strong> also attract thousands of hikers. With a \u003cstrong>temperate climate\u003c/strong> that brings \u003cstrong>distinct seasons\u003c/strong>, the country preserves unique landscapes in four \u003cstrong>national parks\u003c/strong> (as of 2026)."],"answer_info":"","questions":[{"cat":"Popis","text":"Which neighbouring countries surround the Czech Republic?"},{"cat":"Popis","text":"What natural mountain borders define our territory?"},{"cat":"Srovnání","text":"In what ways do the landscapes of Bohemia and Moravia differ in terms of terrain and agriculture?"},{"cat":"Vodní toky","text":"Why is the European drainage divide passing through our country sometimes compared to a roof shedding water into different seas?"},{"cat":"Zkušenost","text":"What made your visit to a Czech national park or mountain area memorable?"},{"cat":"Názor","text":"What are the advantages and drawbacks of being a landlocked country without direct access to the sea?"},{"cat":"Hypotéza","text":"If climate change leads to hotter, drier summers in Central Europe, how could that impact Czech agriculture and river levels?"},{"cat":"Srovnání","text":"In terms of geography, how does the Czech Republic compare to neighbours that have either high Alpine peaks or a sea coastline?"}],"phrases":[{"head":"\u003cstrong>Geographically speaking, the Czech Republic is situated in...\u003c/strong>","gloss":"Ze zeměpisného hlediska se Česká republika nachází v...","note":"zeměpisná poloha"},{"head":"\u003cstrong>The country is completely surrounded by...\u003c/strong>","gloss":"Země je zcela obklopena...","note":"popis hranic"},{"head":"\u003cstrong>What is especially fascinating about our landscape is...\u003c/strong>","gloss":"Co je na naší krajině obzvláště fascinující, je...","note":"vyzdvižení zajímavosti"},{"head":"\u003cstrong>When you travel from north to south,...\u003c/strong>","gloss":"Když cestujete ze severu na jih,...","note":"popis průřezu zemí"},{"head":"\u003cstrong>An important feature of our river system is...\u003c/strong>","gloss":"Důležitým rysem naší říční sítě je...","note":"popis vodstva"},{"head":"\u003cstrong>Thanks to four distinct seasons,...\u003c/strong>","gloss":"Díky čtyřem odlišným ročním obdobím...","note":"souvislost s klimatem"},{"head":"\u003cstrong>To conclude, our geographic position makes the country...\u003c/strong>","gloss":"Na závěr, naše geografická poloha činí zemi...","note":"závěrečné shrnutí"}],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>share a border with\u003c/strong> (phrase; A1 + B1)","gloss":"hraničit s","example":"Our country shares a border with Germany, Poland, Slovakia and Austria."},{"head":"\u003cstrong>highest mountain\u003c/strong> [C; A1 + A1]","gloss":"nejvyšší hora","example":"Sněžka in the Krkonoše Mountains is the country's highest mountain (1,603 metres)."},{"head":"\u003cstrong>historical regions\u003c/strong> [plural; B1 + A2]","gloss":"historické země (tradiční země koruny české: Čechy, Morava a Slezsko)","example":"The Czech Republic has three historical regions: Bohemia, Moravia and Czech Silesia."},{"head":"\u003cstrong>longest river\u003c/strong> [C; A1 + A1]","gloss":"nejdelší řeka","example":"The Vltava, the longest river in the Czech Republic, flows into the Elbe."},{"head":"\u003cstrong>mild climate\u003c/strong> [C; B1 + A2]","gloss":"mírné podnebí (podnebí mírného pásma s mírnými teplotami bez extrémních výkyvů)","example":"Central Europe has a mild climate with clear changes between the seasons."},{"head":"\u003cstrong>national park\u003c/strong> /ˌnæʃnəl ˈpɑːk/ AmE /ˌnæʃnəl ˈpɑːrk/ [C; B1]","gloss":"národní park","example":"There are four national parks (as of 2026) in the Czech Republic: Krkonoše, Šumava, Podyjí and Bohemian Switzerland."},{"head":"\u003cstrong>rock towns\u003c/strong> [plural; A2 + A1]","gloss":"skalní města (pískovcové skalní útvary)","example":"Tourists from around the world admire the rock towns of Bohemian Switzerland."},{"head":"\u003cstrong>spa town\u003c/strong> (spa /spɑː/) [C; slovo k tématu, bez úrovně]","gloss":"lázeňské město","example":"West Bohemia is famous for spa towns like Karlovy Vary."},{"head":"\u003cstrong>thick forest\u003c/strong> [C/U; B1 + A2]","gloss":"hustý les","example":"Šumava National Park protects large areas of thick forest."},{"head":"\u003cstrong>water reservoir\u003c/strong> (reservoir /ˈrezəvwɑː(r)/ AmE /ˈrezərvwɑːr/) [C; slovo k tématu, A1 + C1]","gloss":"vodní nádrž, přehradní jezero (samotná hráz je \u003cem>dam\u003c/em>)","example":"Lipno is the water reservoir with the largest surface in the country, and it is popular for water sports."},{"head":"\u003cstrong>pond\u003c/strong> /pɒnd/ AmE /pɑːnd/ [C; slovo k tématu, C1]","gloss":"rybník (chovný rybník: \u003cem>fishpond\u003c/em>)","example":"South Bohemia is famous for its fish ponds."},{"head":"\u003cstrong>natural resources\u003c/strong> [plural; A1 + B1]","gloss":"přírodní zdroje, přírodní bohatství","example":"The country has valuable natural resources, including good soil and wood."},{"head":"\u003cstrong>centre of Europe\u003c/strong> [phrase; A1 + A1]","gloss":"střed Evropy (o České republice se často říká \u003cem>srdce Evropy\u003c/em>)","example":"The Czech Republic is in the centre of Europe."},{"head":"\u003cstrong>natural border\u003c/strong> [C; A1 + B1]","gloss":"přirozená hranice","example":"Major rivers are natural borders between countries."}],"answer":["The Czech Republic is a country in Central Europe with no access to the sea. It is about 79,000 square kilometres in size and has nearly eleven million people. Prague, its capital and largest city, has about 1.4 million people. The state is divided into fourteen regions. Its three \u003cstrong>historical regions\u003c/strong> are Bohemia in the west, Moravia in the east and part of Silesia in the north-east. It \u003cstrong>shares a border with\u003c/strong> Germany, Poland, Slovakia and Austria.","Bohemia is a wide, low area with mountains all around it. The Krkonoše Mountains are along the northern border, and our \u003cstrong>highest mountain\u003c/strong>, Sněžka, is 1,603 metres high. Šumava, in the south-west, has \u003cstrong>thick forest\u003c/strong>. There is low land with good soil along the River Elbe and in southern Moravia.","Our rivers flow to three different seas. Our \u003cstrong>longest river\u003c/strong> is the Vltava, which flows through Bohemia and joins the Elbe. In the south, we have famous fish \u003cstrong>ponds\u003c/strong>. Lipno is our \u003cstrong>water reservoir\u003c/strong> with the largest surface. Near our northern border, impressive \u003cstrong>rock towns\u003c/strong> attract thousands of walkers. The country has a \u003cstrong>mild climate\u003c/strong> with clearly different seasons. Four \u003cstrong>national parks\u003c/strong> (as of 2026) protect its scenery."],"questions":[{"cat":"Popis","text":"Which countries share a border with the Czech Republic?"},{"cat":"Popis","text":"Which mountains are natural borders of our country?"},{"cat":"Srovnání","text":"How are Bohemia and Moravia different in their type of land and farming?"},{"cat":"Vodní toky","text":"How is the line where water divides in our country like a roof? \u003cem>(water flows from it into different seas)\u003c/em>"},{"cat":"Zkušenost","text":"What made your visit to a Czech national park or mountain area special?"},{"cat":"Názor","text":"What are the advantages and disadvantages of having no direct access to the sea?"},{"cat":"Hypotéza","text":"If climate change brings hotter, drier summers, how could Czech farming and river levels change?"},{"cat":"Srovnání","text":"How is Czech geography different from countries around us with high Alps or a coastline?"}],"phrases":[{"head":"\u003cstrong>From a geographical point of view, the Czech Republic is in...\u003c/strong>","gloss":"Ze zeměpisného hlediska se Česká republika nachází v...","note":"zeměpisná poloha"},{"head":"\u003cstrong>The country has ... on all sides.\u003c/strong>","gloss":"Země je ze všech stran obklopena...","note":"popis hranic"},{"head":"\u003cstrong>Something especially fascinating about our scenery is...\u003c/strong>","gloss":"Obzvláště fascinující na naší krajině je...","note":"vyzdvižení zajímavosti"},{"head":"\u003cstrong>When you travel from north to south,...\u003c/strong>","gloss":"Když cestujete ze severu na jih,...","note":"popis průřezu zemí"},{"head":"\u003cstrong>An important feature of our river system is...\u003c/strong>","gloss":"Důležitým rysem naší říční sítě je...","note":"popis vodstva"},{"head":"\u003cstrong>Thanks to four clearly different seasons,...\u003c/strong>","gloss":"Díky čtyřem odlišným ročním obdobím...","note":"souvislost s klimatem"},{"head":"\u003cstrong>To conclude, our geographical position makes the country...\u003c/strong>","gloss":"Na závěr, naše geografická poloha činí zemi...","note":"závěrečné shrnutí"}]},"codes":["SSO 24","CR 3b"],"groups":["cr","sso"],"rank":{"cr":7,"sso":48,"all":7.5}},{"file":"tema-c5b-south-bohemia.md","title":"South Bohemia","label":"Navrhl AI (Hermes, gpt-6.1-terra), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu.","vocab":[{"head":"\u003cstrong>river meander\u003c/strong> (meander /miˈændə(r)/ AmE /miˈændər/)","gloss":"říční meandr, zákrut řeky","example":"A river meander shapes the landscape."},{"head":"\u003cstrong>castle complex\u003c/strong>","gloss":"hradní a zámecký areál","example":"The castle complex stands above the town."},{"head":"\u003cstrong>medieval layout\u003c/strong> (medieval /ˌmediˈiːvl/; layout /ˈleɪaʊt/)","gloss":"středověký půdorys","example":"The medieval layout can still be seen in the streets."},{"head":"\u003cstrong>village green\u003c/strong>","gloss":"náves","example":"The houses stand around the village green."},{"head":"\u003cstrong>farmstead\u003c/strong> /ˈfɑːmsted/ AmE /ˈfɑːrmsted/","gloss":"usedlost","example":"The farmstead has a decorated front."},{"head":"\u003cstrong>gable\u003c/strong> /ˈɡeɪbl/","gloss":"štít budovy","example":"The gable is decorated in bright colours."},{"head":"\u003cstrong>folk architecture\u003c/strong>","gloss":"lidová architektura","example":"Folk architecture tells us about rural life."},{"head":"\u003cstrong>rural settlement\u003c/strong> (rural /ˈrʊərəl/ AmE /ˈrʊrəl/; settlement /ˈsetlmənt/)","gloss":"venkovské sídlo","example":"The rural settlement has a central green."},{"head":"\u003cstrong>pond system\u003c/strong> (pond /pɒnd/ AmE /pɑːnd/)","gloss":"rybniční soustava","example":"The pond system is linked by waterways."},{"head":"\u003cstrong>fish farming\u003c/strong> /ˈfɪʃ fɑːmɪŋ/ AmE /ˈfɪʃ fɑːrmɪŋ/","gloss":"chov ryb","example":"Fish farming is part of the area's history."},{"head":"\u003cstrong>artificial canal\u003c/strong> (artificial /ˌɑːtɪˈfɪʃl/ AmE /ˌɑːrtɪˈfɪʃl/; canal /kəˈnæl/)","gloss":"umělý kanál","example":"The artificial canal carries water to ponds."},{"head":"\u003cstrong>waterway\u003c/strong> /ˈwɔːtəweɪ/ AmE /ˈwɔːtərweɪ/","gloss":"vodní cesta, tok","example":"A waterway connects different parts of the landscape."},{"head":"\u003cstrong>wetland\u003c/strong> /ˈwetlənd/","gloss":"mokřad","example":"The wetland provides a home for many birds."},{"head":"\u003cstrong>sluice gate\u003c/strong> (sluice /sluːs/)","gloss":"stavidlo","example":"A sluice gate controls the flow of water."},{"head":"\u003cstrong>bicycle route\u003c/strong>","gloss":"cyklistická trasa","example":"We chose a bicycle route through the countryside."},{"head":"\u003cstrong>pond embankment\u003c/strong> (pond /pɒnd/ AmE /pɑːnd/; embankment /ɪmˈbæŋkmənt/)","gloss":"rybniční hráz","example":"We walked along the pond embankment."},{"head":"\u003cstrong>decorative plasterwork\u003c/strong> (decorative /ˈdekərətɪv/ AmE /ˈdekəreɪtɪv/; plasterwork /ˈplɑːstəwɜːk/ AmE /ˈplæstərwɜːrk/)","gloss":"ozdobná štuková výzdoba","example":"Decorative plasterwork gives the front of the house character."},{"head":"\u003cstrong>visitor pressure\u003c/strong>","gloss":"tlak způsobený návštěvností","example":"Visitor pressure can affect a small town."},{"head":"\u003cstrong>respect residents\u003c/strong>","gloss":"respektovat obyvatele","example":"Visitors should respect residents and their privacy."},{"head":"\u003cstrong>vernacular building\u003c/strong> (vernacular /vəˈnækjələ(r)/ AmE /vərˈnækjələr/)","gloss":"stavba tradičního místního typu","example":"The vernacular building reflects local materials and design."}],"answer":["South Bohemia is a region I would recommend to visitors who enjoy both history and the outdoors. As a tourism student in the Czech Republic, I think it offers a useful example of how a destination can combine historic buildings with varied natural surroundings. I would not try to show visitors everything in one day; I would choose a few places and leave time to explore them properly.","Český Krumlov is in South Bohemia, and its historic centre is a UNESCO World Heritage site. The town lies beside a \u003cstrong>river meander\u003c/strong> of the Vltava, beneath a castle. Its streets still show a \u003cstrong>medieval layout\u003c/strong>. I would suggest walking through the centre and looking at the town from different viewpoints. Visitors should also \u003cstrong>respect residents\u003c/strong>, because a historic centre is not only a tourist attraction but a place where people live.","Another UNESCO site is the village of Holašovice. Its \u003cstrong>village green\u003c/strong> is surrounded by traditional buildings. Each \u003cstrong>farmstead\u003c/strong> has its own character, and a decorated \u003cstrong>gable\u003c/strong> gives it a distinctive appearance. Their style is known as South Bohemian Folk Baroque. For me, this \u003cstrong>folk architecture\u003c/strong> shows how a \u003cstrong>rural settlement\u003c/strong> can preserve a distinctive character.","Around Třeboň, a historic \u003cstrong>pond system\u003c/strong> tells a different story. \u003cstrong>Fish farming\u003c/strong> and the creation of ponds shaped the area. The Golden Canal is an artificial canal that supplies many local ponds with water. A visitor could plan a walk or cycle trip and learn about the area's fish-farming history along the way.","My ideal itinerary would combine one historic town, a village and time outdoors. I would also consider visitor pressure and avoid treating local communities as a backdrop for photographs."],"answer_info":"","questions":[{"cat":"","text":"Which places would you recommend to a first-time visitor to South Bohemia?"},{"cat":"","text":"How does Český Krumlov's setting contribute to its character?"},{"cat":"","text":"What can visitors learn from the architecture of Holašovice?"},{"cat":"","text":"How has fish farming shaped the Třeboň area?"},{"cat":"","text":"How would you design a two-day regional itinerary?"},{"cat":"","text":"What difficulties can heavy visitor numbers cause for residents?"},{"cat":"","text":"How might tourism support local heritage without damaging it?"}],"phrases":[{"head":"\u003cstrong>The region is known for...\u003c/strong>","gloss":"Region je známý díky...","note":""},{"head":"\u003cstrong>A good starting point is...\u003c/strong>","gloss":"Dobrým výchozím bodem je...","note":""},{"head":"\u003cstrong>One place worth visiting is...\u003c/strong>","gloss":"Jedním z míst, která stojí za návštěvu, je...","note":""},{"head":"\u003cstrong>What makes it distinctive is...\u003c/strong>","gloss":"Výjimečným je činí...","note":""},{"head":"\u003cstrong>Visitors can learn about...\u003c/strong>","gloss":"Návštěvníci se mohou dozvědět o...","note":""},{"head":"\u003cstrong>It is important to respect...\u003c/strong>","gloss":"Je důležité respektovat...","note":""},{"head":"\u003cstrong>My suggested itinerary would include...\u003c/strong>","gloss":"Můj navrhovaný itinerář by zahrnoval...","note":""}],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>river bend\u003c/strong> (noun phrase; A1 + B1)","gloss":"zákrut řeky, říční meandr","example":"A river bend gives the land its shape."},{"head":"\u003cstrong>castle buildings\u003c/strong> (noun phrase; A2 + A1)","gloss":"hradní a zámecký areál (budovy hradu a zámku)","example":"The castle buildings are above the town."},{"head":"\u003cstrong>medieval plan\u003c/strong> (medieval /ˌmediˈiːvl/) (noun phrase; slovo k tématu, C1 + A2)","gloss":"středověký půdorys","example":"The medieval plan can still be seen in the streets."},{"head":"\u003cstrong>gable\u003c/strong> /ˈɡeɪbl/ (noun; slovo k tématu, C2)","gloss":"štít budovy","example":"The gable is decorated in bright colours."},{"head":"\u003cstrong>folk architecture\u003c/strong> (noun phrase; B1 + A2)","gloss":"lidová architektura","example":"Folk architecture tells us about life in the countryside."},{"head":"\u003cstrong>pond system\u003c/strong> (pond /pɒnd/ AmE /pɑːnd/) (noun phrase; slovo k tématu, C1 + A2)","gloss":"rybniční soustava","example":"The ponds in the pond system are linked to each other."},{"head":"\u003cstrong>fish farming\u003c/strong> /ˈfɪʃ fɑːmɪŋ/ AmE /ˈfɪʃ fɑːrmɪŋ/ (noun; slovo k tématu, C2)","gloss":"chov ryb","example":"Fish farming is part of the area's history."},{"head":"\u003cstrong>bicycle route\u003c/strong> (noun phrase; A1 + A2)","gloss":"cyklistická trasa","example":"We chose a bicycle route through the countryside."},{"head":"\u003cstrong>respect local people\u003c/strong> (phrase; B1 + A1 + A1)","gloss":"respektovat místní obyvatele","example":"Visitors should respect local people."},{"head":"\u003cstrong>UNESCO World Heritage List\u003c/strong> (the UNESCO World Heritage List) [vlastní jméno]","gloss":"Seznam světového dědictví UNESCO","example":"Český Krumlov's historic centre is on the UNESCO World Heritage List."},{"head":"\u003cstrong>South Bohemian Folk Baroque\u003c/strong> [vlastní jméno]","gloss":"jihočeské selské (lidové) baroko","example":"The style of the farms in Holašovice is South Bohemian Folk Baroque."}],"answer":["As a tourism student, I would recommend South Bohemia to visitors who enjoy both history and being outdoors. I would choose a few places and leave time to explore them properly.","Český Krumlov's historic centre is on the \u003cstrong>UNESCO World Heritage List\u003c/strong>. The town is next to a \u003cstrong>river bend\u003c/strong> of the Vltava, below a castle. Its streets still have a \u003cstrong>medieval plan\u003c/strong>. Visitors should also \u003cstrong>respect local people\u003c/strong>, because people live in historic centres too.","Another UNESCO site is the village of Holašovice. Traditional buildings are around an area of grass in the middle of the village. Each farm has its own character, and a decorated \u003cstrong>gable\u003c/strong> gives it a special look. Their style is known as \u003cstrong>South Bohemian Folk Baroque\u003c/strong>. For me, this \u003cstrong>folk architecture\u003c/strong> shows how a place in the countryside can keep its own character.","Around Třeboň, there is a historic \u003cstrong>pond system\u003c/strong>. \u003cstrong>Fish farming\u003c/strong> and building ponds had an important influence on the area. The Golden Canal was built by people, and it supplies many local ponds with water.","My ideal travel plan would combine one historic town, a village and time outdoors. I would also consider the problems that many visitors can cause."],"questions":[{"cat":"","text":"Which places would you recommend to someone on their first visit to South Bohemia?"},{"cat":"","text":"How does Český Krumlov's setting help to create its character?"},{"cat":"","text":"What can visitors learn from the architecture of Holašovice?"},{"cat":"","text":"How has fish farming influenced the Třeboň area?"},{"cat":"","text":"How would you design a two-day travel plan for the region?"},{"cat":"","text":"What difficulties can large numbers of visitors cause for local people?"},{"cat":"","text":"How might tourism support local history and traditions without damaging them?"}],"phrases":[{"head":"\u003cstrong>The region is known for...\u003c/strong>","gloss":"Region je známý díky...","note":""},{"head":"\u003cstrong>A good place to start is...\u003c/strong>","gloss":"Dobrým výchozím bodem je...","note":""},{"head":"\u003cstrong>I would really recommend visiting...\u003c/strong>","gloss":"Rozhodně bych doporučil/a navštívit...","note":""},{"head":"\u003cstrong>It is special because...\u003c/strong>","gloss":"Výjimečné je proto, že...","note":""},{"head":"\u003cstrong>Visitors can learn about...\u003c/strong>","gloss":"Návštěvníci se mohou dozvědět o...","note":""},{"head":"\u003cstrong>It is important to respect...\u003c/strong>","gloss":"Je důležité respektovat...","note":""},{"head":"\u003cstrong>My suggested travel plan would include...\u003c/strong>","gloss":"Můj navrhovaný plán cesty by zahrnoval...","note":""}]},"codes":["SSO 24","CR 5b"],"groups":["cr","sso"],"rank":{"cr":11,"sso":48,"all":11.5}},{"file":"tema-s24-environment-and-ecology.md","title":"Environment and ecology","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu.","vocab":[{"head":"\u003cstrong>climate change\u003c/strong> /ˈklaɪmət tʃeɪndʒ/ [U]","gloss":"změna klimatu","example":"Rising global temperatures and shifting weather patterns are clear consequences of climate change."},{"head":"\u003cstrong>global warming\u003c/strong> /ˌɡləʊbl ˈwɔːmɪŋ/ AmE /ˌɡləʊbl ˈwɔːrmɪŋ/ [U]","gloss":"globální oteplování","example":"Scientists warn that global warming is accelerating the melting of polar glaciers."},{"head":"\u003cstrong>greenhouse gas emissions\u003c/strong> (greenhouse /ˈɡriːnhaʊs/) [plural]","gloss":"emise skleníkových plynů","example":"Governments must agree to cut greenhouse gas emissions from power stations and transport."},{"head":"\u003cstrong>renewable energy\u003c/strong> [U]","gloss":"obnovitelná energie","example":"Investing in renewable energy, like solar and wind power, reduces our reliance on coal."},{"head":"\u003cstrong>fossil fuels\u003c/strong> (fossil /ˈfɒsl/ AmE /ˈfɑːsl/) [plural]","gloss":"fosilní paliva","example":"Burning fossil fuels releases massive amounts of carbon dioxide into the atmosphere."},{"head":"\u003cstrong>deforestation\u003c/strong> /ˌdiːˌfɒrɪˈsteɪʃn/ AmE /ˌdiːˌfɔːrɪˈsteɪʃn/ [U]","gloss":"odlesňování, kácení lesů","example":"Massive deforestation in tropical rainforests destroys unique wildlife habitats."},{"head":"\u003cstrong>endangered species\u003c/strong> (endangered /ɪnˈdeɪndʒəd/ AmE /ɪnˈdeɪndʒərd/; species /ˈspiːʃiːz/) [C, plural unchanged: species]","gloss":"ohrožený druh / ohrožené druhy","example":"International conservation programmes strive to protect endangered species from poaching and habitat loss."},{"head":"\u003cstrong>biodiversity loss\u003c/strong> (biodiversity /ˌbaɪəʊdaɪˈvɜːsəti/ AmE /ˌbaɪəʊdaɪˈvɜːrsəti/) [U]","gloss":"úbytek biologické rozmanitosti","example":"Pollution and expanding agriculture are leading to rapid biodiversity loss worldwide."},{"head":"\u003cstrong>landfill\u003c/strong> /ˈlændfɪl/ [C]","gloss":"skládka odpadu","example":"Mountains of plastic packaging end up buried in a landfill where they take centuries to decompose."},{"head":"\u003cstrong>recycle\u003c/strong> /ˌriːˈsaɪkl/ (verb)","gloss":"recyklovat (zpracovat vytříděný odpad na nový materiál; domácí třídění je \u003cem>waste sorting\u003c/em>)","example":"Czech households are remarkably disciplined when it comes to sorting paper and glass to recycle."},{"head":"\u003cstrong>single-use plastic\u003c/strong> [U/C; also adjective]","gloss":"jednorázový plast [substantivum]; jednorázový plastový [adjektivum]","example":"Many countries have introduced bans on single-use plastic bags and straws to reduce ocean waste."},{"head":"\u003cstrong>carbon footprint\u003c/strong> /ˌkɑːbən ˈfʊtprɪnt/ AmE /ˌkɑːrbən ˈfʊtprɪnt/ [C]","gloss":"uhlíková stopa","example":"Choosing trains instead of short-haul flights significantly lowers your personal carbon footprint."},{"head":"\u003cstrong>drought\u003c/strong> /draʊt/ [C/U]","gloss":"sucho","example":"Prolonged summer droughts in Central Europe threaten crops and lower groundwater levels."},{"head":"\u003cstrong>flood\u003c/strong> /flʌd/ [C]","gloss":"povodeň, záplava","example":"Sudden torrential rain can cause a devastating flood along river valleys."},{"head":"\u003cstrong>solar panel\u003c/strong> /ˌsəʊlə ˈpænl/ AmE /ˌsəʊlər ˈpænl/ [C]","gloss":"solární panel (často v plurálu: \u003cem>solar panels\u003c/em>)","example":"More homeowners are installing solar panels on rooftops to generate clean electricity."},{"head":"\u003cstrong>natural habitat\u003c/strong> (habitat /ˈhæbɪtæt/) [C]","gloss":"přirozené prostředí, biotop","example":"Urban expansion destroys the natural habitat of migratory birds and small mammals."},{"head":"\u003cstrong>eco-friendly\u003c/strong> /ˌiːkəʊ ˈfrendli/ (adjective)","gloss":"ekologický, šetrný k životnímu prostředí","example":"Using eco-friendly cleaning detergents helps reduce the amount of harmful chemicals entering waterways."},{"head":"\u003cstrong>conserve energy\u003c/strong> (conserve /kənˈsɜːv/ AmE /kənˈsɜːrv/) (phrase)","gloss":"šetřit energii","example":"Turning off lights and lowering heating temperatures are easy ways to conserve energy at home."},{"head":"\u003cstrong>pollution\u003c/strong> /pəˈluːʃn/ [U]","gloss":"znečištění","example":"Heavy industrial pollution in northern regions contributes to respiratory diseases."},{"head":"\u003cstrong>extinct\u003c/strong> /ɪkˈstɪŋkt/ (adjective)","gloss":"vyhynulý","example":"Unless human pressure eases, many unique amphibians risk becoming completely extinct."},{"head":"\u003cstrong>sustainable\u003c/strong> /səˈsteɪnəbl/ (adjective)","gloss":"udržitelný","example":"Adopting sustainable farming practices preserves topsoil fertility for future generations."},{"head":"\u003cstrong>waste sorting\u003c/strong> [U]","gloss":"třídění odpadu","example":"Effective waste sorting allows municipalities to reuse valuable raw materials."}],"answer":["Environmental protection is one of the most important topics discussed by our generation. Across the world, the effects of \u003cstrong>climate change\u003c/strong> and \u003cstrong>global warming\u003c/strong> are no longer distant scientific theories—we can feel them directly in our own everyday lives. Here in the Czech Republic, we regularly experience increasingly hotter summers, longer periods of seasonal \u003cstrong>drought\u003c/strong>, declining groundwater levels, and occasional severe storms leading to a sudden \u003cstrong>flood\u003c/strong>.","At the core of the ecological crisis lies our consumption of resources. For decades, industry and transport have relied heavily on burning \u003cstrong>fossil fuels\u003c/strong>, releasing massive \u003cstrong>greenhouse gas emissions\u003c/strong> into our atmosphere. At the same time, worldwide \u003cstrong>deforestation\u003c/strong> threatens the \u003cstrong>natural habitat\u003c/strong> of wildlife, causing alarming \u003cstrong>biodiversity loss\u003c/strong> and pushing many \u003cstrong>endangered species\u003c/strong> to the brink of becoming \u003cstrong>extinct\u003c/strong>.","However, giving up is not an option. Real progress begins with gradually moving away from dirty energy towards clean \u003cstrong>renewable energy\u003c/strong>, such as wind farms and rooftop \u003cstrong>solar panels\u003c/strong>. Furthermore, young people can make a difference through everyday choices. Here in South Bohemia, secondary school students take \u003cstrong>waste sorting\u003c/strong> very seriously. By taking public transport instead of driving cars, choosing to \u003cstrong>recycle\u003c/strong>, cutting down on \u003cstrong>single-use plastic\u003c/strong>, and learning to \u003cstrong>conserve energy\u003c/strong>, we can actively lower our personal \u003cstrong>carbon footprint\u003c/strong>. Adopting a more \u003cstrong>sustainable\u003c/strong> lifestyle is about taking practical steps to preserve a healthy planet for future generations."],"answer_info":"","questions":[{"cat":"Popis","text":"What everyday evidence of climate change and environmental problems can we observe in the Czech Republic?"},{"cat":"Srovnání","text":"How do renewable energy sources like solar and wind power compare to traditional fossil fuels?"},{"cat":"Osobní přístup","text":"How do you and your family personally contribute to environmental protection in your daily life?"},{"cat":"Názor","text":"Why do some developing countries find it difficult to transition rapidly from fossil fuels to clean renewable energy?"},{"cat":"Popis","text":"What happens to household waste after it is collected from recycling bins in our towns?"},{"cat":"Hypotéza","text":"If the government made all public transport completely free for everyone, what environmental benefits and economic problems would arise?"},{"cat":"Názor","text":"How much responsibility do ordinary people have for protecting the climate compared to big industrial corporations?"}],"phrases":[{"head":"\u003cstrong>When it comes to ecological issues,...\u003c/strong>","gloss":"Pokud jde o ekologické otázky,...","note":"uvedení tématu"},{"head":"\u003cstrong>The biggest environmental threat we face today is...\u003c/strong>","gloss":"Největší ekologickou hrozbou, které dnes čelíme, je...","note":"pojmenování priority"},{"head":"\u003cstrong>Small everyday changes can make a big difference, such as...\u003c/strong>","gloss":"Malé každodenní změny mohou mít velký dopad, jako například...","note":"praktický přístup"},{"head":"\u003cstrong>We need to find a balance between modern living and...\u003c/strong>","gloss":"Musíme najít rovnováhu mezi moderním způsobem života a...","note":"vyvážení zájmů"},{"head":"\u003cstrong>From my personal perspective,...\u003c/strong>","gloss":"Z mého osobního pohledu...","note":"vyjádření postoje"},{"head":"\u003cstrong>You cannot deny that... / There is no doubt that...\u003c/strong>","gloss":"Nelze popřít, že... / Není pochyb o tom, že...","note":"přiznání faktu"},{"head":"\u003cstrong>To put it in a nutshell, protecting the environment is about...\u003c/strong>","gloss":"V kostce řečeno, ochrana životního prostředí je o...","note":"závěrečné shrnutí"}],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>climate change\u003c/strong> /ˈklaɪmət tʃeɪndʒ/ [U; A2]","gloss":"změna klimatu","example":"Rising global temperatures and changing weather patterns are clear consequences of climate change."},{"head":"\u003cstrong>global warming\u003c/strong> /ˌɡləʊbl ˈwɔːmɪŋ/ AmE /ˌɡləʊbl ˈwɔːrmɪŋ/ [U; B1]","gloss":"globální oteplování","example":"Scientists warn that global warming is making ice on land near the North and South Poles become water faster."},{"head":"\u003cstrong>greenhouse gas\u003c/strong> (greenhouse /ˈɡriːnhaʊs/) [C; slovo k tématu, B2]","gloss":"skleníkový plyn","example":"Governments must agree to cut greenhouse gases from power stations and transport."},{"head":"\u003cstrong>renewable energy\u003c/strong> [U; B1 + A2]","gloss":"obnovitelná energie","example":"Investing money in renewable energy means that we depend less on coal."},{"head":"\u003cstrong>endangered\u003c/strong> /ɪnˈdeɪndʒəd/ AmE /ɪnˈdeɪndʒərd/ (adjective; B1)","gloss":"ohrožený (o druhu zvířat nebo rostlin)","example":"International programmes try to protect endangered kinds of animals and plants."},{"head":"\u003cstrong>recycle\u003c/strong> /ˌriːˈsaɪkl/ (verb; A2)","gloss":"recyklovat (zpracovat vytříděný odpad na nový materiál; domácí třídění je \u003cem>waste sorting\u003c/em>)","example":"In Czech homes, people are very careful about sorting paper and glass to recycle."},{"head":"\u003cstrong>carbon footprint\u003c/strong> /ˌkɑːbən ˈfʊtprɪnt/ AmE /ˌkɑːrbən ˈfʊtprɪnt/ [C; slovo k tématu, B2]","gloss":"uhlíková stopa","example":"Choosing trains instead of short flights makes your personal carbon footprint much smaller."},{"head":"\u003cstrong>flood\u003c/strong> /flʌd/ [C; B1]","gloss":"povodeň, záplava","example":"Sudden very heavy rain can cause a terrible flood along river valleys."},{"head":"\u003cstrong>solar panel\u003c/strong> /ˌsəʊlə ˈpænl/ AmE /ˌsəʊlər ˈpænl/ [C; B1]","gloss":"solární panel (často v plurálu: \u003cem>solar panels\u003c/em>)","example":"More people are putting solar panels on their roofs to produce clean electricity."},{"head":"\u003cstrong>green\u003c/strong> (adjective; B1)","gloss":"ekologický, šetrný k životnímu prostředí","example":"Using green cleaning products helps to reduce dangerous chemicals in water."},{"head":"\u003cstrong>save energy\u003c/strong> (phrase; A2 + A2)","gloss":"šetřit energii","example":"Turning off lights and using less heating save energy at home."},{"head":"\u003cstrong>pollution\u003c/strong> /pəˈluːʃn/ [U; A2]","gloss":"znečištění","example":"Heavy pollution from industry in northern regions is one cause of diseases that affect breathing."},{"head":"\u003cstrong>sustainable\u003c/strong> /səˈsteɪnəbl/ (adjective; slovo k tématu, B2)","gloss":"udržitelný","example":"Sustainable farming keeps the soil healthy for future generations."},{"head":"\u003cstrong>waste sorting\u003c/strong> [U; B1 + A2]","gloss":"třídění odpadu","example":"Effective waste sorting allows towns and villages to use valuable materials again."}],"answer":["Protecting the environment is one of the most important topics that our generation discusses. We can feel the effects of \u003cstrong>climate change\u003c/strong> and \u003cstrong>global warming\u003c/strong> in our everyday lives. In the Czech Republic, summers are getting hotter and hotter, and there are longer periods with little or no rain. Sometimes very bad storms cause a sudden \u003cstrong>flood\u003c/strong>.","Our use of resources is at the centre of these problems. For decades, industry and transport have depended heavily on burning coal, oil and gas. This puts huge amounts of \u003cstrong>greenhouse gases\u003c/strong> into the atmosphere. People are also destroying forests all over the world. This puts the places where wild animals live in danger. Many \u003cstrong>endangered\u003c/strong> kinds of animals and plants are very near to disappearing for ever.","Real progress begins when we slowly move from dirty energy to \u003cstrong>renewable energy\u003c/strong>, for example \u003cstrong>solar panels\u003c/strong>. In South Bohemia, secondary school students think \u003cstrong>waste sorting\u003c/strong> is very important. We can take public transport instead of driving, \u003cstrong>recycle\u003c/strong>, use less plastic that is used only once and \u003cstrong>save energy\u003c/strong>. This way, we can make our personal \u003cstrong>carbon footprint\u003c/strong> smaller. A more \u003cstrong>sustainable\u003c/strong> lifestyle is about practical steps that keep the planet healthy for future generations."],"questions":[{"cat":"Popis","text":"What evidence of climate change and environmental problems can we see in the Czech Republic? \u003cem>(in everyday life)\u003c/em>"},{"cat":"Srovnání","text":"How would you compare energy from the sun and wind with coal, oil and gas?"},{"cat":"Osobní přístup","text":"How do you and your family help to protect the environment in your daily life?"},{"cat":"Názor","text":"Why do some developing countries find it difficult to change quickly to clean renewable energy? \u003cem>(from coal, oil and gas)\u003c/em>"},{"cat":"Popis","text":"What happens to the waste from recycling bins in our towns after it is collected? \u003cem>(waste from our homes)\u003c/em>"},{"cat":"Hypotéza","text":"If the government made all public transport completely free for everyone, what would happen? \u003cem>(benefits for the environment, problems for the economy)\u003c/em>"},{"cat":"Názor","text":"How much responsibility do ordinary people have for protecting the climate? \u003cem>(and how much big companies in industry have)\u003c/em>"}],"phrases":[{"head":"\u003cstrong>When we talk about environmental issues,...\u003c/strong>","gloss":"Když mluvíme o ekologických otázkách,...","note":"uvedení tématu"},{"head":"\u003cstrong>The biggest danger to the environment that we face today is...\u003c/strong>","gloss":"Největším nebezpečím pro životní prostředí, kterému dnes čelíme, je...","note":"pojmenování priority"},{"head":"\u003cstrong>Small everyday changes can make a big difference, such as...\u003c/strong>","gloss":"Malé každodenní změny mohou mít velký dopad, jako například...","note":"praktický přístup"},{"head":"\u003cstrong>We need to find a balance between modern living and...\u003c/strong>","gloss":"Musíme najít rovnováhu mezi moderním způsobem života a...","note":"vyvážení zájmů"},{"head":"\u003cstrong>From my personal point of view,...\u003c/strong>","gloss":"Z mého osobního pohledu...","note":"vyjádření postoje"},{"head":"\u003cstrong>It is clear that...\u003c/strong>","gloss":"Je jasné, že...","note":"přiznání faktu"},{"head":"\u003cstrong>In conclusion, protecting the environment is about...\u003c/strong>","gloss":"Závěrem: ochrana životního prostředí je o...","note":"závěrečné shrnutí"}]},"codes":["SSO 25"],"groups":["sso"],"rank":{"sso":50,"all":50}},{"file":"tema-c2b-describing-accommodation.md","title":"Describing accommodation","label":"Navrhl AI (Hermes, gpt-6.1-terra), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu.","vocab":[{"head":"\u003cstrong>room layout\u003c/strong> (layout /ˈleɪaʊt/)","gloss":"uspořádání pokoje","example":"The room layout leaves enough space for a suitcase."},{"head":"\u003cstrong>en-suite bathroom\u003c/strong> (en /ɪn/; suite /swiːt/)","gloss":"vlastní koupelna přístupná z pokoje","example":"The double room has an en-suite bathroom."},{"head":"\u003cstrong>twin beds\u003c/strong>","gloss":"dvě oddělená jednolůžka","example":"The friends asked for twin beds."},{"head":"\u003cstrong>blackout curtains\u003c/strong> (blackout /ˈblækaʊt/)","gloss":"zatemňovací závěsy","example":"Blackout curtains keep the morning light out."},{"head":"\u003cstrong>soundproofing\u003c/strong>","gloss":"zvuková izolace","example":"Good soundproofing makes a room quieter."},{"head":"\u003cstrong>air conditioning\u003c/strong> /ˈeə kəndɪʃənɪŋ/ AmE /ˈer kəndɪʃənɪŋ/","gloss":"klimatizace","example":"The air conditioning keeps the room cool."},{"head":"\u003cstrong>storage space\u003c/strong> (storage /ˈstɔːrɪdʒ/)","gloss":"úložný prostor","example":"There is enough storage space for our clothes."},{"head":"\u003cstrong>bedside table\u003c/strong> /ˌbedsaɪd ˈteɪbl/","gloss":"noční stolek","example":"I put my glasses on the bedside table."},{"head":"\u003cstrong>kettle\u003c/strong> /ˈketl/","gloss":"rychlovarná konvice","example":"The kettle is next to the cups."},{"head":"\u003cstrong>power socket\u003c/strong> (socket /ˈsɒkɪt/ AmE /ˈsɑːkɪt/)","gloss":"elektrická zásuvka","example":"There is a power socket near the bed."},{"head":"\u003cstrong>step-free access\u003c/strong>","gloss":"bezbariérový přístup bez schodů","example":"The building offers step-free access from the street."},{"head":"\u003cstrong>walk-in shower\u003c/strong>","gloss":"sprchový kout bez vysoké vaničky","example":"The bathroom has a walk-in shower."},{"head":"\u003cstrong>sea view\u003c/strong>","gloss":"výhled na moře","example":"The room has a sea view."},{"head":"\u003cstrong>courtyard\u003c/strong> /ˈkɔːtjɑːd/ AmE /ˈkɔːrtjɑːrd/","gloss":"vnitřní dvůr","example":"The windows overlook a quiet courtyard."},{"head":"\u003cstrong>overlooking\u003c/strong>","gloss":"s výhledem na","example":"The hotel has rooms overlooking the river."},{"head":"\u003cstrong>compact\u003c/strong> /kəmˈpækt/","gloss":"malý a účelně uspořádaný","example":"The compact room is suitable for one person."},{"head":"\u003cstrong>well-lit\u003c/strong> (lit /lɪt/)","gloss":"dobře osvětlený","example":"The desk is well-lit during the day."},{"head":"\u003cstrong>spotless\u003c/strong> /ˈspɒtləs/ AmE /ˈspɑːtləs/","gloss":"bezvadně čistý","example":"The bathroom was spotless on arrival."},{"head":"\u003cstrong>worn\u003c/strong> /wɔːn/ AmE /wɔːrn/","gloss":"opotřebovaný","example":"The carpet looks worn near the door."},{"head":"\u003cstrong>face a street\u003c/strong>","gloss":"směřovat do ulice","example":"Some rooms face a busy street."},{"head":"\u003cstrong>adjoining rooms\u003c/strong> (adjoining /əˈdʒɔɪnɪŋ/)","gloss":"sousedící pokoje; nemusí mít vnitřní spojovací dveře (ty označuje \u003cem>connecting rooms\u003c/em>)","example":"The family requested adjoining rooms."}],"answer":["When I describe accommodation to a guest, I try to be clear rather than simply calling it comfortable. People have different needs, so a useful description should cover the location, the space and any limitations. I would start by explaining whether the property has rooms \u003cstrong>overlooking\u003c/strong> the town and whether its entrance has \u003cstrong>step-free access\u003c/strong>. If it does not, I would say so honestly and offer to check alternatives.","Inside, I would describe the \u003cstrong>room layout\u003c/strong> and the sleeping arrangements. For example, two friends may prefer \u003cstrong>twin beds\u003c/strong>, while a family might ask for \u003cstrong>adjoining rooms\u003c/strong>. I would mention an \u003cstrong>en-suite bathroom\u003c/strong>, a \u003cstrong>walk-in shower\u003c/strong> and the amount of \u003cstrong>storage space\u003c/strong>. A desk, a \u003cstrong>power socket\u003c/strong> near the bed and a \u003cstrong>kettle\u003c/strong> can also make a stay easier. Instead of promising that every room is spacious, I would explain if a room is quite compact.","The view and the surroundings matter too. A guest might choose a sea view, but another person may prefer a window looking onto a quiet courtyard. If the room faces a busy street, I would mention it and explain what I know about the soundproofing. Photographs can help, but I would not use an old picture that hides worn furniture.","As a guest, I value a spotless bathroom and a well-lit place to work. My ideal room would also have blackout curtains and adjustable air conditioning. Overall, an accurate description helps people decide whether a place suits them and prevents disappointment when they arrive."],"answer_info":"","questions":[{"cat":"","text":"What details would you include when describing a room to a guest?"},{"cat":"","text":"How would you compare a room facing a street with one overlooking a courtyard?"},{"cat":"","text":"What features matter most to you when you choose accommodation, and why?"},{"cat":"","text":"How would you explain that a room is smaller than it looks in a photograph?"},{"cat":"","text":"What information would a guest with limited mobility need before arrival?"},{"cat":"","text":"How would you respond if a guest expected a different view?"},{"cat":"","text":"What would you change in a poorly designed room?"}],"phrases":[{"head":"\u003cstrong>The room is located...\u003c/strong>","gloss":"Pokoj se nachází...","note":""},{"head":"\u003cstrong>It offers a view of...\u003c/strong>","gloss":"Nabízí výhled na...","note":""},{"head":"\u003cstrong>One useful feature is...\u003c/strong>","gloss":"Jedním užitečným prvkem je...","note":""},{"head":"\u003cstrong>Please note that...\u003c/strong>","gloss":"Upozorňujeme, že...","note":""},{"head":"\u003cstrong>It may suit guests who...\u003c/strong>","gloss":"Může vyhovovat hostům, kteří...","note":""},{"head":"\u003cstrong>Compared with the other room...\u003c/strong>","gloss":"Ve srovnání s druhým pokojem...","note":""},{"head":"\u003cstrong>What matters most to me is...\u003c/strong>","gloss":"Pro mě je nejdůležitější...","note":""}],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>bathroom that is part of the room\u003c/strong> (noun phrase; A1)","gloss":"vlastní koupelna přístupná z pokoje (\u003cem>en-suite bathroom\u003c/em>)","example":"The double room has a bathroom that is part of the room."},{"head":"\u003cstrong>two single beds\u003c/strong> (noun phrase; A1 + A2 + A1)","gloss":"dvě oddělená jednolůžka","example":"The friends asked for two single beds."},{"head":"\u003cstrong>air conditioning\u003c/strong> /ˈeə kəndɪʃənɪŋ/ AmE /ˈer kəndɪʃənɪŋ/ [U; slovo k tématu, B2]","gloss":"klimatizace","example":"The air conditioning keeps the room cool."},{"head":"\u003cstrong>table next to the bed\u003c/strong> (noun phrase; A1)","gloss":"noční stolek","example":"I put my glasses on the table next to the bed."},{"head":"\u003cstrong>kettle\u003c/strong> /ˈketl/ [C; B1]","gloss":"rychlovarná konvice","example":"The kettle is next to the cups."},{"head":"\u003cstrong>step-free access\u003c/strong> (noun phrase; slovo k tématu, bez úrovně)","gloss":"bezbariérový přístup bez schodů","example":"The building offers step-free access from the street."},{"head":"\u003cstrong>sea view\u003c/strong> (noun phrase; A1 + A2)","gloss":"výhled na moře","example":"The room has a sea view."},{"head":"\u003cstrong>courtyard\u003c/strong> /ˈkɔːtjɑːd/ AmE /ˈkɔːrtjɑːrd/ [C; slovo k tématu, C1]","gloss":"vnitřní dvůr","example":"The windows have a view of a quiet courtyard."},{"head":"\u003cstrong>with a view of\u003c/strong> (phrase; A1 + A2 + A1)","gloss":"s výhledem na","example":"The hotel has rooms with a view of the river."},{"head":"\u003cstrong>good light\u003c/strong> (noun phrase; A1 + A1)","gloss":"dobré osvětlení (\u003cem>with good light\u003c/em> = dobře osvětlený)","example":"The desk has good light during the day."},{"head":"\u003cstrong>completely clean\u003c/strong> (phrase; A2 + A1)","gloss":"bezvadně čistý","example":"The bathroom was completely clean on arrival."},{"head":"\u003cstrong>face a street\u003c/strong> (phrase; B1 + A1 + A1)","gloss":"směřovat do ulice","example":"Some rooms face a busy street."},{"head":"\u003cstrong>rooms next to each other\u003c/strong> (noun phrase; A1)","gloss":"sousedící pokoje; nemusí mít vnitřní spojovací dveře (ty označuje \u003cem>connecting rooms\u003c/em>)","example":"The family asked for rooms next to each other."}],"answer":["When I describe accommodation to a guest, I try to be clear rather than simply calling it comfortable. I would start by explaining whether the building has rooms \u003cstrong>with a view of\u003c/strong> the town. I would also say whether its entrance has \u003cstrong>step-free access\u003c/strong>. If it does not, I would say so honestly and offer to check alternatives.","Inside, I would describe how the room is arranged and what beds there are. For example, two friends may prefer \u003cstrong>two single beds\u003c/strong>, while a family might ask for \u003cstrong>rooms next to each other\u003c/strong>. I would mention if there is a \u003cstrong>bathroom that is part o
