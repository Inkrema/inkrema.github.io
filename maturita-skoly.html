f the room\u003c/strong>. Instead of promising that every room is big, I would explain if a room is quite small.","A guest might choose a \u003cstrong>sea view\u003c/strong>, while others may prefer a window \u003cstrong>with a view of\u003c/strong> a quiet \u003cstrong>courtyard\u003c/strong>. If the room \u003cstrong>faces a busy street\u003c/strong>, I would mention it.","As a guest, I think a \u003cstrong>completely clean\u003c/strong> bathroom and a place with \u003cstrong>good light\u003c/strong> for working are important. My ideal room would also have \u003cstrong>air conditioning\u003c/strong> that I can control. In conclusion, an exact description helps people decide whether a place suits them."],"questions":[{"cat":"","text":"What details would you include when you describe a room to a guest?"},{"cat":"","text":"How is a room that faces a street different from one that faces a courtyard?"},{"cat":"","text":"What features matter most to you when you choose accommodation? \u003cem>(your reasons)\u003c/em>"},{"cat":"","text":"How would you explain that a room is smaller than it looks in a photograph?"},{"cat":"","text":"What information would a guest who cannot move easily need before arrival?"},{"cat":"","text":"How would you respond if a guest expected a different view?"},{"cat":"","text":"What would you change in a badly designed room?"}],"phrases":[{"head":"\u003cstrong>The room is located...\u003c/strong>","gloss":"Pokoj se nachází...","note":""},{"head":"\u003cstrong>It offers a view of...\u003c/strong>","gloss":"Nabízí výhled na...","note":""},{"head":"\u003cstrong>One useful feature is...\u003c/strong>","gloss":"Jedním užitečným prvkem je...","note":""},{"head":"\u003cstrong>Please note that...\u003c/strong>","gloss":"Upozorňujeme, že...","note":""},{"head":"\u003cstrong>It may suit guests who...\u003c/strong>","gloss":"Může vyhovovat hostům, kteří...","note":""},{"head":"\u003cstrong>If we compare it with the other room,...\u003c/strong>","gloss":"Když ho porovnáme s druhým pokojem,...","note":""},{"head":"\u003cstrong>The most important thing for me is...\u003c/strong>","gloss":"Pro mě je nejdůležitější...","note":""}]},"codes":["CR 2b"],"groups":["cr"],"rank":{"cr":5,"all":5.5}},{"file":"tema-s22-cr-history-people.md","title":"The CR – history and people","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu.","vocab":[{"head":"\u003cstrong>reign\u003c/strong> /reɪn/ [C]","gloss":"panování, vláda","example":"During the glorious reign of Charles IV in the fourteenth century, Prague flourished as the cultural capital of the Holy Roman Empire."},{"head":"\u003cstrong>patron saint\u003c/strong> /ˌpeɪtrən ˈseɪnt/ [C]","gloss":"svatý ochránce, zemský patron (svatý Václav byl historicky kníže – \u003cem>Duke of Bohemia\u003c/em>, v britské koledě J. M. Neala z roku 1853 folklórně označovaný jako \u003cem>Good King Wenceslas\u003c/em>)","example":"Saint Wenceslas is venerated as the principal patron saint of the Czech nation."},{"head":"\u003cstrong>Holy Roman Emperor\u003c/strong> (holy /ˈhəʊli/; roman /ˈrəʊmən/; emperor /ˈempərə(r)/ AmE /ˈempərər/) [C]","gloss":"císař Svaté říše římské","example":"Charles IV served as both King of Bohemia and Holy Roman Emperor, founding Charles University in 1348."},{"head":"\u003cstrong>Hussite Wars\u003c/strong> [proper noun, plural]","gloss":"husitské války (nikoli pouhé lokální povstání – \u003cem>uprising\u003c/em>)","example":"The Hussite Wars in the fifteenth century were driven by religious reform and resistance to papal authority."},{"head":"\u003cstrong>national revival\u003c/strong> (revival /rɪˈvaɪvl/) [proper noun / U]","gloss":"národní obrození","example":"In the nineteenth century, scholars and writers led the Czech National Revival to revive our language and culture."},{"head":"\u003cstrong>founder\u003c/strong> /ˈfaʊndə/ AmE /ˈfaʊndər/ [C]","gloss":"zakladatel","example":"Tomáš Garrigue Masaryk is revered as the philosophical and political founder of independent Czechoslovakia in 1918."},{"head":"\u003cstrong>milestone\u003c/strong> /ˈmaɪlstəʊn/ AmE /ˈmaɪlstoʊn/ [C]","gloss":"historický milník","example":"The proclamation of Czechoslovak independence on October 28, 1918, was a monumental milestone in our history."},{"head":"\u003cstrong>occupation\u003c/strong> /ˌɒkjuˈpeɪʃn/ AmE /ˌɑːkjuˈpeɪʃn/ [C/U]","gloss":"okupace, vojenské obsazení (na úrovni B1 také běžně: zaměstnání, povolání)","example":"The Nazi occupation during the Second World War brought immense suffering and loss of life to the Czech lands."},{"head":"\u003cstrong>totalitarian rule\u003c/strong> (totalitarian /təʊˌtæləˈteəriən/ AmE /təʊˌtæləˈteriən/) [U]","gloss":"totalitní vláda","example":"More than four decades of Communist totalitarian rule restricted basic freedoms and persecuted political critics."},{"head":"\u003cstrong>invasion\u003c/strong> /ɪnˈveɪʒn/ [C]","gloss":"invaze, vojenský vpád","example":"In August 1968, the Soviet-led Warsaw Pact invasion violently crushed the democratic hopes of the Prague Spring."},{"head":"\u003cstrong>dissident\u003c/strong> /ˈdɪsɪdənt/ [C]","gloss":"disident, odpůrce režimu","example":"Playwright and dissident Václav Havel bravely spoke out against state censorship and human rights abuses."},{"head":"\u003cstrong>Velvet Revolution\u003c/strong> (velvet /ˈvelvɪt/; revolution /ˌrevəˈluːʃn/) [proper noun]","gloss":"sametová revoluce (listopad 1989)","example":"The peaceful student demonstrations of the Velvet Revolution in November 1989 brought about the fall of Communism."},{"head":"\u003cstrong>peaceful transition\u003c/strong> (transition /trænˈzɪʃn/) [C]","gloss":"mírový přechod","example":"The Velvet Revolution ensured a peaceful transition from authoritarian rule to democracy without bloodshed."},{"head":"\u003cstrong>dissolution\u003c/strong> /ˌdɪsəˈluːʃn/ [U]","gloss":"rozpuštění, zánik, rozpad (státu)","example":"The peaceful dissolution of Czechoslovakia on January 1, 1993, is commonly known as the Velvet Divorce."},{"head":"\u003cstrong>sovereignty\u003c/strong> /ˈsɒvrənti/ AmE /ˈsɑːvrənti/ [U]","gloss":"suverenita, státní svrchovanost","example":"Joining NATO and the European Union cemented the democratic sovereignty and security of the modern Czech Republic."},{"head":"\u003cstrong>heritage\u003c/strong> /ˈherɪtɪdʒ/ [U]","gloss":"kulturní a historické dědictví","example":"Czechs take immense pride in their musical heritage, from Bedřich Smetana to Antonín Dvořák."},{"head":"\u003cstrong>sense of humour\u003c/strong> (humour /ˈhjuːmə(r)/ AmE /ˈhjuːmər/) [U]","gloss":"smysl pro humor","example":"Czech people are renowned for their dry, self-deprecating sense of humour, often using irony to cope with adversity."},{"head":"\u003cstrong>hospitality\u003c/strong> /ˌhɒspɪˈtæləti/ AmE /ˌhɑːspɪˈtæləti/ [U]","gloss":"pohostinnost","example":"Foreign tourists frequently praise the warm hospitality they encounter in rural guesthouses and wineries."},{"head":"\u003cstrong>weekend cottage\u003c/strong> [C]","gloss":"víkendová chata, chalupa (české chataření se vyjadřuje slovesně, např. \u003cem>going to the cottage\u003c/em> nebo \u003cem>spending weekends at a cottage\u003c/em>)","example":"Many Czech families escape the busy city to relax at a cosy weekend cottage in the countryside."},{"head":"\u003cstrong>persecute\u003c/strong> /ˈpɜːsɪkjuːt/ AmE /ˈpɜːrsɪkjuːt/ (verb)","gloss":"politicky nebo nábožensky pronásledovat (POZOR na záměnu s \u003cem>prosecute\u003c/em> = soudně stíhat, obžalovat)","example":"The Communist secret police regularly persecuted independent thinkers and religious believers."},{"head":"\u003cstrong>oppression\u003c/strong> /əˈpreʃn/ [U]","gloss":"útlak, poroba","example":"Generations of Czechs demonstrated tremendous resilience in the face of foreign oppression."},{"head":"\u003cstrong>democracy\u003c/strong> /dɪˈmɒkrəsi/ AmE /dɪˈmɑːkrəsi/ [C/U]","gloss":"demokracie (jako systém [U], jako demokratický stát [C])","example":"Preserving a vibrant democracy requires active civic participation and critical thinking."}],"answer":["Czech history is a fascinating story of struggles for independence, golden eras, and cultural resilience in the heart of Europe. A famous high point came in the fourteenth century under King of Bohemia and \u003cstrong>Holy Roman Emperor\u003c/strong> Charles IV. During his \u003cstrong>reign\u003c/strong>, Prague blossomed with the founding of Charles University in 1348 and the construction of Charles Bridge. Centuries later, after surviving Habsburg rule and the cultural renewal of the \u003cstrong>National Revival\u003c/strong>, our nation achieved full independence in 1918. Led by our respected \u003cstrong>founder\u003c/strong> and first president, Tomáš Garrigue Masaryk, the First Czechoslovak Republic became a thriving \u003cstrong>democracy\u003c/strong> in Central Europe.","However, the twentieth century also brought dark periods of foreign \u003cstrong>oppression\u003c/strong>. The devastating Nazi \u003cstrong>occupation\u003c/strong> during the Second World War was followed by over forty years of Communist \u003cstrong>totalitarian rule\u003c/strong>. When the reformist Prague Spring of 1968 offered hope of change, it was crushed by a foreign Warsaw Pact \u003cstrong>invasion\u003c/strong>. Despite decades of persecution, courageous \u003cstrong>dissidents\u003c/strong> like Václav Havel refused to remain silent. In November 1989, student protests sparked the \u003cstrong>Velvet Revolution\u003c/strong>, bringing a swift and \u003cstrong>peaceful transition\u003c/strong> back to freedom. Shortly afterwards, on January 1, 1993, Czechoslovakia underwent a peaceful \u003cstrong>dissolution\u003c/strong>, creating the modern Czech Republic.","Today, Czech people are shaped by this rich history. We are known for our dry, ironic \u003cstrong>sense of humour\u003c/strong>, our modesty, and our love for spending weekends in nature at a family \u003cstrong>weekend cottage\u003c/strong>. We take pride in our architectural and musical \u003cstrong>heritage\u003c/strong>, cherishing our hard-won freedom in a peaceful Europe."],"answer_info":"","questions":[{"cat":"Popis","text":"What major achievements make Charles IV one of the most celebrated monarchs in Czech history?"},{"cat":"Příčiny a souvislosti","text":"How did Tomáš Garrigue Masaryk contribute to the founding of independent Czechoslovakia in 1918?"},{"cat":"Význam","text":"What were the main consequences of the 1968 Warsaw Pact invasion for Czechoslovak society?"},{"cat":"Popis","text":"Why was the revolution of November 1989 named the \"Velvet Revolution\"?"},{"cat":"Názor","text":"What character traits and cultural habits do you consider typical of Czech people today?"},{"cat":"Srovnání","text":"How did the peaceful \"Velvet Divorce\" of 1993 compare to the violent conflicts accompanying the breakup of other states in the 1990s?"},{"cat":"Hypotéza","text":"If Britain and France had not signed the Munich Agreement with Hitler in September 1938, how might the course of European history have differed?"}],"phrases":[{"head":"\u003cstrong>When we delve into Czech history,...\u003c/strong>","gloss":"Když se ponoříme do české historie,...","note":"historický úvod"},{"head":"\u003cstrong>A defining milestone in our national journey was...\u003c/strong>","gloss":"Zásadním milníkem v naší národní cestě bylo...","note":"zdůraznění významu"},{"head":"\u003cstrong>Despite facing decades of oppression, our people...\u003c/strong>","gloss":"Přestože naši lidé čelili desetiletím útlaku,...","note":"vyzdvižení odolnosti"},{"head":"\u003cstrong>What stands out about this period is...\u003c/strong>","gloss":"To, co v tomto období vystupuje do popředí, je...","note":"upozornění na klíčový rys"},{"head":"\u003cstrong>In the eyes of modern Czechs,...\u003c/strong>","gloss":"V očích dnešních Čechů...","note":"pohled současníků"},{"head":"\u003cstrong>It clearly proves the resilience of our nation...\u003c/strong>","gloss":"Jasně to dokazuje houževnatost našeho národa...","note":"vyhodnocení"},{"head":"\u003cstrong>To summarize the Czech national spirit,...\u003c/strong>","gloss":"Abych shrnul českého národního ducha,...","note":"závěrečné shrnutí"}],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>Holy Roman Emperor\u003c/strong> (holy /ˈhəʊli/; roman /ˈrəʊmən/; emperor /ˈempərə(r)/ AmE /ˈempərər/) [proper noun; vlastní jméno]","gloss":"císař Svaté říše římské","example":"Charles IV was both King of Bohemia and Holy Roman Emperor, and he set up Charles University in 1348."},{"head":"\u003cstrong>the Hussite Wars\u003c/strong> [proper noun, plural; vlastní jméno]","gloss":"husitské války (nikoli pouhé lokální povstání – \u003cem>uprising\u003c/em>)","example":"The Hussite Wars of the fifteenth century were about religious change."},{"head":"\u003cstrong>the National Revival\u003c/strong> (revival /rɪˈvaɪvl/) [proper noun; vlastní jméno]","gloss":"národní obrození","example":"In the nineteenth century, writers led the Czech National Revival to make our language and culture strong again."},{"head":"\u003cstrong>Charles University\u003c/strong> [proper noun; vlastní jméno]","gloss":"Univerzita Karlova","example":"Charles University was set up in 1348."},{"head":"\u003cstrong>set up\u003c/strong> (phrasal verb; B1)","gloss":"založit, zřídit (stát, univerzitu)","example":"Masaryk is respected as the man who set up independent Czechoslovakia."},{"head":"\u003cstrong>important event\u003c/strong> (noun phrase; A1 + A1)","gloss":"důležitá událost, historický milník","example":"October 28, 1918, when Czechoslovakia became independent, was a very important event."},{"head":"\u003cstrong>occupation\u003c/strong> /ˌɒkjuˈpeɪʃn/ AmE /ˌɑːkjuˈpeɪʃn/ [C/U; slovo k tématu, C1]","gloss":"okupace, vojenské obsazení (jiný význam: zaměstnání, povolání)","example":"During the occupation by Hitler's Germany, many people in the Czech lands suffered and died."},{"head":"\u003cstrong>the Second World War\u003c/strong> [proper noun; vlastní jméno]","gloss":"druhá světová válka","example":"Many people in the Czech lands died during the Second World War."},{"head":"\u003cstrong>complete control\u003c/strong> (noun phrase; A1 + A2)","gloss":"úplná moc, úplná kontrola (o totalitní vládě)","example":"For over forty years, the Communist Party had complete control over people."},{"head":"\u003cstrong>the Communist Party\u003c/strong> [proper noun; vlastní jméno]","gloss":"komunistická strana (KSČ)","example":"The Communist Party ruled for over forty years."},{"head":"\u003cstrong>Warsaw Pact\u003c/strong> [proper noun; vlastní jméno]","gloss":"Varšavská smlouva (vojenské spojenectví vedené Sovětským svazem)","example":"The Soviet Union led the Warsaw Pact armies in August 1968."},{"head":"\u003cstrong>the Prague Spring\u003c/strong> [proper noun; vlastní jméno]","gloss":"pražské jaro (1968)","example":"The Prague Spring of 1968 gave people hope of change."},{"head":"\u003cstrong>invasion\u003c/strong> /ɪnˈveɪʒn/ [C; slovo k tématu, B2]","gloss":"invaze, vojenský vpád","example":"In August 1968, the Warsaw Pact invasion ended the Prague Spring's hopes."},{"head":"\u003cstrong>dissident\u003c/strong> /ˈdɪsɪdənt/ [C; slovo k tématu, C2]","gloss":"disident, odpůrce režimu","example":"The dissident Václav Havel bravely said in public what he thought."},{"head":"\u003cstrong>the Velvet Revolution\u003c/strong> (velvet /ˈvelvɪt/; revolution /ˌrevəˈluːʃn/) [proper noun; vlastní jméno]","gloss":"sametová revoluce (listopad 1989)","example":"The peaceful student protests of the Velvet Revolution in November 1989 ended the power of the Communist Party."},{"head":"\u003cstrong>peaceful change\u003c/strong> (noun phrase; B1 + A1)","gloss":"mírový přechod, mírová změna","example":"The Velvet Revolution brought a peaceful change, and nobody was killed."},{"head":"\u003cstrong>break up\u003c/strong> (phrasal verb; B1)","gloss":"rozpadnout se, zaniknout (o státu)","example":"The way Czechoslovakia broke up in 1993 is called the Velvet Divorce."},{"head":"\u003cstrong>the Velvet Divorce\u003c/strong> [proper noun; vlastní jméno]","gloss":"sametový rozvod (pokojný zánik Československa)","example":"The Velvet Divorce on January 1, 1993, was peaceful."},{"head":"\u003cstrong>the Munich Agreement\u003c/strong> [proper noun; vlastní jméno]","gloss":"Mnichovská dohoda (září 1938)","example":"Britain and France signed the Munich Agreement with Hitler in September 1938."},{"head":"\u003cstrong>independent\u003c/strong> (adjective; A2)","gloss":"nezávislý, svrchovaný (o státu)","example":"NATO and the EU helped the Czech Republic stay independent and safe."},{"head":"\u003cstrong>sense of humour\u003c/strong> (humour /ˈhjuːmə(r)/ AmE /ˈhjuːmər/) [U; B1]","gloss":"smysl pro humor","example":"Czech people are famous for their sense of humour in difficult times."},{"head":"\u003cstrong>warm welcome\u003c/strong> (noun phrase; B1 + A2)","gloss":"vlídné přijetí (pohostinnost)","example":"Foreign tourists say good things about the warm welcome in the countryside."},{"head":"\u003cstrong>weekend cottage\u003c/strong> [C; A1 + B1]","gloss":"víkendová chata, chalupa (české chataření se vyjadřuje slovesně, např. \u003cem>going to the cottage\u003c/em> nebo \u003cem>spending weekends at a cottage\u003c/em>)","example":"Many Czech families escape the city to relax at a weekend cottage."},{"head":"\u003cstrong>democracy\u003c/strong> /dɪˈmɒkrəsi/ AmE /dɪˈmɑːkrəsi/ [C/U; slovo k tématu, B2]","gloss":"demokracie (jako systém [U], jako demokratický stát [C])","example":"To keep democracy alive, people must take an active part in it."}],"answer":["The fourteenth century, when Charles IV was King of Bohemia and \u003cstrong>Holy Roman Emperor\u003c/strong>, was one of our best periods. \u003cstrong>Charles University\u003c/strong> was \u003cstrong>set up\u003c/strong> in 1348, and people started building Charles Bridge. Centuries later, we survived Habsburg control, and \u003cstrong>the National Revival\u003c/strong> made our culture strong again. In 1918, we became completely \u003cstrong>independent\u003c/strong>. Tomáš Garrigue Masaryk, our respected first president, \u003cstrong>set up\u003c/strong> the First Czechoslovak Republic, a successful \u003cstrong>democracy\u003c/strong>.","However, the twentieth century also brought difficult times. The \u003cstrong>occupation\u003c/strong> by Hitler's Germany during \u003cstrong>the Second World War\u003c/strong> was terrible. Then \u003cstrong>the Communist Party\u003c/strong> had \u003cstrong>complete control\u003c/strong> for over forty years. In 1968, a \u003cstrong>Warsaw Pact\u003c/strong> \u003cstrong>invasion\u003c/strong> ended the hopes of \u003cstrong>the Prague Spring\u003c/strong>. Brave \u003cstrong>dissidents\u003c/strong> like Václav Havel refused to remain silent. In November 1989, student protests started \u003cstrong>the Velvet Revolution\u003c/strong>. It brought a quick and \u003cstrong>peaceful change\u003c/strong>, and we were free again. On January 1, 1993, Czechoslovakia \u003cstrong>broke up\u003c/strong> in a peaceful way, and the modern Czech Republic was created.","We are known for our \u003cstrong>sense of humour\u003c/strong>, and we do not talk much about our successes. We love spending weekends in nature at our family's \u003cstrong>weekend cottage\u003c/strong>. We are proud of our historic buildings and music."],"questions":[{"cat":"Popis","text":"What major achievements make Charles IV one of the most famous rulers in Czech history?"},{"cat":"Příčiny a souvislosti","text":"How did Tomáš Garrigue Masaryk help to set up independent Czechoslovakia in 1918?"},{"cat":"Význam","text":"What were the main consequences of the 1968 Warsaw Pact invasion for Czechoslovak society?"},{"cat":"Popis","text":"Why were the events of November 1989 named the \"Velvet Revolution\"?"},{"cat":"Názor","text":"What qualities and cultural habits do you consider typical of Czech people today?"},{"cat":"Srovnání","text":"How would you compare the 1993 \"Velvet Divorce\" with the way other states broke up? \u003cem>(a peaceful way to break up; violent fighting in other states in the 1990s)\u003c/em>"},{"cat":"Hypotéza","text":"Imagine Britain and France do not sign the Munich Agreement. How might European history change? \u003cem>(the agreement with Hitler in September 1938)\u003c/em>"}],"phrases":[{"head":"\u003cstrong>When we look carefully at Czech history,...\u003c/strong>","gloss":"Když se pozorně podíváme na českou historii,...","note":"historický úvod"},{"head":"\u003cstrong>A very important event in our national history was...\u003c/strong>","gloss":"Velmi důležitou událostí v naší národní historii bylo...","note":"zdůraznění významu"},{"head":"\u003cstrong>Although our people were treated in a cruel and unfair way for decades, they...\u003c/strong>","gloss":"Přestože se s našimi lidmi desítky let zacházelo krutě a nespravedlivě,...","note":"vyzdvižení odolnosti"},{"head":"\u003cstrong>The most obvious feature of this period is...\u003c/strong>","gloss":"Nejzřetelnějším rysem tohoto období je...","note":"upozornění na klíčový rys"},{"head":"\u003cstrong>In the opinion of modern Czechs,...\u003c/strong>","gloss":"Podle názoru dnešních Čechů...","note":"pohled současníků"},{"head":"\u003cstrong>It clearly proves that our nation stays strong in difficult times...\u003c/strong>","gloss":"Jasně to dokazuje, že náš národ zůstává silný i v těžkých dobách...","note":"vyhodnocení"},{"head":"\u003cstrong>To summarize what is typical of the Czech nation,...\u003c/strong>","gloss":"Abych shrnul, co je typické pro český národ,...","note":"závěrečné shrnutí"}]},"codes":["CR 3b"],"groups":["cr"],"rank":{"cr":7,"all":7.5}},{"file":"tema-c4b-hotel-types.md","title":"Hotel types","label":"Navrhl AI (Hermes, gpt-6.1-terra), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu.","vocab":[{"head":"\u003cstrong>city hotel\u003c/strong>","gloss":"městský hotel","example":"A city hotel can be useful for a short business trip."},{"head":"\u003cstrong>airport hotel\u003c/strong>","gloss":"hotel u letiště","example":"We chose an airport hotel before an early flight."},{"head":"\u003cstrong>boutique hotel\u003c/strong> (boutique /buːˈtiːk/)","gloss":"menší hotel s osobitým stylem","example":"The boutique hotel has individually designed rooms."},{"head":"\u003cstrong>chain hotel\u003c/strong>","gloss":"hotel patřící do řetězce","example":"A chain hotel may follow a common brand style."},{"head":"\u003cstrong>independent hotel\u003c/strong>","gloss":"nezávislý hotel","example":"An independent hotel can create its own character."},{"head":"\u003cstrong>resort\u003c/strong> /rɪˈzɔːt/ AmE /rɪˈzɔːrt/","gloss":"rekreační komplex","example":"The resort has a range of leisure facilities."},{"head":"\u003cstrong>motel\u003c/strong> /məʊˈtel/","gloss":"motel","example":"A motel can be a convenient stop on a road trip."},{"head":"\u003cstrong>hostel\u003c/strong> /ˈhɒstl/ AmE /ˈhɑːstl/","gloss":"hostel, ubytovna pro cestovatele","example":"The hostel has a shared kitchen."},{"head":"\u003cstrong>dormitory\u003c/strong> /ˈdɔːmətri/ AmE /ˈdɔːrmətɔːri/","gloss":"sdílená ložnice s více lůžky","example":"She booked one bed in a dormitory."},{"head":"\u003cstrong>private room\u003c/strong>","gloss":"soukromý pokoj","example":"A private room gives the couple more privacy."},{"head":"\u003cstrong>bed and breakfast\u003c/strong> /ˌbed ən ˈbrekfəst/","gloss":"ubytování se snídaní, často v menším zařízení","example":"We stayed at a bed and breakfast near the coast."},{"head":"\u003cstrong>self-catering accommodation\u003c/strong> (self /self/; catering /ˈkeɪtərɪŋ/)","gloss":"ubytování s možností vlastního vaření","example":"Self-catering accommodation lets us prepare our meals."},{"head":"\u003cstrong>campsite\u003c/strong> /ˈkæmpsaɪt/","gloss":"kemp","example":"The campsite has a place for our tent."},{"head":"\u003cstrong>pitch\u003c/strong> /pɪtʃ/","gloss":"místo pro stan či karavan v kempu","example":"We found a pitch close to the showers."},{"head":"\u003cstrong>tent\u003c/strong> /tent/","gloss":"stan","example":"The tent is large enough for three people."},{"head":"\u003cstrong>caravan\u003c/strong> /ˈkærəvæn/","gloss":"obytný přívěs","example":"They travelled with a caravan."},{"head":"\u003cstrong>holiday apartment\u003c/strong>","gloss":"rekreační apartmán","example":"The holiday apartment has a small kitchen."},{"head":"\u003cstrong>family-run\u003c/strong>","gloss":"provozovaný rodinou","example":"The family-run guesthouse has a friendly atmosphere."},{"head":"\u003cstrong>overnight stop\u003c/strong> (overnight /ˌəʊvəˈnaɪt/ AmE /ˌəʊvərˈnaɪt/)","gloss":"zastávka s přenocováním","example":"The motel was an overnight stop on our journey."},{"head":"\u003cstrong>privacy\u003c/strong> /ˈprɪvəsi/ AmE /ˈpraɪvəsi/","gloss":"soukromí","example":"A private room offers more privacy than a dormitory."},{"head":"\u003cstrong>occupy\u003c/strong> /ˈɒkjupaɪ/ AmE /ˈɑːkjupaɪ/ (verb + noun; B2)","gloss":"obývat nebo užívat určitý prostor","example":"Four guests occupy the larger room."},{"head":"\u003cstrong>capacity\u003c/strong> /kəˈpæsəti/ [C/U; B2]","gloss":"kapacita, nejvyšší počet osob","example":"The hostel has a capacity of forty guests."},{"head":"\u003cstrong>nearby\u003c/strong> /ˌnɪəˈbaɪ/ AmE /ˌnɪrˈbaɪ/ (adjective; B1)","gloss":"nedaleký","example":"A nearby guesthouse offers an alternative."},{"head":"\u003cstrong>choice\u003c/strong> /tʃɔɪs/ [C/U; B1]","gloss":"výběr","example":"The town offers a choice of places to stay."},{"head":"\u003cstrong>suitable\u003c/strong> /ˈsuːtəbl/ (adjective; B1)","gloss":"vhodný","example":"This hostel is suitable for a school trip."},{"head":"\u003cstrong>provide\u003c/strong> /prəˈvaɪd/ (verb; B1)","gloss":"poskytovat","example":"The guesthouse provides towels for its guests."},{"head":"\u003cstrong>location\u003c/strong> /ləʊˈkeɪʃn/ [C; B1]","gloss":"umístění","example":"The hotel's location is next to the station."},{"head":"\u003cstrong>value\u003c/strong> /ˈvæljuː/ [U; B1]","gloss":"hodnota vzhledem k ceně","example":"The campsite is good value for a short stay."},{"head":"\u003cstrong>flexible\u003c/strong> /ˈfleksəbl/ (adjective; B2)","gloss":"přizpůsobivý","example":"A flexible booking allows guests to change their dates."},{"head":"\u003cstrong>booking\u003c/strong> /ˈbʊkɪŋ/ [C; B1]","gloss":"rezervace","example":"We made a booking at the guesthouse."}],"answer":["There is no single type of accommodation that suits everyone. The best choice depends on the purpose of the trip, the budget and the amount of \u003cstrong>privacy\u003c/strong> a guest wants. As a tourism student, I would begin by asking what the traveller actually needs rather than recommending the most expensive option.","For a short urban trip, a \u003cstrong>city hotel\u003c/strong> may be convenient. An \u003cstrong>airport hotel\u003c/strong> can be useful before an early flight, especially when the traveller does not want a long journey that morning. A \u003cstrong>chain hotel\u003c/strong> belongs to a group with a shared brand, while an \u003cstrong>independent hotel\u003c/strong> is not affiliated with a hotel chain and is independently operated. A \u003cstrong>boutique hotel\u003c/strong> often attracts guests who appreciate a distinctive design. A \u003cstrong>resort\u003c/strong>, on the other hand, brings accommodation and leisure facilities together, although the exact facilities vary.","Budget travellers may choose a \u003cstrong>hostel\u003c/strong> and pay for a bed in a \u003cstrong>dormitory\u003c/strong>. Some hostels also offer a \u003cstrong>private room\u003c/strong>, which can be a good compromise. A bed and breakfast is another option for a guest who likes a smaller place with breakfast included. A family-run guesthouse may appeal to people who enjoy a personal atmosphere; however, the experience depends on the individual business.","For a longer stay, self-catering accommodation such as a holiday apartment lets visitors prepare their own food. People who like the outdoors can take a tent to a campsite and book a pitch. A motel may serve as an overnight stop during a road trip. Personally, I would choose a small guesthouse for a weekend, but I would check the conditions before paying."],"answer_info":"","questions":[{"cat":"","text":"How do different types of accommodation meet different needs?"},{"cat":"","text":"What are the advantages and disadvantages of a hostel dormitory?"},{"cat":"","text":"How would you choose between a guesthouse and a holiday apartment?"},{"cat":"","text":"What type of accommodation would you recommend to a family on a limited budget, and why?"},{"cat":"","text":"How can an independent hotel differ from a chain hotel?"},{"cat":"","text":"What factors would influence your choice for an overnight stop?"},{"cat":"","text":"How might the needs of guests change on a longer stay?"}],"phrases":[{"head":"\u003cstrong>The choice depends on...\u003c/strong>","gloss":"Výběr závisí na...","note":""},{"head":"\u003cstrong>One option would be...\u003c/strong>","gloss":"Jednou z možností by bylo...","note":""},{"head":"\u003cstrong>Unlike a hostel,...\u003c/strong>","gloss":"Na rozdíl od hostelu...","note":""},{"head":"\u003cstrong>This type is suitable for...\u003c/strong>","gloss":"Tento typ se hodí pro...","note":""},{"head":"\u003cstrong>A possible drawback is...\u003c/strong>","gloss":"Možnou nevýhodou je...","note":""},{"head":"\u003cstrong>The facilities vary from place to place.\u003c/strong>","gloss":"Vybavení se liší zařízení od zařízení.","note":""},{"head":"\u003cstrong>I would recommend... because...\u003c/strong>","gloss":"Doporučil bych... protože...","note":""}],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>city hotel\u003c/strong> [C; A1 + A1]","gloss":"městský hotel","example":"A city hotel can be useful for a short business trip."},{"head":"\u003cstrong>airport hotel\u003c/strong> [C; A1 + A1]","gloss":"hotel u letiště","example":"We chose an airport hotel before an early flight."},{"head":"\u003cstrong>small hotel with its own style\u003c/strong> (noun phrase; A1)","gloss":"menší hotel s osobitým stylem (\u003cem>boutique hotel\u003c/em>)","example":"This small hotel with its own style has rooms with individual designs."},{"head":"\u003cstrong>chain hotel\u003c/strong> [C; B1 + A1]","gloss":"hotel patřící do řetězce","example":"A chain hotel may follow a common brand style."},{"head":"\u003cstrong>hotel that is not in a chain\u003c/strong> (noun phrase; A1 + B1)","gloss":"nezávislý hotel (\u003cem>independent hotel\u003c/em>)","example":"Hotels that are not in a chain can create their own character."},{"head":"\u003cstrong>resort\u003c/strong> /rɪˈzɔːt/ AmE /rɪˈzɔːrt/ [C; slovo k tématu, B2]","gloss":"rekreační komplex","example":"The resort has a range of buildings and services for leisure."},{"head":"\u003cstrong>motel\u003c/strong> /məʊˈtel/ [C; slovo k tématu, C1]","gloss":"motel","example":"A motel can be a convenient stop on a road trip."},{"head":"\u003cstrong>hostel\u003c/strong> /ˈhɒstl/ AmE /ˈhɑːstl/ [C; B1]","gloss":"hostel, ubytovna pro cestovatele","example":"The hostel has a shared kitchen."},{"head":"\u003cstrong>shared room\u003c/strong> (noun phrase; A1 + A1)","gloss":"sdílený pokoj, ložnice s více lůžky (v hostelu se říká \u003cem>dormitory\u003c/em>)","example":"She booked one bed in a shared room."},{"head":"\u003cstrong>private room\u003c/strong> [C; B1 + A1]","gloss":"soukromý pokoj","example":"A private room is more private for the couple."},{"head":"\u003cstrong>bed and breakfast\u003c/strong> /ˌbed ən ˈbrekfəst/ [C; slovo k tématu, B2]","gloss":"ubytování se snídaní, často v menším zařízení","example":"We stayed at a bed and breakfast near the coast."},{"head":"\u003cstrong>guest house\u003c/strong> [C; slovo k tématu, C1]","gloss":"penzion, menší ubytovací zařízení","example":"For a weekend, I would choose a small guest house."},{"head":"\u003cstrong>cook your own meals\u003c/strong> (phrase; A1)","gloss":"vařit si sám (ubytování s možností vlastního vaření: \u003cem>self-catering accommodation\u003c/em>)","example":"This accommodation lets us cook our own meals."},{"head":"\u003cstrong>campsite\u003c/strong> /ˈkæmpsaɪt/ [C; B1]","gloss":"kemp","example":"The campsite has a place for our tent."},{"head":"\u003cstrong>place for a tent\u003c/strong> (noun phrase; A1 + A1 + B1)","gloss":"místo pro stan v kempu (\u003cem>pitch\u003c/em>)","example":"We found a place for our tent close to the showers."},{"head":"\u003cstrong>tent\u003c/strong> /tent/ [C; B1]","gloss":"stan","example":"The tent is large enough for three people."},{"head":"\u003cstrong>holiday apartment\u003c/strong> [C; A1 + A1]","gloss":"rekreační apartmán","example":"The holiday apartment has a small kitchen."},{"head":"\u003cstrong>family-run\u003c/strong> (adjective; A1 + B1)","gloss":"provozovaný rodinou","example":"The family-run guest house has a friendly atmosphere."},{"head":"\u003cstrong>stop for one night\u003c/strong> (noun phrase; A1)","gloss":"zastávka s přenocováním","example":"It was a stop for one night on our journey."},{"head":"\u003cstrong>room for\u003c/strong> (phrase; B1)","gloss":"kapacita, místo pro (určitý počet osob)","example":"The hostel has room for forty guests."},{"head":"\u003cstrong>choice\u003c/strong> /tʃɔɪs/ [C/U; A2]","gloss":"výběr","example":"The town offers a choice of places to stay."},{"head":"\u003cstrong>suitable\u003c/strong> /ˈsuːtəbl/ (adjective; B1)","gloss":"vhodný","example":"This hostel is suitable for a school trip."},{"head":"\u003cstrong>provide\u003c/strong> /prəˈvaɪd/ (verb; A2)","gloss":"poskytovat","example":"The guest house provides towels for its guests."},{"head":"\u003cstrong>location\u003c/strong> /ləʊˈkeɪʃn/ [C; B1]","gloss":"umístění","example":"The hotel's location is next to the station."},{"head":"\u003cstrong>value\u003c/strong> /ˈvæljuː/ [U; B1]","gloss":"hodnota vzhledem k ceně","example":"The campsite is good value for a short stay."},{"head":"\u003cstrong>easy to change\u003c/strong> (phrase; A1)","gloss":"flexibilní, přizpůsobivý (o rezervaci)","example":"This reservation is easy to change if guests need different dates."},{"head":"\u003cstrong>reservation\u003c/strong> (noun; B1)","gloss":"rezervace","example":"We made a reservation at the guest house."}],"answer":["The best \u003cstrong>choice\u003c/strong> depends on the purpose of the trip and how much money the guest has. It also depends on how much they want to be away from other people. As a tourism student, I would first ask what the traveller needs.","A \u003cstrong>city hotel\u003c/strong> may be convenient. An \u003cstrong>airport hotel\u003c/strong> can be useful. A \u003cstrong>chain hotel\u003c/strong> belongs to a group with a shared brand. A \u003cstrong>hotel that is not in a chain\u003c/strong> does not. A \u003cstrong>small hotel with its own style\u003c/strong> often attracts guests who appreciate an unusual design. A \u003cstrong>resort\u003c/strong> brings together accommodation, buildings and services for leisure.","Travellers with little money may pay for a bed in a \u003cstrong>shared room\u003c/strong> in a \u003cstrong>hostel\u003c/strong>. A \u003cstrong>bed and breakfast\u003c/strong> is another option for a guest who likes a smaller place. A \u003cstrong>family-run\u003c/strong> \u003cstrong>guest house\u003c/strong> may attract people who enjoy a personal atmosphere.","For a longer stay, a \u003cstrong>holiday apartment\u003c/strong> lets you \u003cstrong>cook your own meals\u003c/strong>. People who like the outdoors can book a \u003cstrong>place for a tent\u003c/strong> at a \u003cstrong>campsite\u003c/strong>. A \u003cstrong>motel\u003c/strong> may be a \u003cstrong>stop for one night\u003c/strong> during a road trip. I would choose a \u003cstrong>guest house\u003c/strong>, but I would check the conditions before paying."],"questions":[{"cat":"","text":"How do different types of accommodation suit different needs?"},{"cat":"","text":"What are the advantages and disadvantages of a shared room in a hostel?"},{"cat":"","text":"How would you choose between a guest house and a holiday apartment?"},{"cat":"","text":"What type of accommodation would you recommend to a family with little money? \u003cem>(your reasons)\u003c/em>"},{"cat":"","text":"How can hotels that are not in a chain be different from chain hotels?"},{"cat":"","text":"What factors would influence your choice of a stop for one night?"},{"cat":"","text":"How might the needs of guests change on a longer stay?"}],"phrases":[{"head":"\u003cstrong>The choice depends on...\u003c/strong>","gloss":"Výběr závisí na...","note":""},{"head":"\u003cstrong>One option would be...\u003c/strong>","gloss":"Jednou z možností by bylo...","note":""},{"head":"\u003cstrong>Unlike a hostel,...\u003c/strong>","gloss":"Na rozdíl od hostelu...","note":""},{"head":"\u003cstrong>This type is suitable for...\u003c/strong>","gloss":"Tento typ se hodí pro...","note":""},{"head":"\u003cstrong>A possible disadvantage is...\u003c/strong>","gloss":"Možnou nevýhodou je...","note":""},{"head":"\u003cstrong>The equipment and services are different from place to place.\u003c/strong>","gloss":"Vybavení a služby se liší zařízení od zařízení.","note":""},{"head":"\u003cstrong>I would recommend... because...\u003c/strong>","gloss":"Doporučil bych... protože...","note":""}]},"codes":["CR 4b"],"groups":["cr"],"rank":{"cr":9,"all":9.5}},{"file":"doplnek-c5a-school-life.md","title":"Doplněk C5a: School life at a tourism and hospitality school","label":"Navrhla AI, schválil učitel (7. 11. 2026).","vocab":[{"head":"\u003cstrong>assignment\u003c/strong> /əˈsaɪnmənt/ (noun [C]; B1)","gloss":"zadaná školní nebo pracovní úloha","example":"Our next assignment is to plan a weekend trip."},{"head":"\u003cstrong>progress\u003c/strong> /ˈprəʊɡres/ AmE /ˈprɑːɡres/ (noun [U]; B1)","gloss":"pokrok, postupné zlepšování","example":"Regular practice helps me make progress in speaking."},{"head":"\u003cstrong>presentation\u003c/strong> /ˌpreznˈteɪʃn/ AmE /ˌpriːznˈteɪʃn/ (noun [C]; B1)","gloss":"prezentace, vystoupení před posluchači","example":"I am preparing a presentation about a holiday route."},{"head":"\u003cstrong>effort\u003c/strong> /ˈefət/ AmE /ˈefərt/ (noun [C or U]; B1)","gloss":"úsilí, námaha potřebná k dosažení něčeho","example":"Learning to explain a difficult idea takes effort."},{"head":"\u003cstrong>practical\u003c/strong> /ˈpræktɪkl/ (adjective; B2)","gloss":"praktický, založený na skutečných činnostech místo samotné teorie","example":"I enjoy practical activities that let me try a new task."},{"head":"\u003cstrong>improvement\u003c/strong> /ɪmˈpruːvmənt/ (noun [C or U]; B1)","gloss":"zlepšení","example":"There has been a clear improvement in my pronunciation."},{"head":"\u003cstrong>encourage\u003c/strong> /ɪnˈkʌrɪdʒ/ AmE /ɪnˈkɜːrɪdʒ/ (verb [T], encourage somebody to do something; B1)","gloss":"povzbudit někoho k něčemu, dodat mu odvahu","example":"My classmates encourage me to speak even when I feel nervous."},{"head":"\u003cstrong>solution\u003c/strong> /səˈluːʃn/ (noun [C], solution to a problem; B1)","gloss":"řešení problému","example":"We discussed a solution to the problem together."}],"answer":["I study at a school focused on tourism and hospitality in České Budějovice. School life is more than preparing for tests. For a classroom \u003cstrong>assignment\u003c/strong>, I might plan a trip or practise welcoming a hotel guest. A short \u003cstrong>presentation\u003c/strong> would help me explain my ideas. I value \u003cstrong>practical\u003c/strong> activities because they show me what I still need to learn. During work experience, I would ask for advice and try to find a \u003cstrong>solution\u003c/strong> to each problem. I hope my classmates will \u003cstrong>encourage\u003c/strong> me. With steady \u003cstrong>effort\u003c/strong>, I want to make \u003cstrong>progress\u003c/strong> and see an \u003cstrong>improvement\u003c/strong> in my communication."],"answer_info":"","questions":[{"cat":"","text":"What does a typical school day in your own programme involve? \u003cem>Nápověda: Skutečný rozvrh, odborné a všeobecné předměty, přestávky a spolužáci.\u003c/em>"},{"cat":"","text":"How would you prepare for work experience in your field, and what would you want to learn? \u003cem>Nápověda: Vyber situaci podle svého oboru; nevydávej modelový příklad za vlastní zážitek.\u003c/em>"},{"cat":"","text":"What would you change about school life to help students learn more effectively? \u003cem>Nápověda: Jeden návrh, jeho přínos a možné nevýhody.\u003c/em>"}],"phrases":[],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>assignment\u003c/strong> /əˈsaɪnmənt/ (noun [C]; B1)","gloss":"zadaná školní nebo pracovní úloha","example":"Our next assignment is to plan a weekend trip."},{"head":"\u003cstrong>progress\u003c/strong> /ˈprəʊɡres/ AmE /ˈprɑːɡres/ (noun [U]; A2)","gloss":"pokrok, postupné zlepšování","example":"Regular practice helps me make progress in speaking."},{"head":"\u003cstrong>presentation\u003c/strong> /ˌpreznˈteɪʃn/ AmE /ˌpriːznˈteɪʃn/ (noun [C]; B1)","gloss":"prezentace, vystoupení před posluchači","example":"I am preparing a presentation about a holiday route."},{"head":"\u003cstrong>effort\u003c/strong> /ˈefət/ AmE /ˈefərt/ (noun [C or U]; B1)","gloss":"úsilí, námaha potřebná k dosažení něčeho","example":"Learning to explain a difficult idea takes effort."},{"head":"\u003cstrong>practical\u003c/strong> /ˈpræktɪkl/ (adjective; B1)","gloss":"praktický, založený na skutečných činnostech místo samotné teorie","example":"I enjoy practical activities that let me try a new task."},{"head":"\u003cstrong>improvement\u003c/strong> /ɪmˈpruːvmənt/ (noun [C or U]; B1)","gloss":"zlepšení","example":"There has been a clear improvement in my pronunciation."},{"head":"\u003cstrong>encourage\u003c/strong> /ɪnˈkʌrɪdʒ/ AmE /ɪnˈkɜːrɪdʒ/ (verb [T], encourage somebody to do something; B1)","gloss":"povzbudit někoho k něčemu, dodat mu odvahu","example":"My classmates encourage me to speak even when I feel nervous."},{"head":"\u003cstrong>solution\u003c/strong> /səˈluːʃn/ (noun [C], solution to a problem; A2)","gloss":"řešení problému","example":"We discussed a solution to the problem together."}],"answer":["I study at a hotel and tourism school in České Budějovice. School life is more than preparing for tests. For an \u003cstrong>assignment\u003c/strong>, I might plan a trip or practise welcoming a hotel guest. For me, \u003cstrong>practical\u003c/strong> activities are important because they show me what I still need to learn. During work experience, I would ask for advice and try to find a \u003cstrong>solution\u003c/strong>. With regular \u003cstrong>effort\u003c/strong>, I want to make \u003cstrong>progress\u003c/strong> and see an \u003cstrong>improvement\u003c/strong> in my communication."],"questions":[{"cat":"","text":"What does a typical school day in your own programme involve? \u003cem>Nápověda: Skutečný rozvrh, odborné a všeobecné předměty, přestávky a spolužáci.\u003c/em>"},{"cat":"","text":"How would you prepare for work experience in your field? \u003cem>Nápověda: Vyber situaci podle svého oboru; nevydávej modelový příklad za vlastní zážitek.\u003c/em>"},{"cat":"","text":"What would you change about school life to help students learn more effectively? \u003cem>Nápověda: Jeden návrh, jeho přínos a možné nevýhody.\u003c/em>"}],"phrases":[]},"codes":["CR 5a"],"groups":["cr"],"rank":{"cr":10,"all":10.5}},{"file":"tema-c6b-hotel-staff.md","title":"Hotel staff","label":"Navrhl AI (Hermes, gpt-6.1-terra, openai-codex), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu.","vocab":[{"head":"\u003cstrong>front desk\u003c/strong> /ˌfrʌnt ˈdesk/ [C, usually singular]","gloss":"recepční pult. \u003cem>A guest asks for directions at the front desk.\u003c/em>","example":""},{"head":"\u003cstrong>receptionist\u003c/strong> /rɪˈsepʃənɪst/ [C]","gloss":"recepční. \u003cem>The receptionist welcomes a family.\u003c/em>","example":""},{"head":"\u003cstrong>concierge\u003c/strong> /ˈkɒnsieəʒ/ AmE /kəʊnˈsjerʒ/ [C]","gloss":"hotelový pracovník pomáhající hostům s informacemi a zařizováním služeb. \u003cem>The concierge suggests a local walk.\u003c/em>","example":""},{"head":"\u003cstrong>housekeeper\u003c/strong> /ˈhaʊskiːpə/ AmE /ˈhaʊskiːpər/ [C]","gloss":"pracovník hotelového úklidu. \u003cem>The housekeeper cleans the room.\u003c/em>","example":""},{"head":"\u003cstrong>porter\u003c/strong> /ˈpɔːtə/ AmE /ˈpɔːrtər/ [C]","gloss":"hotelový nosič zavazadel. \u003cem>The porter helps a guest with a suitcase.\u003c/em>","example":""},{"head":"\u003cstrong>chef\u003c/strong> /ʃef/ [C]","gloss":"profesionální kuchař či šéfkuchař. \u003cem>The chef prepares an evening meal.\u003c/em>","example":""},{"head":"\u003cstrong>waiter\u003c/strong> /ˈweɪtə(r)/ AmE /ˈweɪtər/ [C]","gloss":"číšník. \u003cem>The waiter brings drinks to the table.\u003c/em>","example":""},{"head":"\u003cstrong>bartender\u003c/strong> /ˈbɑːtendə/ AmE /ˈbɑːrtendər/ [C]","gloss":"barman či barmanka. \u003cem>The bartender serves a guest at the bar.\u003c/em>","example":""},{"head":"\u003cstrong>hotel manager\u003c/strong> [C]","gloss":"ředitel či manažer hotelu. \u003cem>The hotel manager speaks to the team.\u003c/em>","example":""},{"head":"\u003cstrong>night shift\u003c/strong> /ˈnaɪt ʃɪft/ [C]","gloss":"noční směna. \u003cem>My sister works a night shift this week.\u003c/em>","example":""},{"head":"\u003cstrong>assistance\u003c/strong> /əˈsɪstəns/ [U; B2]","gloss":"pomoc. \u003cem>Guests can ask the reception team for assistance.\u003c/em>","example":""},{"head":"\u003cstrong>on duty\u003c/strong> (phrase)","gloss":"ve službě. \u003cem>Two receptionists are on duty tonight.\u003c/em>","example":""},{"head":"\u003cstrong>courtesy\u003c/strong> /ˈkɜːtəsi/ AmE /ˈkɜːrtəsi/ [U; B2]","gloss":"zdvořilost. \u003cem>Courtesy helps guests feel welcome.\u003c/em>","example":""},{"head":"\u003cstrong>deal with a complaint\u003c/strong> (verb phrase)","gloss":"řešit stížnost. \u003cem>She deals with a complaint calmly.\u003c/em>","example":""},{"head":"\u003cstrong>pay attention to detail\u003c/strong> (phrase)","gloss":"všímat si detailů. \u003cem>A good housekeeper pays attention to detail.\u003c/em>","example":""},{"head":"\u003cstrong>remain calm\u003c/strong> (phrase)","gloss":"zachovat klid. \u003cem>He remains calm when guests are upset.\u003c/em>","example":""},{"head":"\u003cstrong>discreet\u003c/strong> /dɪˈskriːt/ (adjective)","gloss":"diskrétní. \u003cem>Staff should be discreet about guests' private matters.\u003c/em>","example":""},{"head":"\u003cstrong>punctual\u003c/strong> /ˈpʌŋktʃuəl/ (adjective)","gloss":"dochvilný. \u003cem>She is punctual and arrives on time.\u003c/em>","example":""},{"head":"\u003cstrong>attitude\u003c/strong> /ˈætɪtjuːd/ AmE /ˈætɪtuːd/ [C; B1]","gloss":"přístup či postoj. \u003cem>A positive attitude helps staff deal with problems.\u003c/em>","example":""},{"head":"\u003cstrong>take responsibility for\u003c/strong> (verb phrase + noun)","gloss":"převzít odpovědnost za. \u003cem>He takes responsibility for the evening team.\u003c/em>","example":""},{"head":"\u003cstrong>supervise\u003c/strong> /ˈsuːpəvaɪz/ AmE /ˈsuːpərvaɪz/ (verb + noun; B2)","gloss":"dohlížet na práci či činnost. \u003cem>The manager supervises the reception team.\u003c/em>","example":""},{"head":"\u003cstrong>efficient\u003c/strong> /ɪˈfɪʃnt/ (adjective; B1)","gloss":"výkonný a dobře organizovaný. \u003cem>An efficient team handles arrivals without unnecessary delays.\u003c/em>","example":""},{"head":"\u003cstrong>demanding\u003c/strong> /dɪˈmɑːndɪŋ/ AmE /dɪˈmændɪŋ/ (adjective; B2)","gloss":"náročný. \u003cem>A demanding shift can require patience and energy.\u003c/em>","example":""},{"head":"\u003cstrong>respond\u003c/strong> /rɪˈspɒnd/ AmE /rɪˈspɑːnd/ (verb; B2)","gloss":"reagovat. \u003cem>Staff respond to a guest's request as soon as they can.\u003c/em>","example":""},{"head":"\u003cstrong>productive\u003c/strong> /prəˈdʌktɪv/ (adjective; B2)","gloss":"přinášející dobré výsledky. \u003cem>The team had a productive meeting about guest feedback.\u003c/em>","example":""},{"head":"\u003cstrong>professional\u003c/strong> /prəˈfeʃənl/ (adjective; B1)","gloss":"profesionální, projevující dovednost a pečlivost. \u003cem>Her professional manner reassures the guests.\u003c/em>","example":""},{"head":"\u003cstrong>communicate\u003c/strong> /kəˈmjuːnɪkeɪt/ (verb; B1)","gloss":"sdělovat informace či komunikovat. \u003cem>Staff communicate changes to the next team.\u003c/em>","example":""},{"head":"\u003cstrong>promptly\u003c/strong> /ˈprɒmptli/ AmE /ˈprɑːmptli/ (adverb; B2)","gloss":"neprodleně. \u003cem>The team promptly informs the guest about the delay.\u003c/em>","example":""},{"head":"\u003cstrong>confident\u003c/strong> /ˈkɒnfɪdənt/ AmE /ˈkɑːnfɪdənt/ (adjective; B1)","gloss":"jistý si svými schopnostmi. \u003cem>After some practice, she feels confident at reception.\u003c/em>","example":""},{"head":"\u003cstrong>willing\u003c/strong> /ˈwɪlɪŋ/ (adjective; B1)","gloss":"ochotný něco udělat. \u003cem>Staff are willing to help guests with their luggage.\u003c/em>","example":""}],"answer":["When I imagine working in a hotel, I see a team rather than one person. The \u003cstrong>receptionist\u003c/strong> at the \u003cstrong>front desk\u003c/strong> may be the first person a guest meets. They can answer questions, explain where things are and help when something goes wrong. In a larger hotel, a \u003cstrong>concierge\u003c/strong> might also suggest places to visit or help guests arrange activities.","Other staff members work behind the scenes. A \u003cstrong>housekeeper\u003c/strong> makes sure that rooms are clean and ready. This person needs to \u003cstrong>pay attention to detail\u003c/strong>, because even a small problem can affect a guest's impression. A \u003cstrong>porter\u003c/strong> may help with suitcases, while a \u003cstrong>chef\u003c/strong>, a \u003cstrong>waiter\u003c/strong> and a \u003cstrong>bartender\u003c/strong> work with food and drinks. The hotel manager has a wider view and has to take responsibility for the team.","I think teamwork matters because no one can solve every problem alone. Staff need to be \u003cstrong>punctual\u003c/strong> for their shifts and discreet, especially when guests share private information. They should also remain calm and listen carefully when they deal with a complaint. A polite answer is important, but it is equally important to find someone who can actually help.","Hotel work may involve a night shift or a weekend. A clear rota helps people know when they are on duty. A careful handover also helps the next person understand what still needs doing. Personally, I would like to try reception because I enjoy speaking English. I would probably find difficult complaints stressful at first, but I could learn from more experienced staff."],"answer_info":"","questions":[{"cat":"","text":"What kinds of work need to be done in a hotel?"},{"cat":"","text":"Which hotel job would you like to try, and why?"},{"cat":"","text":"How would you respond to a guest who is upset?"},{"cat":"","text":"What makes a good handover between shifts?"},{"cat":"","text":"How does a receptionist's work differ from a housekeeper's?"},{"cat":"","text":"What would you do if you could not answer a guest's question?"},{"cat":"","text":"How might hotel staff support each other on a busy day?"}],"phrases":[{"head":"\u003cstrong>Different members of staff are responsible for ...\u003c/strong>","gloss":"Různí pracovníci odpovídají za…","note":""},{"head":"\u003cstrong>One important part of the job is ...\u003c/strong>","gloss":"Důležitou součástí práce je…","note":""},{"head":"\u003cstrong>Behind the scenes, ...\u003c/strong>","gloss":"V zákulisí…","note":""},{"head":"\u003cstrong>In my view, a good employee should ...\u003c/strong>","gloss":"Podle mě by dobrý zaměstnanec měl…","note":""},{"head":"\u003cstrong>A difficult situation might arise when ...\u003c/strong>","gloss":"Obtížná situace může nastat, když…","note":""},{"head":"\u003cstrong>I would ask a more experienced colleague to ...\u003c/strong>","gloss":"Požádal/a bych zkušenějšího kolegu, aby…","note":""},{"head":"\u003cstrong>To conclude, the team needs to ...\u003c/strong>","gloss":"Závěrem, tým musí…","note":""}],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>front desk\u003c/strong> /ˌfrʌnt ˈdesk/ [C, usually singular; B1]","gloss":"recepční pult. \u003cem>A guest asks for directions at the front desk.\u003c/em>","example":""},{"head":"\u003cstrong>receptionist\u003c/strong> /rɪˈsepʃənɪst/ [C; A2]","gloss":"recepční. \u003cem>The receptionist welcomes a family.\u003c/em>","example":""},{"head":"\u003cstrong>concierge\u003c/strong> /ˈkɒnsieəʒ/ AmE /kəʊnˈsjerʒ/ [C; slovo k tématu, C2]","gloss":"hotelový pracovník pomáhající hostům s informacemi a zařizováním služeb. \u003cem>The concierge suggests a local walk.\u003c/em>","example":""},{"head":"\u003cstrong>cleaner\u003c/strong> (noun; A2)","gloss":"pracovník úklidu, v hotelu pracovník hotelového úklidu. \u003cem>The cleaner cleans the room.\u003c/em>","example":""},{"head":"\u003cstrong>porter\u003c/strong> /ˈpɔːtə/ AmE /ˈpɔːrtər/ [C; slovo k tématu, C1]","gloss":"hotelový nosič zavazadel. \u003cem>The porter helps a guest with a suitcase.\u003c/em>","example":""},{"head":"\u003cstrong>chef\u003c/strong> /ʃef/ [C; A2]","gloss":"profesionální kuchař či šéfkuchař. \u003cem>The chef prepares an evening meal.\u003c/em>","example":""},{"head":"\u003cstrong>bartender\u003c/strong> /ˈbɑːtendə/ AmE /ˈbɑːrtendər/ [C; slovo k tématu, C2]","gloss":"barman či barmanka. \u003cem>The bartender serves a guest at the bar.\u003c/em>","example":""},{"head":"\u003cstrong>hotel manager\u003c/strong> [C; A1 + A2]","gloss":"ředitel či manažer hotelu. \u003cem>The hotel manager speaks to the team.\u003c/em>","example":""},{"head":"\u003cstrong>shift at night\u003c/strong> (noun phrase; B1 + A1 + A1)","gloss":"noční směna. \u003cem>My sister works a shift at night this week.\u003c/em>","example":""},{"head":"\u003cstrong>polite\u003c/strong> (adjective; A2)","gloss":"zdvořilý. \u003cem>Polite staff help guests feel welcome.\u003c/em>","example":""},{"head":"\u003cstrong>deal with a complaint\u003c/strong> (verb phrase; B1)","gloss":"řešit stížnost. \u003cem>She is calm when she deals with a complaint.\u003c/em>","example":""},{"head":"\u003cstrong>pay attention to detail\u003c/strong> (phrase; B1)","gloss":"všímat si detailů. \u003cem>A good cleaner pays attention to detail.\u003c/em>","example":""},{"head":"\u003cstrong>remain calm\u003c/strong> (phrase; B1)","gloss":"zachovat klid. \u003cem>He remains calm when guests are upset.\u003c/em>","example":""},{"head":"\u003cstrong>on time\u003c/strong> (idiom; A2)","gloss":"včas, dochvilně (\u003cem>be on time\u003c/em> = být dochvilný). \u003cem>She always arrives on time.\u003c/em>","example":""},{"head":"\u003cstrong>attitude\u003c/strong> /ˈætɪtjuːd/ AmE /ˈætɪtuːd/ [C; B1]","gloss":"přístup či postoj. \u003cem>A positive attitude helps staff deal with problems.\u003c/em>","example":""},{"head":"\u003cstrong>take responsibility for\u003c/strong> (verb phrase + noun; B1)","gloss":"převzít odpovědnost za. \u003cem>He takes responsibility for the evening team.\u003c/em>","example":""},{"head":"\u003cstrong>be in charge of\u003c/strong> (verb phrase; B1)","gloss":"mít na starosti, vést. \u003cem>The manager is in charge of the reception team and checks everything.\u003c/em>","example":""},{"head":"\u003cstrong>respond\u003c/strong> /rɪˈspɒnd/ AmE /rɪˈspɑːnd/ (verb; A2)","gloss":"reagovat. \u003cem>Staff respond to a guest's request as soon as they can.\u003c/em>","example":""},{"head":"\u003cstrong>professional\u003c/strong> /prəˈfeʃənl/ (adjective; B1)","gloss":"profesionální, projevující dovednost a pečlivost. \u003cem>Her professional behaviour makes the guests feel less worried.\u003c/em>","example":""},{"head":"\u003cstrong>communicate\u003c/strong> /kəˈmjuːnɪkeɪt/ (verb; A2)","gloss":"sdělovat informace či komunikovat. \u003cem>Staff communicate changes to the next team.\u003c/em>","example":""},{"head":"\u003cstrong>immediately\u003c/strong> (adverb; A2)","gloss":"neprodleně, hned. \u003cem>The team immediately tells the guest about the delay.\u003c/em>","example":""},{"head":"\u003cstrong>confident\u003c/strong> /ˈkɒnfɪdənt/ AmE /ˈkɑːnfɪdənt/ (adjective; B1)","gloss":"jistý si svými schopnostmi. \u003cem>After some practice, she feels confident at reception.\u003c/em>","example":""},{"head":"\u003cstrong>be happy to\u003c/strong> (phrase; A2)","gloss":"být ochotný něco udělat. \u003cem>Staff are happy to help guests with their luggage.\u003c/em>","example":""}],"answer":["When I imagine working in a hotel, I see a team rather than one person. The \u003cstrong>receptionist\u003c/strong> at the \u003cstrong>front desk\u003c/strong> may be the first person that a guest meets. They can answer questions and help when something goes wrong. In a larger hotel, a \u003cstrong>concierge\u003c/strong> might also suggest places to visit or help guests arrange activities.","Other staff members work where guests do not see them. A \u003cstrong>cleaner\u003c/strong> makes sure that rooms are clean and ready. This person needs to \u003cstrong>pay attention to detail\u003c/strong>, because even a small problem can affect a guest's impression. A \u003cstrong>porter\u003c/strong> may help with suitcases, while a \u003cstrong>chef\u003c/strong>, a waiter and a \u003cstrong>bartender\u003c/strong> work with food and drinks. The \u003cstrong>hotel manager\u003c/strong> has to \u003cstrong>take responsibility for\u003c/strong> the team.","I think working together matters because no one can solve every problem alone. Staff need to be \u003cstrong>on time\u003c/strong> for their shifts. They should also \u003cstrong>remain calm\u003c/strong> and listen carefully when they \u003cstrong>deal with a complaint\u003c/strong>.","Hotel work may involve a \u003cstrong>shift at night\u003c/strong> or at the weekend. I would like to try reception because I enjoy speaking English. I would probably find difficult complaints stressful at first, but I could learn from more experienced staff."],"questions":[{"cat":"","text":"What kinds of work need to be done in a hotel?"},{"cat":"","text":"Which hotel job would you like to try? \u003cem>(your reasons)\u003c/em>"},{"cat":"","text":"How would you respond to a guest who is upset?"},{"cat":"","text":"What helps one shift pass its work on to the next?"},{"cat":"","text":"How is a receptionist's work different from a cleaner's?"},{"cat":"","text":"What would you do if you could not answer a guest's question?"},{"cat":"","text":"How might hotel staff support each other on a busy day?"}],"phrases":[{"head":"\u003cstrong>Different members of staff are responsible for ...\u003c/strong>","gloss":"Různí pracovníci odpovídají za…","note":""},{"head":"\u003cstrong>One important part of the job is ...\u003c/strong>","gloss":"Důležitou součástí práce je…","note":""},{"head":"\u003cstrong>Away from the guests, ...\u003c/strong>","gloss":"Mimo dohled hostů…","note":""},{"head":"\u003cstrong>In my view, a good employee should ...\u003c/strong>","gloss":"Podle mě by dobrý zaměstnanec měl…","note":""},{"head":"\u003cstrong>A difficult situation might happen when ...\u003c/strong>","gloss":"Obtížná situace může nastat, když…","note":""},{"head":"\u003cstrong>I would ask a more experienced colleague to ...\u003c/strong>","gloss":"Požádal/a bych zkušenějšího kolegu, aby…","note":""},{"head":"\u003cstrong>To conclude, the team needs to ...\u003c/strong>","gloss":"Závěrem, tým musí…","note":""}]},"codes":["CR 6b"],"groups":["cr"],"rank":{"cr":13,"all":13.5}},{"file":"tema-s11-future-career-and-jobs.md","title":"Future career and jobs","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu.","vocab":[{"head":"\u003cstrong>job interview\u003c/strong> [C]","gloss":"pracovní pohovor","example":"Dressing appropriately and arriving on time create a positive first impression at a job interview."},{"head":"\u003cstrong>curriculum vitae (CV)\u003c/strong> (curriculum vitae /kəˌrɪkjələm ˈviːtaɪ/) [C]","gloss":"životopis","example":"A well-structured CV should clearly list your education, practical experience, and language skills."},{"head":"\u003cstrong>internship\u003c/strong> /ˈɪntɜːnʃɪp/ AmE /ˈɪntɜːrnʃɪp/ [C]","gloss":"pracovní stáž, studentská praxe","example":"Completing a summer internship at an IT firm gave her valuable hands-on experience."},{"head":"\u003cstrong>career prospects\u003c/strong> [plural]","gloss":"profesní / kariérní vyhlídky","example":"Studying medicine or software engineering usually guarantees bright career prospects."},{"head":"\u003cstrong>work-life balance\u003c/strong> /ˌwɜːk laɪf ˈbæləns/ AmE /ˌwɜːrk laɪf ˈbæləns/ [U]","gloss":"rovnováha mezi pracovním a osobním životem","example":"Young professionals today prioritize a healthy work-life balance over working fifty hours a week."},{"head":"\u003cstrong>remote work\u003c/strong> [U]","gloss":"práce na dálku, práce z domova","example":"The rise of remote work enables employees to work for international companies without moving abroad."},{"head":"\u003cstrong>job security\u003c/strong> /ˈdʒɒb sɪkjʊərəti/ AmE /ˈdʒɑːb sɪkjʊrəti/ [U]","gloss":"jistota zaměstnání","example":"Public sector positions often offer higher job security compared to volatile private startups."},{"head":"\u003cstrong>salary\u003c/strong> /ˈsæləri/ [C/U]","gloss":"stálý plat (obvykle měsíční nebo roční)","example":"He was offered a competitive starting salary with regular annual performance reviews."},{"head":"\u003cstrong>wage\u003c/strong> /weɪdʒ/ [C]","gloss":"mzda (obvykle hodinová nebo týdenní, např. u manuální práce či brigád)","example":"Students working part-time in supermarkets earn an hourly wage."},{"head":"\u003cstrong>promotion\u003c/strong> /prəˈməʊʃn/ AmE /prəˈmoʊʃn/ [C/U]","gloss":"povýšení v zaměstnání","example":"After successfully leading the regional marketing campaign, she earned a well-deserved promotion."},{"head":"\u003cstrong>qualifications\u003c/strong> /ˌkwɒlɪfɪˈkeɪʃnz/ AmE /ˌkwɑːlɪfɪˈkeɪʃnz/ [plural]","gloss":"kvalifikace, odborné předpoklady","example":"Employers assess whether applicants hold the necessary academic and technical qualifications."},{"head":"\u003cstrong>labour market\u003c/strong> /ˈleɪbə mɑːkɪt/ AmE /ˈleɪbər mɑːrkɪt/ [singular, usually the labour market]","gloss":"trh práce","example":"Due to automation and artificial intelligence, the modern labour market demands continuous retraining."},{"head":"\u003cstrong>apply for a job\u003c/strong> (verb phrase)","gloss":"ucházet se o práci, podat žádost o místo","example":"After passing my school leaving examinations, I intend to apply for a job in customer support."},{"head":"\u003cstrong>colleague\u003c/strong> /ˈkɒliːɡ/ AmE /ˈkɑːliːɡ/ [C]","gloss":"kolega, spolupracovník","example":"Working alongside supportive and experienced colleagues makes difficult projects much easier."},{"head":"\u003cstrong>deadline\u003c/strong> /ˈdedlaɪn/ [C]","gloss":"termín dokončení, uzávěrka","example":"Managing your time efficiently is crucial if you want to meet every project deadline."},{"head":"\u003cstrong>freelancer\u003c/strong> /ˈfriːlɑːnsə/ AmE /ˈfriːlænsər/ [C]","gloss":"nezávislý profesionál, člověk na volné noze","example":"Working as a freelancer allows you to choose your own clients and working hours."},{"head":"\u003cstrong>vocational training\u003c/strong> (vocational /vəʊˈkeɪʃənl/) [U]","gloss":"odborné / učňovské vzdělávání","example":"While university suits academic paths, vocational training prepares technicians and electricians for immediate work."},{"head":"\u003cstrong>overtime\u003c/strong> /ˈəʊvətaɪm/ AmE /ˈoʊvərtaɪm/ [U]","gloss":"práce přesčas","example":"Employees who frequently work overtime risk suffering from chronic fatigue and burnout."},{"head":"\u003cstrong>perk\u003c/strong> /pɜːk/ AmE /pɜːrk/ [C]","gloss":"zaměstnanecký benefit (např. flexibilní doba, stravenky)","example":"Flexible working hours and gym memberships are attractive perks offered by modern employers."},{"head":"\u003cstrong>soft skills\u003c/strong> /ˈsɒft skɪlz/ AmE /ˈsɔːft skɪlz/ [plural]","gloss":"měkké dovednosti (komunikace, týmovost, řešení konfliktů)","example":"Technical know-how gets you an interview, but strong soft skills help you thrive in a team."},{"head":"\u003cstrong>university degree\u003c/strong> [C]","gloss":"vysokoškolský titul, diplom","example":"Obtaining a university degree opens doors to specialised careers in law, medicine, and research."},{"head":"\u003cstrong>be made redundant\u003c/strong> (redundant /rɪˈdʌndənt/) (passive verb phrase)","gloss":"být propuštěn pro nadbytečnost","example":"When the factory automated its production lines, dozens of assembly workers were made redundant."}],"answer":["As secondary school students approaching our final exams, thinking about our future career is both exciting and slightly daunting. The modern \u003cstrong>labour market\u003c/strong> is changing at a rapid pace, driven by technology and globalization. While previous generations often stayed with a single employer for their entire working lives, today we must be adaptable, open to lifelong learning, and equipped with versatile \u003cstrong>soft skills\u003c/strong> like teamwork and problem-solving.","My own career aspirations involve pursuing a \u003cstrong>university degree\u003c/strong> in management or languages. Earning a respected higher education qualification provides solid theoretical knowledge, but I also know that academic theory is not enough on its own. Gaining practical experience through a summer \u003cstrong>internship\u003c/strong> or student exchange is essential if you want to build an impressive CV. When the time comes to \u003cstrong>apply for a job\u003c/strong> and attend a formal \u003cstrong>job interview\u003c/strong>, real-world project experience often sets candidates apart.","Of course, financial reward is an important factor. Everyone hopes for a fair \u003cstrong>salary\u003c/strong>, opportunities for \u003cstrong>promotion\u003c/strong>, and reasonable \u003cstrong>job security\u003c/strong>. However, what matters to me even more is finding work that feels genuinely fulfilling. I want to collaborate with inspiring \u003cstrong>colleagues\u003c/strong> in an environment that respects personal time. The recent growth of \u003cstrong>remote work\u003c/strong> and flexible schedules highlights how much employees value having a healthy \u003cstrong>work-life balance\u003c/strong>. Ultimately, a rewarding job should challenge you intellectually without causing constant exhaustion."],"answer_info":"","questions":[{"cat":"Popis","text":"What factors are most influential when young people choose their future profession or field of study?"},{"cat":"Srovnání","text":"In what ways does obtaining a university degree compare with completing practical vocational training in terms of job opportunities?"},{"cat":"Příprava","text":"How should a young applicant prepare for their very first job interview to make a positive impression?"},{"cat":"Názor","text":"Why is maintaining a sensible work-life balance becoming such a high priority for the younger generation?"},{"cat":"Hypotéza","text":"If artificial intelligence and automation replace many traditional office jobs in the next decade, what types of careers will remain safe?"},{"cat":"Srovnání","text":"What are the main benefits and drawbacks of working remotely from home compared to working in a traditional office?"},{"cat":"Názor","text":"How important are interpersonal soft skills compared to technical qualifications when building a successful career?"}],"phrases":[{"head":"\u003cstrong>When considering my future prospects,...\u003c/strong>","gloss":"Když uvažuji o svých budoucích vyhlídkách,...","note":"zaměření na budoucnost"},{"head":"\u003cstrong>It is extremely important to...\u003c/strong>","gloss":"Je nesmírně důležité...","note":"zdůraznění priority"},{"head":"\u003cstrong>First and foremost, we should realize that...\u003c/strong>","gloss":"Především bychom si měli uvědomit, že...","note":"hlavní myšlenka"},{"head":"\u003cstrong>Striking a balance between work and leisure...\u003c/strong>","gloss":"Nalezení rovnováhy mezi prací a volnem...","note":"téma rovnováhy"},{"head":"\u003cstrong>From where I stand,...\u003c/strong>","gloss":"Podle mého názoru / z mé pozice...","note":"vyjádření postoje"},{"head":"\u003cstrong>In contrast to traditional career paths,...\u003c/strong>","gloss":"Na rozdíl od tradičních kariérních cest...","note":"srovnání s minulostí"},{"head":"\u003cstrong>To put it in a nutshell, my ideal career would be...\u003c/strong>","gloss":"V kostce řečeno, má ideální kariéra by byla...","note":"závěrečné shrnutí"}],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>job interview\u003c/strong> [C; A1 + A1]","gloss":"pracovní pohovor","example":"Wearing suitable clothes and arriving on time create a positive first impression at a job interview."},{"head":"\u003cstrong>CV\u003c/strong> [C; B1]","gloss":"životopis","example":"A well-organized CV should list your education, practical experience and language skills."},{"head":"\u003cstrong>work experience\u003c/strong> [U; B1]","gloss":"pracovní stáž, studentská praxe","example":"Summer work experience at an IT company gave her valuable practical experience."},{"head":"\u003cstrong>balance between work and personal life\u003c/strong> (noun phrase; B1 + A1 + A2 + A1)","gloss":"rovnováha mezi pracovním a osobním životem","example":"For young workers, a balance between work and personal life matters most."},{"head":"\u003cstrong>working from home\u003c/strong> [U; A2 + A1 + A1]","gloss":"práce z domova (na dálku)","example":"Working from home lets employees work for international companies without moving abroad."},{"head":"\u003cstrong>job security\u003c/strong> /ˈdʒɒb sɪkjʊərəti/ AmE /ˈdʒɑːb sɪkjʊrəti/ [U; B1]","gloss":"jistota zaměstnání","example":"Government jobs often offer more job security than jobs in new companies."},{"head":"\u003cstrong>salary\u003c/strong> /ˈsæləri/ [C/U; A2]","gloss":"stálý plat (obvykle měsíční nebo roční)","example":"As a new employee, he was offered a salary as good as other companies pay."},{"head":"\u003cstrong>move to a more important job\u003c/strong> (verb phrase; A2 + A1 + A1)","gloss":"postoupit na důležitější místo, být povýšen (\u003cem>promotion\u003c/em> = povýšení v zaměstnání)","example":"After leading the marketing campaign, she moved to a more important job."},{"head":"\u003cstrong>qualifications\u003c/strong> /ˌkwɒlɪfɪˈkeɪʃnz/ AmE /ˌkwɑːlɪfɪˈkeɪʃnz/ [plural; B1]","gloss":"kvalifikace, odborné předpoklady","example":"Employers check whether people who apply have the necessary academic and technical qualifications."},{"head":"\u003cstrong>labour market\u003c/strong> /ˈleɪbə mɑːkɪt/ AmE /ˈleɪbər mɑːrkɪt/ [singular, usually the labour market; slovo k tématu, C1]","gloss":"trh práce","example":"Because of machines and AI, the modern labour market needs people who keep learning new skills."},{"head":"\u003cstrong>apply for a job\u003c/strong> (verb phrase; A2)","gloss":"ucházet se o práci, podat žádost o místo","example":"After passing my final exams, I intend to apply for a job in customer service."},{"head":"\u003cstrong>colleague\u003c/strong> /ˈkɒliːɡ/ AmE /ˈkɑːliːɡ/ [C; A2]","gloss":"kolega, spolupracovník","example":"Working with experienced colleagues who support you makes difficult projects much easier."},{"head":"\u003cstrong>training for a particular job\u003c/strong> (noun phrase; A2)","gloss":"odborné / učňovské vzdělávání","example":"Training for a particular job prepares people to start work immediately."},{"head":"\u003cstrong>work extra hours\u003c/strong> (verb phrase; A1 + A1 + A1)","gloss":"pracovat přesčas","example":"Employees who often work extra hours can feel tired all the time."},{"head":"\u003cstrong>skills for working with people\u003c/strong> (noun phrase; A1–A2)","gloss":"měkké dovednosti (komunikace, týmovost, řešení konfliktů)","example":"Skills for working with people help you do well in a team."},{"head":"\u003cstrong>university degree\u003c/strong> [C; A1 + A2]","gloss":"vysokoškolský titul, diplom","example":"Getting a university degree makes careers in law, medicine and research possible."}],"answer":["Before our final exams, thinking about our future career is exciting, but it makes us a little nervous. The \u003cstrong>labour market\u003c/strong> is changing fast because of technology. Today, we must be able to change. We also need \u003cstrong>skills for working with people\u003c/strong>, like working in a team and solving problems.","I hope to study for a \u003cstrong>university degree\u003c/strong> in management or languages. Respected university \u003cstrong>qualifications\u003c/strong> give you knowledge of theory, but theory alone is not enough. Practical experience through summer \u003cstrong>work experience\u003c/strong> or student exchange is essential for an impressive \u003cstrong>CV\u003c/strong>. When you \u003cstrong>apply for a job\u003c/strong> and have a \u003cstrong>job interview\u003c/strong>, real project experience often gives candidates an advantage.","Everyone hopes for a fair \u003cstrong>salary\u003c/strong>, chances to \u003cstrong>move to a more important job\u003c/strong> and \u003cstrong>job security\u003c/strong>. However, I care even more about finding work that really makes me happy. I want to work with \u003cstrong>colleagues\u003c/strong> in an environment that respects personal time. Recently, more people have \u003cstrong>worked from home\u003c/strong> or chosen their own working hours. This shows how important a healthy \u003cstrong>balance between work and personal life\u003c/strong> is for employees. A job that feels useful should make you think hard, but not make you very tired all the time."],"questions":[{"cat":"Popis","text":"What influences young people most when they choose a future profession or field of study?"},{"cat":"Srovnání","text":"How does a university degree compare with practical training for a particular job? \u003cem>(job opportunities)\u003c/em>"},{"cat":"Příprava","text":"How should a young person prepare for their very first job interview? \u003cem>(how to make a positive impression)\u003c/em>"},{"cat":"Názor","text":"Why is a balance between work and personal life becoming so important for young people?"},{"cat":"Hypotéza","text":"If AI replaces many office jobs in the next decade, what careers will remain safe? \u003cem>(when machines do the work of people)\u003c/em>"},{"cat":"Srovnání","text":"What are the main advantages and disadvantages of working from home? \u003cem>(how it is different from working in a traditional office)\u003c/em>"},{"cat":"Názor","text":"How important are skills for working with people for a successful career? \u003cem>(in comparison with technical qualifications)\u003c/em>"}],"phrases":[{"head":"\u003cstrong>When I think about my chances for the future,...\u003c/strong>","gloss":"Když uvažuji o svých budoucích vyhlídkách,...","note":"zaměření na budoucnost"},{"head":"\u003cstrong>It is extremely important to...\u003c/strong>","gloss":"Je nesmírně důležité...","note":"zdůraznění priority"},{"head":"\u003cstrong>First of all, we should realize that...\u003c/strong>","gloss":"Především bychom si měli uvědomit, že...","note":"hlavní myšlenka"},{"head":"\u003cstrong>Finding a balance between work and leisure...\u003c/strong>","gloss":"Nalezení rovnováhy mezi prací a volnem...","note":"téma rovnováhy"},{"head":"\u003cstrong>In my opinion,...\u003c/strong>","gloss":"Podle mého názoru...","note":"vyjádření postoje"},{"head":"\u003cstrong>Unlike traditional careers,...\u003c/strong>","gloss":"Na rozdíl od tradičních kariér...","note":"srovnání s minulostí"},{"head":"\u003cstrong>In a few words, my ideal career would be...\u003c/strong>","gloss":"Stručně řečeno, má ideální kariéra by byla...","note":"závěrečné shrnutí"}]},"codes":["CR 7a"],"groups":["cr"],"rank":{"cr":14,"all":14.5}},{"file":"tema-c11a-tourism.md","title":"Tourism and holidays","label":"Navrhl AI (Hermes, gpt-6.1-terra), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu.","vocab":[{"head":"\u003cstrong>tourism industry\u003c/strong>","gloss":"odvětví cestovního ruchu","example":"The tourism industry includes many kinds of business."},{"head":"\u003cstrong>domestic tourism\u003c/strong> (domestic /dəˈmestɪk/)","gloss":"domácí cestovní ruch","example":"Domestic tourism means travelling within one's own country."},{"head":"\u003cstrong>inbound tourism\u003c/strong> (inbound /ˈɪnbaʊnd/)","gloss":"příjezdový cestovní ruch","example":"Inbound tourism involves non-resident visitors travelling within the country of reference."},{"head":"\u003cstrong>outbound tourism\u003c/strong> (outbound /ˈaʊtbaʊnd/)","gloss":"výjezdový cestovní ruch","example":"Outbound tourism involves residents travelling abroad."},{"head":"\u003cstrong>all-inclusive\u003c/strong> /ˌɔːl ɪnˈkluːsɪv/","gloss":"s vybranými službami zahrnutými v ceně","example":"The all-inclusive offer listed the meals covered."},{"head":"\u003cstrong>last-minute deal\u003c/strong>","gloss":"nabídka na poslední chvíli","example":"She found a last-minute deal for next week."},{"head":"\u003cstrong>tour operator\u003c/strong> (operator /ˈɒpəreɪtə(r)/ AmE /ˈɑːpəreɪtər/)","gloss":"pořadatel zájezdů","example":"The tour operator explained what the package included."},{"head":"\u003cstrong>travel agent\u003c/strong> /ˈtrævl eɪdʒənt/","gloss":"prodejce cestovních služeb nebo zájezdů","example":"The travel agent helped us compare offers."},{"head":"\u003cstrong>itinerary\u003c/strong> /aɪˈtɪnərəri/ AmE /aɪˈtɪnəreri/","gloss":"plán cesty","example":"Our itinerary leaves an afternoon free."},{"head":"\u003cstrong>excursion\u003c/strong> /ɪkˈskɜːʃn/ AmE /ɪkˈskɜːrʒn/","gloss":"výlet, zpravidla kratší a organizovaný","example":"The excursion includes a guided walk."},{"head":"\u003cstrong>city break\u003c/strong>","gloss":"krátká dovolená ve městě","example":"A city break can fit into a long weekend."},{"head":"\u003cstrong>seaside holiday\u003c/strong> (seaside /ˈsiːsaɪd/)","gloss":"dovolená u moře","example":"They prefer a quiet seaside holiday."},{"head":"\u003cstrong>activity holiday\u003c/strong>","gloss":"aktivní dovolená","example":"An activity holiday might include hiking lessons."},{"head":"\u003cstrong>peak season\u003c/strong> (peak /piːk/)","gloss":"hlavní sezóna","example":"Prices can be higher during peak season."},{"head":"\u003cstrong>off-season\u003c/strong> /ˈɒf siːzn/ AmE /ˈɔːf siːzn/","gloss":"mimo hlavní sezónu","example":"In the off-season some attractions may be closed."},{"head":"\u003cstrong>shoulder season\u003c/strong> /ˈʃəʊldə(r) siːzn/ AmE /ˈʃəʊldər siːzn/","gloss":"období mezi hlavní a mimosezónou","example":"The shoulder season can be less crowded."},{"head":"\u003cstrong>local economy\u003c/strong>","gloss":"místní ekonomika","example":"Visitors may spend money in th
