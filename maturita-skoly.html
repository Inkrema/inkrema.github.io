nce to the final flavour of the soup."},{"head":"\u003cstrong>dine out\u003c/strong> (dine /daɪn/) (phrasal verb) / \u003cstrong>dining out\u003c/strong> (dining /ˈdaɪnɪŋ/) [noun phrase]","gloss":"jíst v restauraci, stravování mimo domov","example":"Because cooking takes time, young professionals frequently prefer dining out on weekday evenings."},{"head":"\u003cstrong>side dish\u003c/strong> /ˈsaɪd dɪʃ/ [C]","gloss":"příloha (k hlavnímu jídlu)","example":"In Czech cooking, potatoes and dumplings are the most common side dishes served with meat."},{"head":"\u003cstrong>balanced diet\u003c/strong> (balanced /ˈbælənst/) [C/U]","gloss":"vyvážená strava, vyvážený jídelníček","example":"Athletes pay close attention to a balanced diet with adequate proteins, healthy fats, and vitamins."},{"head":"\u003cstrong>dumpling\u003c/strong> /ˈdʌmplɪŋ/ [C]","gloss":"knedlík, plněná taštička (obvykle v plurálu: \u003cem>dumplings\u003c/em>)","example":"Traditional bread dumplings and roast pork with sauerkraut form the Czech national dish."},{"head":"\u003cstrong>cutlery\u003c/strong> /ˈkʌtləri/ [U]","gloss":"příbory (nože, vidličky, lžíce)","example":"Before guests sit down at the dinner table, the waiter arranges polished cutlery neatly."},{"head":"\u003cstrong>tap water\u003c/strong> /ˈtæp wɔːtə(r)/ AmE /ˈtæp wɔːtər/ [U]","gloss":"voda z kohoutku","example":"Drinking fresh tap water rather than sugary sodas is better for your health and saves money."},{"head":"\u003cstrong>snack\u003c/strong> /snæk/ [C]","gloss":"svačina, malé občerstvení","example":"Carrying a piece of fruit or a handful of nuts provides a healthy snack during long school breaks."},{"head":"\u003cstrong>fast food\u003c/strong> /ˌfɑːst ˈfuːd/ AmE /ˌfæst ˈfuːd/ [U]","gloss":"rychlé občerstvení","example":"While convenient, frequent consumption of fast food can contribute to obesity and fatigue."},{"head":"\u003cstrong>starter\u003c/strong> /ˈstɑːtə/ AmE /ˈstɑːrtər/ [C]","gloss":"předkrm (v americké angličtině častěji \u003cem>appetizer\u003c/em>)","example":"We ordered a light garlic soup as a warm starter before the heavy main course."},{"head":"\u003cstrong>main course\u003c/strong> /ˌmeɪn ˈkɔːs/ AmE /ˌmeɪn ˈkɔːrs/ [C]","gloss":"hlavní chod","example":"For my main course, I chose grilled salmon accompanied by steamed seasonal vegetables."},{"head":"\u003cstrong>dessert\u003c/strong> /dɪˈzɜːt/ AmE /dɪˈzɜːrt/ [C/U]","gloss":"dezert, moučník","example":"Finishing dinner with a rich chocolate dessert is always a delightful treat."},{"head":"\u003cstrong>greasy\u003c/strong> /ˈɡriːsi/ (adjective)","gloss":"mastný, přemaštěný","example":"Traditional fried food can be overly greasy and hard on your digestive system."},{"head":"\u003cstrong>vegetarian\u003c/strong> /ˌvedʒəˈteəriən/ AmE /ˌvedʒəˈteriən/ (noun/adjective)","gloss":"vegetarián [C]; vegetariánský","example":"More restaurants now offer imaginative vegetarian options alongside meat meals."},{"head":"\u003cstrong>ready meal\u003c/strong> /ˈredi miːl/ [C]","gloss":"hotové balené jídlo (k rychlému ohřátí; POZOR na falešného přítele: \u003cem>preservatives\u003c/em> = konzervanty, nikoliv prezervativy)","example":"Relying on a processed ready meal every evening often involves consuming high levels of salt and saturated fat."},{"head":"\u003cstrong>culinary\u003c/strong> /ˈkʌlɪnəri/ AmE /ˈkjuːlɪneri/ (adjective)","gloss":"kulinářský, kuchařský","example":"Travelling abroad gives you a chance to discover authentic culinary traditions."},{"head":"\u003cstrong>eat in moderation\u003c/strong> (moderation /ˌmɒdəˈreɪʃn/ AmE /ˌmɑːdəˈreɪʃn/) (phrase)","gloss":"jíst s mírou, nepřehánět to s jídlem","example":"Nutritionists advise that you can enjoy sweets as long as you eat them in moderation."},{"head":"\u003cstrong>overeat\u003c/strong> /ˌəʊvərˈiːt/ AmE /ˌoʊvərˈiːt/ (verb)","gloss":"přejídat se","example":"It is easy to overeat during holiday feasts when delicious treats are constantly on offer."},{"head":"\u003cstrong>skip breakfast\u003c/strong> (skip /skɪp/) (phrase)","gloss":"vynechávat snídani","example":"Students who regularly skip breakfast tend to lose concentration during morning lessons."},{"head":"\u003cstrong>flavour\u003c/strong> /ˈfleɪvə(r)/ AmE /ˈfleɪvər/ [C/U]","gloss":"příchuť, celková chuť a vůně pokrmu (na rozdíl od \u003cem>taste\u003c/em> jako základního smyslového vjemu na jazyku)","example":"Adding a pinch of fresh rosemary enhances the earthy flavour of the roast meat."}],"answer":["Food is a big part of our culture, family life, and everyday well-being. How people eat in the Czech Republic combines old habits with newer modern trends. Traditional Czech \u003cstrong>cuisine\u003c/strong> is famous for being hearty and comforting. Dishes like roast pork with bread \u003cstrong>dumplings\u003c/strong> and braised sauerkraut or rich goulash are delicious, especially in cold winter months, but they can also be quite heavy and \u003cstrong>greasy\u003c/strong>.","In recent years, however, eating habits among young Czechs have shifted towards a healthier, more \u003cstrong>balanced diet\u003c/strong>. While our grandparents cooked almost everything from scratch, today's busy schedules mean many students fall into the trap of grabbing unhealthy \u003cstrong>fast food\u003c/strong> or an ultra-processed \u003cstrong>ready meal\u003c/strong>. Personally, I try to avoid these habits. I make a point never to \u003cstrong>skip breakfast\u003c/strong>, as a bowl of porridge or eggs gives me steady energy for morning classes, and I always pack a piece of fruit or some nuts as a morning \u003cstrong>snack\u003c/strong>.","When celebrating family birthdays, we often enjoy \u003cstrong>dining out\u003c/strong> together in local pubs or cosy bistros. A special family meal usually starts with a warm \u003cstrong>starter\u003c/strong>, such as garlic soup, followed by a hearty \u003cstrong>main course\u003c/strong>, and perhaps a light fruit \u003cstrong>dessert\u003c/strong>. Cooking at home is also something I genuinely enjoy. Trying out a new \u003cstrong>recipe\u003c/strong> with fresh \u003cstrong>ingredients\u003c/strong> and experimenting with herbs is relaxing. In my view, the secret to staying fit is simple: you do not need extreme diets, as long as you eat fresh food and \u003cstrong>eat in moderation\u003c/strong>."],"answer_info":"","questions":[{"cat":"Popis","text":"What does a typical daily diet of a Czech secondary school student look like?"},{"cat":"Srovnání","text":"In what ways does traditional Czech cuisine differ from lighter Mediterranean food?"},{"cat":"Zkušenost","text":"How do you prepare your favourite home-cooked meal?"},{"cat":"Názor","text":"Why are vegetarian and plant-based diets becoming increasingly popular among young people?"},{"cat":"Kritika","text":"What are the most significant health risks associated with relying on fast food and energy drinks?"},{"cat":"Hypotéza","text":"If school canteens banned all sweet snacks and fried dishes, how would students react?"},{"cat":"Srovnání","text":"How do dining habits in English-speaking countries, like Sunday roast in the UK or barbecues in the USA, compare with Czech eating traditions?"}],"phrases":[{"head":"\u003cstrong>When it comes to my daily food choices,...\u003c/strong>","gloss":"Pokud jde o mé každodenní stravování,...","note":"uvedení tématu"},{"head":"\u003cstrong>There is nothing quite like a home-cooked meal because...\u003c/strong>","gloss":"Není nad doma uvařené jídlo, protože...","note":"vyjádření chuti/pocitu"},{"head":"\u003cstrong>On the one hand..., on the other hand...\u003c/strong>","gloss":"Na jedné straně..., na druhé straně...","note":"kontrast zdravého a nezdravého"},{"head":"\u003cstrong>A major dietary problem facing our generation is...\u003c/strong>","gloss":"Velkým stravovacím problémem naší generace je...","note":"pojmenování problému"},{"head":"\u003cstrong>From my own perspective,...\u003c/strong>","gloss":"Z mého vlastního pohledu...","note":"osobní postoj"},{"head":"\u003cstrong>It goes without saying that...\u003c/strong>","gloss":"Rozumí se samo sebou, že...","note":"přirozený fakt"},{"head":"\u003cstrong>To wrap up, healthy eating is all about...\u003c/strong>","gloss":"Abych to uzavřel, zdravé stravování spočívá především v...","note":"závěrečné shrnutí"}],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>style of cooking\u003c/strong> (noun phrase; A1 + A1)","gloss":"kuchyně, gastronomie (národní kulinářský styl)","example":"The Italian style of cooking is famous everywhere for simple pasta dishes."},{"head":"\u003cstrong>recipe\u003c/strong> /ˈresəpi/ [C; A2]","gloss":"kuchařský recept (POZOR: recept od lékaře je \u003cem>prescription\u003c/em>)","example":"My grandmother shared her secret family recipe."},{"head":"\u003cstrong>ingredient\u003c/strong> /ɪnˈɡriːdiənt/ [C; B1]","gloss":"surovina, ingredience, přísada","example":"Using fresh ingredients makes a big difference to the final taste of the soup."},{"head":"\u003cstrong>eat out\u003c/strong> (phrasal verb; A2) / \u003cstrong>eating out\u003c/strong>","gloss":"jíst v restauraci, stravování mimo domov","example":"Young professional people frequently prefer eating out on weekday evenings."},{"head":"\u003cstrong>dumpling\u003c/strong> /ˈdʌmplɪŋ/ [C; slovo k tématu, C2]","gloss":"knedlík, plněná taštička (obvykle v plurálu: \u003cem>dumplings\u003c/em>)","example":"Traditional bread dumplings and roast pork are part of the Czech national dish."},{"head":"\u003cstrong>knives, forks and spoons\u003c/strong> (noun phrase; A2 + A2 + A2)","gloss":"příbory (nože, vidličky, lžíce)","example":"Before guests sit down, the waiter arranges the knives, forks and spoons."},{"head":"\u003cstrong>snack\u003c/strong> /snæk/ [C; A2]","gloss":"svačina, malé občerstvení","example":"Carrying a piece of fruit or a few nuts provides a healthy snack during long school breaks."},{"head":"\u003cstrong>fast food\u003c/strong> /ˌfɑːst ˈfuːd/ AmE /ˌfæst ˈfuːd/ [U; A2]","gloss":"rychlé občerstvení","example":"Fast food is convenient, but eating it often can be one cause of weight problems and tiredness."},{"head":"\u003cstrong>starter\u003c/strong> /ˈstɑːtə/ AmE /ˈstɑːrtər/ [C; B1]","gloss":"předkrm (v americké angličtině častěji \u003cem>appetizer\u003c/em>)","example":"We ordered a warm garlic soup as a starter before the main course."},{"head":"\u003cstrong>main course\u003c/strong> /ˌmeɪn ˈkɔːs/ AmE /ˌmeɪn ˈkɔːrs/ [C; B1]","gloss":"hlavní chod","example":"For my main course, I chose salmon with vegetables."},{"head":"\u003cstrong>dessert\u003c/strong> /dɪˈzɜːt/ AmE /dɪˈzɜːrt/ [C/U; A2]","gloss":"dezert, moučník","example":"Finishing dinner with a chocolate dessert is always very nice."},{"head":"\u003cstrong>have too much fat\u003c/strong> (phrase; A1 + A2)","gloss":"být mastný, přemaštěný (\u003cem>greasy\u003c/em>)","example":"Traditional fried food can have too much fat."},{"head":"\u003cstrong>vegetarian\u003c/strong> /ˌvedʒəˈteəriən/ AmE /ˌvedʒəˈteriən/ (noun/adjective; A2)","gloss":"vegetarián [C]; vegetariánský","example":"More restaurants now offer creative vegetarian options as well as meat meals."},{"head":"\u003cstrong>meals that are sold ready to heat\u003c/strong> (noun phrase, plural; A1 + A2)","gloss":"hotové balené jídlo (k rychlému ohřátí; \u003cem>ready meal\u003c/em>; POZOR na falešného přítele: \u003cem>preservatives\u003c/em> = konzervanty, nikoliv prezervativy)","example":"Meals that are sold ready to heat often contain lots of salt."},{"head":"\u003cstrong>eat too much\u003c/strong> (phrase; A1)","gloss":"přejídat se","example":"It is easy to eat too much during big holiday meals."},{"head":"\u003cstrong>miss breakfast\u003c/strong> (phrase; A2 + A1)","gloss":"vynechávat snídani","example":"Students who regularly miss breakfast often cannot concentrate in morning lessons."}],"answer":["Food is a big part of our culture, family life, health and happiness. The traditional Czech \u003cstrong>style of cooking\u003c/strong> is famous for meals that make you feel full. Dishes like roast pork with bread \u003cstrong>dumplings\u003c/strong> and sauerkraut, or goulash, are delicious, especially in winter. But they can also \u003cstrong>have too much fat\u003c/strong>.","In recent years, however, young Czechs have started to eat in a healthier way. But many students are busy, so they buy unhealthy \u003cstrong>fast food\u003c/strong> or \u003cstrong>meals that are sold ready to heat\u003c/strong>. I make sure that I never \u003cstrong>miss breakfast\u003c/strong>. Eggs give me energy that lasts all morning. I always pack a piece of fruit or some nuts as a morning \u003cstrong>snack\u003c/strong>.","When we celebrate family birthdays, we often enjoy \u003cstrong>eating out\u003c/strong> in local pubs or small restaurants. A special family meal usually starts with a warm \u003cstrong>starter\u003c/strong>, such as garlic soup. Then there is a big \u003cstrong>main course\u003c/strong> and perhaps a small fruit \u003cstrong>dessert\u003c/strong>. I also really enjoy cooking at home. Trying a new \u003cstrong>recipe\u003c/strong> with fresh \u003cstrong>ingredients\u003c/strong> is relaxing. In my view, staying fit is simple. You do not need extreme diets if you eat fresh food and do not \u003cstrong>eat too much\u003c/strong>."],"questions":[{"cat":"Popis","text":"What does a typical daily diet of a Czech secondary school student look like?"},{"cat":"Srovnání","text":"How is traditional Czech cooking different from Mediterranean food? \u003cem>(food with less fat or sugar)\u003c/em>"},{"cat":"Zkušenost","text":"How do you prepare your favourite meal at home?"},{"cat":"Názor","text":"Why are vegetarian and plant-based diets becoming more and more popular among young people?"},{"cat":"Kritika","text":"What are the biggest health risks if people depend on fast food? \u003cem>(and on drinks that give you a lot of energy)\u003c/em>"},{"cat":"Hypotéza","text":"If school canteens banned all sweet snacks and fried dishes, how would students react?"},{"cat":"Srovnání","text":"How do eating habits in English-speaking countries compare with Czech eating traditions? \u003cem>(for example, roast meat on Sundays in the UK or barbecues in the USA)\u003c/em>"}],"phrases":[{"head":"\u003cstrong>When I think about my daily food choices,...\u003c/strong>","gloss":"Když přemýšlím o svém každodenním stravování,...","note":"uvedení tématu"},{"head":"\u003cstrong>Nothing is better than a meal that is cooked at home, because...\u003c/strong>","gloss":"Není nad doma uvařené jídlo, protože...","note":"vyjádření chuti/pocitu"},{"head":"\u003cstrong>..., but on the other hand,...\u003c/strong>","gloss":"..., ale na druhé straně,...","note":"kontrast zdravého a nezdravého"},{"head":"\u003cstrong>A major food problem for our generation is...\u003c/strong>","gloss":"Velkým stravovacím problémem naší generace je...","note":"pojmenování problému"},{"head":"\u003cstrong>From my own point of view,...\u003c/strong>","gloss":"Z mého vlastního pohledu...","note":"osobní postoj"},{"head":"\u003cstrong>Of course,...\u003c/strong>","gloss":"Samozřejmě,...","note":"přirozený fakt"},{"head":"\u003cstrong>In conclusion, healthy eating is mainly about...\u003c/strong>","gloss":"Závěrem: zdravé stravování spočívá především v...","note":"závěrečné shrnutí"}]},"codes":["SSO 16","CR 16a"],"groups":["cr","sso"],"rank":{"cr":32,"sso":32,"all":32}},{"file":"tema-s6-money-shopping-services.md","title":"Money, shopping, services","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu.","vocab":[{"head":"\u003cstrong>budget\u003c/strong> /ˈbʌdʒɪt/ [C]","gloss":"rozpočet","example":"Students who manage a monthly budget are far less likely to run into financial trouble."},{"head":"\u003cstrong>pocket money\u003c/strong> /ˈpɒkɪt mʌni/ AmE /ˈpɑːkɪt mʌni/ [U]","gloss":"kapesné","example":"My parents give me a fixed amount of pocket money each month to cover my leisure activities."},{"head":"\u003cstrong>part-time job\u003c/strong> [C]","gloss":"práce na částečný úvazek, brigáda","example":"Working in a local café on weekends is a popular part-time job among secondary school students."},{"head":"\u003cstrong>brick-and-mortar shop\u003c/strong> (brick /brɪk/; mortar /ˈmɔːtə(r)/ AmE /ˈmɔːrtər/) [C]","gloss":"kamenný obchod","example":"Although many people prefer shopping online, brick-and-mortar shops allow customers to try clothes on."},{"head":"\u003cstrong>bargain\u003c/strong> /ˈbɑːɡən/ AmE /ˈbɑːrɡən/ [C]","gloss":"výhodná koupě","example":"She found a genuine designer jacket on sale for a quarter of the original price, which was a real bargain."},{"head":"\u003cstrong>receipt\u003c/strong> /rɪˈsiːt/ [C]","gloss":"účtenka, pokladní doklad","example":"Always keep your receipt in case you need to exchange an item or make a warranty claim."},{"head":"\u003cstrong>refund\u003c/strong> /ˈriːfʌnd/ [C]","gloss":"vrácení peněz (při reklamaci)","example":"Because the electronic gadget was completely broken out of the box, the store issued an immediate refund."},{"head":"\u003cstrong>contactless payment\u003c/strong> (contactless /ˈkɒntæktləs/ AmE /ˈkɑːntæktləs/) [C/U]","gloss":"bezkontaktní platba","example":"Almost everywhere in the Czech Republic, you can pay for goods using contactless payment with your mobile phone."},{"head":"\u003cstrong>in cash\u003c/strong> (phrase)","gloss":"v hotovosti","example":"Some small farmers at the Saturday market still accept payments only in cash."},{"head":"\u003cstrong>current account\u003c/strong> /ˈkʌrənt əkaʊnt/ AmE /ˈkɜːrənt əkaʊnt/ [C]","gloss":"běžný účet (v bance)","example":"Most teenagers open their first current account to receive wages from summer jobs."},{"head":"\u003cstrong>savings\u003c/strong> /ˈseɪvɪŋz/ [plural]","gloss":"úspory","example":"He decided to put aside ten percent of his earnings every month to build up his savings."},{"head":"\u003cstrong>afford\u003c/strong> /əˈfɔːd/ AmE /əˈfɔːrd/ (verb, usually with can/could)","gloss":"dovolit si (finančně)","example":"I would love to buy a new laptop, but I cannot afford it until I finish my summer job."},{"head":"\u003cstrong>overspend\u003c/strong> /ˌəʊvəˈspend/ AmE /ˌəʊvərˈspend/ (verb)","gloss":"přečerpat rozpočet, utratit víc, než je záhodno","example":"It is easy to overspend when you pay only with digital cards without seeing actual banknotes."},{"head":"\u003cstrong>faulty goods\u003c/strong> (faulty /ˈfɔːlti/) [plural]","gloss":"vadné zboží","example":"Consumer protection laws give buyers the right to return faulty goods within a statutory period."},{"head":"\u003cstrong>warranty\u003c/strong> /ˈwɒrənti/ AmE /ˈwɔːrənti/ [C/U]","gloss":"záruka (smluvní či obchodní záruka; zákonná práva z vadného plnění v ČR chrání kupujícího, projeví-li se vada do 24 měsíců)","example":"The new smartphone comes with a standard two-year warranty covering manufacturing defects."},{"head":"\u003cstrong>delivery fee\u003c/strong> (delivery /dɪˈlɪvəri/; fee /fiː/) [C]","gloss":"poplatek za doručení, poštovné","example":"E-shops frequently offer free shipping if your purchase exceeds a certain amount, saving you the delivery fee."},{"head":"\u003cstrong>customer service\u003c/strong> /ˌkʌstəmə ˈsɜːvɪs/ AmE /ˌkʌstəmər ˈsɜːrvɪs/ [U]","gloss":"zákaznický servis","example":"Polite and responsive customer service can turn a disappointed shopper into a loyal customer."},{"head":"\u003cstrong>second-hand\u003c/strong> /ˌsekənd ˈhænd/ (adjective)","gloss":"použitý, z druhé ruky","example":"Buying second-hand books and vintage clothes has become very trendy among teenagers."},{"head":"\u003cstrong>chain store\u003c/strong> /ˈtʃeɪn stɔː(r)/ AmE /ˈtʃeɪn stɔːr/ [C]","gloss":"prodejna obchodního řetězce","example":"Most large shopping malls are dominated by international chain stores selling identical fashion."},{"head":"\u003cstrong>financial literacy\u003c/strong> (literacy /ˈlɪtərəsi/) [U]","gloss":"finanční gramotnost","example":"Developing basic financial literacy at secondary school helps young adults avoid dangerous debts."},{"head":"\u003cstrong>rip-off\u003c/strong> /ˈrɪp ɒf/ AmE /ˈrɪp ɔːf/ [C, informal]","gloss":"předražená věc, zlodějina","example":"Charging ten euros for a bottle of tap water at the airport is a total rip-off."},{"head":"\u003cstrong>convenience\u003c/strong> /kənˈviːniəns/ [U]","gloss":"pohodlí, výhodnost","example":"The greatest advantage of online shopping is sheer convenience: you order from your bed at midnight."}],"answer":["In our everyday lives, money and shopping play an essential role, and how we handle them changes rapidly. As a secondary school student, I do not have a full income yet, but managing \u003cstrong>pocket money\u003c/strong> and earnings from a summer \u003cstrong>part-time job\u003c/strong> has taught me the importance of personal \u003cstrong>financial literacy\u003c/strong>. To avoid reckless habits, I try to keep a simple monthly \u003cstrong>budget\u003c/strong>. It is remarkably easy to \u003cstrong>overspend\u003c/strong> if you constantly pay with virtual cards and mobile apps, because digital transactions feel less real than paying \u003cstrong>in cash\u003c/strong>. Putting aside even a small portion of money into \u003cstrong>savings\u003c/strong> gives me a reassuring sense of independence.","When it comes to consumer habits, patterns among young people have shifted dramatically towards e-commerce. The \u003cstrong>convenience\u003c/strong> of ordering clothes or school supplies online with next-day delivery is hard to resist, especially when e-shops waive the \u003cstrong>delivery fee\u003c/strong>. On the other hand, I still enjoy visiting a traditional \u003cstrong>brick-and-mortar shop\u003c/strong>, particularly when buying shoes or clothing, because you can inspect the quality and try items on before paying.","Services and consumer rights are another crucial area. Whenever we buy electronics or more expensive items, keeping the \u003cstrong>receipt\u003c/strong> is vital. If you receive \u003cstrong>faulty goods\u003c/strong>, consumer protection laws provide statutory rights if a defect appears within two years, alongside any store \u003cstrong>warranty\u003c/strong>. Customers can usually request repair or replacement first, and if the seller cannot resolve the issue, they may obtain a price reduction or a full \u003cstrong>refund\u003c/strong>. In my experience, good \u003cstrong>customer service\u003c/strong> makes all the difference when resolving complaints. Ultimately, learning to spend thoughtfully, spotting a genuine \u003cstrong>bargain\u003c/strong>, and avoiding unnecessary debts are fundamental life skills every young adult needs."],"answer_info":"","questions":[{"cat":"Popis","text":"How do most teenagers in your country typically manage their money and monthly expenses?"},{"cat":"Srovnání","text":"What are the main differences between shopping online and buying goods in a traditional brick-and-mortar shop?"},{"cat":"Zkušenost","text":"What was the best bargain you have ever found, or conversely, a purchase that turned out to be a complete rip-off?"},{"cat":"Názor","text":"Why do some economists warn that a completely cashless society could create difficulties for certain groups of people?"},{"cat":"Popis procesu","text":"What steps should a customer take if they purchase an appliance that stops working after a few weeks?"},{"cat":"Hypotéza","text":"If your secondary school introduced a compulsory course on personal finance and investing, what key topics should it cover?"},{"cat":"Názor","text":"How does aggressive advertising on social media influence the shopping decisions of young people today?"}],"phrases":[{"head":"\u003cstrong>When it comes to personal finance,...\u003c/strong>","gloss":"Pokud jde o osobní finance,...","note":"uvedení tématu"},{"head":"\u003cstrong>From my point of view,...\u003c/strong>","gloss":"Z mého úhlu pohledu...","note":"vyjádření názoru"},{"head":"\u003cstrong>There is no denying that...\u003c/strong>","gloss":"Nelze popřít, že...","note":"přiznání zřejmého faktu"},{"head":"\u003cstrong>On the one hand..., on the other hand...\u003c/strong>","gloss":"Na jedné straně..., na druhé straně...","note":"vážení protikladů"},{"head":"\u003cstrong>A major advantage of this approach is...\u003c/strong>","gloss":"Hlavní výhodou tohoto přístupu je...","note":"zdůraznění pozitiva"},{"head":"\u003cstrong>In case something goes wrong,...\u003c/strong>","gloss":"V případě, že se něco pokazí,...","note":"podmínka / řešení"},{"head":"\u003cstrong>To sum up, the key to sensible spending is...\u003c/strong>","gloss":"Abych to shrnul, klíčem k rozumnému utrácení je...","note":"závěr"}],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>pocket money\u003c/strong> /ˈpɒkɪt mʌni/ AmE /ˈpɑːkɪt mʌni/ [U; B1]","gloss":"kapesné","example":"My parents give me a fixed amount of pocket money each month to pay for my leisure activities."},{"head":"\u003cstrong>physical shop\u003c/strong> (noun phrase; B1 + A1)","gloss":"kamenný obchod","example":"Physical shops let customers see if clothes fit."},{"head":"\u003cstrong>receipt\u003c/strong> /rɪˈsiːt/ [C; B1]","gloss":"účtenka, pokladní doklad","example":"Always keep your receipt, because you might need to exchange an item."},{"head":"\u003cstrong>get your money back\u003c/strong> (phrase; A1 + A2)","gloss":"dostat zpět peníze (při reklamaci)","example":"The gadget was broken, so the customer got their money back immediately."},{"head":"\u003cstrong>in cash\u003c/strong> (phrase; A2)","gloss":"v hotovosti","example":"Some small farmers at the Saturday market still accept payments only in cash."},{"head":"\u003cstrong>save\u003c/strong> (verb; A2)","gloss":"šetřit, ušetřit (peníze)","example":"He decided to save ten percent of what he earns each month."},{"head":"\u003cstrong>afford\u003c/strong> /əˈfɔːd/ AmE /əˈfɔːrd/ (verb, usually with can/could; B1)","gloss":"dovolit si (finančně)","example":"I would love to buy a new laptop, but I cannot afford it until I finish my summer job."},{"head":"\u003cstrong>spend too much\u003c/strong> (phrase; A1)","gloss":"utratit víc, než je záhodno","example":"You can easily spend too much when you only pay by card."},{"head":"\u003cstrong>goods that do not work or are badly made\u003c/strong> (noun phrase; A1 + A2)","gloss":"vadné zboží (\u003cem>faulty goods\u003c/em>)","example":"Buyers can return goods that do not work or are badly made."},{"head":"\u003cstrong>customer service\u003c/strong> /ˌkʌstəmə ˈsɜːvɪs/ AmE /ˌkʌstəmər ˈsɜːrvɪs/ [U; B1]","gloss":"zákaznický servis","example":"Polite, quick and helpful customer service can change a disappointed shopper into a customer who keeps coming back."},{"head":"\u003cstrong>used\u003c/strong> (adjective; B1)","gloss":"použitý, z druhé ruky","example":"Buying used books and clothes has become very trendy among teenagers."},{"head":"\u003cstrong>convenient\u003c/strong> (adjective; B1)","gloss":"pohodlný, výhodný (snadný a rychlý)","example":"Online shopping is convenient: you order from your bed at midnight."}],"answer":["As a student, I have \u003cstrong>pocket money\u003c/strong> and money from a summer job. I try to make a simple plan for my money every month. You can easily \u003cstrong>spend too much\u003c/strong> with digital cards and apps, because it feels less real than paying \u003cstrong>in cash\u003c/strong>. If I \u003cstrong>save\u003c/strong> even a small amount, I feel independent.","Young people now buy much more online. Ordering clothes online is \u003cstrong>convenient\u003c/strong> when they arrive the next day, especially if e-shops deliver for free. On the other hand, I still enjoy visiting a traditional \u003cstrong>physical shop\u003c/strong> for shoes or clothes. There you can check the quality and see if things fit before paying.","When we buy electronic or more expensive things, keeping the \u003cstrong>receipt\u003c/strong> is very important. If you get \u003cstrong>goods that do not work or are badly made\u003c/strong>, the law protects you. This is true when the problem appears within two years. Customers can usually ask for a repair or new goods first. If the shop cannot do this, they may get a lower price or \u003cstrong>get their money back\u003c/strong>. Good \u003cstrong>customer service\u003c/strong> is very important when a shop deals with complaints. In the end, every young adult needs to learn to spend carefully."],"questions":[{"cat":"Popis","text":"How do most teenagers in your country usually manage their money? \u003cem>(the things they pay for every month)\u003c/em>"},{"cat":"Srovnání","text":"What are the main differences between shopping online and in a traditional physical shop?"},{"cat":"Zkušenost","text":"What is the best thing you have ever bought for a really good price? \u003cem>(or something that later turned out to cost far more than it should)\u003c/em>"},{"cat":"Názor","text":"Why could a society without any cash create problems for some groups of people?"},{"cat":"Popis procesu","text":"What should a customer do if a new machine for the home stops working? \u003cem>(after only a few weeks)\u003c/em>"},{"cat":"Hypotéza","text":"If your school started a course about money for all students, what should it teach? \u003cem>(managing your own money, investing)\u003c/em>"},{"cat":"Názor","text":"How does advertising on social media influence what young people buy today? \u003cem>(especially adverts that try very hard to make people buy things)\u003c/em>"}],"phrases":[{"head":"\u003cstrong>When I think about my own money,...\u003c/strong>","gloss":"Když přemýšlím o svých penězích,...","note":"uvedení tématu"},{"head":"\u003cstrong>From my point of view,...\u003c/strong>","gloss":"Z mého úhlu pohledu...","note":"vyjádření názoru"},{"head":"\u003cstrong>It is clear that...\u003c/strong>","gloss":"Je jasné, že...","note":"přiznání zřejmého faktu"},{"head":"\u003cstrong>..., but on the other hand,...\u003c/strong>","gloss":"..., ale na druhé straně,...","note":"vážení protikladů"},{"head":"\u003cstrong>A major advantage of doing it this way is...\u003c/strong>","gloss":"Hlavní výhodou tohoto postupu je...","note":"zdůraznění pozitiva"},{"head":"\u003cstrong>If something goes wrong,...\u003c/strong>","gloss":"Pokud se něco pokazí,...","note":"podmínka / řešení"},{"head":"\u003cstrong>In conclusion, the key to sensible spending is...\u003c/strong>","gloss":"Závěrem: klíčem k rozumnému utrácení je...","note":"závěr"}]},"codes":["SSO 17","SSO 20","CR 10a"],"groups":["cr","sso"],"rank":{"cr":20,"sso":34,"all":20.5}},{"file":"doplnek-o17-souvenirs.md","title":"Doplněk: Typical Czech and English Souvenirs","label":"Navrhla AI, schválil učitel (7. 11. 2026).","vocab":[{"head":"\u003cstrong>wrap\u003c/strong> /ræp/ (verb; B1)","gloss":"zabalit (dárek, zboží)","example":"Shop assistants carefully wrap fragile glass in bubble wrap and tissue paper."},{"head":"\u003cstrong>basket\u003c/strong> /ˈbɑːskɪt/ AmE /ˈbæskɪt/ [C; B1]","gloss":"košík, dárkový koš","example":"A wicker gift basket filled with English tea and biscuits makes a lovely present."},{"head":"\u003cstrong>precious\u003c/strong> /ˈpreʃəs/ (adjective; B2)","gloss":"drahocenný, vzácný","example":"This small gift is precious to me because my grandmother chose it."},{"head":"\u003cstrong>genuine\u003c/strong> /ˈdʒenjuɪn/ (adjective; B2)","gloss":"pravý, nefalšovaný","example":"I asked the seller how I could check that the handmade vase was genuine."},{"head":"\u003cstrong>vase\u003c/strong> /vɑːz/ AmE /veɪs/ [C; B1]","gloss":"váza","example":"A hand-cut Bohemian crystal vase makes an elegant wedding or anniversary gift."},{"head":"\u003cstrong>pottery\u003c/strong> /ˈpɒtəri/ AmE /ˈpɑːtəri/ [U; B2]","gloss":"keramika, hrnčířské výrobky","example":"I would like to buy some handmade pottery from a local workshop."},{"head":"\u003cstrong>craft\u003c/strong> /krɑːft/ AmE /kræft/ [C or U; B2]","gloss":"řemeslo, ruční výroba","example":"At a workshop, I would like to learn a traditional craft from an experienced maker."},{"head":"\u003cstrong>tin\u003c/strong> /tɪn/ [C; B2]","gloss":"plechová dóza s víkem (např. na sušenky)","example":"I would keep homemade biscuits in this decorative tin after the holiday."},{"head":"\u003cstrong>stall\u003c/strong> /stɔːl/ [C; B1]","gloss":"stánek (na trhu)","example":"I stopped at a market stall to look for a small gift."},{"head":"\u003cstrong>memory\u003c/strong> /ˈmeməri/ [C; B1]","gloss":"vzpomínka","example":"A well-chosen gift keeps the memory of a foreign trip alive for many years."}],"answer":["I prefer souvenirs that keep a pleasant \u003cstrong>memory\u003c/strong> of a trip. Czech glass would be a beautiful present for my family. I would choose a small \u003cstrong>vase\u003c/strong> and ask the assistant to \u003cstrong>wrap\u003c/strong> it carefully. I might also look for handmade \u003cstrong>pottery\u003c/strong> at a market \u003cstrong>stall\u003c/strong> and ask about the maker's \u003cstrong>craft\u003c/strong>. From England, I would bring a \u003cstrong>basket\u003c/strong> of tea and biscuits, or a china mug for someone who enjoys hot drinks. A decorative \u003cstrong>tin\u003c/strong> could hold biscuits later. I would choose something \u003cstrong>genuine\u003c/strong> and useful; a modest gift can be \u003cstrong>precious\u003c/strong> because of the person who gives it."],"answer_info":"","questions":[{"cat":"","text":"\u003cstrong>Which Czech souvenirs would you recommend to a foreign friend, and how would you check their quality and origin?\u003c/strong> \u003cem>(glassware or pottery; asking about the maker, comparing products and prices)\u003c/em>"},{"cat":"","text":"\u003cstrong>What gifts would you choose on a visit to England, and who would receive them?\u003c/strong> \u003cem>(tea, a mug or a gift basket; the recipient's tastes, price and luggage space)\u003c/em>"},{"cat":"","text":"\u003cstrong>Which type of holiday souvenir do you prefer to give or receive—practical items, edible local specialities, or decorative objects—and why?\u003c/strong> \u003cem>(personal tastes, edible gifts, useful objects and lasting keepsakes)\u003c/em>"}],"phrases":[],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>mean a lot\u003c/strong> (phrase; B1)","gloss":"znamenat pro někoho hodně, mít pro někoho velkou cenu","example":"This gift means a lot to me because my grandmother chose it."},{"head":"\u003cstrong>vase\u003c/strong> /vɑːz/ AmE /veɪs/ [C; B1]","gloss":"váza","example":"A Bohemian glass vase makes a beautiful wedding gift."},{"head":"\u003cstrong>pottery\u003c/strong> /ˈpɒtəri/ AmE /ˈpɑːtəri/ [U; slovo k tématu, C1]","gloss":"keramika, hrnčířské výrobky","example":"I would like to buy some local pottery."},{"head":"\u003cstrong>metal box\u003c/strong> [C; A2 + A1]","gloss":"plechová krabice, dóza s víkem (např. na sušenky)","example":"I would keep biscuits in this metal box after the holiday."},{"head":"\u003cstrong>memory\u003c/strong> /ˈmeməri/ [C; A2]","gloss":"vzpomínka","example":"A carefully chosen gift keeps the memory of a foreign trip for many years."}],"answer":["I prefer souvenirs that keep a pleasant \u003cstrong>memory\u003c/strong> of a trip. Czech glass would be a beautiful present for my family. I would choose a small \u003cstrong>vase\u003c/strong>. I might also look for \u003cstrong>pottery\u003c/strong> at a market. From England, I would bring tea and biscuits, or a china mug. A \u003cstrong>metal box\u003c/strong> could hold biscuits later. I would choose something real and useful. A small gift can \u003cstrong>mean a lot\u003c/strong> because of the person who gives it."],"questions":[{"cat":"","text":"\u003cstrong>Which Czech souvenirs would you recommend to a foreign friend?\u003c/strong> \u003cem>(Czech glass or pottery; how you would check their quality and where they come from: asking who made them, comparing products and prices)\u003c/em>"},{"cat":"","text":"\u003cstrong>What gifts would you choose on a visit to England?\u003c/strong> \u003cem>(who would receive them; tea or a mug; what the person likes, price and luggage space)\u003c/em>"},{"cat":"","text":"\u003cstrong>Which type of holiday souvenir do you prefer to give or receive?\u003c/strong> \u003cem>(practical items, special local food or objects that are nice to look at; what you like, gifts that you can eat, useful objects and things that you keep for a long time to remember a trip; your reasons)\u003c/em>"}],"phrases":[]},"codes":["SSO 17"],"groups":["sso"],"rank":{"sso":34,"all":34}},{"file":"tema-s23-media-and-communication.md","title":"Media and communication","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu.","vocab":[{"head":"\u003cstrong>mass media\u003c/strong> (mass /mæs/) [plural or singular]","gloss":"masová média, hromadné sdělovací prostředky","example":"Mass media play a fundamental role in shaping public opinion and informing citizens."},{"head":"\u003cstrong>broadsheet\u003c/strong> /ˈbrɔːdʃiːt/ [C]","gloss":"seriózní noviny (zaměřené na hlubší analýzy a politiku)","example":"Educated readers usually prefer a broadsheet with in-depth reporting over superficial tabloids."},{"head":"\u003cstrong>tabloid\u003c/strong> /ˈtæblɔɪd/ [C]","gloss":"bulvární tisk, bulvár","example":"Tabloids attract readers with celebrity scandals, dramatic headlines, and sensational photographs."},{"head":"\u003cstrong>fake news\u003c/strong> /ˌfeɪk ˈnjuːz/ AmE /ˌfeɪk ˈnuːz/ [U]","gloss":"falešné zprávy, dezinformace","example":"Social media algorithms can rapidly spread fake news before fact-checkers have time to react."},{"head":"\u003cstrong>media literacy\u003c/strong> (literacy /ˈlɪtərəsi/) [U]","gloss":"mediální gramotnost","example":"Teaching media literacy in secondary schools helps teenagers recognize manipulation and online propaganda."},{"head":"\u003cstrong>reliable source\u003c/strong> [C]","gloss":"důvěryhodný / spolehlivý zdroj","example":"Before sharing an alarming article online, always verify whether it comes from a reliable source."},{"head":"\u003cstrong>social media platform\u003c/strong> [C]","gloss":"platforma sociálních sítí","example":"Teens use almost every popular social media platform to chat, share photos, and follow news."},{"head":"\u003cstrong>headline\u003c/strong> /ˈhedlaɪn/ [C]","gloss":"novinový titulek","example":"A sensational headline is often designed to provoke an emotional reaction rather than inform."},{"head":"\u003cstrong>censorship\u003c/strong> /ˈsensəʃɪp/ AmE /ˈsensərʃɪp/ [U]","gloss":"cenzura","example":"Totalitarian regimes enforce strict censorship to silence political opposition and control information."},{"head":"\u003cstrong>freedom of speech\u003c/strong> (freedom /ˈfriːdəm/) [U]","gloss":"svoboda slova","example":"Freedom of speech is a cornerstone of every democratic society, allowing citizens to express opinions openly."},{"head":"\u003cstrong>bias\u003c/strong> /ˈbaɪəs/ [U/C]","gloss":"předpojatost, zaujatost","example":"Journalists must be trained to report objectively and avoid political bias in their news coverage."},{"head":"\u003cstrong>broadcast\u003c/strong> /ˈbrɔːdkɑːst/ AmE /ˈbrɔːdkæst/ [C/U; verb]","gloss":"vysílání, relace; vysílat","example":"The national television network broadcasts evening news at seven o'clock every day."},{"head":"\u003cstrong>commercial\u003c/strong> /kəˈmɜːʃl/ AmE /kəˈmɜːrʃl/ [C]","gloss":"reklama (televizní nebo rozhlasová)","example":"Viewers often switch channels when a long commercial break interrupts a film."},{"head":"\u003cstrong>screen time\u003c/strong> /ˈskriːn taɪm/ [U]","gloss":"čas strávený před obrazovkou","example":"Psychologists advise teenagers to limit their daily screen time to prevent poor sleep and anxiety."},{"head":"\u003cstrong>investigative journalism\u003c/strong> (investigative /ɪnˈvestɪɡətɪv/ AmE /ɪnˈvestɪɡeɪtɪv/; journalism /ˈdʒɜːnəlɪzəm/ AmE /ˈdʒɜːrnəlɪzəm/) [U]","gloss":"investigativní žurnalistika","example":"Rigorous investigative journalism exposes political corruption and corporate misconduct."},{"head":"\u003cstrong>influencer\u003c/strong> /ˈɪnfluənsə/ AmE /ˈɪnfluənsər/ [C]","gloss":"influencer (tvůrce obsahu na sociálních sítích s velkým vlivem)","example":"Many fashion brands collaborate with a prominent influencer to promote new cosmetic lines."},{"head":"\u003cstrong>echo chamber\u003c/strong> /ˈekəʊ tʃeɪmbə(r)/ AmE /ˈekəʊ tʃeɪmbər/ [C]","gloss":"názorová bublina (prostředí, kde se setkáváme jen s názory, se kterými souhlasíme)","example":"Social networks tend to trap users in an echo chamber where opposing viewpoints are filtered out."},{"head":"\u003cstrong>cyberbullying\u003c/strong> /ˈsaɪbəbʊliɪŋ/ AmE /ˈsaɪbərbʊliɪŋ/ [U]","gloss":"kyberšikana","example":"Anonymous online harassment and cyberbullying can cause severe emotional harm to young victims."},{"head":"\u003cstrong>verify information\u003c/strong> (verify /ˈverɪfaɪ/) (phrase)","gloss":"ověřovat informace","example":"Critical readers take time to verify information across multiple independent news outlets."},{"head":"\u003cstrong>clickbait\u003c/strong> /ˈklɪkbeɪt/ [U]","gloss":"clickbait, lákavý obsah či titulek (senzacechtivý obsah určený k nalákání ke kliknutí)","example":"Clickbait articles often exaggerate ordinary events simply to generate website traffic and advertising revenue."},{"head":"\u003cstrong>current affairs\u003c/strong> /ˌkʌrənt əˈfeəz/ AmE /ˌkɜːrənt əˈferz/ [plural]","gloss":"aktuální dění, současné události (POZOR na falešného přítele: \u003cem>actual ≠ aktuální!\u003c/em> Aktuální je \u003cem>current\u003c/em>, zatímco \u003cem>actual\u003c/em> znamená skutečný/faktický)","example":"Listening to morning podcasts is a convenient way to stay updated on international current affairs."},{"head":"\u003cstrong>subscriber\u003c/strong> /səbˈskraɪbə(r)/ AmE /səbˈskraɪbər/ [C]","gloss":"předplatitel, odběratel","example":"Digital news sites offer exclusive articles and podcasts to each paying subscriber."}],"answer":["In our interconnected twenty-first-century world, media and communication influence almost every choice we make. How people receive information has changed beyond recognition within a single generation. While our parents grew up reading paper newspapers or watching the evening television \u003cstrong>broadcast\u003c/strong>, my generation consumes information almost exclusively through smartphones and social networks.","Social media platforms have transformed everyday communication, offering clear benefits alongside serious risks. On the positive side, following international journalists and listening to news podcasts allows us to stay informed about global \u003cstrong>current affairs\u003c/strong> in real time. We can connect with friends and share creative content instantly. However, there is also a dark side to this constant digital connection. Algorithms frequently trap users in an ideological \u003cstrong>echo chamber\u003c/strong>, reinforcing prejudices and promoting sensational \u003cstrong>clickbait\u003c/strong> designed solely to collect views.","Even more concerning is the explosion of \u003cstrong>fake news\u003c/strong> and online manipulation. In an era where anyone can post anything online or become an \u003cstrong>influencer\u003c/strong>, telling true facts from lies is a real challenge. That is why developing strong \u003cstrong>media literacy\u003c/strong> in secondary school is vital for our generation. We need to learn how to \u003cstrong>verify information\u003c/strong> carefully and check if an article comes from a \u003cstrong>reliable source\u003c/strong>. While we must protect \u003cstrong>freedom of speech\u003c/strong> against political \u003cstrong>censorship\u003c/strong>, we also need to be responsible digital citizens. Ultimately, learning to manage our \u003cstrong>screen time\u003c/strong> and reading critically ensures that technology serves us, rather than controlling our minds."],"answer_info":"","questions":[{"cat":"Popis","text":"How has the way young people consume news changed compared to older generations?"},{"cat":"Srovnání","text":"In what ways do sensational tabloids differ from quality broadsheets in terms of journalistic standards?"},{"cat":"Zkušenost","text":"How do you personally decide whether a piece of news you encounter on social media is trustworthy or fake?"},{"cat":"Názor","text":"Why do social media algorithms tend to create echo chambers for their users?"},{"cat":"Popis","text":"What are the most serious psychological dangers associated with excessive screen time and cyberbullying among teenagers?"},{"cat":"Hypotéza","text":"If all traditional print newspapers ceased publication next year, what consequences would that have for society and older readers?"},{"cat":"Názor / etika","text":"Where should society draw the line between protecting freedom of speech and restricting harmful disinformation or hate speech online?"}],"phrases":[{"head":"\u003cstrong>In our fast-paced digital world,...\u003c/strong>","gloss":"V našem uspěchaném digitálním světě,...","note":"úvodní zamyšlení"},{"head":"\u003cstrong>One of the greatest dangers of social media is...\u003c/strong>","gloss":"Jedním z největších nebezpečí sociálních sítí je...","note":"pojmenování rizika"},{"head":"\u003cstrong>When evaluating the credibility of a news story,...\u003c/strong>","gloss":"Při vyhodnocování věrohodnosti zprávy...","note":"kritické myšlení"},{"head":"\u003cstrong>On the one hand..., on the other hand...\u003c/strong>","gloss":"Na jedné straně..., na druhé straně...","note":"vážení kladů a záporů"},{"head":"\u003cstrong>It is essential for young people to...\u003c/strong>","gloss":"Je nezbytné, aby mladí lidé...","note":"doporučení"},{"head":"\u003cstrong>From my personal perspective,...\u003c/strong>","gloss":"Z mého osobního pohledu...","note":"vyjádření postoje"},{"head":"\u003cstrong>To sum up, media literacy helps us...\u003c/strong>","gloss":"Abych to shrnul, mediální gramotnost nám pomáhá...","note":"závěrečné shrnutí"}],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>media\u003c/strong> [plural or singular; A2]","gloss":"masová média, hromadné sdělovací prostředky (the media)","example":"The media strongly influence public opinion and give people information."},{"head":"\u003cstrong>tabloid\u003c/strong> /ˈtæblɔɪd/ [C; slovo k tématu, C1]","gloss":"bulvární tisk, bulvár","example":"Tabloids attract readers with stories about celebrities, exciting headlines and photographs."},{"head":"\u003cstrong>serious newspaper\u003c/strong> (noun phrase; B1 + A1)","gloss":"seriózní noviny (zaměřené na hlubší analýzy a politiku)","example":"Educated readers usually prefer a serious newspaper to a tabloid."},{"head":"\u003cstrong>false news\u003c/strong> (noun phrase; A1 + A1)","gloss":"falešné zprávy, dezinformace (běžně se říká \u003cem>fake news\u003c/em>)","example":"False news can spread fast before people who check facts can react."},{"head":"\u003cstrong>reliable source\u003c/strong> [C; B1]","gloss":"důvěryhodný / spolehlivý zdroj","example":"Before sharing a frightening article online, always check whether it comes from a reliable source."},{"head":"\u003cstrong>social media\u003c/strong> [U; A2]","gloss":"sociální sítě","example":"Teenagers use social media to chat, share photos and get news."},{"head":"\u003cstrong>headline\u003c/strong> /ˈhedlaɪn/ [C; B1]","gloss":"novinový titulek","example":"Some headlines are written to cause strong emotions, not to give information."},{"head":"\u003cstrong>censorship\u003c/strong> /ˈsensəʃɪp/ AmE /ˈsensərʃɪp/ [U; slovo k tématu, C1]","gloss":"cenzura","example":"Governments with total power use censorship to control information and stop people who disagree with them from speaking."},{"head":"\u003cstrong>commercial\u003c/strong> /kəˈmɜːʃl/ AmE /kəˈmɜːrʃl/ [C; B1]","gloss":"reklama (televizní nebo rozhlasová)","example":"Viewers often switch channels when a film has a long commercial break."},{"head":"\u003cstrong>influencer\u003c/strong> /ˈɪnfluənsə/ AmE /ˈɪnfluənsər/ [C; slovo k tématu, C1]","gloss":"influencer (tvůrce obsahu na sociálních sítích s velkým vlivem)","example":"Many fashion brands work with a famous influencer to promote new products."},{"head":"\u003cstrong>cyberbullying\u003c/strong> /ˈsaɪbəbʊliɪŋ/ AmE /ˈsaɪbərbʊliɪŋ/ [U; slovo k tématu, bez úrovně]","gloss":"kyberšikana","example":"Cyberbullying can cause serious problems for the mental health of young victims."},{"head":"\u003cstrong>check information\u003c/strong> (phrase; A1 + A1)","gloss":"ověřovat informace","example":"Readers who think carefully check information in several news sources."},{"head":"\u003cstrong>current\u003c/strong> (adjective; B1)","gloss":"aktuální, současný (POZOR na falešného přítele: \u003cem>actual ≠ aktuální!\u003c/em> Aktuální je \u003cem>current\u003c/em>, zatímco \u003cem>actual\u003c/em> znamená skutečný/faktický)","example":"Morning podcasts are a convenient way to learn about current world events."}],"answer":["In the twenty-first century, \u003cstrong>media\u003c/strong> and communication influence almost every choice we make. When our parents were young, they read paper newspapers or watched the evening news on television. My generation gets almost all its information through smartphones and \u003cstrong>social media\u003c/strong>.","\u003cstrong>Social media\u003c/strong> have changed everyday communication completely. On the positive side, we can read what international journalists post and listen to news podcasts. This way, we learn about \u003cstrong>current\u003c/strong> world events as they happen. However, the systems that choose what users see often show them only opinions that they already agree with.","An even bigger problem is the huge increase in \u003cstrong>false news\u003c/strong> and in efforts to control what people think online. Anyone can post anything online or become an \u003cstrong>influencer\u003c/strong>, so knowing what is true is a real challenge. That is why learning to understand the \u003cstrong>media\u003c/strong> well at secondary school is very important. We need to learn how to \u003cstrong>check information\u003c/strong> carefully and find out if an article comes from a \u003cstrong>reliable source\u003c/strong>. We must protect the right to say what we think from political \u003cstrong>censorship\u003c/strong>. If we manage our time in front of screens and think about what we read, technology will help us."],"questions":[{"cat":"Popis","text":"How has the way young people get news changed compared to older generations?"},{"cat":"Srovnání","text":"How are tabloids different from serious newspapers in the standards of their articles?"},{"cat":"Zkušenost","text":"How do you personally decide if news on social media is reliable or false?"},{"cat":"Názor","text":"Why do social media users often see only opinions that they agree with?"},{"cat":"Popis","text":"What are the most serious dangers of too much time on screens and cyberbullying? \u003cem>(for teenagers' mental health)\u003c/em>"},{"cat":"Hypotéza","text":"If all paper newspapers closed, how would that affect society and older readers?"},{"cat":"Názor / etika","text":"How far should society limit what people can say online? \u003cem>(protecting the right to say what you think, limiting false news that can hurt people or messages full of hate towards groups of people)\u003c/em>"}],"phrases":[{"head":"\u003cstrong>In our busy digital world,...\u003c/strong>","gloss":"V našem uspěchaném digitálním světě,...","note":"úvodní zamyšlení"},{"head":"\u003cstrong>One of the greatest dangers of social media is...\u003c/strong>","gloss":"Jedním z největších nebezpečí sociálních sítí je...","note":"pojmenování rizika"},{"head":"\u003cstrong>When I decide if a news story is reliable,...\u003c/strong>","gloss":"Když posuzuji, zda je zpráva věrohodná,...","note":"kritické myšlení"},{"head":"\u003cstrong>..., but on the other hand,...\u003c/strong>","gloss":"..., ale na druhé straně,...","note":"vážení kladů a záporů"},{"head":"\u003cstrong>It is essential for young people to...\u003c/strong>","gloss":"Je nezbytné, aby mladí lidé...","note":"doporučení"},{"head":"\u003cstrong>In my personal opinion,...\u003c/strong>","gloss":"Podle mého osobního názoru...","note":"vyjádření postoje"},{"head":"\u003cstrong>In conclusion, a good understanding of the media helps us...\u003c/strong>","gloss":"Závěrem: dobré porozumění médiím nám pomáhá...","note":"závěrečné shrnutí"}]},"codes":["SSO 19","SSO 21","CR 14a"],"groups":["cr","sso"],"rank":{"cr":28,"sso":38,"all":28.5}},{"file":"doplnek-o20-services-and-payment.md","title":"Doplněk: Everyday Services and Payment Methods","label":"Navrhla AI, schválil učitel (7. 11. 2026).","vocab":[{"head":"\u003cstrong>hairdresser\u003c/strong> /ˈheədresə(r)/ AmE /ˈherdresər/ [C; B1]","gloss":"kadeřník, kadeřnice","example":"I would phone the hairdresser to ask for an appointment."},{"head":"\u003cstrong>barber\u003c/strong> /ˈbɑːbə/ AmE /ˈbɑːrbər/ [C; B1]","gloss":"holič, pánský kadeřník","example":"A modern barber trims men's hair and beards in a traditional barbershop."},{"head":"\u003cstrong>plumber\u003c/strong> /ˈplʌmə/ AmE /ˈplʌmər/ [C; B2]","gloss":"instalatér, instalatérka","example":"When a water pipe burst under the kitchen sink, we had to call an emergency plumber."},{"head":"\u003cstrong>electrician\u003c/strong> /ɪˌlekˈtrɪʃn/ [C; B2]","gloss":"elektrikář, elektrikářka","example":"Only a qualified electrician should install new wiring or sockets in a house."},{"head":"\u003cstrong>fix\u003c/strong> /fɪks/ (verb; B1)","gloss":"opravit, spravit","example":"A reliable local garage can fix the brakes and change the tyres before winter."},{"head":"\u003cstrong>parcel\u003c/strong> /ˈpɑːsl/ AmE /ˈpɑːrsl/ [C; B1]","gloss":"balík, zásilka","example":"I checked the collection instructions before going to pick up my parcel."},{"head":"\u003cstrong>deliver\u003c/strong> /dɪˈlɪvə/ AmE /dɪˈlɪvər/ (verb; B1)","gloss":"doručit","example":"Couriers deliver online orders directly to your doorstep or to a nearby pick-up point."},{"head":"\u003cstrong>transfer\u003c/strong> /ˈtrænsfɜː(r)/ AmE /ˈtrænsfɜːr/ [C or U; B2]","gloss":"převod (bankovní)","example":"Scanning a QR code in a mobile banking app fills in the details for a bank transfer without typing account numbers."},{"head":"\u003cstrong>loan\u003c/strong> /ləʊn/ AmE /loʊn/ [C; B1]","gloss":"půjčka, úvěr","example":"My sister asked the bank about a loan to buy a car."},{"head":"\u003cstrong>coin\u003c/strong> /kɔɪn/ [C; B1]","gloss":"mince","example":"I found a coin in my pocket when I was looking for cash."}],"answer":["My busy lifestyle means I sometimes pay for services to save time. I book a \u003cstrong>hairdresser\u003c/strong> or \u003cstrong>barber\u003c/strong>, and call a \u003cstrong>plumber\u003c/strong> or \u003cstrong>electrician\u003c/strong> to \u003cstrong>fix\u003c/strong> problems at home. For online shopping, I check where the seller can \u003cstrong>deliver\u003c/strong> my \u003cstrong>parcel\u003c/strong>. I pay by card, cash or bank \u003cstrong>transfer\u003c/strong>. A payment QR code can fill in the details, which I check before confirming. Before taking out a \u003cstrong>loan\u003c/strong> or buying in instalments, I would compare the total cost and monthly payments. At a currency exchange office, I would check the rate and the amount I would receive. I keep some coins for small purchases."],"answer_info":"","questions":[{"cat":"","text":"\u003cstrong>Which everyday services — such as a hairdresser's, dry cleaner's, post office or repair shop — do you and your family use most regularly?\u003c/strong> \u003cem>(booking appointments online, using self-service parcel lockers instead of queuing at the post office, calling a plumber, electrician or car mechanic when needed)\u003c/em>"},{"cat":"","text":"\u003cstrong>What are the advantages and disadvantages of paying in cash compared with contactless cards, mobile wallets and QR bank transfers?\u003c/strong> \u003cem>(convenience, tracking spending, privacy, access to a bank account or phone, personal preferences)\u003c/em>"},{"cat":"","text":"\u003cstrong>What should a customer do if a service — for example a car repair, a haircut or a parcel delivery — is late or poorly done?\u003c/strong> \u003cem>(explaining the problem politely, showing the receipt or order confirmation, asking for the fault to be fixed free of charge or claiming a refund)\u003c/em>"}],"phrases":[],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>hairdresser\u003c/strong> /ˈheədresə(r)/ AmE /ˈherdresər/ [C; A2]","gloss":"kadeřník, kadeřnice","example":"I would phone the hairdresser to ask for an appointment."},{"head":"\u003cstrong>plumber\u003c/strong> /ˈplʌmə/ AmE /ˈplʌmər/ [C; slovo k tématu, B2]","gloss":"instalatér, instalatérka","example":"When water came out from under the kitchen sink, we had to call a plumber."},{"head":"\u003cstrong>electrician\u003c/strong> /ɪˌlekˈtrɪʃn/ [C; slovo k tématu, B2]","gloss":"elektrikář, elektrikářka","example":"Only a qualified electrician should do new electrical work in a house."},{"head":"\u003cstrong>fix\u003c/strong> /fɪks/ (verb; A2)","gloss":"opravit, spravit","example":"A reliable local garage can fix the car and change the tyres before winter."},{"head":"\u003cstrong>parcel\u003c/strong> /ˈpɑːsl/ AmE /ˈpɑːrsl/ [C; B1]","gloss":"balík, zásilka","example":"I read the instructions before I went to pick up my parcel."},{"head":"\u003cstrong>deliver\u003c/strong> /dɪˈlɪvə/ AmE /dɪˈlɪvər/ (verb; B1)","gloss":"doručit","example":"Online orders can be delivered to your home or to a place where you collect them."},{"head":"\u003cstrong>borrow\u003c/strong> (verb; A2)","gloss":"půjčit si","example":"My sister asked the bank about borrowing money for a car."},{"head":"\u003cstrong>coin\u003c/strong> /kɔɪn/ [C; B1]","gloss":"mince","example":"I found a coin in my pocket when I was looking for cash."}],"answer":["I sometimes pay for services to save time. I book a \u003cstrong>hairdresser\u003c/strong>, and I call a \u003cstrong>plumber\u003c/strong> or \u003cstrong>electrician\u003c/strong> to \u003cstrong>fix\u003c/strong> problems at home. For online shopping, I check where the seller can \u003cstrong>deliver\u003c/strong> my \u003cstrong>parcel\u003c/strong>. I pay by card, in cash or by bank transfer. When I pay with a QR code, I check the details first. Before I \u003cstrong>borrow\u003c/strong> money, I would compare the total cost and how much I would pay every month."],"questions":[{"cat":"","text":"\u003cstrong>Which everyday services do you and your family use most often?\u003c/strong> \u003cem>(a hairdresser, the post office or a repair shop; booking online, collecting parcels from a machine instead of queuing at the post office, calling a plumber, an electrician or a garage)\u003c/em>"},{"cat":"","text":"\u003cstrong>What is good and bad about paying in cash, by card or by QR code?\u003c/strong> \u003cem>(fast and easy, knowing how much you spend, other people seeing what you buy, having a bank account or a phone, what you like)\u003c/em>"},{"cat":"","text":"\u003cstrong>What should a customer do if a service is late or not done well?\u003c/strong> \u003cem>(for example a car repair, a haircut or delivering a parcel; explaining the problem politely, showing the receipt or the email that confirms the order, asking them to fix it for free or to give the money back)\u003c/em>"}],"phrases":[]},"codes":["SSO 20","CR 10a"],"groups":["cr","sso"],"rank":{"cr":20,"sso":40,"all":20.5}},{"file":"doplnek-o21-mass-media-history.md","title":"Doplněk: History of Mass Media","label":"Navrhla AI, schválil učitel (7. 11. 2026).","vocab":[{"head":"\u003cstrong>invent\u003c/strong> /ɪnˈvent/ (verb; B1)","gloss":"vynalézt","example":"For our media project, we would like to invent a new way to share school news."},{"head":"\u003cstrong>invention\u003c/strong> /ɪnˈvenʃn/ [C or U; B1]","gloss":"vynález","example":"The invention of the printing press is the topic of my presentation."},{"head":"\u003cstrong>print\u003c/strong> /prɪnt/ (verb; B2)","gloss":"vydávat tiskem (knihu, noviny ve velkém nákladu)","example":"The publisher plans to print a new edition of the newspaper next month."},{"head":"\u003cstrong>press\u003c/strong> /pres/ [U; B2]","gloss":"tisk (noviny a časopisy)","example":"In my opinion, the press should check facts before publishing a story."},{"head":"\u003cstrong>edition\u003c/strong> /ɪˈdɪʃn/ [C; B2]","gloss":"vydání (novin, knihy)","example":"I prefer the online edition of my favourite newspaper."},{"head":"\u003cstrong>editor\u003c/strong> /ˈedɪtə/ AmE /ˈedɪtər/ [C; B2]","gloss":"redaktor, šéfredaktor","example":"Our school newspaper's editor asked me to check the names in my article."},{"head":"\u003cstrong>inform\u003c/strong> /ɪnˈfɔːm/ AmE /ɪnˈfɔːrm/ (verb; B1)","gloss":"informovat","example":"Our school radio programme aims to inform students about upcoming events."},{"head":"\u003cstrong>viewer\u003c/strong> /ˈvjuːə/ AmE /ˈvjuːər/ [C; B2]","gloss":"televizní divák, divačka","example":"As a viewer, I like documentaries that explain how things work."},{"head":"\u003cstrong>satellite\u003c/strong> /ˈsætəlaɪt/ [C; B2]","gloss":"družice, satelit","example":"For a science project, I would like to study how a communications satellite works."},{"head":"\u003cstrong>network\u003c/strong> /ˈnetwɜːk/ AmE /ˈnetwɜːrk/ [C; B2]","gloss":"síť propojených částí (např. komunikační)","example":"The report describes a network of radio stations sharing programmes."}],"answer":["People continue to \u003cstrong>invent\u003c/strong> new ways to communicate. I find each \u003cstrong>invention\u003c/strong> interesting because it changes how stories reach us. Gutenberg used movable metal type to \u003cstrong>print\u003c/strong> his Bible in Mainz in the 1450s. Later, the \u003cstrong>press\u003c/strong>, radio and television offered different ways to \u003cstrong>inform\u003c/strong> audiences. Regular Czechoslovak radio broadcasting began on 18 May 1923. In 1989, while working at CERN, Tim Berners-Lee proposed the system that became the Web. Today an \u003cstrong>editor\u003c/strong> can prepare an online \u003cstrong>edition\u003c/strong> for a news \u003cstrong>network\u003c/strong>. As a \u003cstrong>viewer\u003c/strong>, I enjoy programmes about media history, and I would like to learn more about \u003cstrong>satellite\u003c/strong> broadcasting."],"answer_info":"","questions":[{"cat":"","text":"\u003cstrong>How would you compare producing a handwritten book with printing many copies?\u003c/strong> \u003cem>(time, effort, access to books; Gutenberg's Bible as a European example)\u003c/em>"},{"cat":"","text":"\u003cstrong>What differences do you notice between receiving news through newspapers, radio and television?\u003c/strong> \u003cem>(written text, sound, moving pictures, personal preferences and examples)\u003c/em>"},{"cat":"","text":"\u003cstrong>How has reading news online changed your habits, and how do you assess its reliability?\u003c/strong> \u003cem>(comparing sources, checking dates and authors, following a developing story)\u003c/em>"}],"phrases":[],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>invent\u003c/strong> /ɪnˈvent/ (verb; A2)","gloss":"vynalézt","example":"For our media project, we would like to invent a new way to share school news."},{"head":"\u003cstrong>invention\u003c/strong> /ɪnˈvenʃn/ [C or U; A2]","gloss":"vynález","example":"The invention of the printing machine is the topic of my presentation."},{"head":"\u003cstrong>print\u003c/strong> /prɪnt/ (verb; A2)","gloss":"vydávat tiskem (knihu, noviny ve velkém nákladu)","example":"The publisher plans to print the newspaper next month."},{"head":"\u003cstrong>press\u003c/strong> /pres/ [U; B1]","gloss":"tisk (noviny a časopisy)","example":"In my opinion, the press should check facts before publishing a story."},{"head":"\u003cstrong>version\u003c/strong> [C; B1]","gloss":"verze, podoba (např. online verze novin)","example":"I prefer the online version of my favourite newspaper."},{"head":"\u003cstrong>editor\u003c/strong> /ˈedɪtə/ AmE /ˈedɪtər/ [C; B1]","gloss":"redaktor, šéfredaktor","example":"Our school newspaper's editor asked me to check the names in my article."},{"head":"\u003cstrong>viewer\u003c/strong> /ˈvjuːə/ AmE /ˈvjuːər/ [C; B1]","gloss":"televizní divák, divačka","example":"As a viewer, I like documentaries that explain how things work."},{"head":"\u003cstrong>network\u003c/strong> /ˈnetwɜːk/ AmE /ˈnetwɜːrk/ [C; B1]","gloss":"síť propojených částí (např. komunikační)","example":"The report describes a network of radio stations that share programmes."},{"head":"\u003cstrong>CERN\u003c/strong> [vlastní jméno]","gloss":"CERN (Evropská organizace pro jaderný výzkum)","example":"Tim Berners-Lee was working at CERN in 1989."}],"answer":["I find each \u003cstrong>invention\u003c/strong> interesting because it changes how stories reach us. Gutenberg \u003cstrong>printed\u003c/strong> his Bible in Mainz in the 1450s with metal letters that could be moved. Later, the \u003cstrong>press\u003c/strong>, radio and television gave audiences information in different ways. Regular Czechoslovak radio programmes began on 18 May 1923. In 1989, when he was working at \u003cstrong>CERN\u003c/strong>, Tim Berners-Lee suggested the system that became the Web. Today an \u003cstrong>editor\u003c/strong> can prepare an online \u003cstrong>version\u003c/strong> for a news \u003cstrong>network\u003c/strong>."],"questions":[{"cat":"","text":"\u003cstrong>How would you compare producing books by hand with printing many copies?\u003c/strong> \u003cem>(time, effort, access to books; Gutenberg's Bible as a European example)\u003c/em>"},{"cat":"","text":"\u003cstrong>What differences do you notice between receiving news through newspapers, radio and television?\u003c/strong> \u003cem>(written text, sound, pictures that move, what you personally prefer and examples)\u003c/em>"},{"cat":"","text":"\u003cstrong>How has reading news online changed your habits?\u003c/strong> \u003cem>(how you decide if it is reliable: comparing sources, checking dates and authors, reading new information as a story develops)\u003c/em>"}],"phrases":[]},"codes":["SSO 21"],"groups":["sso"],"rank":{"sso":42,"all":42}},{"file":"tema-s18-usa-on-the-map.md","title":"The USA – on the map","label":"Navrhla AI (Gemini Flash – Gemini 3.8 Flash), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu.","vocab":[{"head":"\u003cstrong>contiguous states\u003c/strong> (contiguous /kənˈtɪɡjuəs/) [plural]","gloss":"souvislé státy, státy tvořící souvislé území (48 států USA se společnými hranicemi, bez oddělené Aljašky a ostrovní Havaje)","example":"The contiguous states span four different standard time zones from the Atlantic to the Pacific coast."},{"head":"\u003cstrong>mountain range\u003c/strong> [C]","gloss":"pohoří","example":"The Rocky Mountains form a massive mountain range dominating the western half of the continent."},{"head":"\u003cstrong>Great Plains\u003c/strong> [proper noun, plural]","gloss":"Velké planiny (rozsáhlé travnaté prérie ve střední části USA)","example":"The endless wheat fields of the Great Plains are often called the breadbasket of America."},{"head":"\u003cstrong>river basin\u003c/strong> (basin /ˈbeɪsn/) [C]","gloss":"povodí řeky","example":"The Mississippi-Missouri river basin drains water from over thirty states into the Gulf of Mexico."},{"head":"\u003cstrong>canyon\u003c/strong> /ˈkænjən/ [C]","gloss":"kaňon, hluboká soutěska","example":"Carved by the Colorado River over millions of years, the Grand Canyon is an awe-inspiring spectacle."},{"head":"\u003cstrong>Great Lakes\u003c/strong> [proper noun, plural]","gloss":"Velká jezera (Hořejší, Michiganské, Huronské, Erijské a Ontarijské)","example":"The Great Lakes along the Canadian border hold roughly one fifth of the world's surface fresh water."},{"head":"\u003cstrong>arid\u003c/strong> /ˈærɪd/ (adjective)","gloss":"suchý, vyprahlý (aridní)","example":"The arid deserts of Arizona and Nevada feature giant cacti and extreme daytime temperatures."},{"head":"\u003cstrong>peninsula\u003c/strong> /pəˈnɪnsjələ/ AmE /pəˈnɪnsələ/ [C]","gloss":"poloostrov","example":"Florida is a flat, marshy peninsula famous for the Everglades and tropical weather."},{"head":"\u003cstrong>subtropical\u003c/strong> /ˌsʌbˈtrɒpɪkl/ AmE /ˌsʌbˈtrɑːpɪkl/ (adjective)","gloss":"subtropický","example":"The southeastern states enjoy a humid subtropical climate with warm winters and long, hot summers."},{"head":"\u003cstrong>natural wonder\u003c/strong> [C]","gloss":"přírodní div","example":"Yellowstone was established as the world's first national park in 1872 to protect unique geysers and other natural wonders."},{"head":"\u003cstrong>national park\u003c/strong> /ˌnæʃnəl ˈpɑːk/ AmE /ˌnæʃnəl ˈpɑːrk/ [C]","gloss":"národní park","example":"Hiking enthusiasts visit Yosemite National Park to admire towering granite cliffs and giant sequoia trees."},{"head":"\u003cstrong>time zone\u003c/strong> /ˈtaɪm zəʊn/ [C]","gloss":"časové pásmo","example":"Because the country covers such vast distances, travelling across the US means adjusting through multiple time zones."},{"head":"\u003cstrong>fertile soil\u003c/strong> (fertile /ˈfɜːtaɪl/ AmE /ˈfɜːrtl/) [U]","gloss":"úrodná půda","example":"The Midwest is renowned for deep, fertile soil ideal for large-scale corn and soybean cultivation."},{"head":"\u003cstrong>tributary\u003c/strong> /ˈtrɪbjətri/ AmE /ˈtrɪbjəteri/ [C]","gloss":"přítok (řeky)","example":"The Ohio River is the largest eastern tributary flowing into the mighty Mississippi, providing its greatest volume of water."},{"head":"\u003cstrong>continental climate\u003c/strong> /ˌkɒntɪnentl ˈklaɪmət/ AmE /ˌkɑːntɪnentl ˈklaɪmət/ [C/U]","gloss":"vnitrozemské / kontinentální podnebí","example":"The interior states experience a pronounced continental climate with freezing winters and scorching summers."},{"head":"\u003cstrong>Tornado Alley\u003c/strong> (tornado /tɔːˈneɪdəʊ/ AmE /tɔːrˈneɪdəʊ/; alley /ˈæli/) [proper noun / U]","gloss":"tornádová alej (středozápadní oblast USA s častým výskytem tornád)","example":"Residents living in Tornado Alley often rely on storm cellars or safe interior rooms to protect against destructive springtime tornadoes."},{"head":"\u003cstrong>volcano\u003c/strong> /vɒlˈkeɪnəʊ/ AmE /vɑːlˈkeɪnoʊ/ [C]","gloss":"sopka","example":"The Hawaiian Islands were formed by active volcanoes rising from the Pacific ocean floor."},{"head":"\u003cstrong>glacier\u003c/strong> /ˈɡlæsiə(r)/ AmE /ˈɡleɪʃər/ [C]","gloss":"ledovec","example":"Alaska is celebrated for its pristine fjords, wilderness, and massive blue glaciers."},{"head":"\u003cstrong>gulf\u003c/strong> /ɡʌlf/ [C]","gloss":"záliv","example":"The warm waters of the Gulf of Mexico generate powerful tropical hurricanes in late summer."},{"head":"\u003cstrong>border on\u003c/strong> (border /ˈbɔːdə/ AmE /ˈbɔːrdər/) (verb)","gloss":"hraničit s","example":"The United States borders on Canada to the north and Mexico to the south."},{"head":"\u003cstrong>vast expanse\u003c/strong> (vast /vɑːst/ AmE /væst/; expanse /ɪkˈspæns/) [C]","gloss":"rozlehlá plocha, nesmírná rozloha","example":"Driving across the vast expanse of Texas takes hours of seeing nothing but straight highway."},{"head":"\u003cstrong>coastline\u003c/strong> /ˈkəʊstlaɪn/ [C/U]","gloss":"pobřeží","example":"The dramatic Pacific coastline along California features rugged cliffs dropping into ocean waves."}],"answer":["When looking at the physical map of the world, the United States of America is remarkable for its vast continental scale and geographic diversity. Covering roughly forty percent of North America, the United States \u003cstrong>borders on\u003c/strong> Canada to the north and Mexico to the south. It is washed by the Atlantic Ocean to the east and the Pacific Ocean to the west. The nation consists of fifty states: forty-eight \u003cstrong>contiguous states\u003c/strong> forming the continental mainland, the arctic wilderness of Alaska in the far north-west, and the tropical volcanic islands of Hawaii.","The physical terrain is dominated by two primary \u003cstrong>mountain ranges\u003c/strong>. In the east, the older, rounded Appalachian Mountains run parallel to the Atlantic \u003cstrong>coastline\u003c/strong>. Moving westward across the fertile agricultural flatlands of the Midwest and the expansive prairies of the \u003cstrong>Great Plains\u003c/strong>, the land rises dramatically into the Rocky Mountains. This rugged western spine stretches from Canada all the way into New Mexico. Further west, one finds spectacular desert landscapes, including the breathtaking Grand \u003cstrong>Canyon\u003c/strong> carved by the Colorado River, and the lush Pacific coast.","Hydrology is another defining feature of the US map. The mighty Mississippi River and its major \u003cstrong>tributaries\u003c/strong> create an immense \u003cstrong>river basin\u003c/strong> draining the heart of the country into the \u003cstrong>Gulf of Mexico\u003c/strong>, while along the northern border lies the chain of the \u003cstrong>Great Lakes\u003c/strong>. Due to its enormous territory, the climate varies from arctic cold with \u003cstrong>glaciers\u003c/strong> in Alaska to a humid \u003cstrong>subtropical\u003c/strong> environment in Florida, and hot, \u003cstrong>arid\u003c/strong> conditions in the Southwest. Protected in dozens of magnificent \u003cstrong>national parks\u003c/strong>, American geography provides endless natural variety."],"answer_info":"","questions":[{"cat":"Popis","text":"What natural boundaries and bodies of water border the United States?"},{"cat":"Srovnání","text":"In what ways do the older Appalachian Mountains in the east differ from the younger Rocky Mountains in the west?"},{"cat":"Zeměpisné vlivy","text":"How does the immense geographic size of the USA contribute to its wide variety of climate zones?"},{"cat":"Popis","text":"What is the significance of the Mississippi River system and the Great Lakes for American trade and agriculture?"},{"cat":"Zkušenost / preference","text":"Which American national park or natural wonder would you be most eager to visit?"},{"cat":"Hypotéza","text":"If you had to travel across the United States from New York to San Francisco by car, what geographical regions would you encounter along your journey?"},{"cat":"Přírodní rizika","text":"What extreme weather phenomena and natural hazards are typical of different regions in the United States?"}],"phrases":[{"head":"\u003cstrong>From a geographic point of view,...\u003c/strong>","gloss":"Ze zeměpisného hlediska...","note":"zeměpisný úvod"},{"head":"\u003cstrong>The landscape can be broadly divided into...\u003c/strong>","gloss":"Krajinu lze obecně rozdělit na...","note":"členění prostoru"},{"head":"\u003cstrong>Stretching across thousands of miles,...\u003c/strong>","gloss":"Táhnoucí se přes tisíce mil,...","note":"popis rozlohy"},{"head":"\u003cstrong>Compared to the eastern states,...\u003c/strong>","gloss":"Ve srovnání s východními státy...","note":"regionální srovnání"},{"head":"\u003cstrong>One of the most remarkable geographical features is...\u003c/strong>","gloss":"Jedním z nejpozoruhodnějších geografických rysů je...","note":"vyzdvižení zajímavosti"},{"head":"\u003cstrong>It plays a vital role in...\u003c/strong>","gloss":"Hraje to zásadní / klíčovou roli v...","note":"význam pro hospodářství/přírodu"},{"head":"\u003cstrong>To summarize the physical geography of the US,...\u003c/strong>","gloss":"Abych shrnul fyzickou geografii USA,...","note":"závěr"}],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>Great Lakes\u003c/strong> [proper noun, plural; A1 + A2]","gloss":"Velká jezera (Hořejší, Michiganské, Huronské, Erijské a Ontarijské)","example":"The Great Lakes along the Canadian border hold about one fifth of the world's surface water that is not salty."},{"head":"\u003cstrong>dry\u003c/strong> (adjective; A2)","gloss":"suchý, vyprahlý","example":"The very dry deserts of Arizona and Nevada have extreme temperatures."},{"head":"\u003cstrong>subtropical\u003c/strong> /ˌsʌbˈtrɒpɪkl/ AmE /ˌsʌbˈtrɑːpɪkl/ (adjective; slovo k tématu, C1)","gloss":"subtropický","example":"The states in the south-east have a subtropical climate with warm winters and long, hot summers."},{"head":"\u003cstrong>natural wonder\u003c/strong> [C; A1 + B1]","gloss":"přírodní div","example":"Yellowstone was created as the world's first national park in 1872 to protect its natural wonders."},{"head":"\u003cstrong>national park\u003c/strong> /ˌnæʃnəl ˈpɑːk/ AmE /ˌnæʃnəl ˈpɑːrk/ [C; B1]","gloss":"národní park","example":"People who love hiking visit Yosemite National Park to admire its high walls of rock and giant trees."},{"head":"\u003cstrong>volcano\u003c/strong> /vɒlˈkeɪnəʊ/ AmE /vɑːlˈkeɪnoʊ/ [C; B1]","gloss":"sopka","example":"Volcanoes at the bottom of the Pacific Ocean made the Hawaiian Islands."},{"head":"\u003cstrong>glacier\u003c/strong> /ˈɡlæsiə(r)/ AmE /ˈɡleɪʃər/ [C; slovo k tématu, B2]","gloss":"ledovec","example":"Alaska is famous for its wild land and huge blue glaciers."},{"head":"\u003cstrong>share a border with\u003c/strong> (phrase; A1 + B1)","gloss":"hraničit s","example":"The USA shares a border with Canada and Mexico."},{"head":"\u003cstrong>coastline\u003c/strong> /ˈkəʊstlaɪn/ [C/U; B1]","gloss":"pobřeží","example":"The Pacific coastline along California has high rocks above the ocean waves."}],"answer":["The USA is amazing because of its huge size and geographical variety. It has about forty percent of North America's land. It \u003cstrong>shares a border with\u003c/strong> Canada to the north and Mexico to the south. It has the Atlantic Ocean to the east and the Pacific to the west. Forty-eight of its fifty states are next to each other. Alaska is in the far north-west, and Hawaii is a group of islands with \u003cstrong>volcanoes\u003c/strong>.","In the east, the older Appalachian Mountains have round tops and follow the Atlantic \u003cstrong>coastline\u003c/strong>. The flat farmland of the Midwest and the grasslands of the Great Plains are further west. Then the high Rocky Mountains begin. Further west, there are amazing desert areas, including the Grand Canyon, which the Colorado River made.","Big rivers flow into the Mississippi River. Together, they carry water from the centre of the country to the Gulf of Mexico. The \u003cstrong>Great Lakes\u003c/strong> are along the northern border. Because the country is so large, the climate changes from place to place. Alaska is very cold and has \u003cstrong>glaciers\u003c/strong>. Florida has a \u003cstrong>subtropical\u003c/strong> climate, and the Southwest is hot and very \u003cstrong>dry\u003c/strong>. Many beautiful \u003cstrong>national parks\u003c/strong> protect this natural variety."],"questions":[{"cat":"Popis","text":"What natural borders and areas of water are around the United States?"},{"cat":"Srovnání","text":"How are the older Appalachian Mountains in the east different from the younger Rocky Mountains?"},{"cat":"Zeměpisné vlivy","text":"How
