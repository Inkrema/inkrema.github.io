repair."},{"head":"\u003cstrong>zip [C]\u003c/strong> /zɪp/","gloss":"zip","example":"The zip on my jacket is broken."},{"head":"\u003cstrong>button [C]\u003c/strong> /ˈbʌtn/","gloss":"knoflík","example":"I sewed a button onto my coat."},{"head":"\u003cstrong>fabric [C/U]\u003c/strong> /ˈfæbrɪk/","gloss":"látka, tkanina","example":"This fabric feels soft."},{"head":"\u003cstrong>cotton [U]\u003c/strong> /ˈkɒtn/ AmE /ˈkɑːtn/","gloss":"bavlna","example":"The shirt is made of cotton."},{"head":"\u003cstrong>wool [U]\u003c/strong> /wʊl/","gloss":"vlna","example":"Wool keeps me warm."},{"head":"\u003cstrong>pattern [C]\u003c/strong> /ˈpætn/ AmE /ˈpætərn/","gloss":"vzor na látce","example":"I like the striped pattern."},{"head":"\u003cstrong>plain (adj.)\u003c/strong> /pleɪn/","gloss":"jednobarevný, bez vzoru","example":"She chose a plain shirt."},{"head":"\u003cstrong>loose-fitting (adj.)\u003c/strong> /ˌluːs ˈfɪtɪŋ/","gloss":"volného střihu","example":"I wear loose-fitting trousers at home."},{"head":"\u003cstrong>tight-fitting (adj.)\u003c/strong> /ˌtaɪt ˈfɪtɪŋ/","gloss":"přiléhavý","example":"These tight-fitting jeans are uncomfortable."},{"head":"\u003cstrong>try on (sth) (v.)\u003c/strong>","gloss":"vyzkoušet si oblečení","example":"I tried on the jacket."},{"head":"\u003cstrong>fit (sb) (v.)\u003c/strong> /fɪt/","gloss":"padnout někomu velikostí","example":"This coat fits me well."},{"head":"\u003cstrong>suit (sb) (v.)\u003c/strong> /suːt/","gloss":"slušet někomu","example":"That colour suits you."},{"head":"\u003cstrong>dress code [C]\u003c/strong> /ˈdres kəʊd/","gloss":"pravidla oblékání","example":"The hotel has a dress code."},{"head":"\u003cstrong>formal (adj.)\u003c/strong> /ˈfɔːml/ AmE /ˈfɔːrml/","gloss":"formální","example":"A formal jacket works for an interview."},{"head":"\u003cstrong>casual (adj.)\u003c/strong> /ˈkæʒuəl/","gloss":"neformální","example":"I prefer casual clothes at weekends."},{"head":"\u003cstrong>hard-wearing (adj.)\u003c/strong> /ˌhɑːd ˈweərɪŋ/ AmE /ˌhɑːrd ˈwerɪŋ/","gloss":"odolný vůči opotřebení","example":"These hard-wearing trousers last well."},{"head":"\u003cstrong>mend (sth) (v.)\u003c/strong> /mend/","gloss":"spravit oblečení","example":"I can mend a torn sleeve."}],"answer":["Clothes are a practical part of everyday life, but they can also show personality. My \u003cstrong>wardrobe\u003c/strong> is quite simple because I prefer things I can combine easily. For school I usually choose a \u003cstrong>casual\u003c/strong> \u003cstrong>outfit\u003c/strong>, such as jeans and a comfortable top. At home I often wear something \u003cstrong>loose-fitting\u003c/strong>, while for a special occasion I might choose a more \u003cstrong>formal\u003c/strong> shirt.","When I buy clothes, I look at the \u003cstrong>fabric\u003c/strong> as well as the price. I like \u003cstrong>cotton\u003c/strong> because it feels comfortable on my skin, and a \u003cstrong>wool\u003c/strong> jumper is useful when it is cold. I also check the \u003cstrong>sleeve\u003c/strong>, the \u003cstrong>collar\u003c/strong> and the zip to see whether they are comfortable and work properly. I prefer a plain colour to a bright pattern, although that depends on my mood. Before paying, I try on the item to see if it will fit me and whether the colour will suit me.","As a tourism student, I may work with hotel guests. I would ask about the workplace dress code, keep my clothes clean and choose practical shoes. Looking neat matters, but I also need to move comfortably during a long shift. I do not think fashionable clothes have to be expensive. I sometimes look for hard-wearing items, buy clothes second-hand, swap clothes with friends or mend a small tear instead of buying something new. In my opinion, a good personal style is less about following every trend and more about choosing clothes that feel right and last."],"answer_info":"","questions":[{"cat":"","text":"How would you describe your personal style?"},{"cat":"","text":"What do you normally wear to school and why?"},{"cat":"","text":"How do you decide whether a garment fits you?"},{"cat":"","text":"What differences do you notice between formal and casual clothing?"},{"cat":"","text":"What might a hotel dress code look like?"},{"cat":"","text":"How could you make your wardrobe last longer?"},{"cat":"","text":"If you had to choose an outfit for a job interview, what would you wear?"}],"phrases":[{"head":"\u003cstrong>My usual style is...\u003c/strong>","gloss":"Můj běžný styl je...","note":""},{"head":"\u003cstrong>I tend to wear...\u003c/strong>","gloss":"Mám ve zvyku nosit...","note":""},{"head":"\u003cstrong>The material feels...\u003c/strong>","gloss":"Materiál působí...","note":""},{"head":"\u003cstrong>It fits me...\u003c/strong>","gloss":"Velikostí mi to sedí...","note":""},{"head":"\u003cstrong>For a formal occasion, I would...\u003c/strong>","gloss":"Při formální příležitosti bych...","note":""},{"head":"\u003cstrong>Compared with casual clothes,...\u003c/strong>","gloss":"Ve srovnání s neformálním oblečením...","note":""},{"head":"\u003cstrong>To make clothes last longer,...\u003c/strong>","gloss":"Aby oblečení déle vydrželo,...","note":""}],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>sleeve [C; slovo k tématu, B2]\u003c/strong> /sliːv/","gloss":"rukáv","example":"The sleeve is too long."},{"head":"\u003cstrong>zip [C; slovo k tématu, B2]\u003c/strong> /zɪp/","gloss":"zip","example":"The zip on my jacket is broken."},{"head":"\u003cstrong>button [C; A2]\u003c/strong> /ˈbʌtn/","gloss":"knoflík","example":"I put a button on my coat."},{"head":"\u003cstrong>material\u003c/strong> [C/U; B1]","gloss":"látka, tkanina","example":"This material feels soft."},{"head":"\u003cstrong>cotton [U; B1]\u003c/strong> /ˈkɒtn/ AmE /ˈkɑːtn/","gloss":"bavlna","example":"The shirt is made of cotton."},{"head":"\u003cstrong>wool [U; B1]\u003c/strong> /wʊl/","gloss":"vlna","example":"Wool keeps me warm."},{"head":"\u003cstrong>pattern [C; B1]\u003c/strong> /ˈpætn/ AmE /ˈpætərn/","gloss":"vzor na látce","example":"I like the pattern with stripes."},{"head":"\u003cstrong>in one colour\u003c/strong> (phrase; A1 + A1 + A1)","gloss":"jednobarevný, bez vzoru","example":"She chose a shirt in one colour."},{"head":"\u003cstrong>baggy\u003c/strong> (adj.; B1)","gloss":"volného střihu","example":"I wear baggy trousers at home."},{"head":"\u003cstrong>tight\u003c/strong> (adj.; B1)","gloss":"přiléhavý","example":"These tight jeans are uncomfortable."},{"head":"\u003cstrong>try on (sth) (v.; slovo k tématu, B2)\u003c/strong>","gloss":"vyzkoušet si oblečení","example":"I tried on the jacket."},{"head":"\u003cstrong>fit (sb) (v.; A2)\u003c/strong> /fɪt/","gloss":"padnout někomu velikostí","example":"This coat fits me well."},{"head":"\u003cstrong>suit (sb) (v.; B1)\u003c/strong> /suːt/","gloss":"slušet někomu","example":"That colour suits you."},{"head":"\u003cstrong>rules about clothes\u003c/strong> (phrase; A1 + A1 + A1)","gloss":"pravidla oblékání (dress code)","example":"The hotel has rules about clothes."},{"head":"\u003cstrong>formal (adj.; A2)\u003c/strong> /ˈfɔːml/ AmE /ˈfɔːrml/","gloss":"formální","example":"A formal jacket works for an interview."},{"head":"\u003cstrong>informal\u003c/strong> (adj.; A2)","gloss":"neformální","example":"I prefer informal clothes at weekends."},{"head":"\u003cstrong>last a long time\u003c/strong> (phrase; A2 + A1 + A1 + A1)","gloss":"dlouho vydržet (o odolném oblečení)","example":"These trousers last a long time."},{"head":"\u003cstrong>repair (sth)\u003c/strong> (v.; A2)","gloss":"spravit oblečení","example":"I can repair a sleeve."}],"answer":["For school I usually choose \u003cstrong>informal\u003c/strong> clothes, such as jeans and a comfortable top. At home I often wear something \u003cstrong>baggy\u003c/strong>, while for a special occasion I might choose a more \u003cstrong>formal\u003c/strong> shirt.","When I buy clothes, I look at the \u003cstrong>material\u003c/strong> as well as the price. I like \u003cstrong>cotton\u003c/strong> because it feels comfortable, and a \u003cstrong>wool\u003c/strong> sweater is useful when it is cold. I also check the \u003cstrong>sleeve\u003c/strong> and the \u003cstrong>zip\u003c/strong> to see whether they are comfortable and work properly. I prefer clothes \u003cstrong>in one colour\u003c/strong> to clothes with a bright \u003cstrong>pattern\u003c/strong>. Before paying, I \u003cstrong>try on\u003c/strong> the item to see if it \u003cstrong>fits\u003c/strong> me and if the colour \u003cstrong>suits\u003c/strong> me.","As a tourism student, I may work with hotel guests. I would ask what the \u003cstrong>rules about clothes\u003c/strong> are at work, keep my clothes clean and choose suitable shoes. I do not think fashionable clothes have to be expensive. I sometimes look for clothes that \u003cstrong>last a long time\u003c/strong> and buy used clothes. I also exchange clothes with friends or \u003cstrong>repair\u003c/strong> my clothes instead of buying something new. For me, good personal style is less about following every trend than about choosing clothes that feel right and last."],"questions":[{"cat":"","text":"How would you describe your personal style?"},{"cat":"","text":"What do you normally wear to school? \u003cem>(your reasons)\u003c/em>"},{"cat":"","text":"How do you decide whether a piece of clothing fits you?"},{"cat":"","text":"What differences do you notice between formal and informal clothing?"},{"cat":"","text":"What might the rules about clothes in a hotel look like?"},{"cat":"","text":"How could you make your clothes last longer?"},{"cat":"","text":"If you had to choose clothes for a job interview, what would you wear?"}],"phrases":[{"head":"\u003cstrong>My usual style is...\u003c/strong>","gloss":"Můj běžný styl je...","note":""},{"head":"\u003cstrong>I tend to wear...\u003c/strong>","gloss":"Mám ve zvyku nosit...","note":""},{"head":"\u003cstrong>The material feels...\u003c/strong>","gloss":"Materiál působí...","note":""},{"head":"\u003cstrong>It fits me...\u003c/strong>","gloss":"Velikostí mi to sedí...","note":""},{"head":"\u003cstrong>For a formal occasion, I would...\u003c/strong>","gloss":"Při formální příležitosti bych...","note":""},{"head":"\u003cstrong>In comparison with informal clothes,...\u003c/strong>","gloss":"Ve srovnání s neformálním oblečením...","note":""},{"head":"\u003cstrong>To make clothes last longer,...\u003c/strong>","gloss":"Aby oblečení déle vydrželo,...","note":""}]},"codes":["CR 17a"],"groups":["cr"],"rank":{"cr":34,"all":34.5}},{"file":"tema-c18b-meals-of-the-day.md","title":"Meals of the day","label":"Navrhl AI (Hermes, gpt-6.1-terra), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu.","vocab":[{"head":"\u003cstrong>breakfast buffet [C]\u003c/strong>","gloss":"snídaňový bufet","example":"The breakfast buffet opens at seven."},{"head":"\u003cstrong>half board [U]\u003c/strong> /ˌhɑːf ˈbɔːd/ AmE /ˌhæf ˈbɔːrd/","gloss":"polopenze","example":"We chose half board for our stay."},{"head":"\u003cstrong>full board [U]\u003c/strong> /ˌfʊl ˈbɔːd/ AmE /ˌfʊl ˈbɔːrd/","gloss":"plná penze","example":"Full board includes three meals."},{"head":"\u003cstrong>room only (adj./adv.)\u003c/strong>","gloss":"pouze ubytování bez stravy; též jako označení sazby","example":"The rate is room only."},{"head":"\u003cstrong>cucumber [C/U; B1]\u003c/strong> /ˈkjuːkʌmbə(r)/ AmE /ˈkjuːkʌmbər/","gloss":"okurka","example":"I add cucumber to my lunch."},{"head":"\u003cstrong>packed lunch [C]\u003c/strong> /ˌpækt ˈlʌntʃ/","gloss":"oběd zabalený s sebou","example":"I took a packed lunch to school."},{"head":"\u003cstrong>lunch break [C]\u003c/strong>","gloss":"polední přestávka na oběd","example":"Our lunch break starts at noon."},{"head":"\u003cstrong>school canteen [C]\u003c/strong> (canteen /kænˈtiːn/)","gloss":"školní jídelna","example":"We meet in the school canteen."},{"head":"\u003cstrong>brunch [C/U]\u003c/strong> /brʌntʃ/","gloss":"pozdní snídaně spojená s obědem","example":"We had brunch on Sunday."},{"head":"\u003cstrong>porridge [U]\u003c/strong> /ˈpɒrɪdʒ/ AmE /ˈpɔːrɪdʒ/","gloss":"ovesná kaše","example":"I make porridge with milk."},{"head":"\u003cstrong>cereal [C/U]\u003c/strong> /ˈsɪəriəl/ AmE /ˈsɪriəl/","gloss":"cereálie","example":"She eats cereal with milk."},{"head":"\u003cstrong>toast [U]\u003c/strong> /təʊst/ AmE /toʊst/","gloss":"opečený chléb","example":"I made some toast."},{"head":"\u003cstrong>scrambled eggs [plural]\u003c/strong>","gloss":"míchaná vejce","example":"He cooked scrambled eggs."},{"head":"\u003cstrong>pancake [C]\u003c/strong> /ˈpænkeɪk/","gloss":"palačinka nebo lívanec","example":"I made a pancake for breakfast."},{"head":"\u003cstrong>supper [C/U]\u003c/strong> /ˈsʌpə/ AmE /ˈsʌpər/","gloss":"večeře, někdy lehčí či pozdější","example":"We had soup for supper."},{"head":"\u003cstrong>mealtime [C]\u003c/strong> /ˈmiːltaɪm/","gloss":"čas jídla","example":"Our mealtimes change at weekends."},{"head":"\u003cstrong>help oneself to (sth) (v.)\u003c/strong>","gloss":"nabrat si něco sám","example":"Guests help themselves to bread."},{"head":"\u003cstrong>chew (v.; B2)\u003c/strong> /tʃuː/","gloss":"žvýkat","example":"I chew my food slowly."},{"head":"\u003cstrong>available (adj.)\u003c/strong> /əˈveɪləbl/","gloss":"dostupný","example":"Fruit is available in the morning."},{"head":"\u003cstrong>swallow (v.; B2)\u003c/strong> /ˈswɒləʊ/ AmE /ˈswɑːləʊ/","gloss":"polknout","example":"Take a drink of water and swallow the food carefully."},{"head":"\u003cstrong>frozen (adj.; B1)\u003c/strong> /ˈfrəʊzn/","gloss":"zmrazený","example":"Frozen vegetables can be useful for a quick meal."},{"head":"\u003cstrong>slice (sth) (v.)\u003c/strong> /slaɪs/","gloss":"nakrájet na plátky","example":"I slice an apple to take with my lunch."},{"head":"\u003cstrong>refreshments [plural; B1]\u003c/strong> (refreshment /rɪˈfreʃmənt/)","gloss":"drobné občerstvení","example":"Light refreshments are available between meetings."},{"head":"\u003cstrong>hunger [U; B1]\u003c/strong> /ˈhʌŋɡə(r)/ AmE /ˈhʌŋɡər/","gloss":"hlad","example":"A small snack can satisfy your hunger before dinner."},{"head":"\u003cstrong>takeaway [C; B1]\u003c/strong> /ˈteɪkəweɪ/","gloss":"jídlo zakoupené s sebou","example":"We bought a takeaway after a long journey."},{"head":"\u003cstrong>tasty (adj.; B1)\u003c/strong> /ˈteɪsti/","gloss":"chutný","example":"The school canteen offers a tasty lunch."},{"head":"\u003cstrong>thirst [U; B2]\u003c/strong> /θɜːst/ AmE /θɜːrst/","gloss":"žízeň","example":"A glass of water can satisfy your thirst."},{"head":"\u003cstrong>organic (adj.; B2)\u003c/strong> /ɔːˈɡænɪk/ AmE /ɔːrˈɡænɪk/","gloss":"ekologicky pěstovaný","example":"The café offers organic vegetables with lunch."},{"head":"\u003cstrong>coconut [C/U; B1]\u003c/strong> /ˈkəʊkənʌt/","gloss":"kokos (plod i jeho dužina)","example":"The dessert contains coconut."},{"head":"\u003cstrong>bite [C; B2]\u003c/strong> /baɪt/","gloss":"sousto","example":"She took a bite of her sandwich."}],"answer":["Meals give a shape to my day, although the exact \u003cstrong>mealtime\u003c/strong> depends on my timetable. On school days I might have \u003cstrong>porridge\u003c/strong>, \u003cstrong>cereal\u003c/strong> or \u003cstrong>toast\u003c/strong> before leaving home. I usually have lunch in the \u003cstrong>school canteen\u003c/strong> during my \u003cstrong>lunch break\u003c/strong>, but on a trip I can take a \u003cstrong>packed lunch\u003c/strong> instead. In the evening my family eats together when we have time. At the weekend I sometimes enjoy a late \u003cstrong>brunch\u003c/strong> with \u003cstrong>scrambled eggs\u003c/strong> or a \u003cstrong>pancake\u003c/strong>.","In the Czech Republic, a student might have lunch in a school canteen and eat with family in the evening. At Easter, some people enjoy a slice of mazanec for breakfast. In Britain, a full English breakfast is one possible cooked breakfast; pupils in Leeds may bring a packed lunch, depending on school policy. In the USA, a student might choose a school lunch or bring food from home; some schools also offer breakfast. Dinner can refer to an evening meal, while some people say supper. These are examples, not rules: routines differ between households and schools.","As a tourism student, I need to understand hotel meal arrangements. With bed and breakfast, a morning meal is included. With half board, guests usually have breakfast and an evening meal; some hotels may offer lunch instead. Full board normally covers breakfast, lunch and dinner. A room only rate does not include meals. At a breakfast buffet, guests can help themselves to food. Staff may explain what is available. I would always check the meal plan, opening hours and extra charges with the hotel, since conditions can differ."],"answer_info":"","questions":[{"cat":"","text":"What meals make up your usual school day?"},{"cat":"","text":"How does your routine change at weekends?"},{"cat":"","text":"What might a student take in a packed lunch?"},{"cat":"","text":"How could meal routines differ between families in the Czech Republic, Britain and the USA?"},{"cat":"","text":"What does half board usually include?"},{"cat":"","text":"How would you explain the difference between full board and room only?"},{"cat":"","text":"What would you check before recommending a hotel meal plan?"}],"phrases":[{"head":"\u003cstrong>On a typical school day,...\u003c/strong>","gloss":"V typický školní den...","note":""},{"head":"\u003cstrong>My first meal is usually...\u003c/strong>","gloss":"Moje první jídlo bývá...","note":""},{"head":"\u003cstrong>At weekends I tend to...\u003c/strong>","gloss":"O víkendech mám ve zvyku...","note":""},{"head":"\u003cstrong>Meal times can vary because...\u003c/strong>","gloss":"Časy jídel se mohou lišit, protože...","note":""},{"head":"\u003cstrong>The price includes...\u003c/strong>","gloss":"Cena zahrnuje...","note":""},{"head":"\u003cstrong>Guests can help themselves to...\u003c/strong>","gloss":"Hosté si mohou sami nabrat...","note":""},{"head":"\u003cstrong>I would check the details with...\u003c/strong>","gloss":"Podrobnosti bych ověřil/a u...","note":""}],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>breakfast buffet\u003c/strong> [C; slovo k tématu, C1]","gloss":"snídaňový bufet","example":"The breakfast buffet opens at seven."},{"head":"\u003cstrong>half board\u003c/strong> /ˌhɑːf ˈbɔːd/ AmE /ˌhæf ˈbɔːrd/ [U; slovo k tématu, C2]","gloss":"polopenze","example":"We chose half board for our stay."},{"head":"\u003cstrong>full board\u003c/strong> /ˌfʊl ˈbɔːd/ AmE /ˌfʊl ˈbɔːrd/ [U; slovo k tématu, C2]","gloss":"plná penze","example":"Full board includes three meals."},{"head":"\u003cstrong>room only\u003c/strong> (adj./adv.; A1 + A1)","gloss":"pouze ubytování bez stravy; též jako označení sazby","example":"The rate is room only."},{"head":"\u003cstrong>packed lunch\u003c/strong> /ˌpækt ˈlʌntʃ/ [C; B1]","gloss":"oběd zabalený s sebou","example":"I took a packed lunch to school."},{"head":"\u003cstrong>lunch break\u003c/strong> [C; A1 + A1]","gloss":"polední přestávka na oběd","example":"Our lunch break starts at midday."},{"head":"\u003cstrong>school canteen\u003c/strong> (canteen /kænˈtiːn/) [C; A1 + B1]","gloss":"školní jídelna","example":"We meet in the school canteen."},{"head":"\u003cstrong>breakfast and lunch as one late morning meal\u003c/strong> (noun phrase; A1 + A1)","gloss":"pozdní snídaně spojená s obědem (\u003cem>brunch\u003c/em>)","example":"On Sunday, we had breakfast and lunch as one late morning meal."},{"head":"\u003cstrong>toast\u003c/strong> /təʊst/ AmE /toʊst/ [U; A2]","gloss":"opečený chléb","example":"I made some toast."},{"head":"\u003cstrong>pancake\u003c/strong> /ˈpænkeɪk/ [C; B1]","gloss":"palačinka nebo lívanec","example":"I made a pancake for breakfast."},{"head":"\u003cstrong>supper\u003c/strong> /ˈsʌpə/ AmE /ˈsʌpər/ [C/U; slovo k tématu, B2]","gloss":"večeře, někdy lehčí či pozdější","example":"We had soup for supper."},{"head":"\u003cstrong>help yourself to (sth)\u003c/strong> (v.; B1)","gloss":"nabrat si něco sám","example":"Guests help themselves to bread."},{"head":"\u003cstrong>available\u003c/strong> /əˈveɪləbl/ (adj.; A2)","gloss":"dostupný","example":"Fruit is available in the morning."},{"head":"\u003cstrong>frozen\u003c/strong> /ˈfrəʊzn/ (adj.; B1)","gloss":"zmrazený","example":"Frozen vegetables can be useful for a quick meal."},{"head":"\u003cstrong>slice (sth)\u003c/strong> /slaɪs/ (v.; B1)","gloss":"nakrájet na plátky","example":"I slice an apple to take with my lunch."},{"head":"\u003cstrong>refreshments\u003c/strong> (refreshment /rɪˈfreʃmənt/) [plural; B1]","gloss":"drobné občerstvení","example":"Light refreshments are available between meetings."},{"head":"\u003cstrong>tasty\u003c/strong> /ˈteɪsti/ (adj.; B1)","gloss":"chutný","example":"The school canteen offers a tasty lunch."},{"head":"\u003cstrong>bite\u003c/strong> /baɪt/ [C; B1]","gloss":"sousto","example":"She took a bite of her sandwich."},{"head":"\u003cstrong>Easter\u003c/strong> [vlastní jméno]","gloss":"Velikonoce","example":"Some Czech people have a special breakfast at Easter."}],"answer":["On school days I might have cereal or \u003cstrong>toast\u003c/strong> before leaving home. I usually have lunch in the \u003cstrong>school canteen\u003c/strong> during my \u003cstrong>lunch break\u003c/strong>. In the evening my family eats together when we have time. At the weekend I sometimes enjoy \u003cstrong>breakfast and lunch as one late morning meal\u003c/strong>, with eggs or a \u003cstrong>pancake\u003c/strong>.","In the Czech Republic, some people enjoy a slice of mazanec for breakfast at \u003cstrong>Easter\u003c/strong>. In Britain, a full English breakfast is one possible cooked breakfast. In Leeds, children may bring a \u003cstrong>packed lunch\u003c/strong> to school, but this depends on school policy. In the USA, a student might choose a school lunch or bring food from home. Dinner can mean an evening meal, while some people say \u003cstrong>supper\u003c/strong>.","As a tourism student, I need to understand the meal arrangements in hotels. With bed and breakfast, a morning meal is included. With \u003cstrong>half board\u003c/strong>, guests usually have breakfast and an evening meal. Some hotels may offer lunch instead. \u003cstrong>Full board\u003c/strong> normally covers breakfast, lunch and dinner. A \u003cstrong>room only\u003c/strong> rate does not include meals. At a \u003cstrong>breakfast buffet\u003c/strong>, guests can \u003cstrong>help themselves to\u003c/strong> food. I would always check the meal plan and extra charges with the hotel."],"questions":[{"cat":"","text":"What meals make up your usual school day?"},{"cat":"","text":"How does your routine change at weekends?"},{"cat":"","text":"What might a student take in a packed lunch?"},{"cat":"","text":"How could families' meal routines be different in the Czech Republic, Britain and the USA?"},{"cat":"","text":"What does half board usually include?"},{"cat":"","text":"How would you explain the difference between full board and room only?"},{"cat":"","text":"What would you check before recommending a meal plan at a hotel?"}],"phrases":[{"head":"\u003cstrong>On a typical school day,...\u003c/strong>","gloss":"V typický školní den...","note":""},{"head":"\u003cstrong>My first meal is usually...\u003c/strong>","gloss":"Moje první jídlo bývá...","note":""},{"head":"\u003cstrong>At weekends I tend to...\u003c/strong>","gloss":"O víkendech mám ve zvyku...","note":""},{"head":"\u003cstrong>Meals can be at different times because...\u003c/strong>","gloss":"Časy jídel se mohou lišit, protože...","note":""},{"head":"\u003cstrong>The price includes...\u003c/strong>","gloss":"Cena zahrnuje...","note":""},{"head":"\u003cstrong>Guests can help themselves to...\u003c/strong>","gloss":"Hosté si mohou sami nabrat...","note":""},{"head":"\u003cstrong>I would check the details with...\u003c/strong>","gloss":"Podrobnosti bych ověřil/a u...","note":""}]},"codes":["CR 18b"],"groups":["cr"],"rank":{"cr":37,"all":37.5}},{"file":"tema-c19a-nature-and-animals.md","title":"Nature and animals","label":"Navrhl AI (Hermes, gpt-6.1-terra), čeká na kontrolu a schválení učitelem. Výslovnost: Claude podle Oxfordu.","vocab":[{"head":"\u003cstrong>woodland [C/U]\u003c/strong> /ˈwʊdlənd/","gloss":"lesní porost","example":"We walked through quiet woodland."},{"head":"\u003cstrong>meadow [C]\u003c/strong> /ˈmedəʊ/ AmE /ˈmedoʊ/","gloss":"louka","example":"Flowers grow in the meadow."},{"head":"\u003cstrong>stream [C]\u003c/strong> /striːm/","gloss":"potok","example":"The stream runs through the valley."},{"head":"\u003cstrong>trail [C]\u003c/strong> /treɪl/","gloss":"stezka","example":"Follow the marked trail."},{"head":"\u003cstrong>wildlife [U]\u003c/strong> /ˈwaɪldlaɪf/","gloss":"volně žijící živočichové","example":"We watched wildlife from a distance."},{"head":"\u003cstrong>mammal [C]\u003c/strong> /ˈmæml/","gloss":"savec","example":"A fox is a mammal."},{"head":"\u003cstrong>bird of prey [C]\u003c/strong> /ˌbɜːd əv ˈpreɪ/ AmE /ˌbɜːrd əv ˈpreɪ/","gloss":"dravý pták","example":"We saw a bird of prey overhead."},{"head":"\u003cstrong>fox [C]\u003c/strong> /fɒks/ AmE /fɑːks/","gloss":"liška","example":"A fox crossed the path."},{"head":"\u003cstrong>deer [C]\u003c/strong> /dɪə/ AmE /dɪr/","gloss":"jelenovitý živočich","example":"We saw a deer near the trees."},{"head":"\u003cstrong>hedgehog [C]\u003c/strong> /ˈhedʒhɒɡ/ AmE /ˈhedʒhɔːɡ/","gloss":"ježek","example":"A hedgehog appeared in the garden."},{"head":"\u003cstrong>squirrel [C]\u003c/strong> /ˈskwɪrəl/ AmE /ˈskwɜːrəl/","gloss":"veverka","example":"A squirrel climbed the tree."},{"head":"\u003cstrong>feather [C]\u003c/strong> /ˈfeðə/ AmE /ˈfeðər/","gloss":"pírko","example":"I found a feather on the path."},{"head":"\u003cstrong>fur [U]\u003c/strong> /fɜː/ AmE /fɜːr/","gloss":"srst","example":"The rabbit has soft fur."},{"head":"\u003cstrong>paw [C]\u003c/strong> /pɔː/","gloss":"tlapka","example":"The dog lifted its paw."},{"head":"\u003cstrong>nest [C]\u003c/strong> /nest/","gloss":"hnízdo","example":"The nest was high in a tree."},{"head":"\u003cstrong>observe (sth) (v.)\u003c/strong> /əbˈzɜːv/ AmE /əbˈzɜːrv/","gloss":"pozorovat","example":"We observed the birds quietly."},{"head":"\u003cstrong>keep one’s distance (v.)\u003c/strong>","gloss":"udržovat odstup","example":"Keep your distance from wild animals."},{"head":"\u003cstrong>pet [C]\u003c/strong> /pet/","gloss":"domácí mazlíček","example":"Their pet sleeps in the kitchen."},{"head":"\u003cstrong>animal shelter [C]\u003c/strong> (shelter /ˈʃeltə(r)/ AmE /ˈʃeltər/)","gloss":"útulek pro zvířata","example":"She volunteers at an animal shelter."},{"head":"\u003cstrong>adopt (an animal) (v.)\u003c/strong> (adopt /əˈdɒpt/ AmE /əˈdɑːpt/)","gloss":"adoptovat zvíře","example":"They adopted a dog from a shelter."},{"head":"\u003cstrong>vet [C]\u003c/strong> /vet/","gloss":"veterinář","example":"The vet checked the dog."}],"answer":["I enjoy being outdoors because it gives me a break from screens and schoolwork. A walk through \u003cstrong>woodland\u003c/strong> or across a \u003cstrong>meadow\u003c/strong> can be relaxing. I like following a marked \u003cstrong>trail\u003c/strong> and stopping by a \u003cstrong>stream\u003c/strong> to listen to the water. I do not need to travel far to enjoy a quiet place in nature.","If I am patient, I may see \u003cstrong>wildlife\u003c/strong>. A \u003cstrong>squirrel\u003c/strong> might run up a tree, or a \u003cstrong>hedgehog\u003c/strong> might appear in a garden. A \u003cstrong>fox\u003c/strong> and a \u003cstrong>deer\u003c/strong> are examples of a \u003cstrong>mammal\u003c/strong>, while a bird of prey can be seen above an open field. I like to observe animals quietly and keep my distance rather than disturb them. I would not touch a nest or try to catch an animal just to take a photograph. If I found an injured wild animal, I would contact an appropriate local rescue organisation for advice.","Pets are different because people are responsible for their daily care. Before getting a pet, I would think about the time, money and space it needs. A dog needs suitable food, exercise and attention, while other animals have different needs. A vet can advise an owner when an animal is ill. Someone who is ready for that responsibility might adopt an animal from an animal shelter. I think protecting animals also means treating them with respect. For visitors, a good nature experience is not about getting as close as possible; it is about noticing what is around us without causing harm."],"answer_info":"","questions":[{"cat":"","text":"What natural places do you enjoy visiting?"},{"cat":"","text":"Which wild animals might you see near your home?"},{"cat":"","text":"How would you behave if you found a nest?"},{"cat":"","text":"What responsibilities come with keeping a pet?"},{"cat":"","text":"How do pets and wild animals need different treatment?"},{"cat":"","text":"Why might someone choose to adopt an animal?"},{"cat":"","text":"What would you do if you found an injured wild animal?"}],"phrases":[{"head":"\u003cstrong>My favourite natural place is...\u003c/strong>","gloss":"Moje oblíbené místo v přírodě je...","note":""},{"head":"\u003cstrong>In this area you might see...\u003c/strong>","gloss":"V této oblasti lze zahlédnout...","note":""},{"head":"\u003cstrong>I prefer to observe from...\u003c/strong>","gloss":"Dávám přednost pozorování z...","note":""},{"head":"\u003cstrong>A pet owner is responsible for...\u003c/strong>","gloss":"Majitel zvířete odpovídá za...","note":""},{"head":"\u003cstrong>Unlike a wild animal,...\u003c/strong>","gloss":"Na rozdíl od divokého zvířete...","note":""},{"head":"\u003cstrong>If I found an injured animal,...\u003c/strong>","gloss":"Kdybych našel/la zraněné zvíře,...","note":""},{"head":"\u003cstrong>In my view, respect means...\u003c/strong>","gloss":"Podle mě respekt znamená...","note":""}],"b1":{"label":"B1: zjednodušila AI z verze B2, čeká na kontrolu a schválení učitelem.","vocab":[{"head":"\u003cstrong>woodland\u003c/strong> /ˈwʊdlənd/ [C/U; B1]","gloss":"lesní porost","example":"We walked through quiet woodland."},{"head":"\u003cstrong>field of grass\u003c/strong> (noun phrase; A2 + A2)","gloss":"louka (\u003cem>meadow\u003c/em>)","example":"Flowers grow in the field of grass."},{"head":"\u003cstrong>small river\u003c/strong> (noun phrase; A1 + A1)","gloss":"potok (\u003cem>stream\u003c/em>)","example":"The small river flows through the valley."},{"head":"\u003cstrong>path\u003c/strong> (noun; B1)","gloss":"stezka","example":"Follow the path with signs."},{"head":"\u003cstrong>wild animals\u003c/strong> (noun phrase; A2 + A1)","gloss":"volně žijící živočichové (\u003cem>wildlife\u003c/em>)","example":"We watched wild animals from a distance."},{"head":"\u003cstrong>mammal\u003c/strong> /ˈmæml/ [C; slovo k tématu, B2]","gloss":"savec","example":"A fox is a mammal."},{"head":"\u003cstrong>bird that hunts animals\u003c/strong> (noun phrase; A1 + B1)","gloss":"dravý pták (\u003cem>bird of prey\u003c/em>)","example":"Above us, we saw a bird that hunts animals."},{"head":"\u003cstrong>fox\u003c/strong> /fɒks/ AmE /fɑːks/ [C; B1]","gloss":"liška","example":"A fox crossed the path."},{"head":"\u003cstrong>deer\u003c/strong> /dɪə/ AmE /dɪr/ [C; slovo k tématu, B2]","gloss":"jelenovitý živočich","example":"We saw a deer near the trees."},{"head":"\u003cstrong>squirrel\u003c/strong> /ˈskwɪrəl/ AmE /ˈskwɜːrəl/ [C; slovo k tématu, B2]","gloss":"veverka","example":"A squirrel climbed the tree."},{"head":"\u003cstrong>fur\u003c/strong> /fɜː/ AmE /fɜːr/ [U; B1]","gloss":"srst","example":"The rabbit has soft fur."},{"head":"\u003cstrong>nest\u003c/strong> /nest/ [C; slovo k tématu, C1]","gloss":"hnízdo","example":"The nest was high in a tree."},{"head":"\u003cstrong>watch carefully\u003c/strong> (v.; A1 + A2)","gloss":"pozorovat (\u003cem>observe\u003c/em>)","example":"We watched the birds carefully and quietly."},{"head":"\u003cstrong>not go too near\u003c/strong> (phrase; A1)","gloss":"udržovat odstup (\u003cem>keep your distance\u003c/em>)","example":"Do not go too near wild animals."},{"head":"\u003cstrong>pet\u003c/strong> /pet/ [C; A2]","gloss":"domácí mazlíček","example":"Their pet sleeps in the kitchen."},{"head":"\u003cstrong>give a home to (an animal)\u003c/strong> (phrase; A1)","gloss":"adoptovat zvíře (\u003cem>adopt\u003c/em>)","example":"They gave a home to a dog."},{"head":"\u003cstrong>animal doctor\u003c/strong> (noun phrase; A1 + A1)","gloss":"veterinář (běžně se říká \u003cem>vet\u003c/em>)","example":"The animal doctor checked the dog."}],"answer":["I enjoy being outdoors because it gives me a break from screens. A walk through \u003cstrong>woodland\u003c/strong> or across a \u003cstrong>field of grass\u003c/strong> can be relaxing. I like following a \u003cstrong>path\u003c/strong> with signs and stopping by a \u003cstrong>small river\u003c/strong>.","If I do not mind waiting, I may see \u003cstrong>wild animals\u003c/strong>. A \u003cstrong>squirrel\u003c/strong> might run up a tree. A \u003cstrong>fox\u003c/strong> and a \u003cstrong>deer\u003c/strong> are examples of a \u003cstrong>mammal\u003c/strong>. A \u003cstrong>bird that hunts animals\u003c/strong> can be seen above an open field. I like to \u003cstrong>watch\u003c/strong> animals \u003cstrong>carefully\u003c/strong> and quietly and \u003cstrong>not go too near\u003c/strong> them rather than bother them. I would not touch a \u003cstrong>nest\u003c/strong> or try to catch an animal just to take a photograph. If I found an injured \u003cstrong>wild animal\u003c/strong>, I would ask a local organisation that saves animals for advice.","\u003cstrong>Pets\u003c/strong> are different because people are responsible for their daily care. Before getting a \u003cstrong>pet\u003c/strong>, I would think about the time, money and space it needs. A dog needs suitable food, exercise and attention, while other animals have different needs. An \u003cstrong>animal doctor\u003c/strong> can advise an owner when an animal is ill. Someone who is ready for that responsibility might \u003cstrong>give a home to\u003c/strong> an animal."],"questions":[{"cat":"","text":"What natural places do you enjoy visiting?"},{"cat":"","text":"Which wild animals might you see near your home?"},{"cat":"","text":"How would you behave if you found a nest?"},{"cat":"","text":"What responsibilities does a pet owner have?"},{"cat":"","text":"How do pets and wild animals need different treatment?"},{"cat":"","text":"Why might someone choose to give a home to an animal?"},{"cat":"","text":"What would you do if you found an injured wild animal?"}],"phrases":[{"head":"\u003cstrong>My favourite natural place is...\u003c/strong>","gloss":"Moje oblíbené místo v přírodě je...","note":""},{"head":"\u003cstrong>In this area you might see...\u003c/strong>","gloss":"V této oblasti lze zahlédnout...","note":""},{"head":"\u003cstrong>I prefer to watch carefully from...\u003c/strong>","gloss":"Dávám přednost pozorování z...","note":""},{"head":"\u003cstrong>A pet owner is responsible for...\u003c/strong>","gloss":"Majitel zvířete odpovídá za...","note":""},{"head":"\u003cstrong>Unlike a wild animal,...\u003c/strong>","gloss":"Na rozdíl od divokého zvířete...","note":""},{"head":"\u003cstrong>If I found an injured animal,...\u003c/strong>","gloss":"Kdybych našel/la zraněné zvíře,...","note":""},{"head":"\u003cstrong>In my view, respect means...\u003c/strong>","gloss":"Podle mě respekt znamená...","note":""}]},"codes":["CR 19a"],"groups":["cr"],"rank":{"cr":38,"all":38.5}}],"built":"17. 11. 2026 13:11","filters":[["all","Všechna témata"],["sso","SŠ obchodní"],["cr","SŠ cestovního ruchu"]],"menu_note":"Stav každého tématu (návrh AI, nebo schváleno) je uveden na jeho stránce.","heading":"Maturita z angličtiny – ústní témata (SŠ obchodní, SŠ cestovního ruchu)","legend":"SSO = SŠ obchodní, CR = SŠ cestovního ruchu · zadání témat 2026/2027 zveřejnily školy: www.sso.cz/1408/zkousky-a-predmety.html, www.skolacrcb.cz/zaci/zaverecne-zkousky","levels":true}</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("data").textContent);
const TOPICS = DATA.topics;
const app = document.getElementById("app");
const blank = document.getElementById("blank");
const root = document.documentElement;
const dpr0 = window.devicePixelRatio || 1;
const SECTIONS = [
  { name: "Slovní zásoba", one: "Slovo", all: "celý seznam" },
  { name: "Vzorová odpověď", one: "Odstavec", all: "celý text" },
  { name: "Otázky", one: "Otázka", all: "všechny otázky" },
  { name: "Fráze", one: "Fráze", all: "všechny fráze" },
];
const FILTERS = DATA.filters || [["all", "Všechna témata"], ["s", "Sportovní obor"], ["v", "Všeobecný obor"]];

let size = 1;          // + and −; the browser's zoom comes on top
let view = "menu";     // "menu" or "topic"
let filter = "all";    // the programme shown in the menu
let current = null;    // index of the open topic
let section = 0;       // 0–3, SECTIONS
let pos = [0, 0, 0, 0];               // the step within each section
let whole = [false, false, false, false];  // each section one item at a time, or all at once
// The language level, on a page whose texts have a B1 version (DATA.levels). The choice lives in the address (#b1),
// not in browser storage: a reload or a saved link keeps it, and nothing can fail to be written.
let level = DATA.levels && location.hash === "#b1" ? "b1" : "b2";

function esc(text) {
  return String(text).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
}
function nums(t) {
  if (t.codes) return t.codes.filter(c => filter === "all" || c.startsWith(filter === "sso" ? "SSO" : "CR")).join(" · ");
  return [t.s != null ? `S ${t.s}` : "", t.v != null ? `V ${t.v}` : ""].filter(Boolean).join(" · ");
}
// The open topic at the chosen level: its B1 version when there is one, else the B2 text.
function cur() {
  const t = TOPICS[current];
  return level === "b1" && t.b1 ? Object.assign({}, t, t.b1) : t;
}
function levelButtons() {
  if (!DATA.levels) return "";
  return `<span class="chips">${[["b2", "B2"], ["b1", "B1"]].map(([l, name]) => `<button data-level="${l}" aria-pressed="${level === l}">${name}</button>`).join("")}</span>`;
}
function setLevel(l) {
  if (!DATA.levels || l === level) return;
  level = l;
  try { location.replace(l === "b1" ? "#b1" : "#b2"); } catch (e) { /* the level still applies until the page closes */ }
  if (view === "topic") {
    pos = [0, 0, 0, 0];
    if (section > lastSection()) section = lastSection();
    render(); window.scrollTo(0, 0);
  } else render();
}
function control(act, key, words) { return `<button class="key" data-act="${act}"><b>${key}</b> ${words}</button>`; }

// The menu: the topics of one programme in its order, or of both, a topic shared by both programmes once.
function listed() {
  if (DATA.filters) return TOPICS.map((t, i) => i).filter(i => filter === "all" || TOPICS[i].groups.includes(filter))
    .sort((a, b) => TOPICS[a].rank[filter] - TOPICS[b].rank[filter]);
  const ids = TOPICS.map((t, i) => i).filter(i => filter === "all" || TOPICS[i][filter] != null);
  const rank = t => filter === "all" ? Math.min(t.s ?? 99, t.v ?? 99) * 2 + (t.s != null ? 0 : 1) : t[filter];
  return ids.sort((a, b) => rank(TOPICS[a]) - rank(TOPICS[b]));
}
function menuView() {
  const ids = listed();
  return `<header class="bar"><h1>${esc(DATA.heading || "Maturita z angličtiny – ústní témata (B2)")}</h1><span class="ai">${esc(DATA.menu_note)}</span></header>
<main>
<div class="chips">${DATA.levels ? `<span class="lvl">Úroveň</span>${levelButtons()}<span class="sp"></span>` : ""}${FILTERS.map(([f, label]) => `<button data-filter="${f}" aria-pressed="${filter === f}">${label}</button>`).join("")}<span class="count">${ids.length} témat</span></div>
<div class="grid">${ids.map(i => `<button class="tile" data-topic="${i}"><span class="nums">${nums(TOPICS[i])}</span>${esc(TOPICS[i].title)}</button>`).join("")}</div>
</main>
<footer class="bar"><span>${esc(DATA.legend || "S = sportovní obor, V = všeobecný obor")} · ← → výběr tématu, Enter otevřít${DATA.levels ? " · U úroveň B1/B2" : ""} · sestaveno ${esc(DATA.built)}</span><span>${control("blank", "B", "zatemnit")} · ${control("fullscreen", "F", "celá obrazovka")} · ${control("smaller", "−", "menší")} ${control("bigger", "+", "větší")}</span></footer>`;
}

function steps(i) {
  const t = cur();
  if (whole[i]) return 1;
  return [t.vocab.length * 2, t.answer.length, t.questions.length, t.phrases.length * 2][i];
}
function counter() {
  const t = cur();
  const n = [t.vocab.length, t.answer.length, t.questions.length, t.phrases.length][section];
  const info = section === 1 && t.answer_info ? ` · ${esc(t.answer_info)}` : "";
  if (whole[section]) return `${n} ${["slov", "odstavce", "otázek", "frází"][section]}${info}`;
  const k = section === 0 || section === 3 ? Math.floor(pos[section] / 2) : pos[section];
  return `${SECTIONS[section].one} ${k + 1} / ${n}${info}`;
}
// Vocabulary and phrases: an odd step shows the meaning of the item the even step put up, so the class guesses first.
function revealed(k) { return k % 2 === 1; }
function sectionView() {
  const t = cur();
  const p = pos[section];
  if (section === 0) {
    if (whole[0]) return `<ol class="list">${t.vocab.map(v => `<li><span class="term-l">${v.head}</span> – <span class="gloss-l">${v.gloss}</span><br><span class="ex">${v.example}</span></li>`).join("")}</ol>`;
    const v = t.vocab[Math.floor(p / 2)], shown = revealed(p);
    return `<div class="stage"><p class="term">${v.head}</p><div class="rev${shown ? "" : " hid"}"><p class="gloss">${v.gloss}</p><p class="ex">${v.example}</p></div><p class="hint${shown ? " hid" : ""}">→ ukáže význam a příklad</p></div>`;
  }
  if (section === 1) {
    if (whole[1]) return `<div class="alltext">${t.answer.map(a => `<p>${a}</p>`).join("")}</div>`;
    return `<div class="stage"><p class="para">${t.answer[p]}</p></div>`;
  }
  if (section === 2) {
    if (whole[2]) return `<ol class="list">${t.questions.map(q => `<li>${q.cat ? `<span class="qcat">${q.cat}:</span> ` : ""}${q.text}</li>`).join("")}</ol>`;
    const q = t.questions[p];
    return `<div class="stage">${q.cat ? `<p class="qcat">${q.cat}</p>` : ""}<p class="q">${q.text}</p></div>`;
  }
  if (whole[3]) return `<ol class="list">${t.phrases.map(f => `<li>${f.head} – ${f.gloss}${f.note ? ` <span class="note">(${f.note})</span>` : ""}</li>`).join("")}</ol>`;
  const f = t.phrases[Math.floor(p / 2)], shown = revealed(p);
  return `<div class="stage"><p class="phrase">${f.head}</p><div class="rev${shown ? "" : " hid"}"><p class="gloss">${f.gloss}</p>${f.note ? `<p class="note">${f.note}</p>` : ""}</div><p class="hint${shown ? " hid" : ""}">→ ukáže význam</p></div>`;
}
function topicView() {
  const t = cur();
  const tabs = SECTIONS.map((s, i) => `<button data-sec="${i}" aria-pressed="${i === section}"><b>${i + 1}</b> ${s.name}</button>`).slice(0, lastSection() + 1).join("");
  const mode = whole[section] ? "po jednom" : SECTIONS[section].all;
  return `<header class="bar"><h1 class="title"><span class="nums">${nums(t)}</span> ${esc(t.title)}${DATA.levels ? ` <span class="lvl">${t.b1 && level === "b1" ? "B1" : "B2"}</span>` : ""}</h1><span class="ai">${esc(t.label)}</span>${levelButtons()}</header>
<nav class="tabs">${tabs}<span class="sp"></span>${control("whole", "V", mode)}<span class="count">${counter()}</span></nav>
<main>${sectionView()}</main>
<footer class="bar"><span>${control("prev", "←", "zpět")} ${control("next", "→", "další")}</span><span>${control("blank", "B", "zatemnit")} · ${control("fullscreen", "F", "celá obrazovka")} · ${control("smaller", "−", "")}${control("bigger", "+", "")} · ${control("menu", "Esc", "menu")}</span></footer>`;
}

function render() {
  document.body.dataset.view = view;
  document.body.dataset.mode = view === "topic" && !whole[section] ? "one" : "all";
  app.innerHTML = view === "menu" ? menuView() : topicView();
  keepClear();
}
function openTopic(i) {
  current = i; section = 0; pos = [0, 0, 0, 0]; whole = [false, false, false, false];
  view = "topic"; render(); window.scrollTo(0, 0);
}
function toMenu() {
  view = "menu"; render();
  const tile = app.querySelector(`.tile[data-topic="${current}"]`);
  if (tile) { tile.focus(); tile.scrollIntoView({ block: "nearest" }); } else window.scrollTo(0, 0);
}
// A supplement has no phrases: its last section is the questions.
function lastSection() { return cur().phrases.length ? 3 : 2; }
function setSection(i, step) {
  if (i > lastSection()) return;
  section = i;
  if (step != null) pos[i] = step;
  render(); window.scrollTo(0, 0);
}
// A whole list scrolls a screen at a time; at its end → goes on to the next section, at its top ← back.
function scrollStep(dir) {
  const max = root.scrollHeight - window.innerHeight;
  if (dir > 0 ? window.scrollY >= max - 2 : window.scrollY <= 0) return false;
  window.scrollBy(0, dir * window.innerHeight * 0.7);
  return true;
}
function next() {
  if (whole[section] ? scrollStep(1) : pos[section] < steps(section) - 1 && (pos[section]++, true)) {
    if (!whole[section]) { render(); window.scrollTo(0, 0); }
  } else if (section < lastSection()) setSection(section + 1, 0);
}
function prev() {
  if (whole[section] ? scrollStep(-1) : pos[section] > 0 && (pos[section]--, true)) {
    if (!whole[section]) { render(); window.scrollTo(0, 0); }
  } else if (section > 0) setSection(section - 1, steps(section - 1) - 1);
}
function toggleWhole() {
  whole[section] = !whole[section];
  if (!whole[section]) pos[section] = 0;
  render(); window.scrollTo(0, 0);
}
function moveFocus(dir) {
  const tiles = [...app.querySelectorAll(".tile")];
  const k = tiles.indexOf(document.activeElement);
  const target = tiles[k < 0 ? (dir > 0 ? 0 : tiles.length - 1) : (k + dir + tiles.length) % tiles.length];
  target.focus(); target.scrollIntoView({ block: "nearest" });
}

// Browser zoom shrinks the CSS viewport, so text sized in vh alone would not grow with Ctrl + mouse wheel. The
// ratio of devicePixelRatio to its value at load puts the zoom back in; CSS max() keeps the lower bounds.
function applySize() { root.style.setProperty("--z", ((window.devicePixelRatio || 1) / dpr0 * size).toFixed(3)); }
function resize(step) { size = Math.min(2, Math.max(0.8, Math.round(size * 10 + step) / 10)); applySize(); keepClear(); }
// A scroll stops below the sticky header, so the AI label never covers the text.
function keepClear() { root.style.scrollPaddingTop = `${app.querySelector("header").offsetHeight}px`; }
function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else root.requestFullscreen?.().catch(() => {});
}
window.addEventListener("resize", () => { applySize(); keepClear(); });
(function watchResolution() {
  matchMedia(`(resolution: ${window.devicePixelRatio || 1}dppx)`)
    .addEventListener("change", () => { applySize(); watchResolution(); }, { once: true });
})();

const ACTS = {
  next, prev, menu: toMenu, whole: toggleWhole, fullscreen: toggleFullscreen,
  blank: () => { blank.hidden = false; }, smaller: () => resize(-1), bigger: () => resize(1),
};
app.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.topic) openTopic(+b.dataset.topic);
  else if (b.dataset.sec) setSection(+b.dataset.sec);
  else if (b.dataset.filter) { filter = b.dataset.filter; render(); }
  else if (b.dataset.level) setLevel(b.dataset.level);
  else if (ACTS[b.dataset.act]) ACTS[b.dataset.act]();
});
blank.addEventListener("click", () => { blank.hidden = true; });

document.addEventListener("keydown", e => {
  if (!blank.hidden) { blank.hidden = true; e.preventDefault(); return; }  // any key brings the picture back
  if (e.ctrlKey || e.metaKey || e.altKey) return;  // Ctrl + and Ctrl − stay the browser's zoom
  const k = e.key;
  if (k === "b" || k === "B" || k === ".") blank.hidden = false;
  else if (k === "f" || k === "F" || k === "F5") toggleFullscreen();  // a presenter remote's start key sends F5
  else if (k === "+" || k === "=") resize(1);
  else if (k === "-" || k === "_") resize(-1);
  else if ((k === "u" || k === "U") && DATA.levels) setLevel(level === "b1" ? "b2" : "b1");
  else if (view === "menu") {
    if (k === "ArrowRight" || k === "ArrowDown" || k === "PageDown") moveFocus(1);
    else if (k === "ArrowLeft" || k === "ArrowUp" || k === "PageUp") moveFocus(-1);
    else if (k === "Enter" && !document.activeElement?.classList.contains("tile")) moveFocus(1);
    else return;  // Enter or space on a chosen topic opens it as a click does
  } else {
    if (k === "ArrowRight" || k === "PageDown" || k === " " || k === "Enter") next();
    else if (k === "ArrowLeft" || k === "PageUp") prev();
    else if (k.length === 1 && "1234".includes(k)) setSection(+k - 1);
    else if (k === "v" || k === "V") toggleWhole();
    else if (k === "Escape") toMenu();
    else return;
  }
  e.preventDefault();
});

applySize();
render();
</script>
<p class="inkrema-verze"><small>Beta, verze z 19. 11. 2026 (91244b0) · Navrhla AI; u každého tématu je uvedeno, zda ho už schválil učitel</small></p>
</body>
